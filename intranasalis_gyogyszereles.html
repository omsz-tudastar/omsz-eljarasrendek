<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;line-height:1.5;}
.app{max-width:680px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);}

.nb{flex:1;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#14b8a6;}
.ni{font-size:16px;}
.nl{font-size:9px;color:#9ca3af;font-weight:400;}
.nb.act .nl{color:#14b8a6;font-weight:600;}
/* CONTENT */
.ct{padding:1rem;}
/* CARDS */
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}
/* ALERTS */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
.note{font-size:12px;color:#9ca3af;padding:.5rem .75rem;background:#262626;border-radius:8px;margin-bottom:.5rem;line-height:1.5;border:1px solid #333;}
.sub{font-size:13px;font-weight:600;color:#d1d5db;margin:.75rem 0 .35rem;}
ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.2rem;}
.kr{display:flex;gap:8px;align-items:flex-start;padding:.5rem .75rem;background:#064e3b20;border-radius:8px;margin-bottom:5px;font-size:13px;color:#d1d5db;line-height:1.5;border-left:3px solid #14b8a6;}
/* TABLES */
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:6px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:6px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;}
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;border-radius:8px;border:1px solid #3f3f3f;}
/* PROGRESS */
.prog{height:4px;background:#333;border-radius:2px;margin-bottom:1rem;}
.progb{height:4px;border-radius:2px;transition:width .3s;}
/* BUTTONS */
.btn{padding:.55rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;transition:all .15s;}
.btn:hover{background:#374151;}
.btn-g{background:#0d9488;color:#fff;border-color:#0d9488;}
.btn-r{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn-v{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.btn-fw{width:100%;display:block;text-align:center;padding:.75rem;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;text-align:center;}
/* QUIZ OPTIONS */
.opt{width:100%;display:block;padding:.7rem 1rem;margin-bottom:7px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}

.flip{border:2px solid #3f3f3f;border-radius:12px;padding:1.5rem;min-height:175px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:.75rem;background:#262626;}
.flip.on{border-color:#a78bfa;}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* RESULT */
.res-box{border-radius:12px;padding:1rem;text-align:center;margin-top:.75rem;background:#172554;border:1px solid #1e3a8a;}
.res-num{font-size:38px;font-weight:700;}
.res-lbl{font-size:14px;margin:.3rem 0;}

input[type=number]{width:100%;background:transparent;border:1px solid #4b5563;border-radius:8px;padding:8px 12px;color:#e5e7eb;font-family:inherit;background:#2a2a2a;font-size:14px;margin-bottom:10px;}
select{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #4b5563;background:#2a2a2a;font-size:14px;color:#e5e7eb;font-family:inherit;margin-bottom:10px;}
/* TAGS */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.tag-g{background:#064e3b;color:#ecfdf5;}
.tag-y{background:#78350f;color:#fef3c7;}
/* HOME GRID */
.home-mod{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;color:#e5e7eb;}
.home-mod:hover{background:#333;border-color:#4b5563;transform:translateY(-1px);}
.home-mod-icon{font-size:26px;margin-bottom:6px;}
.home-mod-title{font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:2px;}
.home-mod-desc{font-size:11px;color:#9ca3af;}
/* CHAPTER LIST */
.ch-row{display:flex;align-items:center;gap:10px;background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.75rem 1rem;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.ch-row:hover{background:#333;}
/* GLOSSARY */
.gloss{border-bottom:1px dashed #14b8a6;color:#5eead4;cursor:pointer;transition:color .2s;font-weight:600;}
.gloss:hover{color:#14b8a6;}
/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:999;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal-box{background:#1e1e1e;border:1px solid #3f3f3f;border-radius:12px;padding:1.5rem;max-width:400px;width:100%;box-shadow:0 10px 25px rgba(0,0,0,0.5);position:relative;}
.modal-close{position:absolute;top:10px;right:15px;background:none;border:none;color:#9ca3af;font-size:20px;cursor:pointer;}
.modal-title{font-size:16px;font-weight:700;color:#14b8a6;margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:5px;}
.modal-desc{font-size:14px;color:#d1d5db;line-height:1.6;}
</style>
</head>

],summary:'Részletes Összefoglaló (Sim 1 - Gyermek görcs): A helyszínen a tartósan görcsölő gyermeknél a sikertelen/nehéz IV út miatt az intranasalis (in.) gyógyszerelés azonnali alternatívát nyújtott. A B+ kompetenciájú mentőápoló felismerte, hogy a görcs indikációja lehetővé teszi számára a midazolám IN beadását (hasonlóan a rectalis diazepámhoz). A súly becslése a [6+4]*2 = 20 kg képlettel történt. A dózis (0,2 mg/kg) alapján 4 mg hatóanyagra volt szükség, ami az 5 mg/ml-es ampullából 0,8 ml térfogatot jelentett. Az első felszívás miatt a fecskendőbe (0,8 + 0,1 ml holttér) = 0,9 ml-t szívott fel pontosan, a felesleget eltávolítva. A MAD porlasztót menetes csatlakozóval rögzítette. A porlasztás maximum 0,5 ml / orrjárat elvét követve a 0,8 ml bejuttatandó adagot két részletben (0,4 ml - 0,4 ml) porlasztotta be a gyermek orrszárnyai felé célozva. A tüsszentés a beadás után nem igényelt dózismódosítást. 10 perc után a görcs nem szűnt meg, de mivel a szabályzat szerint mentőápoló NEM ismételheti a midazolámot, magasabb szintű segítséget kért, mellőzve a kompetenciáján túli gyógyszerelést.'},

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+b.tx+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+i+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap" style="display:flex;gap:10px;margin-bottom:10px;"><div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#14b8a6;color:#111827;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">'+s.n+'</div><div style="flex:1;background:#262626;border-radius:8px;padding:.5rem .75rem;"><div style="font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:.2rem;">'+s.t+'</div><div style="font-size:12px;color:#9ca3af;line-height:1.6;white-space:pre-line;">'+s.x+'</div></div></div>').join('');
  return '';
}

// ── SCREENS ────────────────────────────────────────────────────────
function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Intranasalis gyógyszerelés</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v2.0 · 2019.10.14.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Eljárásrend','Indikációk, eszközök'],['flash','🃏','Flashkártyák','12 tanulókártya'],['quiz','❓','Kvíz','10 tesztkérdés'],['sim','🚑','Szimuláció','B / B+ Esetek'],['calc','🧮','Kalkulátor','Dózis számítások']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#bbf7d0"><b>Vonatkozik:</b> Az OMSZ valamennyi kivonuló dolgozójára, kompetenciaszintnek megfelelően.</div></div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Eljárásrend</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+c.title+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){
var c=CDATA.find(x=>x.id===id);if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+c.title+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+s.t+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');
}

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+c+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+c+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+card.b+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+card.cat+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+card.f+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+QUIZ[a.qi].q+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+QUIZ[a.qi].opts[a.pi]+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+QUIZ[a.qi].opts[QUIZ[a.qi].ok]+'</div><div style="font-size:11px;color:#9ca3af">'+QUIZ[a.qi].exp+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+q.q+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+opt+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+q.exp+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+s.title+'</div>'+
'<span class="tag '+(s.diff==='B+ kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+s.desc+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+sim.title+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+sim.summary+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+st.sit+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+opt.tx+'</div><div style="font-size:11px;color:#9ca3af">'+opt.fb+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+sim.title+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+sim.desc+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+step.sit+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+opt.tx+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+step.opts[SI.chosen].fb+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function updateCalc() {
  var type = document.getElementById('c_type').value;
  var ageWrap = document.getElementById('c_age_wrap');
  var age = parseFloat(document.getElementById('c_age').value) || 0;
  var w = parseFloat(document.getElementById('c_weight').value) || 0;
  var med = document.getElementById('c_med').value;
  
  if(type === 'child') {
     ageWrap.style.display = 'block';
     if(w === 0 && age > 0) {
        w = (age + 4) * 2;
        document.getElementById('c_weight_calc').innerHTML = '<div style="font-size:12px;color:#a78bfa;margin-bottom:10px">Kalkulált testtömeg: <b>' + w + ' kg</b></div>';
     } else {
        document.getElementById('c_weight_calc').innerHTML = '';
     }
  } else {
     ageWrap.style.display = 'none';
     document.getElementById('c_weight_calc').innerHTML = '';
  }
  
  var res = '';
  if(w > 0) {
     if(med === 'midazolam') {
        var d = w * 0.2;
        if(d > 10) d = 10;
        var vol = d / 5;
        res = '<div class="res-num" style="color:#4ade80">' + d.toFixed(1) + ' mg</div>' +
              '<div style="font-size:13px;color:#d1d5db;margin-bottom:10px">Térfogat (5mg/ml): <b>' + vol.toFixed(2) + ' ml</b> <span style="color:#9ca3af">(+0,1 ml holttér)</span></div>' +
              '<div class="al al-s" style="margin-bottom:0"><b>Kompetencia: B+ ápoló</b><br>Kizárólag görcsroham esetén!<br>2. dózis (felezve): ' + (d/2).toFixed(1) + ' mg (' + (vol/2).toFixed(2) + ' ml)<br>Mentőápoló NEM ismételheti!</div>';
     } else if(med === 'fentanil') {
        var d1 = w * 1;
        var d2 = w * 2;
        if(d1 > 100) d1 = 100;
        if(d2 > 100) d2 = 100;
        var txt = d1 === d2 ? d1 + ' µg' : d1 + ' - ' + d2 + ' µg';
        var v1 = d1 / 50; var v2 = d2 / 50;
        var vtxt = v1 === v2 ? v1.toFixed(2) + ' ml' : v1.toFixed(2) + ' - ' + v2.toFixed(2) + ' ml';
        res = '<div class="res-num" style="color:#fde68a">' + txt + '</div>' +
              '<div style="font-size:13px;color:#d1d5db;margin-bottom:10px">Térfogat (50µg/ml): <b>' + vtxt + '</b> <span style="color:#9ca3af">(+0,1 ml holttér)</span></div>' +
              '<div class="al al-d" style="margin-bottom:0"><b>Csak Orvos / Mentőtiszt adhatja!</b><br>Max egyszeri dózis: 100 µg.</div>';
     } else if(med === 'naloxon') {
        var dn = w * 0.05;
        var vn = dn / 0.4;
        res = '<div class="res-num" style="color:#60a5fa">' + dn.toFixed(2) + ' mg</div>' +
              '<div style="font-size:13px;color:#d1d5db;margin-bottom:10px">Térfogat (0,4mg/ml): <b>' + vn.toFixed(2) + ' ml</b></div>' +
              '<div class="al al-d" style="margin-bottom:0"><b>Csak Orvos / Mentőtiszt adhatja!</b><br>Alternatív számítás: 8 ttkg-onként 1 ml.</div>';
     }
  } else {
     res = '<div style="font-size:13px;color:#9ca3af">Kérjük, adjon meg érvényes testtömeget (vagy életkort gyermek esetén).</div>';
  }
  document.getElementById('c_res').innerHTML = res;
}

function renderCalc(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">IN Dózis Kalkulátor</h2>'+
'<div class="card">'+
'<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:4px">Gyógyszer</div>'+
'<select id="c_med" onchange="updateCalc()">'+
'<option value="midazolam">Midazolám (5 mg/ml)</option>'+
'<option value="fentanil">Fentanil (50 µg/ml)</option>'+
'<option value="naloxon">Naloxon (0,4 mg/ml)</option>'+
'</select>'+
'<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:4px">Beteg típusa</div>'+
'<select id="c_type" onchange="updateCalc()">'+
'<option value="child">Gyermek</option>'+
'<option value="adult">Felnőtt</option>'+
'</select>'+
'<div id="c_age_wrap">'+
'<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:4px">Életkor (év)</div>'+
'<input type="number" id="c_age" min="1" max="14" placeholder="Kalkulációhoz..." oninput="updateCalc()">'+
'</div>'+
'<div id="c_weight_calc"></div>'+
'<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:4px">Testtömeg (kg) - opcionális, ha a kor megadva</div>'+
'<input type="number" id="c_weight" min="1" placeholder="Pontos kg..." oninput="updateCalc()">'+
'<div class="res-box" id="c_res"><div style="font-size:13px;color:#9ca3af">Kérjük, adjon meg érvényes testtömeget (vagy életkort gyermek esetén).</div></div>'+
'</div>';
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc') { c.innerHTML=renderCalc(); setTimeout(updateCalc, 50); }
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
