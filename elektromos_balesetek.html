<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ - Elektromos Balesetek Eljárásrend</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;overflow-x:hidden;}
.app{max-width:720px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);position:relative;}

/* NAV */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.nb{flex:1;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#f59e0b;}
.ni{font-size:16px;}
.nl{font-size:9px;color:#9ca3af;font-weight:400;}
.nb.act .nl{color:#f59e0b;font-weight:600;}

/* CONTENT & CARDS */
.ct{padding:1rem;}
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}

/* ALERTS & LISTS */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
.sub{font-size:14px;font-weight:700;color:#d1d5db;margin:.85rem 0 .45rem;}
ul.bl{margin:0 0 .75rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.3rem;}
.step-wrap{display:flex;gap:10px;margin-bottom:12px;}
.step-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#f59e0b;color:#111827;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.step-body{flex:1;background:#262626;border-radius:8px;padding:.65rem .85rem;border:1px solid #3f3f3f;}
.step-t{font-size:13px;font-weight:700;color:#f3f4f6;margin-bottom:.3rem;}
.step-x{font-size:13px;color:#cbd5e1;line-height:1.6;white-space:pre-line;}

/* GLOSSARY TOOLTIP */
.gloss{color:#fcd34d;border-bottom:1px dashed #fcd34d;cursor:help;font-weight:600;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal{background:#2a2a2a;border:1px solid #4b5563;border-radius:12px;padding:1.5rem;max-width:400px;width:100%;box-shadow:0 10px 25px rgba(0,0,0,.5);position:relative;}
.modal-title{font-size:16px;font-weight:700;color:#f59e0b;margin-bottom:.5rem;border-bottom:1px solid #3f3f3f;padding-bottom:.5rem;}
.modal-body{font-size:14px;color:#e5e7eb;line-height:1.6;margin-bottom:1rem;}
.modal-close{background:#4b5563;color:#fff;border:none;padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-weight:600;width:100%;}

/* QUIZ / SIM OPTIONS */
.opt{width:100%;display:block;padding:.85rem 1rem;margin-bottom:8px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}

/* BUTTONS & MISC */
.btn{padding:.65rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:14px;font-weight:600;color:#e5e7eb;font-family:inherit;}
.btn:hover{background:#374151;}
.btn-g{background:#d97706;color:#fff;border-color:#b45309;}
.btn-g:hover{background:#b45309;}
.btn-fw{width:100%;display:block;text-align:center;}
.prog{height:5px;background:#333;border-radius:3px;margin-bottom:1.2rem;}
.progb{height:5px;border-radius:3px;transition:width .3s;background:#f59e0b;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.home-mod{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1.2rem;cursor:pointer;text-align:left;color:#e5e7eb;transition:all .2s;}
.home-mod:hover{background:#333;border-color:#f59e0b;transform:translateY(-2px);}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:12px;font-weight:700;}
.tag-b{background:#1e3a8a;color:#bfdbfe;}
.tag-bp{background:#701a75;color:#fbcfe8;}

input[type=number], select{width:100%;padding:10px;border-radius:8px;border:1px solid #4b5563;background:#1e1e1e;color:#e5e7eb;font-family:inherit;font-size:14px;margin-bottom:1rem;}
</style>
</head>
<body>
<div class="app">
<nav class="nav" id="nav">
<button class="nb act" onclick="go('home')"><span class="ni">⚡</span><span class="nl">Főoldal</span></button>
<button class="nb" onclick="go('chapters')"><span class="ni">📖</span><span class="nl">Eljárásrend</span></button>

</nav>
<div class="ct" id="ct"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeGloss()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="mTitle">Szó</div>
    <div class="modal-body" id="mBody">Jelentés</div>
    <button class="modal-close" onclick="closeGloss()">Bezárás</button>
  </div>
</div>

<script>
// --- DICTIONARY ---
const DICT = {
  "patomechanizmus": "A betegség vagy kóros állapot kialakulásának folyamata, mechanizmusa.",

  "kompartment-szindróma": "Zárt izomrekeszekben (fascia által határolt terekben) a nyomás fokozódása oedema miatt, ami elzárja a vérkeringést és szövetelhaláshoz vezet.",

function showGloss(e, word) {
  e.stopPropagation();
  document.getElementById('mTitle').innerText = word.charAt(0).toUpperCase() + word.slice(1);
  document.getElementById('mBody').innerText = DICT[word] || "Nincs adat.";
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeGloss() {
  document.getElementById('modalOverlay').style.display = 'none';
}
function gl(w) { return `<span class="gloss" onclick="showGloss(event, '${w}')">${w}</span>`; }

// --- DATA ---
var SCR='home', CHID=null;
var FC={idx:0,flip:false};

      'A beteg vizsgálata, ellátása, nemzetközi irányelvek adaptációja az OMSZ számára.',

    ]}
  ]},
  {t:'II. Bevezetés és Alapfogalmak', bk:[
    {tp:'bl', items:[
      'Az elektromos balesetek az összes mentőfeladat kb. 0,1%-át teszik ki, ezek 1%-a halálos.',

      '1 kV-tól (1000 V): Nagyfeszültség. Az áldozatot MEGKÖZELÍTENI SEM SZABAD! Elektromos ív húzódhat, műszaki mentés kell.',
      'Törpefeszültség általában ártalmatlan (de pl. vezetékes telefon csengetésekor 70-90V váltófeszültség keletkezik, nedves kövön állva ez is életveszélyes lehet).'
    ]}
  ]}

{id:'diag', title:'III. Diagnózis és IV. Differenciáldiagnózis', icon:'🩺', secs:[

    {tp:'al', lv:'d', tx:'ELSŐ LÉPÉS: Helyszín veszélyességének felmérése! Tisztázni a feszültség maximumát és hogy az áldozat feszültség alatt áll-e.'},

    ]}
  ]}
]},
{id:'ellatas', title:'VI. Vizsgálat és VII. Szállítás', icon:'🚑', secs:[
  {t:'VI. Betegvizsgálat, azonnali teendők (MINDEN mentőegységnek)', bk:[

  {t:'VII. Ellátás utáni teendők (Kórházba szállítás indokolt)', bk:[

  {f:'Mit jelent a kisfeszültség és nagyfeszültség határa?', b:'1000 V (1 kV) az elválasztó. 1000V alatt kisfeszültség, 1000V felett nagyfeszültség. Nagyfeszültség esetén az áldozatot megközelíteni sem szabad áramtalanításig!'},

    {sit:'A defibrillátor "sokkolandó ritmust" mond (VF). Sokk leadva. Mi a teendő a sokk után?', opts:[
      {tx:'Azonnal folytatom a mellkasi kompressziót 2 percig.', ok:true, fb:'Helyes! Sokk után ritmusvizsgálat nélkül 2 perc CPR jön.'},
      {tx:'Megnézem a pupilláit, hogy reagálnak-e.', ok:false, fb:'Hibás! Áramütésnél a pupillák tágak és fénymerevek lehetnek a behatástól függetlenül is.'}
    ]},
    {sit:'Sikeres újraélesztés (ROSC). A beteg lélegzik. "C" vizsgálat során keresed az áramütés helyét. Mit keresel?', opts:[
      {tx:'Subcutan emphysemát.', ok:false, fb:'Hibás! Az PTX-re utal.'},
      {tx:'Áramjegyet a kezén és a talpán (földelődés pontja).', ok:true, fb:'Helyes! A be- és kilépési pontokon áramjegy vagy égés alakulhat ki.'}
    ]},
    {sit:'A beteg kezd magához térni. "E" vizsgálat alatt EKG készül. Kötelező ez?', opts:[
      {tx:'Igen, 12-elvezetéses EKG minden áramütöttnél kötelező.', ok:true, fb:'Helyes! Eltéréseket, ritmuszavarokat okozhat a váltóáram.'},
      {tx:'Nem, ha már ébren van, nem kell EKG.', ok:false, fb:'Hibás! A protokoll kötelezővé teszi.'}
    ]},
    {sit:'Az EKG sinus tachycardiát mutat. A beteg panaszmentes. Szállítandó kórházba?', opts:[
      {tx:'Igen, mivel eszméletvesztése volt, CPR történt, kórházi ellátás/megfigyelés indokolt.', ok:true, fb:'Helyes! Az eljárásrend egyértelműen kórházba szállítást ír elő ilyenkor.'},
      {tx:'Nem, otthon maradhat saját felelősségre.', ok:false, fb:'Hibás! Mentőápoló sosem hagyhat helyszínen beteget, és az indikáció is egyértelmű a szállításra.'}
    ]},
    {sit:'A szállítás alatt milyen izomkárosodásra utaló, később kialakuló szövődményre kell számítani?', opts:[
      {tx:'Cataracta.', ok:false, fb:'Hibás! Az villámcsapásnál fordul elő, lencsehomály.'},
      {tx:'Rhabdomyolysis és veseelégtelenség.', ok:true, fb:'Helyes! A tartós tetániás görcs vagy mély szöveti károsodás izomszétesést okozhat.'}
    ]},
    {sit:'Milyen kompetencia szinten láttad el a beteget gyógyszer nélkül?', opts:[
      {tx:'ALS kompetencia.', ok:false, fb:'Hibás! ALS orvosi/tiszti szint.'},
      {tx:'B kompetencia (BLS-AED).', ok:true, fb:'Helyes! Eszközös légút (OPA/maszk), kompresszió és AED a B kompetencia része.'}
    ]}
  ],
  summary:'A 230V-os balesetnél a helyszínbiztonság (áramtalanítás) az első. Mivel a beteg nem lélegzett, B kompetenciával azonnali CPR-t és AED-t alkalmaztunk. A sokk után folytatott CPR sikeres volt. Az áramjegyek keresése és a kötelező 12-elvezetéses EKG megtörtént. Az eszméletvesztés és ritmuszavar miatt a kórházba szállítás kötelező, figyelve a későbbi rhabdomyolysis kialakulásának veszélyére.'
},
{
  id:2, title:'2. Szituáció: Nagyfeszültség és leszakadt vezeték', diff:'B+ kompetencia',
  desc:'Egy teherautó 20 kV-os távvezeték oszlopának ütközött. A vezeték leszakadt, a fülkére esett. A sofőr bent ül. B+ kompetencia.',
  steps:[
    {sit:'Megérkezel. A leszakadt távvezeték szikrázik az autón. Mi az első teendő?', opts:[
      {tx:'Megközelítem és kinyitom az ajtót, hogy kimentsem a sofőrt.', ok:false, fb:'Hibás! Nagyfeszültség esetén 15 méteren belül TILOS megközelíteni.'},
      {tx:'Megállok 15 méternél messzebb. Műszaki mentést és áramszolgáltatót kérek (feszültségmentesítés).', ok:true, fb:'Helyes! Nagyfeszültség (>1000V) esetén az áramütés és ívelés veszélye miatt szigorú távolságtartás kell.'}
    ]},
    {sit:'A sofőr ki akar szállni. Mit kiabálsz neki?', opts:[
      {tx:'"Nyissa ki az ajtót és fusson minél gyorsabban!"', ok:false, fb:'Hibás! A normál lépés/futás halálos lépésfeszültséget generálhat.'},
      {tx:'"Maradjon a fülkében, ne szálljon ki!"', ok:true, fb:'Helyes! Amíg nincs tűz vagy kényszerítő körülmény, az autó belseje relatíve védett (Faraday-kalitka).'}
    ]},
    {sit:'Az autó kigyullad! A sofőrnek menekülnie kell. Mi a helyes instrukció?', opts:[
      {tx:'"Ugorjon ki összezárt lábbal úgy, hogy ne érjen a kocsihoz, majd páros lábbal ugrálva távolodjon 15 méterre!"', ok:true, fb:'Helyes! Ez az egyetlen mód a lépésfeszültség elkerülésére (vagy az 5 cm-es csoszogás).'},
      {tx:'"Másszon le lassan, egyik kezével fogja az ajtót!"', ok:false, fb:'Hibás! Ha egyszerre érinti a földet és az autót, áramkörré válik.'}
    ]},
    {sit:'A beteg sikeresen kiugrált. A ruhája egy része megégett, a lábán mély égések. Áramszolgáltató lekapcsolt. ABCDE. "A" és "B" rendben. Vérnyomás 90/60 Hgmm. B+ kompetencia mit tesz?', opts:[
      {tx:'Vénabiztosítás, és bőséges (1 l/h) folyadékpótlás megkezdése a rhabdomyolysis megelőzésére.', ok:true, fb:'Helyes! B+ szinten véna biztosítható. Nagyfeszültség/mély égés esetén az eljárásrend 1 liter/óra folyadékot javasol felnőttnek.'},
      {tx:'Csak száraz kötéssel betakarom, folyadékot nem adhatok.', ok:false, fb:'Hibás! A B+ kompetencia lehetővé teszi a volumterápiát.'}
    ]},
    {sit:'Milyen speciális eltérést fogsz keresni a beteg megtekintése során, ami belső szöveti nyomásfokozódásra utal (a mély égések/izomduzzanat miatt)?', opts:[
      {tx:'Kompartment-szindrómát (végtag feszülése, sápadtsága, pulzushiány).', ok:true, fb:'Helyes! Az eljárásrend is nevesíti ezt a veszélyt nagy áramütéseknél.'},
      {tx:'Pupillatágulatot.', ok:false, fb:'Hibás! Az nem ehhez kötődik.'}
    ]},
    {sit:'Mi a teendő a kötelező EKG vizsgálattal?', opts:[
      {tx:'Súlyos égés miatt elhagyható, időveszteség.', ok:false, fb:'Hibás! Nagyfeszültségű behatásnál kötelező.'},
      {tx:'Mielőbb elvégzem (12 elvezetéses EKG), ritmuszavart keresve.', ok:true, fb:'Helyes! A szívkárosodás felmérése elengedhetetlen.'}
    ]},
    {sit:'A beteg eszméletén van. Melyik fájdalomcsillapító beavatkozás alkalmazható B+ kompetencián?', opts:[
      {tx:'A protokollnak/orvosi utasításnak megfelelő analgézia adása iv.', ok:true, fb:'Helyes! B+ szinten megfelelő protokoll mentén alkalmazható fájdalomcsillapító.'},
      {tx:'Altatás.', ok:false, fb:'Hibás! Altatást csak orvos/mentőtiszt (ALS) végezhet.'}
    ]},
    {sit:'Szállítás indokolt-e és hová?', opts:[
      {tx:'Csak háziorvoshoz, mert a beteg tudatánál van.', ok:false, fb:'Hibás! Súlyos, nagyfeszültségű áramütött.'},
      {tx:'Égési és/vagy traumatológiai SBO-ra azonnali szállítás indokolt (>1000V, égés, izomkárosodás).', ok:true, fb:'Helyes! A nagyfeszültség miatt kritikus beteg.'}
    ]},
    {sit:'Melyik szerveket károsíthatja még a nagyfeszültség (amiről a kórházat tájékoztatni kell)?', opts:[
      {tx:'Csak a szívet.', ok:false, fb:'Hibás! Az áram minden szerven áthaladhat.'},
      {tx:'Vese (rhabdomyolysis miatt), artériák (trombózis), agy (stroke), bél (ischaemia).', ok:true, fb:'Helyes! Az áramút mentén szinte bármelyik szerv károsodhat.'}
    ]},
    {sit:'A helyszínen maradt utas (aki bent volt a lekapcsolásig) panaszmentes. Elengedhető?', opts:[
      {tx:'Nem, >400V (jelenleg 20kV) esetén kórházi megfigyelés mindenképpen indokolt.', ok:true, fb:'Helyes! Az eljárásrend szerint 400V felett minden érintett kórházba szállítandó.'},
      {tx:'Igen, ha nincs áramjegye.', ok:false, fb:'Hibás! A feszültség mértéke kizárja a helyszínen hagyást.'}
    ]}
  ],
  summary:'A 20 kV-os nagyfeszültségű balesetnél a legfontosabb a saját biztonság (15 méteres távolság megtartása). A fülkében lévőknek bent kellett maradniuk, a tűz miatt azonban ugrálva (lépésfeszültség elkerülése) kellett távozni. A beteg ellátásakor (B+ kompetencia) vénabiztosítás, és az izomkárosodás/égés miatti emelt (1L/h) folyadékpótlás indult. Az EKG kötelező volt. A rhabdomyolysis és a kompartment-szindróma felismerése kritikus. Nagyfeszültség esetén panaszmentes érintetteket is kórházba kell szállítani.'
},
{
  id:3, title:'3. Szituáció: Villámcsapás tömeges baleset', diff:'B+ kompetencia',
  desc:'Kirándulók (3 fő) egy fa alá húzódtak zivatarban. A fába villám csapott. B+ kompetencia, segélykocsi úton.',
  steps:[
    {sit:'Megérkezel. A vihar még tart. Mi a helyszínbiztonsági szempont?', opts:[
      {tx:'Exponált helyszínen újabb villámcsapás fenyegethet, ezért a betegeket és magunkat biztonságos területre kell vonni.', ok:true, fb:'Helyes! A villám kétszer is becsaphat ugyanoda, a biztonság az első.'},
      {tx:'Azonnal odarohanok a fa alá.', ok:false, fb:'Hibás! Veszélyezteted a saját életedet.'}
    ]},
    {sit:'Triage (osztályozás) szükséges. Beteg A: eszméletlen, nem lélegzik. Beteg B: zavart, jajgat. Beteg C: várandós nő, sír, lábra tud állni. Kivel kezded az ellátást?', opts:[
      {tx:'Beteg B-vel, mert ő hangot ad.', ok:false, fb:'Hibás! Normál triage-nál így lenne, de villámcsapásnál más a szabály.'},
      {tx:'Beteg A-val (aki nem lélegzik), mert villámcsapás esetén REVERZ triage-t alkalmazunk.', ok:true, fb:'Helyes! A klinikai halottnak tűnő betegek ált. reverzibilis ritmuszavarban (kamrafibrilláció, asystolia) szenvednek, korai CPR-ral megmenthetők.'}
    ]},
    {sit:'Beteg A: A légzés hiányzik. Veszélyes megérinteni a villámcsapott beteget?', opts:[
      {tx:'Igen, statikus töltés maradhat rajta.', ok:false, fb:'Hibás! Ez egy tévhit.'},
      {tx:'Nem, a bekövetkezett villámcsapás után az áldozat érintése veszélytelen.', ok:true, fb:'Helyes! Azonnal megkezdhető az ellátás és a CPR.'}
    ]},
    {sit:'CPR kezdése Beteg A-nál. A pupillái tágak és fénymerevek. Ez mit jelent ebben az esetben?', opts:[
      {tx:'Hogy az újraélesztés reménytelen, agyhalott.', ok:false, fb:'Hibás! Az eljárásrend kifejezetten kitér erre.'},
      {tx:'Nem szabad a pupillákra hagyatkozni az abbahagyásnál, mert az elektromos behatás önmagában is tág, fénymerev pupillákat okoz.', ok:true, fb:'Helyes! Ez speciális megfontolás elektromos baleseteknél.'}
    ]},
    {sit:'AED csatlakoztatva. A ritmus asystolia. Van esély a túlélésre?', opts:[
      {tx:'Igen, asystoliás betegek esetén is van esély túlélésre elektromos baleset/villámcsapás esetén.', ok:true, fb:'Helyes! Folytatni kell a CPR-t és az emelt szintű lépéseket.'},
      {tx:'Nem, asystoliánál abba kell hagyni.', ok:false, fb:'Hibás! Az eljárásrend biztat a folytatásra.'}
    ]},
    {sit:'Beteg B vizsgálata: Zavarodott, a dobhártyája vérzik. Ez miért alakul ki?', opts:[
      {tx:'A villámcsapás okozta hatalmas akusztikus és lökéshullám (durva mechanikai károsodás) dobhártyarepedést okozhat.', ok:true, fb:'Helyes! Akut halláskárosodással és egyensúlyzavarral járhat.'},
      {tx:'A feje beütése miatt.', ok:false, fb:'Hibás! Bár lehetséges, a tipikus ok a villám lökéshulláma.'}
    ]},
    {sit:'Beteg B bőrén furcsa, páfrányszerű piros rajzolat látható. Mi ez?', opts:[
      {tx:'Villámrajzolat (Lichtenberg-féle ábra), ami a villámcsapás specifikus jele a bőrön.', ok:true, fb:'Helyes! Ez segít a diagnózisban, ha nincs szemtanú.'},
      {tx:'Ételallergia kiütése.', ok:false, fb:'Hibás.'}
    ]},
    {sit:'Beteg C (várandós) panaszmentes. Szükséges kórházba vinni?', opts:[
      {tx:'Nem, megnyugodhat és hazamehet.', ok:false, fb:'Hibás! Várandósoknál komoly rizikók vannak.'},
      {tx:'Igen, kórházba (nőgyógyászat) kell szállítani, mert ritmuszavarok, spontán vetélés, vagy lepényleválás fordulhat elő tünetmentesség esetén is.', ok:true, fb:'Helyes! Az eljárásrend kötelezővé teszi a magzati és nőgyógyászati vizsgálatot.'}
    ]},
    {sit:'Mi a teendő a folyadékpótlással Beteg B-nél, akinél jelentős (mély) égési sebeket találsz? (B+ szint)', opts:[
      {tx:'Iv. véna biztosítása és 1 l/óra folyadékpótlás kezdése.', ok:true, fb:'Helyes! A jelentős lágyrészsérülés indokolja a bőségesebb folyadékot.'},
      {tx:'Nem adok folyadékot.', ok:false, fb:'Hibás! B+ szinten ez kötelező feladat.'}
    ]},
    {sit:'Később, hetek/hónapok múlva milyen szemészeti szövődményre kell figyelmeztetni a túlélőket?', opts:[
      {tx:'Vakság.', ok:false, fb:'Hibás, túl általános.'},
      {tx:'Cataracta (szürkehályog) kialakulása.', ok:true, fb:'Helyes! Ez a villámcsapás jellemző késői szövődménye.'}
    ]}
  ],
  summary:'Villámcsapás tömeges balesetnél az ellátók biztonsága az első (újabb villámcsapás kerülése). A triage szabályok megfordulnak: a reverz triage értelmében a halottnak tűnő, eszméletlen áldozatok (kamrafibrilláció, asystolia) kapnak elsőbbséget az azonnali CPR miatt. A pupillatágulat nem mérvadó a lemondáshoz. A villámcsapás dobhártyarepedést, villámrajzolatot és hónapok múlva cataractát (szürkehályogot) okozhat. A panaszmentes várandós beteget is kötelező kórházba szállítani a magzati halálozás/lepényleválás kockázata miatt.'
},
{
  id:4, title:'4. Szituáció: Elektromos autó és Gyermek', diff:'B kompetencia',
  desc:'Súlyos karambol, egy modern elektromos (EV) autó érintett. Az autóban egy felnőtt sofőr és egy gyermek ül. B kompetencia.',
  steps:[
    {sit:'Kiszállás a helyszínen. Az elektromos autó roncsolt. Mi a legfontosabb járműspecifikus biztonsági teendő a mentésirányítás/eljárásrend alapján?', opts:[
      {tx:'A nagyfeszültségű akkumulátor leválasztása flexszel.', ok:false, fb:'Hibás! Ezt csak tűzoltó végezheti, és életveszélyes.'},
      {tx:'Az autó "indítókulcsát" legalább 5 méterre eltávolítani a járműtől az "alvó autó" véletlen indításának megelőzésére.', ok:true, fb:'Helyes! Ez az első teendők egyike.'}
    ]},
    {sit:'Az utastérbe tekintve MILYEN színű kábelektől kell szigorúan távol maradni, mert nagyfeszültséget vezetnek?', opts:[
      {tx:'Zöld-sárga.', ok:false, fb:'Hibás! Az a háztartási földelés.'},
      {tx:'Narancssárga.', ok:true, fb:'Helyes! Az ipari standard szerint a nagyfeszültségű rendszer elemei narancsszínűek (gyakran 400V vagy 800V DC).'}
    ]},
    {sit:'A felnőtt sofőr jól van, de elmondja, hogy a gyermek a karambol előtt (otthon) megrágta a telefon töltőkábelét (törpefeszültség). Vizsgálod a gyereket (ABCDE). Égést találsz a szája körül. Miért veszélyes ez különösen gyermekeknél?', opts:[
      {tx:'Mert elfertőződik.', ok:false, fb:'Hibás! Bár igaz, de van egy azonnali életveszélyes anatómiai ok.'},
      {tx:'Az égés helyén a labialis artériák a sérülést követő napokban életveszélyes vérzést okozhatnak.', ok:true, fb:'Helyes! Az eljárásrend külön kiemeli ezt a pediátriai specifikumot.'}
    ]},
    {sit:'A gyermek sír, vitális paraméterei stabilak. Az EKG elvégzése B kompetencián szükséges a gyermeknél?', opts:[
      {tx:'Igen, az áramütés miatt a 12-elvezetéses EKG minden esetben kötelező vizsgálat.', ok:true, fb:'Helyes! Ritmuszavarok keresése kötelező.'},
      {tx:'Nem, mert csak a száját érte az áram.', ok:false, fb:'Hibás! Az áramút sosem biztos.'}
    ]},
    {sit:'Az autó feszültségmentesítésére kell törekedned a mentés alatt. Hol teszed ezt normál esetben?', opts:[
      {tx:'Az erre szolgáló biztonsági kapcsolóval, ha azonosítható (és ha az autó nem kapcsolt le automatikusan ütközéskor).', ok:true, fb:'Helyes! Bár az újabb modellek automatikusan lekapcsolnak, manuálisan is ellenőrizni kell.'},
      {tx:'A narancssárga kábel elvágásával.', ok:false, fb:'Hibás! Halálos áramütést szenvedhetsz.'}
    ]},
    {sit:'A sofőr kéri, hogy csak a gyereket vidd be, ő otthon marad. A sofőr csak enyhe áramütés-élményt érzett kiszálláskor, amikor a ruhája hozzáért a fémhez. Melyik "speciális megfontolás" érvényesülhet itt?', opts:[
      {tx:'Ez valószínűleg statikus elektromosság kisülése volt az emberi testen keresztül, ami áramütés-élményt kelt, de normál esetben nem károsít.', ok:true, fb:'Helyes! Ez gyakori autóknál és ártalmatlan.'},
      {tx:'Ez biztosan a nagyfeszültségű akksi hibája volt.', ok:false, fb:'Hibás! A kasztni rázása ált. statikus töltés.'}
    ]},
    {sit:'Végül mi a döntés a sofőr (statikus áramütés) és a gyermek (kábelrágás) kórházba szállításáról?', opts:[
      {tx:'Mindkettőt a helyszínen hagyom.', ok:false, fb:'Hibás.'},
      {tx:'A gyermeket kórházba kell szállítani (gyermekek áramütése mindig indikáció), a sofőr statikus szikra esetén, ha teljesen panasz/tünetmentes és negatív az EKG, saját felelősségre (orvosi/tiszti jóváhagyással) maradhat.', ok:true, fb:'Helyes! A gyermeket kötelező bevinni a labialis artéria vérzésveszélye és kora miatt.'}
    ]},
    {sit:'Mit tegyél a gyermek száj körüli égésével a szállítás alatt?', opts:[
      {tx:'Kenőcsöt teszek rá.', ok:false, fb:'Hibás! Prehospitálisan steril kötés javasolt, tilos krémezni.'},
      {tx:'Steril gézlapos fedést (száraz kötést) helyezek fel.', ok:true, fb:'Helyes! Az ABCDE protokoll égésellátási része alapján.'}
    ]},
    {sit:'A mentésirányítás szerint milyen P-szintű riasztást igényelt ez az esemény eredetileg?', opts:[
      {tx:'P3 (nem sürgős).', ok:false, fb:'Hibás.'},
      {tx:'P1 riasztás (baleset, áramütés gyanúja elektromos járművel).', ok:true, fb:'Helyes! Elektromos balesetek bejelentése mindig P1.'}
    ]},
    {sit:'Ha az elektromos autóból szivárgást (folyadék/gáz) észlelsz, ami szikrázik, mi a veszély?', opts:[
      {tx:'Kellemetlen szag.', ok:false, fb:'Hibás!'},
      {tx:'Robbanásveszély (a statikus szikra is képes éghető gázt/gőzt berobbantani). Eltávolodás szükséges!', ok:true, fb:'Helyes! Az eljárásrend külön említi a robbanásveszélyt gáz/gőz jelenlétében.'}
    ]}
  ],
  summary:'Hibrid/elektromos autók baleseténél a narancssárga kábelek jelzik a nagyfeszültséget (akár 400-800V DC). A véletlen indítás ("alvó autó") megelőzésére a kulcsot legalább 5 méterre el kell vinni. A kisgyermek kábelrágásos sérülésénél (száj körüli égés) a 12-elvezetéses EKG kötelező, és a beteget kórházba kell vinni, mert a labialis artériák napokkal később életveszélyes vérzést okozhatnak. Statikus elektromosság kisülése is okozhat áramütés-élményt, ami önmagában ártalmatlan, de gázos környezetben robbanásveszélyes.'
}
];

// --- RENDERERS ---
function renderHome() {
  return `
    <h2 style="font-size:20px;font-weight:700;margin-bottom:1rem;color:#f59e0b">Elektromos balesetek prehospitális ellátása</h2>
    <div style="font-size:13px;color:#9ca3af;margin-bottom:1rem">Szabványos Eljárásrend (v1.0/2023.02.20.)</div>
    <div class="g2">
      <button class="home-mod" onclick="go('chapters')"><div style="font-size:24px">📖</div><div style="font-weight:700;margin-top:5px">Eljárásrend</div><div style="font-size:11px;color:#9ca3af">A teljes szöveg és protokoll</div></button>
      <button class="home-mod" onclick="go('flash')"><div style="font-size:24px">🃏</div><div style="font-weight:700;margin-top:5px">Flashkártyák</div><div style="font-size:11px;color:#9ca3af">Gyors ismétlés</div></button>
      <button class="home-mod" onclick="go('sim')"><div style="font-size:24px">🚑</div><div style="font-weight:700;margin-top:5px">Szimulációk</div><div style="font-size:11px;color:#9ca3af">4 interaktív eset (B/B+)</div></button>
      <button class="home-mod" onclick="go('calc')"><div style="font-size:24px">🧮</div><div style="font-weight:700;margin-top:5px">Kalkulátor</div><div style="font-size:11px;color:#9ca3af">Égési folyadék & Feszültség</div></button>
    </div>
    <div class="card" style="margin-top:1rem;background:#1e3a8a20;border-color:#1e3a8a">
      <div style="font-size:12px;color:#bfdbfe">Kattints a sárga, szaggatott vonallal aláhúzott <span class="gloss" onclick="showGloss(event,'kamrafibrilláció')">kifejezésekre</span> a pontos definícióért!</div>
    </div>
  `;
}

function renderChapters() {
  let h = `<h2 style="font-size:20px;font-weight:700;margin-bottom:1rem;">Eljárásrend fejezetei</h2>`;
  CDATA.forEach(c => {
    h += `<button class="card-btn" onclick="go('chapter','${c.id}')">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="font-size:24px">${c.icon}</div>
              <div style="font-weight:700">${c.title}</div>
            </div>
          </button>`;
  });
  return h;
}

function renderChapter(id) {
  let c = CDATA.find(x => x.id === id);
  let h = `<button class="btn" style="margin-bottom:1rem;background:#3f3f3f" onclick="go('chapters')">Vissza a fejezetekhez</button>`;
  h += `<h2 style="font-size:20px;font-weight:700;margin-bottom:1rem;color:#f59e0b">${c.icon} ${c.title}</h2>`;
  
  c.secs.forEach(s => {
    h += `<div class="card"><div class="sub" style="color:#f59e0b">${s.t}</div>`;
    s.bk.forEach(b => {
      if(b.tp==='bl'){
        h += `<ul class="bl">` + b.items.map(i=>`<li>${i}</li>`).join('') + `</ul>`;
      } else if(b.tp==='al'){
        h += `<div class="al al-${b.lv}">${b.tx}</div>`;
      } else if(b.tp==='sub'){
        h += `<div class="sub">${b.tx}</div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}

function renderFlash() {
  let card = CARDS[FC.idx];
  let h = `<h2 style="font-size:20px;font-weight:700;margin-bottom:1rem;">Flashkártyák</h2>`;
  h += `<div style="text-align:center;font-size:12px;color:#9ca3af;margin-bottom:.5rem">${FC.idx+1} / ${CARDS.length}</div>`;
  
  h += `<div class="card" style="min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:2px solid ${FC.flip?'#f59e0b':'#3f3f3f'};background:#262626" onclick="FC.flip=!FC.flip;render()">`;
  if(!FC.flip) {
    h += `<div><div style="font-size:11px;color:#f59e0b;font-weight:700;margin-bottom:10px">KÉRDÉS</div><div style="font-size:16px;font-weight:600">${card.f}</div><div style="font-size:11px;color:#9ca3af;margin-top:15px">Kattints a válaszért</div></div>`;
  } else {
    h += `<div><div style="font-size:11px;color:#4ade80;font-weight:700;margin-bottom:10px">VÁLASZ</div><div style="font-size:15px;color:#d1d5db;line-height:1.6">${card.b}</div></div>`;
  }
  h += `</div>`;
  
  h += `<div style="display:flex;gap:10px;margin-top:1rem">
          <button class="btn btn-fw" onclick="FC.idx=(FC.idx-1+${CARDS.length})%${CARDS.length};FC.flip=false;render()">Előző</button>
          <button class="btn btn-fw" onclick="FC.idx=(FC.idx+1)%${CARDS.length};FC.flip=false;render()">Következő</button>
        </div>`;
  return h;
}

function renderSim() {
  if(!SI.id) {
    let h = `<h2 style="font-size:20px;font-weight:700;margin-bottom:1rem;">Szimulációk</h2>`;
    SIMS.forEach(s => {
      let tcls = s.diff.includes('B+') ? 'tag-bp' : 'tag-b';
      h += `<button class="card-btn" onclick="startSim(${s.id})">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
                <div style="font-weight:700">${s.title}</div>
                <div class="tag ${tcls}">${s.diff}</div>
              </div>
              <div style="font-size:12px;color:#9ca3af">${s.desc}</div>
            </button>`;
    });
    return h;
  }
  
  let sim = SIMS.find(x => x.id === SI.id);
  
  if(SI.fin) {
    let correct = SI.hist.filter(h => sim.steps[h.step].opts[h.choice].ok).length;
    let h = `<h2 style="font-size:20px;font-weight:700;margin-bottom:1rem;color:#4ade80">Összefoglaló</h2>`;
    h += `<div class="card" style="text-align:center;border-color:#065f46;background:#064e3b"><div style="font-size:32px;font-weight:700;color:#4ade80">${correct} / ${sim.steps.length}</div><div style="font-size:12px;color:#bbf7d0">helyes döntés</div></div>`;
    h += `<div class="al al-i" style="text-align:justify"><strong>Eset elemzése:</strong><br><br>${sim.summary}</div>`;
    h += `<button class="btn btn-fw btn-g" onclick="SI.id=null;render()">Vissza az esetekhez</button>`;
    return h;
  }
  
  let step = sim.steps[SI.step];
  let h = `<div style="display:flex;justify-content:space-between;margin-bottom:5px"><div style="font-weight:700;color:#f59e0b">${sim.title}</div><div style="font-size:12px">${SI.step+1}/${sim.steps.length}</div></div>`;
  h += `<div class="prog"><div class="progb" style="width:${((SI.step+1)/sim.steps.length)*100}%"></div></div>`;
  
  h += `<div class="card" style="font-size:15px;line-height:1.5;font-weight:600">${step.sit}</div>`;
  
  step.opts.forEach((o, i) => {
    let cls = "opt";
    if(SI.chosen !== null) {
      if(o.ok) cls += " opt-ok";
      else if(SI.chosen === i && !o.ok) cls += " opt-no";
    }
    h += `<button class="${cls}" ${SI.chosen===null ? `onclick="chooseSim(${i})"` : ''}>${o.tx}</button>`;
  });
  
  if(SI.chosen !== null) {
    let isOk = step.opts[SI.chosen].ok;
    h += `<div class="al ${isOk?'al-s':'al-d'}">${step.opts[SI.chosen].fb}</div>`;
    h += `<button class="btn btn-fw btn-g" onclick="nextSim()">${SI.step < sim.steps.length-1 ? 'Következő →' : 'Eredmények'}</button>`;
  }
  
  return h;
}

function renderCalc() {
  return `
    <h2 style="font-size:20px;font-weight:700;margin-bottom:1rem;">Kalkulátorok</h2>
    
    <div class="card">
      <div class="sub">Parkland-séma módosítása (Felnőtt)</div>
      <div style="font-size:13px;color:#9ca3af;margin-bottom:10px">Nagyfeszültségű áramütés okozta jelentős lágyrész/izomkárosodás gyanúja esetén az alábbi fix iv. folyadékpótlás javasolt a rhabdomyolysis megelőzésére (függetlenül a testfelülettől).</div>
      <div style="background:#172554;border:1px solid #1e3a8a;border-radius:8px;padding:15px;text-align:center">
        <div style="font-size:28px;font-weight:700;color:#60a5fa">1000 ml / óra</div>
        <div style="font-size:12px;color:#bfdbfe">Krisztalloid infúzió</div>
      </div>
    </div>
    
    <div class="card">
      <div class="sub">Feszültség (Voltage) Besorolás</div>
      <div style="font-size:13px;color:#9ca3af;margin-bottom:10px">Váltóáram (AC) esetén:</div>
      <input type="number" id="vInp" placeholder="Adja meg a feszültséget (V)" oninput="calcV(this.value)">
      <div id="vRes" style="margin-top:10px;font-weight:700;font-size:15px"></div>
    </div>
  `;
}

function calcV(v) {
  let val = parseInt(v);
  let res = document.getElementById('vRes');
  if(isNaN(val)) { res.innerHTML = ''; return; }
  
  if(val <= 50) {
    res.innerHTML = '<span style="color:#4ade80">Törpefeszültség (≤50 V).</span> Általában ártalmatlan.';
  } else if (val < 1000) {
    res.innerHTML = '<span style="color:#fcd34d">Kisfeszültség (<1000 V).</span> Kimentés alkalmi eszközzel megkísérelhető. 400V felett kórház kötelező!';
  } else {
    res.innerHTML = '<span style="color:#ef4444">NAGYFESZÜLTSÉG (≥1000 V).</span> Megközelíteni TILOS (15m)! Műszaki mentés kell. Azonnali SBO indikáció!';
  }
}

// --- LOGIC ---
window.go = function(s, id=null) { SCR = s; CHID = id; render(); }
window.startSim = function(id) { SI = {id:id, step:0, chosen:null, hist:[], fin:false}; render(); }
window.chooseSim = function(i) {
  if(SI.chosen !== null) return;
  SI.chosen = i;
  SI.hist.push({step: SI.step, choice: i});
  render();
}
window.nextSim = function() {
  let sim = SIMS.find(x => x.id === SI.id);
  if(SI.step < sim.steps.length - 1) {
    SI.step++;
    SI.chosen = null;
  } else {
    SI.fin = true;
  }
  render();
}

function render() {
  let ct = document.getElementById('ct');
  if(SCR==='home') ct.innerHTML = renderHome();
  else if(SCR==='chapters') ct.innerHTML = renderChapters();
  else if(SCR==='chapter') ct.innerHTML = renderChapter(CHID);
  else if(SCR==='flash') ct.innerHTML = renderFlash();
  else if(SCR==='sim') ct.innerHTML = renderSim();
  else if(SCR==='calc') ct.innerHTML = renderCalc();
  
  let tabs = ['home','chapters','flash','sim','calc'];
  let act = SCR==='chapter'?'chapters':SCR;
  document.querySelectorAll('.nb').forEach((b,i) => b.classList.toggle('act', tabs[i]===act));
  window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
