function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+s.t+'</div><div class="step-x">'+s.x+'</div></div></div>').join('');
  return '';
}

var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#ef4444':'#3f3f3f')+';background:'+(FC.cat===c?'#ef4444':'#2a2a2a')+';color:'+(FC.cat===c?'#fff':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" style="color:#fff" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
'<div class="al al-w" style="font-size:12px;">Az esetek szigorúan B és B+ (mentőápoló) kompetenciaszintnek megfelelően lettek kialakítva az eljárásrend alapján. 10 kérdés / szituáció.</div>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-y':'tag-g')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont (kérdés)</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#172554;border:1px solid #1e3a8a;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#60a5fa">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#bfdbfe;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-g btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő lépés →':'Eredmény megtekintése')+'</button>':'');
}

function renderCalc(){
  var w = CA.weight || 75;
  var cGy = (w * 10) + " ml";
  var cMax = (w * 30) + " ml";
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Folyadék Kalkulátor</h2>'+
  '<div class="card">'+
  '<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Beteg testsúlya (kg):</div>'+
  '<input type="number" min="1" max="200" value="'+w+'" oninput="upCalc(this.value)">'+
  '<div class="g2" style="margin-top:15px">'+
  '<div class="res-box" style="background:#451a03;border:1px solid #78350f">'+
  '<div style="font-size:11px;color:#fde68a;font-weight:700;text-transform:uppercase;margin-bottom:5px">Gyermek (10 ml/kg)</div>'+
  '<div style="font-size:11px;color:#9ca3af;margin-bottom:5px">Egyszeri bólus:</div>'+
  '<div id="calc-gy" style="font-size:24px;font-weight:700;color:#fbbf24">'+cGy+'</div>'+
  '</div>'+
  '<div class="res-box" style="background:#172554;border:1px solid #1e3a8a">'+
  '<div style="font-size:11px;color:#bfdbfe;font-weight:700;text-transform:uppercase;margin-bottom:5px">Felnőtt (Fix)</div>'+
  '<div style="font-size:11px;color:#9ca3af;margin-bottom:5px">Egyszeri bólus:</div>'+
  '<div style="font-size:24px;font-weight:700;color:#60a5fa">250 ml</div>'+
  '</div>'+
  '</div>'+
  '<div class="res-box" style="background:#064e3b;border:1px solid #065f46;margin-top:10px">'+
  '<div style="font-size:12px;color:#bbf7d0;font-weight:700;margin-bottom:5px">Mentőápolói (B/B+) MAX Összadag (30 ml/kg):</div>'+
  '<div id="calc-max" style="font-size:32px;font-weight:700;color:#4ade80">'+cMax+'</div>'+
  '</div>'+
  '<div class="al al-d" style="margin-top:15px;font-size:12px;"><strong>Figyelem!</strong> A folyadékterápia AZONNAL leállítandó, ha beadásával párhuzamosan dyspnoe jelenik meg/fokozódik, vagy nő a légzésszám! A bólusokat csak addig ismételjük, amíg a sBP el nem éri a 100 Hgmm-t (gyermeknél amíg a perfúzió nem rendeződik).</div>'+
  '</div>';
}

function render(){
  var c=document.getElementById('ct');c.innerHTML='';
  if(SCR==='home')c.innerHTML=renderHome();
  else if(SCR==='chapters')c.innerHTML=renderChapters();
  else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
  else if(SCR==='flash')c.innerHTML=renderFlash();
  else if(SCR==='sim')c.innerHTML=renderSim();
  else if(SCR==='calc')c.innerHTML=renderCalc();
  
  var tabs=['home','chapters','flash','sim','calc'];
  var active=SCR==='chapter'?'chapters':SCR;
  document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
  window.scrollTo(0,0);
}

window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

window.upCalc=function(v){
  var w = parseFloat(v) || 0;
  CA.weight = w;
  var egy = document.getElementById('calc-gy');
  var emax = document.getElementById('calc-max');
  if(egy) egy.innerText = (w * 10) + ' ml';
  if(emax) emax.innerText = (w * 30) + ' ml';
};

render();
</script>
</body>
</html>
