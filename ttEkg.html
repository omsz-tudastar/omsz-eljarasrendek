function d(t) {
    let r = t;
    for(let k in DICT) {
        let regex = new RegExp('(?<![a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ])(' + k + ')(?![a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ])', 'g');
        r = r.replace(regex, '<span class="dic" onclick="sw(\'' + k + '\')">$1</span>');
    }
    return r;
}

{s:'A TTEKG adatait elküldted. Kivel kell konzultálnod?', o:['A mentésvezetővel.','A TTEKG jelet fogadó PCI centrum orvosával / kardiológussal.','A legközelebbi SBO portájával.'], a:1, f:'A fogadó orvossal/kardiológussal kell megbeszélni a látottakat.'},
{s:'A kardiológus közli: a betegnek egyértelmű STEMI-je van. Ki hozza meg a vitás kérdésekben a végső döntést a helyszínen a betegútról?', o:['A kardiológus telefonon.','A helyszíni mentőegység vezetője (te).','Az irányítás.'], a:1, f:'A TTEKG konzultáció nem veszi át a felelősséget, a végső döntés a tiéd.'},
{s:'STEMI diagnózis esetén a beteg állapota miatt magasabb szintű segítség indokolt. Mit teszel?', o:['Segélykocsit (eset/ROKO) kérek az ICS-től.','Saját magam megpróbálom gyógyszerezni, bár B szintem van.','Nem csinálok semmit, viszem így.'], a:0, f:'Helyes. STEMI és/vagy haemodinamikai instabilitás esetén segélykocsi kérése szóba jön.'},
{s:'A segélykocsi (ROKO) 15 percre van. STEMI esetén az eljárásrend alapján hol várod meg?', o:['A helyszínen maradunk, amíg megérkeznek.','Nem várjuk meg a helyszínen, elindulunk a PCI centrum / fogadó intézmény irányába.','Kiszállítjuk a beteget az utcára.'], a:1, f:'Helyes! STEMI esetén az elsődleges szempont a mihamarabbi PCI laborba érés.'},
{s:'A TTEKG elküldése, a konzultáció és a megindult szállítás tényéről kit kell tájékoztatnod?', o:['A háziorvost.','A beteg hozzátartozóit.','Az ICS-t (mentésvezetőt).'], a:2, f:'Az ICS-t kötelező tájékoztatni a fejleményekről és a segélykocsi koordinációjáról.'},
{s:'Szállítás közben a beteg hirtelen elveszti az eszméletét és görcsölni kezd. Mi a teendő a TTEKG-vel kapcsolatban (az újraélesztési/ellátási lépéseken túl)?', o:['Kikapcsolom a gépet, már nem kell.','Állapotváltozás (eszméletvesztés, görcs) miatt indokolt a TTEKG megismétlése (amint stabil/lehetséges).','Csak akkor ismétlem, ha orvos kéri.'], a:1, f:'Helyes! Az eljárásrend külön kitér az ismétlésre állapotváltozáskor.'}
]},
{id:2, t:'2. Szimuláció: Akut balszívfél-elégtelenség', df:'B+ - Mentőápoló', ds:'Ismeretlen eredetű, nem tüdőbetegségből fakadó súlyos nehézlégzéses (fulladó) beteg ellátása.',
st:[
{s:'Megérkezel a beteghez, ABCDE vizsgálat történik. Mely tünet utal leginkább akut balszívfél-elégtelenségre az eljárásrend szerint?', o:['Ismeretlen eredetű nehézlégzés, döntően belégzési nehezítettséggel.','Láz és hurutos köhögés.','Bokatörés miatti fájdalmas légzés.'], a:0, f:'Pontosan. Ez az akut balszívfél-elégtelenség definíciója az eljárásrendben.'},
{s:'Mivel az állapot kardiális gyanút vet fel, mi az egységvezető (B+) kötelező feladata?', o:['Kizárólag vénabiztosítás.','TTEKG elkészítése minden esetben.','Azonnali intubálás (hatáskör túllépéssel).'], a:1, f:'B/B+ kompetencián kardiális gyanúnál kötelező a TTEKG.'},
{s:'A B+ ápoló párhuzamosan oxigént ad, és vénát biztosít. Eközben felteszitek az EKG-t. Mikor kell megszakítani a betegellátást a TTEKG miatt?', o:['A TTEKG miatt azonnal mindent leállítani.','Soha, a TTEKG nem hátráltathatja a betegellátást.','Ha a gép nem csatlakozik.'], a:1, f:'Helyes. A párhuzamos ellátás kritérium.'},
{s:'A TTEKG elkészült. Kivel beszéled meg a látottakat?', o:['Csak a mentőgépkocsi-vezetővel.','A TTEKG jelet fogadó orvossal/kardiológussal.','Senkivel, elteszem a szalagot.'], a:1, f:'A fogadó orvossal való konzultáció kötelező lépés.'},
{s:'Az orvos szerint heveny balszívfél-elégtelenség áll fenn ACS alapul. A beteg állapota haemodinamikailag instabil. Mit kérsz az irányítástól?', o:['Háziorvosi ügyeletet.','Segélykocsit (eset/ROKO) az instabilitás miatt.','Csak egy új tabletet.'], a:1, f:'Instabilitás esetén a B+ mentőápolónak segélykocsit kell mérlegelnie/kérnie.'},
{s:'Ki a felelős a betegért a konzultáció alatt és után a helyszínen?', o:['A kardiológus az asztal mögött.','A helyszínen lévő mentőegység vezetője (te).','Az ICS.'], a:1, f:'A végső döntést és a felelősséget a helyszíni ellátó viseli.'},
{s:'Kinek kell lejelenteni a konzultáció kimenetelét és a segélykocsi igényt?', o:['A portásnak.','A beteg fiának.','A mentésvezetőnek (ICS).'], a:2, f:'Az ICS-t kötelező tájékoztatni.'},
{s:'Meddig maradsz a helyszínen a segélykocsira várva, ha a beteg instabil, de STEMI nincs kimondva, a fogadó messze van, a segélykocsi viszont közelít?', o:['Mindig a helyszínen várok.','Mérlegelem az optimális betegutat az ICS-vel; ha a segélykocsi felé mozgás a gyorsabb, elindulok.','A beteggel elsétálunk.'], a:1, f:'Az optimális betegút és találkozási pont megszervezése az ICS és a helyszíni ellátó közös feladata.'},
{s:'A beteg állapotának stabilizálása (B+ gyógyszerelés hatására) megtörténik. Mit javasol az eljárásrend állapotváltozás (pl. stabilizálás) esetén?', o:['Levesszük a monitort.','Indokolt lehet a TTEKG megismétlése.','Azonnali hazabocsátást.'], a:1, f:'Helyes. Állapotjavulás (stabilizálás) esetén is indokolt az ismétlés.'},
{s:'Mi az elsődleges szempont a teljes folyamat alatt?', o:['Hogy a tablet akkumulátora ne merüljön le.','Hogy az "ABCDE" szerinti ellátás folyamatos legyen, a TTEKG ezt csak kiegészíti és segíti.','Hogy a papírmunka tökéletes legyen.'], a:1, f:'Az ABCDE a legfontosabb, a TTEKG ezt támogatja az optimális betegút kiválasztásában.'}
]},
{id:3, t:'3. Szimuláció: Ritmuszavar', df:'B - Mentőápoló', ds:'A beteg panasza heveny szívdobogás-érzés, a monitoron a pulzus 160/perc.',
st:[
{s:'Az elsődleges ABCDE vizsgálat rögzíti a 160/perc pulzust. Milyen egyéb állapotokat kell KIZÁRNI ahhoz, hogy a ritmuszavar tiszta kardiális indikáció legyen?', o:['Hipoxia, hipovolémia, shock, láz.','Törések, ficamok, rándulások.','Fogfájás, fejfájás.'], a:0, f:'Helyes. Az eljárásrend alapján ezeket az okokat ki kell zárni a ritmuszavar értékelése előtt.'},
{s:'A betegnek nincs láza, nem shockos, nem hipoxiás. B kompetenciával készítesz TTEKG-t?', o:['Nem, ez orvosi feladat.','Igen, minden esetben, mert ritmuszavarról (kardiális gyanúról) van szó.','Csak ha a pulzus 200 felett van.'], a:1, f:'Igen, kötelező a TTEKG készítése.'},
{s:'A TTEKG elkészítése során a beteg nagyon szorong, kéri az oxigént. Mikor adod oda?', o:['Majd ha elment a TTEKG.','Azonnal, a TTEKG készítésével párhuzamosan, nem hátráltatva az ellátást.','Nem adok, mert zavarja a görbét.'], a:1, f:'A betegellátás sosem szenvedhet hátrányt.'},
{s:'A görbe elment. Kihez fut be az adat?', o:['A TTEKG jelet fogadó orvoshoz (PCI centrum/kardiológus).','A rendőrséghez.','Közvetlenül az ICS gépére.'], a:0, f:'A fogadó orvoshoz / PCI centrumba.'},
{s:'A kardiológus szerint a betegnek SVT-je van. Mivel te B kompetenciás ápoló vagy, mit kell kérned?', o:['Segélykocsit (eset/ROKO) az állapot és a kompetencia hiánya miatt.','Mentőhelikoptert mindenképp.','Csak egy megnyugtató szót.'], a:0, f:'Mivel nem tudod megszüntetni a ritmuszavart és kardiális probléma van, magasabb szintű egység kell.'},
{s:'A betegút szervezését (ki hova induljon) kivel kell elsődlegesen közölni?', o:['A szomszéddal.','Az ICS-sel (mentésvezetés).','A TTEKG orvossal.'], a:1, f:'Az ICS koordinálja a segélykocsit és a betegutat.'},
{s:'Ki a felelős a beteg állapotáért a helyszínen, amíg a segélykocsi meg nem érkezik?', o:['A TTEKG kardiológusa.','A helyszínen lévő mentőegység vezetője (te).','Senki.'], a:1, f:'A felelősség mindig a helyszíni ellátóé.'},
{s:'Várakozás közben a beteg hirtelen összeesik, a pulzusa szabálytalanná és még szaporábbá válik. Mi a teendő a TTEKG-vel?', o:['Indokolt lehet a TTEKG megismétlése a jelentős állapotváltozás miatt.','Tilos ismételni.','Várok a rohammentőre.'], a:0, f:'Állapotváltozás esetén meg kell ismételni a TTEKG-t.'},
{s:'Ha a ritmuszavar hirtelen keringésmegállásba csap át, mi a legfontosabb?', o:['Azonnal elkezdeni a TTEKG-t.','Félretenni a TTEKG-t és az ABCDE alapján azonnal megkezdeni az újraélesztést (BLS).','Hívni a kardiológust.'], a:1, f:'Az újraélesztés abszolút prioritást élvez.'},
{s:'A sikeres újraélesztés és stabilizálás (ROKO által) után ismét készítetek TTEKG-t. Miért?', o:['Mert unatkoztok.','Mert az állapot stabilizálása/megváltozása után indokolt a TTEKG ismétlése a célintézmény meghatározásához.','Mert a gép automatikusan küldi.'], a:1, f:'Helyes. A stabilizálás utáni kontroll nagyon fontos a betegút meghatározásához.'}
]},
{id:4, t:'4. Szimuláció: Eszmélet-/Tudatzavar', df:'B+ - Mentőápoló', ds:'Utcán fekvő, tartósan eszméletlen beteg (ismeretlen eredetű).',
st:[
{s:'Az ABCDE vizsgálatnál a beteg eszméletlen, de légzése és keringése (pulzus tapintható) van. Mi a protokolláris teendő, ha az eszméletzavar heveny, tartós és ismeretlen eredetű?', o:['Ez azonnali kardiális gyanút jelent az eljárásrend szerint.','Ez kizárólag neurológiai probléma.','Csak vércukrot mérek és hazamegyek.'], a:0, f:'Helyes! Az eljárásrend kimondja: heveny, tartós eszmélet/tudatzavar ismeretlen eredettel = kardiális gyanú.'},
{s:'Mivel kardiális gyanú áll fenn, és B+ szintű mentőápoló vagy, kötelező a TTEKG?', o:['Nem, mert nincs mellkasi fájdalma.','Igen, a gyanú miatt MINDEN ESETBEN el kell készíteni.','Csak ha a hozzátartozó kéri.'], a:1, f:'A protokoll szerint mentőápolóként minden kardiális gyanú esetén kötelező a TTEKG.'},
{s:'Eszméletlen betegnél a vénabiztosítás (B+ kompetencia), vércukormérés és oxigén adása mellett hogyan időzíted a TTEKG-t?', o:['Minden mást leállítok, a TTEKG az első.','Párhuzamosan végzem, a TTEKG nem növelheti a helyszínen töltött időt.','Majd a kórházban.'], a:1, f:'A párhuzamos ellátás kritikus az eszméletlen betegnél.'},
{s:'A TTEKG elmegy, kivel történik a konzultáció?', o:['A TTEKG-t fogadó orvossal/kardiológussal.','Az ügyeletes toxikológussal.','A mentésirányítóval (ICS).'], a:0, f:'Mindig a fogadó orvossal kell konzultálni a leletről.'},
{s:'Kiderül, hogy a TTEKG alapján súlyos AV-blokk (ritmuszavar) okozza az eszméletlenséget. Kihez fordulsz logisztikai segítségért és segélykocsiért?', o:['A kardiológushoz.','Az ICS-hez (mentésvezető).','A tűzoltókhoz.'], a:1, f:'Az ICS szervezi a mentést és a segélykocsit.'},
{s:'A beteg eszméletlen maradt, haemodinamikailag instabil. A végső felelős a beteg beavatkozásaiért a helyszínen ki?', o:['A mentésvezető.','A helyszíni mentőegység vezetője (te).','A PCI centrum ügyeletese.'], a:1, f:'A felelősséget a TTEKG nem veszi át, te felelsz a betegért.'},
{s:'Közben a segélykocsi (esetkocsi) úton van felétek. Hol várakozol, ha a beteg extrém instabil és a találkozási pont a kórház felé van?', o:['Mérlegelem az ICS-vel, és ha kell, elindulok a segélykocsi/fogadó intézmény irányába.','Helyben maradok, mert eszméletlen.','Nem csinálok semmit.'], a:0, f:'Helyes logisztika az ICS bevonásával.'},
{s:'A beteg a szállítás közben hirtelen magához tér, tudata tisztul. Mi a teendő a protokoll alapján?', o:['Levesszük az EKG-t.','Állapotának jelentős változása (stabilizálódása) miatt indokolt a TTEKG megismétlése.','Azonnal megfordulunk a kocsival.'], a:1, f:'Az állapot jelentős változásakor a TTEKG ismétlése indokolt.'},
{s:'Az új TTEKG eredményét kivel beszéled meg?', o:['A mentőápoló társammal.','Ismét a fogadó orvossal konzultálok.','Nem beszélgetek.'], a:1, f:'A kontroll TTEKG-t is konzultálni kell.'},
{s:'Kit kell tájékoztatni a megváltozott állapotról és a betegút esetleges módosulásáról?', o:['Az ICS-t (mentésvezetőt).','A médiát.','Senkit.'], a:0, f:'Az ICS-t folyamatosan tájékoztatni kell.'}
]}
];

function renderHome() {
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6;text-align:center;">OMSZ - TTEKG Használata</h2>' +
           '<div class="card" style="background:#064e3b;border-color:#065f46;font-size:12px;color:#bbf7d0;text-align:center;">Hatályos: 2014.01.27 - visszavonásig</div>' +
           '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;">' +
           '<button onclick="go(\'chapters\')" class="btn btn-g" style="padding:15px;font-size:15px;font-weight:bold;">📚<br>Eljárásrend</button>' +
           '<button onclick="go(\'flash\')" class="btn" style="padding:15px;font-size:15px;font-weight:bold;background:#2563eb;color:#fff;border-color:#2563eb;">🃏<br>Kártyák</button>' +
           '<button onclick="go(\'quiz\')" class="btn" style="padding:15px;font-size:15px;font-weight:bold;background:#d97706;color:#fff;border-color:#d97706;">❓<br>Kvíz</button>' +
           '<button onclick="go(\'sim\')" class="btn btn-v" style="padding:15px;font-size:15px;font-weight:bold;">🚑<br>Szimuláció</button>' +
           '</div>' +
           '<div class="al al-i">Kattints a <span class="dic" onclick="sw(\'TTEKG\')">pontozott szavakra</span> az idegen szavak / fogalmak jelentésének megtekintéséhez!</div>';
}

function renderChapters() {
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Eljárásrend Fejezetei</h2>' +
           CDATA.map(c => '<button class="card-btn" onclick="go(\'chapter\',\'' + c.id + '\')"><div style="font-size:15px;font-weight:700;color:#14b8a6">' + c.title + '</div></button>').join('');
}

function renderChapter(id) {
    let c = CDATA.find(x => x.id === id);
    return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;font-weight:600">‹ Vissza</button>' +
           '<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin-bottom:10px">' + c.title + '</h2>' + c.html;
}

function renderFlash() {
    let c = CARDS[FC.idx];
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Tanulókártyák (' + (FC.idx + 1) + '/' + CARDS.length + ')</h2>' +
           '<div class="flip ' + (FC.flip ? 'on' : '') + '" onclick="FC.flip=!FC.flip;render()">' +
           (FC.flip ? '<div style="font-size:14px;color:#d1d5db;">' + d(c.a) + '</div>' : '<div style="font-size:15px;font-weight:600;color:#14b8a6;">' + d(c.q) + '</div><div style="font-size:11px;color:#9ca3af;margin-top:15px">Kattints a fordításhoz →</div>') +
           '</div>' +
           '<div style="display:flex;gap:10px;"><button class="btn btn-fw" onclick="FC.flip=false;FC.idx=(FC.idx-1+CARDS.length)%CARDS.length;render()">‹ Előző</button><button class="btn btn-fw" onclick="FC.flip=false;FC.idx=(FC.idx+1)%CARDS.length;render()">Következő ›</button></div>';
}

function renderQuiz() {
    if (QZ.done) {
        let pct = Math.round(QZ.score / QUIZ.length * 100);
        return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz Eredmény</h2>' +
               '<div class="card" style="text-align:center"><div style="font-size:30px;color:' + (pct >= 80 ? '#4ade80' : '#fca5a5') + '">' + QZ.score + '/' + QUIZ.length + '</div></div>' +
               '<button class="btn btn-g btn-fw" onclick="QZ={idx:0,sel:null,score:0,done:false,ans:[]};render()">Újra</button>';
    }
    let q = QUIZ[QZ.idx];
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">Kvíz (' + (QZ.idx + 1) + '/' + QUIZ.length + ')</h2>' +
           '<div class="prog"><div class="progb" style="width:' + ((QZ.idx + 1) / QUIZ.length * 100) + '%;background:#14b8a6"></div></div>' +
           '<div class="card" style="font-size:15px;font-weight:600;color:#f3f4f6">' + d(q.q) + '</div>' +
           q.o.map((o, i) => {
               let cls = 'opt';
               if (QZ.sel !== null) { if (i === q.a) cls += ' opt-ok'; else if (i === QZ.sel) cls += ' opt-no'; }
               return '<button class="' + cls + '" ' + (QZ.sel === null ? 'onclick="QZ.sel=' + i + ';if(' + i + '===' + q.a + ')QZ.score++;render()"' : '') + '>' + d(o) + '</button>';
           }).join('') +
           (QZ.sel !== null ? '<button class="btn btn-g btn-fw" style="margin-top:10px" onclick="if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else{QZ.done=true;}render()">Következő</button>' : '');
}

function renderSim() {
    if (!SI.id) {
        return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs Esetek</h2>' +
               SIMS.map(s => {
                   let badgeBg = s.df.includes('B+') ? '#b45309' : '#059669';
                   let badgeText = s.df.includes('B+') ? 'B+ kompetencia' : 'B kompetencia';
                   return '<button class="card-btn" onclick="SI.id=' + s.id + ';SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render()">' +
                          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">' +
                          '<div style="font-size:15px;font-weight:700;color:#e5e7eb;text-align:left;line-height:1.3;padding-right:10px;">' + s.t + '</div>' +
                          '<div style="background:' + badgeBg + ';color:#fff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;">' + badgeText + '</div>' +
                          '</div>' +
                          '<div style="font-size:13px;color:#d1d5db;margin-bottom:8px;line-height:1.5;text-align:left;">' + s.ds + '</div>' +
                          '<div style="font-size:12px;color:#9ca3af;text-align:left;">' + s.st.length + ' döntési pont</div>' +
                          '</button>';
               }).join('');
    }
    let sim = SIMS.find(s => s.id === SI.id);
    if (SI.fin) {
        let corr = SI.hist.filter(h => sim.st[h.s].a === h.c).length;
        return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Értékelés: ' + sim.t + '</h2>' +
               '<div class="card" style="text-align:center"><div style="font-size:30px;color:#4ade80">' + corr + '/' + sim.st.length + '</div>helyes döntés</div>' +
               '<button class="btn btn-r btn-fw" onclick="SI={id:null,step:0,chosen:null,hist:[],fin:false};render()">Vissza a listához</button>';
    }
    let st = sim.st[SI.step];
    return '<div style="display:flex;justify-content:space-between;"><h2 style="font-size:16px;font-weight:700;margin-bottom:.5rem;color:#14b8a6">' + sim.t + '</h2><span style="font-size:12px;color:#9ca3af">' + (SI.step + 1) + '/' + sim.st.length + '</span></div>' +
           '<div class="prog"><div class="progb" style="width:' + ((SI.step + 1) / sim.st.length * 100) + '%;background:#7c3aed"></div></div>' +
           '<div class="card" style="font-size:14px;line-height:1.5">' + d(st.s) + '</div>' +
           st.o.map((o, i) => {
               let cls = 'opt';
               if (SI.chosen !== null) { if (i === st.a) cls += ' opt-ok'; else if (i === SI.chosen) cls += ' opt-no'; }
               return '<button class="' + cls + '" ' + (SI.chosen === null ? 'onclick="SI.chosen=' + i + ';SI.hist.push({s:SI.step,c:' + i + '});render()"' : '') + '>' + d(o) + '</button>';
           }).join('') +
           (SI.chosen !== null ? '<div class="al ' + (SI.chosen === st.a ? 'al-s' : 'al-d') + '">' + d(st.f) + '</div><button class="btn btn-v btn-fw" onclick="if(SI.step<'+(sim.st.length-1)+'){SI.step++;SI.chosen=null;}else{SI.fin=true;}render()">Tovább</button>' : '');
}

function render() {
    let c = document.getElementById('ct');
    if (SCR === 'home') c.innerHTML = renderHome();
    else if (SCR === 'chapters') c.innerHTML = renderChapters();
    else if (SCR === 'chapter') c.innerHTML = renderChapter(CHID);
    else if (SCR === 'flash') c.innerHTML = renderFlash();
    else if (SCR === 'quiz') c.innerHTML = renderQuiz();
    else if (SCR === 'sim') c.innerHTML = renderSim();
    
    let tabs = ['home', 'chapters', 'flash', 'quiz', 'sim'];
    let act = SCR === 'chapter' ? 'chapters' : SCR;
    document.querySelectorAll('.nb').forEach((b, i) => b.classList.toggle('act', tabs[i] === act));
    window.scrollTo(0, 0);
}

window.go = function(s, id) { SCR = s; CHID = id || null; render(); };
render();
</script>
</body>
</html>
