</style>

function formatText(txt) {
    if (!txt) return '';
    var safe = String(txt).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var result = "";
    var lastIdx = 0;
    var match;
    var re = /\[\[(.*?)(?:\|(.*?))?\]\]/g;
    while ((match = re.exec(safe)) !== null) {
        result += safe.slice(lastIdx, match.index);
        var key = match[1];
        var display = match[2] || key;
        result += '<span class="gloss" onclick="window.showGloss(\'' + key.toLowerCase() + '\')">' + display + '</span>';
        lastIdx = re.lastIndex;
    }
    result += safe.slice(lastIdx);
    return result;
}

        {sit:'A hajas fejbőr megjelenik. A koponya kezd kigördülni. Hogyan végzed a gátvédelmet?',opts:[{tx:'Két kézzel visszatartom a fejet.',ok:false,fb:'Hibás. Csak finoman fékezzük, nem akadályozzuk.'},{tx:'Jobb kézzel steril gézlappal fedem a gátat, összeráncolom; bal kézzel a koponyára enyhe nyomást gyakorlok a lassú megszületéshez.',ok:true,fb:'Helyes. Ez a gátvédelem klasszikus, protokoll szerinti módja.'},{tx:'Azonnal gátmetszést vágok.',ok:false,fb:'Hibás. B kompetenciával tilos, és rutinszerűen amúgy is kerülendő.'}]},
        {sit:'A fej megszületett. A magzat magától elfordítja a fejét 90 fokkal. Ellenőrzöd a nyakát, és lazán rátekeredett köldökzsinórt találsz. Mit teszel?',opts:[{tx:'Azonnal elvágom a zsinórt a nyakánál.',ok:false,fb:'Hibás. Szigorúan tilos kapkodva vágni.'},{tx:'Egy ujjal alányúlva óvatosan lefejtem a nyakáról a köldökzsinórt.',ok:true,fb:'Helyes. Ha laza, könnyen le lehet fejteni.'},{tx:'Erősen meghúzom a babát kifelé.',ok:false,fb:'Hibás. Sérülést okozna.'}]},
        {sit:'A zsinórt lefejtetted. A felső kezeddel (villa alakban a nyak köré csúszva) enyhe lefelé nyomással mit segítesz elő?',opts:[{tx:'A magzatmáz eltávolítását.',ok:false,fb:'Hibás.'},{tx:'A mellső (elülső) váll megszületését.',ok:true,fb:'Helyes. Ezután a fejet finoman megemelve a hátsó váll is kigördül.'},{tx:'A lepény leválását.',ok:false,fb:'Hibás. A lepény még sokára jön.'}]},
        {sit:'A törzs és a lábak is akadálytalanul megszületnek. Az újszülött (időre született) rögtön hangosan felsír, izomtónusa élénk. Mit csinálsz vele a következő másodpercekben?',opts:[{tx:'Gyorsan leitatom róla a nedvességet (a magzatmázat meghagyva), és azonnal az édesanya mellkasára helyezem (bőr-bőr kontaktus).',ok:true,fb:'Helyes. Egészséges, jól adaptálódó újszülöttnél a bőr-bőr kontaktus és a szárítás a legfontosabb.'},{tx:'Leszívom az orrát és a torkát, majd odaadom az apának megfürdetni.',ok:false,fb:'Hibás. Rutinszerű szívás tilos, fürdetés tilos.'},{tx:'Azonnal elvágom a köldökzsinórt.',ok:false,fb:'Hibás. Meg kell várni a pulzálás végét.'}]},
        {sit:'Mikor fogod le és vágod el a köldökzsinórt (késői köldökellátás)?',opts:[{tx:'Amint a baba felsír.',ok:false,fb:'Hibás.'},{tx:'A pulzáció megszűnése után (minimum 1 perc elteltével).',ok:true,fb:'Helyes. Ez biztosítja az újszülött megfelelő vérvolumenét.'},{tx:'A lepény megszületése után.',ok:false,fb:'Hibás. A lepény megszületése akár 30 perc is lehet.'}]},
        {sit:'Hova helyezed fel a két köldökcsatot?',opts:[{tx:'Közvetlenül a magzat hasfalára az egyiket, 1 cm-re a másikat.',ok:false,fb:'Hibás. Ez túl közel van, sérülésveszély.'},{tx:'A magzati hasfaltól kb. 5 cm-re az egyiket, ettől ismét kb. 5 cm-re az anya felé a másikat, majd a kettő között vágom át.',ok:true,fb:'Helyes. Ez a biztonságos távolság.'},{tx:'Anya felőli végén és a placenta tövénél.',ok:false,fb:'Hibás.'}]},
        {sit:'A köldökzsinór elvágása után az édesanyát és a babát egy egységként betakarod (hővédelem). A méhlepény ([[placenta]]) még bent van. Mi a protokoll a placentáris szakra?',opts:[{tx:'Aktívan húzom a köldökzsinórt, és masszírozom a méhet, hogy gyorsan lejöjjön.',ok:false,fb:'Hibás. Az aktív vezetés tilos.'},{tx:'A [[placentáris]] szak aktív vezetése tilos. Hagyom a babát az anyán, elvégzem a transzport előkészületeit (20-30 perc helyszíni idő), a transzport megkezdésével nem kell megvárni a placenta megszületését.',ok:true,fb:'Helyes. A háborítatlan együttlét és a passzív várakozás az előírás.'},{tx:'Elindulok azonnal a kórházba, amint elvágtam a zsinórt.',ok:false,fb:'Hibás. 20-30 perc helyszíni békés adaptációs idő javasolt, ha minden rendben.'}]},
        {sit:'Szervezzük a mentőbe helyezést (transzport). Hol fog utazni az újszülött, mivel neonatológiai kocsi nem érkezett?',opts:[{tx:'Az édesanya karjában, biztonságosan átölelve.',ok:false,fb:'Hibás. Betegbiztonsági okból ez szigorúan tilos.'},{tx:'Saját autós hordozójában a hordágyra rögzítve (menetiránynak háttal), vagy a hordágyhoz tartozó speciális (Spencer) hevederrendszerben rögzítve.',ok:true,fb:'Helyes. A fizikai rögzítés kötelező a mentőautóban.'},{tx:'Mózeskosárban, a padlón.',ok:false,fb:'Hibás. Szabálytalan és veszélyes.'}]}
    ],summary:'Összefoglaló (2. Szimuláció): A kitolási szakban talált kismamánál a szállítás tilos, így a mentőegység felkészült a helyszíni vezetésre: melegítés, steril lepedők, megfelelő testhelyzet biztosítása, segélykocsi riasztása. A kitolási szak alatt a kismamát a préselésre biztattuk, a gátat óvtuk. A fej megszületésekor a laza köldökzsinórt lefejtettük. A jól adaptálódó (felsíró, jó tónusú) újszülöttet azonnal az anya mellkasára tettük (bőr-bőr kontaktus), majd legalább 1 perc után elvágtuk a köldökzsinórt (5+5 cm). A placentáris szakaszt nem siettettük (aktív vezetés tilos), 20-30 perc békés adaptációt biztosítottunk. A kórházba szállításhoz a babát szabályosan (hordozóban/hevederrel) rögzítettük, nem kézben utazott.'},

    {id:3,title:'3. Elakadt váll és Vérzés',diff:'B+ kompetencia',desc:'Egy 38 hetes kismamához riasztottak. B+ kompetenciaszint (vénabiztosítás, gyógyszerelés engedélyezett). A kiérkezéskor a nő kitolási szakban van, a baba feje épp a szemetek láttára születik meg. Segélykocsi (ALS) úton.',steps:[
        {sit:'A baba feje megszületett, de a következő kontrakcióknál a vállak nem mozdulnak, a magzat feje visszahúzódik a gátra. Ez a váll-elakadás ([[dystocia]]). Mit teszel elsőként?',opts:[{tx:'Azonnal gátmetszést végzek.',ok:false,fb:'Hibás. B+ szinten alapból tilos, a gátmetszés a lágyrészt tágítja, de a váll a csonton akadt el.'},{tx:'Két segítővel kivitelezzük a McRoberts-manővert: a kismama combjait élesen a hasfalhoz hajlítjuk.',ok:true,fb:'Helyes. Ez a protokoll szerinti elsődleges eljárás váll-elakadáskor.'},{tx:'Erősen húzom a magzat fejét.',ok:false,fb:'Hibás. Ez súlyos ideg- és gerincsérülést okozna a magzatnak.'}]},
        {sit:'A McRoberts manőver mellett milyen nyomást alkalmazhatsz még az elülső váll kiszabadítására?',opts:[{tx:'Erős fundus nyomást ([[kristeller|Kristeller-műfogás]]).',ok:false,fb:'Hibás. Tilos, csak jobban beékeli a vállat.'},{tx:'[[suprapubicus|Suprapubicus]] (szeméremcsont feletti) nyomást.',ok:true,fb:'Helyes. A szeméremcsont felett nyomva az elakadt váll becsúszhat a szeméremcsont alá.'},{tx:'Bordák alatti nyomást.',ok:false,fb:'Hibás. Nem anatómiai pont a szülés segítésére.'}]},
        {sit:'A manőverek hatására a baba megszületik. Állapota megfelelő. Késői köldökellátás után ráteszed az anyára. 10 perc múlva megszületik a méhlepény. Mit kell ellenőrizned a lepényen?',opts:[{tx:'Semmit, azonnal a biológiai hulladékba dobom.',ok:false,fb:'Hibás. A lepényt be kell vinni a kórházba.'},{tx:'Az anyai és magzati felszínét, hogy van-e rajta sérülésre vagy hiányra utaló eltérés (benne maradt lepényrész gyanúja).',ok:true,fb:'Helyes. A hiányos lepény súlyos vérzést okozhat.'},{tx:'Le kell mérnem a súlyát dekagrammra pontosan.',ok:false,fb:'Hibás. Erre a helyszínen nincs lehetőség és nem is kritikus információ ott.'}]},
        {sit:'Ahogy a lepényt vizsgálod, észleled, hogy az édesanya hirtelen sápadt, masszív hüvelyi vérzés indul meg (becsülve >500 ml). Mi a legelső, azonnali teendőd?',opts:[{tx:'Ismételt állapotfelmérés ABCDE szerint.',ok:true,fb:'Helyes. Nagy vérzésnél az ABCDE felmérés az első lépés a hemodinamikai státusz tisztázására.'},{tx:'Azonnali transzport minden beavatkozás nélkül.',ok:false,fb:'Hibás. A vérzés okozta shock azonnali helyszíni ellátást (folyadék/gyógyszer) igényel.'},{tx:'Visszahelyezem a méhlepényt.',ok:false,fb:'Hibás. Lehetetlen és értelmetlen.'}]},
        {sit:'Az ABCDE vizsgálat megerősíti: az édesanya pulzusa 130/perc, vérnyomása 80/50 Hgmm, hideg, verejtékes ([[hypovolaemiás shock]] indul). B+ kompetenciával milyen eszközt kell feltétlenül alkalmaznod?',opts:[{tx:'Csak oxigént adok.',ok:false,fb:'Hibás. Önmagában nem elég shockban.'},{tx:'Nagy lumenű perifériás véna (rekesz felett) biztosítása kötelező, és iv. folyadékbolus (kristályos oldat) adása.',ok:true,fb:'Helyes. A folyadékreszuszcitáció és a gyógyszeres bemenet kulcsfontosságú.'},{tx:'Intratracheális tubust dugok a hüvelybe.',ok:false,fb:'Hibás.'}]},
        {sit:'A protokoll milyen specifikus iv. gyógyszert javasol masszív posztplacentáris vérzésnél a vérzés csillapítására (B+ szinttől)?',opts:[{tx:'Csak Fájdalomcsillapítót.',ok:false,fb:'Hibás. Az nem csillapítja a vérzést.'},{tx:'1g tranexámsav iv. és 5-20 NE Oxytocin iv. (5 NE-ként adagolva).',ok:true,fb:'Helyes. A tranexámsav gátolja a vérrögoldódást, az Oxytocin összehúzza a méhet.'},{tx:'Adrenalin iv.',ok:false,fb:'Hibás. Az anafilaxiánál vagy újraélesztésnél kell.'}]},
        {sit:'Mennyi az Oxytocin adagolási léptéke a protokoll szerint?',opts:[{tx:'1 NE-ként titrálva.',ok:false,fb:'Hibás.'},{tx:'5 NE-ként adagolva iv.',ok:true,fb:'Helyes. Lassan, 5 Egységenként javasolt a 20 NE-es maximumig.'},{tx:'Egyben 50 NE.',ok:false,fb:'Hibás. Túl sok.'}]},
        {sit:'Ha elérhető a mentőben (vagy a megérkező ALS egységnél), milyen további készítmény adása jön szóba?',opts:[{tx:'2g fibrinogen iv.',ok:true,fb:'Helyes. A protokoll a fibrinogént is nevesíti.'},{tx:'Heparin.',ok:false,fb:'Hibás. Véralvadásgátló, fokozná a vérzést!'},{tx:'Aspirin.',ok:false,fb:'Hibás.'}]},
        {sit:'A gyógyszerek (Tranexámsav, Oxytocin, folyadék) hatására a vérzés mérséklődik, a vérnyomás normalizálódik. Mi a teendő a megszületett méhlepénnyel?',opts:[{tx:'Külön zacskóban a szemétbe dobom.',ok:false,fb:'Hibás.'},{tx:'Minden esetben be kell szállítani a szülőnővel és az újszülöttel együtt az intézetbe.',ok:true,fb:'Helyes. A kórházban alaposan meg kell vizsgálni a placentát.'},{tx:'Odaadjuk a családnak.',ok:false,fb:'Hibás.'}]},
        {sit:'Az ALS mentőegység (orvos/mentőtiszt) megérkezik, átveszi a beteg irányítását. A szállítás közben hova pozicionálod a babát?',opts:[{tx:'Továbbra is az anya hasán utazhat.',ok:false,fb:'Hibás. A szállítás során már nem maradhat ott biztonsági okokból.'},{tx:'A szabályok szerint rögzítőrendszerbe (pl. Spencer heveder, saját hordozó) teszem a hordágyon, és betakarom.',ok:true,fb:'Helyes. Biztonságos rögzítés és hővédelem a mentőben.'},{tx:'A kísérő hozzátartozó ölébe adom.',ok:false,fb:'Hibás. Nem biztonságos rögzítés.'}]}
    ],summary:'Összefoglaló (3. Szimuláció): A kitolási szakban fellépő váll-elakadást (dystocia) sikeresen megoldottuk a McRoberts-manőverrel (combok felhajlítása) és suprapubicus nyomással. Az újszülött rendben megszületett. Később a lepény megszületése után masszív vérzés indult. B+ kompetenciával azonnal nagy lumenű vénát biztosítottunk, ABCDE vizsgálatot végeztünk, és a shock elhárítására folyadékbolust, majd vérzéscsillapítókat adtunk (1g Tranexámsav, valamint 5-20 NE Oxytocin [5 NE-ként]). A vérzés mérséklődött, a megvizsgált lepényt pedig csomagolva eljuttattuk a kórházba a beteggel és a rögzített újszülöttel együtt.'},

    {id:4,title:'4. Extrém körülmények - Újszülött ellátás',diff:'B kompetencia',desc:'Hatalmas hóvihar van. Egy tanyára hívnak (B kompetencia), az út járhatatlan, alig tudtok bejutni. A kismama 40 hetes, a kitolási szak legvégén van. A neonatológiai mentő értesít, hogy minimum 60 perc a kiérkezése.',steps:[
        {sit:'Bár B kompetenciájú egység vagytok, egyértelmű, hogy a szállítás a hóvihar miatt esélytelen, és a baba perceken belül érkezik. Mi a teendő?',opts:[{tx:'Hordágyra teszem és megpróbálok a hóban kiverekedni vele.',ok:false,fb:'Hibás. A szállítás tilos és balesetveszélyes, a mentőben (vagy a házban) kell levezetni a szülést.'},{tx:'Helyszíni szüléskísérésre készülök (fűtés maximumra vétele a mentőben/házban, tiszta lepedők, steril készlet), hisz az indikációk fennállnak (kitolási szak + rendkívüli útviszonyok).',ok:true,fb:'Helyes. Ilyenkor a helyszínen kell biztonságos körülményeket teremteni.'},{tx:'Csak várom a szakorvost.',ok:false,fb:'Hibás. A szülés le fog zajlani a segítséged nélkül is, kísérned kell a folyamatot.'}]},
        {sit:'A baba rendben megszületik. Leitatod róla a nedvességet, és leteszed az édesanya mellkasára. Melyik 3 kérdést teszed fel magadnak az újszülött értékeléséhez?',opts:[{tx:'Cukros a lehelete? Lázas? Kék?',ok:false,fb:'Hibás.'},{tx:'Időre született? Légzik vagy sír? Jó-e az izomtónusa?',ok:true,fb:'Helyes. Ez a protokoll szerinti újszülött állapotfelmérés.'},{tx:'Van-e pulzusa? Mekkora a vérnyomása? Nyitva van a szeme?',ok:false,fb:'Hibás. Ezeket normál adaptációnál nem így mérjük az első másodpercekben.'}]},
        {sit:'A baba (40 hetes) rögtön felsír, aktívan mozgatja a végtagjait (jó tónus). A levegővétel picit szörcsögős. Szükséges leszívni a légutait?',opts:[{tx:'A légutakat rutinszerűen nem szükséges leszívni, csak ha nagy mennyiségű vagy darabos váladék akadályozza a légzést. Pici szörcsögésnél elég egy tiszta textíliával a száj környékét letörölni.',ok:true,fb:'Helyes. A rutinszerű szívás káros bradycardiát okozhat.'},{tx:'Igen, azonnal mélyen le kell szívni a garatot.',ok:false,fb:'Hibás. Rutinszerűen tilos.'},{tx:'Soha nem szabad a légutakhoz nyúlni.',ok:false,fb:'Hibás. Ha darabos váladék zárná el a légutat, akkor óvatosan le kéne szívni.'}]},
        {sit:'A baba jól van, a köldökzsinórt 1,5 perc múlva (pulzálás vége) elvágtad. A hóvihar és a hideg környezet hatalmas veszélyt jelent. Mi a legfontosabb teendő a hipotermia megelőzésére?',opts:[{tx:'Beteszem a babát egy hideg mózeskosárba.',ok:false,fb:'Hibás.'},{tx:'Az újszülöttet az édesanyja (vagy apja) mellkasán hagyom (bőr-bőr kontaktus), és őket egy egységként betakarom, beleértve a buborékfóliát is, így a felnőtt teste lesz a folyamatos hőforrás.',ok:true,fb:'Helyes. Ez a "Kenguru-módszer" a legjobb hővédelem.'},{tx:'Elkezdem dörzsölni hóval.',ok:false,fb:'Hibás.'}]},
        {sit:'Melyik beavatkozás / tevékenység a KIFEJEZETTEN KERÜLENDŐ a protokoll szerint a szülés utáni háborítatlan együttlét alatt?',opts:[{tx:'Az adminisztráció elkezdése magamban.',ok:false,fb:'Hibás. Azt te nyugodtan végezheted.'},{tx:'Minden olyan tevékenység, amely hátráltatja a békés adaptációt, például a gyermek felesleges mozgatása, fényképezése (még a szülő beleegyezésével sem!).',ok:true,fb:'Helyes. A protokoll szigorúan tiltja a fotózást és a zargatást.'},{tx:'Az anya megkérdezése, hogy hogy érzi magát.',ok:false,fb:'Hibás.'}]},
        {sit:'Eltelt 30 perc, a lepény is távozott a burkokkal együtt. Az időjárás kicsit csendesedik, a hókotró utat vágott. Készülsz a transzportra. A PIC (neonatológiai) mentő nem tudott jönni. Milyen speciális eszközt javasol a protokoll újszülöttek transzportjához/hővédelméhez?',opts:[{tx:'Átlátszó polietilén zsák (Neohelp), amely állítható kapucnival és backpad-del rendelkezik a hőkonzervációhoz.',ok:true,fb:'Helyes. A Neohelp kiváló a kis súlyú/veszélyeztetett újszülöttek melegen tartására, bár egészséges babáknál is szóba jöhet.'},{tx:'Kartonpapír doboz.',ok:false,fb:'Hibás.'},{tx:'Sima gézlap.',ok:false,fb:'Hibás.'}]},
        {sit:'Ha Neohelp-et vagy saját autós hordozót használsz, hogyan kell a mentő hordágyra rögzíteni?',opts:[{tx:'Csak leteszem a hordágyra, nem kell rögzíteni.',ok:false,fb:'Hibás. Súlyos balesetveszély.'},{tx:'A menetiránynak háttal, a felállított háttámlájú hordágyra rögzítve, a hordágy hevederének (vagy speciális pl. Spencer hevedernek) a használatával.',ok:true,fb:'Helyes. Menetiránynak háttal, hevederezve a legbiztonságosabb.'},{tx:'Menetiránnyal megegyezően, hogy kilásson az ablakon.',ok:false,fb:'Hibás.'}]},
        {sit:'Mi a helyzet az édesanyával a szállítás során?',opts:[{tx:'Ülve kell szállítani.',ok:false,fb:'Hibás.'},{tx:'Fekvő helyzetben, a biztonsági övekkel rögzítve.',ok:true,fb:'Helyes. A szülő nő biztonságos rögzítése is alapkövetelmény.'},{tx:'Sétálva a mentőben.',ok:false,fb:'Hibás.'}]},
        {sit:'Ha egyáltalán nincs semmilyen biztonságos újszülött-rögzítő eszközötök (nincs autós hordozó, nincs Spencer heveder), mit javasol a protokoll a szállításhoz?',opts:[{tx:'Anya ölében mégis el lehet vinni.',ok:false,fb:'Hibás. Tilos.'},{tx:'Biztonságos rögzítő eszközök hiányában segélykocsi hívása indokolt.',ok:true,fb:'Helyes. Biztonság kompromisszum nélkül.'},{tx:'A mentőpadra kell fektetni.',ok:false,fb:'Hibás.'}]},
        {sit:'Végül a férj hoz egy hitelesített autós újszülött hordozót a házból. Be tudjátok szíjazni a mentő hordágyára. Készen álltok az indulásra. Kit visztek magatokkal?',opts:[{tx:'Csak az anyát, a babát otthagyjuk az apával.',ok:false,fb:'Hibás. Újszülöttet kórházba kell vinni vizsgálatra.'},{tx:'Az édesanyát, az újszülöttet (szabályosan rögzítve), és a hiánytalan (megvizsgált) méhlepényt a burkokkal együtt.',ok:true,fb:'Helyes. Mindhárom be kell hogy érkezzen a szülészetre.'},{tx:'Csak a babát, az anya jöhet a hókotróval.',ok:false,fb:'Hibás.'}]}
    ],summary:'Összefoglaló (4. Szimuláció): Az extrém időjárás miatt a szállítás kizárt volt, így helyszíni szülést kísértünk. A baba jól alkalmazkodott (időre született, felsírt, mozgott). A magzatmázat nem távolítottuk el, a légutakat nem szívtuk le, mert csak pici váladék volt. Bőr-bőr kontaktust alkalmaztunk az édesanyával a kritikus hipotermia elkerülésére (buborékfóliával betakarva őket). A fotózást, felesleges mozgatást elutasítottuk. A transzporthoz az újszülöttet szabályosan, a férj által hozott autós hordozóban (menetiránynak háttal a felállított hordágytámlánál hevederezve) rögzítettük, és az anyával valamint a méhlepénnyel együtt biztonságosan kórházba vittük.'}
];

function renderCalc() {

function rb(b) {
    if (b.tp === 'sub') return '<div class="sub">' + formatText(b.tx) + '</div>';
    if (b.tp === 'bl') {
        var str = '<ul class="bl">';
        for (var i = 0; i < b.items.length; i++) {
            str += '<li>' + formatText(b.items[i]) + '</li>';
        }
        return str + '</ul>';
    }
    if (b.tp === 'kr') {
        var str2 = '<div>';
        for (var j = 0; j < b.items.length; j++) {
            str2 += '<div class="kr">✓ &nbsp;' + formatText(b.items[j]) + '</div>';
        }
        return str2 + '</div>';
    }
    if (b.tp === 'al') return '<div class="al al-' + b.lv + '">' + formatText(b.tx) + '</div>';
    if (b.tp === 'note') return '<div class="note">' + formatText(b.tx) + '</div>';
    if (b.tp === 'steps') {
        var str3 = '';
        for (var k = 0; k < b.items.length; k++) {
            var s = b.items[k];
            str3 += '<div class="step-wrap"><div class="step-num">' + s.n + '</div><div class="step-body"><div class="step-t">' + formatText(s.t) + '</div><div class="step-x">' + formatText(s.x) + '</div></div></div>';
        }
        return str3;
    }
    return '';
}

window.pickQ = function(i) {
    if (QZ.sel !== null) return;
    QZ.sel = i;
    var ok = (i === QUIZ[QZ.idx].ok);
    if (ok) QZ.score++;
    QZ.ans.push({qi: QZ.idx, pi: i, ok: ok});
    window.render();
};

window.nextQ = function() {
    if (QZ.idx < QUIZ.length - 1) { QZ.idx++; QZ.sel = null; }
    else QZ.done = true;
    window.render();
};

    var str2 = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">' + (QZ.idx + 1) + '/' + QUIZ.length + '</span></div>' +
    '<div class="prog"><div class="progb" style="width:' + pWidth + '%;background:#14b8a6"></div></div>' +
    '<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">' + formatText(q.q) + '</p></div>';
    
    for (var i = 0; i < q.opts.length; i++) {
        var cls = 'opt';
        if (QZ.sel !== null) {
            if (i === q.ok) cls += ' opt-ok';
            else if (i === QZ.sel) cls += ' opt-no';
        }
        str2 += '<button class="' + cls + '" onclick="window.pickQ(' + i + ')">' + formatText(q.opts[i]) + '</button>';
    }
    
    if (QZ.sel !== null) {
        str2 += '<div class="al al-i" style="margin-bottom:.75rem">' + formatText(q.exp) + '</div><button class="btn btn-g btn-fw" onclick="window.nextQ()">' + (QZ.idx < QUIZ.length - 1 ? 'Következő kérdés →' : 'Eredmények') + '</button>';
    }
    return str2;
}

window.chooseSim = function(i) {
    if (SI.chosen !== null) return;
    SI.chosen = i;
    SI.hist.push({step: SI.step, oi: i});
    window.render();
};

window.nextSim = function() {
    var sim = null;
    for (var i = 0; i < SIMS.length; i++) {
        if (SIMS[i].id === SI.id) { sim = SIMS[i]; break; }
    }
    if (SI.step < sim.steps.length - 1) { SI.step++; SI.chosen = null; }
    else SI.fin = true;
    window.render();
};

function renderSim() {
    if (!SI.id) {
        var str = '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>';
        for (var i = 0; i < SIMS.length; i++) {
            var s = SIMS[i];
            var tgClass = (s.diff === 'B kompetencia' ? 'tag-g' : 'tag-y');
            str += '<button class="card-btn" onclick="SI.id=' + s.id + ';SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;window.render();"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">' + formatText(s.title) + '</div>' +
            '<span class="tag ' + tgClass + '">' + s.diff + '</span></div>' +
            '<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">' + formatText(s.desc) + '</div>' +
            '<div style="font-size:11px;color:#9ca3af">' + s.steps.length + ' döntési pont</div></button>';
        }
        return str;
    }
    
    var sim = null;
    for (var j = 0; j < SIMS.length; j++) {
        if (SIMS[j].id === SI.id) { sim = SIMS[j]; break; }
    }
    
    if (SI.fin) {
        var correct = 0;
        for (var k = 0; k < SI.hist.length; k++) {
            if (sim.steps[SI.hist[k].step].opts[SI.hist[k].oi].ok) correct++;
        }
        
        var str2 = '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">' + formatText(sim.title) + ' - Eredmény</h2>' +
        '<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">' +
        '<div style="font-size:36px;font-weight:700;color:#4ade80">' + correct + '/' + sim.steps.length + '</div>' +
        '<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>' +
        '<div class="al al-i"><strong>Összefoglaló:</strong><br>' + formatText(sim.summary) + '</div>';
        
        for (var m = 0; m < SI.hist.length; m++) {
            var hh = SI.hist[m];
            var st = sim.steps[hh.step];
            var opt = st.opts[hh.oi];
            var okCol = opt.ok ? '#4ade80' : '#fca5a5';
            var okMark = opt.ok ? '✓' : '✗';
            str2 += '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">' + (m + 1) + '. ' + formatText(st.sit) + '</div><div style="font-size:11px;margin-bottom:3px;color:' + okCol + '">' + okMark + ' ' + formatText(opt.tx) + '</div><div style="font-size:11px;color:#9ca3af">' + formatText(opt.fb) + '</div></div>';
        }
        
        str2 += '<button class="btn btn-r btn-fw" onclick="SI={id:null,step:0,chosen:null,hist:[],fin:false};window.render();" style="margin-top:10px">Vissza az esetekhez</button>';
        return str2;
    }
    
    var step = sim.steps[SI.step];
    var sWidth = ((SI.step + 1) / sim.steps.length * 100);
    
    var str3 = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">' + formatText(sim.title) + '</div><span style="font-size:12px;color:#9ca3af">' + (SI.step + 1) + '/' + sim.steps.length + '</span></div>' +
    '<div class="prog"><div class="progb" style="width:' + sWidth + '%;background:#ef4444"></div></div>' +
    (SI.step === 0 ? '<div class="al al-i">' + formatText(sim.desc) + '</div>' : '') +
    '<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">' + formatText(step.sit) + '</p></div>';
    
    for (var n = 0; n < step.opts.length; n++) {
        var cls2 = 'opt';
        if (SI.chosen !== null) {
            if (step.opts[n].ok) cls2 += ' opt-ok';
            else if (n === SI.chosen) cls2 += ' opt-no';
        }
        str3 += '<button class="' + cls2 + '" onclick="window.chooseSim(' + n + ')">' + formatText(step.opts[n].tx) + '</button>';
    }
    
    if (SI.chosen !== null) {
        var aClass = step.opts[SI.chosen].ok ? 'al-s' : 'al-d';
        var nextTx = (SI.step < sim.steps.length - 1 ? 'Következő helyzet →' : 'Összefoglaló');
        str3 += '<div class="al ' + aClass + '">' + formatText(step.opts[SI.chosen].fb) + '</div><button class="btn btn-r btn-fw" onclick="window.nextSim()">' + nextTx + '</button>';
    }
    return str3;
}

window.render = function() {
    var c = document.getElementById('ct');
    if (!c) return;
    
    c.innerHTML = '';
    if (SCR === 'home') c.innerHTML = renderHome();
    else if (SCR === 'chapters') c.innerHTML = renderChapters();
    else if (SCR === 'chapter') c.innerHTML = renderChapter(CHID);
    else if (SCR === 'flash') c.innerHTML = renderFlash();
    else if (SCR === 'quiz') c.innerHTML = renderQuiz();
    else if (SCR === 'sim') c.innerHTML = renderSim();
    else if (SCR === 'calc') c.innerHTML = renderCalc();
    
    var tabs = ['home', 'chapters', 'flash', 'quiz', 'sim', 'calc'];
    var active = (SCR === 'chapter' ? 'chapters' : SCR);
    var nbs = document.querySelectorAll('.nb');
    for (var i = 0; i < nbs.length; i++) {
        if (tabs[i] === active) {
            nbs[i].className = 'nb act';
        } else {
            nbs[i].className = 'nb';
        }
    }
    window.scrollTo(0, 0);
};

window.go = function(s, id) {
    SCR = s;
    CHID = id || null;
    window.render();
};

window.setCat = function(c) {
    FC.cat = c;
    FC.idx = 0;
    FC.flip = false;
    window.render();
};

window.onload = function() {
    window.render();
};

</script>
</body>
</html>
