// ── HTML GENERÁLÁS ÉS SEGÉDFÜGGVÉNYEK ──────────────────────────────

function h(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function glossText(text) {
    let t = h(text);
    // Explicit tagek keresése, pl. [[stridor]]
    t = t.replace(/\[\[(.*?)\]\]/g, function(match, word) {
        return `<span class="gloss" onclick="showGloss('${word}')">${word}</span>`;
    });
    
    // Automatikus keresés a szövegben, HTML tageken kívül
    const terms = Object.keys(GLOSS);
    terms.forEach(term => {
        // A magyar ABC betűit figyelembe vevő szóhatár Regex
        let regex = new RegExp(`(^|[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ])(${term})(?=[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]|$)(?![^<]*>)`, 'gi');
        t = t.replace(regex, `$1<span class="gloss" onclick="showGloss('${term}')">$2</span>`);
    });
    return t;
}

function rb(b) {
    if(b.tp === 'sub') return `<div class="sub">${h(b.tx)}</div>`;
    if(b.tp === 'bl') return `<ul class="bl">${b.items.map(i => `<li>${glossText(i)}</li>`).join('')}</ul>`;
    if(b.tp === 'kr') return `<div>${b.items.map(i => `<div class="kr">✓ &nbsp;${glossText(i)}</div>`).join('')}</div>`;
    if(b.tp === 'al') return `<div class="al al-${b.lv}">${glossText(b.tx)}</div>`;
    if(b.tp === 'note') return `<div class="note">${glossText(b.tx)}</div>`;
    if(b.tp === 'status3') {
        return `<div class="g3" style="margin-bottom:.75rem">
            <div style="background:#064e3b;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#bbf7d0">ENYHE KRUPP<br>1 - 2 pont</div>
            <div style="background:#451a03;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#fde68a">KÖZÉPSÚLYOS<br>3 - 5 pont</div>
            <div style="background:#450a0a;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#fca5a5">SÚLYOS KRUPP<br>6 pont felett</div>
        </div>`;
    }
    if(b.tp === 'score_table') return renderScoreTable();
    return '';
}

function renderScoreTable() {
    var rows = [
        ['Belégzési hang', 'normál (0)', 'érdes (1)', 'gyengült (2)'],
        ['Stridor', 'nincs (0)', 'belégzésben (1)', 'be- és kilégzésben (2)'],

    return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <div style="font-size:15px;font-weight:700;color:#f3f4f6">${h(sim.title)}</div>
        <span style="font-size:12px;color:#9ca3af">${(SI.step + 1)}/${sim.steps.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((SI.step + 1) / sim.steps.length * 100)}%;background:#ef4444"></div></div>
    ${SI.step === 0 ? `<div class="al al-i">${h(sim.desc)}</div>` : ''}
    <div class="card" style="margin-bottom:.75rem;background:#262626">
        <p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">${glossText(step.sit)}</p>
    </div>
    ${step.opts.map((opt, i) => {
        var cls = 'opt';
        if(SI.chosen !== null) {
            if(opt.ok) cls += ' opt-ok';
            else if(i === SI.chosen && !opt.ok) cls += ' opt-no';
        }
        return `<button class="${cls}" ${SI.chosen === null ? `onclick="chooseSim(${i})"` : ''}>${h(opt.tx)}</button>`;
    }).join('')}
    ${SI.chosen !== null ? `
        <div class="al ${step.opts[SI.chosen].ok ? 'al-s' : 'al-d'}">${glossText(step.opts[SI.chosen].fb)}</div>
        <button class="btn btn-r btn-fw" onclick="nextSim()">${SI.step < sim.steps.length - 1 ? 'Következő helyzet →' : 'Összefoglaló'}</button>
    ` : ''}`;
}

function calcCroupScore() {
    var tot = CA.cs1 + CA.cs2 + CA.cs3 + CA.cs4 + CA.cs5;
    var lbl = tot >= 6 ? 'SÚLYOS KRUPP' : tot >= 3 ? 'KÖZÉPSÚLYOS KRUPP' : 'ENYHE KRUPP';
    var col = tot >= 6 ? '#fca5a5' : tot >= 3 ? '#fde68a' : '#4ade80';
    var bg = tot >= 6 ? '#450a0a' : tot >= 3 ? '#451a03' : '#064e3b';
    return { tot: tot, lbl: lbl, col: col, bg: bg };
}

function calcSteroid() {
    var dexMg = 0;
    var dexTab = 0;
    var w = CA.w;
    if(w < 10) { dexMg = 2; dexTab = 0.5; }
    else if(w < 15) { dexMg = 4; dexTab = 1.0; }
    else if(w <= 20) { dexMg = 6; dexTab = 1.5; }
    else { dexMg = 8; dexTab = 2.0; }
    return { mg: dexMg, tab: dexTab };
}

function renderCalc() {
    function tabBtn(id, lbl) {
        return `<button onclick="setCalcTab('${id}')" style="flex:1;padding:.5rem;border:1px solid ${CA.tab === id ? '#14b8a6' : '#3f3f3f'};border-radius:8px;background:${CA.tab === id ? '#14b8a6' : '#2a2a2a'};color:${CA.tab === id ? '#111827' : '#d1d5db'};cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">${lbl}</button>`;
    }
    
    function sel(lb, id, opts, val, fn) {
        return `<div style="margin-bottom:.65rem">
            <div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">${lb}</div>
            <select id="${id}" onchange="${fn}(this.value)">
                ${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${v} pont – ${h(l)}</option>`).join('')}
            </select>
        </div>`;
    }

    if(CA.tab === 'score') {
        var res = calcCroupScore();
        return `<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátor</h2>
        <div style="display:flex;gap:7px;margin-bottom:.75rem">
            ${tabBtn('score', 'Croup Score')}
            ${tabBtn('steroid', 'Szteroid Dózis')}
        </div>
        ${sel('Belégzési hang', 'cs1', [['0', 'normál'], ['1', 'érdes'], ['2', 'gyengült']], CA.cs1, 'setCS1')}
        ${sel('Stridor', 'cs2', [['0', 'nincs'], ['1', 'belégzésben'], ['2', 'be- és kilégzésben is']], CA.cs2, 'setCS2')}
        ${sel('Köhögés', 'cs3', [['0', 'nincs'], ['1', 'rekedtség'], ['2', 'ugató']], CA.cs3, 'setCS3')}
        ${sel('Mellkasi behúzódás', 'cs4', [['0', 'nincs'], ['1', 'jugularis'], ['2', 'jugularis, sternalis, intercostalis']], CA.cs4, 'setCS4')}
        ${sel('Cyanosis', 'cs5', [['0', 'nincs'], ['1', 'körlevegőn'], ['2', 'oxigén adagolása mellett is']], CA.cs5, 'setCS5')}
        <div class="res-box" id="cs_box" style="background:${res.bg};border:1px solid ${res.col}40">
            <div class="res-num" id="cs_num" style="color:${res.col}">${res.tot} pont</div>
            <div class="res-lbl" id="cs_lbl" style="color:${res.col};font-weight:700">${h(res.lbl)}</div>
        </div>`;
    } else {
        var sres = calcSteroid();
        return `<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátor</h2>
        <div style="display:flex;gap:7px;margin-bottom:.75rem">
            ${tabBtn('score', 'Croup Score')}
            ${tabBtn('steroid', 'Szteroid Dózis')}
        </div>
        <div class="card">
            <div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Gyermek testtömege (kg)</div>
            <input type="number" id="weightInput" min="1" max="100" value="${CA.w}" oninput="updateSteroid(this.value)">
            
            <div class="res-box" style="background:#172554;border:1px solid #1e3a8a;margin-top:1rem">
                <div style="font-size:12px;color:#bfdbfe;margin-bottom:4px;font-weight:600">Dexametazon tabletta p.o. (első választandó)</div>
                <div id="dex_mg" style="font-size:28px;font-weight:700;color:#60a5fa;margin-bottom:2px">${sres.mg} mg</div>
                <div id="dex_tab" style="font-size:12px;color:#9ca3af;margin-bottom:1rem">(${sres.tab} db 4 mg-os tabletta)</div>
                <div style="font-size:12px;color:#bfdbfe;margin-bottom:4px;font-weight:600">VAGY Prednizon kúp p.r. (alternatíva)</div>
                <div style="font-size:22px;font-weight:700;color:#60a5fa">30 mg</div>
            </div>
            <div style="font-size:12px;color:#9ca3af;margin-top:1rem;line-height:1.5">A tablettát összetörve, édes folyadékban (tea, szörp) javasolt beadni a szülő bevonásával. Ne erőltessük, kerüljük a sírást! <b>Figyelem:</b> Csak egyfajta készítményt alkalmazzunk!</div>
        </div>`;
    }
}

function render() {
    var c = document.getElementById('ct');
    c.innerHTML = '';
    if(SCR === 'home') c.innerHTML = renderHome();
    else if(SCR === 'chapters') c.innerHTML = renderChapters();
    else if(SCR === 'chapter') c.innerHTML = renderChapter(CHID);
    else if(SCR === 'flash') c.innerHTML = renderFlash();
    else if(SCR === 'quiz') c.innerHTML = renderQuiz();
    else if(SCR === 'sim') c.innerHTML = renderSim();
    else if(SCR === 'calc') c.innerHTML = renderCalc();
    
    var tabs = ['home', 'chapters', 'flash', 'quiz', 'sim', 'calc'];
    var active = SCR === 'chapter' ? 'chapters' : SCR;
    document.querySelectorAll('.nb').forEach(function(b, i) {
        b.classList.toggle('act', tabs[i] === active);
    });
    window.scrollTo(0, 0);
}

// ── VEZÉRLŐ LOGIKA (ACTIONS) ───────────────────────────────────────

window.go = function(s, id) { SCR = s; CHID = id || null; render(); };
window.setCat = function(c) { FC.cat = c; FC.idx = 0; FC.flip = false; render(); };
window.flipCard = function() { FC.flip = !FC.flip; render(); };
window.navCard = function(d) {
    var f = FC.cat === 'Összes' ? CARDS : CARDS.filter(c => c.cat === FC.cat);
    FC.flip = false;
    FC.idx = (FC.idx + d + f.length) % f.length;
    render();
};
window.pickQ = function(i) {
    if(QZ.sel !== null) return;
    QZ.sel = i;
    var ok = (i === QUIZ[QZ.idx].ok);
    if(ok) QZ.score++;
    QZ.ans.push({ qi: QZ.idx, pi: i, ok: ok });
    render();
};
window.nextQ = function() {
    if(QZ.idx < QUIZ.length - 1) { QZ.idx++; QZ.sel = null; }
    else { QZ.done = true; }
    render();
};
window.resetQuiz = function() { QZ = { idx: 0, sel: null, score: 0, done: false, ans: [] }; render(); };
window.startSim = function(id) { SI.id = id; SI.step = 0; SI.chosen = null; SI.hist = []; SI.fin = false; render(); };
window.chooseSim = function(i) {
    if(SI.chosen !== null) return;
    SI.chosen = i;
    SI.hist.push({ step: SI.step, oi: i });
    render();
};
window.nextSim = function() {
    var sim = SIMS.find(s => s.id === SI.id);
    if(SI.step < sim.steps.length - 1) { SI.step++; SI.chosen = null; }
    else { SI.fin = true; }
    render();
};
window.resetSim = function() { SI = { id: null, step: 0, chosen: null, hist: [], fin: false }; render(); };
window.setCalcTab = function(t) { CA.tab = t; render(); };

// --- DOM MANIPULÁCIÓK A FÓKUSZ MEGTARTÁSÁÉRT (render() hívás nélkül) ---

window.updateCS = function() {
    var res = calcCroupScore();
    var box = document.getElementById('cs_box');
    var num = document.getElementById('cs_num');
    var lbl = document.getElementById('cs_lbl');
    if (box) {
        box.style.background = res.bg;
        box.style.borderColor = res.col + '40';
    }
    if (num) {
        num.style.color = res.col;
        num.innerText = res.tot + ' pont';
    }
    if (lbl) {
        lbl.style.color = res.col;
        lbl.innerText = res.lbl;
    }
};

window.setCS1 = function(v) { CA.cs1 = +v; updateCS(); };
window.setCS2 = function(v) { CA.cs2 = +v; updateCS(); };
window.setCS3 = function(v) { CA.cs3 = +v; updateCS(); };
window.setCS4 = function(v) { CA.cs4 = +v; updateCS(); };
window.setCS5 = function(v) { CA.cs5 = +v; updateCS(); };

window.updateSteroid = function(v) {
    CA.w = +v;
    var sres = calcSteroid();
    var mgEl = document.getElementById('dex_mg');
    var tabEl = document.getElementById('dex_tab');
    if(mgEl) mgEl.innerText = sres.mg + ' mg';
    if(tabEl) tabEl.innerText = '(' + sres.tab + ' db 4 mg-os tabletta)';
};

// Szótár Modális Ablak Vezérlés
window.showGloss = function(term) {
    var title = document.getElementById('glossTitle');
    var text = document.getElementById('glossText');
    var modal = document.getElementById('glossModal');
    // Kisbetűssé alakítva keressük a kulcsot
    var termKey = term.toLowerCase(); 
    if(GLOSS[termKey]) {
        title.innerText = term.charAt(0).toUpperCase() + term.slice(1);
        text.innerText = GLOSS[termKey];
        modal.classList.add('show');
    }
};

window.hideGloss = function(e) {
    if(e) e.stopPropagation();
    var modal = document.getElementById('glossModal');
    modal.classList.remove('show');
};

// Indítás
render();
</script>
</body>
</html>
