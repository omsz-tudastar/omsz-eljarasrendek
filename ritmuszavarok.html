<html lang="hu">
<head>

<title>OMSZ – Ritmuszavarok Prehospitális Ellátása</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;line-height:1.5;}
.app{max-width:680px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);position:relative;}
/* NAV */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.nb{flex:1;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#14b8a6;}
.ni{font-size:16px;}
.nl{font-size:9px;color:#9ca3af;font-weight:400;}
.nb.act .nl{color:#14b8a6;font-weight:600;}
/* CONTENT */
.ct{padding:1rem;}
/* CARDS */
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}
/* ALERTS */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
.note{font-size:12px;color:#9ca3af;padding:.5rem .75rem;background:#262626;border-radius:8px;margin-bottom:.5rem;line-height:1.5;border:1px solid #333;}
.sub{font-size:13px;font-weight:600;color:#d1d5db;margin:.75rem 0 .35rem;}
ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.2rem;}
.kr{display:flex;gap:8px;align-items:flex-start;padding:.5rem .75rem;background:#064e3b20;border-radius:8px;margin-bottom:5px;font-size:13px;color:#d1d5db;line-height:1.5;border-left:3px solid #14b8a6;}
/* STEP WRAPS */
.step-wrap{display:flex;gap:10px;margin-bottom:10px;}
.step-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#14b8a6;color:#111827;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.step-body{flex:1;background:#262626;border-radius:8px;padding:.5rem .75rem;}
.step-t{font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:.2rem;}
.step-x{font-size:12px;color:#9ca3af;line-height:1.6;white-space:pre-line;}
/* TABLES */
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:5px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:5px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;}
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}
/* PROGRESS */
.prog{height:4px;background:#333;border-radius:2px;margin-bottom:1rem;}
.progb{height:4px;border-radius:2px;transition:width .3s;}
/* BUTTONS */
.btn{padding:.55rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;transition:all .15s;}
.btn:hover{background:#374151;}
.btn-g{background:#0d9488;color:#fff;border-color:#0d9488;}
.btn-g:hover{background:#0f766e;}
.btn-r{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn-v{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.btn-fw{width:100%;display:block;text-align:center;padding:.75rem;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;text-align:center;}
/* QUIZ/SIM OPTIONS */
.opt{width:100%;display:block;padding:.7rem 1rem;margin-bottom:7px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}
/* FLIP CARD */
.flip{border:2px solid #3f3f3f;border-radius:12px;padding:1.5rem;min-height:175px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:.75rem;background:#262626;}
.flip.on{border-color:#a78bfa;}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* RESULT */
.res-box{border-radius:12px;padding:1rem;text-align:center;margin-top:.75rem;}
.res-num{font-size:42px;font-weight:700;}
.res-lbl{font-size:14px;margin:.3rem 0;}
/* INPUTS */
input[type=number]{width:100%;accent-color:#14b8a6;border:1px solid #4b5563;border-radius:8px;padding:8px;color:#e5e7eb;font-family:inherit;background:#2a2a2a;}
/* GLOSSARY MODAL */
.glos{color:#38bdf8;text-decoration:underline;text-decoration-style:dotted;cursor:pointer;}
.mod-ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;display:none;justify-content:center;align-items:center;padding:1rem;opacity:0;transition:opacity 0.2s;}
.mod-ov.act{display:flex;opacity:1;}
.mod-bx{background:#1e1e1e;border:1px solid #3f3f3f;border-radius:12px;padding:1.5rem;max-width:400px;width:100%;position:relative;}
.mod-cl{position:absolute;top:10px;right:10px;background:none;border:none;color:#9ca3af;font-size:24px;cursor:pointer;line-height:1;}
.mod-t{font-size:16px;font-weight:700;color:#f3f4f6;margin-bottom:8px;padding-right:20px;}
.mod-d{font-size:13px;color:#d1d5db;line-height:1.5;}
/* HOME GRID */
.home-mod{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;color:#e5e7eb;}
.home-mod:hover{background:#333;border-color:#4b5563;transform:translateY(-1px);}
.home-mod-icon{font-size:26px;margin-bottom:6px;}
.home-mod-title{font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:2px;}
.home-mod-desc{font-size:11px;color:#9ca3af;}
/* TAGS */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.tag-g{background:#064e3b;color:#ecfdf5;}
.tag-y{background:#78350f;color:#fef3c7;}
.ch-row{display:flex;align-items:center;gap:10px;background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.75rem 1rem;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.ch-row:hover{background:#333;}
@media(max-width:480px){.tbl-wrap table{min-width:340px;}}
</style>
</head>

function linkGlos(txt) {
  let res = txt;
  for (let key in GLOSSARY) {
    let regex = new RegExp(`\\b(${key})\\b`, 'gi');
    res = res.replace(regex, `<span class="glos" onclick="showGlos('${key}')">$&</span>`);
  }
  return res;
}

window.showGlos = function(key) {
  let term = key.toLowerCase();
  if(GLOSSARY[term]) {
    document.getElementById('mod-t').innerText = term.charAt(0).toUpperCase() + term.slice(1);
    document.getElementById('mod-d').innerText = GLOSSARY[term];
    document.getElementById('mod').classList.add('act');
  }
};
window.closeGlos = function(e) {
  if(e) e.stopPropagation();
  document.getElementById('mod').classList.remove('act');
};

var SIMS=[
{id:1,title:'1. Szimuláció: Instabil Bradycardia (B kompetencia)',diff:'B kompetencia',desc:'Egy 65 éves férfihöz riasztanak. A beteg sápadt, verejtékes, mellkasi fájdalomra panaszkodik. B kompetencia (gyógyszerelés NINCS).',steps:[
{sit:'Megérkezel a beteghez. Az ABCDE vizsgálat során a "C" pontnál a pulzusa nagyon lassú, 35/perc. A vérnyomása 80/50 Hgmm. A beteg mellkasi fájdalomra panaszkodik. Mi az első benyomás az eljárásrend alapján?',opts:[{tx:'A beteg stabil, csak megfigyelést igényel.',ok:false,fb:'Hibás! A mellkasi fájdalom (ischaemia) és alacsony vérnyomás (shock) instabilitást jelent.'},{tx:'A beteg hemodinamikailag instabil bradycardiás, sürgős beavatkozást és magasabb kompetenciát (segélykocsit) igényel.',ok:true,fb:'Helyes! Az ischaemia és shock jelei instabilitásra utalnak.'},{tx:'A bradycardia nem okozhat ilyet, biztos stroke.',ok:false,fb:'Hibás! A <40/min frekvencia okozhat jelentős instabilitást.'}]},
{sit:'B kompetenciával érkeztél. Mi az a KÖTELEZŐ protokolláris lépés, amit instabil ritmuszavar észlelésekor azonnal meg kell tenned?',opts:[{tx:'Azonnal atropint adok.',ok:false,fb:'Hibás! B kompetencia nem adhat atropint.'},{tx:'Segélykocsit (orvost/mentőtisztet) kérek a helyszínre.',ok:true,fb:'Helyes! Instabilitás esetén kompetencia hiányában a segélykocsi kérése kötelező.'},{tx:'Azonnal CPR-t kezdek.',ok:false,fb:'Hibás! A betegnek van pulzusa és eszmélete.'}]},
{sit:'A segélykocsi úton van. Milyen monitorozást teszel fel a betegre a "párhuzamos teendők" alapján?',opts:[{tx:'Csak vérnyomásmérőt, mert B kompetencia nem tud EKG-t értékelni.',ok:false,fb:'Hibás! Monitorozás és 12-elvezetéses EKG mindenkinél kötelező, ha a helyzet engedi.'},{tx:'EKG monitor, NIBP, SpO2, és 12-elvezetéses EKG-t készítek, oxigént adok szükség szerint.',ok:true,fb:'Helyes! Ez az alapvető ritmuszavar teendő.'},{tx:'Semmit, várom az orvost.',ok:false,fb:'Hibás! A monitorozás és állapotfelmérés folyamatos.'}]},
{sit:'A 12-elvezetéses EKG elkészült. A gép III. fokú AV blokkot (teljes disszociáció) jelez. Mi a helyzet a reverzibilis okokkal?',opts:[{tx:'Mérlegelem, hogy lehet-e szekunder (pl. mérgezés, hypoxia), és kikérdezem a gyógyszerszedésről (béta-blokkolók).',ok:true,fb:'Helyes! Szekunder okok kizárása mindig elsődleges.'},{tx:'Minden blokk primer, nem kell anamnézis.',ok:false,fb:'Hibás! Lehet gyógyszermérgezés is.'},{tx:'Adok glükagont mindenképp.',ok:false,fb:'Hibás! B szinten nem adsz gyógyszert, és még nincs gyanú.'}]},
{sit:'A beteg állapota romlik, a tudata beszűkül. Milyen fizikai beavatkozást kell előkészítened az ALS egység megérkezéséig?',opts:[{tx:'Lélegeztetőgépet szerelékkel.',ok:false,fb:'Hibás! A keringéssel van a baj.'},{tx:'A defibrillátor öntapadós elektródáit (pacemaker/cardioversio céljából) felhelyezem a betegre.',ok:true,fb:'Helyes! Az ALS egység transcutan pacemakert fog használni az instabil bradycardia miatt.'},{tx:'Mellkasi kompressziós gépet.',ok:false,fb:'Hibás! A beteg még nem asystoliás.'}]},
{sit:'Az elektródák felhelyezése megtörtént. Milyen elektródapozíciót ajánl az eljárásrend felragasztható elektródák esetén?',opts:[{tx:'Kizárólag az anterolateralis (mellkas jobb fele és bal hónalj) pozíciót.',ok:false,fb:'Hibás! A protokoll mást is javasol.'},{tx:'Anteroposterior (AP) pozíció ajánlott (elöl a szív felett, hátul a lapocka alatt).',ok:true,fb:'Helyes! Felragasztható elektródáknál a jobb átívelés érdekében ez javasolt.'},{tx:'A nyakra és a mellkasra.',ok:false,fb:'Hibás! Tilos a nyakra tenni.'}]},
{sit:'Megérkezik a rohamkocsi (ALS). Az orvos utasítást ad a transcutan pacemaker (PM) bekapcsolására 70/perc fix frekvenciával. Emelik az áramerősséget. Mit kell figyelned az EKG monitoron?',opts:[{tx:'A vérnyomás emelkedését a monitoron.',ok:false,fb:'Hibás! A NIBP mérés nem ad másodperces visszajelzést.'},{tx:'Az elektromos vezérlés (capture) megjelenését: a PM spike-ok után széles QRS és T-hullám látható.',ok:true,fb:'Helyes! Ez az elektromos válasz bizonyítéka.'},{tx:'A P-hullámok megjelenését a spike után.',ok:false,fb:'Hibás! A PM a kamrát ingerli (QRS).'}]},
{sit:'A monitoron megjelent az elektromos capture. Ezzel kész is vagyunk, a beteg keringése biztosított?',opts:[{tx:'Igen, az EKG kép mindent elmond.',ok:false,fb:'Hibás! Az EKG elektromos jelenség, a szívizom mechanikus válasza nem garantált (PEA).'},{tx:'Nem! A mechanikus capture-t is ellenőrizni kell a perifériás (vagy a. femoralis) pulzus tapintásával és az SpO2 pulzushullámával.',ok:true,fb:'Helyes! Az eljárásrend kiemeli, hogy a spike és a QRS nem egyenlő a hatásos keringéssel.'},{tx:'Csak ha a gép kiírja, hogy "Keringés OK".',ok:false,fb:'Hibás! Gép nem ír ilyet.'}]},
{sit:'A pulzus jól tapintható, megegyezik a PM frekvenciájával (70/min). A beteg tudata tisztul. Milyen üzemmódba érdemes váltani a pacemakert a stabilitás elérése után?',opts:[{tx:'Ki kell kapcsolni, mert már jól van.',ok:false,fb:'Hibás! Vissza fog esni a pulzusa.'},{tx:'Demand (készenléti) üzemmódba javasolt váltani.',ok:true,fb:'Helyes! Így csak akkor üt, ha a beteg saját frekvenciája a beállított alá esik.'},{tx:'Defibrillátor módba.',ok:false,fb:'Hibás! Az áramütést okozna.'}]},
{sit:'A szállítás során a beteg nyugtalan a PM kellemetlen ingerlése miatt. Az eljárásrend alapján mi a megfelelő lépés az ALS egység részéről?',opts:[{tx:'Ki kell kapcsolni a pacemakert.',ok:false,fb:'Hibás! A keringés fenntartása kritikus.'},{tx:'PSA (Procedurális Szedáció és Analgézia) alkalmazása (pl. Fentanil, Ketamin) a komfort biztosítására.',ok:true,fb:'Helyes! A transcutan PM fájdalmas, szedációt/analgéziát igényel.'},{tx:'Szorosan le kell kötözni a beteget.',ok:false,fb:'Hibás! Ez nem humánus és nem oldja meg a fájdalmat.'}]}
],summary:'Összefoglaló (Instabil Bradycardia, B kompetencia): A sápadt, alacsony vérnyomású (80/50), mellkasi fájdalommal küzdő bradycardiás beteg egyértelműen instabil. B kompetencia hiányában (nincs gyógyszer, pl. Atropin) azonnal segélykocsit kellett kérni! A várakozás alatt megtörtént a monitorozás, O2 adás és az EKG felvétele. Az állapot romlása miatt az ALS megérkezéséig előkészítettük a defibrillátort és feltettük a ragasztható elektródákat anteroposterior pozícióban. Az ALS egység transcutan pacemakert indított. Figyeltük a monitort az elektromos capture (spike + QRS) miatt, és kötelezően ellenőriztük a mechanikus capture-t (a. femoralis tapintása), mivel az EKG önmagában nem garantálja a pulzust. A stabilizáció után a PM-et demand módba tették, és a fájdalmas ingerlés miatt a beteg PSA-t (analgéziát/szedációt) kapott a szállításhoz.'},

{id:2,title:'2. Szimuláció: Szűk QRS Reguláris Tachycardia (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 35 éves nő hirtelen szívdobogásérzésre panaszkodik. A monitoron 180/perc reguláris, szűk QRS tachycardia látható. B+ kompetencia (gyógyszerelés lehetséges protokoll szerint).',steps:[
{sit:'Megérkezel a beteghez. Panasza a heves szívdobogás. A vérnyomása 120/80 Hgmm, tiszta tudatú, nincs mellkasi fájdalma, nem fullad. Mi az állapot besorolása?',opts:[{tx:'Instabil tachycardia.',ok:false,fb:'Hibás! Nincsenek hypoperfusiora (shock, syncope, ischaemia) utaló jelei.'},{tx:'Stabil, riasztó tüneteket NEM mutató beteg.',ok:true,fb:'Helyes! A normál vérnyomás és tiszta tudat stabilitásra utal.'},{tx:'Szekunder tachycardia.',ok:false,fb:'Hibás! A hirtelen 180-as frekvencia alapbetegség nélkül primer ritmuszavart feltételez (pl. PSVT).'}]},
{sit:'Mi a fő cél a helyszínen stabil tachycardia esetén?',opts:[{tx:'A ritmuszavar mindenáron történő megszüntetése elektroterápiával.',ok:false,fb:'Hibás! Stabil betegnél ez kórházi feladat vagy gyógyszeres.'},{tx:'A frekvencia kontrollja (csökkentése), ill. próbálkozás a konverzióval biztonságos keretek között, kórházba szállítás mellett.',ok:true,fb:'Helyes! A cél a tünetek enyhítése és a kórházba szállítás.'},{tx:'Atropin adása.',ok:false,fb:'Hibás! Atropin tachycardiában kontraindikált.'}]},
{sit:'Készítesz egy 12-elvezetéses EKG-t. Reguláris, keskeny QRS (<0,12 s) tachycardiát látsz. A betegnek nincs láza, fájdalma (ami szekunder ok lenne). Mi a terápiás algoritmus első lépése az eljárásrend szerint?',opts:[{tx:'Azonnali Adenozin 6 mg.',ok:false,fb:'Hibás! Van egy nem gyógyszeres lépés előtte.'},{tx:'Vagus manőverek alkalmazása (preferált: módosított Valsalva-manőver).',ok:true,fb:'Helyes! Ez a legbiztonságosabb első próbálkozás.'},{tx:'Verapamil adása.',ok:false,fb:'Hibás! Csak később jön szóba.'}]},
{sit:'Hogyan hajtod végre a módosított Valsalva-manővert?',opts:[{tx:'A beteget hanyatt fektetem és megnyomom a szemgolyóját.',ok:false,fb:'Hibás! A bulbusnyomás kontraindikált.'},{tx:'A beteg félülő (45°) helyzetben 15 mp-ig egy fecskendőt fúj, majd hanyatt fektetem és mindkét lábát megemelem 15 mp-ig.',ok:true,fb:'Helyes! Ez a módosított Valsalva-manőver hivatalos leírása.'},{tx:'Megkérem, hogy köhögjön nagyokat állva.',ok:false,fb:'Hibás! Nem ez a leghatékonyabb.'}]},
{sit:'A manőver hatástalan. A frekvencia továbbra is 180/perc. Nincs preexcitatio az EKG-n. Mi a következő farmakológiai lépés?',opts:[{tx:'Amiodaron 300 mg perfúzorban.',ok:false,fb:'Hibás! Amiodaron széles QRS-nél preferált.'},{tx:'Adenozin adása gyors iv. bólusban.',ok:true,fb:'Helyes! Keskeny QRS reguláris tachycardiában az Adenozin az első választandó szer.'},{tx:'Lidokain adása.',ok:false,fb:'Hibás! Nem protokoll része itt.'}]},
{sit:'Hogyan adod be az Adenozint az eljárásrend szerint?',opts:[{tx:'Lassú infúzióban 5 perc alatt.',ok:false,fb:'Hibás! Az adenozin felezési ideje másodpercek, lassan beadva hatástalan.'},{tx:'Nagy lumenű kanülön (cubitalis) 6 mg hígítás nélkül, 1-2 mp alatt, majd AZONNAL bemosva 10-20 ml NaCl-lal a végtag felemelése mellett.',ok:true,fb:'Helyes! A nagyon gyors bejutás (csap használatával) kritikus a sikerhez.'},{tx:'Izomba (im.) adom.',ok:false,fb:'Hibás! Csak intravénásan hat.'}]},
{sit:'Mielőtt beadod az Adenozint, mit KELL mindenképpen közölni a beteggel?',opts:[{tx:'Hogy el fog aludni.',ok:false,fb:'Hibás! Nem altatószer.'},{tx:'Fel kell készíteni az átmeneti kellemetlenségre (arckipirulás, mellkasi nyomás, pulzuskimaradás, nehézlégzés érzése).',ok:true,fb:'Helyes! Ezek ijesztő, de normális hatások, a beteg pánikba eshet, ha nem tud róla.'},{tx:'Hogy ez egy fájdalomcsillapító.',ok:false,fb:'Hibás! Ez hazugság lenne.'}]},

{sit:'A 12 mg Adenozin is hatástalan. A gép továbbra is 180/percet jelez. Az EKG-n továbbra is keskeny, reguláris QRS van. Az algoritmus szerint milyen gyógyszer megfontolása jöhet még szóba stabil, keskeny QRS tachycardiánál az adenozin után?',opts:[{tx:'Amiodaron.',ok:false,fb:'Hibás! Keskeny QRS-nél nem ez a fő vonal.'},{tx:'Verapamil (5-10 mg lassan) VAGY Metoprolol (1-2 mg bólusokban).',ok:true,fb:'Helyes! Ezek a következő vonalbeli frekvencia/ritmuskontroll szerek stabil esetben.'},{tx:'Magnézium-szulfát.',ok:false,fb:'Hibás! Az a TdP kamrai tachycardiára való.'}]},
{sit:'Dönthetsz úgy, hogy nem adsz több gyógyszert, mivel a beteg stabil. Mi a legmegfelelőbb eljárás a kórházba szállítás során?',opts:[{tx:'Lekötöm az EKG-t, hogy kényelmesebb legyen az út.',ok:false,fb:'Hibás! A ritmuszavar bármikor instabillá válhat.'},{tx:'Folyamatos monitorozás (EKG, vérnyomás, SpO2) és a beteg állapotának szoros megfigyelése.',ok:true,fb:'Helyes! A folyamatos obszerváció kötelező stabil ritmuszavarok esetén is a szállítás alatt.'},{tx:'A beteg a saját autójával is bemehet.',ok:false,fb:'Hibás! A mentő monitorozása szükséges.'}]}
],summary:'Összefoglaló (Szűk QRS Tachycardia, B+ kompetencia): A 35 éves beteg 180/perc pulzussal, de normál vérnyomással és tiszta tudattal stabil állapotúnak minősült. Reguláris, keskeny QRS tachycardia (valószínűleg PSVT) esetén első lépésben módosított Valsalva-manővert alkalmaztunk (45 fokos pozíció, fecskendő fújása 15 mp-ig, majd hanyatt fekvés lábemeléssel). Mivel ez hatástalan volt, B+ protokoll szerint Adenozin következett. A beteget felvilágosítottuk az ijesztő mellékhatásokról (mellkasi nyomás, "halálfélelem"), majd 6 mg-ot adtunk gyors iv. bólusban egy háromágú csapon keresztül, azonnal rátolva 20 ml NaCl-t, a végtagot megemelve. A hatástalanság miatt 1 perc múlva ismételtünk 12 mg-mal. Miután ez sem hozott sikert, a protokoll Verapamil vagy Metoprolol adását tenné lehetővé, de dönthettünk a folyamatos monitorozás és szállítás mellett is, lévén a beteg mindvégig hemodinamikailag stabil maradt.'},

{sit:'A defibrillátort szinkron üzemmódba állítod (SYNC gomb). Mit kell ellenőrizned a monitoron?',opts:[{tx:'Hogy minden P-hullámon van egy pötty.',ok:false,fb:'Hibás! A QRS-en (R-hullámon) kell lennie.'},{tx:'Hogy minden R- (vagy S) hullám csúcsán megjelenik egy jól látható háromszög/jelölés, ami a szinkronizációt mutatja.',ok:true,fb:'Helyes! Ha nincs szinkronjel, a gép T-hullámra is üthet, ami VF-t okoz.'},{tx:'Csak azt, hogy "SYNC" ki van írva, a hullámokat nem kell figyelni.',ok:false,fb:'Hibás! Vizuálisan is ellenőrizni kell az R-hullámra illeszkedést.'}]},
{sit:'A gép szinkronizál. Milyen energiaszintet javasolt beállítani a bifázisos defibrillátoron az ELSŐ sokkhoz felnőttnél az OMSZ protokoll (Zoll X vagy Lifepak) szerint?',opts:[{tx:'50 Joule',ok:false,fb:'Hibás! Ez túl alacsony széles QRS tachycardiához.'},{tx:'120-125 Joule (készüléktípustól függően)',ok:true,fb:'Helyes! A kezdő energia bifázisos gépeknél 120-125 J.'},{tx:'360 Joule',ok:false,fb:'Hibás! A maximum energiát csak a 3. sokknál használjuk.'}]},
{sit:'A sokk biztonságos leadásához melyik lépést HAGYTAD KI, ami életveszélyes lehet a környezetre?',opts:[{tx:'Nem távolítottam el a szabadon áramló oxigént a beteg arcától.',ok:true,fb:'Helyes! A szikra és a magas O2 koncentráció tüzet/robbanást okozhat. A maszkot el kell venni.'},{tx:'Nem adtam atropint.',ok:false,fb:'Hibás! Atropin ide nem kell.'},{tx:'Nem vettem le az EKG kábeleket.',ok:false,fb:'Hibás! Az EKG kábelt nem kell feltétlenül levenni (monitorozni kell).'}]},
{sit:'Oxigént eltávolítottad. Felszólítod a környezetet: "Mindenki el!" A gombokat lenyomod a sokk leadásához, de a gép nem üt azonnal. Miért?',opts:[{tx:'A gép elromlott.',ok:false,fb:'Hibás! Valószínűleg nem ez az ok.'},{tx:'Szinkron üzemmódban a gép az R-hullámra vár, ezért a gombokat folyamatosan lenyomva kell tartani a sokk leadásáig (ez pár másodperc is lehet).',ok:true,fb:'Helyes! A szinkronizáció miatt van a késleltetés.'},{tx:'Mert nincs zselé a lapáton.',ok:false,fb:'Hibás! Az a minőséget befolyásolja, nem a gép időzítését.'}]},

{sit:'A 4. sokk hatására a beteg szinusritmusba konvertál, a pulzusa 85/perc, a vérnyomása 110/70-re emelkedik. Milyen infúziós fenntartó kezelés javasolt az algoritmus alapján a transzport alatt?',opts:[{tx:'Amiodaron folytatása 900 mg / 24 óra dózisban.',ok:true,fb:'Helyes! A konverzió fenntartásához a telítődózis után fenntartó dózis kell.'},{tx:'Adenozin infúzió.',ok:false,fb:'Hibás! Adenozint nem adunk infúzióban.'},{tx:'Semmi, a szinusritmus már tartós lesz.',ok:false,fb:'Hibás! A VT nagy eséllyel visszatérne az amiodaron fenntartás nélkül.'}]}
],summary:'Összefoglaló (Instabil Széles QRS Tachycardia, ECV, B+): A földön eszméletlenül fekvő, vérnyomás nélküli beteg a 190/perces széles QRS tachycardiával extrém instabil, periarrest helyzetben volt. A B+ egység haladéktalanul telekonzultációt és segélykocsit kért, miközben előkészítette a szinkron cardioversiót (ECV). Mivel a beteg eszméletlen és shockos volt, a szedáció (PSA) halasztható volt. A defibrillátoron KÖTELEZŐ volt a SYNC mód bekapcsolása és az R-hullámra illeszkedés ellenőrzése. A szabadon áramló O2 eltávolítása után 120-125 J (bifázisos) energiával indítottunk. A gombokat a sikeres szinkronizáció érdekében hosszan nyomva tartottuk. A sikertelen első sokk után a gépet ÚJRA szinkron módba kellett állítani, majd az energiát 150-200 J-ra, majd maximumra emeltük. Három sikertelen ütés után 300 mg Amiodaron követte intravénásan, 10-20 perc alatt. A gyógyszer lefolyása után a negyedik, maximális energiájú (360/200 J) sokk sikeres konverziót eredményezett. A hemodinamika stabilizálódott, az ellátást 900 mg/24 óra Amiodaron perfúzoros fenntartó terápiával zártuk a kórházba szállítás alatt.'}
];

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+linkGlos(h(b.tx))+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+linkGlos(h(i))+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+linkGlos(h(i))+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+linkGlos(h(b.tx))+'</div>';
  if(b.tp==='note') return '<div class="note">'+linkGlos(h(b.tx))+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+linkGlos(h(s.t))+'</div><div class="step-x">'+linkGlos(h(s.x))+'</div></div></div>').join('');
  return '';
}

'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Ritmuszavarok Ellátása</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v3.0 · 2022.08.16.</div></div>'+
'<div class="al al-i" style="margin-bottom:1rem">Ez az alkalmazás a ritmuszavarok sürgősségi, prehospitális ellátását dolgozza fel. A szavak alatti szaggatott vonalra (pl. <span class="glos" onclick="showGlos(\'cardioversio\')">cardioversio</span>) kattintva megjelenik a fogalommagyarázat.</div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Eljárásrend','Protokollok, algoritmusok'],['flash','🃏','Flashkártyák','15 vizsgakártya'],['quiz','❓','Kvíz','10 kérdés tesztelésre'],['sim','🚑','Szimuláció','3 interaktív betegeset'],['calc','🧮','Kalkulátor','Gyermek energiaigény']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af"><b>Vonatkozik:</b> Az OMSZ valamennyi kivonuló dolgozójára, kompetenciaszintnek megfelelően.</div></div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Eljárásrend Fejezetek</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+

function renderChapter(id){

return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza a fejezetekhez</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+h(c.title)+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+h(s.t)+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+h(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+h(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+h(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+h(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs Esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function updateCalc() {
  let e1 = CA.w * 1;
  let e2 = CA.w * 2;
  let e3 = CA.w * 4;
  let res = `<div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">1. Sokk energia (1 J/kg):</div><div style="font-size:24px;font-weight:700;color:#60a5fa;margin-bottom:1rem">${e1} J</div>
  <div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">2. Sokk energia (2 J/kg):</div><div style="font-size:24px;font-weight:700;color:#fde68a;margin-bottom:1rem">${e2} J</div>
  <div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">3. Sokk energia (4 J/kg):</div><div style="font-size:24px;font-weight:700;color:#fca5a5">${e3} J</div>`;
  document.getElementById('calc-res').innerHTML = res;
}

window.setWeight = function(v) {
  CA.w = +v;
  updateCalc();
}

function renderCalc(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Gyermek Energia Kalkulátor (ECV)</h2>'+
'<div class="card">'+
'<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Gyermek testsúlya (kg)</div>'+
'<input type="number" min="1" max="100" value="'+CA.w+'" oninput="setWeight(this.value)" onchange="setWeight(this.value)">'+
'<div class="res-box" style="background:#172554;border:1px solid #1e3a8a;margin-top:1rem" id="calc-res">'+
'</div><div style="font-size:12px;color:#9ca3af;margin-top:1rem;line-height:1.5">A számítás a gyermekek instabil tachycardiájának elektromos cardioversió (ECV) energiaszintjeit mutatja az eljárásrend alapján (1 J/kg, majd 2 J/kg, végül 4 J/kg).</div></div>';
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc') { c.innerHTML=renderCalc(); setTimeout(updateCalc,0); }
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
</html>
