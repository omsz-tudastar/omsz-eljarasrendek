<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folyadékterápia & Keringéstámogatás</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #121212; color: #e5e7eb; min-height: 100vh; padding-bottom: 72px; }
.app { max-width: 720px; margin: 0 auto; background: #1e1e1e; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,.4); position: relative; }
/* NAV */
.nav { display: flex; background: #242424; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.nb { flex: 1; padding: 9px 2px 6px; background: none; border: none; border-top: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: border-color .2s; }
.nb.act { border-top-color: #14b8a6; }
.ni { font-size: 16px; }
.nl { font-size: 9px; color: #9ca3af; font-weight: 400; }
.nb.act .nl { color: #14b8a6; font-weight: 600; }
/* CONTENT */
.ct { padding: 1rem; }
/* CARDS */
.card { background: #2a2a2a; border: 1px solid #3f3f3f; border-radius: 12px; padding: 1rem; margin-bottom: .75rem; }
.card-btn { background: #2a2a2a; border: 1px solid #3f3f3f; border-radius: 12px; padding: .85rem 1rem; margin-bottom: 7px; cursor: pointer; text-align: left; width: 100%; font-family: inherit; transition: background .15s; color: #e5e7eb; }
.card-btn:hover { background: #333; }
/* ALERTS */
.al { border-radius: 8px; padding: .75rem 1rem; margin-bottom: .75rem; font-size: 13px; line-height: 1.6; white-space: pre-line; }
.al-d { background: #450a0a; color: #fecaca; border: 1px solid #7f1d1d; }
.al-w { background: #451a03; color: #fde68a; border: 1px solid #78350f; }
.al-i { background: #172554; color: #bfdbfe; border: 1px solid #1e3a8a; }
.al-s { background: #064e3b; color: #bbf7d0; border: 1px solid #065f46; }
.note { font-size: 12px; color: #9ca3af; padding: .5rem .75rem; background: #262626; border-radius: 8px; margin-bottom: .5rem; line-height: 1.5; border: 1px solid #333; }
.sub { font-size: 13px; font-weight: 600; color: #d1d5db; margin: .75rem 0 .35rem; }
ul.bl { margin: 0 0 .5rem; padding-left: 1.3rem; }
ul.bl li { font-size: 13px; color: #d1d5db; line-height: 1.65; margin-bottom: .2rem; }
.kr { display: flex; gap: 8px; align-items: flex-start; padding: .5rem .75rem; background: #064e3b20; border-radius: 8px; margin-bottom: 5px; font-size: 13px; color: #d1d5db; line-height: 1.5; border-left: 3px solid #14b8a6; }
/* TABLES */
table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
table.tbl th { padding: 6px 8px; text-align: left; font-weight: 600; color: #9ca3af; border-bottom: 1px solid #3f3f3f; background: #262626; }
table.tbl td { padding: 6px 8px; border-bottom: 1px solid #333; vertical-align: middle; color: #d1d5db; }
.tbl-wrap { overflow-x: auto; margin-bottom: .75rem; background: #262626; border-radius: 8px; border: 1px solid #3f3f3f; }
/* PROGRESS */
.prog { height: 4px; background: #333; border-radius: 2px; margin-bottom: 1rem; }
.progb { height: 4px; border-radius: 2px; transition: width .3s; }
/* BUTTONS */
.btn { padding: .55rem 1rem; border: 1px solid #4b5563; border-radius: 8px; background: #2a2a2a; cursor: pointer; font-size: 13px; color: #e5e7eb; font-family: inherit; transition: all .15s; }
.btn:hover { background: #374151; }
.btn-g { background: #0d9488; color: #fff; border-color: #0d9488; }
.btn-g:hover { background: #0f766e; }
.btn-r { background: #b91c1c; color: #fff; border-color: #b91c1c; }
.btn-v { background: #7c3aed; color: #fff; border-color: #7c3aed; }
.btn-fw { width: 100%; display: block; text-align: center; padding: .75rem; font-weight: 600; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; text-align: center; }
/* QUIZ/SIM OPTIONS */
.opt { width: 100%; display: block; padding: .8rem 1rem; margin-bottom: 8px; border: 1px solid #3f3f3f; border-radius: 8px; cursor: pointer; text-align: left; font-size: 13px; color: #d1d5db; background: #2a2a2a; font-family: inherit; line-height: 1.5; transition: background .1s; }
.opt:hover { background: #374151; }
.opt-ok { background: #064e3b !important; border-color: #059669 !important; color: #ecfdf5 !important; cursor: default !important; }
.opt-no { background: #7f1d1d !important; border-color: #b91c1c !important; color: #fef2f2 !important; cursor: default !important; }
/* FLIP CARD */
.flip { border: 2px solid #3f3f3f; border-radius: 12px; padding: 1.5rem; min-height: 190px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; transition: border-color .2s; margin-bottom: .75rem; background: #262626; }
.flip.on { border-color: #14b8a6; }
/* GRID */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
/* RESULT */
.res-box { border-radius: 12px; padding: 1rem; text-align: center; margin-top: .75rem; }
.res-num { font-size: 38px; font-weight: 700; }
.res-lbl { font-size: 14px; margin: .3rem 0; }
/* INPUTS */
input[type=number] { width: 100%; background: transparent; border: 1px solid #4b5563; border-radius: 8px; padding: 10px; color: #e5e7eb; font-family: inherit; background: #2a2a2a; margin-bottom: 10px; font-size: 14px; }
select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #4b5563; background: #2a2a2a; font-size: 13px; color: #e5e7eb; font-family: inherit; margin-bottom: 10px; }
/* TAGS */
.tag { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 700; text-transform: uppercase; }
.tag-g { background: #064e3b; color: #ecfdf5; border: 1px solid #059669; }
.tag-y { background: #78350f; color: #fef3c7; border: 1px solid #b45309; }
/* HOME GRID */
.home-mod { background: #2a2a2a; border: 1px solid #3f3f3f; border-radius: 12px; padding: 1.25rem 1rem; cursor: pointer; text-align: center; font-family: inherit; transition: all .15s; color: #e5e7eb; display: flex; flex-direction: column; align-items: center; }
.home-mod:hover { background: #333; border-color: #4b5563; transform: translateY(-2px); }
.home-mod-icon { font-size: 32px; margin-bottom: 8px; }
.home-mod-title { font-size: 15px; font-weight: 600; color: #f3f4f6; margin-bottom: 4px; }
.home-mod-desc { font-size: 11px; color: #9ca3af; line-height: 1.4; }
/* CHAPTER LIST */
.ch-row { display: flex; align-items: center; gap: 12px; background: #2a2a2a; border: 1px solid #3f3f3f; border-radius: 12px; padding: 1rem; margin-bottom: 8px; cursor: pointer; width: 100%; text-align: left; font-family: inherit; transition: background .15s; color: #e5e7eb; }
.ch-row:hover { background: #333; }
/* GLOSSARY TERM */
.term { color: #38bdf8; border-bottom: 1px dashed #38bdf8; cursor: pointer; font-weight: 600; transition: color 0.2s; }
.term:hover { color: #7dd3fc; border-bottom-color: #7dd3fc; }
/* MODAL */
#mdl { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(3px); }
.mdl-c { background: #1e1e1e; border: 1px solid #3f3f3f; border-radius: 16px; padding: 1.5rem; max-width: 400px; width: 100%; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.mdl-x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; background: #333; border: none; color: #e5e7eb; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.mdl-x:hover { background: #4b5563; }
</style>
</head>

<script>
// --- GLOBALS ---
var SCR='home', CHID=null;
var FC={cat:'Összes', idx:0, flip:false};

// --- GLOSSARY DICTIONARY ---
var G = {
  'intracelluláris': 'Sejten belüli folyadéktér. Itt található a testben lévő folyadék kétharmada, itt zajlanak a főbb anyagcsere-folyamatok.',
  'interstitialis': 'Szövetközti folyadéktér, amely a sejteket veszi körül, és folyamatos kapcsolatot biztosít a sejtek és az érpálya között.',
  'intravasalis': 'Érpályán belüli folyadéktér. A keringő vértérfogat felnőttben kb. 70 ml/kg.',
  'krisztalloid': 'Vízből és kismolekulájú ásványi sókból (ionokból) álló intravénás oldat. Prehospitálisan preferált (pl. balanszírozott sóoldat).',
  'kolloid': 'Nagy molekulasúlyú anyagokat (pl. hidroxietil-keményítő, zselatin) tartalmazó infúzió. Prehospitális adása kontraindikált a halálozást nem javító, de vesekárosító és véralvadásgátló hatásai miatt!',
  'permisszív hypotensio': 'Nem kontrollálható vérzés (pl. belső vérzés) esetén alkalmazott elv. Célja a létfontosságú szervek minimális perfúziója anélkül, hogy a magasabb vérnyomás kilökné a kialakult vérrögöt. (Nem alkalmazható: várandósok, gyermekek, idősek, fejsérültek).',
  'tranexámsav': 'Véralvadást támogató gyógyszer (fibrinolízis gátló). Súlyos traumás vérzés, illetve koponyasérülés (GCS < 13) esetén indikált.',
  'inotróp': 'A szívizom összehúzódási erejét befolyásoló hatás/gyógyszer (pozitív inotróp = erőt fokozó, pl. Dobutamin).',
  'kronotróp': 'A szívfrekvenciát befolyásoló hatás (pozitív kronotróp = frekvenciát növelő).',
  'vazopresszor': 'A perifériás érellenállást (értónust) növelő, érszűkítő hatású szer (pl. Noradrenalin).',
  'ARSD': 'Akut respirációs distressz szindróma (súlyos tüdőkárosodás).',
  'MOF': 'Többszervi elégtelenség (Multiple Organ Failure).',
  'ROSC': 'Spontán keringés visszatérése (Return of Spontaneous Circulation) újraélesztés során.',
  'neurogen shock': 'Gerincvelői trauma esetén az autonóm idegrostok kiesésével kialakuló sokk, melyet gyors vérnyomásesés és bradycardia jellemez.',

  'Parkland-formula': 'A folyadékpótlás ütemének meghatározására szolgáló képlet II-III. fokú égés esetén. (Égett felület % × ttkg × 4 ml = 24 órás szükséglet).',
  'perfúzió': 'Szöveti vérátáramlás. Megfelelő perfúzió hiányában a sejtek nem kapnak elég oxigént és tápanyagot.',
  'bőrturgor': 'A bőr rugalmassága, feszessége. Csökkent bőrturgor (pl. ráncban marad a bőr) a kiszáradás (dehidráció) jele.'
};

// Helper to wrap glossary terms
function t(key, display) {
  return '<span class="term" onclick="showTerm(\''+key+'\')">'+(display || key)+'</span>';
}
function showTerm(key) {
  var d = G[key];
  if(!d) return;
  document.getElementById('mdl-t').innerText = key.toUpperCase();
  document.getElementById('mdl-d').innerText = d;
  document.getElementById('mdl').style.display = 'flex';
}
function hideTerm() {
  document.getElementById('mdl').style.display = 'none';
}
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// --- CONTENT DATA ---
var CDATA = [
{ id:'alap', title:'Élettani alapok', icon:'🩸', secs:[
  {t:'Folyadékterek és perfúzió', bk:[
    {tp:'bl', items:[
      'A felnőtt emberi test 50-60%-a folyadék (csecsemőknél ~70%).',
      'Eloszlása: '+t('intracelluláris')+' (2/3 rész) és sejten kívüli (1/3 rész) tér.',

    {tp:'sub', tx:'A folyadékpótlás alapelvei:'},
    {tp:'kr', items:[
      'Prehospitálisan BÓLUSOKBAN adjuk! Felnőtt: 250 ml. Gyermek (pubertás előtt): 10 ml/kg.',

    {tp:'bl', items:[
      'Preferált: Balanszírozott '+t('krisztalloid')+' infúzió.',

{ id:'trauma', title:'Trauma és Vérzés', icon:'🚨', secs:[

    {tp:'sub', tx:'Folyadék stratégiák:'},
    {tp:'bl', items:[
      'Sikeres vérzéscsillapítás után hypotensio esetén: cél a vérnyomás célon túl nem lövő normalizálása.',
      'Nem kontrollálható vérzés (belső vérzés, penetráló trauma): '+t('permisszív hypotensio')+' elve!'
    ]},
    {tp:'kr', items:[
      'A permisszív hypotensio célja: létfontosságú szervek minimálisan elégséges perfúziója.',
      'Nem cél a normál vérnyomás, mert az felhígítja a faktorokat és lelöki a kialakult vérrögöt.',

    {tp:'al', lv:'d', tx:'KIVÉTELEK! A permisszív hypotensio NEM alkalmazható: várandósoknál, gyermekeknél, idős magas vérnyomásos betegeknél, és izolált súlyos koponyasérültnél! Esetükben az életkornak megfelelő vérnyomásra kell törekedni.'}
  ]},
  {t:'Tranexámsav és Gyógyszer', bk:[
    {tp:'bl', items:[

  ]}
]},
{ id:'spec', title:'Speciális Állapotok', icon:'🔥', secs:[

function renderChapters(){
  let html = `<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Tananyag (Eljárásrend)</h2>`;
  CDATA.forEach(c => {
    html += `
      <button class="ch-row" onclick="go('chapter','${c.id}')">
        <div style="width:42px;height:42px;border-radius:12px;background:#14b8a620;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${c.icon}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:2px;">${c.title}</div>
          <div style="font-size:11px;color:#9ca3af">${c.secs.length} fejezet</div>
        </div>
        <div style="color:#9ca3af;font-size:18px">›</div>
      </button>
    `;
  });
  return html;
}

function rb(b){
  if(b.tp==='sub') return `<div class="sub">${b.tx}</div>`;
  if(b.tp==='bl') return `<ul class="bl">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(b.tp==='kr') return `<div>${b.items.map(i=>`<div class="kr">✓ &nbsp;${i}</div>`).join('')}</div>`;
  if(b.tp==='al') return `<div class="al al-${b.lv}">${b.tx}</div>`;
  if(b.tp==='note') return `<div class="note">${b.tx}</div>`;
  if(b.tp==='ftable'){
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategória</th><th>Célérték / Dózis</th></tr></thead><tbody>
      ${b.rows.map(r=>`<tr><td style="font-weight:600;color:#c4b5fd">${r[0]}</td><td style="color:#e5e7eb">${r[1]}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  return '';
}

function renderChapter(id){
  let c = CDATA.find(x => x.id === id);
  if(!c) return '';
  let html = `
    <button onclick="go('chapters')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem;">
      <div style="width:46px;height:46px;border-radius:12px;background:#14b8a620;display:flex;align-items:center;justify-content:center;font-size:24px">${c.icon}</div>
      <h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">${c.title}</h2>
    </div>
  `;
  c.secs.forEach(s => {
    html += `<div class="card"><h3 style="font-size:15px;font-weight:700;color:#14b8a6;margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">${s.t}</h3>`;
    s.bk.forEach(b => { html += rb(b); });
    html += `</div>`;
  });
  return html;
}

function renderFlash(){
  let cats = ['Összes', ...[...new Set(CARDS.map(c=>c.cat))]];
  let filtered = FC.cat === 'Összes' ? CARDS : CARDS.filter(c=>c.cat === FC.cat);
  let card = filtered[Math.min(FC.idx, filtered.length-1)];
  
  let html = `
    <h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">
      ${cats.map(c=>`<button onclick="setCat('${c}')" style="padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid ${FC.cat===c?'#14b8a6':'#3f3f3f'};background:${FC.cat===c?'#14b8a6':'#2a2a2a'};color:${FC.cat===c?'#111827':'#9ca3af'};cursor:pointer;font-family:inherit">${c}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">${FC.idx+1} / ${filtered.length} • Kattints a kártyára a fordításhoz</div>
    <div class="flip ${FC.flip?'on':''}" onclick="flipCard()">
  `;
  if(FC.flip) {
    html += `
      <div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Válasz</div>
      <div style="font-size:14px;color:#d1d5db;line-height:1.7;text-align:center;white-space:pre-line">${card.b}</div>
    `;
  } else {
    html += `
      <div style="font-size:11px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">${card.cat}</div>
      <div style="font-size:16px;font-weight:600;color:#f3f4f6;line-height:1.5">${card.f}</div>
      <div style="font-size:11px;color:#9ca3af;margin-top:20px">Kattints a válaszért ↻</div>
    `;
  }
  html += `
    </div>
    <div class="btn-row">
      <button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button>
      <button class="btn btn-fw" style="background:#14b8a620; color:#14b8a6; border-color:#14b8a6;" onclick="flipCard()">Fordít</button>
      <button class="btn btn-fw" onclick="navCard(1)">Következő ›</button>
    </div>
  `;
  return html;
}

    let good = pct >= 80;
    let html = `
      <h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>
      <div style="background:${good?'#064e3b':'#451a03'};border:1px solid ${good?'#065f46':'#78350f'};border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1rem">
        <div style="font-size:48px;font-weight:700;color:${good?'#4ade80':'#fde68a'}">${QZ.score}/${QUIZ.length}</div>
        <div style="font-size:16px;font-weight:600;color:${good?'#4ade80':'#fde68a'};margin-top:8px;">${pct}% – ${good?'Kiválóan ismered az eljárásrendet!':'Ismételd át a tananyagot.'}</div>
      </div>
    `;
    let wr = QZ.ans.filter(a=>!a.ok);
    if(wr.length) {
      html += `<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Hibás válaszaid elemzése:</h3>`;
      wr.forEach(a => {
        html += `
          <div class="card" style="margin-bottom:8px">
            <div style="font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:6px">${QUIZ[a.qi].q}</div>
            <div style="font-size:12px;color:#fca5a5;margin-bottom:4px">✗ Te válaszod: ${QUIZ[a.qi].opts[a.pi]}</div>
            <div style="font-size:12px;color:#4ade80;margin-bottom:8px">✓ Helyes: ${QUIZ[a.qi].opts[QUIZ[a.qi].ok]}</div>
            <div style="font-size:12px;color:#9ca3af;border-top:1px solid #3f3f3f;padding-top:6px;">${QUIZ[a.qi].exp}</div>
          </div>
        `;
      });
    } else {
      html += `<div class="al al-s">Tökéletes! Egyetlen hibát sem vétettél.</div>`;
    }
    html += `<button class="btn btn-g btn-fw" style="margin-top:10px" onclick="resetQuiz()">Kvíz Újraindítása</button>`;
    return html;
  }
  
  let q = QUIZ[QZ.idx];
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
      <h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2>
      <span style="font-size:12px;color:#9ca3af;font-weight:600;">${QZ.idx+1} / ${QUIZ.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((QZ.idx+1)/QUIZ.length*100)}%;background:#14b8a6"></div></div>
    <div class="card" style="margin-bottom:.75rem;background:#262626;border-color:#4b5563;">
      <p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">${q.q}</p>
    </div>
  `;
  q.opts.forEach((opt, i) => {
    let cls = 'opt';
    if(QZ.sel !== null) {
      if(i === q.ok) cls += ' opt-ok';
      else if(i === QZ.sel) cls += ' opt-no';
    }
    html += `<button class="${cls}" ${QZ.sel===null?`onclick="pickQ(${i})"`:''}>${opt}</button>`;
  });
  if(QZ.sel !== null) {
    html += `
      <div class="al al-i" style="margin-bottom:.75rem; border-color:#3b82f6;">${q.exp}</div>
      <button class="btn btn-g btn-fw" onclick="nextQ()">${QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények Megtekintése'}</button>
    `;
  }
  return html;
}

function renderSim(){
  if(!SI.id){
    let html = `<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Klinikai Szimulációk</h2>
    <div class="al al-w">Válaszd ki az esetet! Minden szimuláció a protokoll minden lépésén végigkísér az elejétől a kórházba szállításig.</div>`;
    SIMS.forEach(s => {
      html += `
        <button class="card-btn" onclick="startSim(${s.id})">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div style="font-size:15px;font-weight:700;color:#14b8a6;max-width:70%">${s.title}</div>
            <span class="tag tag-y">${s.diff}</span>
          </div>
          <div style="font-size:12px;color:#9ca3af;margin-bottom:8px;line-height:1.4">${s.desc}</div>
          <div style="font-size:11px;color:#6b7280;font-weight:600;">${s.steps.length} klinikai döntési pont</div>
        </button>
      `;
    });
    return html;
  }
  
  let sim = SIMS.find(s => s.id === SI.id);
  if(SI.fin){
    let correct = SI.hist.filter(h => sim.steps[h.step].opts[h.oi].ok).length;
    let good = correct >= sim.steps.length * 0.8;
    let html = `
      <h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">${sim.title} - Zárójelentés</h2>
      <div style="background:${good?'#064e3b':'#451a03'};border:1px solid ${good?'#065f46':'#78350f'};border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">
        <div style="font-size:42px;font-weight:700;color:${good?'#4ade80':'#fde68a'}">${correct}/${sim.steps.length}</div>
        <div style="font-size:13px;color:${good?'#4ade80':'#fde68a'};font-weight:600">Helyes klinikai döntés</div>
      </div>
      <div class="al al-i" style="background:#17255420;">
        <strong style="color:#60a5fa;display:block;margin-bottom:6px;">Eset Összefoglaló:</strong>
        <span style="color:#e5e7eb;font-size:13px;line-height:1.6;">${sim.summary}</span>
      </div>
      <h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Lépéseid elemzése:</h3>
    `;
    SI.hist.forEach((hh, i) => {
      let st = sim.steps[hh.step];
      let opt = st.opts[hh.oi];
      html += `
        <div class="card" style="margin-bottom:8px; border-left: 4px solid ${opt.ok?'#059669':'#b91c1c'};">
          <div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">${i+1}. Lépés: ${st.sit}</div>
          <div style="font-size:11px;margin-bottom:4px;color:${opt.ok?'#4ade80':'#fca5a5'};font-weight:600;">${opt.ok?'✓ Helyes:':'✗ Hibás:'} ${opt.tx}</div>
          <div style="font-size:11px;color:#9ca3af;padding-top:4px;border-top:1px dashed #3f3f3f;">${opt.fb}</div>
        </div>
      `;
    });
    html += `<button class="btn btn-fw" style="margin-top:12px; background:#1e3a8a; border-color:#1e40af;" onclick="resetSim()">Vissza az esetekhez</button>`;
    return html;
  }
  
  let step = sim.steps[SI.step];
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
      <div style="font-size:14px;font-weight:700;color:#14b8a6;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;max-width:80%;">${sim.title}</div>
      <span style="font-size:12px;color:#9ca3af;font-weight:600;">${SI.step+1} / ${sim.steps.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((SI.step+1)/sim.steps.length*100)}%;background:#14b8a6"></div></div>
    ${SI.step===0 ? `<div class="al al-i" style="font-size:12px;">${sim.desc}</div>` : ''}
    <div class="card" style="margin-bottom:.75rem;background:#262626;border-color:#4b5563;">
      <p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">${step.sit}</p>
    </div>
  `;
  step.opts.forEach((opt, i) => {
    let cls = 'opt';
    if(SI.chosen !== null) {
      if(opt.ok) cls += ' opt-ok';
      else if(i === SI.chosen) cls += ' opt-no';
    }
    html += `<button class="${cls}" ${SI.chosen===null?`onclick="chooseSim(${i})"`:''}>${opt.tx}</button>`;
  });
  if(SI.chosen !== null) {
    let chosenOpt = step.opts[SI.chosen];
    html += `
      <div class="al ${chosenOpt.ok?'al-s':'al-d'}" style="margin-bottom:.75rem;">${chosenOpt.fb}</div>
      <button class="btn btn-g btn-fw" onclick="nextSim()">${SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló elkészítése'}</button>
    `;
  }
  return html;
}

// ---------------------------------------------------------
// KALKULÁTOR VALÓS IDEJŰ FRISSÍTÉSE (FOCUS VESZTÉS NÉLKÜL)
// ---------------------------------------------------------
function upCalc() {
  if (CL.tab === 'burn') {
    let w = parseFloat(CL.burn.w) || 0;
    let a = parseFloat(CL.burn.a) || 0;
    let rate24 = a * w * (CL.burn.i === '1' ? 5 : 4);
    let rate8 = rate24 / 2;
    let mlh = rate8 / 8;
    let rbox = document.getElementById('res-burn');
    if (rbox) {
      rbox.innerHTML = `
        <div style="font-size:12px;color:#9ca3af;">24 órás teljes szükséglet: <b style="color:#e5e7eb">${rate24} ml</b></div>
        <div style="font-size:12px;color:#9ca3af;margin-top:4px;">Első 8 óra alatt beadandó: <b style="color:#e5e7eb">${rate8} ml</b></div>
        <div style="font-size:28px;font-weight:700;color:#38bdf8;margin-top:10px;">${mlh.toFixed(0)} ml / óra</div>
        <div style="font-size:11px;color:#60a5fa;margin-top:4px;">Kezdeti infúziós sebesség</div>
      `;
    }
  } 
  else if (CL.tab === 'child') {
    let a = parseFloat(CL.child.a) || 0;
    let w = parseFloat(CL.child.w) || 0;
    let norm = 90 + (2 * a);
    let min = 70 + (2 * a);
    let bolus = w * 10;
    let max = w * 60;
    let rbox = document.getElementById('res-child');
    if (rbox) {
      rbox.innerHTML = `
        <div style="font-size:12px;color:#9ca3af;">Élettani szisztolés RR: <b style="color:#4ade80">${norm} Hgmm</b></div>
        <div style="font-size:12px;color:#9ca3af;margin-top:4px;">Tolerabilis Alsó SBP határ: <b style="color:#fca5a5">${min} Hgmm</b></div>
        <div style="font-size:28px;font-weight:700;color:#14b8a6;margin-top:10px;">${bolus} ml</div>
        <div style="font-size:11px;color:#5eead4;margin-top:4px;">1 db Bólus (10 ml/kg)</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:8px;">Max mennyiség 1. órában: ${max} ml</div>
      `;
    }
  } 
  else if (CL.tab === 'drug') {
    let isDobutamine = CL.drug.type === 'dobutamin';
    let conc = isDobutamine ? 5000 : 20;
    let w = parseFloat(CL.drug.w) || 0;
    let dose = parseFloat(CL.drug.dose) || 0;
    let ug_min = w * dose;
    let mlh = (ug_min * 60) / conc;
    let rbox = document.getElementById('res-drug');
    if (rbox) {
      rbox.innerHTML = `
        <div style="font-size:12px;color:#9ca3af;">Koncentráció: <b style="color:#c4b5fd">${conc} μg/ml</b></div>
        <div style="font-size:28px;font-weight:700;color:#a855f7;margin-top:10px;">${mlh.toFixed(1).replace('.0','')} ml / óra</div>
        <div style="font-size:11px;color:#d8b4fe;margin-top:4px;">Perfúzor sebesség beállítás</div>
      `;
    }
  }
}

function renderCalc(){
  let html = `<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>
    <div style="display:flex;gap:6px;margin-bottom:1rem;">
      <button onclick="CL.tab='burn'; render()" class="btn" style="flex:1; background:${CL.tab==='burn'?'#14b8a6':'#2a2a2a'}; color:${CL.tab==='burn'?'#111827':'#e5e7eb'}; border-color:${CL.tab==='burn'?'#14b8a6':'#3f3f3f'};">Égés (Parkland)</button>
      <button onclick="CL.tab='child'; render()" class="btn" style="flex:1; background:${CL.tab==='child'?'#14b8a6':'#2a2a2a'}; color:${CL.tab==='child'?'#111827':'#e5e7eb'}; border-color:${CL.tab==='child'?'#14b8a6':'#3f3f3f'};">Gyermek RR</button>
      <button onclick="CL.tab='drug'; render()" class="btn" style="flex:1; background:${CL.tab==='drug'?'#14b8a6':'#2a2a2a'}; color:${CL.tab==='drug'?'#111827':'#e5e7eb'}; border-color:${CL.tab==='drug'?'#14b8a6':'#3f3f3f'};">Gyógyszer (ml/h)</button>
    </div>`;

  if(CL.tab === 'burn') {
    html += `
      <div class="card">
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Testsúly (kg)</label>
          <input type="number" value="${CL.burn.w}" oninput="CL.burn.w=this.value; upCalc()" onchange="CL.burn.w=this.value; upCalc()">
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Égett felület II-III fok (%)</label>
          <input type="number" value="${CL.burn.a}" oninput="CL.burn.a=this.value; upCalc()" onchange="CL.burn.a=this.value; upCalc()">
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Légútbiztosítás</label>
          <select onchange="CL.burn.i=this.value; upCalc()">
            <option value="0" ${CL.burn.i==='0'?'selected':''}>Nincs ETI (Szorzó: 4 ml)</option>
            <option value="1" ${CL.burn.i==='1'?'selected':''}>Intubált beteg (Szorzó: 5 ml)</option>
          </select>
        </div>
        <div id="res-burn" class="res-box" style="background:#17255420; border:1px solid #1e3a8a;">
        </div>
      </div>
    `;
  } 
  else if (CL.tab === 'child') {
    html += `
      <div class="card">
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Életkor (év)</label>
          <input type="number" value="${CL.child.a}" oninput="CL.child.a=this.value; upCalc()" onchange="CL.child.a=this.value; upCalc()">
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Testtömeg (kg)</label>
          <input type="number" value="${CL.child.w}" oninput="CL.child.w=this.value; upCalc()" onchange="CL.child.w=this.value; upCalc()">
        </div>
        <div id="res-child" class="res-box" style="background:#450a0a20; border:1px solid #7f1d1d;">
        </div>
      </div>
    `;
  }
  else if (CL.tab === 'drug') {
    html += `
      <div class="card">
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Hatóanyag (Standard OMSZ hígítás 50 ml-re)</label>
          <select onchange="CL.drug.type=this.value; CL.drug.dose=(this.value==='dobutamin'?5.0:0.1); render()">
            <option value="noradrenalin" ${CL.drug.type!=='dobutamin'?'selected':''}>Noradrenalin / Adrenalin (1 mg / 50 ml)</option>
            <option value="dobutamin" ${CL.drug.type==='dobutamin'?'selected':''}>Dobutamin (250 mg / 50 ml)</option>
          </select>
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Testtömeg (kg)</label>
          <input type="number" value="${CL.drug.w}" oninput="CL.drug.w=this.value; upCalc()" onchange="CL.drug.w=this.value; upCalc()">
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:#9ca3af;display:block;margin-bottom:4px;">Dózis (μg/ttkg/perc)</label>
          <input type="number" step="0.01" value="${CL.drug.dose}" oninput="CL.drug.dose=this.value; upCalc()" onchange="CL.drug.dose=this.value; upCalc()">
        </div>
        <div id="res-drug" class="res-box" style="background:#2e106540; border:1px solid #4c1d95;">
        </div>
      </div>
    `;
  }
  return html;
}

function render(){
  let c = document.getElementById('ct');
  c.innerHTML = '';
  if(SCR==='home') c.innerHTML = renderHome();
  else if(SCR==='chapters') c.innerHTML = renderChapters();
  else if(SCR==='chapter') c.innerHTML = renderChapter(CHID);
  else if(SCR==='flash') c.innerHTML = renderFlash();
  else if(SCR==='quiz') c.innerHTML = renderQuiz();
  else if(SCR==='sim') c.innerHTML = renderSim();
  else if(SCR==='calc') {
    c.innerHTML = renderCalc();
    // DOM-ba kerülés után azonnal frissítjük az értékeket, hogy megjelenjenek
    setTimeout(upCalc, 0); 
  }
  
  let tabs = ['home','chapters','flash','quiz','sim','calc'];
  let active = SCR === 'chapter' ? 'chapters' : SCR;
  document.querySelectorAll('.nb').forEach((b,i) => { b.classList.toggle('act', tabs[i]===active); });
  
  // Csak navigáláskor ugrunk a lap tetejére, így gépeléskor (ami már nem hív rendert) eleve fel sem merül
  window.scrollTo(0,0);
}

// --- ACTIONS ---
window.go = function(s, id){ SCR=s; CHID=id||null; render(); };
window.setCat = function(c){ FC.cat=c; FC.idx=0; FC.flip=false; render(); };
window.flipCard = function(){ FC.flip=!FC.flip; render(); };
window.navCard = function(d){ let f = FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat); FC.flip=false; FC.idx=(FC.idx+d+f.length)%f.length; render(); };
window.pickQ = function(i){ if(QZ.sel!==null)return; QZ.sel=i; let ok = i===QUIZ[QZ.idx].ok; if(ok)QZ.score++; QZ.ans.push({qi:QZ.idx, pi:i, ok:ok}); render(); };
window.nextQ = function(){ if(QZ.idx<QUIZ.length-1){QZ.idx++; QZ.sel=null;}else QZ.done=true; render(); };
window.resetQuiz = function(){ QZ={idx:0, sel:null, score:0, done:false, ans:[]}; render(); };
window.startSim = function(id){ SI.id=id; SI.step=0; SI.chosen=null; SI.hist=[]; SI.fin=false; render(); };
window.chooseSim = function(i){ if(SI.chosen!==null)return; SI.chosen=i; SI.hist.push({step:SI.step, oi:i}); render(); };
window.nextSim = function(){ let sim=SIMS.find(s=>s.id===SI.id); if(SI.step<sim.steps.length-1){SI.step++; SI.chosen=null;}else SI.fin=true; render(); };
window.resetSim = function(){ SI={id:null, step:0, chosen:null, hist:[], fin:false}; render(); };

// INITIAL RENDER
render();

</script>
</body>
</html>
