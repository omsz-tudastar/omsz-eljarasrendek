// Szöveg formázó (kifejezések cseréje kattinthatóvá)
function h(s) {
  let esc = String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  for (let key in GLO) {
    let regex = new RegExp('\\b(' + key + ')\\b', 'gi');
    esc = esc.replace(regex, '<span class="glo" onclick="showGlo(\''+key+'\')">$1</span>');
  }
  // Különleges esetek ragozással
  esc = esc.replace(/\b(kapnográfiát|kapnográfiával)\b/gi, '<span class="glo" onclick="showGlo(\'kapnográfia\')">$1</span>');
  esc = esc.replace(/\b(oesophagealis)\b/gi, '<span class="glo" onclick="showGlo(\'oesophagealis intubáció\')">$1</span>');
  esc = esc.replace(/\b(hypercapniát)\b/gi, '<span class="glo" onclick="showGlo(\'hypercapnia\')">$1</span>');
  return esc;
}

function showGlo(key) {
  let realKey = Object.keys(GLO).find(k => k.toLowerCase() === key.toLowerCase());
  if(!realKey && GLO[key]) realKey = key;
  if(realKey) {
    document.getElementById('modal-title').innerText = realKey;
    document.getElementById('modal-body').innerHTML = GLO[realKey];
    document.getElementById('modal-overlay').classList.add('active');
  }
}
function closeGlo(e) {
  if(!e || e.target.id === 'modal-overlay' || e.target.id === 'modal-close') {
    document.getElementById('modal-overlay').classList.remove('active');
  }
}

{cat:'Görbék',f:'Mit jelent a megtöretés a görbe plató fázisában (curare-rés)?',b:'Azt jelenti, hogy az izomrelaxáns (bénító gyógyszer) hatása kezd megszűnni, és megjelentek a beteg spontán légzési kísérletei.'},
{cat:'Eszközök',f:'Mi a helyes szerelési sorrend intubált beteg lélegeztetésekor?',b:'1. Lélegeztető ballon\n2. Kapnográf szenzor (mintavevő)\n3. HME-filter (kötelező!)\n4. Endotrachealis tubus\n\nA filter védi a szenzort a váladéktól/párától.'},
{cat:'Lélegeztetés',f:'Hogyan kell lélegeztetni súlyos koponyasérültet a helyszínen?',b:'A célérték szigorúan 35 Hgmm.\n\nA hyperventilatio (alacsony EtCO2) TILOS prehospitálisan, mert agyi érösszehúzódást (vasoconstrictio) és ischemiát okoz.'},
{cat:'Lélegeztetés',f:'Mit jelent a permisszív hypercapnia COPD exacerbáció esetén?',b:'Nem törekszünk agresszívan az EtCO2 normál szintre (35-38 Hgmm) csökkentésére. A magas induló értéknél a csökkenő tendencia már elfogadható.'},
{cat:'Sepsis',f:'Hogyan segít a nasalis kapnográfia a szepszis súlyosságának megítélésében?',b:'Spontán légző, nem hypotensiós betegnél a 25 Hgmm alatti nasalis EtCO2 jól korrelál a magas, kritikus (>4 mmol/l) laktátszinttel.'},
{cat:'Korlátok',f:'Milyen helyzetekben mérhet a kapnográf falsul alacsonyabb értéket a valósnál?',b:'- Hypotensio (alacsony vérnyomás, shock)\n- Nagyáramlású O2 adása nasalis kapnográf mellett\n- Gyermekeknél 5-6 éves korig (a holttér miatt)'}
];

var QUIZ = [
{q:'Mi az EtCO2 normál értéke?',opts:['40-45 Hgmm','35-38 Hgmm','25-30 Hgmm','10-15 Hgmm'],ok:1,exp:'A normál érték 35-38 Hgmm, mely 2-5 Hgmm-rel alacsonyabb az artériás értéknél.'},

{q:'Mit jelez leggyakrabban, ha intubációt követően a kapnográf görbéje pár légvétel alatt teljesen ellaposodik?',opts:['A beteg meggyógyult','Oesophagealis (nyelőcsőbe történt) intubációt','A tubus tökéletes helyzetét','Bronchospasmust'],ok:1,exp:'A lapos görbe nyelőcső intubációra utal, a tubust azonnal el kell távolítani.'},

{q:'Újraélesztés alatt a folyamatosan 10 Hgmm alatti EtCO2 érték mire utal?',opts:['Kiváló újraélesztési technikára','Túl gyors kompressziókra','Rossz prognózisra','Rövid időn belüli biztos ROSC-ra'],ok:2,exp:'20 perc után is <10 Hgmm érték rossz kimenetelt (prognózist) jelez.'},
{q:'Hogyan tudjuk elsősorban szabályozni a beteg EtCO2 értékét gépi lélegeztetés során?',opts:['A lélegeztetési frekvencia (légzésszám) változtatásával','A PEEP szelep tekergetésével','A beteg forgatásával','Oxigén áramlásának növelésével'],ok:0,exp:'Az EtCO2 értékét elsősorban a lélegeztetési frekvencia emelésével vagy csökkentésével szabályozzuk.'},
{q:'Súlyos koponyasérült ellátása során prehospitálisan...',opts:['Agresszív hyperventilatio szükséges (EtCO2 < 30)','A cél a normocapnia alsó határa (35 Hgmm), a hyperventilatio tilos','A permisszív hypercapnia a cél','Nem szükséges kapnográf'],ok:1,exp:'A célérték 35 Hgmm. Az indokolatlan hyperventilatio agyi ischemiát okoz.'},
{q:'COPD akut exacerbációja miatt intubált betegeknél:',opts:['Azonnal 35 Hgmm alá kell vinni a CO2-t','Tilos kapnográfot használni','Permisszív hypercapnia alkalmazható, ne törekedjünk a normocapniára','Csak nasalis kapnográf használható'],ok:2,exp:'Ne törekedjünk a normocapniára, a csökkenő tendencia elegendő.'},
{q:'Milyen a kapnográf szenzor, HME filter és ballon helyes sorrendje intubált betegnél?',opts:['Ballon -> Filter -> Szenzor -> Tubus','Tubus -> Ballon -> Szenzor -> Filter','Ballon -> Szenzor -> Filter -> Tubus','Mindegy, csak minden legyen a csövön'],ok:2,exp:'Helyes sorrend: Lélegeztető ballon -> Kapnográf szenzor -> HME-filter -> ET-tubus.'},
{q:'Szepszis gyanúja esetén, spontán légző betegnél a 25 Hgmm alatti nasalis EtCO2...',opts:['Tökéletes, egészséges állapotot jelez','A kapnográf meghibásodását jelenti','Jól korrelál a kritikus, 4 mmol/l feletti laktátszinttel','Azonnali intubációt tesz szükségessé indok nélkül'],ok:2,exp:'A <25 Hgmm érték magas laktátot és súlyos shock/sepsis állapotot jelez.'},
{q:'Hypotensio (alacsony vérnyomás) esetén a kapnográf által mért EtCO2 érték...',opts:['Pontosan egyezik a PaCO2-vel','Falsul magasabb lehet a valósnál','Falsul alacsonyabb lehet a valósnál','Mindig 0 lesz'],ok:2,exp:'A rossz tüdőperfúzió miatt hypotensióban a mért EtCO2 alacsonyabb a valós artériásnál.'},
{q:'A HME-filter használata a kapnográf szenzor előtt...',opts:['Csak javasolt, de nem kötelező','Kifejezetten tilos, mert elzárja a jelet','Kötelező, mert a pára és a váladék tönkreteszi a monitort','Csak gyermekeknél szükséges'],ok:2,exp:'A HME filter használata KÖTELEZŐ a drága monitor védelme érdekében.'}
];

var SIMS = [
{id:1,title:'1. Keringésmegállás és Újraélesztés (B kompetencia)',diff:'B kompetencia',desc:'Egy 55 éves férfi eszméletlenül esett össze. Légzése hiányzik. B kompetenciájú mentőegységként (nincs gyógyszerelés) a helyszínen CPR-t kezdesz.',steps:[
{sit:'Megérkeztetek. A helyszín biztonságos. A beteg reagálatlan, légzése nincs. Mi a haladéktalan fizikai teendőd?',opts:[{tx:'Azonnal mellkasi kompressziót kezdek, közben a társam ALS/segélykocsit hív.',ok:true,fb:'Helyes! CPR kezdése és segítség hívása az elsődleges.'},{tx:'Megpróbálom intubálni.',ok:false,fb:'Hibás! B szinten nem intubálunk, és a kompresszió az első.'},{tx:'Kikérdezem a feleségét a gyógyszereiről.',ok:false,fb:'Hibás! A CPR halasztása tilos.'}]},
{sit:'A társad átveszi a kompressziókat, felteszitek a defibrillátort (AED). Mi a légútbiztosítási teendőd B kompetenciánál?',opts:[{tx:'I-gel-t helyezek be azonnal.',ok:false,fb:'Hibás! B szinten a supraglotticus eszköz nem mindig rutin, de az OPA igen.'},{tx:'Guedel (OPA) tubust helyezek be és előkészítem a ballonos-maszkos lélegeztetést oxigénnel.',ok:true,fb:'Helyes! B szintű légút az OPA és a maszkos lélegeztetés.'},{tx:'Nasalis szondát teszek be.',ok:false,fb:'Hibás! CPR alatt ballonos lélegeztetés kell.'}]},
{sit:'Hogyan építed be a kapnográfot a maszkos-ballonos rendszerbe az eljárásrend alapján?',opts:[{tx:'Maszk alatt az orrára teszem a nasalis kapnográfot.',ok:false,fb:'Hibás! Maszkos lélegeztetésnél a körbe építjük be a szenzort.'},{tx:'A maszkra (vagy az OPA végére) csatlakoztatom a HME filtert, majd a kapnográf szenzort, arra a ballont.',ok:true,fb:'Helyes! A maszk -> HME filter -> Szenzor -> Ballon sorrend itt is él (az ET tubus helyett a maszk/eszköz áll).'},{tx:'B szinten nem használunk kapnográfot.',ok:false,fb:'Hibás! A maszkos lélegeztetés minőségének ellenőrzésére is indikált.'}]},
{sit:'A kompressziók közti lélegeztetéseknél látod az EtCO2 görbét. A mért érték 12 Hgmm. Mit jelez ez a CPR minőségére nézve?',opts:[{tx:'Kiváló, nem kell változtatni.',ok:false,fb:'Hibás.'},{tx:'Elfogadható, de próbálok még mélyebb, hatékonyabb kompressziókat végezni, hátha emelkedik.',ok:true,fb:'Helyes! A mélyebb kompressziókkal nő az EtCO2.'},{tx:'Azonnal abba kell hagyni a CPR-t, mert alacsony.',ok:false,fb:'Hibás! Nem hagyjuk abba emiatt.'}]},
{sit:'Az 5. percben a CPR közben az EtCO2 érték hirtelen, egyetlen lökés alatt 15 Hgmm-ről 48 Hgmm-re ugrik. Mire utal ez?',opts:[{tx:'A kapnográf elromlott.',ok:false,fb:'Hibás! Ez klasszikus klinikai jel.'},{tx:'ROSC (spontán keringés visszatérése).',ok:true,fb:'Helyes! Az EtCO2 hirtelen ugrása a tüdő perfúziójának azonnali helyreállását (ROSC) jelzi.'},{tx:'Nyelőcsőbe csúszott a tubus/levegő.',ok:false,fb:'Hibás! Az a görbe ellaposodását okozná.'}]},
{sit:'A 2 perces ciklus végén megálltok. A monitornak sinus ritmusa van, carotis pulzus tapintható. A betegnek van keringése, de még nem lélegzik. Milyen frekvenciával lélegezteted ballonal?',opts:[{tx:'30/perc.',ok:false,fb:'Hibás! Ez hyperventilatio.'},{tx:'10/perc (6 másodpercenként 1).',ok:true,fb:'Helyes! A ROSC utáni standard légzésszám a 10/perc.'},{tx:'Csak oxigént fújok az arcára.',ok:false,fb:'Hibás! Ha nem lélegzik, lélegeztetni kell.'}]},
{sit:'Lélegeztetés közben figyeled az EtCO2-t. Milyen célértéket próbálsz tartani B kompetenciával a ROSC utáni időszakban?',opts:[{tx:'35-38 Hgmm (Normocapnia).',ok:true,fb:'Helyes! Az eljárásrend alapján a normál értéket célozzuk.'},{tx:'Minél alacsonyabb, annál jobb (20 alatt).',ok:false,fb:'Hibás! A hyperventilatio káros az agyi véráramlásra.'},{tx:'50 felett.',ok:false,fb:'Hibás! Az súlyos hypercapnia.'}]},
{sit:'Ha az EtCO2 érték 45 Hgmm-re emelkedik a lélegeztetés során, hogyan korrigálsz pusztán a lélegeztetéssel?',opts:[{tx:'Leveszem a maszkot.',ok:false,fb:'Hibás! A beteg nem lélegzik.'},{tx:'Növelem a lélegeztetési frekvenciát (kissé szaporábban lélegeztetek).',ok:true,fb:'Helyes! A magas CO2 kimosásához növelni kell a perctérfogatot (frekvenciát).'},{tx:'Csökkentem a frekvenciát.',ok:false,fb:'Hibás! Az tovább növelné a CO2-t.'}]},
{sit:'Megérkezik az ALS/segélykocsi, a mentőtiszt intubálja a beteget. Intubáció után hogyan bizonyosodtok meg legbiztosabban a tubus helyzetéről?',opts:[{tx:'A kapnográf szenzor tubusra csatlakoztatásával és a szabályos CO2 görbe (D fázissal) megjelenésével.',ok:true,fb:'Helyes! Ez a legbiztosabb módszer a tubus pozíciójának igazolására.'},{tx:'A gyomor meghallgatásával.',ok:false,fb:'Hibás! Hallgatózni kell (tüdőt is), de az EtCO2 a legmegbízhatóbb.'},{tx:'Mellkasröntgennel a helyszínen.',ok:false,fb:'Hibás! A helyszínen nem kivitelezhető.'}]},
{sit:'Az ellátás során a szenzor eltömődik, mert a filter megrepedt és váladék jutott bele. Mi a teendő?',opts:[{tx:'A gépet azonnal újraindítom és reménykedem.',ok:false,fb:'Hibás! A szenzor tönkremehetett.'},{tx:'A sérült filtert és szenzort azonnal cserélem szárazra, mert az OMSZ eljárásrend szigorúan tiltja a nedves szenzor használatát a gép védelmében.',ok:true,fb:'Helyes! Nedves, váladékos mintavevő tönkreteszi a kapnográfot.'},{tx:'Kifújom a vizet és visszateszem.',ok:false,fb:'Hibás! Ezzel a gépbe nyomhatod a folyadékot.'}]}
],summary:'A keringésmegállás észlelését követően a CPR megkezdése és a megfelelő B szintű légútbiztosítás (OPA, ballon-maszk) volt a legfontosabb. A kapnográf filteres beépítése már a maszkos fázisban információt adott a kompressziók hatékonyságáról (minél magasabb az érték, annál jobb). Az EtCO2 hirtelen ugrása egyértelműen jelezte a ROSC-ot (keringés visszatérését). Ezt követően 10/perces frekvenciával lélegeztettél, a normocapniát (35-38 Hgmm) célozva. Az emelkedő CO2 értéket a frekvencia növelésével kompenzáltad. Amikor a segélykocsi intubált, a kapnográf használata volt az arany standard a tubus helyzetének ellenőrzésére. A filter és a száraz szenzor használata a monitor védelme miatt kritikus lépés volt.'},

{id:2,title:'2. Súlyos Koponyasérülés (B+ kompetencia)',diff:'B+ kompetencia',desc:'Közlekedési baleset, egy fiatal férfi súlyos, zárt koponyasérülést szenvedett. Eszméletlen (GCS 5), orvos intubálja a helyszínen. Te B+ kompetenciával (mentőápoló, gyógyszerezhet, vénát adhat) asszisztálsz és felügyeled a monitorozást.',steps:[
{sit:'A beteget orvos intubálja. Mi a Te feladatod a kapnográffal már az intubáció ELŐKÉSZÜLETEI alatt az eljárásrend szerint?',opts:[{tx:'Várok, amíg a tubus bent van, aztán kiveszem a gépet a táskából.',ok:false,fb:'Hibás! Késni fog az értékelés.'},{tx:'A gépet korán bekapcsolom, hogy meglegyen a bemelegedési és nullázási idő, a szenzort előkészítem a HME filterrel.',ok:true,fb:'Helyes! A gépnek bemelegedési idő kell, intubációkor azonnal csatlakoztathatónak kell lennie.'},{tx:'Kizárólag a pulzoximétert teszem fel, a kapnográfot csak a mentőautóban.',ok:false,fb:'Hibás! Helyszíni intubációnál kötelező.'}]},
{sit:'A tubus bekerült. Az orvos lélegeztetni kezd a ballonnal. Te csatlakoztatod a rendszert. A kapnográf görbéje pár légvétel után teljesen ellaposodik. Mit jelentesz azonnal?',opts:[{tx:'"Minden rendben, lapos a görbe!"',ok:false,fb:'Hibás! A lapos görbe bajt jelent.'},{tx:'"A gép rossz, hagyjuk."',ok:false,fb:'Hibás! Ne a gépet okold rögtön.'},{tx:'"Lapos a görbe, nincs EtCO2 jel, valószínű oesophagealis (nyelőcső) intubáció történt!"',ok:true,fb:'Helyes! Az ellaposodó görbe a nyelőcső intubáció klasszikus jele.'}]},
{sit:'Az orvos korrigál, újra intubál. Most gyönyörű, normál kapnográf görbe jelenik meg (A-E fázisokkal), EtCO2 értéke 42 Hgmm. Mit bizonyít ez?',opts:[{tx:'A tubus biztosan a légcsőben (trachea) van.',ok:true,fb:'Helyes! A szabályos görbe az endotrachealis helyzet legbiztosabb jele.'},{tx:'A beteg meg fog halni.',ok:false,fb:'Hibás! Ebből ez nem következik.'},{tx:'Újraélesztést kell kezdeni.',ok:false,fb:'Hibás! Van keringése a betegnek.'}]},
{sit:'A beteget most lélegeztetni kell. Mivel koponyasérült, mi a KÖTELEZŐ EtCO2 célérték az OMSZ eljárásrend alapján prehospitálisan?',opts:[{tx:'Szigorúan 35 Hgmm.',ok:true,fb:'Helyes! Koponyasérültnél a normocapnia alsó határa (35) a cél, a hyper- és hypocapnia egyaránt kerülendő.'},{tx:'Minél alacsonyabb, pl. 25 Hgmm.',ok:false,fb:'Hibás! A hyperventilatio roncsolja az agyi keringést.'},{tx:'45-50 Hgmm (permisszív hypercapnia).',ok:false,fb:'Hibás! Ez csak COPD esetén érvényes.'}]},
{sit:'Jelenleg 42 Hgmm az EtCO2. Hogyan éritek el a 35 Hgmm-es célértéket?',opts:[{tx:'Mélyebb (nagyobb volumenű) és kicsit szaporább lélegeztetéssel, növelve a perctérfogatot.',ok:true,fb:'Helyes! A magas CO2 kimosásához a ventilációt fokozni kell.'},{tx:'Ritkább (pl. 8/perc) lélegeztetéssel.',ok:false,fb:'Hibás! Ettől a CO2 tovább emelkedne.'},{tx:'Oxigén megvonásával.',ok:false,fb:'Hibás! Az oxigénnek nincs közvetlen köze a CO2 kimosásához így.'}]},
{sit:'Miért TILOS a rutin hyperventilatio (pl. 25-30 Hgmm-es EtCO2 elérése) koponyasérülteknél prehospitálisan?',opts:[{tx:'Mert a gép nem tud ilyet mérni.',ok:false,fb:'Hibás! Tud mérni.'},{tx:'Mert az alacsony CO2 agyi érösszehúzódást (vasoconstrictio) okoz, ami ischemiához és rosszabb neurológiai kimenetelhez vezet.',ok:true,fb:'Helyes! A hyperventilatio súlyos károkat okoz az agy vérszegénysége miatt.'},{tx:'Mert a beteg felébred tőle.',ok:false,fb:'Hibás! Épp ellenkezőleg, az agyi hypoxiát fokozza.'}]},
{sit:'Transzport közben a beteg pulzusa hirtelen 45/percre esik (bradycardia), vérnyomása felugrik 180/100 Hgmm-re. Egyik pupillája kitágul, fénymerev lesz. Mi történik?',opts:[{tx:'A beteg felébredt.',ok:false,fb:'Hibás! Ezek életveszélyes neurológiai tünetek.'},{tx:'Súlyos agyi oedema, beékelődés (Cushing-reflex) indult meg.',ok:true,fb:'Helyes! A hypertonia + bradycardia + tág pupilla egyértelmű Cushing-reflex.'},{tx:'Csak egy normális reflex.',ok:false,fb:'Hibás! Életveszélyes állapot.'}]},
{sit:'A fenti extrém beékelődéses helyzetben (Cushing-reflex) megengedi-e az eljárásrend a rövid ideig tartó hyperventilatiót?',opts:[{tx:'Nem, soha.',ok:false,fb:'Hibás! Van kivétel.'},{tx:'Igen, telefonos konzultáció után rövid ideig tartó (pár perces) hyperventilatio végezhető 32-35 Hgmm közötti EtCO2 eléréséig.',ok:true,fb:'Helyes! Ez az egyetlen prehospitális indikáció az átmeneti, enyhe hyperventilatióra agyoedema esetén.'},{tx:'Igen, azonnal le kell vinni 20 Hgmm alá.',ok:false,fb:'Hibás! 32 Hgmm alá sosem megyünk prehospitálisan.'}]},
{sit:'Konzultáltatok, az értéket 33 Hgmm-re állítjátok a frekvencia emelésével. B+ kompetenciával milyen gyógyszeres beavatkozás merül még fel a magas koponyaűri nyomás miatt (általános protokoll)?',opts:[{tx:'Szedáció és fájdalomcsillapítás optimalizálása iv., hogy a beteg ne préseljen, ne küzdjön a géppel.',ok:true,fb:'Helyes! B+ szinten a megfelelő gyógyszeres relaxáció/szedáció fenntartása (orvosi utasításra) kulcs.'},{tx:'Hörgőtágító adása.',ok:false,fb:'Hibás! A tüdeje rendben van.'},{tx:'Nagy mennyiségű iv. glükóz (cukor) adása.',ok:false,fb:'Hibás! Koponyasérültnél kerülni kell a felesleges glükózt.'}]},
{sit:'Megérkeztek a traumatológiára. A kapnográf görbe az átadásig folyamatosan szabályos, értéke 33 Hgmm. Mi volt a kapnográf legfontosabb szerepe a transzport alatt?',opts:[{tx:'Biztosította a folyamatos visszajelzést a tubus helyzetéről (elkerülve az észrevétlen extubációt) és lehetővé tette a célzott CO2-vezérelt lélegeztetést az agy védelmében.',ok:true,fb:'Helyes! Ez a prehospitalis EtCO2 monitorozás két legfontosabb előnye intubált koponyasérültnél.'},{tx:'Színesebbé tette a monitort.',ok:false,fb:'Hibás.'},{tx:'Helyettesítette a pulzoximétert.',ok:false,fb:'Hibás! Az oxigenizációt nem méri.'}]}
],summary:'A súlyos koponyasérült ellátása során a kapnográf előkészítése és kalibrálása már az intubáció alatt megtörtént. Az első (lapos) görbe sikeresen jelezte a nyelőcső intubációt, megmentve a beteget. A második (szabályos) görbe igazolta a helyes (endotrachealis) pozíciót. A lélegeztetést 35 Hgmm célértékre (normocapnia alsó határa) állítottuk be a frekvencia növelésével, mivel a rutin hyperventilatio tilos, mert agyi ischemiát okoz. Transzport közben beékelődés (Cushing-reflex: magas vérnyomás, alacsony pulzus, tág pupilla) tünetei jelentkeztek. Ebben az extrém helyzetben az eljárásrend megengedett egy rövid távú, enyhe hyperventilatiót (32-35 Hgmm közé), amit orvosi/telefonos konzultáció és megfelelő szedáció mellett végeztetek a kórházba érkezésig.'},

{id:3,title:'3. Súlyos COPD exacerbáció (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 68 éves férfi fullad, krónikus COPD-s. B+ szintű egységként látjátok el. A beteg tudata tiszta, de nagyon kimerült.',steps:[
{sit:'Beléptek a lakásba. A beteg a fotelban ül, légzési segédizmait használja, cyanoticus. Mi a teendő a kapnográffal egy nem intubált, spontán légző betegnél?',opts:[{tx:'Nem lehet kapnográfot használni, amíg nincs intubálva.',ok:false,fb:'Hibás! Van rá eszköz.'},{tx:'Nasalis kapnográf (orrkanül) felhelyezése a betegre, majd arra rá egy nem-visszalégző oxigénmaszk.',ok:true,fb:'Helyes! A spontán légző beteg státusza nasalis kapnográffal tökéletesen monitorozható.'},{tx:'Lenyeletek vele egy szenzort.',ok:false,fb:'Hibás!'}]},
{sit:'A nasalis kapnográf a monitoron görbét rajzol. A görbe felszálló szára elnyújtott, hiányzik a szögletesség a tetőn, úgy néz ki, mint egy "cápauszony". Mit jelez ez az eljárásrend alapján?',opts:[{tx:'Pneumothoraxot.',ok:false,fb:'Hibás! Arra nem ez a görbe jellemző.'},{tx:'Bronchospasmust (hörgőgörcsöt), ami a COPD klasszikus tünete.',ok:true,fb:'Helyes! A cápauszony alakú görbe a megnyúlt, nehezített kilégzés miatti légúti elzáródást (bronchospasmus) jelzi.'},{tx:'Nyelőcső intubációt.',ok:false,fb:'Hibás! A beteg nincs intubálva.'}]},
{sit:'A beteg EtCO2 értéke 65 Hgmm (nagyon magas). Mi a teendőd B+ kompetenciával?',opts:[{tx:'Azonnal intubálom.',ok:false,fb:'Hibás! B+ szinten nem intubálsz.'},{tx:'Inhalációs hörgőtágítót (pl. Salbutamol, Ipratropium) és iv. szteroidot adok protokoll szerint, közben oxigént kap a maszkból, és figyelem az EtCO2 trendet.',ok:true,fb:'Helyes! A bronchospasmus gyógyszeres oldása a prioritás B+ szinten, monitorozva a hatást.'},{tx:'Papírzacskóba lélegeztetem.',ok:false,fb:'Hibás! Ez életveszélyes hypoxia lenne.'}]},
{sit:'A gyógyszerek ellenére 15 perc múlva a beteg légzésszáma leesik, a cápauszony görbe ellaposodik, a beteg aluszékonnyá válik (kimerült). Mi a helyzet?',opts:[{tx:'A beteg meggyógyult, megnyugodott.',ok:false,fb:'Hibás! Az aluszékonyság a CO2 narkózis és a kimerülés jele.'},{tx:'A beteg kimerült, légzési elégtelensége fokozódik (romló EtCO2). Non-invazív lélegeztetés (NIV) indokolt.',ok:true,fb:'Helyes! A spontán légzés gyengülése (apnoe/kimerülés) eszközös beavatkozást, itt NIV-et (CPAP/BiPAP) igényel.'},{tx:'Hagyom aludni.',ok:false,fb:'Hibás! Ez légzésleálláshoz vezet.'}]},
{sit:'Előveszitek a NIV (non-invazív) gépet és maszkot. Hogyan szereled össze a kapnográfot a NIV rendszerben?',opts:[{tx:'NIV esetén nem kell filter, csak beteszem a szenzort a maszk mögé.',ok:false,fb:'Hibás! Itt is kötelező a filter.'},{tx:'A NIV maszk és a gégecső közé helyezem a HME-filtert és a kapnográf mintavevőt.',ok:true,fb:'Helyes! A HME-filter segít a párásításban és védi a szenzort, a kapnográf pedig értékeli a terápiát.'},{tx:'Leveszem a kapnográfot, a NIV gép mindent mér.',ok:false,fb:'Hibás! Az EtCO2-re szükség van a terápia megítéléséhez.'}]},
{sit:'A NIV beállítása után az orvos megérkezik (ALS). Mivel a NIV nem volt elég, az orvos intubálja a beteget. Intubáció után az EtCO2 érték 70 Hgmm. Mire kell törekedni a lélegeztetés során az eljárásrend (COPD specifikum) alapján?',opts:[{tx:'Agresszív hyperventilatióra, hogy azonnal lemenjen 35 Hgmm-re.',ok:false,fb:'Hibás! Ez barotraumát (PTX) és keringésmegállást okozna a COPD-s betegnél.'},{tx:'Permisszív hypercapnia: nem törekszünk a hypercapnia megszüntetésére. Magas induló érték esetén a lassú, csökkenő tendencia teljesen elfogadható.',ok:true,fb:'Helyes! A COPD-s beteg hozzá van szokva a magasabb CO2-höz, a kíméletes lélegeztetés a cél (permisszív hypercapnia).'},{tx:'Ki kell kapcsolni a kapnográfot.',ok:false,fb:'Hibás!'}]},
{sit:'Mit tesz az ALS egység a géppel, hogy megvalósítsa a permisszív hypercapniát?',opts:[{tx:'Nagyon magas frekvenciát (30/perc) állít be.',ok:false,fb:'Hibás! Ez csökkentené a CO2-t és roncsolná a tüdőt.'},{tx:'Alacsonyabb frekvenciát (pl. 10-12/perc) és hosszabb kilégzési időt állít be, hogy a "cápauszony" tüdőből ki tudjon áramolni a levegő (auto-PEEP elkerülése).',ok:true,fb:'Helyes! A hosszú kilégzési idő alapvető a bronchospasmusban.'},{tx:'Nincs rajta a gép, kézzel fújja amilyen gyorsan csak bírja.',ok:false,fb:'Hibás!'}]},
{sit:'A szállítás alatt a kapnográf görbe szögletessé kezd válni (eltűnik a cápauszony). Mit jelent ez?',opts:[{tx:'A gyógyszerek (hörgőtágítók) hatnak, a légúti ellenállás (bronchospasmus) csökken.',ok:true,fb:'Helyes! A görbe normalizálódása a terápia sikerét mutatja.'},{tx:'A gép elromlott.',ok:false,fb:'Hibás! Ez pozitív klinikai jel.'},{tx:'A tüdő kilyukadt.',ok:false,fb:'Hibás! Arra nem ez jellemző.'}]},
{sit:'Ha a szállítás közben a görbe hirtelen megtörik a plató fázisban (Curare-rés), az mire utalna?',opts:[{tx:'Szétcsúszott a rendszer.',ok:false,fb:'Hibás! Az lapos görbét ad.'},{tx:'Az izomrelaxáns hatása múlik, a beteg elkezdett spontán is be-belélegezni a gép ellenében.',ok:true,fb:'Helyes! Ez a "curare cleft", jelzi a szedáció/relaxáció pótlásának szükségességét.'},{tx:'A szív megállt.',ok:false,fb:'Hibás!'}]},
{sit:'Milyen további haszna volt a nasalis kapnográfiának a NIV/Intubáció előtt a folyamatban?',opts:[{tx:'Semmi, csak időhúzás volt.',ok:false,fb:'Hibás! Nagyon is hasznos volt.'},{tx:'Objektíven mutatta az EtCO2 emelkedését, a beteg kimerülését (légzésszám csökkenést), így időben felismerhető volt a légzési elégtelenség és a beavatkozás szükségessége.',ok:true,fb:'Helyes! A spontán légző kapnográfia kiváló trendmonitor a terápia hatékonyságának mérésére.'},{tx:'Kiváltotta a vérnyomásmérést.',ok:false,fb:'Hibás!'}]}
],summary:'A COPD exacerbációs betegnél először nasalis kapnográfiát alkalmaztunk, amire maszkból O2-t kapott. A kapnográf "cápauszony" görbéje azonnal igazolta a bronchospasmust (elzáródást). B+ szinten hörgőtágítót kapott, de az állapota romlott (kimerült). A kimerülést az EtCO2 trend és a légzésszám esése jelezte. A NIV lélegeztetés beállításakor szintén használtunk filtert és kapnográfot. Végül az orvos intubálta a beteget. A nagyon magas (70 Hgmm) CO2 szint miatt a permisszív hypercapnia stratégiáját alkalmaztuk: alacsony frekvencia, hosszú kilégzési idő, nem erőltetve a normocapniát, megelőzve az auto-PEEP kialakulását és a barotraumát. A görbe (cápauszony) javulása menet közben a terápia sikerét mutatta, míg egy esetleges plató-megtöretés a beteg ébredését (relaxáns múlását) jelezte volna.'},

{id:4,title:'4. Szepszis és Súlyos Acidosis (B kompetencia)',diff:'B kompetencia',desc:'Egy 25 éves, lázas beteghez érkezel, aki letargiás, eszméleténél van, de nagyon szaporán, mélyeket lélegzik (Kussmaul-légzés). B kompetencia (nincs véna, gyógyszer).',steps:[
{sit:'A beteg ABCDE vizsgálata során a B-légzés: nagyon mély és szapora (Kussmaul-típusú). Mi a teendőd a légzéssel B kompetenciánál?',opts:[{tx:'Azonnal maszkot teszek az arcára és ballonal próbálom lassítani a légzését.',ok:false,fb:'Hibás! A Kussmaul-légzés egy fontos kompenzatorikus mechanizmus (acidosis ellen), nem szabad erőszakkal lassítani.'},{tx:'Oxigént adok nem-visszalégző maszkon, és felhelyezem a nasalis kapnográfot a státusz értékelésére.',ok:true,fb:'Helyes! Oxigén adása és az EtCO2 mérése a teendő beavatkozás nélkül.'},{tx:'Semmit, hagyom így.',ok:false,fb:'Hibás! Monitorozni kell.'}]},
{sit:'A nasalis kapnográf EtCO2 értéke 18 Hgmm (nagyon alacsony). A beteg nem hypotensiós (vérnyomása 110/70). Lázas, vélhetően fertőzése van. Mit jelenthet a protokoll szerint a <25 Hgmm-es nasalis EtCO2 ebben a helyzetben?',opts:[{tx:'Hogy túl sok oxigént kapott.',ok:false,fb:'Hibás! Az oxigén okozhat kis esést, de a klinikai kép mást mutat.'},{tx:'A szepszis súlyosságát: a spontán légző, nem hypotensiós szeptikus beteg 25 Hgmm alatti EtCO2 értéke kritikus, 4 mmol/l feletti laktátszinttel (acidosis) korrelál.',ok:true,fb:'Helyes! A beteg súlyos metabolikus acidosisban van, amit hyperventilatióval (CO2 kimosással) kompenzál.'},{tx:'Csak izgul a mentők miatt.',ok:false,fb:'Hibás! Ez súlyos életveszélyes állapot.'}]},
{sit:'Mivel B kompetenciás mentőápoló vagy, milyen logisztikai döntést kell azonnal meghoznod a felismert súlyos szeptikus (laktát acidosis) állapot láttán?',opts:[{tx:'Azonnal ALS szintű segélykocsit/mentőorvost kérek (esetleg azonnali célzott transzportot kezdek SBO-ra), mert a beteg kritikus állapotú és vénás folyadék/antibiotikum (ALS beavatkozás) szükséges.',ok:true,fb:'Helyes! A szepszis gyanú és az extrém alacsony EtCO2 azonnali magas szintű segítséget igényel.'},{tx:'Hagyom otthon pihenni, igyon sok teát.',ok:false,fb:'Hibás! A beteg meghalhat.'},{tx:'Adok neki szájon át fájdalomcsillapítót.',ok:false,fb:'Hibás! A szepszist nem gyógyítja.'}]},
{sit:'Megérkezik a segélykocsi, a mentőorvos látja a kimerülő beteget, és az intubálás mellett dönt. Intubáció után hogyan kell lélegeztetni az eljárásrend alapján ezt a súlyos acidosissal küzdő beteget?',opts:[{tx:'Rutin módon, normál 12/perc frekvenciával (35 Hgmm-es EtCO2 cél), hisz az a standard.',ok:false,fb:'Hibás! Szepszisben és acidosisban a rutin lélegeztetés halálos lehet.'},{tx:'Szigorú telefonos konzultáció javasolt! A szervezet által fenntartott magas percventilációt (hyperventilatio, alacsony CO2) gyorsan csökkenteni agresszív hiba, mert az acidosis kritikus fokozódásához és keringésmegálláshoz vezethet!',ok:true,fb:'Helyes! A gépi lélegeztetéssel utánozni kell a beteg korábbi kompenzációs (szapora) légzését, különben a pH halálos szintre esik.'},{tx:'Hypercapniát kell elérni (50 Hgmm fölött).',ok:false,fb:'Hibás! Ez pont az acidosisba taszítaná.'}]},
{sit:'A helyszíni intubációt követően a kapnográf görbe alapján a doktornő állítja be a gépet. Miért kell továbbra is a kapnográf a csövön?',opts:[{tx:'Az EtCO2-vezérelt lélegeztetés miatt, hogy lássák, a kompenzatorikus alacsony CO2 szintet sikerül-e tartani a géppel, illetve a tubus biztonságos helyzetének ellenőrzésére.',ok:true,fb:'Helyes! A folyamatos CO2 monitorozás létfontosságú.'},{tx:'Csak mert a protokoll kötelezővé teszi.',ok:false,fb:'Hibás! Bár kötelező, nagyon is valós klinikai célja van.'},{tx:'Hogy lássák az O2 szaturációt.',ok:false,fb:'Hibás! Azt a pulzoximéter méri.'}]},
{sit:'B kompetenciával, amíg vártátok az ALS-t, a kapnográf korlátaival kapcsolatban mire kellett figyelned az alacsony EtCO2 értékelésénél?',opts:[{tx:'A nagyáramlású oxigén nasalis kapnográf mellett némileg falsul alacsonyabb értéket mutathat, de a változások követésére (trend) továbbra is tökéletes.',ok:true,fb:'Helyes! Az eljárásrend leírja, hogy O2 maszk alatt az érték kissé alacsonyabb lehet, de klinikailag így is releváns.'},{tx:'Hogy gyermekeknél 18 éves korig rossz az érték.',ok:false,fb:'Hibás! Csak 5-6 éves korig jelentős a holttér problémája.'},{tx:'Hogy sötétben nem mér jól.',ok:false,fb:'Hibás!'}]},
{sit:'Ha a beteg hirtelen hypotensióba (alacsony vérnyomás, shock) kerülne a helyszínen, az hogyan befolyásolná az EtCO2 értéket?',opts:[{tx:'Falsul magassá tenné.',ok:false,fb:'Hibás.'},{tx:'A rossz perfúzió (keringés) miatt kevesebb CO2 jut el a tüdőhöz, így a mért érték még alacsonyabb lesz (tévesen még súlyosabb légzési képet mutatva).',ok:true,fb:'Helyes! Hypotensio csökkenti az EtCO2-t.'},{tx:'Nem befolyásolja.',ok:false,fb:'Hibás! A kapnográf a tüdő véráramlásától is függ.'}]},
{sit:'Milyen további esetekben hasznos a nasalis kapnográfia B kompetencia esetén (ahol Te is rutinszerűen feltehetnéd)?',opts:[{tx:'Semmilyen más esetben.',ok:false,fb:'Hibás!'},{tx:'Bármilyen okból eszméletlen beteg (pl. szedált, részeg), vagy görcsroham alatt a légzési státusz (apnoe) gyors megítélésére.',ok:true,fb:'Helyes! A nasalis kapnográf hamarabb jelez légzésleállást, mint a pulzoximéter.'},{tx:'Csak halottakon.',ok:false,fb:'Hibás!'}]},
{sit:'A kórházba szállítás során a szeptikus, intubált beteg vérnyomása stabilizálódik a kapott folyadéktól. A kapnográf görbéje változatlanul szép, szögletes (A-E fázisok rendben). Ebből kiderül-e, hogy van-e bronchospasmusa?',opts:[{tx:'Igen, mivel a görbe szögletes (normál), így NINCS bronchospasmus (nincs cápauszony).',ok:true,fb:'Helyes! A szabályos téglalap-szerű alak kizárja a hörgőgörcsöt.'},{tx:'Nem, azt csak hallgatózással lehet megmondani.',ok:false,fb:'Hibás! A kapnográf nagyon érzékeny az alsó légúti obstrukcióra.'},{tx:'Igen, a szögletes görbe a legsúlyosabb bronchospasmust jelenti.',ok:false,fb:'Hibás! Az a cápauszony.'}]},
{sit:'Mi volt a B kompetenciájú mentőápoló legfontosabb döntése ebben az esetben az eljárásrend szellemében?',opts:[{tx:'Hogy megvárta, amíg elmúlik a láz.',ok:false,fb:'Hibás!'},{tx:'A kapnográfia felhelyezése és a kórosan alacsony (<25) nasalis EtCO2 alapján a súlyos laktát acidosis (szepszis) felismerése, a kompenzációs légzés meghagyása, és azonnali ALS segítség hívása.',ok:true,fb:'Helyes! Az eszköz kiváló triage funkciót töltött be a korai stádiumban.'},{tx:'Hogy sikeresen intubált.',ok:false,fb:'Hibás! B szinten nem intubálunk.'}]}
],summary:'A szeptikus, lázas beteg (Kussmaul-légzés) megközelítésekor nasalis kapnográfot alkalmaztunk oxigénmaszk alatt. A mért rendkívül alacsony EtCO2 (18 Hgmm) a protokoll szerint a súlyos laktát acidosissal (<25 Hgmm = magas laktát) korrelált. Ezt felismerve azonnal ALS-t (segélykocsit) hívtunk, B kompetenciával nem próbáltuk lassítani a kompenzatorikus szapora légzést. Az orvos kiérkezése után intubálta a beteget. Intubáció után tilos volt visszatérni a normál lélegeztetési frekvenciára, a géppel is a szapora, hyperventilációs (alacsony CO2) módot kellett fenntartani, nehogy a beteg végleges, halálos acidosisba (keringésmegállásba) essen. A kapnográfia a hypotensio veszélyeinek (falsul alacsony értékek) tudatában végig megbízható trendet és tubus-ellenőrzést biztosított a transzport alatt.'}
];

 ['flash','🃏','Flashkártyák','12 db vizsgakártya forgatással'],

 ['sim','🚑','Szimuláció','4 db B / B+ interaktív eset'],

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+h(i)+'</li>').join('')+'</ul>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';

}

// Kapnográf kiértékelő logika (A fókuszvesztés elkerüléséért kiszervezve)
function getEtCO2Eval(v, mode) {
  let rec = "";
  let color = "#14b8a6";
  if(mode === 'norm') {
    if(v < 35) { rec = "Kórosan alacsony (hypocapnia). Lehet hyperventilatio, csökkent perfúzió (hypotensio) vagy technikai ok."; color="#fca5a5"; }
    else if(v <= 38) { rec = "Normális EtCO2 érték. A lélegeztetési paraméterek megfelelőek."; color="#4ade80"; }
    else { rec = "Kórosan magas (hypercapnia). Hypoventilatio vagy megnövekedett metabolizmus jele. Frekvencia növelése javasolt."; color="#fca5a5"; }
  } else if (mode === 'cpr') {
    if(v < 10) { rec = "Kritikusan alacsony. 20 perc után rossz prognózist jelez. Próbálj mélyebb mellkasi kompressziókat végezni!"; color="#fca5a5"; }
    else if(v < 20) { rec = "Elfogadható újraélesztés alatt, de törekedj hatékonyabb, mélyebb kompressziókra a jobb perfúzióért."; color="#fde047"; }
    else if(v < 35) { rec = "Jó minőségű CPR. Ha az érték hirtelen ugrott ide (pl. 10-ről 35-re), azonnal vizsgáld a ROSC (spontán keringés) jelenlétét!"; color="#4ade80"; }
    else { rec = "Magas érték. Ha hirtelen emelkedett, ROSC gyanúja áll fenn!"; color="#4ade80"; }
  } else if (mode === 'tbi') {
    if(v < 32) { rec = "TILOS! Az extrém hyperventilatio agyi ischemiát (vasoconstrictio) okoz! Csökkentsd a lélegeztetési frekvenciát!"; color="#fca5a5"; }
    else if (v <= 35) { rec = "Megfelelő csak akkor, ha súlyos beékelődés (Cushing-reflex) áll fenn, ÉS telefonos konzultáció történt. (Cél egyébként szigorúan 35)."; color="#fde047"; }
    else if (v <= 38) { rec = "Koponyasérültnél a cél a normocapnia alsó határa (35 Hgmm). Enyhe frekvencia növeléssel vidd közelebb a 35-höz."; color="#4ade80"; }
    else { rec = "Hypercapnia koponyasérültnél TILOS (agyi vasodilation -> ICP nő)! Növeld a lélegeztetési frekvenciát!"; color="#fca5a5"; }
  } else if (mode === 'copd') {
    if(v < 35) { rec = "Agresszív hyperventilatio COPD-ben barotraumát (PTX) és keringésmegállást okozhat a kialakuló auto-PEEP miatt. Lassíts!"; color="#fca5a5"; }
    else if(v <= 38) { rec = "Normocapnia, elfogadható, de ne erőltesd, ha ehhez túl magas frekvencia szükséges."; color="#4ade80"; }
    else { rec = "Permisszív hypercapnia. Magas érték (akár >50) elfogadható COPD-ben, ne törekedj agresszíven a normocapniára! A csökkenő tendencia már jó."; color="#14b8a6"; }
  } else if (mode === 'sepsis') {
    if(v < 25) { rec = "Ha a beteg spontán légző és nem hypotensiós: Súlyos szepszisre (magas >4 mmol/l laktátszintre) utal. Intubálás esetén TILOS elvenni ezt a kompenzációs hyperventilatiót, különben a vér pH-ja halálos szintig savasodik!"; color="#fca5a5"; }
    else { rec = "A kompenzatorikus hyperventilatio hiánya vagy a beteg kimerülése. Kövesd nyomon szorosan!"; color="#fde047"; }
  }
  return {rec, color};
}

function renderCalc(){
  let evalData = getEtCO2Eval(CL.v, CL.mode);
  
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">EtCO2 Kalkulátor és Értékelő</h2>'+
  '<div class="al al-i">Állítsd be a kapnográfon mért értéket és a klinikai szituációt az eljárásrend szerinti célértékek és javaslatok megtekintéséhez.</div>'+
  '<div class="card">'+
  '<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Klinikai szituáció</div>'+
  '<select id="calc_mode" onchange="setEtCO2Mode(this.value)">'+
  '<option value="norm" '+(CL.mode==='norm'?'selected':'')+'>Általános (Normál)</option>'+
  '<option value="cpr" '+(CL.mode==='cpr'?'selected':'')+'>Újraélesztés (CPR)</option>'+
  '<option value="tbi" '+(CL.mode==='tbi'?'selected':'')+'>Súlyos koponyasérülés</option>'+
  '<option value="copd" '+(CL.mode==='copd'?'selected':'')+'>COPD exacerbáció (Intubált)</option>'+

  '</select>'+
  '<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px;margin-top:10px">Mért EtCO2 érték (Hgmm)</div>'+

  '<div style="font-size:42px;font-weight:700;color:'+evalData.color+';margin-bottom:10px">'+CL.v+' <span style="font-size:16px">Hgmm</span></div>'+
  '<div style="font-size:13px;color:#e5e7eb;text-align:left;line-height:1.5"><strong>Értékelés:</strong><br>'+h(evalData.rec)+'</div>'+
  '</div></div>';
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
if (SCR !== 'calc') window.scrollTo(0,0);
}

// Navigáció és Események
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

// --- KALKULÁTOR SZELEKTÍV FRISSÍTÉSE (FÓKUSZ MEGTARTÁSA) --- //
window.setEtCO2Mode = function(m) {
  CL.mode = m;
  upEtCO2();
};

window.setEtCO2 = function(v) {
  CL.v = +v;
  upEtCO2();
};

function upEtCO2() {
  var rb = document.getElementById('etco2_resbox');
  if(!rb) return;
  var evalData = getEtCO2Eval(CL.v, CL.mode);
  
  rb.style.borderColor = evalData.color;

  '<div style="font-size:13px;color:#e5e7eb;text-align:left;line-height:1.5"><strong>Értékelés:</strong><br>'+h(evalData.rec)+'</div>';
