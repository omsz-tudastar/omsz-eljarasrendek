window.showGl = function(word) {
  document.getElementById('glModalTitle').innerText = word;
  document.getElementById('glModalBody').innerText = GLOSSARY[word.toLowerCase()];

};

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function h_gl(text) {
  let res = h(text);
  let keys = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  keys.forEach(key => {
    let regex = new RegExp('\\b(' + key + '(?:t|ban|ben|hoz|hez|höz|nak|nek|val|vel|ra|re|ról|ről)?)\\b', 'gi');
    res = res.replace(regex, '<span class="gl-word" onclick="showGl(\'$1\')">$1</span>');
  });
  return res;
}

function renderBlock(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+h_gl(i)+'</li>').join('')+'</ul>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h_gl(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+h_gl(b.tx)+'</div>';
  if(b.tp==='ft'){
    return '<div class="tbl-wrap"><table class="tbl"><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:700;color:#38bdf8;width:40%">'+h(r.n)+'</td><td>'+h_gl(r.d)+'</td></tr>').join('')+'</tbody></table></div>';
  }
  if(b.tp==='ft_tools'){
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Eszköz</th><th>Átlátszóság</th><th>Védelem (P/Á/S/V)</th><th>Külső melegítés</th><th>Neutrális pozíció</th></tr></thead><tbody>'+
    '<tr><td>Műanyag fólia</td><td>Igen</td><td>Párolgás, Áramlás</td><td>Könnyű</td><td>Nem</td></tr>'+
    '<tr><td>Buborékfólia</td><td>Részben</td><td>Párolgás, Áramlás, Vezetés</td><td>Korlátozottabb</td><td>Kialakítható</td></tr>'+

}

var SIMS=[
{id:1,title:'1. Szimuláció: Érett újszülött, Lakás, 26°C',diff:'B kompetencia',desc:'Kiérkezés egy 26°C-os fűtött lakásba. A kismama percekkel a mentő érkezése előtt megszült egy egészséges, időre született babát, aki hangosan sír.',steps:[
{sit:'Megérkezés után ellenőrzöd a környezetet (26°C). A baba épp most született meg. Mi az első teendő a hővédelem szempontjából?',opts:[{tx:'Azonnal becsomagolom izolációs fóliába.',ok:false,fb:'Hibás! Meleg lakásban az érett újszülöttnél más a protokoll.'},{tx:'Előmelegített tiszta textíliával szárazra törlöm az újszülöttet.',ok:true,fb:'Helyes! A párolgásos hővesztés megelőzésére azonnal szárazra kell törölni.'},{tx:'Kinyitom az ablakot, hogy friss levegőt kapjon.',ok:false,fb:'Hibás! A huzat (konvekció) jelentős hővesztést okoz.'}]},
{sit:'Megtörtént a szárazra törlés a textíliával. Mi történik ezzel a kendővel/textíliával ezután?',opts:[{tx:'Rajta hagyom a babán, hogy melegítse.',ok:false,fb:'Hibás! A nedves textil hűti a babát.'},{tx:'Eltávolítom az újszülöttről, mert a nedves textília párolgásos (evaporációs) hővesztést okoz.',ok:true,fb:'Helyes! Szigorúan el kell távolítani.'},{tx:'Kifacsarom és újra bebugyolálom vele.',ok:false,fb:'Hibás!'}]},
{sit:'A baba immár száraz. A környezet 26°C. Hová helyezed az újszülöttet?',opts:[{tx:'Leteszem a hordágyra egy takaróra.',ok:false,fb:'Hibás! Nem használod ki a legjobb hőforrást.'},{tx:'A mentőápoló kollégám karjába adom, amíg az anyát vizsgálom.',ok:false,fb:'Hibás! Szigorúan kerülendő gyakorlat.'},{tx:'Haladéktalanul az édesanyja (vagy apja) hasára/mellkasára teszem bőr-bőr kontaktusba.',ok:true,fb:'Helyes! A felnőtt teste lesz a folyamatos hőforrás (kondukció).'}]},
{sit:'A baba az anya mellkasán fekszik. Hogyan kell betakarni őket ebben a meleg környezetben?',opts:[{tx:'Nem kell betakarni, elég meleg van (26°C).',ok:false,fb:'Hibás! A hővesztés így is fennáll.'},{tx:'Izolációs ezüst fóliával tekerem körbe mindkettőjüket szorosan.',ok:false,fb:'Hibás! Meleg szobában ez túlzott és gátolja az obszervációt.'},{tx:'Textíliákkal/takaróval együtt betakarom az anyát és az újszülöttet, a baba fejét is fedve, de ügyelve, hogy az orra és szája szabad maradjon.',ok:true,fb:'Helyes! Ez a protokoll a meleg/semleges hőmérsékleti viszonyok között.'}]},
{sit:'A baba ellátása alatt a családtagok szeretnének odamenni és felváltva kézbe venni, fotózni a babát. Mit teszel?',opts:[{tx:'Megengedem, a jó élmény fontos.',ok:false,fb:'Hibás! Ez rontja a hővédelmet és az adaptációt.'},{tx:'Határozottan, de udvariasan megkérem őket, hogy ettől tekintsenek el, mivel a felesleges mozgatás és szeparáció szigorúan kerülendő a protokoll szerint.',ok:true,fb:'Helyes! Minden felesleges mozgatás és fényképezés (még szülői beleegyezéssel is) kerülendő.'},{tx:'Csak egy fotót engedek.',ok:false,fb:'Hibás!'}]},
{sit:'Milyen gyakorisággal kell az újszülött testhőmérsékletét ellenőrizni, és hogyan?',opts:[{tx:'Nem kell, mert az anya melegíti.',ok:false,fb:'Hibás! A hyper/hypothermia kockázata miatt kötelező a mérés.'},{tx:'Folyamatosan figyelni/mérni kell (pl. non-kontakt hőmérővel vagy a hát alá helyezett szenzorral), anélkül, hogy a hővédelmet megbontanánk.',ok:true,fb:'Helyes! A folyamatos obszerváció kötelező.'},{tx:'15 percenként leveszem róla a takarókat és hónaljban mérem.',ok:false,fb:'Hibás! A védelem megbontása hővesztést okoz.'}]},
{sit:'A mentésirányítás érdeklődik a szállításról. Mind az anya, mind a baba alacsony rizikójú, stabil. Mikor érdemes elindulni?',opts:[{tx:'Azonnal csomagolunk és rohanunk a mentőhöz.',ok:false,fb:'Hibás! Stabil állapotnál nem indokolt a kapkodás.'},{tx:'Biztosítjuk a 20-30 perces helyszíni, békés adaptációs szakaszt, ezalatt adminisztrálunk.',ok:true,fb:'Helyes! A háborítatlan adaptációs szakasz joga megilleti őket.'},{tx:'Megvárjuk az ügyeletes orvost, hogy ő vigye el.',ok:false,fb:'Hibás! Mentő fogja szállítani.'}]},
{sit:'Letelt a 20-30 perc. Készültök a szállításra. A kint parkoló mentőhöz kell vinni őket (kint hideg van). Mit teszel a babával a szállítás megkezdése ELŐTT?',opts:[{tx:'Az anya kezébe adom a takaró alatt, majd az anyát hordágyra teszem.',ok:false,fb:'Hibás! A szabadban a takaró nem elég, fólia is kell.'},{tx:'Amennyiben eddig nem történt meg, az újszülöttet polietilén fóliába vagy neohelp zsákba helyezem, így viszem ki.',ok:true,fb:'Helyes! A szállítás alatti hővédelemhez (főleg hidegben) elengedhetetlen a fólia/zsák.'},{tx:'Felöltöztetem az anyuka által adott kisingbe.',ok:false,fb:'Hibás! A fólia a szabvány.'}]},
{sit:'A mentőautóban hogyan utazhat a baba betegbiztonsági szempontból?',opts:[{tx:'Az anya hasán, ahogy eddig volt.',ok:false,fb:'Hibás! Mozgó járműben ez nem biztonságos.'},{tx:'A mentőápoló ölében rögzítve.',ok:false,fb:'Hibás! Szintén nem biztonságos.'},{tx:'Speciális rögzítőben/inkubátorban; sem az anya hasán, sem karjában, sem mózeskosárban nem utazhat.',ok:true,fb:'Helyes! A betegbiztonsági szempontok felülírják a bőr-bőr kontaktust mozgó járműben.'}]},
{sit:'A szállítás alatt (bár a mentő fűtött) hogyan biztosítod a baba további melegen tartását a hordágyon/rögzítőben?',opts:[{tx:'A fólia/zsák mellett melegítőpárnát vagy meleg víz/infúzió palackot teszek mellé, és betakarom izolációs/textil takaróval, vigyázva az égésre.',ok:true,fb:'Helyes! Mivel az anya hőforrása kiesett, mesterséges külső hőforrás kell.'},{tx:'Bekapcsolom a klímát melegre és leveszem a fóliát.',ok:false,fb:'Hibás! A fólia marad, a klíma levegője kiszárít/konvekciót okoz.'},{tx:'Folyamatosan dörzsölöm a bőrét.',ok:false,fb:'Hibás! Zavarja a babát és sérülést okozhat.'}]}
],summary:'Összefoglaló (Érett, Meleg környezet): Megérkezéskor a lakás megfelelő, 26°C-os. A baba érett. A protokollt követve az első lépés az előmelegített textíliával való szárazra törlés volt (evaporáció megelőzése). A nedves textilt azonnal eltávolítottuk, majd a babát az anya (vagy apa) mellkasára helyeztük (kondukció - bőr-bőr kontaktus). Kívülről mindkettőjüket együtt betakartuk úgy, hogy az arc szabad maradjon. A hozzátartozók mozgatási és fotózási kéréseit elutasítottuk, védve az adaptációt. Az obszerváció (hőmérés) folyamatos, a takaró megbontása nélkül zajlott. Mivel az állapot stabil volt, 20-30 perc békés adaptációs szakaszt biztosítottunk a transzport megkezdése előtt. A kinti hideghez és a szállításhoz a babát Neohelp zsákba / fóliába helyeztük. A mentőautóban betegbiztonsági okokból szeparáltan, speciális rögzítőben szállítottuk, mesterséges hőforrás (melegítőpárna) és izolációs takarás alkalmazásával, folyamatos hőmérés mellett.'},

{id:2,title:'2. Szimuláció: Érett újszülött, Utca, -2°C',diff:'B kompetencia',desc:'Téli időjárás, -2°C, havazás. A nő egy utcai kapualjban szült meg. A mentőegység azonnal megérkezik a szülés pillanatában.',steps:[

{sit:'A baba a kezedben van. Extrém hideg környezet (-2°C). Mit ír elő az eljárásrend a szárazra törléssel kapcsolatban?',opts:[{tx:'Nagyon alaposan, többször át kell dörzsölni meleg kendővel.',ok:false,fb:'Hibás! Extrém hidegben más a protokoll.'},{tx:'Extrém hideg külső hőmérséklet esetén a szárítás/törlés lépése MARADJON KI!',ok:true,fb:'Helyes! A hideg levegő és a párolgás miatt a törlés idővesztesége és a kitettség végzetes lehűlést okoz. Azonnal izolálni kell.'},{tx:'Csak a fejét szabad letörölni.',ok:false,fb:'Hibás!'}]},
{sit:'A törlést kihagyod. Mi a következő AZONNALI lépés?',opts:[{tx:'Törlés nélkül egyből polietilén fóliába vagy neohelp zsákba helyezem az újszülöttet.',ok:true,fb:'Helyes! A fólia azonnal megakadályozza a párolgásos (evaporációs) és áramlásos (konvekciós) hővesztést.'},{tx:'Betekerem egy száraz plédbe.',ok:false,fb:'Hibás! A nedves baba a plédet is átnedvesíti, ami áthűl. A fólia az első réteg.'},{tx:'Sietve befutok vele a mentőbe, fedetlenül.',ok:false,fb:'Hibás! Még másodpercekre sem lehet védelem nélkül a fagyban.'}]},
{sit:'A baba a fóliában/neohelp zsákban van. Kinek a testére teszed a fagyos kapualjban?',opts:[{tx:'A saját (ellátó) kabátom alá.',ok:false,fb:'Hibás! Az anyai kontaktust preferáljuk, ráadásul neked szabad kéz kell az ellátáshoz.'},{tx:'Leteszem a mentőhordágyra egy takaróra.',ok:false,fb:'Hibás! A hordágy hideg (kondukciós hővesztés).'},{tx:'Azonnal az édesanyja hasára/mellkasára teszem hőforrásként.',ok:true,fb:'Helyes! Fólián keresztül (vagy alatta) is a szülő adja a legnagyobb testmeleget a helyszínen.'}]},
{sit:'A baba az anyán van fóliában. Hogyan alakítod ki a további hővédelmet (betakarást) a protokoll szerint extrém hidegben?',opts:[{tx:'Mindkettőjüket mint egy egységet közösen takarom be: először száraz textíliákkal, majd ezen kívül izolációs (ezüst) takaróval is.',ok:true,fb:'Helyes! Fólia -> Anya -> Közös meleg/száraz textil -> Közös izolációs takaró (hősugárzás ellen).'},{tx:'Csak az újszülöttet tekerem be az izolációs takaróba, anyát nem.',ok:false,fb:'Hibás! Az izolációs takaró elválasztja a babát a hőforrástól (anya), ha csak a babán van.'},{tx:'Sok-sok vizes lepedőt teszek rájuk szigetelésnek.',ok:false,fb:'Hibás!'}]},
{sit:'Melyik hővesztési formát gátolja a leginkább a KÍVÜLRŐL (a textíliákon túl) felhelyezett izolációs takaró (hőtükör)?',opts:[{tx:'A vezetéses (kondukció) hővesztést a föld felé.',ok:false,fb:'Hibás! A hátuk alatt a hordágy/ruha szigetel.'},{tx:'A sugárzásos (radiációs) hőleadást a hűvösebb külvilág (fagyos levegő/ég) felé.',ok:true,fb:'Helyes! Az izolációs fólia hőtükör hatása a radiáció ellen véd a legjobban.'},{tx:'A párolgást.',ok:false,fb:'Hibás! Azt a legbelső réteg (polietilén fólia) gátolta meg.'}]},
{sit:'Beemelitek a hordágyat a fűtött mentőautóba. A baba fóliában, az anyán van. Kibontod-e a babát most, hogy törölközővel szárazra töröld?',opts:[{tx:'Igen, most már meleg van, meg kell törölni.',ok:false,fb:'Hibás! A fólia levétele hirtelen hőmérsékletesést, konvekciót okoz.'},{tx:'Nem, a megbontás drasztikus hővesztéssel járna; a baba maradjon a zsákban a kórházi hőmérséklet-stabilizálásig.',ok:true,fb:'Helyes! A zsák megbontása prehospitálisan már nem javasolt, ha egyszer benne van.'},{tx:'Csak egy gyors törlésre veszem ki.',ok:false,fb:'Hibás!'}]},
{sit:'A baba pulzusa és légzése stabil, de testhőmérsékletét folyamatosan monitorozni kell. Hogyan teszed meg ezt a zsák (Neohelp) megbontása nélkül?',opts:[{tx:'Tűszúrással hőmérőt vezetek a zsákba.',ok:false,fb:'Hibás! Tönkreteszi a fóliát és balesetveszélyes.'},{tx:'Folyamatos obszervációval, eldobható hőmérsékletmérő szenzorral az újszülött háta alá helyezve, vagy non-kontakt hőmérővel az átlátszó fólián/nyíláson át.',ok:true,fb:'Helyes! A protokoll a noninvazív, megbontás nélküli technikákat javasolja.'},{tx:'Ha átlátszó a zsák, ránézésből tudom a hőfokot.',ok:false,fb:'Hibás! Számot kell mérni.'}]},
{sit:'A transzport megkezdéséhez a két mentőegység (te és a koramentő) a helyszínen van. Hogyan szállítjátok be őket az eljárásrend szerint?',opts:[{tx:'Mindenkit a saját kocsimba teszek, a koramentő csak kísérő.',ok:false,fb:'Hibás! A koramentő az újszülött szállítására hivatott.'},{tx:'Két külön mentővel: az újszülöttet a koraszülött mentő inkubátorában, az édesanyát a másik egységgel, biztosítva a tökéletes rögzítést és hővédelmet.',ok:true,fb:'Helyes! A biztonságos rögzítés és a fűtött inkubátor a legjobb megoldás.'},{tx:'Az anyát otthagyjuk, csak a gyereket visszük.',ok:false,fb:'Hibás!'}]},
{sit:'Mi a teendő, ha a koramentő nem ért volna oda, és neked kell szállítani mindkettőt?',opts:[{tx:'A babát a neohelp zsákban, az anyától szeparáltan, egy melegítőpárnával ellátott speciális rögzítőbe (pólyába) helyezem a mentőn belül, betakarva, és folyamatos figyelem, elkerülve a melegítőpárna okozta égést.',ok:true,fb:'Helyes! Bár nem ideális, a szeparált biztonságos rögzítés + külső hőforrás (párna) + fólia a szabály.'},{tx:'Az anya kezébe adom a rögzítetlen hordágyon.',ok:false,fb:'Hibás! Betegbiztonsági szabályszegés.'},{tx:'Egy felnőtt hordágyra teszem szabadon.',ok:false,fb:'Hibás! Leesés veszélye.'}]}
],summary:'Összefoglaló (Érett, Extrém hideg): A kiérkezés fagyos környezetbe (-2°C) azonnali cselekvést és magasabb szintű segítség (koramentő, 2. egység) hívását igényelte. A kritikus lépés az eljárásrend szerint: EXTRÉM HIDEGBEN A SZÁRAZRA TÖRLÉS LÉPÉSÉNEK KIHAGYÁSA. A nedves újszülöttet azonnal Neohelp zsákba (vagy polietilén fóliába) helyeztük, ezzel gátolva a masszív párolgásos hővesztést. A babát a zsákkal együtt az anya mellkasára raktuk (bőr-bőr, mint fő hőforrás), majd közösen betakartuk őket textíliákkal, izolációs (ezüst) takaróval és pléddel. A fűtött mentőbe érve a fóliát szigorúan tilos volt megbontani szárítás céljából. A hőmérsékletet non-kontakt eszközzel/szenzorral monitoroztuk a zsák nyitása nélkül. A szállítást - mivel a koramentő elérhető volt - két külön egységgel végeztük: a babát a fűtött, párásított inkubátorban biztonságosan rögzítve, az anyát pedig a másik esetkocsival vittük a kórházba.'},

],summary:'Összefoglaló (Koraszülött, Szobahőmérséklet): Egy 31. hétre született, 1,5 kg-os koraszülött esetén az eljárásrend nagyon szigorú. Azonnal (még a helyszínre érkezéskor) koraszülött mentőt kértünk, mivel az inkubátor életmentő a számukra. A megszületés után a babát SZIGORÚAN TILOS volt szárazra törölni, hogy elkerüljük az időveszteséget és a további kitettséget. Azonnal a MEDIUM méretű (1-2,5 kg) Neohelp zsákba csomagoltuk. Fontos volt, hogy a vállai a zsák "backpad"-jére kerüljenek, biztosítva a neutrális fejpozíciót és a szabad légutat. A zsákba helyezett babát (mivel az anya állapota engedte) fólián keresztül az anya testére tettük, és mindkettőjüket izolációs fóliával és meleg takaróval védtük a konvekció és radiáció ellen. Amikor az anya ellátása miatt szeparálni kellett a babát, melegítőpárnára helyeztük, folyamatos monitorozás (égés és hőfok) mellett. A rokonok fizikai beavatkozását (zsáknyitás) megakadályoztuk. A babát a koramentő inkubátorába a Neohelp zsákkal együtt helyeztük át, amely akár 24 órán át biztonságosan védi a párolgásos hővesztéstől.'},

function processCalc(){
  let recs = [];
  // Biztosítjuk, hogy a vesszős magyar számformátumot is jól kezelje a JavaScript
  let wStr = String(CA.weight).replace(',', '.');
  let tStr = String(CA.temp).replace(',', '.');
  let wNum = parseFloat(wStr) || 0;
  let tNum = parseFloat(tStr) || 0;
  
  let w_size = wNum > 2.5 ? "LARGE (> 2.5 kg)" : "MEDIUM (1 - 2.5 kg)";
  
  if (CA.type === 'kora') {
    recs.push('Szigorúan TILOS a szárazra törlés!');
    recs.push('Azonnal Neohelp zsákba vagy polietilén fóliába csomagolandó.');
    recs.push('Javasolt Neohelp méret a megadott súlyra: <b>' + w_size + '</b>');
    if(CA.mat === 'stabil'){
      recs.push('A fóliázott babát az anya testére kell helyezni (hőforrásként), majd közösen betakarni izolációs fóliával és takaróval.');
    }
  } else { // erett
    if (tNum < 24) { // hűvös/hideg vagy extrém
      if (tNum < 15) { // extrém
         recs.push('Extrém hideg esetén a szárazra törlés LÉPÉSE MARADJON KI!');
         recs.push('Törlés nélkül azonnal polietilén fóliába vagy neohelp zsákba helyezendő.');
      } else {
         recs.push('Gyors szárazra törlés, majd a nedves textil eltávolítása.');
         recs.push('Polietilén fóliába vagy neohelp zsákba helyezés (Javasolt méret: <b>' + w_size + '</b>).');
      }
      if(CA.mat === 'stabil'){
        recs.push('Fóliában az anya testére tenni, közösen izolációs fóliával és pléddel takarni.');
      }
    } else { // 24 felett
      recs.push('Szárazra törlés előmelegített textíliával, majd a nedves textil eltávolítása.');
      if(CA.mat === 'stabil'){
        recs.push('Bőr-bőr kontaktus az anyán (fólia nélkül is megengedett meleg környezetben).');
        recs.push('Közös betakarás textíliákkal (fejet is fedve).');
      }
    }
  }

  if (CA.mat === 'kell') {
    recs.push('Mivel az anya ellátást igényel (szeparáció): A fóliázott babát külső hőforrás (melegítőpárna, meleg asztal) alá/mellé kell tenni.');
    recs.push('Fokozott obszerváció szükséges az ÉGÉSI SÉRÜLÉSEK és TÚLMELEGEDÉS elkerülése miatt!');
    recs.push('Izolációs takaró felhelyezése a baba fölé is.');
  }

  return recs;
}

window.updateCalc = function() {
  let resDiv = document.getElementById('calc-res');
  if (!resDiv) return;
  let result = processCalc();
  resDiv.innerHTML = '<div class="card" style="background:#064e3b;border-color:#065f46">'+
  '<h3 style="font-size:14px;color:#38bdf8;margin-bottom:8px">Javasolt protokoll lépések:</h3>'+
  '<ul class="bl" style="margin-bottom:0">'+
  result.map(r=>'<li>'+r+'</li>').join('')+
  '</ul></div>'+
  '<div class="al al-i">Célhőmérséklet folyamatos noninvazív méréssel: <b>36,5 - 37,5 °C</b></div>';
};

function renderCalc(){
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Döntéstámogató és Neohelp Kalkulátor</h2>'+
  '<div class="card" style="background:#262626">'+
  
  '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#9ca3af;display:block;margin-bottom:4px">Újszülött állapota:</label>'+
  '<select onchange="CA.type=this.value; updateCalc();"><option value="erett" '+(CA.type==='erett'?'selected':'')+'>Érett újszülött</option><option value="kora" '+(CA.type==='kora'?'selected':'')+'>Koraszülött (koraszülés / kis súly)</option></select></div>'+
  
  '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#9ca3af;display:block;margin-bottom:4px">Környezeti hőmérséklet (°C):</label>'+
  '<input type="text" inputmode="decimal" value="'+CA.temp+'" oninput="CA.temp=this.value; updateCalc();" onkeyup="CA.temp=this.value; updateCalc();" onchange="CA.temp=this.value; updateCalc();"></div>'+
  
  '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#9ca3af;display:block;margin-bottom:4px">Becsült testsúly (kg):</label>'+
  '<input type="text" inputmode="decimal" value="'+CA.weight+'" oninput="CA.weight=this.value; updateCalc();" onkeyup="CA.weight=this.value; updateCalc();" onchange="CA.weight=this.value; updateCalc();"></div>'+
  
  '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#9ca3af;display:block;margin-bottom:4px">Anya állapota:</label>'+
  '<select onchange="CA.mat=this.value; updateCalc();"><option value="stabil" '+(CA.mat==='stabil'?'selected':'')+'>Stabil (ellátja az "inkubátor" funkciót)</option><option value="kell" '+(CA.mat==='kell'?'selected':'')+'>Kritikus / Ellátást igényel (Szeparáció)</option></select></div>'+
  
  '</div>'+
  '<div id="calc-res"></div>';
}

function render(){
  var c=document.getElementById('ct');
  c.innerHTML='';
  if(SCR==='home') c.innerHTML=renderHome();
  else if(SCR==='chapters') c.innerHTML=renderChapters();
  else if(SCR==='chapter') c.innerHTML=renderChapter(CHID);
  else if(SCR==='quiz') c.innerHTML=renderQuiz();
  else if(SCR==='sim') c.innerHTML=renderSim();
  else if(SCR==='calc') {
    c.innerHTML=renderCalc();
    updateCalc(); 
  }

  var tabs=['home','chapters','quiz','sim','calc'];
  var active=SCR==='chapter'?'chapters':SCR;
  document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
  window.scrollTo(0,0);
}

// Global actions
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
</html>
