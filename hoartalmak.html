<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ – Hőártalmak Prehospitális Ellátása</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;}
.app{max-width:760px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);position:relative;}

/* NAV */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.nb{flex:1;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#eab308;}
.ni{font-size:16px;}
.nl{font-size:9px;color:#9ca3af;font-weight:400;}
.nb.act .nl{color:#eab308;font-weight:600;}

/* CONTENT */
.ct{padding:1rem;}

/* CARDS */
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}

/* ALERTS */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
.note{font-size:12px;color:#9ca3af;padding:.5rem .75rem;background:#262626;border-radius:8px;margin-bottom:.5rem;line-height:1.5;border:1px solid #333;}
.sub{font-size:14px;font-weight:600;color:#eab308;margin:.75rem 0 .35rem;}

/* LISTS */
ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.2rem;}
.kr{display:flex;gap:8px;align-items:flex-start;padding:.5rem .75rem;background:#064e3b20;border-radius:8px;margin-bottom:5px;font-size:13px;color:#d1d5db;line-height:1.5;border-left:3px solid #10b981;}

/* TABLES */
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{padding:6px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:6px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;line-height:1.4;}
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}

/* PROGRESS */
.prog{height:4px;background:#333;border-radius:2px;margin-bottom:1rem;}
.progb{height:4px;border-radius:2px;transition:width .3s;}

/* BUTTONS */
.btn{padding:.65rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;transition:all .15s;font-weight:600;}
.btn:hover{background:#374151;}
.btn-g{background:#eab308;color:#111827;border-color:#eab308;}
.btn-g:hover{background:#ca8a04;}
.btn-r{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn-v{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.btn-fw{width:100%;display:block;text-align:center;padding:.75rem;}
.btn-row{display:flex;gap:8px;margin-bottom:1rem;}
.btn-row .btn{flex:1;text-align:center;}

/* QUIZ/SIM OPTIONS */
.opt{width:100%;display:block;padding:.7rem 1rem;margin-bottom:7px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* RESULT BOX */
.res-box{border-radius:12px;padding:1.2rem;text-align:center;margin-top:.75rem;background:#262626;border:1px solid #3f3f3f;}
.res-num{font-size:38px;font-weight:700;color:#eab308;margin-bottom:.5rem;}

/* INPUTS */
input[type=range], input[type=number]{width:100%;accent-color:#eab308;background:transparent;border:1px solid #4b5563;border-radius:8px;padding:8px;color:#e5e7eb;font-family:inherit;background:#2a2a2a;}
input[type=range]{padding:0;border:none;height:24px;}

/* TAGS & BADGES */
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:12px;font-weight:600;}
.tag-g{background:#064e3b;color:#ecfdf5;}
.tag-y{background:#78350f;color:#fef3c7;}
.tag-r{background:#7f1d1d;color:#fecaca;}

/* GLOSSARY TERM */
.gl{color:#60a5fa;text-decoration:underline;text-decoration-style:dotted;cursor:pointer;font-weight:600;}

/* HOME CARDS */
.home-mod{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;color:#e5e7eb;}
.home-mod:hover{background:#333;border-color:#4b5563;transform:translateY(-2px);}
.home-mod-icon{font-size:28px;margin-bottom:8px;}
.home-mod-title{font-size:15px;font-weight:700;color:#f3f4f6;margin-bottom:3px;}
.home-mod-desc{font-size:12px;color:#9ca3af;line-height:1.4;}

/* CHAPTER ROW */
.ch-row{display:flex;align-items:center;gap:12px;background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.ch-row:hover{background:#333;}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.show{display:flex;}
.modal-content{background:#1e1e1e;border:1px solid #3f3f3f;border-radius:12px;width:100%;max-width:400px;padding:1.5rem;position:relative;box-shadow:0 10px 25px rgba(0,0,0,0.5);}
.modal-close{position:absolute;top:10px;right:10px;background:none;border:none;color:#9ca3af;font-size:24px;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{color:#f3f4f6;}
.modal-title{font-size:18px;font-weight:700;color:#eab308;margin-bottom:.75rem;}
.modal-text{font-size:14px;color:#d1d5db;line-height:1.6;}

/* ALGORITHM DIAGRAM STYLES */
.algo-box{border:1px solid #3f3f3f;border-radius:8px;padding:10px;margin-bottom:8px;text-align:center;font-size:12px;font-weight:600;}
.ab-y{background:#78350f;color:#fde68a;border-color:#b45309;}
.ab-b{background:#1e3a8a;color:#bfdbfe;border-color:#2563eb;}
.ab-g{background:#064e3b;color:#bbf7d0;border-color:#10b981;}
.ab-db{background:#111827;color:#f3f4f6;border-color:#4b5563;}

@media(max-width:480px){.tbl-wrap table{min-width:340px;}}
</style>
</head>

var QUIZ=[
{q:'Melyik hőmérsékletmérési mód KÖTELEZŐ és legmegbízhatóbb hőártalom + megváltozott tudatállapot esetén prehospitálisan?',opts:['Hónaljban (axilláris)','Szájban (orális)','Végbélben (rectális)','Érintésmentes (non-contact) infra hőmérővel'],ok:2,exp:'Hőártalmak esetén a perifériás eljárások nem megbízhatóak. Megváltozott tudatállapotnál kötelező a rectalis mérés a pontos maghőmérséklet meghatározásához.'},
{q:'Mi a különbség a hyperthermia és a láz között?',opts:['A hyperthermia esetén magasabb a hőmérséklet, mint láz esetén','Láz esetén a hypothalamus set-pointja tolódik el, hyperthermiánál nincs set-point változás','A hyperthermiát vírusok okozzák, a lázat baktériumok','Nincs különbség, a két szó szinonima'],ok:1,exp:'Láz esetén a hőszabályozó központ "célértéke" (set-point) megváltozik. Hyperthermiánál a szervezet túlmelegszik ezen beállítás változása nélkül. Ezért a lázcsillapítók hyperthermiában hatástalanok.'},
{q:'Hőguta (EHS/CHS) gyanúja esetén szabad-e lázcsillapítót (pl. NSAID) adni?',opts:['Igen, azonnal intravénásan','Igen, de csak szájon át','Nem, mert hatástalanok és súlyosbíthatják a vese/májkárosodást (DIC-et)','Igen, a hűtéssel párhuzamosan'],ok:2,exp:'A lázcsillapítók hőguta esetén hatástalanok (nincs set-point eltolódás), és súlyos szövődményeket (akut vese/májkárosodás, DIC) provokálhatnak.'},
{q:'Fizikai terhelés okozta hőgutánál (EHS) mi az elsődleges és legfontosabb beavatkozás?',opts:['Azonnali szállítás a legközelebbi kórházba (Load and Go)','Jeges vízbe merítés (teljes test hűtése) még a helyszínen, a hőmérséklet 39°C alá csökkentése','Széles spektrumú antibiotikum adása','Csak intravénás folyadékpótlás'],ok:1,exp:'EHS esetén az azonnali, agresszív helyszíni hűtés (lehetőleg jeges vízbe merítéssel) prioritást élvez. A szállítást csak stabil <39°C hőmérséklet elérésekor javasolt megkezdeni.'},
{q:'Melyik KÉT életveszélyes állapotot kell mindenképpen kizárni vérvizsgálattal (kompetencia esetén) megváltozott tudatállapotú, összeesett sportolónál?',opts:['Hyperkalaemia és Hypocalcaemia','Hypoglykaemia és Hyponatraemia','Hyperglykaemia és Hypernatraemia','Anaemia és Leukopenia'],ok:1,exp:'A fizikai terhelés okozta hőgutát gyakran kísérheti vagy utánozhatja a terhelés indukálta hyponatraemia (alacsony nátrium) és hypoglykaemia (alacsony vércukor).'},
{q:'Egy futóverseny CÉLBA ÉRKEZÉSE UTÁN 5 perccel a sportoló összeesik. Eszméleténél van, szédül, sápadt. A rectalis hőmérséklete 39,2 °C. Mi a legvalószínűbb diagnózis?',opts:['Fizikai terhelés okozta hőguta','Hőségcollapsus / Terhelésre kialakuló ájulás','Klasszikus hőguta','Rhabdomyolysis'],ok:1,exp:'A terhelés UTÁNI összeesés, megtartott tudat és <40,5°C hőmérséklet leginkább a hőségcollapsusra (poszturális hypotensio) utal. A hőguta általában terhelés közben történik és >40,5°C + tudatzavar kíséri.'},
{q:'Hőgörcs esetén javasolt-e intravénás krisztalloid folyadék adása rutinszerűen?',opts:['Igen, minden esetben','Igen, de csak glükózzal együtt','Nem, az orális (szájon át történő) folyadékpótlás ugyanannyira hatásos, IV csak akkor kell, ha inni nem tud','Nem, folyadékpótlás egyáltalán nem szükséges'],ok:2,exp:'Az eljárásrend szerint részesítsük előnyben az orális folyadékpótlást, vénás adás csak itatás képtelensége esetén indikált.'},
{q:'Meddig kell hűteni a fizikai terhelés okozta hőgutás (EHS) beteget a helyszínen?',opts:['Amíg a hőmérséklete 36,0 °C-ra nem csökken','Amíg tartósan (15 percig) 39,0 °C alá nem csökken','Maximum 10 percig','Csak addig, amíg a tudata feltisztul'],ok:1,exp:'A hűtést addig kell folytatni, míg a maghőmérséklete tartósan (legalább 15 percen át) 39,0 °C alá csökken, majd ott stabilizálódik. Ezután a hűtést fel lehet függeszteni a túlhűtés elkerülésére.'},
{q:'Idős, zárt és forró lakásban talált beteg (Klasszikus Hőguta - CHS) esetében miért nem ajánlott a teljes test jeges vízbe merítése prehospitálisan?',opts:['Mert náluk gyorsabban kialakul a hypothermia','Az alapbetegségek, a monitorozás nehezítettsége és az IV folyadékpótlás akadályozása miatt','Mert a klasszikus hőguta nem igényel hűtést','Mert a hideg víz szívrohamot okoz minden idős embernél'],ok:1,exp:'Az eljárásrend leírja, hogy az EHS-sel ellentétben CHS-nél az idősek alapbetegségei és a monitorozási igény miatt a teljes kádfürdő kevésbé ajánlott, inkább párologtató hűtést és borogatást alkalmazzunk.'},
{q:'Milyen ütemű intravénás krisztalloid pótlást javasol az eljárásrend hőkimerülés/collapsus esetén (felnőtteknél), ha az indikált?',opts:['1-2 liter 500 ml/óra ütemben','20 ml/ttkg bólusban 10 perc alatt','Maximum 250 ml/óra','Csak 5%-os dextrózt szabad adni'],ok:0,exp:'Általában 1-2 liter krisztalloid 500 ml/óra ütemben elegendő (felnőtteknél hőkimerülés/collapsus esetén, ha az iv. út indikált).'}
];

{sit:'Lélegzik, van pulzusa. Megváltozott tudatállapota van (zavart). Mi a következő KÖTELEZŐ diagnosztikus lépés az eljárásrend szerint?',opts:[{tx:'A rectalis maghőmérséklet azonnali mérése.',ok:true,fb:'Helyes! Megváltozott tudatú, összeesett sportolónál a rectalis hőmérés elengedhetetlen a hőguta kizárására.'},{tx:'Axilláris (hónalj) hőmérséklet mérése.',ok:false,fb:'Hibás! A perifériás mérés hőártalomnál megbízhatatlan.'},{tx:'Vércukormérés.',ok:false,fb:'Hibás! Bár kötelező lesz, de a hőmérséklet a triage kulcsa.'}]},
{sit:'A rectalis hőmérséklete 39,2 °C. Tehát < 40,5 °C. Az anamnézis szerint a TERHELÉS UTÁN esett össze. Mire gondolsz elsősorban (diagnózis)?',opts:[{tx:'Terhelés indukálta hőguta (EHS).',ok:false,fb:'Hibás! Ahhoz >40,5 °C és általában terhelés alatti összeesés kell.'},{tx:'Hőségcollapsus / Terhelésre kialakuló posturalis hypotensio.',ok:true,fb:'Helyes! Terhelés utáni összeesés, normál/enyhén emelkedett hővel ( <40,5 °C) típusosan ez.'},{tx:'Anafilaxia.',ok:false,fb:'Hibás! Nincs allergiás jel.'}]},
{sit:'Mi a helyes testhelyzet a beteg számára a hőségcollapsus kezelésére?',opts:[{tx:'Felültetem, hogy jobban kapjon levegőt.',ok:false,fb:'Hibás! A collapsus oka a vénás visszaáramlás csökkenése, az ülés rontja.'},{tx:'Hűvös, szellős helyen lefektetem, esetleg a lábait felemelem.',ok:true,fb:'Helyes! Ez segíti a vénás visszaáramlást és javítja az agyi vérellátást.'},{tx:'Hason fektetem.',ok:false,fb:'Hibás! Nem segíti a keringést és akadályozza a légzésvizsgálatot.'}]},
{sit:'Milyen hűtési metódust alkalmazol ennél a 39,2 °C-os, collapsusos betegnél az eljárásrend alapján?',opts:[{tx:'Azonnali teljes test jeges vízbe merítése (ice bath).',ok:false,fb:'Hibás! Mivel < 40,5 °C a maghő, a drasztikus jégfürdő nem indikált.'},{tx:'Hűtőborogatás a törzsön jeges textíliákkal, ventilátor, permetezés.',ok:true,fb:'Helyes! Enyhébb hyperthermia esetén ez a preferált kíméletes hűtés.'},{tx:'Nem hűtöm, mert 40 fok alatt van.',ok:false,fb:'Hibás! A 39,2 is magas, hűteni kell.'}]},
{sit:'A beteg még 15 perc múlva is zavart, vérnyomása 80/50 Hgmm (hypotensio fennáll). B+ kompetenciával milyen beavatkozást végzel a folyadékpótlásra?',opts:[{tx:'Tovább erőltetem az orális itatást.',ok:false,fb:'Hibás! Zavart beteg nem itatható, és a hypotensio tartós.'},{tx:'Intravénás (IV) utat biztosítok és krisztalloid infúziót indítok.',ok:true,fb:'Helyes! Tartós hypotensio és zavartság a vénás folyadékpótlás indikációja.'},{tx:'Csak várom a magasabb szintű segítséget.',ok:false,fb:'Hibás! B+ kompetenciával a vénabiztosítás a te feladatod.'}]},
{sit:'Az IV bekötésekor vért is tudsz venni vércukor és nátrium méréshez. Miért fontos kizárni a hyponatraemiát egy maratoni futónál?',opts:[{tx:'Mert a sok tiszta víz ivása és az izzadás miatt lezuhanhatott a nátrium szintje (vízmérgezés), ami zavartságot okoz.',ok:true,fb:'Helyes! A terhelés indukálta hyponatraemia súlyos, tudatzavart okozó kórkép.'},{tx:'Mert a nátrium okozza a magas testhőmérsékletet.',ok:false,fb:'Hibás! Nem okoz lázat.'},{tx:'Nem fontos, a nátrium nem változik terhelés alatt.',ok:false,fb:'Hibás! Nagyon is változik.'}]},
{sit:'A vércukor 5,2 mmol/l (normál), Na 138 mmol/l (normál). A beteg 30 perce kapja az infúziót, de még mindig szédül, vérnyomása 90/60 Hgmm. Mi a teendő az eljárásrend alapján?',opts:[{tx:'Kórházba kell szállítani, mert intravénás folyadékra szorult és 30 percen belül nem szűntek meg a panaszai.',ok:true,fb:'Helyes! Ezek egyértelmű kórházba szállítási kritériumok.'},{tx:'Helyszínen hagyható, mert a Na és a vércukor normális.',ok:false,fb:'Hibás! A panaszok nem múltak el és IV-t kapott.'},{tx:'Adok neki még 2 liter vizet szájon át és hazaküldöm.',ok:false,fb:'Hibás! Tilos.'}]},
{sit:'Kórházba szállítás során hogyan monitorozod a beteget?',opts:[{tx:'Csak ránézéssel, hiszen már jobban van.',ok:false,fb:'Hibás! A beteg instabil maradt.'},{tx:'Folyamatos vitális paraméter monitorozás (EKG, vérnyomás, SpO2) és a maghőmérséklet követése.',ok:true,fb:'Helyes! A kritikus/bizonytalan beteget folyamatosan monitorozni kell.'},{tx:'Csak a vércukrot mérem percenként.',ok:false,fb:'Hibás! A vércukor egyszeri mérése jó volt, a teljes monitorozás kell.'}]},
{sit:'A szállítás során a beteg hirtelen ismét eszméletlenné válik. Mit teszel?',opts:[{tx:'Azonnal CPR-t kezdek a monitor jelzése nélkül is.',ok:false,fb:'Hibás! Előbb meg kell vizsgálni.'},{tx:'Az ABCDE vizsgálatot az elejéről (A ponttól) újra megismétlem, ellenőrzöm az életjelenségeket.',ok:true,fb:'Helyes! Állapotváltozás esetén az ABCDE vizsgálat elölről ismétlendő.'},{tx:'Gyorsítom a mentőt és nem csinálok semmit a hátuljában.',ok:false,fb:'Hibás! A betegellátást folytatni kell.'}]}
],summary:'Összefoglaló (Hőségcollapsus - B+ kompetencia): A terhelés után összeesett futónál elsőként a CPR szükségességét zártuk ki. Mivel a beteg eszméletlen/zavart volt, azonnal RECTALIS hőt mértünk. Az érték (39,2 °C, <40,5) a terhelés utáni anamnézissel hőségcollapsusra utalt. A beteget hűvösbe vittük, lefektettük (lábak fel), és kíméletes (borogatásos) hűtést alkalmaztunk. A tartós hypotensio és zavartság miatt B+ szinten IV utat biztosítottunk és krisztalloid infúziót adtunk. A vércukor és nátrium méréssel kizártuk a hyponatraemiát és hypoglykaemiát. Mivel a panaszok 30 percen túl is fennálltak és IV pótlást igényelt, a beteget (szállítási kritériumoknak megfelelően) kórházba szállítottuk folyamatos vitális és hőmérséklet monitorozás mellett. Az állapotváltozás (újra eszméletvesztés) az ABCDE azonnali újraértékelését vonta maga után.'},

{id:3,title:'3. Szimuláció: Terheléses Hőguta (EHS) egy akadályversenyen (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 22 éves katona/sportoló a nyári kiképzés (akadálypálya) KÖZBEN hirtelen összeesik, görcsöl, majd eszméletlen marad. B+ kompetencia.',steps:[
{sit:'Kiérkeztek. A beteg eszméletlen a tűző napon. A légzésvizsgálat során kiderül, hogy van megfelelő légzése és pulzusa. Mi az azonnali diagnostikai lépés a hőártalom protokollja szerint?',opts:[{tx:'Vérnyomásmérés.',ok:false,fb:'Hibás! Fontos, de van sürgősebb.'},{tx:'Megváltozott tudatállapot miatt haladéktalan RECTALIS maghőmérséklet mérés (vetkőztetéssel egybekötve).',ok:true,fb:'Helyes! Az EHS algoritmus kritikus első lépése a maghőmérséklet meghatározása.'},{tx:'Pupillák vizsgálata zseblámpával.',ok:false,fb:'Hibás! A D vizsgálat része, de a hősokk kizárása sürgősebb.'}]},
{sit:'A rectalis hőmérséklet 41,2 °C. A beteg tudatzavaros, az összeesés terhelés KÖZBEN történt. Mi a diagnózis?',opts:[{tx:'Fizikai terhelés okozta hőguta (EHS).',ok:true,fb:'Helyes! A terhelés alatti összeesés, >40,5 °C és a tudatzavar klasszikus EHS triász.'},{tx:'Hőkimerülés.',ok:false,fb:'Hibás! Hőkimerülésnél a hőmérséklet < 40,0 °C és nincs tartós tudatzavar.'},{tx:'Melegkiütés.',ok:false,fb:'Hibás! Ez egy bőrjelenség.'}]},
{sit:'Mi a legfontosabb, életmentő beavatkozás EHS (41,2 °C) esetén, amely megelőzi a szállítást is?',opts:[{tx:'Azonnali berakodás a mentőbe (Load and Go).',ok:false,fb:'Hibás! A hűtés megelőzi a szállítást.'},{tx:'A testhőmérséklet csökkentése (hűtés) elsődleges prioritás, lehetőleg azonnal az egész test hűtőfürdőbe (jeges vízbe) merítésével.',ok:true,fb:'Helyes! A túlélés kulcsa a 30 percen belüli gyors lehűtés (lehetőleg ice bath).'},{tx:'Lázcsillapító injekció beadása.',ok:false,fb:'Hibás! A lázcsillapítók hatástalanok és veszélyesek EHS-ben.'}]},
{sit:'Szerencsére az elsősegély sátornál van jeges fürdő (5-15 °C). Hogyan helyezed bele a beteget és mire figyelsz?',opts:[{tx:'Hálós hordággyal vagy manuálisan beemelem, fejét és nyakát a víz felett tartva (pl. törölközővel), a vizet folyamatosan keverve.',ok:true,fb:'Helyes! Ez a protokoll szerinti helyes merítési és hűtési technika.'},{tx:'Arcával lefelé belefektetem.',ok:false,fb:'Hibás! Megfulladna.'},{tx:'Csak a lábait teszem bele.',ok:false,fb:'Hibás! A teljes test (törzs) hűtése kell.'}]},
{sit:'A hűtés közben a beteg nagyon kezd didergősen remegni (shivering). Miért probléma ez, és milyen gyógyszeres beavatkozást említ az eljárásrend (ami emelt szintű, de megfontolandó)?',opts:[{tx:'A remegés hőt termel. Kisdózisú ketamin vagy rövid hatású benzodiazepin (midazolam) adása megfontolható.',ok:true,fb:'Helyes! A didergés rontja a hűtés hatékonyságát.'},{tx:'A remegés jó, mert hűti a testet. Nem csinálok semmit.',ok:false,fb:'Hibás! A remegés izommunka, hőt termel.'},{tx:'Azonnal kiveszem a vízből.',ok:false,fb:'Hibás! A hűtést folytatni kell a célhőmérsékletig.'}]},
{sit:'A beteg a jégfürdőben van. B+ kompetenciával milyen paramétert KÖTELEZŐ megmérned a hűtés megszakítása nélkül a metabolikus eltérések kizárására?',opts:[{tx:'Vércukorszint (akut hypoglykaemia kizárása céljából).',ok:true,fb:'Helyes! EHS-nél gyakori a hypoglykaemia, amit azonnal kezelni kell.'},{tx:'Koleszterinszint.',ok:false,fb:'Hibás! Nem akut életmentő paraméter.'},{tx:'Vérkép (hemoglobin).',ok:false,fb:'Hibás! Prehospitálisan nehezen mérhető és nem az elsődleges eltérés EHS-ben.'}]},
{sit:'A vércukor 2,8 mmol/l (súlyos hypoglykaemia). A beteg még eszméletlen. Mit teszel B+ kompetenciával?',opts:[{tx:'Adok neki a szájába egy kis cukrot.',ok:false,fb:'Hibás! Eszméletlen betegnél aspiráció (félrenyelés) veszélye áll fenn.'},{tx:'Intravénás úton 60-100 ml 20%-os glükózt adok (bólusban), mely 15 percenként ismételhető.',ok:true,fb:'Helyes! Eszméletlen betegnél a vénás glükóz a biztonságos és protokolláris.'},{tx:'Inzulint adok.',ok:false,fb:'Hibás! Az tovább csökkentené a cukrot.'}]},
{sit:'Folyamatosan méred a rectalis hőt a fürdőben. Mikor (milyen hőmérsékletnél) KELL felfüggeszteni a hűtést az eljárásrend szerint?',opts:[{tx:'Amikor a hőmérséklet 36,0 °C-ra csökken.',ok:false,fb:'Hibás! Ez túlhűtéshez (iatrogén hypothermia) vezetne.'},{tx:'Amikor a hőmérséklet stabilan (15 percen át) 39,0 °C alá csökken.',ok:true,fb:'Helyes! A 39,0 °C a célhőmérséklet, ez alatt a hűtést meg kell állítani.'},{tx:'Maximum 5 perc után, függetlenül a hőtől.',ok:false,fb:'Hibás! A célhőmérséklet a mérvadó, nem az idő.'}]},
{sit:'A maghőmérséklet elérte a 38,8 °C-ot, a hűtést felfüggeszted, a beteget kiveszed a fürdőből. A tudata kezd feltisztulni. Indulhat a transzport a kórházba?',opts:[{tx:'Igen, mivel a hűtés sikeres volt és a hőmérséklet stabilan 39,0 °C alatt van, a kórházba szállítás megkezdhető.',ok:true,fb:'Helyes! A transzport feltétele a megfelelő hűtés és a stabil (<39,0) maghőmérséklet.'},{tx:'Nem, otthon hagyom, mert jobban van.',ok:false,fb:'Hibás! Az EHS életveszélyes, szervkárosodással járhat, kötelező a kórház.'},{tx:'Nem, várni kell még 3 órát a helyszínen.',ok:false,fb:'Hibás! A stabilizálás után a kórházi definitív ellátás (vese/máj funkciók ellenőrzése) a cél.'}]},
{sit:'A szállítás alatt mi a legfontosabb specifikus feladatod az általános monitorozáson túl?',opts:[{tx:'Csak a sebességre figyelek.',ok:false,fb:'Hibás! A betegellátás folyamatos.'},{tx:'A maghőmérséklet (rectalis) folyamatos monitorozása, mert ha ismét 39 °C fölé emelkedik, a hűtést újra kell kezdeni (pl. benzinkúti jéggel).',ok:true,fb:'Helyes! A visszamelegedés (rebound hyperthermia) valós veszély.'},{tx:'Lázcsillapító tabletták beadása.',ok:false,fb:'Hibás! Továbbra is hatástalanok és veszélyesek.'}]}
],summary:'Összefoglaló (Terheléses Hőguta - B+ kompetencia): A terhelés közben összeesett, eszméletlen katonánál az első vizsgálatok után (ABCDE) azonnal RECTALIS hőt mértünk (vetkőztetéssel). Az érték (41,2 °C) EHS-t igazolt. Az eljárásrend alapján az AZONNALI jeges vízbe merítés volt a prioritás, még a szállítás előtt. A vízben folyamatosan mértük a rectalis hőt és biztosítottuk a fejet. B+ kompetenciával (IV) kizártuk a hypoglykaemiát, de 2,8 mmol/l értéket kaptunk, így IV 20%-os glükózt adtunk. A didergés csillapítására (emelt szinten) midazolam lett volna adható. A hűtést a célhőmérséklet (39,0 °C) elérésekor azonnal felfüggesztettük a túlhűtés elkerülése végett. A transzportot csak a stabil <39 °C elérése után kezdtük meg, a szállítás alatt pedig folyamatosan monitoroztuk a maghőmérsékletet a visszamelegedés (rebound) megelőzésére. Lázcsillapítót egyáltalán nem adtunk.'},

{id:4,title:'4. Szimuláció: Klasszikus Hőguta zárt lakásban (B kompetencia)',diff:'B kompetencia',desc:'Egy 78 éves nénit a szomszédok találnak meg egy 40 fokosra felmelegedett, zárt panellakásban. A beteg zavart, forró a bőre, alig reagál. B kompetencia (szakképzett mentőápoló, nincs IV/gyógyszer).',steps:[
{sit:'Belépsz a forró lakásba. Mi a legelső dolgod a betegellátás szempontjából, mielőtt a beteget vizsgálni kezded?',opts:[{tx:'Azonnal megvizsgálom a beteget.',ok:false,fb:'Hibás! A helyszín biztonsága és a hőség csökkentése fontos.'},{tx:'Győződöm a biztonságról, és megpróbálom hűteni/szellőztetni a környezetet (ablaknyitás, ventilátor), vagy a beteget hűvösebb helyre (pl. folyosó) viszem.',ok:true,fb:'Helyes! A hőterhelés megszakítása (hűvösbe vitel) az első lépés.'},{tx:'Keresem a néni gyógyszereit.',ok:false,fb:'Hibás! Az ellátás prioritása a hűtés.'}]},
{sit:'A beteget kihoztad a hűvösebb folyosóra. Szisztematikus ABCDE során az A és B rendben. C: pulzus 130/perc, nagyon száraz, forró bőr. D: zavart, GCS=10. Milyen hőmérőt kell használnod?',opts:[{tx:'Csak hónalji hőmérőt.',ok:false,fb:'Hibás! Nem megbízható.'},{tx:'Mindenképpen rectalis (végbél) hőmérőt, mert a tudatállapot megváltozott és a bőr forró.',ok:true,fb:'Helyes! Klasszikus hőgutánál (CHS) is kötelező a pontos maghőmérés.'},{tx:'Infra hőmérőt a homlokon.',ok:false,fb:'Hibás! Téves értékeket adhat.'}]},
{sit:'A rectalis hő 41,5 °C. Fizikai terhelés nem történt (napok óta a lakásban van). Mi ez a kórkép?',opts:[{tx:'Terheléses hőguta (EHS).',ok:false,fb:'Hibás! Nincs terhelés a háttérben.'},{tx:'Klasszikus hőguta (NEM fizikai terhelés okozta).',ok:true,fb:'Helyes! Passzív hőbehatás okozta magas maghő és tudatzavar.'},{tx:'Egyszerű láz (infekció).',ok:false,fb:'Hibás! A környezeti tényezők egyértelműen hőgutára utalnak.'}]},
{sit:'Klasszikus hőgutánál (CHS) az eljárásrend szerint mi a legjavasoltabb hűtési módszer prehospitálisan?',opts:[{tx:'Azonnali teljes test jeges vízbe merítése (mint az EHS-nél).',ok:false,fb:'Hibás! Időseknél az alapbetegségek miatt ez kevésbé ajánlott.'},{tx:'Párologtató hűtés (nedves test + ventilátor), jég a nagyerek fölé, hideg zuhany/borogatás a törzsön.',ok:true,fb:'Helyes! Ez a kíméletesebb, de mégis hatékony hűtési forma javasolt CHS-ben.'},{tx:'Csak hűvös levegő, semmi víz.',ok:false,fb:'Hibás! Az önmagában nagyon lassú.'}]},
{sit:'Mivel a beteg GCS=10 (zavart) és a vérnyomása alacsony (90/50), ráadásul te csak B kompetenciával (IV nélkül) rendelkezel, mi a teendő a helyszíni mentésirányítással?',opts:[{tx:'Egyedül megoldom a helyszínen.',ok:false,fb:'Hibás! A beteg kritikus állapotban van.'},{tx:'Azonnal magasabb kompetenciájú mentőegységet (ALS / mentőtiszt / orvos) kérek, mert a klasszikus hőguta életveszélyes és a beteg instabil.',ok:true,fb:'Helyes! A magas mortalitás és az IV/gyógyszer igény miatt ALS kell.'},{tx:'Azonnal elindulok a legközelebbi ügyeletre.',ok:false,fb:'Hibás! Kórházi (intenzív) szintű ellátás és útközbeni ALS kell.'}]},
{sit:'A szomszéd odaadja a néni lázcsillapítóját (Paracetamol), hogy "biztos jó lesz a lázára". Mit csinálsz?',opts:[{tx:'Összetöröm és beadom neki vízzel.',ok:false,fb:'Hibás! Veszélyes és a beteg zavart is (aspiráció).'},{tx:'Szigorúan elutasítom. A lázcsillapítók hyperthermiában hatástalanok, sőt, ronthatják a vese- és májfunkciót (szövődmények).',ok:true,fb:'Helyes! Ez alapszabály a hőártalmaknál.'},{tx:'Csak fél adagot adok.',ok:false,fb:'Hibás! Egyáltalán nem szabad adni.'}]},
{sit:'A néni hirtelen egész testre kiterjedő görcsrohamot kap. Mit teszel elsőként B kompetenciával?',opts:[{tx:'Leeresztem a karjait és erősen lefogom.',ok:false,fb:'Hibás! Lefogni tilos, sérülést okoz.'},{tx:'Óvom a sérülésektől (fej alá puha tárgy), biztosítom a légutakat (oldalfekvés a roham után), és sürgetem az ALS érkezését a rohamoldás miatt.',ok:true,fb:'Helyes! B szinten a fizikai védelem és a légútbiztosítás az elsődleges.'},{tx:'Intravénás Midazolamot adok.',ok:false,fb:'Hibás! B kompetenciával nem adhatsz IV gyógyszert.'}]},
{sit:'A hűtés hatására a maghőmérséklet elkezd csökkenni. Mikor kell a hűtést abbahagyni?',opts:[{tx:'Ha eléri a 38-39 °C-os rectalis hőmérsékletet, a iatrogén hypothermia (túlhűtés) elkerülése végett.',ok:true,fb:'Helyes! Az EHS-hez hasonlóan a 38-39 °C közötti érték a cél.'},{tx:'Már 40 °C-nál abbahagyom.',ok:false,fb:'Hibás! Az még veszélyesen magas.'},{tx:'Csak ha teljesen normális (36,5 °C) lesz.',ok:false,fb:'Hibás! A szervezet utóhűlése miatt ebből 34 fokos hypothermia lenne.'}]},
{sit:'A segélykocsi megérkezik, bekötik az IV folyadékot. A szállítás a kórházba elkezdődik. Mit ír az eljárásrend a CHS (klasszikus hőguta) betegek szállításáról?',opts:[{tx:'A szállítás alatt a hűtést be kell fejezni.',ok:false,fb:'Hibás! Ha kell, folytatni kell.'},{tx:'A szállítás alatt a szokásos paraméterek mellett a maghőmérsékletet is FOLYAMATOSAN monitorozni kell, és szükség esetén (ha visszamelegszik) a hűtést transzport közben is folytatni kell (pl. benzinkúti jéggel).',ok:true,fb:'Helyes! A folyamatos monitorozás és szükség esetén a transzport alatti hűtés kritikus.'},{tx:'Csak akkor lehet szállítani, ha felébredt.',ok:false,fb:'Hibás! A szállítás nem halogatható, a definitív kórházi ellátás elengedhetetlen.'}]},

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>'; /* We allow HTML in items for GL tags */
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+i+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div style="display:flex;gap:10px;margin-bottom:12px"><div style="flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#eab308;color:#111827;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800">'+s.n+'</div><div style="flex:1;background:#262626;border-radius:8px;padding:.65rem .85rem"><div style="font-size:14px;font-weight:700;color:#f3f4f6;margin-bottom:.3rem">'+s.t+'</div><div style="font-size:13px;color:#9ca3af;line-height:1.6;white-space:pre-line">'+s.x+'</div></div></div>').join('');
  return '';
}

function showGlossary(word) {
  var term = word.toLowerCase();
  var text = GLOSS[term];
  if (!text) return;
  document.getElementById('gTitle').innerHTML = word.charAt(0).toUpperCase() + word.slice(1);
  document.getElementById('gText').innerHTML = text;
  document.getElementById('gModal').classList.add('show');
}
function closeGlossary(e) {
  document.getElementById('gModal').classList.remove('show');
}

return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:14px;font-weight:800;color:#eab308">'+sim.title+'</div><span style="font-size:13px;font-weight:700;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#b91c1c"></div></div>'+
(SI.step===0?'<div class="al al-w" style="font-size:12px">'+sim.desc+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626;border-left:4px solid #eab308"><p style="font-size:15px;font-weight:700;color:#f3f4f6;line-height:1.5;margin:0">'+step.sit+'</p></div>'+

(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'" style="font-weight:600">'+step.opts[SI.chosen].fb+'</div><button class="btn btn-g btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Eredmény megtekintése')+'</button>':'');
}

function upTemp() {
  let diff = Math.max(0, CA.temp_curr - CA.temp_target);
  let min_time = Math.ceil(diff / 0.2); 
  
  var tc_v = document.getElementById('tc_v');
  if(tc_v) tc_v.textContent = CA.temp_curr.toFixed(1) + ' °C';
  
  var tt_v = document.getElementById('tt_v');
  if(tt_v) tt_v.textContent = CA.temp_target.toFixed(1) + ' °C';
  
  var temp_res = document.getElementById('temp_res');
  if(temp_res) temp_res.innerHTML = (diff <= 0 ? '0' : min_time) + ' <span style="font-size:20px">perc</span>';
}

  '<h3 style="font-size:16px;font-weight:800;color:#fca5a5;margin-bottom:.5rem">Glükózpótlás Hypoglykaemia esetén</h3>'+
  '<div class="note">Fizikai terhelés okozta hőguta (EHS) esetén gyakori a seGlu < 4,0 mmol/l. Hűtés megszakítása nélkül adandó!</div>'+
  '<div class="res-box" style="background:#450a0a;border-color:#7f1d1d;margin-top:.5rem">'+
  '<div style="font-size:14px;color:#fecaca;margin-bottom:4px;font-weight:600">Javasolt IV dózis (Eszméletlen/Zavart):</div>'+
  '<div style="font-size:24px;font-weight:800;color:#fca5a5">60 - 100 ml 20%-os glükóz</div>'+
  '<div style="font-size:14px;font-weight:600;color:#fecaca;margin-top:4px">Bólusban, szükség esetén 15 percenként ismételhető.</div>'+
  '</div></div>';
}

if (CA.tab==='temp'){
  let diff = Math.max(0, CA.temp_curr - CA.temp_target);
  let min_time = Math.ceil(diff / 0.2); 
  
  return '<h2 style="font-size:20px;font-weight:800;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
  '<div style="display:flex;gap:8px;margin-bottom:1rem">'+tabBtn('fluid','IV Folyadék / Glükóz')+tabBtn('temp','Hűtési Idő (EHS)')+'</div>'+
  '<div class="card">'+
  '<h3 style="font-size:16px;font-weight:800;color:#eab308;margin-bottom:.5rem">Hűtési Idő Becslő (Jeges vízfürdő)</h3>'+
  '<div class="note">Az eljárásrend alapján jeges vízben történő hűtés során átlagosan kb. 0,2 °C / perc hőmérsékletcsökkenés feltételezhető. A célhőmérséklet 39,0 °C, ezen a ponton a hűtést be kell fejezni.</div>'+
  
  '<div style="margin-bottom:1rem">'+
  '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><div style="font-size:13px;font-weight:700;color:#9ca3af">Jelenlegi Maghőmérséklet (Rectalis)</div><span id="tc_v" style="font-size:15px;font-weight:800;color:#f3f4f6">'+CA.temp_curr.toFixed(1)+' °C</span></div>'+
  '<input type="range" min="39.0" max="43.0" step="0.1" value="'+CA.temp_curr+'" oninput="setTempCurr(this.value)" onchange="setTempCurr(this.value)">'+
  '</div>'+

  '<div style="margin-bottom:1rem">'+
  '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><div style="font-size:13px;font-weight:700;color:#9ca3af">Cél Hőmérséklet (Hűtés leállítása)</div><span id="tt_v" style="font-size:15px;font-weight:800;color:#10b981">'+CA.temp_target.toFixed(1)+' °C</span></div>'+
  '<input type="range" min="36.0" max="40.0" step="0.1" value="'+CA.temp_target+'" oninput="setTempTarget(this.value)" onchange="setTempTarget(this.value)">'+
  '</div>'+

  '<div class="res-box" style="background:#451a03;border-color:#78350f;margin-top:.5rem">'+
  '<div style="font-size:14px;color:#fde68a;margin-bottom:6px;font-weight:600">Becsült szükséges hűtési idő (jeges kádban):</div>'+
  '<div id="temp_res" style="font-size:38px;font-weight:800;color:#eab308">'+(diff<=0 ? '0' : min_time)+' <span style="font-size:20px">perc</span></div>'+
  '<div style="font-size:12px;color:#fde68a;margin-top:6px">A megadott érték csak iránymutató! A maghőmérsékletet a hűtés alatt <b>folyamatosan, objektíven (rectalisan)</b> mérni kell!</div>'+
  '</div></div>';
}
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='algo')c.innerHTML=renderAlgo();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();

// The new order: Főoldal, Eljárásrend, Algoritmus, Kvíz, Szituációk, Kalkulátor
var tabs=['home','chapters','algo','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){if(b)b.classList.toggle('act',tabs[i]===active);});

if(!CA.noScroll) window.scrollTo(0,0);
CA.noScroll=false;
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});CA.noScroll=true;render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;CA.noScroll=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};CA.noScroll=true;render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;CA.noScroll=true;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});CA.noScroll=true;render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;CA.noScroll=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};CA.noScroll=true;render();};
window.setCalcTab=function(t){CA.tab=t;CA.noScroll=true;render();};

window.setTempCurr=function(v){
  CA.temp_curr=parseFloat(v);
  upTemp();
};
window.setTempTarget=function(v){
  CA.temp_target=parseFloat(v);
  upTemp();
};

render();
</script>
</body>
</html>
