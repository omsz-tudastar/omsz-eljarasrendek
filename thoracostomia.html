var SIMS=[
{id:1,title:'1. Szimuláció: Traumás Keringésmegállás (B+ kompetencia)',diff:'B+ kompetencia',desc:'40 éves férfi, frontális ütközés, mellkasa a kormánynak csapódott. Eszméletlen, nem lélegzik.',steps:[
{sit:'Megérkezel a helyszínre. Mi az első teendőd?',opts:[{tx:'A beteg megközelítése és azonnali újraélesztés kezdése.',ok:false,fb:'Hibás! A helyszínbiztonság és egyéni védőfelszerelés mindig az első.'},{tx:'Helyszínbiztonság ellenőrzése, védőfelszerelés felvétele.',ok:true,fb:'Helyes! Biztonság nélkül nincs betegellátás.'}]},
{sit:'A helyszín biztonságos. A beteg eszméletlen, légzése tátogó (agonális), nincs tapintható pulzus. Mit állapítasz meg és mi a teendő?',opts:[{tx:'Légzési elégtelenség. Befújásos lélegeztetést kezdek.',ok:false,fb:'Hibás! Az agonális légzés keringésmegállást jelent.'},{tx:'Keringésmegállás. Megkezdem a mellkasi kompressziókat és ALS/esetkocsi segítséget kérek.',ok:true,fb:'Helyes! CPR indítása és magasabb kompetencia hívása kötelező.'}]},
{sit:'A baleseti mechanizmus tompa mellkasi trauma. A lélegeztetés nehezített. Mire kell gyanakodnod?',opts:[{tx:'Súlyos asztmás rohamra.',ok:false,fb:'Hibás! Trauma esetén tPTX az elsődleges gyanú.'},{tx:'Feszülő légmellre (tPTX), ami a trauma és a pozitív nyomású lélegeztetés miatt alakult ki.',ok:true,fb:'Helyes! A mechanizmus és a klinikai kép tPTX-re utal.'}]},
{sit:'B+ kompetenciájú mentőápolóként végezhetsz dekompressziót (tű vagy thoracostomia) a feszülő légmell gyanúja miatt?',opts:[{tx:'Igen, B+ szinten azonnal végezhetek thoracostomiát.',ok:false,fb:'Hibás! Thoracostomiát B+ soha nem végezhet.'},{tx:'Tű-dekompressziót végezhetek, de KIZÁRÓLAG keringésmegállás esetén, felhatalmazás birtokában.',ok:true,fb:'Helyes! A kompetencia mátrix szerint B+ szinten csak ez engedélyezett.'}]},
{sit:'Rádiózol a mentésirányításnak/orvosnak és megkapod a felhatalmazást a tű-dekompresszióra. Milyen eszközt készítesz elő felnőtt betegnél?',opts:[{tx:'Egy szikét és egy 18 G-s kanült.',ok:false,fb:'Hibás! Szike thoracostomiához kell, és a 18G túl vékony.'},{tx:'Egy 14 G-s vénakanült.',ok:true,fb:'Helyes! Felnőttnél 14 G-s kanül az előírás elülső szúráshoz.'}]},
{sit:'Hol keresed meg az elülső tű-dekompresszió helyét?',opts:[{tx:'A 4. bordaközben, a hónaljvonalban.',ok:false,fb:'Hibás! Az az oldalsó dekompresszió és a thoracostomia helye.'},{tx:'A 2. bordaközben (a 2. és 3. borda között), a medioclavicularis (kulcscsont felező) vonalban.',ok:true,fb:'Helyes! Ez a standard medioclavicularis beszúrási pont.'}]},
{sit:'Hogyan tájolod be a tű pontos behatolási szögét a bordához képest?',opts:[{tx:'A felső borda alsó széle alatt, lefelé tartva.',ok:false,fb:'Hibás! A borda alatt futnak az erek és az idegek.'},{tx:'A mellkasfalra merőlegesen, az alsó borda felső szélénél.',ok:true,fb:'Helyes! Így elkerülöd az intercostalis erek megsértését.'}]},
{sit:'Beszúrod a kanült teljes egészében. Leveszed a kupakot és a cseppkamrát. Távozik a levegő, a befeszülés oldódik. Mi a következő lépés a kanüllel (a beteg pozitív nyomással lélegeztetett a CPR miatt)?',opts:[{tx:'A kanült és mandrint benthagyom nyitva, nem zárom le.',ok:true,fb:'Helyes! Lélegeztetett betegnél a tűt nyitva kell hagyni.'},{tx:'Kihúzom a fémtűt (mandrint) és csak a műanyagot hagyom bent, majd lezárom.',ok:false,fb:'Hibás! A mandrint és kanült is bent kell hagyni, és nyitva kell tartani.'}]},
{sit:'Miközben a társad folytatja a CPR-t, az újraértékelésnél észleled, hogy a mellkas ismét nehezen lélegeztethető, valószínűleg a kanül megtört. Mit teszel?',opts:[{tx:'B+ kompetenciával azonnal thoracostomiát végzek szikével.',ok:false,fb:'Hibás! B+ sosem végezhet thoracostomiát.'},{tx:'Az eredeti szúrás helyétől 1-2 cm-re lateralisan újabb 14G kanüllel ismételt szúrást végzek.',ok:true,fb:'Helyes! A protokoll engedi az újraszúrást retenzió és elzáródás/megtöretés esetén.'}]},
{sit:'A második szúrás sikeres. A CPR folyamatban van. Milyen kötelezettséged van az adminisztráció során, ha a kimeneteltől függetlenül dokumentálsz?',opts:[{tx:'Csak az ALS érkezését kell rögzíteni.',ok:false,fb:'Hibás! A beavatkozást pontosan dokumentálni kell.'},{tx:'Dokumentálni kell: beavatkozás ténye, oldala, sikeressége/sikertelensége, ürült-e levegő/vér, volt-e szövődmény.',ok:true,fb:'Helyes! Ez a kötelező adminisztrációs minimum detenzionálás után.'}]}
],summary:'Összefoglaló (B+ Kompetencia, Keringésmegállás): A helyszínbiztonság után a betegnél CPR-t kezdtünk, és hívtuk az ALS egységet. A tompa trauma (kormány) miatt a feszülő PTX alapos gyanúja állt fenn. B+ kompetenciával tű-dekompresszió CSAK keringésleállásban és FELHATALMAZÁSSAL végezhető! A rádión kért engedély után 14G-s kanült készítettünk elő. A szúrást elülső pozícióban (2. bordaköz, medioclavicularis vonal) végeztük, merőlegesen az alsó borda felső szélénél csúszva be. Beszúrás után a kupakot levettük, de a mandrint benthagytuk. Mivel a beteg lélegeztetett volt, a kanült nyitva hagytuk. Későbbi újrafeszülés (megtört kanül) miatt 1-2 cm-re lateralisan új szúrást végeztünk, amit a protokoll megenged. A beavatkozás tényét, oldalát, sikerét és az ürülő levegőt pontosan dokumentáltuk.'},

{id:2,title:'2. Szimuláció: Súlyos Mellkasi Trauma, Instabil Beteg (B kompetencia)',diff:'B kompetencia',desc:'25 éves nőt mellkason szúrtak. Eszméleténél van, de extrém módon fullad. B kompetenciaszintű (csak alap beavatkozások) egység érkezik elsőként.',steps:[
{sit:'Rendőrség biztosítja a helyszínt. A beteg a földön fekszik, sápadt, légzési segédizmait használja, SpO2 82%. Mi a legelső ABCDE szerinti teendő?',opts:[{tx:'Azonnal megkezdem a B vizsgálatot.',ok:false,fb:'Hibás! Mindig az A (Légút) vizsgálattal kezdünk.'},{tx:'A (Légút) vizsgálata. Ha nyitott, 100% O2 maszkos adása a hypoxia miatt párhuzamosan a B vizsgálattal.',ok:true,fb:'Helyes! Az azonnali O2 terápia kritikus hypoxia esetén elengedhetetlen.'}]},
{sit:'B vizsgálat: A jobb mellkasfél nem mozog. A szúrt seb környékén tapintásra ropogó (subcutan emphysema) érzés van. C vizsgálat: Pulzus 130/perc, vérnyomás 80/50 Hgmm. Mi a diagnózisod?',opts:[{tx:'Ez egy normál tüdőgyulladás tünete.',ok:false,fb:'Hibás! A trauma és a tünetek akut vérzésre és tPTX-re utalnak.'},{tx:'A beteg hemodinamikailag instabil (tachycardia, hypotensio), a subcutan emphysema és a trauma egyértelműen feszülő PTX-re (tPTX) utal.',ok:true,fb:'Helyes! Az instabil hemodinamika és az emphysema együttesen biztos tPTX gyanú.'}]},
{sit:'A beteg egyre rosszabbul van (periarrest felé halad). B kompetenciájú ápolóként végezhetsz-e tű-dekompressziót időnyerés céljából?',opts:[{tx:'Igen, mert életveszély van.',ok:false,fb:'Hibás! A kompetencia mátrix B szinten SEMMILYEN dekompressziót nem engedélyez.'},{tx:'Nem! B kompetencia nem végezhet sem tű-dekompressziót, sem thoracostomiát még életveszélyben sem.',ok:true,fb:'Helyes! A B szint szigorúan nem invazív ezen a téren.'}]},
{sit:'Mivel önállóan nem háríthatod el a feszülő légmellet, mi a legfontosabb logisztikai teendőd azonnal?',opts:[{tx:'Azonnal rohamkocsit/esetkocsit (magasabb kompetenciájú ALS/HEMS egységet) kérek a helyszínre.',ok:true,fb:'Helyes! Időkritikus állapot, ALS nélkül a beteg elveszthető.'},{tx:'Felhívom az ügyeletes orvost, hogy adjon felhatalmazást a tű-szúrásra.',ok:false,fb:'Hibás! B kompetencia felhatalmazással SEM szúrhat (csak B+ teheti meg keringésleállásban).'}]},
{sit:'Az ALS egység 8 perc múlva érkezik. Hogyan támogatod a beteg légzését addig a helyszínen?',opts:[{tx:'Megkérem, hogy lélegezzen lassan egy papírzacskóba.',ok:false,fb:'Hibás! Hypoxiája van.'},{tx:'Kritikus állapotú, hypoxia áll fenn. 100% O2-t adok maszkban. Ha a légzése elégtelenné válik, ballonos lélegeztetéssel segítek be (felkészülve a gyorsabb befeszülésre).',ok:true,fb:'Helyes! A magas áramlású O2 és a szükség szerinti asszisztált lélegeztetés az alap teendő.'}]},
{sit:'Miközben támogatod a légzést, milyen eszközöket érdemes előkészíteni a kiérkező ALS egység számára a tPTX ellátásához?',opts:[{tx:'Szikét és Peant (thoracostomiához) vagy 14G kanülöket (tű-dekompresszióhoz).',ok:true,fb:'Helyes! A felkészültség jelentősen csökkenti az ALS egység helyszíni időveszteségét.'},{tx:'Gipszet és kötszereket.',ok:false,fb:'Hibás! A tPTX invazív ellátása a prioritás.'}]},
{sit:'A beteg hirtelen elveszti az eszméletét. A pupillák tágak (D vizsgálat). Mit kell tenned az ABCDE elvek alapján?',opts:[{tx:'Állapotváltozás történt, tehát az ABCDE vizsgálatot az elejéről kell megismételni, folyamatosan monitorozva a beteget.',ok:true,fb:'Helyes! Bármilyen állapotváltozás az ABCDE újraértékelését igényli elölről.'},{tx:'Nem csinálok semmit, várom a rohamkocsit.',ok:false,fb:'Hibás! A reanimációs készenlétet folyamatosan vizsgálni kell.'}]},
{sit:'Az új "A-B-C" vizsgálat során kiderül, hogy a légzés teljesen leállt, a carotis pulzus nem tapintható. Bekövetkezett a traumás keringésleállás. B kompetenciával mi a teendő?',opts:[{tx:'Azonnal megkezdem a mellkasi kompressziókat (CPR). Mivel keringésleállás van, most már szúrhatok B kompetenciával.',ok:false,fb:'Hibás! B kompetencia még ekkor sem szúrhat.'},{tx:'Azonnal megkezdem a BLS-t (mellkasi kompressziók), felhelyezem a defibrillátort (AED) és folytatom a magasabb egység érkezéséig.',ok:true,fb:'Helyes! A keringésleállás BLS protokollt indít, de a kompetenciahatárokat tartani kell.'}]},
{sit:'Megérkezik a magasabb kompetenciájú (D/E) egység mentőtisztje/orvosa. Mivel lélegeztetett (CPR alatt álló) traumás betegről van szó egyértelmű tPTX-szel, mit fog az orvos nagy valószínűséggel alkalmazni?',opts:[{tx:'Thoracostomiát, mint definitív helyszíni megoldást feszülő légmellre lélegeztetett betegen.',ok:true,fb:'Helyes! A thoracostomia a definitív megoldás ilyen esetben.'},{tx:'Csak egy egyszerű tapaszt.',ok:false,fb:'Hibás! Az nem oldja meg a feszülést a mellüregben.'}]},
{sit:'A D/E egység thoracostomiát végez. Segédkezel. Milyen eszközt használ az orvos a mellüreg tompa tágítására a bőrmetszés után?',opts:[{tx:'A szikével vág egészen a tüdőig.',ok:false,fb:'Hibás! Az a tüdőt sértené.'},{tx:'Egy zárt, tompa Pean műszert, amivel "zárva előre - nyitva ki" mozdulatokkal halad a subcutan rétegben.',ok:true,fb:'Helyes! A preparálás csak tompa eszközzel történhet.'}]}
],summary:'Összefoglaló (B Kompetencia, Traumás tPTX): Egy penetráló traumás, instabil, periarrest állapotú beteghez érkeztünk (dyspnea, hypotensio, subcutan emphysema = egyértelmű feszülő PTX). Az oxigénterápia azonnali indítása után tisztáztuk, hogy B kompetenciájú ápoló sem tű-dekompressziót, sem thoracostomiát NEM végezhet, semmilyen körülmények között (keringésleállás esetén sem, szemben a B+ szinttel). A legfontosabb döntés a korai ALS/rohamkocsi hívás volt. Addig a légzést 100% oxigénnel és szükség esetén ballonos asszisztálással támogattuk, miközben előkészítettük az ALS számára a szükséges eszközöket (szike, Pean, 14G kanül). A beteg állapotromlásakor (eszméletvesztés) az ABCDE-t elölről ismételtük. Amikor a keringés leállt, azonnal BLS-t (kompressziók + AED) kezdtünk. A kiérkező orvosi/tiszti egység a lélegeztetett traumás betegen elvégezte a definitív thoracostomiát tompa Pean preparálással.'}
];

// ── RENDER ENGINE ──────────────────────────────────────────────────
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Render blocks
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+gw(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(function(i){return '<li>'+gw(i)+'</li>'}).join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(function(i){return '<div class="kr">✓ &nbsp;'+gw(i)+'</div>'}).join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+gw(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+gw(b.tx)+'</div>';
  if(b.tp==='steps') return b.items.map(function(s){return '<div style="display:flex;gap:10px;margin-bottom:10px;"><div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#14b8a6;color:#111827;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">'+s.n+'</div><div style="flex:1;background:#262626;border-radius:8px;padding:.5rem .75rem;"><div style="font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:.2rem;">'+gw(s.t)+'</div><div style="font-size:12px;color:#9ca3af;line-height:1.6;white-space:pre-line;">'+gw(s.x)+'</div></div></div>'}).join('');
  if(b.tp==='ctable'){
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:40px">Szint</th><th>Tű-dekompresszió</th><th>Thoracostomia</th></tr></thead><tbody>'+
    b.rows.map(function(r){return '<tr><td style="font-weight:700;color:#14b8a6">'+r.c+'</td><td>'+gw(r.t)+'</td><td>'+gw(r.th)+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  return '';
}

// ── SCREENS ────────────────────────────────────────────────────────
function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Prehospitális Thoracostomia</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v2.0 · 2024.05.14.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Tananyag','6 fejezet, teljes protokoll'],['flash','🃏','Kártyák','10 kikérdező kártya'],['quiz','❓','Kvíz','15 ellenőrző kérdés'],['sim','🚑','Szimuláció','2 kompetencia alapú eset'],['calc','🧮','Kalkulátor','Gyermek kanülméretek']].map(function(item){
  return '<button onclick="go(\''+item[0]+'\')" class="home-mod"><div class="home-mod-icon">'+item[1]+'</div><div class="home-mod-title">'+item[2]+'</div><div class="home-mod-desc">'+item[3]+'</div></button>'
}).join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af"><b>Vonatkozik:</b> Az OMSZ kivonuló állománya és irányítócsoportok személyzete számára, kompetenciaszintnek megfelelően. Készítette: OMSZ Orvosszakmai Munkacsoport.</div></div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Tananyag</h2>'+
CDATA.map(function(c){return '<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+gw(c.title)+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' bekezdés</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>'}).join('');
}

function renderChapter(id){
var c=null; for(var i=0;i<CDATA.length;i++){if(CDATA[i].id===id){c=CDATA[i];break;}}
if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+gw(c.title)+'</h2></div>'+
c.secs.map(function(s){return '<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+gw(s.t)+'</h3>'+s.bk.map(rb).join('')+'</div>'}).join('');
}

function renderFlash(){
var card=CARDS[FC.idx];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Kártyák</h2>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+CARDS.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+gw(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Kérdés</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+gw(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100), good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(function(a){return !a.ok}).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(function(a){return !a.ok}).map(function(a){
  var qq = QUIZ[a.qi];
  return '<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+gw(qq.q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+gw(qq.opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+gw(qq.opts[qq.ok])+'</div><div style="font-size:11px;color:#9ca3af">'+gw(qq.exp)+'</div></div>'
}).join(''):'<div class="al al-s">Tökéletes eredmény!</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+gw(q.q)+'</p></div>'+
q.opts.map(function(opt,i){
  var cls='opt';
  if(QZ.sel!==null){
    if(i===q.ok) cls+=' opt-ok';
    else if(i===QZ.sel && i!==q.ok) cls+=' opt-no';
  }
  var oc = QZ.sel===null?'onclick="pickQ('+i+')"':'';
  return '<button class="'+cls+'" '+oc+'>'+gw(opt)+'</button>';
}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+gw(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(function(s){
  var tg = s.diff==='B kompetencia'?'tag-g':'tag-p';
  return '<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+gw(s.title)+'</div>'+
'<span class="tag '+tg+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+gw(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>'}).join('');
}
var sim = null; for(var j=0;j<SIMS.length;j++){if(SIMS[j].id===SI.id) sim=SIMS[j];}
if(SI.fin){
var correct=SI.hist.filter(function(h){return sim.steps[h.step].opts[h.oi].ok}).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+gw(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Részletes Összefoglaló:</strong><br><br>'+gw(sim.summary)+'</div>'+
SI.hist.map(function(hh,i){
  var st=sim.steps[hh.step];
  var opt=st.opts[hh.oi];
  var col = opt.ok?'#4ade80':'#fca5a5';
  var mrk = opt.ok?'✓':'✗';
  return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+gw(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+col+'">'+mrk+' '+gw(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+gw(opt.fb)+'</div></div>';
}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+gw(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+gw(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+gw(step.sit)+'</p></div>'+
step.opts.map(function(opt,i){
  var cls='opt';
  if(SI.chosen!==null){
    if(opt.ok) cls+=' opt-ok';
    else if(i===SI.chosen && !opt.ok) cls+=' opt-no';
  }
  var oc = SI.chosen===null?'onclick="chooseSim('+i+')"':'';
  return '<button class="'+cls+'" '+oc+'>'+gw(opt.tx)+'</button>';
}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+gw(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function getNeedleSize(ag){
  if(ag==='neo') return {g:'24 G', c:'#60a5fa'};
  if(ag==='0-5') return {g:'22 G', c:'#34d399'};
  if(ag==='5-10') return {g:'20 G', c:'#f87171'};
  if(ag==='10+') return {g:'18 G', c:'#fbbf24'};
  return {g:'14 G', c:'#f97316'};
}

function renderCalc(){
var res = getNeedleSize(CA.ageGroup);
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátor</h2>'+
'<div class="card">'+
'<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Beteg korcsoportja (tű-dekompresszióhoz)</div>'+
'<select onchange="CA.ageGroup=this.value;render()">'+
'<option value="neo" '+(CA.ageGroup==='neo'?'selected':'')+'>Újszülött</option>'+
'<option value="0-5" '+(CA.ageGroup==='0-5'?'selected':'')+'>0 - 5 éves korig</option>'+
'<option value="5-10" '+(CA.ageGroup==='5-10'?'selected':'')+'>5 - 10 éves kor között</option>'+
'<option value="10+" '+(CA.ageGroup==='10+'?'selected':'')+'>10 év felett</option>'+
'<option value="adult" '+(CA.ageGroup==='adult'?'selected':'')+'>Felnőtt (standard)</option>'+
'</select>'+
'<div class="res-box" style="background:#1e1e1e;border:1px solid #3f3f3f;margin-top:1rem">'+
'<div style="font-size:13px;color:#9ca3af;margin-bottom:4px">Javasolt vénakanül méret:</div>'+
'<div style="font-size:36px;font-weight:700;color:'+res.c+';margin-bottom:.5rem">'+res.g+'</div>'+
'</div>'+
'<div class="note" style="margin-top:1rem">A bal oldali tű detenzionálás gyermekeknél mindig nagyobb szövődményrátával társul. A beavatkozás helye és indikációja megegyezik a felnőttel, de a beszúrás mélysége kisebb!</div>'+
'</div>';
}

function render(){
var c=document.getElementById('ct');
c.innerHTML='';
if(SCR==='home') c.innerHTML=renderHome();
else if(SCR==='chapters') c.innerHTML=renderChapters();
else if(SCR==='chapter') c.innerHTML=renderChapter(CHID);
else if(SCR==='flash') c.innerHTML=renderFlash();
else if(SCR==='quiz') c.innerHTML=renderQuiz();
else if(SCR==='sim') c.innerHTML=renderSim();
else if(SCR==='calc') c.innerHTML=renderCalc();

var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
var nbs = document.querySelectorAll('.nb');
for(var i=0;i<nbs.length;i++){
  if(tabs[i]===active) nbs[i].classList.add('act');
  else nbs[i].classList.remove('act');
}
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){FC.flip=false;FC.idx=(FC.idx+d+CARDS.length)%CARDS.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else{QZ.done=true;}render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){
  var sim=null; for(var j=0;j<SIMS.length;j++){if(SIMS[j].id===SI.id) sim=SIMS[j];}
  if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else{SI.fin=true;}render();
};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

// Glossary Modal Actions
window.openGloss=function(term){
  var desc = GLOSS[term];
  if(!desc) return;
  document.getElementById('glossTitle').textContent = term.toUpperCase();
  document.getElementById('glossDesc').textContent = desc;
  document.getElementById('glossMod').style.display = 'flex';
};
window.closeGloss=function(e, force){
  if(force || e.target.id === 'glossMod'){
    document.getElementById('glossMod').style.display = 'none';
  }
};

render();
</script>
