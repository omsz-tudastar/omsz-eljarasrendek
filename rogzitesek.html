function showDef(word) {
  var desc = GLOSSARY[word] || 'Nincs elérhető magyarázat.';

function closeModal(force) {

function wfw(text) {
  var words = Object.keys(GLOSSARY);
  var out = text;
  words.forEach(function(w) {
    var reg = new RegExp('\\b(' + w + ')\\b', 'gi');
    out = out.replace(reg, '<span class="fw" onclick="showDef(\'' + w + '\')">$1</span>');
  });
  return out;
}

{sit:'Társad átveszi a MILS-t. A beteg eszméletlen, de légzése stabil (ABCD stabil). Milyen kimentési eszközt választotok az autóból (ülő helyzetből) való mielőbbi kimentéshez, amit később le is fogtok cserélni?',opts:[{tx:'Vákuummatrac.',ok:false,fb:'Hibás! Autóból való kimentésre nem alkalmas.'},{tx:'Lapáthordágy.',ok:false,fb:'Hibás! Ülő beteg roncsból kimentésére a board a jobb.'},{tx:'Board (spinal board).',ok:true,fb:'Helyes! A board ideális kimentő eszköz roncsból, tengelyirányú mentésnél.'}]},
{sit:'A beteget a boardon kivettétek. Mi a teendő a kimentés után az eljárásrend alapján?',opts:[{tx:'A boardon rögzítem hevederekkel és indulunk.',ok:false,fb:'Hibás! A board nem alkalmas hosszas szállításra.'},{tx:'A boardról a ruha eltávolítása után "le kell lapátolni" a sérültet, és lapáthordágyon kell rögzíteni.',ok:true,fb:'Helyes! A board csak kimentésre való, utána lapáthordágy kell (kivéve, ha az hiányzik).'},{tx:'Átemelem egy puha hordágyra.',ok:false,fb:'Hibás! Gerincsérültnél a gerincmozgást korlátozó eszköz kell.'}]},
{sit:'A lapátágyazáshoz elő kell készíteni a beteget (D és E vizsgálat, csomagolás). A MILS folyamatos. Mikor kerül fel a merev nyaki gallér?',opts:[{tx:'A lapátágyra helyezés után, az SMR befejezésekor (vagy forgatás előtt).',ok:true,fb:'Helyes! A végleges rögzítéskor (ha intubáció nem akadályozza).'},{tx:'Soha nem teszünk gallért, elég a headblock.',ok:false,fb:'Hibás! Magas rizikónál a gallér + headblock + lapátágy a standard.'},{tx:'Már a kocsiban fel kellett volna tenni.',ok:false,fb:'Hibás! Az ellátás késői szakaszában (a légút/ABCDE után) tesszük fel.'}]},
{sit:'A C vizsgálatnál megvizsgálod a medencét. Mire kell nagyon figyelni az eljárásrend szerint?',opts:[{tx:'Erősen megnyomom két oldalról, hogy stabil-e.',ok:false,fb:'Hibás! A rányomásos technika szigorúan TILOS!'},{tx:'A baleseti mechanizmus (>100 km/h) indokolja a medence rögzítését, ránézés és egyujjas vizsgálat elég, rugóztatni TILOS!',ok:true,fb:'Helyes! Mechanizmus alapján medenceöv kötelező, nyomkodni tilos.'},{tx:'Ha nem látok torzulást, nem rakok övet.',ok:false,fb:'Hibás! Mechanizmus önmagában indikálja az övet.'}]},
{sit:'Előkészítitek a lapáthordágyat és a medenceövet. Milyen magasságban fogod a medenceövet a beteg alá húzni a log roll / csomagolás során?',opts:[{tx:'A derék (köldök) vonalában.',ok:false,fb:'Hibás! Ott hatástalan.'},{tx:'A csípőlapátok (ala ossis ilii) felett.',ok:false,fb:'Hibás! A csípőlapáti rögzítés nem fogja össze a medencegyűrűt.'},{tx:'A nagytomporok (trochanter major) vonalában.',ok:true,fb:'Helyes! Csak így tudja összefogni a törött medencegyűrűt vérzéscsillapító módon.'}]},
{sit:'A beteg a lapáthordágyon fekszik, MILS folyamatos. B+ szintű beavatkozást végzel. Mit teszel a sokk megelőzése / kezelése érdekében a helyszínen?',opts:[{tx:'Vénát biztosítok és B+ protokoll szerint folyadékot / fájdalomcsillapítót (orvosi/mentőtiszti megbízással) készítek elő/adok, folyamatos monitorozás (EKG, NIBP) mellett.',ok:true,fb:'Helyes! A vénabiztosítás és monitorozás a C vizsgálat fontos eleme B+ szinten.'},{tx:'Csak oxigént adok.',ok:false,fb:'Hibás! A vénabiztosítás B+ kompetencia és szükséges itt.'},{tx:'Azonnal intubálok.',ok:false,fb:'Hibás! Nem B+ kompetencia.'}]},
{sit:'A csomagolás során a kihűlés ellen is védekezni kell. Hogyan alkalmazzuk az izolációs buborékfóliát a lapáthordágyon?',opts:[{tx:'Csak ráterítjük a betegre.',ok:false,fb:'Hibás! Ez nem légzáró és a hátat nem védi.'},{tx:'A log roll során a lapáthordágy pengéjével együtt toljuk a beteg alá, majd felül a lábnál túllógó részt visszahajtva, ragtapasszal légzáróan leragasztjuk.',ok:true,fb:'Helyes! A buborékfóliának alul-felül védenie kell, légzáróan.'},{tx:'A lapátágy alá tesszük.',ok:false,fb:'Hibás! A beteg és a fém/műanyag közé kell tenni.'}]},
{sit:'A beteg stabilizálva, a nyakgallér és a headblock felkerült. A hordágyon beemelitek a mentőbe. Mi az SMR szállítási szabály a hevederekre?',opts:[{tx:'Elég a hordágy hevederét a betegre tenni.',ok:false,fb:'Hibás! A lapátágynak is vannak hevederei.'},{tx:'A beteget a lapátágy hevedereivel IS, és a hordágy hevedereivel IS (a fogantyúkon áthúzva) rögzíteni kell, feszesre húzva.',ok:true,fb:'Helyes! Dupla rögzítés szükséges a maximális biztonságért.'},{tx:'A lapátágyat rögzítem a hordágyhoz, a beteget nem.',ok:false,fb:'Hibás! A beteget a lapátágyhoz is rögzíteni kell.'}]},
{sit:'Érkezés a kórház SBO-ra. Ott csak normál (nem csereszabatos) lapáthordágyuk van. Hogyan adod át a beteget a CT asztalra, ha nem tudjátok a medence miatt oldalra forgatni (log roll)?',opts:[{tx:'Azonnal kicsatoljuk és a lepedővel rángatjuk át.',ok:false,fb:'Hibás! Káros és fájdalmas.'},{tx:'Ha nem cserekompatibilis: szétcsatoljuk a mi lapátágyunkat, lábtól felfelé ollószerűen nyitjuk szét a pengéket a fej stabilizációja mellett, így kihúzható a beteg alól.',ok:true,fb:'Helyes! Ez a kíméletes, gerincet/medencét óvó szétcsatolási/kivételi technika.'},{tx:'Nem adjuk át, hazavisszük a hordágyat a beteggel.',ok:false,fb:'Hibás! Az ellátás érdeke az első.'}]}
],summary:'Részletes Összefoglaló (Sim 1 - B+ kompetencia): A >100 km/h-s baleset egyértelmű indikáció az SMR-re (Spinal Motion Restriction). A megközelítés szemből történt, azonnali MILS (Manual In-line Stabilization) alkalmazásával. Az autó roncsából a beteget boarddal mentettük ki, ami a legjobb kimentő eszköz. Mivel a board nem anatómiai kialakítású és felfekvést okoz, kint "lelapátoltuk" a beteget és lapáthordágyra helyeztük. A mechanizmus miatt a medence rögzítése is kötelező volt. A rányomásos rugóztatás szigorúan tilos! A medenceövet a nagytomporok (trochanter major) magasságában húztuk be a log roll/csomagolás alatt. B+ ápolóként a shock terápiához (monitorozás, vénabiztosítás) az eszközöket párhuzamosan előkészítettük. A csomagolás során buborékfóliát használtunk a beteg alatt és felett, ragtapasszal légzáróan leragasztva. A nyakgallér és a headblock felhelyezésével az SMR teljessé vált. A mentőben dupla hevederezést alkalmaztunk (lapátágy + hordágy övei). A kórházban, mivel nem volt csereszabatos a lapátágy, a pengéket óvatosan, ollószerűen lábtól nyitva húztuk ki a beteg alól a CT asztalon.'},

{id:2,title:'2. Szimuláció: Combcsont (Femur) törés (B kompetencia)',diff:'B kompetencia',desc:'Egy fiatal focista kapott egy erős rúgást a combjára. Földön fekszik, üvölt a fájdalomtól. B kompetencia (gyógyszerelés nélkül, de a helyes eszközhasználat elvárt).',steps:[
{sit:'A helyszín biztonságos. A beteg tiszta tudatú (GCS 15), a jobb combja durván deformált. Mivel B kompetenciás vagy és nem adhatsz IV fájdalomcsillapítót, mi az első intézkedésed az ABCDE felmérés után?',opts:[{tx:'Azonnal megkezdem a láb hajlítását.',ok:false,fb:'Hibás! A mozgatás elmozdulást okoz és tilos.'},{tx:'Azonnal segélykocsit (orvosi/mentőtiszti szintet) hívok a megfelelő fájdalomcsillapítás (analgosedatio) miatt, majd megkérem a segítőt a manuális tengelyirányú húzásra.',ok:true,fb:'Helyes! A femurtörés hatalmas fájdalom, B szinten ALS segítség kell, de a húzást (fájdalomcsökkenés/vérzés miatt) azonnal el kell kezdeni.'},{tx:'Várok a mentőorvosra, addig nem csinálok semmit.',ok:false,fb:'Hibás! A húzást meg kell kezdeni.'}]},
{sit:'A társad (vagy a betanított laikus) elkezdi a jobb láb manuális, tengelyirányú húzását. A húzósín felhelyezése előtt melyik vizsgálatot KELL elvégezned a végtagon?',opts:[{tx:'KÉM-vizsgálatot (Keringés, Érzés, Mozgás).',ok:true,fb:'Helyes! Rögzítés előtt és után kötelező a KÉM.'},{tx:'GCS vizsgálatot a lábán.',ok:false,fb:'Hibás! GCS a tudatállapotra vonatkozik.'},{tx:'Röntgen vizsgálatot.',ok:false,fb:'Hibás! Nincs a helyszínen.'}]},
{sit:'A KÉM során a pulzus (a. dorsalis pedis) jól tapintható. Döntesz a húzósín felhelyezéséről. Mikor kontraindikált a húzósín?',opts:[{tx:'Csak ha a beteg sír.',ok:false,fb:'Hibás! A fájdalom indikálja.'},{tx:'Nyílt femurtörésnél.',ok:false,fb:'Hibás! Nyílt törésnél is felhelyezhető (vérzéscsillapítás).'},{tx:'Ha lebegő térd (floating knee), amputáció, vagy csípőficam gyanúja is fennáll.',ok:true,fb:'Helyes! Ezekben az esetekben a húzósín tilos.'}]},
{sit:'Izolált femurtörése van (mechanizmus = rúgás). Kell-e medenceövet is felhelyezni?',opts:[{tx:'Igen, mindig kötelező combnál.',ok:false,fb:'Hibás! Sőt, ha nem kell, felesleges kockázat.'},{tx:'Nem. Izolált, közvetlen erőhatás (rúgás) okozta femurtörés esetén nem kell medenceöv. Generalizált erőhatás (pl. magasból esés) esetén kellene.',ok:true,fb:'Helyes! Mechanizmus szerint itt izolált a sérülés.'},{tx:'Igen, ha a beteg kéri.',ok:false,fb:'Hibás! Szakmai indikáció kell.'}]},
{sit:'Elkezded a húzósín előkészítését. Az 5P szabályt alkalmazod. Mit jelent az első három P (Pulse, Pockets, Pain) a gyakorlatban?',opts:[{tx:'Megnézem a pulzust, kiürítem a nadrágzsebeket (Pockets) a nyomási sérülés elkerülésére, és gondoskodom a fájdalomcsillapításról (ALS hívása megtörtént).',ok:true,fb:'Helyes! Ez az 5P első három eleme felhelyezés előtt.'},{tx:'Pulzus, Papucs levétele, Párnázás.',ok:false,fb:'Hibás! Az 5P nem ezt jelenti az angol mnemotechnika alapján.'},{tx:'Csak a pulzust nézem 3-szor.',ok:false,fb:'Hibás! Több lépés van.'}]},
{sit:'Az 5P negyedik "P"-je a Penis (nemi szervek). Mit kell ezzel tenni a húzósín felhelyezésekor?',opts:[{tx:'Lefedjük steril gézzel.',ok:false,fb:'Hibás! Nem fertőzésveszélyről van szó.'},{tx:'Óvatosan kell felhelyezni a felső hevedert (csípőheveder), figyelve, hogy elkerüljük a nemi szervek (pénisz, herezacskó, nőknél nagyajak) becsípődését.',ok:true,fb:'Helyes! Ez komoly és elkerülhető szövődmény.'},{tx:'Ezt a nők esetében nem kell figyelembe venni.',ok:false,fb:'Hibás! Nőknél is felléphet lágyrész becsípődés.'}]},
{sit:'A csigás húzósín rögzítése során hol rögzíted a sínt ELSŐKÉNT a beteghez a csípőheveder és bokaheveder beállítása után?',opts:[{tx:'A bokánál fentről.',ok:false,fb:'Hibás! A bokapánt megvan, de a sínt magát fentről a másodiknál rögzítjük először.'},{tx:'Térdmagasságban, fentről a második tépőzárral rögzítjük a sínt a sérülthöz, majd utána feszítjük meg.',ok:true,fb:'Helyes! A protokoll képei/leírása szerint előbb rögzítjük térdnél, hogy ne mozduljon el a húzáskor.'},{tx:'Fent a legfelső hevederrel.',ok:false,fb:'Hibás! Az ábra alapján a térdnél kezdünk.'}]},
{sit:'Megkezded a húzást a sín kötelével/csigájával. Mennyire kell meghúzni (megfeszíteni) a sérült végtagot?',opts:[{tx:'Addig feszítem, amíg csak bírom erővel.',ok:false,fb:'Hibás! A túlfeszítés ér- és idegkárosodást okozhat.'},{tx:'A cél az ép végtaggal egy hosszúságra történő húzás. Kerülendő a végtag túlfeszítése!',ok:true,fb:'Helyes! A szimmetria (ép lábhoz viszonyítva) a cél.'},{tx:'Csak lazán tartom, hogy ne fájjon.',ok:false,fb:'Hibás! A vérzéscsillapítás és az izom-spazmus feloldása miatt húzni kell.'}]},
{sit:'A húzósínt felhelyezted, a KÉM vizsgálatot és az utolsó "Pulse" (5P) ellenőrzést újra elvégezted. A láb pulzusa tapintható. Megérkezik a segélykocsi, a beteg kap IV fájdalomcsillapítót, beteszitek a mentőbe. Mi a teendő a mentőben?',opts:[{tx:'Lógatni kell a lábát.',ok:false,fb:'Hibás! Végtagsérültnél mindig felpolcolás javasolt.'},{tx:'A sérült alsó végtagot a szállítás során lehetőség szerint fel kell polcolni.',ok:true,fb:'Helyes! A vénás visszaáramlás és a duzzanat csökkentése miatt.'},{tx:'Rá kell tenni egy boardra.',ok:false,fb:'Hibás! A húzósín nem kompatibilis a vákuummatraccal, de a lapátággyal igen. Nem szükséges extra board önmagában.'}]},
{sit:'A kórház SBO-ra érkezel a beteggel (húzósínnel a lábán). Az SBO személyzet kéri, hogy a hordágyról átvétel előtt "vedd le gyorsan a sínt". Mit válaszolsz az eljárásrend alapján?',opts:[{tx:'"Természetesen, azonnal leveszem, hogy tiszta legyen a láb."',ok:false,fb:'Hibás! A húzás felengedése tilos folyamatos pótlás nélkül.'},{tx:'"A húzósínt a kórházi átadás során csak akkor távolítjuk el, ha a kórházi személyzet valamilyen módon folytatja a húzást. A hirtelen felengedés súlyos vérzést/keringés megingást okozhat!"',ok:true,fb:'Helyes! A hirtelen elengedés shockot okozhat. Csereeszköz (másik húzósín vagy átvételi húzás) szükséges.'},{tx:'"Levágom ollóval."',ok:false,fb:'Hibás! Az eszközt tönkretenni és a húzást elengedni egyaránt hiba.'}]}
],summary:'Részletes Összefoglaló (Sim 2 - B kompetencia): A fiatal focista izolált femurtörést szenvedett rúgás következtében (így medenceöv nem indokolt). A hatalmas fájdalom miatt B kompetenciájú ápolóként azonnal segélykocsit hívtunk az analgéziához, de a helyszíni életmentő teendőt (húzás vérzés/spazmus ellen) el kellett kezdeni. Elsőként KÉM (Keringés, Érzés, Mozgás) vizsgálatot végeztünk, majd manuális tengelyirányú húzást alkalmaztunk. A húzósín felhelyezése előtt alkalmaztuk az 5P szabályt: ellenőriztük a pulzust (a. dorsalis pedis), kiürítettük a zsebeket, vártuk a fájdalomcsillapítást, és vigyáztunk a nemi szervek épségére. A sín felhelyezésekor a végtagot nem feszítettük túl, a cél az ép végtaggal egyező hosszúság elérése volt. Felhelyezés után ismét KÉM vizsgálatot és pulzus ellenőrzést végeztünk (5. P). A szállítás során a sérült lábat felpolcoltuk. A kórházi átadásnál a húzósínt csak akkor lehet eltávolítani, ha az SBO személyzet azonnal folytatja a húzást, mivel a hirtelen elengedés súlyos vérzést, shockot okozhat.'},

{id:3,title:'3. Szimuláció: Gyermeküléses trauma (B kompetencia)',diff:'B kompetencia',desc:'Két autó ütközött, az egyik kocsiban egy 3 éves gyermek ül a gyerekülésében, sír. B kompetencia.',steps:[
{sit:'Helyszín biztonságos. A gyermekülés sértetlennek tűnik, a gyermek erősen sír. Mivel trauma történt, de a gyermek nem látszik életveszélyben lévőnek, mi a teendő a mentőbe szállításnál?',opts:[{tx:'A gyermeket az anya ölében szállítom át a mentőbe.',ok:false,fb:'Hibás! A gyermeket anya ölében szállítani balesetveszélyes és az OMSZ szerint TILOS!'},{tx:'Baleset során biztonsági gyermekülésben talált gyermeket azzal együtt kell kivenni a gépjárműből.',ok:true,fb:'Helyes! Mindig a gyereküléssel együtt mozgatjuk ki az autóból.'},{tx:'Kiveszem az ülésből, és kézben viszem a mentőig.',ok:false,fb:'Hibás! A gerincét nem véded így.'}]},
{sit:'A gyermeket az üléssel együtt a mentőbe (vagy egy tiszta helyre) tettétek. Az ABCDE vizsgálat során megállapítod, hogy a baleseti mechanizmus indokolja az egész test rögzítését. Hogyan veszed ki a gyermekülésből?',opts:[{tx:'Lekötözöm a gyerekülésben és úgy hagyom végig.',ok:false,fb:'Hibás! Ha sérülés gyanúja/mechanizmus indokolja, ki kell venni a szakszerű ellátáshoz/hanyattfektetéshez.'},{tx:'Folyamatos manuális fejrögzítés (MILS) mellett. Egyik ellátó a váll/medence alatt fogja, fej felé mozdítjuk, 2-3 cm-t emeljük, és az ülést kihúzzuk alóla egy előkészített lapátágyra/boardra.',ok:true,fb:'Helyes! Ez a gyerekülésből mentés hivatalos, kíméletes, tengelyirányú mozdulata.'},{tx:'A lábánál fogva kihúzom.',ok:false,fb:'Hibás! Ez gerincsérülést okozhat.'}]},
{sit:'A gyermek a hátán fekszik az eszközön. A 3 éves (kb. 15 kg) gyermeknél milyen speciális párnázást kell alkalmazni a fej neutrális helyzetének biztosításához?',opts:[{tx:'A feje alá kell tenni egy vastag párnát.',ok:false,fb:'Hibás! A gyermekek feje amúgy is nagy arányaiban, ha még megemeled, a légút elzáródik.'},{tx:'A hátát (törzsét) kell 2-3 cm-rel megemelni, alápolcolni (pl. buborékfóliával, lepedővel), hogy a nagy fej miatt a nyak ne kerüljön kóros flexióba.',ok:true,fb:'Helyes! Gyermekeknél (főleg 2 év alatt, de itt is javasolt) a hát alátámasztása biztosítja a neutrális nyakat.'},{tx:'Nem kell párnázni, a lapátágy egyenes.',ok:false,fb:'Hibás! Az anatómiájuk miatt kell.'}]},
{sit:'A MILS-t továbbra is tartod. A gyermek 3 éves. Szükséges-e a merev nyakrögzítő gallér felhelyezése mindenáron?',opts:[{tx:'Igen, protokoll szerint kötelező.',ok:false,fb:'Hibás! Gyermekeknél van kivétel.'},{tx:'6 év alatti gyermek sérültek esetén a fej-test rögzítés (headblock) élvez elsőbbséget. Csak akkor használunk gallért, ha a felhelyezés semmiféle ellenkezésbe nem ütközik.',ok:true,fb:'Helyes! Ha a gallér miatt a gyerek küzd és mozgatja a nyakát, többet ártunk vele.'},{tx:'Soha nem használunk gallért 10 év alatt.',ok:false,fb:'Hibás! Használható, ha együttműködő a gyermek.'}]},
{sit:'Úgy döntötök, hogy a gyermek boardot / lapátágyat (SMR-t) és headblock-ot (fejrögzítőt) használtok. Milyen sorrendben rögzítitek a gyermeket a hevederekkel?',opts:[{tx:'Először a fejét rögzítjük (headblock), aztán a testét.',ok:false,fb:'Hibás! Ha a testet utólag mozdítják, a már fixált nyak fog elcsavarodni.'},{tx:'Először a törzset (mellkas, medence, comb) rögzítjük hevederekkel, a MILS folyamatos fenntartása mellett, és CSAK EZUTÁN rögzítjük a fejet.',ok:true,fb:'Helyes! A rögzítési sorrend mindig: test, utána a fej.'},{tx:'Mindegy a sorrend, csak gyors legyen.',ok:false,fb:'Hibás! A sorrend kritikus a gerincvédelemben.'}]},
{sit:'A fejrögzítésnél (headblock) ragtapaszt is használtok a homlokon/állon. Mire kell figyelni gyermekeknél a ragtapasz használatakor?',opts:[{tx:'Arra, hogy a homlokhoz vagy a hajához ne ragadjon hozzá közvetlenül a ragtapasz (használjunk mull-lapot vagy ellentapaszt).',ok:true,fb:'Helyes! A gyermek bőre érzékeny, a szőrzet/haj letépése erős fájdalmat/pánikot okozhat.'},{tx:'Erősen körbe kell tekerni a nyakán.',ok:false,fb:'Hibás! Fojtást okozhat.'},{tx:'Ne használjunk ragtapaszt, csak fogjuk a fejét.',ok:false,fb:'Hibás! Az eszközös rögzítéshez kell.'}]},

function setCalcTab(tab) {
  CA.tab = tab;
  render();
}

function updateSMR() {
  var inputs = document.querySelectorAll('.smr-chk');
  var anyTrue = false;
  inputs.forEach(function(i) { if(i.checked) anyTrue = true; });
  
  var res = document.getElementById('smr-res');
  if(anyTrue) {
    res.innerHTML = '<div style="background:#450a0a;color:#fca5a5;padding:10px;border-radius:8px;border:1px solid #7f1d1d;font-weight:bold;">MAGAS RIZIKÓ!<br>Azonnali MILS, majd teljes SMR (lapátágy + nyakgallér + headblock) kötelező!</div>';
  } else {
    res.innerHTML = '<div style="background:#064e3b;color:#6ee7b7;padding:10px;border-radius:8px;border:1px solid #065f46;font-weight:bold;">Jelenleg nincs SMR-t indokló mechanizmus bejelölve.<br>Klinikai mérlegelés (AVPU-ABCDE) javasolt.</div>';
  }
}

function updateStretcher() {
  var wt = document.getElementById('st-wt').value;
  var mw = 159; // Metal
  var pw = 227; // Plastic
  var res = document.getElementById('st-res');
  var h = '<div style="margin-top:10px;">';
  
  if (wt <= mw) {
    h += '<div style="color:#4ade80;font-weight:bold;">✓ Fém lapáthordágy használható (Max: 159 kg)</div>';
  } else {
    h += '<div style="color:#fca5a5;font-weight:bold;">✗ Fém lapáthordágy NEM használható! (Max: 159 kg)</div>';
  }
  
  if (wt <= pw) {
    h += '<div style="color:#4ade80;font-weight:bold;">✓ Műanyag lapáthordágy használható (Max: 227 kg)</div>';
  } else {
    h += '<div style="color:#fca5a5;font-weight:bold;">✗ Műanyag lapáthordágy NEM használható! (Max: 227 kg)</div>';
  }
  
  h += '</div>';
  res.innerHTML = h;
}

function renderCalc() {
  var t1 = CA.tab === 'smr' ? 'btn-g' : '';
  var t2 = CA.tab === 'stretcher' ? 'btn-g' : '';
  
  var html = '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Rögzítési Kalkulátorok</h2>';
  html += '<div class="btn-row" style="margin-bottom:1rem;">';
  html += '<button class="btn ' + t1 + '" onclick="setCalcTab(\'smr\')">SMR Döntéstámogató</button>';
  html += '<button class="btn ' + t2 + '" onclick="setCalcTab(\'stretcher\')">Lapáthordágy Terhelhetőség</button>';
  html += '</div>';

  if (CA.tab === 'smr') {
    html += '<div class="card">';
    html += '<h3 style="font-size:14px;color:#14b8a6;margin-bottom:10px;">Sérülési Mechanizmus (Jelöld be, ha igaz!)</h3>';
    
    var crits = [
      'Magasból esés (>2 méter, gyermeknél testhossz 2-3x)',
      'Tengelyirányú fej/nyaksérülés (pl. fejesugrás)',
      'Nagysebességű autóbaleset (>100 km/h)',
      'Járműbe beszorult',
      'Járműből kirepült',
      'Utastársa meghalt (a balesetben)',
      'Gázolásban sérült',
      'Nagysebességű kerékpáros/motorbaleset'
    ];
    
    crits.forEach(function(c, idx) {
      html += '<label class="chk-row"><input type="checkbox" class="smr-chk" onchange="updateSMR()"> <span>' + h(c) + '</span></label>';
    });
    
    html += '<div id="smr-res" style="margin-top:15px;"><div style="background:#064e3b;color:#6ee7b7;padding:10px;border-radius:8px;border:1px solid #065f46;font-weight:bold;">Jelenleg nincs SMR-t indokló mechanizmus bejelölve.<br>Klinikai mérlegelés (AVPU-ABCDE) javasolt.</div></div>';
    html += '</div>';
  } 
  else {
    html += '<div class="card">';
    html += '<h3 style="font-size:14px;color:#14b8a6;margin-bottom:10px;">Beteg Becsült Testsúlya (kg)</h3>';
    html += '<input type="number" id="st-wt" value="80" oninput="updateStretcher()">';
    html += '<div id="st-res" style="margin-top:15px;">';
    html += '<div style="color:#4ade80;font-weight:bold;">✓ Fém lapáthordágy használható (Max: 159 kg)</div>';
    html += '<div style="color:#4ade80;font-weight:bold;">✓ Műanyag lapáthordágy használható (Max: 227 kg)</div>';
    html += '</div>';
    html += '<div class="note" style="margin-top:15px;">Minden esetben a fogópántok segítségével mozgassuk, a két végénél emelve a terhelhetőség jelentősen csökken!</div>';
    html += '</div>';
  }

  return html;
}

'<div style="color:#9ca3af;font-size:18px">›</div></button>'}).join('');
}

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(function(i){return '<li>'+h(i)+'</li>'}).join('')+'</ul>';
  if(b.tp==='kr') return '<div style="margin-bottom:12px;">'+b.items.map(function(i){return '<div class="kr">✓ &nbsp;'+h(i)+'</div>'}).join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+h(b.tx)+'</div>';
  return '';
}

function renderChapter(id){
var c = null;
for(var i=0; i<CDATA.length; i++) { if(CDATA[i].id === id) c = CDATA[i]; }
if(!c) return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+h(c.title)+'</h2></div>'+
c.secs.map(function(s){ return '<div class="card"><h3 style="font-size:15px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+h(s.t)+'</h3>'+s.bk.map(function(b){return rb(b);}).join('')+'</div>'}).join('');
}

function renderFlash(){
var cats = ['Összes'];
for(var i=0; i<CARDS.length; i++) { if(cats.indexOf(CARDS[i].cat) === -1) cats.push(CARDS[i].cat); }
var filtered = FC.cat === 'Összes' ? CARDS : CARDS.filter(function(c){return c.cat === FC.cat});
var card = filtered[Math.min(FC.idx, filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(function(c){ return '<button onclick="setCat(\''+c+'\')" style="padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+c+'</button>'}).join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:11px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:14px;color:#d1d5db;line-height:1.6;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
'<div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:16px;font-weight:600;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(function(a){return !a.ok}).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(function(a){return !a.ok}).map(function(a){ return '<div class="card" style="margin-bottom:8px"><div style="font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+h(QUIZ[a.qi].q)+'</div><div style="font-size:12px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+h(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:12px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:12px;color:#9ca3af">'+h(QUIZ[a.qi].exp)+'</div></div>'}).join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
q.opts.map(function(opt,i){var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'>'+h(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs Esetek</h2>'+
SIMS.map(function(s){ return '<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:13px;color:#9ca3af;margin-bottom:6px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;font-weight:600;">'+s.steps.length+' kérdés</div></button>'}).join('');
}
var sim = null;
for(var i=0; i<SIMS.length; i++) { if(SIMS[i].id === SI.id) sim = SIMS[i]; }

if(SI.fin){
var correct=SI.hist.filter(function(h){return sim.steps[h.step].opts[h.oi].ok}).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Részletes Összefoglaló:</strong><br><br>'+h(sim.summary)+'</div>'+
SI.hist.map(function(hh,i){var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:8px"><div style="font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:12px;margin-bottom:4px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:12px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:16px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map(function(opt,i){var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'>'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function render(){
var c=document.getElementById('ct');
c.innerHTML='';
if(SCR==='home') c.innerHTML=renderHome();
else if(SCR==='chapters') c.innerHTML=renderChapters();
else if(SCR==='chapter') c.innerHTML=renderChapter(CHID);
else if(SCR==='flash') c.innerHTML=renderFlash();
else if(SCR==='quiz') c.innerHTML=renderQuiz();
else if(SCR==='sim') c.innerHTML=renderSim();
else if(SCR==='calc') c.innerHTML=renderCalc();

var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
var btns = document.querySelectorAll('.nb');
for(var i=0; i<btns.length; i++) {
  if (tabs[i] === active) {
    btns[i].classList.add('act');
  } else {
    btns[i].classList.remove('act');
  }
}
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){
  var f=FC.cat==='Összes'?CARDS:CARDS.filter(function(c){return c.cat===FC.cat});
  FC.flip=false;
  FC.idx=(FC.idx+d+f.length)%f.length;
  render();
};
window.pickQ=function(i){
  if(QZ.sel!==null) return;
  QZ.sel=i;
  var ok=i===QUIZ[QZ.idx].ok;
  if(ok) QZ.score++;
  QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});
  render();
};
window.nextQ=function(){
  if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else{QZ.done=true;}
  render();
};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){
  if(SI.chosen!==null)return;
  SI.chosen=i;
  SI.hist.push({step:SI.step,oi:i});
  render();
};
window.nextSim=function(){
  var sim = null;
  for(var i=0; i<SIMS.length; i++) { if(SIMS[i].id === SI.id) sim = SIMS[i]; }
  if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else{SI.fin=true;}
  render();
};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
</html>
