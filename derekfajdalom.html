{sit:'Megérkeznek a helyszínre. A beteg a nappaliban egy fotelben ül, arca fájdalmas. Mi az első teendő?',opts:[{tx:'Azonnal fájdalomcsillapítót (NSAID) adok neki p.o.',ok:false,fb:'Hibás! A helyszínbiztonság és a betegvizsgálat megelőzi a gyógyszerelést.'},{tx:'Helyszínbiztonság ellenőrzése, majd ABCDE szerinti elsődleges betegvizsgálat.',ok:true,fb:'Helyes! A helyszín biztonságának ellenőrzése és az ABCDE vizsgálat sosem hagyható ki.'}]},
{sit:'Az ABCDE vizsgálat során a beteg keringése és légzése stabil (normális). A következő lépés az anamnézis felvétele. Melyik rendszert/sémát alkalmazza a fájdalom részletes kikérdezésére?',opts:[{tx:'GCS skála',ok:false,fb:'Hibás! A GCS a tudatállapot felmérésére szolgál.'},{tx:'OPQRST séma a fájdalom helyére, idejére, súlyosságára.',ok:true,fb:'Helyes! Az OPQRST ideális a fájdalom pontos kikérdezésére.'}]},

{sit:'A beteg tagad minden "red flag" tünetet (nincs vizeletpanasz, láz, tumor anamnézis). Mi a teendő a gerinc fizikális vizsgálata során?',opts:[{tx:'A gerincoszlop tapintása, paravertebrális izomzat vizsgálata, scoliosis keresése.',ok:true,fb:'Helyes! A fizikális vizsgálat célja a tapintható eltérések, izomfeszülés azonosítása.'},{tx:'Szigorúan tilos megérinteni a beteget.',ok:false,fb:'Hibás! A fizikális vizsgálat a protokoll része.'}]},

],summary:'Egy tipikus, mechanikus eredetű, nemspecifikus akut derékfájdalom esete. A helyszínbiztonság és az ABCDE stabilitás igazolása után az OPQRST alapján felvett anamnézis, valamint a neurológiai (sarok/lábujjhegy járás, guggolás) és specifikus (Lasegue) vizsgálatok során "red flag" tünetek nem igazolódtak. B kompetenciájú ellátó önállóan nem hagyhat a helyszínen beteget, ezért irányítói/ügyeleti konzultáció történt. A betegnek a tartós ágynyugalom kerülését, meleg borogatást, és gyomorvédelem mellett NSAID szedését javasoltuk.'},

{sit:'A beteg megkérdezi, hogy meg fog-e bénulni. Mit válaszol szakszerűen?',opts:[{tx:'Sajnos igen, biztosan.',ok:false,fb:'Hibás! A definitív diagnózist és prognózist nem mi állítjuk fel.'},{tx:'A panaszai komoly kórházi kivizsgálást igényelnek, ezért most a megfelelő intézménybe visszük azonnali vizsgálatokra.',ok:true,fb:'Helyes! Őszinte, tényszerű, de nem diagnosztizál és nem rémisztget feleslegesen.'}]},
{sit:'A beteg átadásakor az SBO/neurológiai osztályon mit kell kiemelni az anamnézisből?',opts:[{tx:'Csak azt, hogy kapott fájdalomcsillapítót.',ok:false,fb:'Hibás! A legfontosabb a "Red Flag" infók átadása.'},{tx:'Az újkeletű vizelettartási zavart, a lovaglónadrág érzéskiesést és az alsó végtagi gyengeséget (Cauda Equina gyanú).',ok:true,fb:'Helyes! Ezek az azonnali beavatkozást indikáló tényezők.'}]}
],summary:'A szituáció egy gerincvelői / cauda equina kompressziót ("Red Flag" kórképet) mutat be. Az anamnézis (vizelettartási probléma) és a neurológiai vizsgálat (lovaglónadrág érzéskiesés, motoros gyengeség) alapján azonnali intézeti beutalás volt indokolt. B+ kompetenciával a beteg vénabiztosítást és fájdalomcsillapítót kapott, majd kíméletes, tehermentesített pozícióban azonnal megfelelő ellátóhelyre szállítottuk, a kórház előzetes értesítése mellett.'},

{id:3,title:'3. Szimuláció: Érrendszeri katasztrófa (Aorta dissectio gyanú)',diff:'B+ kompetencia',desc:'Egy 65 éves férfihoz hívják a B+ egységet. A beteg a földön fekszik, verejtékes, elmondása szerint hirtelen elviselhetetlenül éles fájdalom hasított a derekába és a hátába.',steps:[
{sit:'Helyszínbiztonság rendben. A beteg sápadt, verejtékes, arcán halálfélelem tükröződik. Az ABCDE alapján milyen vizsgálattal kezd?',opts:[{tx:'Gyors ABC vizsgálat a kritikus keringési zavar azonosítására.',ok:true,fb:'Helyes! A sápadt, verejtékes beteg instabil lehet, azonnali ABC felmérés szükséges.'},{tx:'Azonnal megpróbálom felállítani, hogy tud-e járni.',ok:false,fb:'Hibás! Instabil beteget tilos mozgatni a vizsgálat előtt.'}]},
{sit:'Az A és B rendben. A "C" (keringés) vizsgálat során a pulzusa szapora, a vérnyomása a bal karon 180/100 Hgmm. Mi az aorta dissectio tipikus fájdalomjellemzője?',opts:[{tx:'Lassan kialakuló tompa, nyomó fájdalom.',ok:false,fb:'Hibás! Az a típusos izomfájdalomra vagy más lassan kialakuló kórképre jellemző.'},{tx:'Hirtelen kezdődő, éles, "hasító", elviselhetetlen fájdalom, amely a hátba/hasba sugárzik.',ok:true,fb:'Helyes! Ez az érrendszeri katasztrófák, kiemelten az aorta dissectio/aneurysma ruptúra klasszikus jele.'}]},
{sit:'Milyen specifikus érrendszeri fizikális vizsgálatot kell az eljárásrend alapján azonnal elvégezni ennél a gyanúnál?',opts:[{tx:'Végtagok közötti pulzuskülönbség vizsgálata és a vérnyomás mérése mindkét karon.',ok:true,fb:'Helyes! A pulzusasszimmetria az aorta dissectio erős gyanújele.'},{tx:'A nyaki vénák teltségének megtekintése.',ok:false,fb:'Hibás! Hasznos, de dissectio gyanújánál a pulzuskülönbség a legfontosabb specifikus vizsgálat.'}]},
{sit:'A jobb csuklón a pulzus alig tapintható, a vérnyomás ott csak 90/50 Hgmm. Jelentős a pulzus/vérnyomás aszimmetria. Mi a teendő B+ kompetenciával?',opts:[{tx:'Azonnali segélykocsi (ALS) riasztása, mivel életveszélyes állapot (Aorta dissectio gyanúja).',ok:true,fb:'Helyes! Az állapot kritikus, az idő faktor létfontosságú, azonnal ALS kell.'},{tx:'Adok neki egy fájdalomcsillapító tablettát és várok.',ok:false,fb:'Hibás! Időveszteség, a beteg belehalhat.'}]},
{sit:'A segélykocsi/ALS egység érkezéséig mit tesz a beteggel?',opts:[{tx:'Felállítom és sétáltatom a vérkeringés javítása érdekében.',ok:false,fb:'Hibás! Szigorú fektetés és nyugalom szükséges!'},{tx:'Szigorú nyugalomba helyezem, 100% oxigént adok és azonnal vénát biztosítok (B+ kompetencia).',ok:true,fb:'Helyes! Az oxigenizáció, a nyugalom és a véna megléte kritikus a továbblépéshez.'}]},
{sit:'Az anamnézisből kiderül, hogy ismert magasvérnyomás-beteg. Adhat-e önállóan vérnyomáscsökkentőt (B+ szint)?',opts:[{tx:'Igen, nitrátot adok rögtön.',ok:false,fb:'Hibás! Az érrendszeri katasztrófa kezelése ALS/orvosi feladat, a B+ önállóan nitrátot ilyen esetben óvatosan/nem adhat anélkül, hogy ne rontaná az állapotot, ha aneurysma ruptura is van.'},{tx:'Nem, B+ szinten a vérnyomáscsökkentés és célzott medikáció ebben a helyzetben ALS beavatkozást/orvosi utasítást igényel.',ok:true,fb:'Helyes! A vérnyomás drasztikus csökkentése anélkül, hogy a pulzust kontrollálnák, vagy aneurysma rupturánál veszélyes lehet.'}]},
{sit:'A fájdalma továbbra is elviselhetetlen (10/10). Adhat-e NSAID-ot per os?',opts:[{tx:'Nem, az NSAID (főleg p.o.) itt teljesen hatástalan lesz és szájon át semmit nem adunk kritikus betegnek.',ok:true,fb:'Helyes! Életveszélyes állapotban p.o. gyógyszer kontraindikált a lehetséges műtét és aspiráció miatt.'},{tx:'Igen, ibuprofent adok vízzel.',ok:false,fb:'Hibás!'}]},
{sit:'A mentőorvos megérkezik, de Önnek folytatnia kell a vizsgálatot "D" (Neurológia) és "E" tekintetében. Mit kell vizsgálni az alsó végtagokon?',opts:[{tx:'Csak azt, hogy melegek-e.',ok:false,fb:'Hibás! Több dolog kell.'},{tx:'A motoros/szenzoros funkciókat és az alsó végtagi keringést (lehet iszkémiás a dissectio miatt).',ok:true,fb:'Helyes! A dissectio ráterjedhet a csípőerekre, ami alsó végtagi paralízist vagy ischaemiát (hideg, fehér végtag) okozhat.'}]},
{sit:'Az EKG felhelyezése indokolt ebben a helyzetben?',opts:[{tx:'Igen, a 12 elvezetéses EKG differenciáldiagnosztikai (pl. AMI kizárása) szempontból fontos, de nem késleltetheti a szállítást.',ok:true,fb:'Helyes! Az aorta dissectio gyakran utánozza az infarktust, de nem okozhat időveszteséget.'},{tx:'Nem, teljesen felesleges.',ok:false,fb:'Hibás! A C vizsgálat része az EKG.'}]},
{sit:'Hogyan kell a szállítás célintézményét meghatározni?',opts:[{tx:'A legközelebbi rendelőintézet.',ok:false,fb:'Hibás! Nem megfelelő az ellátási szint.'},{tx:'Mentésirányítással egyeztetve a megfelelő profilú érsebészeti/SBO központba szállítás azonnal.',ok:true,fb:'Helyes! Az érrendszeri katasztrófa definitív ellátása sürgős műtéti kapacitást (SBO/Érsebészet) igényel.'}]}
],summary:'Az eset egy abdominalis aorta aneurysma / dissectio gyanúját mutatta be, amely hirtelen, éles, kisugárzó fájdalommal és pulzuskülönbséggel jelentkezik. B+ kompetenciával felismertük az életveszélyes, kritikus kórképet, azonnal ALS (segélykocsi) egységet kértünk. Addig is szigorú nyugalom, vénabiztosítás, O2 terápia és hemodinamikai monitorozás történt. Szájon át gyógyszert nem adtunk a várható műtét miatt. A mentőorvos kiérkezése után érsebészeti háttérrel rendelkező SBO-ra szállítottuk a beteget.'},

{id:4,title:'4. Szimuláció: Tumoros áttét / Patológiás törés',diff:'B kompetencia',desc:'Egy 70 éves hölgyhöz hívják Önöket. Ismert mellrákja volt évekkel ezelőtt. Éjszaka erős, nyugalomban is fennálló hát/derékfájdalomra ébredt, ami egy tüsszentésnél hirtelen "roppanó" érzéssel és elviselhetetlen fájdalommal társult.',steps:[

{sit:'A fizikai vizsgálat során a gerincoszlop tapintását és finom ütögetését végzi. Mit tapasztal patológiás törés / metasztázis esetén?',opts:[{tx:'Helyi, csigolyára lokalizált, erős nyomás- és ütögetési érzékenységet.',ok:true,fb:'Helyes! A csigolyák fájdalma infekcióra, kompressziós törésre, metastasisra utal.'},{tx:'Nem tapasztalható semmilyen fájdalom tapintásra.',ok:false,fb:'Hibás! A csontfolyamat (törés/tumor) nagyon érzékeny a lokalizált nyomásra.'}]},
{sit:'A beteget megkéri, hogy álljon fel. A neurológiai vizsgálat során (láb emelése, járás) a beteg hirtelen gyengeséget jelez a jobb lábában. Mit jelent ez?',opts:[{tx:'Újkeletű (motoros) neurológiai deficit, ami azonnali kórházi beutalást igénylő Red Flag.',ok:true,fb:'Helyes! A neurológiai kiesés tumoros térfoglalás (gerincvelői kompresszió) jele is lehet.'},{tx:'Az izmok egyszerű elfáradását.',ok:false,fb:'Hibás! Ne bagatellizáljuk a neurológiai tüneteket daganatos anamnézis mellett.'}]},
{sit:'B kompetenciával, felismerve a Red Flag tüneteket (tumor gyanú, neuro deficit, patológiás törés), milyen intézkedést kell tennie?',opts:[{tx:'Tanácsot adok, hogy szedjen be egy fájdalomcsillapítót és pihenjen otthon.',ok:false,fb:'Hibás! A Red Flag = azonnali intézeti vizsgálat.'},{tx:'Azonnali kórházi beutalást indikálok és megszervezem a biztonságos betegszállítást, sz.e. iránymutatást kérek.',ok:true,fb:'Helyes! A protokoll kötelezővé teszi az azonnali intézeti kivizsgálást.'}]},

function renderCalc(){
  // Red flag score system
  let rfHtml = `
    <h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok és Értékelők</h2>
    <div style="display:flex;gap:7px;margin-bottom:.75rem">
      <button onclick="CA.tab='redflag';render();" style="flex:1;padding:.5rem;border:1px solid ${CA.tab==='redflag'?'#14b8a6':'#3f3f3f'};border-radius:8px;background:${CA.tab==='redflag'?'#14b8a6':'#2a2a2a'};color:${CA.tab==='redflag'?'#111827':'#d1d5db'};cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">Red Flag Értékelő</button>
      <button onclick="CA.tab='nsaid';render();" style="flex:1;padding:.5rem;border:1px solid ${CA.tab==='nsaid'?'#14b8a6':'#3f3f3f'};border-radius:8px;background:${CA.tab==='nsaid'?'#14b8a6':'#2a2a2a'};color:${CA.tab==='nsaid'?'#111827':'#d1d5db'};cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">NSAID Kalkulátor</button>
    </div>
  `;

  if(CA.tab === 'redflag') {
    let rfs = [
      {id:'rf1', l:'Újkeletű (4 héten belüli) fájdalom?'},
      {id:'rf2', l:'Tumoros anamnézis / malignitás jelentős gyanúja?'},
      {id:'rf3', l:'Infekciós tünetek társulása (láz, hidegrázás)?'},
      {id:'rf4', l:'Intravénás droghasználat / Immunszupresszió?'},
      {id:'rf5', l:'Újkeletű vizelet/széklettartási rendellenesség?'},
      {id:'rf6', l:'Lovaglónadrág érzéskiesés?'},
      {id:'rf7', l:'Újkeletű (motoros/szenzoros) neuro deficit?'}
    ];
    rfHtml += `<div class="card"><div style="font-size:13px;color:#9ca3af;margin-bottom:10px;">Jelölje be a fennálló tüneteket:</div>`;
    rfs.forEach((r, i) => {
      rfHtml += `<label style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:#f3f4f6;"><input type="checkbox" id="${r.id}" onchange="calcRF()" style="width:18px;height:18px;accent-color:#14b8a6;"> ${r.l}</label>`;
    });
    rfHtml += `<div id="rf_res" class="res-box" style="margin-top:15px;background:#262626;"><div style="font-size:14px;color:#9ca3af;">Jelöljön be tüneteket az értékeléshez.</div></div></div>`;
  } else {
    // NSAID calc
    rfHtml += `
    <div class="card">
      <div style="font-size:13px;color:#9ca3af;margin-bottom:10px;">Számolja ki a napi javasolt maximális dózist a hatóanyag alapján. (A készítmény leiratok csak irányadóak!)</div>
      
      <div style="margin-bottom:15px;">
        <label style="font-size:12px;color:#d1d5db;">Diklofenák (Napi max: 150 mg). Bevenni kívánt tabletták száma x dózis (mg):</label>
        <div style="display:flex;gap:5px;margin-top:5px;">
          <input type="number" id="nd_db" value="0" min="0" onchange="calcNS()" placeholder="Db">
          <span style="display:flex;align-items:center;color:#9ca3af">x</span>
          <input type="number" id="nd_mg" value="50" min="0" onchange="calcNS()" placeholder="mg">
          <span id="nd_res" style="display:flex;align-items:center;font-weight:bold;color:#f3f4f6;width:100px;justify-content:center;">0 mg</span>
        </div>
      </div>

      <div style="margin-bottom:15px;">
        <label style="font-size:12px;color:#d1d5db;">Ibuprofén (Napi max: 1200 mg). Bevenni kívánt tabletták száma x dózis (mg):</label>
        <div style="display:flex;gap:5px;margin-top:5px;">
          <input type="number" id="ni_db" value="0" min="0" onchange="calcNS()" placeholder="Db">
          <span style="display:flex;align-items:center;color:#9ca3af">x</span>
          <input type="number" id="ni_mg" value="400" min="0" onchange="calcNS()" placeholder="mg">
          <span id="ni_res" style="display:flex;align-items:center;font-weight:bold;color:#f3f4f6;width:100px;justify-content:center;">0 mg</span>
        </div>
      </div>

      <div style="margin-bottom:15px;">
        <label style="font-size:12px;color:#d1d5db;">Naproxen (Napi max: 1100 mg). Bevenni kívánt tabletták száma x dózis (mg):</label>
        <div style="display:flex;gap:5px;margin-top:5px;">
          <input type="number" id="nn_db" value="0" min="0" onchange="calcNS()" placeholder="Db">
          <span style="display:flex;align-items:center;color:#9ca3af">x</span>
          <input type="number" id="nn_mg" value="275" min="0" onchange="calcNS()" placeholder="mg">
          <span id="nn_res" style="display:flex;align-items:center;font-weight:bold;color:#f3f4f6;width:100px;justify-content:center;">0 mg</span>
        </div>
      </div>
      
      <div id="nsaid_warn" class="al al-i">Adja meg a tervezett gyógyszer mennyiséget.</div>
      <div class="note">Minden orális NSAID mellé gyomorvédelem (H2 blokkoló / PPI 20mg) javasolt!</div>
    </div>`;
  }

  return rfHtml;
}

window.calcRF = function() {
  let isAcute = document.getElementById('rf1').checked;
  let hasOther = false;
  for(let i=2; i<=7; i++) {
    if(document.getElementById('rf'+i).checked) hasOther = true;
  }
  
  let res = document.getElementById('rf_res');
  if(isAcute && hasOther) {
    res.style.background = '#450a0a';
    res.style.borderColor = '#ef4444';
    res.innerHTML = `<div style="font-size:16px;font-weight:bold;color:#fca5a5;">AZONNALI INTÉZETI VIZSGÁLAT INDOKOLT!</div><div style="font-size:12px;color:#fecaca;margin-top:5px;">A beteg újkeletű derékfájdalommal és legalább egy riasztó (red flag) tünettel rendelkezik.</div>`;
  } else if (hasOther) {
    res.style.background = '#451a03';
    res.style.borderColor = '#f59e0b';
    res.innerHTML = `<div style="font-size:16px;font-weight:bold;color:#fde68a;">ORVOSI/INTÉZETI KONZULTÁCIÓ JAVASOLT!</div><div style="font-size:12px;color:#fef3c7;margin-top:5px;">A tünetek nem kifejezetten újak (<4 hét), de a riasztó tünetek komolyabb kivizsgálást igényelnek.</div>`;
  } else {
    res.style.background = '#064e3b';
    res.style.borderColor = '#10b981';
    res.innerHTML = `<div style="font-size:16px;font-weight:bold;color:#a7f3d0;">NEM AZONOSÍTHATÓ KRITIKUS RED FLAG</div><div style="font-size:12px;color:#d1fae5;margin-top:5px;">A helyszíni tanácsadás és tüneti terápia valószínűleg elegendő, de a beteg állapota folyamatos követést igényel.</div>`;
  }
}

window.calcNS = function() {
  let d_d = parseInt(document.getElementById('nd_db').value) || 0;
  let d_m = parseInt(document.getElementById('nd_mg').value) || 0;
  let d_tot = d_d * d_m;
  document.getElementById('nd_res').innerText = d_tot + " mg";
  document.getElementById('nd_res').style.color = d_tot > 150 ? '#fca5a5' : '#4ade80';

  let i_d = parseInt(document.getElementById('ni_db').value) || 0;
  let i_m = parseInt(document.getElementById('ni_mg').value) || 0;
  let i_tot = i_d * i_m;
  document.getElementById('ni_res').innerText = i_tot + " mg";
  document.getElementById('ni_res').style.color = i_tot > 1200 ? '#fca5a5' : '#4ade80';

  let n_d = parseInt(document.getElementById('nn_db').value) || 0;
  let n_m = parseInt(document.getElementById('nn_mg').value) || 0;
  let n_tot = n_d * n_m;
  document.getElementById('nn_res').innerText = n_tot + " mg";
  document.getElementById('nn_res').style.color = n_tot > 1100 ? '#fca5a5' : '#4ade80';

  let warn = document.getElementById('nsaid_warn');
  if(d_tot > 150 || i_tot > 1200 || n_tot > 1100) {
    warn.className = "al al-d";
    warn.innerHTML = "<strong>FIGYELEM!</strong> A kiszámított napi dózis meghaladja az eljárásrend szerinti maximális javasolt értéket! (Diklofenák max 150mg, Ibuprofén max 1200mg, Naproxen max 1100mg).";
  } else if (d_tot > 0 || i_tot > 0 || n_tot > 0) {
    warn.className = "al al-s";
    warn.innerHTML = "A kiszámított dózisok a megengedett tartományon belül vannak. (Emlékeztető: a lehető legalacsonyabb hatásos dózis javasolt).";
  } else {
    warn.className = "al al-i";
    warn.innerHTML = "Adja meg a tervezett gyógyszer mennyiséget.";
  }
}

// Renderező funkciók (Az index.html alapján adaptálva)
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+b.tx+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  return '';
}

function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Derékfájdalom Ellátása</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v1.0 · 2023.06.28.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Tananyag','Teljes tartalom'],['flash','🃏','Flashkártyák','Interaktív kártyák'],['quiz','❓','Kvíz','20 kérdés visszajelzéssel'],['sim','🚑','Szimuláció','4 interaktív eset'],['calc','🧮','Kalkulátor','Red Flag & NSAID']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af"><b>Vonatkozik:</b> Az OMSZ valamennyi kivonuló dolgozójára és mentésirányítójára, kompetenciaszintnek megfelelően.</div></div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Tananyag</h2>'+
'<div class="note">A színezett, aláhúzott szavakra kattintva megtekintheti azok magyarázatát.</div>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+h(c.title)+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){
var c=CDATA.find(x=>x.id===id);if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+h(c.title)+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+h(s.t)+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');
}

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+h(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+h(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+h(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+h(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
</html>
