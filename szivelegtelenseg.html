        var lw = p2.toLowerCase();
        var k = DICT_KEYS.find(function(key){return key.toLowerCase()===lw;});

{sit:'A segélykocsi ETA (várható érkezési idő) 15 perc. A beteg a CPAP alatt javul, SpO2 felmegy 92%-ra. Mi a szállítási teendő?',opts:[{tx:'A helyszínen várom be a segélykocsit, bármi történik.',ok:false,fb:'Hibás.'},{tx:'A segélykocsi várható érkezési idejétől függően megfontolom a szállítás megkezdését (randevú).',ok:true,fb:'Helyes! Időnyerés céljából a randevú preferált, ha a beteg állapota engedi.'},{tx:'Lefújom a segélykocsit, mert javult az SpO2.',ok:false,fb:'Hibás. A beteg továbbra is kritikus HSZE beteg.'}]},
{sit:'A mozgatás (hordágyra tétel) után mi a kötelező lépés?',opts:[{tx:'Csak a mentőbe teszem és indulunk.',ok:false,fb:'Hibás.'},{tx:'Az ABCDE vizsgálatot automatikusan elölről megismétlem, a vérnyomást 3-5 percenként mérem, folyamatos EKG és SpO2 monitorozás mellett.',ok:true,fb:'Helyes! Betegmozgatás után az újraértékelés kötelező.'},{tx:'Megvárom, amíg beérünk a kórházba a mérésekkel.',ok:false,fb:'Hibás.'}]}
],summary:'Részletes Összefoglaló (Sim 1 - B kompetencia):\nA kiérkezéskor a légzési segédizmokat használó, verejtékes betegnél azonnal ABCDE vizsgálatot kezdtünk. Mivel ABC instabilitás állt fenn (súlyos nehézlégzés), B kompetenciájú egységként azonnal segélykocsit (ALS) kértünk. A beteget félülő helyzetbe pozicionáltuk, fizikai aktivitását tiltottuk. Az instabil állapot miatt már az első felmérés alatt 100% oxigént adtunk. A 32-es légzésszám és a <90% SpO2 miatt CPAP/NIV-t indítottunk. A vérnyomás magas (185/100) volt, de B kompetenciával (gyógyszerelés nélkül) nitrátot nem adhattunk. 12-elvezetéses EKG-t készítettünk a kiváltó ok (ACS/ritmuszavar) keresésére. A segélykocsi érkezési ideje alapján randevút egyeztettünk, a beteget kizárólag hordágyon mozgattuk, mely után az ABCDE vizsgálatot megismételtük, folyamatos monitorozás (SpO2, EKG, vérnyomás 3-5 percenként) mellett.'},

{id:2,title:'2. Szituáció: "Hideg és Nedves" / Shock gyanú (B)',diff:'B kompetencia',desc:'Éjszakai riasztás 75 éves hölgyhöz, aki nehezen lélegzik, zavart. B kompetenciaszint.',steps:[
{sit:'A helyszínen a néni az ágy szélén ül. Hűvös, verejtékes a bőre, zavart (AVPU: V). A lábszárán oedema látható. Mi az első teendő?',opts:[{tx:'Lefektetem és lábát felemelem (shock fektetés).',ok:false,fb:'Hibás! HSZE-ben a pangás miatt a lefektetés azonnali állapotromlást okoz.'},{tx:'ABCDE vizsgálat, megtartom az ülő/félülő helyzetet, azonnali segélykocsikérés (ALS).',ok:true,fb:'Helyes! Instabil, zavart beteg -> azonnali ALS hívás, ülő helyzet megtartása.'},{tx:'Azonnal vizet itatok vele.',ok:false,fb:'Hibás! Zavart beteg nem ihat (aspiráció).'}]},
{sit:'A beteg paraméterei: Légzésszám 28/perc. SpO2 85%. Milyen oxigénterápiát alkalmazol?',opts:[{tx:'Célzott oxigénterápia (orrkanül 2 l/min).',ok:false,fb:'Hibás. A beteg kritikus.'},{tx:'Kezdetben 100%-os oxigént maszkon.',ok:true,fb:'Helyes! Instabil, hypoxiás beteg 100% O2-t igényel azonnal.'},{tx:'Nem adok oxigént, mert CO2 retenciója lehet.',ok:false,fb:'Hibás. A hypoxia öl.'}]},
{sit:'A "C" vizsgálat eredménye: a radiális pulzus alig tapintható (frekvencia 120/min), CRT 4 mp. A vérnyomás 80/50 Hgmm. Milyen klinikai kategóriába sorolod az eljárásrend alapján?',opts:[{tx:'Meleg-Száraz',ok:false,fb:'Hibás.'},{tx:'Hideg-Nedves (hypoperfusio: hűvös bőr, zavart tudat, alacsony vérnyomás; pangás: oedema, nehézlégzés).',ok:true,fb:'Helyes! Ez a legsúlyosabb, cardiogen shockra utaló kategória.'},{tx:'Meleg-Nedves',ok:false,fb:'Hibás. A bőre hűvös és hypotensiv.'}]},
{sit:'B kompetenciájú mentőápolóként szabad-e vénát biztosítanod ennél a betegnél?',opts:[{tx:'Nem, B kompetencia sosem szúrhat vénát.',ok:false,fb:'Hibás.'},{tx:'Igen, B kompetencia kizárólag folyadékpótlás céljából (hypotonia, keringési elégtelenség esetén) biztosíthat vénát.',ok:true,fb:'Helyes! Mivel a vérnyomás 80/50, a vénabiztosítás indokolt.'},{tx:'Igen, de csak orvosi utasításra.',ok:false,fb:'Hibás. A protokoll felhatalmazza hipotenziónál.'}]},
{sit:'A vénát biztosítottad. Adsz-e 250 ml folyadékbolust azonnal?',opts:[{tx:'Igen, mert a vérnyomás 80 Hgmm.',ok:false,fb:'Hibás. Nem automatikus.'},{tx:'Nem, mert a beteg pang (oedema, nehézlégzés), a folyadékbolus csak "Száraz-hideg" betegnél, volumenhiány gyanúja esetén javasolt. Itt csak fenntartó cseppszám.',ok:true,fb:'Helyes! A pangó szívelégtelen beteget a bolus megölheti (tüdőoedema fokozódik).'},{tx:'Igen, 1000 ml-t adok azonnal.',ok:false,fb:'Hibás!'}]},
{sit:'A betegnek adsz gyógyszeres keringéstámogatást (Noradrenalin)?',opts:[{tx:'Igen, azonnal felszívom a perfúzorba.',ok:false,fb:'Hibás.'},{tx:'Nem, B kompetenciaszinten gyógyszer nem alkalmazható, ezt a segélykocsi (ALS) végzi el.',ok:true,fb:'Helyes! A keringéstámogatás ALS kompetencia.'},{tx:'Dopamint adok neki.',ok:false,fb:'Hibás. Dopamin adása az OMSZ-ben tilos.'}]},
{sit:'Mit tegyél a CPAP alkalmazásával kapcsolatban, ha a vérnyomás 80 Hgmm és a beteg zavart?',opts:[{tx:'Azonnal CPAP-ot teszek fel maximális PEEP-pel.',ok:false,fb:'Hibás. A CPAP csökkenti a vérnyomást (preload csökkenés), hypotensióban veszélyes lehet, pláne zavart betegnél.'},{tx:'Óvatosan mérlegelem/konzultálok, mert a pozitív nyomású lélegeztetést súlyosbíthatja a hypotensiót, és a zavart tudat (V) relatív kontraindikáció. Ballonos-maszkos asszisztálás jöhet szóba szükség esetén.',ok:true,fb:'Helyes! A CPAP hypotensióban veszélyes.'},{tx:'Inkább intubálom.',ok:false,fb:'Hibás. B kompetencia nem intubál.'}]},
{sit:'A 12-elvezetéses EKG-t elkészíted. Miért kritikus ez?',opts:[{tx:'Hogy legyen mit beadni a kórházban.',ok:false,fb:'Hibás.'},{tx:'Mert a cardiogen shock leggyakoribb kiváltó oka az Akut Coronaria Szindróma (ACS), amit keresni kell.',ok:true,fb:'Helyes! Az EKG a STEMI felismeréséhez azonnal kell.'},{tx:'B kompetenciánál nem kell EKG-t csinálni.',ok:false,fb:'Hibás.'}]},
{sit:'A segélykocsi (orvos) megérkezik, átveszi az ellátást. Hová javasolt a beteg szállítása cardiogen shock esetén?',opts:[{tx:'A legközelebbi krónikus belgyógyászatra.',ok:false,fb:'Hibás.'},{tx:'Törekedni kell olyan ellátóhelyre, ahol PCI folyamatosan elérhető, és a mechanikai keringéstámogatás lehetősége adott.',ok:true,fb:'Helyes! A protokoll ezt egyértelműen előírja.'},{tx:'A pszichiátriára a zavartság miatt.',ok:false,fb:'Hibás.'}]},
{sit:'Mire kell ügyelni a hordágyon történő szállítás közben (már az orvossal együtt)?',opts:[{tx:'A beteget vízszintesen kell fektetni a mentőben.',ok:false,fb:'Hibás. HSZE-ben ez fulladást okoz.'},{tx:'Továbbra is félülő helyzet, fizikai erőkifejtés mellőzése, folyamatos EKG és SpO2 monitorozás, RR 3-5 percenként.',ok:true,fb:'Helyes! A protokoll ezen szállítási szabályai végig érvényesek.'},{tx:'Nincs különösebb teendő, az orvos jelenléte elég.',ok:false,fb:'Hibás.'}]}
],summary:'Részletes Összefoglaló (Sim 2 - B kompetencia):\nA "Hideg-Nedves" profil (cardiogen shock) a legveszélyesebb forma. A zavart, hűvös bőrű, oedemás, nehézlégző betegnél az ABCDE rögzítette a hypoperfusiót (80/50 Hgmm RR, sápadtság) és a pangást. Azonnal segélykocsit kértünk, a beteget félülő helyzetben tartottuk (tilos a fektetés!). Vitálisan kritikus lévén 100% oxigént kapott. B kompetenciával a keringési elégtelenség miatt vénát biztosítottunk, de folyadékbolust (250 ml) nem adtunk, mivel a beteg "nedves" (pangó), a folyadék rontott volna a tüdején. Gyógyszert (noradrenalin) kompetencia hiányában nem alkalmaztunk. A CPAP-ot kerültük a hypotensio és a tudatzavar miatt. A 12-elvezetéses EKG-t elkészítettük ACS irányában. Az ALS megérkezése után a beteget olyan centrumba transzportáltuk, ahol PCI és mechanikus keringéstámogatás elérhető, végig félülő pozícióban és folyamatos (3-5 perces vérnyomás) monitorozással.'},

{id:3,title:'3. Szituáció: "Meleg és Száraz" / Enyhe dyspnoe (B)',diff:'B kompetencia',desc:'Mentésirányítás (ICS) vonalon vagy te veszed át a beteget. 55 éves férfi, mérsékelt nehézlégzés. B kompetencia.',steps:[
{sit:'A helyszínre érkezéskor a beteg az udvaron sétálgat, mert "így jobb". Mi az első határozott kérésed felé?',opts:[{tx:'"Nyugodtan sétáljon tovább, ha az segít.".',ok:false,fb:'Hibás. A fizikai erőkifejtés rontja az állapotot.'},{tx:'"Kérem, azonnal üljön le ide a székre, támassza meg a hátát, lógassa a lábát, és ne mozogjon/beszéljen!"',ok:true,fb:'Helyes! Pozícionálás és teljes nyugalom a protokoll első lépése.'},{tx:'"Feküdjön le a fűre.".',ok:false,fb:'Hibás. Fektetni tilos.'}]},
{sit:'A beteg leült. ABCDE vizsgálat következik. Légzése 22/perc, nem használ segédizmokat. Pulzoximéter: 96%. Milyen oxigénterápiát alkalmazol?',opts:[{tx:'10-15 literes maszkot teszek rá azonnal.',ok:false,fb:'Hibás. Stabil betegnél kerülni kell a hyperoxiát.'},{tx:'Mivel a beteg ABC stabil és az SpO2 96%, célzott oxigénterápia elvei alapján NEM adok oxigént (csak 90% alatt adandó).',ok:true,fb:'Helyes! Stabil betegnél a hyperoxia vasoconstrictiót okoz, káros lehet.'},{tx:'Orrszondán adok 2 litert a biztonság kedvéért.',ok:false,fb:'Hibás. 90% felett nem adunk.'}]},
{sit:'A vérnyomás 170/95 Hgmm. Bőr meleg, jól perfundált. Nincs látható oedema, tüdeje felett pangás egyelőre nem hallható ("Száraz-Meleg" / kompenzált profil, de magas RR). B kompetenciaként adsz Nitrát sprayt a 170-es vérnyomásra?',opts:[{tx:'Igen, mert a 160-as határ felett van.',ok:false,fb:'Hibás. B kompetencia NEM gyógyszerezhet.'},{tx:'Nem, mert B kompetenciaszinttel nem rendelkezem gyógyszerelési felhatalmazással. Ezt csak B+ szinttől lehet megtenni.',ok:true,fb:'Helyes! Csak B+ adhat Nitrátot.'},{tx:'Igen, beveszem a beteg sajátját.',ok:false,fb:'Hibás.'}]},
{sit:'Ha B+ lennél, mit kéne mindenképp megkérdezni a Nitrát adása ELŐTT a magas RR ellenére?',opts:[{tx:'Szed-e aszpirint?',ok:false,fb:'Hibás.'},{tx:'Szedett-e foszfodiészteráz-5 gátló gyógyszert (pl. Viagra, Cialis, Levitra) az elmúlt két napban? (Erectilis dysfunctio vagy pulm. hypertonia miatt).',ok:true,fb:'Helyes! Kötelező rákérdezni, mert abszolút ellenjavallat.'},{tx:'Van-e pacemaker-e?',ok:false,fb:'Hibás.'}]},
{sit:'A beteg stabil, oxigént nem igényel, CPAP nem indokolt (RR 22, SpO2 96%). Mi a teendő a Segélykocsi riasztásával kapcsolatban?',opts:[{tx:'Azonnal riasztom a rohamkocsit kékkel.',ok:false,fb:'Hibás. Túlreagálás stabil betegnél.'},{tx:'A mentőápolói folyamatábra alapján: Segélykocsi? -> ICS egyeztetés mellett transzport megfontolandó. Mivel a beteg stabil, TTEKG után konzultálok az irányítással a szállításról.',ok:true,fb:'Helyes! Stabil (≥90 RR, nincs légzési elégtelenség) betegnél ICS egyeztetés a teendő.'},{tx:'Otthon hagyom a beteget.',ok:false,fb:'Hibás. Kórházi kivizsgálás kell.'}]},
{sit:'Elkészíted a 12-elvezetéses EKG-t. B kompetenciaként mi a feladatod az EKG-val?',opts:[{tx:'Én állítom fel a kardiológiai diagnózist.',ok:false,fb:'Hibás. Ez orvosi feladat.'},{tx:'Elkészítem, és a telemetriás rendszeren / konzultáción keresztül értékelik a kiváltó ok (pl. ACS) kizárására.',ok:true,fb:'Helyes! A TTEKG a helyszíni diagnosztika elengedhetetlen része.'},{tx:'Nem csinálok EKG-t, ha stabil.',ok:false,fb:'Hibás.'}]},
{sit:'A szállítás mellett döntöttek. A beteg be akar gyalogolni a mentőautóba, mondván: "Már jól vagyok". Megengeded?',opts:[{tx:'Igen, ha a vérnyomása lement.',ok:false,fb:'Hibás.'},{tx:'Nem, a teljes prehospitális szakaszban el kell kerülni a fizikai erőkifejtést, mozgatása csak hordágy/ülőkocsi segítségével történhet!',ok:true,fb:'Helyes! A terhelés azonnali relapszust okozhat.'},{tx:'Igen, de csak lassan.',ok:false,fb:'Hibás.'}]},
{sit:'Milyen pozícióban szállítod a beteget?',opts:[{tx:'Lefektetve.',ok:false,fb:'Hibás.'},{tx:'Szigorúan ülő/félülő helyzetben, hátát megtámasztva.',ok:true,fb:'Helyes! A vénás visszaáramlás csökkentése (preload csökkentés) kulcsfontosságú.'},{tx:'Oldalfekvésben.',ok:false,fb:'Hibás.'}]},
{sit:'A szállítás során hogyan monitorozod a beteget?',opts:[{tx:'Csak megkérdezem 10 percenként, hogy van.',ok:false,fb:'Hibás.'},{tx:'Az EKG-t és az oxigénszaturációt folyamatosan monitorozom, a vérnyomást 3-5 percenként mérem.',ok:true,fb:'Helyes! Ez a HSZE szállítási standard.'},{tx:'A monitort kikapcsolom, hogy ne zavarja a beteget.',ok:false,fb:'Hibás.'}]},
{sit:'A kórházba érve hová kell átadni egy teljesen újkeletű, előzmény nélküli szívelégtelenség gyanúját mutató beteget?',opts:[{tx:'Sima belgyógyászatra.',ok:false,fb:'Hibás.'},{tx:'Mivel mindig felmerül a szívinfarktus lehetősége (kórjelző EKG eltérés hiányában is), PCI centrumnak (SBO/kardiológia) referálás/átadás szükséges.',ok:true,fb:'Helyes! Az új keletű HSZE mindig ACS gyanús.'},{tx:'A háziorvoshoz.',ok:false,fb:'Hibás.'}]}
],summary:'Részletes Összefoglaló (Sim 3 - B kompetencia):\nA beteg "Meleg-Száraz" (kompenzáltabb) paramétereket mutatott, de a magas vérnyomás és a nehézlégzés miatt azonnali nyugalomba helyeztük (félülő, megtámasztott hát). A fizikai erőkifejtést azonnal megtiltottuk. Mivel az SpO2 96% volt, a célzott oxigénterápia elve alapján nem adtunk O2-t a hyperoxia (vasoconstrictio) elkerülése végett. A 170-es szisztolés vérnyomás ellenére B kompetenciával (gyógyszeres engedély hiányában) Nitrátot nem adhattunk. Ha B+ lett volna az ellátó, kötelezően rákérdezett volna a PDE-5 gátlók (Viagra) szedésére. A beteg stabil állapota miatt a "Segélykocsi" hívása helyett 12-elvezetéses EKG-t (TTEKG) készítettünk, és az ICS-vel konzultáltunk a transzportról. A beteget szigorúan ülőkocsiban/hordágyon vittük a mentőhöz (sétálni tilos!). Szállítás alatt EKG, SpO2 folyamatos monitorozása és 3-5 percenkénti RR mérés történt. Mivel újkeletű volt a probléma, PCI centrumba vittük ACS gyanúja miatt.'},

{id:4,title:'4. Szituáció: Bizonytalan légzészavar (B)',diff:'B kompetencia',desc:'Riasztás egy 70 éves dohányzó férfihez akut nehézlégzés miatt. B kompetenciaszint.',steps:[
{sit:'A helyszín biztosítása után megközelíted a beteget. Milyen vizsgálattal indítasz?',opts:[{tx:'Tüdejének hallgatózása a ruha felett.',ok:false,fb:'Hibás.'},{tx:'Szisztematikus ABCDE vizsgálat (A: légút, B: légzés stb.).',ok:true,fb:'Helyes! Kritikus betegnél az ABCDE az első lépés.'},{tx:'Cukormérés.',ok:false,fb:'Hibás. Majd a D-nél.'}]},
{sit:'A "B" (Légzés) vizsgálat során a beteg kilégzése megnyúlt, a tüdők felett diffúz sípolást, búgást hallasz. Légzésszám: 28/perc. SpO2: 88%. A felesége szerint "sosem volt asztmás, de sokat köhög a cigi miatt". Mi az eljárásrendi direktíva a differenciáldiagnózisra?',opts:[{tx:'Egyértelmű COPD exacerbáció, asztma protokoll szerint kezelem.',ok:false,fb:'Hibás. Nem egyértelmű az anamnézis.'},{tx:'Bizonytalan esetben, főleg ha az anamnézisben nem egyértelmű az obstruktív tüdőbetegség, először heveny szívelégtelenségként (HSZE) kezeljük!',ok:true,fb:'Helyes! A HSZE (főleg kezdetben) utánozhatja az asztmát/COPD-t. Káros lehet, ha elnézzük.'},{tx:'Csak nyugtatót adok neki.',ok:false,fb:'Hibás.'}]},
{sit:'HSZE gyanúja esetén milyen pozícióba helyezed?',opts:[{tx:'Oldalfekvés.',ok:false,fb:'Hibás.'},{tx:'Félülő/ülő helyzetbe, hátát megtámasztva.',ok:true,fb:'Helyes! Pozícionálás (preload csökkentés) a legfontosabb fizikai beavatkozás.'},{tx:'Hanyattfekvés.',ok:false,fb:'Hibás.'}]},
{sit:'A beteg SpO2-je 88% oxigén nélkül. Instabilnak/kritikusnak tűnik a kifejezett nehézlégzés miatt. Mit lépsz O2 téren?',opts:[{tx:'Már az első állapotfelmérés alatt 100% oxigén adok maszkon.',ok:true,fb:'Helyes! Vitálisan kritikus betegnél nem finomkodunk a célzott O2-vel, 100% kell kezdetben.'},{tx:'2 l/min O2 orrszondán, mert hátha COPD-s és CO2-t retineál.',ok:false,fb:'Hibás. Az akut hypoxia megöli a beteget, a 100% O2 életmentő a kritikus fázisban.'},{tx:'Nem adok oxigént.',ok:false,fb:'Hibás.'}]},
{sit:'A beteg állapota a B-vizsgálat alapján instabil. Mit kérsz az irányítástól B kompetencia szintjén?',opts:[{tx:'Semmit, elintézem.',ok:false,fb:'Hibás.'},{tx:'Mivel HSZE gyanúja áll fenn és a beteg instabil, azonnali segélykocsi (ALS) riasztást kérek.',ok:true,fb:'Helyes! Magasabb szintű egység azonnali riasztása szükséges.'},{tx:'Megvárom, amíg a beteg kéri az orvost.',ok:false,fb:'Hibás.'}]},
{sit:'A "C" vizsgálat: Vérnyomás 165/95 Hgmm, pulzus 130/min arrhythmiás. Nincs hypoperfusio jele, meleg a bőre. Milyen párhuzamos diagnosztikát kell elvégezned?',opts:[{tx:'Csak egy 3 elvezetéses EKG-t nézek.',ok:false,fb:'Hibás.'},{tx:'Folyamatos pulzoximetria és vérnyomásmérés mellett 12-elvezetéses EKG-t (TTEKG) készítek a kiváltó ok (pl. Pitvarfibrilláció, ACS) azonosítására.',ok:true,fb:'Helyes! A 12 elvezetéses EKG elengedhetetlen a ritmuszavar és az ACS kizárására.'},{tx:'Koponyect-t kérek.',ok:false,fb:'Hibás.'}]},
{sit:'Az EKG alapján pitvarfibrillációja van 140-es kamrafrekvenciával. Mit teszel te B kompetenciával a ritmuszavarral?',opts:[{tx:'Azonnal intravénás béta-blokkolót adok.',ok:false,fb:'Hibás. Egyrészt B szinten nem adhatsz gyógyszert, másrészt a prehospitális béta-blokkoló adás HSZE-ben kerülendő.'},{tx:'Én nem avatkozom be gyógyszeresen (kompetencia határa). Az instabil ritmuszavar megoldása az ALS (segélykocsi) feladata lesz (akár elektromos cardioversio).',ok:true,fb:'Helyes! A ritmuszavar kezelése itt ALS feladat.'},{tx:'Amiodaront adok sublingualisan.',ok:false,fb:'Hibás.'}]},
{sit:'B kompetenciával indokolt-e vénát biztosítanod (165/95 RR)?',opts:[{tx:'Igen, kötelező.',ok:false,fb:'Hibás.'},{tx:'Nem. B kompetencia kizárólag hypotonia / folyadékpótlás céljából biztosíthat vénát. Magas vérnyomásnál nem.',ok:true,fb:'Helyes! A B szintű ápoló csak speciális esetben szúr vénát.'},{tx:'Igen, hogy vért vegyek.',ok:false,fb:'Hibás.'}]},
{sit:'A nehézlégzés fokozódik (RR: 34/min, SpO2 86% oxigénen). Melyik beavatkozást készíted elő / kezded meg?',opts:[{tx:'A CPAP/NIV (noninvazív lélegeztetés) azonnali megkezdését, mivel súlyos nehézlégzés és O2 mellett is <90% az SpO2.',ok:true,fb:'Helyes! A CPAP kritikus fontosságú és nem gyógyszeres beavatkozás.'},{tx:'Ballonos lélegeztetés relaxánssal.',ok:false,fb:'Hibás.'},{tx:'Lefektetem a beteget.',ok:false,fb:'Hibás.'}]},
{sit:'A segélykocsi megérkezik, a beteg állapota stabilizálódik a CPAP alatt. Mozgatásnál mi a fő szabály?',opts:[{tx:'Fizikai erőkifejtés szigorú kerülése, csak ülőkocsi/hordágy.',ok:true,fb:'Helyes! Mozgás tilos.'},{tx:'Segít bepakolni a csomagjait.',ok:false,fb:'Hibás.'},{tx:'Besétál.',ok:false,fb:'Hibás.'}]}
],summary:'Részletes Összefoglaló (Sim 4 - B kompetencia):\nA beteget diffúz sípolással és búgással (asztmát utánzó tünetekkel) találtuk, de egyértelmű obstruktív anamnézis hiányában a protokollt követve bizonytalan esetben HSZE-ként kezeltük. A beteget félülő helyzetbe pozicionáltuk és tiltottuk a mozgást. A vitálisan kritikus (SpO2 88%) állapot miatt rögtön 100% oxigént adtunk maszkon, és segélykocsit hívtunk. A 12-elvezetéses EKG pitvarfibrillációt mutatott ki (ami gyakori kiváltó oka a HSZE-nek). Mivel a vérnyomás 165 Hgmm volt, B kompetenciával (csak hypotonia esetén van engedély folyadékra) vénát nem biztosítottunk, és gyógyszert sem adtunk. Az O2 mellett is tartós hypoxia (<90%) és tachypnoe (34/min) miatt azonnal CPAP/NIV terápiát kezdtünk, ami a légzési munkát csökkentette az ALS megérkezéséig. A beteget szigorúan fizikai erőkifejtés nélkül, hordágyon szállítottuk a mentőhöz.'},

{id:5,title:'5. Szituáció: Hipertenzív Akut Szívelégtelenség (B+)',diff:'B+ kompetencia',desc:'72 éves nőbeteg heves fulladásra panaszkodik. Az anamnézisben hypertonia szerepel. B+ kompetenciaszint (gyógyszerelési felhatalmazással).',steps:[
{sit:'Helyszínre érkezéskor a beteg az ágy szélén ül, zihál, verejtékezik. Mi az elsődleges lépés?',opts:[{tx:'Azonnal Nitrát spray-t fújok a nyelve alá.',ok:false,fb:'Hibás. Vizsgálat és EKG nélkül tilos.'},{tx:'Helyszínbiztonság ellenőrzése, majd azonnali szisztematikus ABCDE vizsgálat kezdése.',ok:true,fb:'Helyes! Mindig az ABCDE az első lépés.'},{tx:'Lefektetem, hogy megmérjem a vérnyomását.',ok:false,fb:'Hibás. A fektetés tilos.'}]},
{sit:'A beteget az ágyba akarja fektetni a férje. Mit javasolsz?',opts:[{tx:'Igen, hagyjuk pihenni fekve.',ok:false,fb:'Hibás. Fektetés rontja a tüdőödémát.'},{tx:'Ülő/félülő helyzetet kell felvennie, a lábakat lógatva, szigorú fizikai nyugalommal.',ok:true,fb:'Helyes! A megfelelő pozicionálás a preload csökkentését szolgálja.'},{tx:'Sétáljon egyet a friss levegőn.',ok:false,fb:'Hibás. Szigorúan tilos a mozgás.'}]},
{sit:'A "B" vizsgálat: légzésszám 34/perc, SpO2 84%. Nehézlégzése súlyos. Milyen O2 terápiát alkalmazol az első felmérés alatt?',opts:[{tx:'100%-os belégzési oxigén koncentrációt biztosítok (rezervoáros maszkon át).',ok:true,fb:'Helyes! Instabil, vitálisan kritikus betegnél kezdetben 100% O2 javasolt.'},{tx:'Célzott oxigént adok orrszondán (2 l/perc).',ok:false,fb:'Hibás. Ez az állapot vitálisan kritikus.'},{tx:'Nem adok oxigént a hyperoxia veszélye miatt.',ok:false,fb:'Hibás. A hyperoxia kerülése stabil betegnél szempont.'}]},
{sit:'A beteg vitálisan instabil. Szükséges-e magasabb szintű segítséget hívni?',opts:[{tx:'Nem, B+ szinten minden gyógyszer rendelkezésre áll.',ok:false,fb:'Hibás. Nem adhatsz intravénás készítményeket és nem intubálhatsz.'},{tx:'Igen, ABC instabilitás miatt azonnali segélykocsi / ALS riasztás indokolt az ICS-n keresztül.',ok:true,fb:'Helyes! A súlyos tüdőödéma magasabb szintű ellátást igényelhet.'},{tx:'Csak ha a vérnyomása is leesik.',ok:false,fb:'Hibás. A légzési elégtelenség önmagában elég.'}]},
{sit:'A beteg SpO2-je 100% oxigén mellett is csak 88%. Milyen eszközös beavatkozást indítasz B+ szinten a gyógyszerelés előtt/alatt?',opts:[{tx:'Azonnal intubálom a beteget.',ok:false,fb:'Hibás. B+ szinten tilos intubálni.'},{tx:'A noninvazív lélegeztetést (CPAP/NIV) azonnal indokolt megkezdeni (RR>=30 és SpO2<90% O2 mellett).',ok:true,fb:'Helyes! A CPAP drámaian javítja a légzési munkát.'},{tx:'Semmit, várom a rohamkocsit.',ok:false,fb:'Hibás. A CPAP a BLS/B+ kompetencia része.'}]},
{sit:'A "C" vizsgálat során kiderül, hogy a vérnyomása 210/110 Hgmm. Bőr meleg, nedves. Biztosítasz-e vénát B+ kompetenciával ebben az esetben?',opts:[{tx:'Igen, intravénás Nitrát beadásához.',ok:false,fb:'Hibás. B+ nem ad iv. nitrátot perfúzorban.'},{tx:'Nem, mert az eljárásrend szerint B és B+ kompetenciával rendelkező mentőápoló KIZÁRÓLAG folyadékpótlás céljából (hypotonia, keringési elégtelenség esetén) biztosíthat vénát.',ok:true,fb:'Helyes! Hipertóniás betegnél az iv. kanülálás itt nem B+ kompetencia.'},{tx:'Igen, vérvételhez.',ok:false,fb:'Hibás.'}]},
{sit:'B+ kompetenciaként a magas vérnyomás miatt sublingualis Nitrát spray adását fontolgatod. Mi a KÖTELEZŐ diagnosztikai lépés a beadás ELŐTT?',opts:[{tx:'Semmi, azonnal fújhatom a spray-t.',ok:false,fb:'Hibás. A protokoll feltételekhez köti.'},{tx:'12-elvezetéses EKG (TTEKG) készítése és konzultáció az irányítással/orvossal.',ok:true,fb:'Helyes! A TTEKG és konzultáció alapfeltétele a Nitrát adásának B+ szinten.'},{tx:'Ultrahangos szívvizsgálat.',ok:false,fb:'Hibás. Prehospitálisan erre nincs mód B+ szinten.'}]},
{sit:'Az EKG elkészült, konzultáltál. Melyik gyógyszer szedésére KÖTELEZŐ rákérdezni a Nitrát adása előtt?',opts:[{tx:'Véralvadásgátlók.',ok:false,fb:'Hibás.'},{tx:'Foszfodiészteráz-5 gátlókra (pl. sildenafil/Viagra, tadalafil/Cialis, vardenafil/Levitra) melyet az elmúlt két napon belül vettek be.',ok:true,fb:'Helyes! Ez abszolút ellenjavallatot képez a súlyos vérnyomásesés veszélye miatt.'},{tx:'Aszpirinre.',ok:false,fb:'Hibás.'}]},
{sit:'A beteg nem szed PDE-5 gátlót, nincsenek kontraindikációk. A vérnyomása továbbra is 200/110 Hgmm. Hogyan adagolod a Nitrát spray-t B+ szinten?',opts:[{tx:'Két adagot fújok egyszerre, ismétlés nélkül.',ok:false,fb:'Hibás. Egyszerre csak egy adag adható.'},{tx:'Egyszerre egy adagot fújok, az ismétléssel 10 percet kell várni. Összesen max. 3 expozíció adható.',ok:true,fb:'Helyes! Ez a B+ kompetencia hivatalos adagolási rendje a HSZE protokoll szerint.'},{tx:'Folyamatosan fújom 2 percenként.',ok:false,fb:'Hibás. Túl gyors adagolás veszélyes.'}]},
{sit:'A segélykocsi megérkezik, de az orvos is a kórházba szállítást javasolja. Szállításra kerül a sor. Milyen szállítási elveket kell betartani?',opts:[{tx:'A beteg besétál a mentőbe, monitorozás csak a kocsiban indul.',ok:false,fb:'Hibás. A mozgás tilos.'},{tx:'Fizikai erőkifejtés teljes kerülése, mozgatás csak hordágyon/ülőkocsin. Folyamatos EKG és SpO2 monitorozás, vérnyomásmérés 3-5 percenként.',ok:true,fb:'Helyes! Ezek a HSZE szállítási kritériumai.'},{tx:'Vízszintesen fektetve szállítjuk a stabilitás miatt.',ok:false,fb:'Hibás. Fektetni továbbra is tilos.'}]}
],summary:'Részletes Összefoglaló (Sim 5 - B+ kompetencia):\nAz anamnézisében hypertoniás, 72 éves nőbeteget súlyos "Meleg és Nedves" (pangó, hypertoniás) tünetekkel találtuk. Első lépés a helyszínbiztonság és az ABCDE vizsgálat volt. A beteget szigorú nyugalomba, ülő helyzetbe, lógatott végtagokkal pozicionáltuk. A kritikus dyspnoe (SpO2 84%, RR 34) miatt rögtön 100% O2-t adtunk, és segélykocsit hívtunk. Mivel a hypoxia O2 mellett is fennállt, elkezdtük a CPAP/NIV noninvazív lélegeztetést. A 210/110 Hgmm vérnyomás ellenére B+ kompetenciával iv. vénát nem biztosíthattunk (mivel az csak hypotonia esetén engedélyezett). A magas vérnyomás csökkentése érdekében sublingualis Nitrátot terveztünk adni, melyhez először elkészítettük a 12-elvezetéses EKG-t és konzultáltunk. Miután kizártuk a kontraindikációkat (pl. PDE-5 gátlók szedése 2 napon belül), beadtunk 1 adag Nitrát spray-t (amelyet B+ szinten 10 percenként, max 3-szor ismételhettünk volna). A beteget az ALS megérkezése után ülőkocsin vittük a mentőhöz, folyamatos monitorozás és 3-5 percenkénti RR mérés mellett.'},

{id:6,title:'6. Szituáció: Újkeletű mellkasi fájdalom és fulladás (B+)',diff:'B+ kompetencia',desc:'58 éves férfi, hirtelen kezdődő nehézlégzés és mellkasi nyomásérzés. B+ kompetencia.',steps:[
{sit:'A helyszín biztonságos. A beteg az udvaron fel-alá sétál a fájdalomtól és a fulladástól. Mi az utasításod?',opts:[{tx:'Azonnal üljön le, lógassa a lábát, hátát támassza meg, ne mozogjon és ne beszéljen!',ok:true,fb:'Helyes! A preload csökkentése és a fizikai nyugalom elengedhetetlen.'},{tx:'Sétáljon csak, amíg megcsinálom a papírokat.',ok:false,fb:'Hibás. Mozgás tilos.'},{tx:'Feküdjön le a földre hanyatt.',ok:false,fb:'Hibás. A fektetés rontja a nehézlégzést.'}]},
{sit:'ABCDE vizsgálat. "B" (Légzés): RR 26/min, nem kritikus a dyspnoe. SpO2 93% szobalevegőn. Milyen O2 terápiát adsz?',opts:[{tx:'100% oxigén maszkon át.',ok:false,fb:'Hibás. Nem vitálisan instabil a légzése, és SpO2 >90%.'},{tx:'Mivel az ABC stabil és az SpO2 93%, célzott oxigénterápia alapján NEM adok oxigént a hyperoxia elkerülése végett.',ok:true,fb:'Helyes! Stabil betegnél oxigén csak 90% alatt adandó.'},{tx:'2 liter orrszondán a biztonság kedvéért.',ok:false,fb:'Hibás.'}]},
{sit:'A beteg egyszerre panaszkodik mellkasi fájdalomra és nehézlégzésre. Mi a legfontosabb eszközös diagnosztikai lépés a helyszínen?',opts:[{tx:'Csak egy gyors vérnyomásmérés.',ok:false,fb:'Hibás.'},{tx:'Vércukormérés.',ok:false,fb:'Hibás. Fontos, but itt van specifikusabb.'},{tx:'12-elvezetéses EKG (TTEKG) készítése a kiváltó ok (pl. Akut Coronaria Szindróma - ACS) azonnali azonosítására.',ok:true,fb:'Helyes! ACS a szívelégtelenség egyik leggyakoribb oka.'}]},
{sit:'C-keringés: Vérnyomás 170/95 Hgmm, pulzus 90/min. A betegnek sosem volt szívproblémája, ez teljesen újkeletű. Szükséges ALS/Segélykocsi riasztás?',opts:[{tx:'Mivel az EKG STEMI-t igazol (ACS gyanú), és újkeletű a szívelégtelenség, azonnali orvosi/mentőtiszti konzultáció, segélykocsi (ALS) riasztása szükséges.',ok:true,fb:'Helyes! A szövődményes infarctus azonnali magas szintű beavatkozást igényel.'},{tx:'Nem, B+ szinten bevihetem egyedül is lassan.',ok:false,fb:'Hibás. A beteg kritikus szövődmény-veszélyes.'},{tx:'Csak ha elveszti az eszméletét.',ok:false,fb:'Hibás.'}]},
{sit:'Az EKG anterolaterális STEMI-t mutat! A vérnyomás 170 Hgmm. B+ kompetenciával adhatsz-e sublingualis Nitrát spray-t a HSZE eljárásrend alapján?',opts:[{tx:'Igen, ha kizártam a kontraindikációkat (nincs jobb kamrai infarktus, nem szedett PDE-5 gátlót), és TTEKG konzultáció megtörtént, a >=160 Hgmm miatt adható.',ok:true,fb:'Helyes! B+ szinten, a feltételek megléte esetén adható 1 adag Nitrát.'},{tx:'Nem, STEMI-ben soha nem adható Nitrát.',ok:false,fb:'Hibás. Nincs ilyen általános tiltás, csak alsó fali/jobb kamrai érintettségnél.'},{tx:'Igen, kérdezés nélkül azonnal.',ok:false,fb:'Hibás. A PDE-5 gátlókra rá kell kérdezni.'}]},
{sit:'A Nitrát beadása után 8 perccel a beteg állapota hirtelen romlik, a vérnyomás leesik 105/60 Hgmm-re. B+ kompetenciaként letelt lassan a 10 perc. Ismétled a Nitrátot?',opts:[{tx:'Igen, mert a 10 perc letelt és max 3x adható.',ok:false,fb:'Hibás. Az ellenjavallatot figyelembe kell venni.'},{tx:'Nem! 110 Hgmm szisztolés vérnyomás alatt a Nitrát adása abszolút ellenjavallt.',ok:true,fb:'Helyes! A Nitrát ismétlése szigorúan tilos 110 Hgmm alatt.'},{tx:'Igen, de csak egy felet fújok.',ok:false,fb:'Hibás.'}]},
{sit:'A vérnyomásesés (105/60) miatt a beteg perifériás perfúziója romlik, bőre hűvössé válik. B+ kompetenciaként mit teszel a vénával kapcsolatban?',opts:[{tx:'Továbbra sem biztosítok vénát.',ok:false,fb:'Hibás. Már van indikáció.'},{tx:'Mivel hypotonia és keringési elégtelenség alakult ki, B+ kompetenciával vénát biztosítok (kizárólag folyadékpótlás céljából).',ok:true,fb:'Helyes! A hypotonia felhatalmaz a vénabiztosításra ezen a szinten.'},{tx:'Azonnal centrális vénát próbálok szúrni.',ok:false,fb:'Hibás. Ez nem B+ kompetencia.'}]},
{sit:'A vénát biztosítottad. Adsz-e a 105/60-as vérnyomásra azonnal 250 ml folyadékbolust a betegnek?',opts:[{tx:'Igen, mert alacsony a vérnyomás.',ok:false,fb:'Hibás. A beteg pang, a folyadék ronthat rajta.'},{tx:'Nem! Mivel a beteg pangó (HSZE tünetekkel bíró), a folyadékbolus csak "Száraz-hideg" betegnél, vagy erős volumenhiány gyanúja esetén javasolt. Itt csak fenntartó/nyitva tartó cseppszámban adom.',ok:true,fb:'Helyes! A tüdőödémás beteg folyadékterhelése végzetes lehet.'},{tx:'Igen, legalább 1000 ml-t nyomás alatt.',ok:false,fb:'Hibás. Szigorúan tilos.'}]},
{sit:'A vérnyomásesés miatt az SpO2 értéke szobalevegőn 88%-ra csökken. Mit változtatsz a légzéstámogatáson?',opts:[{tx:'Semmit, továbbra is hyperoxia kerülése a cél.',ok:false,fb:'Hibás. Már 90% alatt van.'},{tx:'Mivel az SpO2 90% alá csökkent, oxigénterápiát kezdek, hogy a szaturációt biztonságos szintre (90% fölé) emeljem.',ok:true,fb:'Helyes! A célzott O2 adása a 90% alatti tartományban kötelező.'},{tx:'Azonnal intubálom.',ok:false,fb:'Hibás.'}]},
{sit:'A segélykocsi megérkezik, orvossal stabilizálják. Hová kell szállítani ezt a teljesen újkeletű, HSZE-vel és STEMI-vel jelentkező beteget?',opts:[{tx:'Sima belgyógyászatra a legközelebbi kórházba.',ok:false,fb:'Hibás.'},{tx:'A legközelebbi tüdőgondozóba.',ok:false,fb:'Hibás.'},{tx:'Mindig felmerül a szívinfarktus lehetősége (itt EKG is igazolta), ezért PCI centrumnak történő referálás és oda szállítás szükséges.',ok:true,fb:'Helyes! Az ACS eljárásrend alapján az OMI (STEMI) primer PCI centrumba szállítandó.'}]}
],summary:'Részletes Összefoglaló (Sim 6 - B+ kompetencia):\nAz 58 éves férfi hirtelen fellépő újkeletű nehézlégzéssel és mellkasi fájdalommal küszködött, ezért a protokoll első lépéseként a fizikai mozgást tiltottuk, és a beteget nyugalomba (félülő helyzet) helyeztük. Kezdetben (SpO2 93%) nem igényelt oxigént. A tünetek miatt a helyszíni 12-elvezetéses EKG elvégzése azonnal megtörtént, ami STEMI-t igazolt, így ICS-n keresztül rögtön segélykocsit riasztottunk. B+ kompetenciával a 170/95 Hgmm vérnyomás és a kizárt kontraindikációk miatt 1 adag Nitrát spray-t adtunk. Később a beteg vérnyomása 105/60 Hgmm-re esett, így a Nitrát ismétlését a 110 Hgmm-es alsó határ miatt szigorúan mellőztük. A hypotonia kialakulásával B+ kompetenciánk alapján perifériás vénát biztosítottunk, de a beteg pangásos állapota (HSZE) miatt folyadékbolust (250ml) nem adtunk, nehogy rontsunk a tüdőödémán. Az SpO2 88%-ra csökkenésével célzott oxigénterápiát kezdtünk. A beteget a kiérkező ALS-el együttműködve PCI centrumba (haemodinamikai laborba) szállítottuk, folyamatos 3-5 perces vérnyomás és monitorozás mellett.'}
];

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+h(i)+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+h(i)+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+h(b.tx)+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+h(s.t)+'</div><div class="step-x">'+h(s.x)+'</div></div></div>').join('');
  if(b.tp==='matrix_table'){
    return '<div class="g2" style="margin-bottom:1rem">'+
    '<div style="background:#fff;color:#111;padding:1rem;border-radius:8px;text-align:center;border:2px solid #ccc;display:flex;flex-direction:column;justify-content:center"><div style="font-weight:700;font-size:16px;color:#666">MELEG-<br>SZÁRAZ</div><div style="font-size:11px;margin-top:5px">Pangás (-)<br>Hypoperfusio (-)</div></div>'+
    '<div style="background:#fbbf24;color:#111;padding:1rem;border-radius:8px;text-align:center;border:2px solid #f59e0b;display:flex;flex-direction:column;justify-content:center"><div style="font-weight:700;font-size:16px">MELEG-<br>NEDVES</div><div style="font-size:11px;margin-top:5px">Pangás (+)<br>Hypoperfusio (-)</div></div>'+
    '<div style="background:#60a5fa;color:#111;padding:1rem;border-radius:8px;text-align:center;border:2px solid #3b82f6;display:flex;flex-direction:column;justify-content:center"><div style="font-weight:700;font-size:16px">HIDEG-<br>SZÁRAZ</div><div style="font-size:11px;margin-top:5px">Pangás (-)<br>Hypoperfusio (+)</div></div>'+
    '<div style="background:#3b82f6;color:#fff;padding:1rem;border-radius:8px;text-align:center;border:2px solid #1d4ed8;display:flex;flex-direction:column;justify-content:center"><div style="font-weight:700;font-size:16px">HIDEG-<br>NEDVES</div><div style="font-size:11px;margin-top:5px;color:#bfdbfe">Pangás (+)<br>Hypoperfusio (+)</div></div>'+
    '</div>'+

'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+

step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function getMatrix(){

  if(CA.pangas==1 && CA.hypo==0) return {c:'MELEG-NEDVES', d:'Leggyakoribb: jól perfundált, de pangó', bg:'#fbbf24', col:'#111', bc:'#f59e0b'};
  if(CA.pangas==0 && CA.hypo==1) return {c:'HIDEG-SZÁRAZ', d:'Hypoperfundált, nem pangó', bg:'#60a5fa', col:'#111', bc:'#3b82f6'};
  return {c:'HIDEG-NEDVES', d:'Súlyos: Hypoperfundált és pangó (Shock)', bg:'#3b82f6', col:'#fff', bc:'#1d4ed8'};

function render(){

if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();

else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});

}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

window.setCalcTab=function(t){CA.tab=t;render();};
window.setC=function(key,val){CA[key]=val;render();};

window.setCS=function(v){
  CA.spo2=+v; 
  var el=document.getElementById('csp_v'); 
  if(el) el.textContent=v+' %'; 
  upO2();
};
window.setCR=function(v){
  CA.rr=+v; 
  var el=document.getElementById('crr_v'); 
  if(el) el.textContent=v+' /perc'; 
  upO2();
};

render();
</script>
</body>
