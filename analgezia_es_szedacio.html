<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;}
.app{max-width:680px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);}
/* NAV */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.nb{flex:1;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#14b8a6;}
.ni{font-size:16px;}
.nl{font-size:9px;color:#9ca3af;font-weight:400;}
.nb.act .nl{color:#14b8a6;font-weight:600;}
/* CONTENT */
.ct{padding:1rem;}
/* CARDS */
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}
/* ALERTS */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
.note{font-size:12px;color:#9ca3af;padding:.5rem .75rem;background:#262626;border-radius:8px;margin-bottom:.5rem;line-height:1.5;border:1px solid #333;}
.sub{font-size:13px;font-weight:600;color:#d1d5db;margin:.75rem 0 .35rem;}
ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.2rem;}
.kr{display:flex;gap:8px;align-items:flex-start;padding:.5rem .75rem;background:#064e3b20;border-radius:8px;margin-bottom:5px;font-size:13px;color:#d1d5db;line-height:1.5;border-left:3px solid #14b8a6;}
/* TABLES */
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:5px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:5px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;line-height:1.4;}
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}
/* BUTTONS */
.btn{padding:.55rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;transition:all .15s;}
.btn:hover{background:#374151;}
.btn-g{background:#0d9488;color:#fff;border-color:#0d9488;}
.btn-g:hover{background:#0f766e;}
.btn-r{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn-fw{width:100%;display:block;text-align:center;padding:.75rem;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;text-align:center;}
/* PROGRESS */
.prog{height:4px;background:#333;border-radius:2px;margin-bottom:1rem;}
.progb{height:4px;border-radius:2px;transition:width .3s;}
/* QUIZ/SIM OPTIONS */
.opt{width:100%;display:block;padding:.7rem 1rem;margin-bottom:7px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}
/* FLIP CARD */
.flip{border:2px solid #3f3f3f;border-radius:12px;padding:1.5rem;min-height:175px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:.75rem;background:#262626;}
.flip.on{border-color:#a78bfa;}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
/* INPUTS */
input[type=range], input[type=number]{width:100%;accent-color:#14b8a6;background:transparent;border:1px solid #4b5563;border-radius:8px;padding:8px;color:#e5e7eb;font-family:inherit;background:#2a2a2a;}
input[type=range]{padding:0;border:none;height:20px;}
select{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #4b5563;background:#2a2a2a;font-size:13px;color:#e5e7eb;font-family:inherit;}
/* TAGS */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.tag-g{background:#064e3b;color:#ecfdf5;}
.tag-y{background:#78350f;color:#fef3c7;}
/* MODAL GLOSSARY */
.gl{color:#2dd4bf;text-decoration:underline;text-decoration-style:dashed;cursor:pointer;}
.gl:hover{color:#14b8a6;}
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal-box{background:#1e1e1e;border:1px solid #3f3f3f;border-radius:12px;padding:1.5rem;width:100%;max-width:400px;box-shadow:0 4px 15px rgba(0,0,0,0.5);}
.modal-title{font-size:18px;font-weight:700;color:#14b8a6;margin-bottom:10px;}
.modal-desc{font-size:14px;color:#d1d5db;line-height:1.6;margin-bottom:15px;}
/* HOME GRID */
.home-mod{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;color:#e5e7eb;}
.home-mod:hover{background:#333;border-color:#4b5563;transform:translateY(-1px);}
.home-mod-icon{font-size:26px;margin-bottom:6px;}
.home-mod-title{font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:2px;}
.home-mod-desc{font-size:11px;color:#9ca3af;}
/* CHAPTER LIST */
.ch-row{display:flex;align-items:center;gap:10px;background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.75rem 1rem;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.ch-row:hover{background:#333;}
@media(max-width:480px){.tbl-wrap table{min-width:340px;}}
</style>

{sit:'A Metamizol alkalmazása előtt mit kell feltétlenül tisztázni (SAMPLE - A)?',opts:[{tx:'Utolsó étkezés időpontját.',ok:false,fb:'Hibás! Ez a műtétnél fontos, nem a Metamizol adásának feltétele.'},{tx:'A pirazolon-származékokkal/NSAID-okkal szembeni allergiát, vagy asztmás anamnézist.',ok:true,fb:'Helyes! Az anafilaxiás sokk vagy NSAID-okozta asztma abszolút kontraindikáció.'},{tx:'Van-e pacemaker a betegben.',ok:false,fb:'Hibás! Nincs köze a Metamizolhoz.'}]},
{sit:'A beteg nem allergiás semmire. Mekkora a Metamizol intravénás dózisa egy 80 kg-os felnőttnél az eljárásrend szerint?',opts:[{tx:'5-10 mg/kg, tehát 400-800 mg.',ok:false,fb:'Hibás! Az ajánlott dózis ennél magasabb.'},{tx:'10-15 mg/kg (legfeljebb 1000 mg egyszerre), tehát maximum 1 ampulla (1000 mg/2 ml).',ok:true,fb:'Helyes! A protokoll 10-15 mg/kg dózist ír, max 1 g egyszeri iv. bolusban.'},{tx:'Fixen 2000 mg iv.',ok:false,fb:'Hibás! A napi max magasabb lehet, de egyszerre 1000 mg a maximum prehospitálisan.'}]},
{sit:'A Metamizol (algopyrin) beadásának mi a legnagyobb akut hemodinamikai (keringési) veszélye?',opts:[{tx:'Magas vérnyomást (hypertonia) okoz.',ok:false,fb:'Hibás! Pont az ellenkezője.'},{tx:'Vérnyomásesést (hypotensio) és sokkot okozhat.',ok:true,fb:'Helyes! Ezért az adagolásra szigorú szabályok vonatkoznak.'},{tx:'Végzetes szívritmuszavart generál.',ok:false,fb:'Hibás! Nem jellemző a Metamizolra önmagában.'}]},
{sit:'A vérnyomásesés elkerülése érdekében HOGYAN kell beadni a Metamizolt az eljárásrend alapján?',opts:[{tx:'Ülő helyzetben, nagyon gyors bolusban.',ok:false,fb:'Hibás! Ez biztosítaná a vérnyomásesést.'},{tx:'Fekvő testhelyzetben lévő betegnek, lassan (500 mg/perc), ehhez az ampulla hígítható.',ok:true,fb:'Helyes! Fekvő testhelyzet, max 500mg/perc lassú adagolás, javasolt hígítás.'},{tx:'Csak izomba (im.) szabad adni.',ok:false,fb:'Hibás! Im. adható, de a helyszínen az iv. preferált a gyors hatás miatt.'}]},
{sit:'B+ kompetenciaszinten mi a teendőd az iv. adagoláshoz?',opts:[{tx:'Orvost kell hívni a véna szúrásához.',ok:false,fb:'Hibás! B+ ápoló vénát biztosíthat.'},{tx:'Perifériás vénabiztosítást (iv. kanül) végzek, majd ezen keresztül beadom.',ok:true,fb:'Helyes! A vénabiztosítás része a B+ kompetenciának.'},{tx:'Inkább itatom meg vele az ampullát.',ok:false,fb:'Hibás! Az iv. forma per os használata itt nem javallt (késleltetett hatás).'}]},
{sit:'A Metamizol lassan lefolyt. Tíz perc múlva a beteg fájdalma még mindig 7-es (NRS), és továbbra is görcsöl. B+ kompetenciaszinten adhatsz-e Morfint vagy Spasmolytikumot?',opts:[{tx:'Igen, B+ szinten minden fájdalomcsillapítót adhatok.',ok:false,fb:'Hibás! A Morfin CDE szintű.'},{tx:'Nem, B+ szinten a kábító fájdalomcsillapítók (major analgetikumok) és görcsoldók (ha nincsenek a felsorolásban) nem adhatóak, magasabb szint (ALS/CDE) segítsége szükséges.',ok:true,fb:'Helyes! B+ szinten az ASA, Metamizol, Ibuprofen és N2O a fájdalomcsillapító paletta.'},{tx:'Igen, de csak orvosi engedéllyel rádión.',ok:false,fb:'Hibás! Nincs ilyen rádiós kivétel a kompetenciamátrixban.'}]},

{sit:'A kialakult opioid okozta légzésdepresszió (apnoe) esetén mi az első fizikai (eszköz nélküli/egyszerű) beavatkozás?',opts:[{tx:'Rögtön RSI (intubáció) kezdése.',ok:false,fb:'Hibás! Az intubációt meg kell előznie az oxigenizációnak és antidotum próbának.'},{tx:'Légútbiztosítás, majd átmeneti ballonos-maszkos lélegeztetés négykezes technikával oxigénnel, esetleg fájdalominger alkalmazása.',ok:true,fb:'Helyes! A légzési elégtelenség azonnali teendője az eszközös lélegeztetés (BLS).'},{tx:'Mellkasi kompresszió.',ok:false,fb:'Hibás! Még van keringése (remélhetőleg). LÉGZÉS hiányzik.'}]},
{sit:'Az orvos kéri, hogy készíts elő Naloxont az opioid hatás felfüggesztéséhez. Mi az irányadó dozírozás a protokoll szerint?',opts:[{tx:'Egyszerre 2 mg azonnali iv. bolusban.',ok:false,fb:'Hibás! Heves elvonást és szimpatikus rohamot provokálna.'},{tx:'A túladagolás súlyosságától függően, felnőttnél fokozatosan, 0,4-0,8 mg-ot (0,1 mg-onként adagolva 2-3 percenként a hatás függvényében).',ok:true,fb:'Helyes! A fokozatosság elve (0,1 mg-onként) kritikus a heves szimpatikus válasz elkerülése érdekében.'},{tx:'10-15 mg/kg iv.',ok:false,fb:'Hibás! Ez a Metamizol dózisa.'}]}
],summary:'Összefoglaló (Sim 2 - B+ kompetencia): Az ABCDE stabilitás után a görcsös hasi fájdalmat panaszoló felnőttnél (NRS 8) B+ szintű ápolóként Metamizol-nátrium iv. adása mellett döntöttünk, miután az allergiát (NSAID) kizártuk. Az iv. dózis 10-15 mg/kg volt, a keringési szövődmények (hypotensio) megelőzése érdekében a beteget lefektettük, a gyógyszert hígítva, lassan adagoltuk a behelyezett vénás kanülön át. Mivel a fájdalom nem múlt, tisztában voltunk vele, hogy a kábító fájdalomcsillapítók (Morfin, Fentanil) CDE (orvos/tiszt) szintűek, így ALS egységet kértünk. Az ALS megérkezése után a Fentanil beadását követő légzésdepresszió (apnoe) kialakulásakor azonnali ballonos-maszkos lélegeztetést alkalmaztunk. Szükség esetén Naloxont készítettünk elő, figyelve a fokozatos adagolásra (0,4-0,8 mg összdózis, 0,1 mg-onként titrálva), hogy elkerüljük a hirtelen fellépő káros szimpatoadrenális hatást.'},

{sit:'A 3 mg Midazolamot (0,6 ml) befújtad az orrnyílásokba. Mit mond az eljárásrend az ismétlésről B+ mentőápoló esetén, ha a görcs 5 perc múlva sem szűnik?',opts:[{tx:'Megismétlem ugyanazt a dózist.',ok:false,fb:'Hibás!'},{tx:'Mentőápoló a midazolámot NEM ismételheti még ismétlődő/nem szűnő görcsroham esetén sem. ALS-t kell hívni.',ok:true,fb:'Helyes! A protokoll kifejezetten megtiltja az ismétlést a mentőápolónak.'},{tx:'Intravénásan próbálom beadni a következőt.',ok:false,fb:'Hibás! B+ iv. midazolamot nem adhat, pláne nem ismételve.'}]},
{sit:'A görcs a Midazolam hatására oldódik, a gyermek mélyen szedálttá (RASS -4) válik. Mi a Midazolam legnagyobb azonnali veszélye (mellékhatása), amit monitoroznod kell?',opts:[{tx:'Malignus hyperthermia.',ok:false,fb:'Hibás! Ritka szövődmény altatószereknél (pl. suxamethonium), nem a midazolamra jellemző.'},{tx:'Légzésdepresszió és légútvesztés (főleg magasabb dózis, vagy görcs utáni posztiktális állapottal kombinálva).',ok:true,fb:'Helyes! Benzodiazepinek légzést deprimálnak, a légút és a légzés (SpO2, EtCO2, frekvencia) szigorú megfigyelése kell.'},{tx:'Tachycardia.',ok:false,fb:'Hibás! A midazolam inkáb enyhe hypotenziót okoz, nem kifejezett tachycardiát.'}]},
{sit:'Az "E" vizsgálatnál a gyermek tympanicus testhőmérséklete 39,5 °C. Lázcsillapítás céljából Ibuprofen végbélkúpot alkalmazol. A gyermek 3 éves. Mi a megfelelő adagolás az eljárásrend alapján?',opts:[{tx:'NEM adható.',ok:false,fb:'Hibás! Csak 3 hónap VAGY 6 kg alatt nem adható.'},{tx:'2 kúp (2 x 60 mg = 120 mg).',ok:true,fb:'Helyes! 2 év (kb. 12,5 kg) felett: 2 kúp a dózis.'},{tx:'1 kúp (60 mg).',ok:false,fb:'Hibás! Ez a 3 hónap - 2 év közötti korosztály dózisa.'}]},

{sit:'Mivel a gyermek mélyen aluszékony (RASS -3 vagy -4), mi a kötelező teendőd a légútbiztosítás terén a helyszínen és szállítás alatt?',opts:[{tx:'Azonnal intubálni kell.',ok:false,fb:'Hibás! Nincs RSI indikáció, ha a légzés elegendő és a légút pozicionálással tartható.'},{tx:'A garatképletek tónusvesztése miatt pozicionálás (pl. fej kíméletes hátrahajtása, stabil oldalfekvés vagy eszméletlen helyzet) és folyamatos felügyelet.',ok:true,fb:'Helyes! Mély szedációban a légút beavatkozást igényelhet (pozicionálás, sz.e. leszívás, eszméletlen fektetés).'},{tx:'Elegendő egy párna a feje alá.',ok:false,fb:'Hibás! Ez rontja a légút átjárhatóságát (flexió).'}]},

],summary:'Összefoglaló (Sim 3 - B+ kompetencia): A generalizált görcsöt mutató 3 éves (15 kg) gyermeknél B+ kompetenciaszintű ápolóként, mivel a görcs központi idegrendszeri eredetű volt, Midazolamot alkalmaztunk intranasalisan (MAD eszközzel). A dózist pontosan kiszámoltuk (0,2 mg/kg -> 3 mg), és az ampullát hígítatlanul adagoltuk a minimális térfogat elérése érdekében. Az eljárásrend alapján ismertük a szabályt: B+ szinten a midazolam NEM ismételhető, így ALS-t kértünk. A "D" vizsgálat során elvárt görcsoldás és mély szedáció (RASS -4) kialakulásakor folyamatosan vizsgáltuk a légutakat és légzésdepressziót kerestünk, felkészülve a ballonos-maszkos lélegeztetésre. A lázcsillapításra (39,5°C) 2 db Ibuprofen 60 mg-os végbélkúpot adtunk, mivel a gyermek 2 évesnél idősebb (és >12,5 kg) volt.'}
];

function setCat(c){FC.cat=c;FC.idx=0;FC.flip=false;render();}
function flipCard(){FC.flip=!FC.flip;render();}
function navCard(dir){
  var f = FC.cat==='Összes'?CARDS:CARDS.filter(x=>x.cat===FC.cat);
  FC.idx = (FC.idx + dir + f.length)%f.length;
  FC.flip = false;
  render();
}

function pickQ(i){
  if(QZ.sel!==null)return;
  QZ.sel=i;
  var ok=i===QUIZ[QZ.idx].ok;
  if(ok)QZ.score++;
  QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});
  render();
}
function nextQ(){
  if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else{QZ.done=true;}
  render();
}
function resetQuiz(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();}

function startSim(id){SI={id:id,step:0,chosen:null,hist:[],fin:false};render();}
function chooseSim(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();}
function nextSim(){
  var sim=SIMS.find(s=>s.id===SI.id);
  if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else{SI.fin=true;}
  render();
}
function resetSim(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();}

// Calculators
function setCalcTab(t){CA.tab=t;render();}

function calcFlacc(){
  var tot = CA.face + CA.legs + CA.act + CA.cry + CA.cons;
  var lvl = tot===0?'Nincs fájdalom':tot<=3?'Enyhe fájdalom':tot<=7?'Közepes fájdalom':'Súlyos fájdalom';
  var col = tot===0?'#4ade80':tot<=3?'#fde68a':tot<=7?'#fb923c':'#fca5a5';
  var bg = tot===0?'#064e3b':tot<=3?'#451a03':tot<=7?'#7c2d12':'#450a0a';
  return {t:tot, l:lvl, c:col, b:bg};
}

function setF(id,v){CA[id]=+v; upF();}
function upF(){
  var r = calcFlacc();
  var e = document.getElementById('flacc_res');
  if(e) {
    e.style.background = r.b; e.style.borderColor = r.c+'40';
    e.innerHTML = '<div style="font-size:36px;font-weight:700;color:'+r.c+'">'+r.t+'</div><div style="font-size:15px;font-weight:700;color:'+r.c+'">'+r.l+'</div>';
  }
}

function calcRass(){
  var r = CA.rass;
  var l = r==4?'Hadakozó':r==3?'Nagyon zavart':r==2?'Zavart':r==1?'Nyugtalan':r==0?'Éber, nyugodt':r==-1?'Aluszékony':r==-2?'Enyhén szedált':r==-3?'Közepesen szedált':r==-4?'Mélyen szedált':'Ébreszthetetlen';
  var c = r==0?'#4ade80':r>0?'#fca5a5':'#a78bfa';
  var b = r==0?'#064e3b':r>0?'#450a0a':'#2e1065';
  return {t:r, l:l, c:c, b:b};
}

// Fix for stuttering slider: we directly update the result box instead of full render()
function setR(v){CA.rass=+v; upR();}
function upR(){
  var r = calcRass();
  var e = document.getElementById('rass_res');
  if(e) {
    e.style.background = r.b; e.style.borderColor = r.c+'40';
    e.innerHTML = '<div style="font-size:42px;font-weight:700;color:'+r.c+'">'+(r.t>0?'+'+r.t:r.t)+'</div><div style="font-size:16px;font-weight:700;color:'+r.c+'">'+r.l+'</div>';
  }
}

function renderCalc(){
  function tb(id,l){return '<button onclick="setCalcTab(\''+id+'\')" style="flex:1;padding:.5rem;border:1px solid '+(CA.tab===id?'#14b8a6':'#3f3f3f')+';border-radius:8px;background:'+(CA.tab===id?'#14b8a6':'#2a2a2a')+';color:'+(CA.tab===id?'#111827':'#d1d5db')+';cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">'+l+'</button>';}
  function sel(lb,id,opts,val){return '<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">'+lb+'</div><select onchange="setF(\''+id+'\',this.value)">'+opts.map(o=>'<option value="'+o[0]+'" '+(o[0]==val?'selected':'')+'>'+o[0]+' - '+h(o[1])+'</option>').join('')+'</select></div>';}
  
  var html = '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
  '<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tb('flacc','FLACC (Csecsemő/Gyermek)')+tb('rass','RASS (Szedáció)')+'</div>';
  
  if(CA.tab==='flacc'){
    var f=calcFlacc();
    html += '<div class="card" style="margin-bottom:.5rem;font-size:12px;color:#9ca3af;padding:.75rem">Csecsemőkortól 3 éves korig használatos fájdalomskála.</div>'+
    sel('Arc (Face)','face',[[0,'Különösebb arckifejezés nélkül'],[1,'Időnként fintorog, szemöldökét ráncolja'],[2,'Gyakran remeg az álla, fogát összeszorítja']], CA.face)+
    sel('Lábak (Legs)','legs',[[0,'Szokásos / ellazult'],[1,'Nyugtalan, megfeszített'],[2,'Felhúzza a lábait, rúgkapál']], CA.legs)+
    sel('Aktivitás (Activity)','act',[[0,'Szokásos testhelyzet, csendben fekszik'],[1,'Vonaglik, előre-hátra dölöngél'],[2,'Merev vagy vonaglik']], CA.act)+
    sel('Sírás (Cry)','cry',[[0,'Nincs sírás'],[1,'Nyögdécsel, alkalmanként panaszkodik'],[2,'Folyamatos sírás, sikítás, zokogás']], CA.cry)+
    sel('Vigasztalhatóság (Consolability)','cons',[[0,'Elégedett, nyugodt'],[1,'Érintés/beszéd megnyugtatja'],[2,'Nehezen nyugtatható/vigasztalható']], CA.cons)+
    '<div id="flacc_res" style="border-radius:12px;padding:1rem;text-align:center;margin-top:1rem;background:'+f.b+';border:1px solid '+f.c+'40"><div style="font-size:36px;font-weight:700;color:'+f.c+'">'+f.t+'</div><div style="font-size:15px;font-weight:700;color:'+f.c+'">'+f.l+'</div></div>';
  } else {
    var r=calcRass();
    html += '<div class="card" style="margin-bottom:.5rem;font-size:12px;color:#9ca3af;padding:.75rem">Richmond Agitation-Sedation Skála a nyugtalanság és a szedált állapot megítélésére.</div>'+
    '<input type="range" min="-5" max="4" step="1" value="'+CA.rass+'" oninput="setR(this.value)" style="margin:1rem 0">'+
    '<div id="rass_res" style="border-radius:12px;padding:1rem;text-align:center;margin-top:.5rem;background:'+r.b+';border:1px solid '+r.c+'40"><div style="font-size:42px;font-weight:700;color:'+r.c+'">'+(r.t>0?'+'+r.t:r.t)+'</div><div style="font-size:16px;font-weight:700;color:'+r.c+'">'+r.l+'</div></div>';
  }
  return html;
}

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>'; // allow html inside
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+i+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx.replace(/\n/g,'<br>')+'</div>';
  if(b.tp==='ftable'){
    var lc={d:'#fca5a5',w:'#fde68a',s:'#4ade80'};
    return '<div class="tbl-wrap"><table class="tbl"><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:700;color:'+lc[r.lv]+';width:30px;text-align:center">'+h(r.s)+'</td><td style="color:#e5e7eb">'+h(r.m)+'</td></tr>').join('')+'</tbody></table></div>';
  }
  return '';
}

function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Analgézia és Szedáció</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v4.0 · 2026.01.28.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Tananyag','Módszerek, gyógyszerek'],['flash','🃏','Flashkártyák','Gyors ismétlés'],['quiz','❓','Kvíz','Tudásellenőrzés'],['sim','🚑','Szimuláció','B / B+ esetek'],['calc','🧮','Kalkulátorok','FLACC, RASS']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af"><b>Vonatkozik:</b> Az OMSZ valamennyi kivonuló dolgozójára (gyógyszerelés tekintetében a kompetenciaszintnek megfelelően).</div></div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Tananyag</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+h(c.title)+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){
var c=CDATA.find(x=>x.id===id);if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+h(c.title)+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+h(s.t)+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');
}

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+h(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+h(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+h(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+h(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek (B / B+)</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Részletes Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// Global actions
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.xpl=function(w){
  var d=GLOSSARY[w]||'Nincs definíció ehhez a szóhoz az eljárásrendben.';
  document.getElementById('glTitle').innerText=w;
  document.getElementById('glDesc').innerText=d;
  document.getElementById('glModal').style.display='flex';
};
window.closeGl=function(){
  document.getElementById('glModal').style.display='none';
};

render();
</script>
</body>
</html>
