<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ – Eszközelhelyezési Szabvány és Szimulátor</title>
<style>
/* ALAPBEÁLLÍTÁSOK */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;line-height:1.5;}
.app{max-width:680px;margin:0 auto;background:#18181b;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.5);position:relative;display:flex;flex-direction:column;}

/* NAVIGÁCIÓ */
.nav{display:flex;background:#27272a;border-bottom:1px solid #3f3f46;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.nb{flex:1;padding:10px 4px 8px;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .2s ease;}
.nb.act{border-bottom-color:#14b8a6;background:#14b8a610;}
.ni{font-size:18px;}
.nl{font-size:10px;color:#a1a1aa;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
.nb.act .nl{color:#14b8a6;font-weight:700;}

/* TARTALOM */
.ct{padding:1.25rem 1rem;flex:1;}

/* KÁRTYÁK ÉS ÁLTALÁNOS ELEMEK */
.card{background:#27272a;border:1px solid #3f3f46;border-radius:12px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 2px 4px rgba(0,0,0,.1);}
.note{font-size:13px;color:#a1a1aa;padding:.75rem 1rem;background:#1f1f22;border-radius:8px;margin-bottom:.75rem;border-left:3px solid #3b82f6;}
.page-title{font-size:20px;font-weight:800;color:#f4f4f5;margin-bottom:.25rem;}
.page-desc{font-size:13px;color:#9ca3af;margin-bottom:1.25rem;}

/* ESZKÖZÖK (PROTOCOL) DESIGN JAVÍTÁS */
.cat-card{background:#27272a;border:1px solid #3f3f46;border-radius:12px;margin-bottom:1rem;overflow:hidden;}
.cat-header{background:#1f1f22;padding:12px 16px;border-bottom:1px solid #3f3f46;font-weight:700;color:#14b8a6;font-size:15px;display:flex;align-items:center;gap:8px;}
.tool-list{display:flex;flex-direction:column;}
.tool-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #3f3f46;transition:background 0.2s;}
.tool-item:last-child{border-bottom:none;}
.tool-item:hover{background:#3f3f4640;}
.tool-info{flex:1;padding-right:12px;}
.tool-loc{font-size:11px;color:#9ca3af;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
.tool-name{font-size:14px;font-weight:600;color:#e5e7eb;line-height:1.4;}
.tool-qty{font-size:12px;font-weight:700;background:#0891b220;color:#22d3ee;border:1px solid #0891b240;padding:4px 10px;border-radius:20px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,0.2);}

/* SZIMULÁCIÓ DESIGN JAVÍTÁS */
.sim-card{background:#27272a;border:1px solid #3f3f46;border-radius:12px;padding:1rem;margin-bottom:1rem;cursor:pointer;transition:transform 0.1s, border-color 0.2s;display:block;width:100%;text-align:left;}
.sim-card:hover{border-color:#14b8a6;transform:translateY(-2px);}
.sim-title{font-size:15px;font-weight:700;color:#f4f4f5;margin-bottom:6px;}
.sim-desc{font-size:12px;color:#a1a1aa;margin-bottom:10px;line-height:1.5;}
.sim-badge{display:inline-block;background:#064e3b;color:#34d399;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;}

/* SZIMULÁCIÓ AKTÍV ÁLLAPOT */
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;}
.q-title{font-size:14px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:0.5px;}
.q-counter{font-size:13px;font-weight:700;color:#14b8a6;background:#14b8a620;padding:3px 10px;border-radius:12px;}
.prog{height:6px;background:#3f3f46;border-radius:3px;margin-bottom:1.25rem;overflow:hidden;}
.progb{height:100%;background:#14b8a6;transition:width 0.4s cubic-bezier(0.4, 0, 0.2, 1);border-radius:3px;}

.q-box{background:#1f1f22;border-left:4px solid #14b8a6;padding:1.25rem;border-radius:0 12px 12px 0;margin-bottom:1.25rem;}
.q-text{font-size:16px;font-weight:600;color:#f4f4f5;line-height:1.5;}

.opt-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;}
.opt{width:100%;display:flex;align-items:flex-start;padding:14px 16px;border:2px solid #3f3f46;border-radius:12px;cursor:pointer;text-align:left;font-size:14px;color:#d1d5db;background:#27272a;transition:all 0.2s ease;line-height:1.4;}
.opt:hover:not(.opt-disabled){background:#3f3f46;border-color:#52525b;}
.opt-ok{background:#064e3b20!important;border-color:#10b981!important;color:#34d399!important;box-shadow:0 0 10px rgba(16, 185, 129, 0.1);}
.opt-no{background:#7f1d1d20!important;border-color:#ef4444!important;color:#f87171!important;}
.opt-disabled{opacity:0.4;cursor:default!important;}

.fb-box{padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.5;margin-bottom:1.5rem;animation:fadeIn 0.3s ease;}
.fb-ok{background:#064e3b;color:#a7f3d0;border:1px solid #059669;}
.fb-no{background:#7f1d1d;color:#fecaca;border:1px solid #b91c1c;}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* SZIMULÁCIÓ EREDMÉNY */
.res-hero{background:linear-gradient(135deg, #0f766e 0%, #064e3b 100%);border-radius:16px;padding:2rem 1rem;text-align:center;margin-bottom:1.5rem;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
.res-score{font-size:48px;font-weight:800;color:#fff;line-height:1;}
.res-label{font-size:14px;color:#a7f3d0;font-weight:600;margin-top:8px;text-transform:uppercase;letter-spacing:1px;}
.res-summary{background:#27272a;border:1px solid #3f3f46;padding:1rem;border-radius:12px;font-size:14px;line-height:1.6;color:#d1d5db;margin-bottom:1.5rem;}
.hist-item{background:#1f1f22;border:1px solid #3f3f46;border-radius:10px;padding:12px;margin-bottom:10px;}
.hist-q{font-size:13px;font-weight:600;color:#e5e7eb;margin-bottom:6px;}
.hist-a{font-size:12px;padding:6px 10px;border-radius:6px;background:#27272a;margin-bottom:6px;}
.hist-a.correct{border-left:3px solid #10b981;color:#a7f3d0;}
.hist-a.wrong{border-left:3px solid #ef4444;color:#fecaca;}

/* GOMBOK */
.btn{padding:14px 20px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center;}
.btn-primary{background:#14b8a6;color:#111827;width:100%;box-shadow:0 4px 10px rgba(20, 184, 166, 0.3);}
.btn-primary:hover{background:#0d9488;transform:translateY(-1px);}

/* KALKULÁTOROK */
.calc-input-group{margin-bottom:15px;}
.calc-label{display:block;margin-bottom:6px;font-size:12px;color:#a1a1aa;font-weight:600;text-transform:uppercase;}
input[type=number], select{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #3f3f46;background:#1f1f22;font-size:15px;color:#f4f4f5;font-family:inherit;transition:border-color 0.2s;}
input[type=number]:focus, select:focus{outline:none;border-color:#14b8a6;}
.res-box{border-radius:12px;padding:1.25rem;text-align:center;margin-top:1rem;}
.res-num{font-size:28px;font-weight:800;letter-spacing:1px;}
.res-lbl{font-size:12px;margin-bottom:.25rem;color:#a1a1aa;text-transform:uppercase;font-weight:600;}

/* FŐOLDAL GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;}
.home-mod{background:#27272a;border:1px solid #3f3f46;border-radius:16px;padding:1.25rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .2s;}
.home-mod:hover{background:#3f3f46;border-color:#52525b;transform:translateY(-2px);}
.home-mod-icon{font-size:32px;margin-bottom:10px;}
.home-mod-title{font-size:16px;font-weight:700;color:#f4f4f5;margin-bottom:4px;}
.home-mod-desc{font-size:12px;color:#a1a1aa;line-height:1.4;}

/* SZÓTÁR (GLOSSARY) */
.gloss{color:#2dd4bf;text-decoration:underline;text-decoration-style:dashed;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;font-weight:600;transition:color 0.2s;}
.gloss:hover{color:#5eead4;}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(3px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity 0.2s ease;}
.modal-overlay.active{opacity:1;pointer-events:auto;}
.modal-box{background:#18181b;border:1px solid #3f3f46;border-radius:16px;padding:1.5rem;max-width:400px;width:100%;position:relative;box-shadow:0 10px 40px rgba(0,0,0,0.5);transform:scale(0.95) translateY(10px);transition:all 0.2s ease;}
.modal-overlay.active .modal-box{transform:scale(1) translateY(0);}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#a1a1aa;font-size:28px;line-height:1;cursor:pointer;transition:color 0.2s;}
.modal-close:hover{color:#f4f4f5;}
.modal-title{font-size:18px;font-weight:800;color:#2dd4bf;margin-bottom:12px;padding-right:20px;}
.modal-body{font-size:14px;color:#d1d5db;line-height:1.6;}
</style>
</head>

let SCR = 'home';
let SI = { id: null, step: 0, chosen: null, hist: [], fin: false };

function go(page) {
  SCR = page;
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('act'));
  
  if (page === 'home') {
    document.getElementById('nav').children[0].classList.add('act');
    document.getElementById('ct').innerHTML = renderHome();
  } else if (page === 'protocol') {
    document.getElementById('nav').children[1].classList.add('act');
    document.getElementById('ct').innerHTML = renderProtocol();
  } else if (page === 'sim') {
    document.getElementById('nav').children[2].classList.add('act');
    document.getElementById('ct').innerHTML = renderSims();
  } else if (page === 'calc') {
    document.getElementById('nav').children[3].classList.add('act');
    document.getElementById('ct').innerHTML = renderCalc();
    calcDrops();
    calcInv();
  }
  window.scrollTo(0,0);
}

// HTML escape és Szótár alkalmazása szövegen
function h(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function applyGlossary(escapedText) {
  let parts = escapedText.split(/(<[^>]*>)/);
  for(let i = 0; i < parts.length; i++) {
    if(parts[i].startsWith('<')) continue;
    let str = parts[i];
    const keys = Object.keys(GLOSSARY).sort((a,b)=>b.length - a.length);
    for(let term of keys) {
      let regex = new RegExp('(?<=^|[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ])(' + term + ')(?=[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]|$)', 'gi');
      str = str.replace(regex, '<span class="gloss" onclick="event.stopPropagation(); showGl(\'' + term + '\')">$1</span>');
    }
    parts[i] = str;
  }
  return parts.join('');
}

function t(str) { return applyGlossary(h(str)); }

function showGl(term) {
  const desc = GLOSSARY[term];
  if(!desc) return;
  document.getElementById('m-title').textContent = term;
  document.getElementById('m-body').textContent = desc;
  document.getElementById('modal').classList.add('active');
}

function hideGl() {
  document.getElementById('modal').classList.remove('active');
}

window.startSim = function(id) {
  SI = { id: id, step: 0, chosen: null, hist: [], fin: false };

function renderActiveSim() {
  let sim = SIMS.find(s => s.id === SI.id);
  
  if(SI.fin) {
    let correct = SI.hist.filter(h => sim.steps[h.step].opts[h.oi].ok).length;
    let pct = Math.round((correct / sim.steps.length) * 100);
    return `
      <div class="res-hero">
        <div class="res-score">${correct}/${sim.steps.length}</div>
        <div class="res-label">Helyes eszközhasználat (${pct}%)</div>
      </div>
      <h3 style="font-size:16px;color:#f4f4f5;margin-bottom:10px">Eset Összefoglaló</h3>
      <div class="res-summary">${t(sim.summary)}</div>
      
      <h3 style="font-size:16px;color:#f4f4f5;margin-bottom:10px;margin-top:20px">Lépések áttekintése</h3>
      ${SI.hist.map((hh, i) => {
        let st = sim.steps[hh.step];
        let opt = st.opts[hh.oi];
        return `<div class="hist-item">
                  <div class="hist-q">${i+1}. ${t(st.sit)}</div>
                  <div class="hist-a ${opt.ok ? 'correct' : 'wrong'}">${opt.ok ? '✓' : '✗'} ${t(opt.tx)}</div>
                  <div style="font-size:11px;color:#9ca3af;margin-top:4px">${t(opt.fb)}</div>
                </div>`;
      }).join('')}
      <button class="btn btn-primary" onclick="SI.id=null;go('sim')" style="margin-top:15px">Vissza az esetekhez</button>
    `;
  }
  
  let step = sim.steps[SI.step];
  let progPct = ((SI.step) / sim.steps.length) * 100;
  
  let htm = `
    <div class="q-header">
      <div class="q-title">${h(sim.title)}</div>
      <div class="q-counter">${SI.step+1} / ${sim.steps.length}</div>
    </div>
    <div class="prog"><div class="progb" style="width:${progPct}%"></div></div>
    
    <div class="q-box">
      <div class="q-text">${t(step.sit)}</div>
    </div>
    
    <div class="opt-list">
  `;
  
  step.opts.forEach((opt, i) => {
    let cls = 'opt';
    let disabled = '';
    if(SI.chosen !== null) {
      if(opt.ok) cls += ' opt-ok';
      else if(i === SI.chosen && !opt.ok) cls += ' opt-no';
      else { cls += ' opt-disabled'; disabled = 'disabled'; }
    }
    htm += `<button class="${cls}" ${SI.chosen === null ? `onclick="chooseSim(${i})"` : disabled}>
              <span style="flex:1">${t(opt.tx)}</span>
            </button>`;
  });
  
  htm += `</div>`;
  
  if(SI.chosen !== null) {
    let selOpt = step.opts[SI.chosen];
    htm += `
      <div class="fb-box ${selOpt.ok ? 'fb-ok' : 'fb-no'}">
        <strong>${selOpt.ok ? 'Helyes válasz!' : 'Helytelen!'}</strong><br>${t(selOpt.fb)}
      </div>
      <button class="btn btn-primary" onclick="nextSim()">
        ${SI.step < sim.steps.length - 1 ? 'Következő kérdés →' : 'Eredmény megtekintése'}
      </button>
    `;
  }
  
  return htm;
}

window.chooseSim = function(idx) {
  if(SI.chosen !== null) return;
  SI.chosen = idx;
  SI.hist.push({ step: SI.step, oi: idx });
  go('sim');
};

window.nextSim = function() {
  SI.step++;
  SI.chosen = null;
  if(SI.step >= SIMS.find(s => s.id === SI.id).steps.length) {
    SI.fin = true;
  }
  go('sim');
};

  let v = parseFloat(document.getElementById('c-vol').value) || 0;
  let t = parseFloat(document.getElementById('c-time').value) || 1;
  let d = parseFloat(document.getElementById('c-drop').value) || 20;
  let res = Math.round((v * d) / t);
  document.getElementById('c-res').textContent = res + ' csepp/perc';
};

window.calcInv = function() {
  let req = parseInt(document.getElementById('inv-sel').value) || 0;
  let cur = parseInt(document.getElementById('inv-curr').value) || 0;
  let diff = req - cur;
  let box = document.getElementById('inv-res-box');
  let txt = document.getElementById('inv-res');
  
  if(diff > 0) {
    box.style.background = '#7f1d1d20'; box.style.borderColor = '#ef444450'; box.style.borderWidth = '1px'; box.style.borderStyle = 'solid';
    txt.style.color = '#fca5a5'; txt.textContent = diff + ' db (Hiány)';
  } else if(diff < 0) {
    box.style.background = '#b4530920'; box.style.borderColor = '#f59e0b50'; box.style.borderWidth = '1px'; box.style.borderStyle = 'solid';
    txt.style.color = '#fcd34d'; txt.textContent = 'Többlet: ' + Math.abs(diff) + ' db';
  } else {
    box.style.background = '#064e3b20'; box.style.borderColor = '#10b98150'; box.style.borderWidth = '1px'; box.style.borderStyle = 'solid';
    txt.style.color = '#6ee7b7'; txt.textContent = 'Készlet rendben (0 db)';
  }
};

// Alkalmazás indítása
window.onload = function() { go('home'); };
</script>
