<!DOCTYPE html>
<html lang="hu">
<head>

<title>OMSZ – Minimum Felszerelés</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
--bg:#0f1117;--bg2:#181c27;--bg3:#1e2336;
--border:#2a2f45;--border2:#363c58;
--text:#e8eaf0;--text2:#9ba3bf;--text3:#6b7280;
--acc:#3b82f6;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px;}
.app{max-width:680px;margin:0 auto;background:var(--bg);min-height:100vh;}
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.4);}
.nb{flex:1;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#60a5fa;}
.ni{font-size:15px;}
.nl{font-size:9px;color:var(--text3);font-weight:400;}
.nb.act .nl{color:#60a5fa;font-weight:600;}
.ct{padding:1rem;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:var(--text);}
.card-btn:hover{background:var(--bg3);}
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#2d1515;color:#fca5a5;border:1px solid #7f1d1d;}
.al-w{background:#2d2008;color:#fcd34d;border:1px solid #78350f;}
.al-i{background:#0f1f3d;color:#93c5fd;border:1px solid #1e3a6e;}
.al-s{background:#0f2d1a;color:#86efac;border:1px solid #166534;}
.note{font-size:12px;color:var(--text2);padding:.5rem .75rem;background:var(--bg3);border-radius:8px;margin-bottom:.5rem;line-height:1.5;border:1px solid var(--border);}
.sub{font-size:13px;font-weight:600;color:var(--text2);margin:.75rem 0 .35rem;}
ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:var(--text);line-height:1.65;margin-bottom:.2rem;}
.kr{display:flex;gap:8px;align-items:flex-start;padding:.5rem .75rem;background:#0f1f3d;border-radius:8px;margin-bottom:5px;font-size:13px;color:#93c5fd;line-height:1.5;border-left:3px solid #3b82f6;}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:5px 8px;text-align:left;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--bg3);}
table.tbl td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text2);}
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}
.prog{height:4px;background:var(--border2);border-radius:2px;margin-bottom:1rem;}
.progb{height:4px;border-radius:2px;transition:width .3s;}
.btn{padding:.55rem 1rem;border:1px solid var(--border2);border-radius:8px;background:var(--bg3);cursor:pointer;font-size:13px;color:var(--text);font-family:inherit;transition:all .15s;}
.btn:hover{background:var(--border);}
.btn-b{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}
.btn-b:hover{background:#1e40af;}
.btn-r{background:#dc2626;color:#fff;border-color:#dc2626;}
.btn-v{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.btn-g{background:#16a34a;color:#fff;border-color:#16a34a;}
.btn-fw{width:100%;display:block;text-align:center;padding:.75rem;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;text-align:center;}
.opt{width:100%;display:block;padding:.7rem 1rem;margin-bottom:7px;border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:var(--text);background:var(--bg2);font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:var(--bg3);}
.opt-ok{background:#0f2d1a!important;border-color:#166534!important;color:#86efac!important;cursor:default!important;}
.opt-no{background:#2d1515!important;border-color:#7f1d1d!important;color:#fca5a5!important;cursor:default!important;}
.flip{border:2px solid var(--border2);border-radius:12px;padding:1.5rem;min-height:175px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:.75rem;background:var(--bg2);}
.flip.on{border-color:#7c3aed;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.res-box{border-radius:12px;padding:1rem;text-align:center;margin-top:.75rem;}
.res-num{font-size:42px;font-weight:700;}
.res-lbl{font-size:14px;margin:.3rem 0;}
.ch-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:background .15s;color:var(--text);}
.ch-row:hover{background:var(--bg3);}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.tag-b{background:#1e3a6e;color:#93c5fd;}
.tag-y{background:#2d2008;color:#fcd34d;}
.tag-r{background:#2d1515;color:#fca5a5;}
.tag-g{background:#0f2d1a;color:#86efac;}
/* CHECKLIST */
.cl-item{display:flex;align-items:flex-start;gap:10px;padding:.5rem .75rem;border-radius:8px;margin-bottom:4px;cursor:pointer;transition:background .15s;}
.cl-item:hover{background:var(--bg3);}
.cl-item.checked{background:#0f2d1a;}
.cl-box{flex-shrink:0;width:20px;height:20px;border-radius:4px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .2s;color:transparent;}
.cl-box.on{background:#16a34a;border-color:#16a34a;color:#fff;}
.cl-txt{font-size:13px;color:var(--text);line-height:1.5;}
.cl-txt.on{text-decoration:line-through;color:var(--text3);}
.cl-qty{font-size:11px;color:var(--text3);margin-left:auto;flex-shrink:0;padding-left:6px;}
.star{color:#fbbf24;font-size:11px;}
/* DRUG TABLE */
.drug-row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.drug-name{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.drug-dose{font-size:11px;color:var(--text2);text-align:right;flex-shrink:0;}
/* DICTIONARY MODAL */
.dict-w{color:#60a5fa;text-decoration:underline dotted;cursor:pointer;font-weight:600;transition:color .15s;}
.dict-w:hover{color:#93c5fd;}
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-bg.show{opacity:1;pointer-events:all;}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;width:100%;max-width:400px;box-shadow:0 10px 25px rgba(0,0,0,0.5);transform:translateY(20px);transition:transform .2s;}
.modal-bg.show .modal-box{transform:translateY(0);}
.m-title{font-size:16px;font-weight:700;color:#60a5fa;margin-bottom:8px;}
.m-desc{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:1rem;}
</style>
</head>

// ── HELPERS ───────────────────────────────────────────────────────
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function h_d(s){
  let out = h(s);
  let words = DICT.map((x, i) => ({w: x.w, i: i})).sort((a,b) => b.w.length - a.w.length);
  words.forEach(item => {
    let reg = new RegExp('\\b(' + item.w.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + ')\\b', 'gi');
    out = out.replace(reg, function(m, p1, offset, str) {
      let before = str.substring(0, offset);
      let open = (before.match(/<span/g) || []).length;
      let close = (before.match(/<\/span>/g) || []).length;
      if (open > close) return m;
      return '<span class="dict-w" onclick="event.stopPropagation(); showDict(' + item.i + ')">' + m + '</span>';
    });
  });
  return out;
}

function renderBlock(b){
if(b.tp==='al')return '<div class="al al-'+b.lv+'">'+h_d(b.tx)+'</div>';
if(b.tp==='note')return '<div class="note">'+h_d(b.tx)+'</div>';
if(b.tp==='sub')return '<div class="sub">'+h_d(b.tx)+'</div>';
if(b.tp==='bl')return '<ul class="bl">'+b.items.map(i=>'<li>'+h_d(i)+'</li>').join('')+'</ul>';
if(b.tp==='kr')return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+h_d(i)+'</div>').join('')+'</div>';
if(b.tp==='ftable2'){
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Eszköz / Gyógyszer</th><th style="text-align:right;white-space:nowrap">Mennyiség</th></tr></thead><tbody>'+
  b.rows.map(r=>'<tr><td>'+h_d(r[0])+'</td><td style="text-align:right;color:#60a5fa;font-weight:600;white-space:nowrap">'+h_d(r[1])+'</td></tr>').join('')+
  '</tbody></table></div>';
}
return '';
}

// ── SCREENS ───────────────────────────────────────────────────────
function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:21px;font-weight:700;color:#e8eaf0;margin-bottom:4px;line-height:1.2">Minimum Felszerelés</h1>'+
'<div style="font-size:13px;color:#6b7280">A beteg feltalálási helyére juttatandó felszerelés · v3.0 · 2019.05.21.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Tananyag','10 fejezet, teljes tartalom'],['check','✅','Ellenőrzőlista','Interaktív táskák'],['flash','🃏','Flashkártyák','30 forgatható kártya'],['quiz','❓','Kvíz','20 kérdés visszajelzéssel'],['drugs','💊','Gyógyszer lista','Összes gyógyszer táskánként']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" style="background:#181c27;border:1px solid #2a2f45;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s" onmouseover="this.style.background=\'#1e2336\'" onmouseout="this.style.background=\'#181c27\'"><div style="font-size:24px;margin-bottom:6px">'+ic+'</div><div style="font-size:14px;font-weight:600;color:#e8eaf0;margin-bottom:2px">'+h_d(lb)+'</div><div style="font-size:11px;color:#6b7280">'+h_d(d)+'</div></button>').join('')+
'</div>'+
'<div class="al al-i">Szerzők: Toldi Ferenc, Dr. Kocsis Tibor · Jóváhagyta: Dr. Csató Gábor, Dr. Pápai György · Vonatkozik: Az OMSZ valamennyi kivonuló dolgozójára, kompetenciaszintnek megfelelően.</div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem">Tananyag</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')"><div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'30;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div><div style="flex:1"><div style="font-size:14px;font-weight:600;color:#e8eaf0">'+h_d(c.title)+'</div><div style="font-size:11px;color:#6b7280">'+c.secs.length+' szakasz</div></div><div style="color:#6b7280;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){
var c=CDATA.find(x=>x.id===id);if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#60a5fa;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'30;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div><h2 style="font-size:17px;font-weight:700;color:#e8eaf0;margin:0">'+h_d(c.title)+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #2a2f45">'+h_d(s.t)+'</h3>'+s.bk.map(b=>renderBlock(b)).join('')+'</div>').join('');
}

function renderCheck(){
var bags=[
{id:'abcd',name:'Mentőhátizsák (ABCD)',color:'#16a34a',icon:'🟢',unit:'BLS'},
{id:'aed',name:'AED',color:'#dc2626',icon:'⚡',unit:'BLS'},
{id:'abtaska',name:'AB-táska',color:'#dc2626',icon:'🔴',unit:'ALS'},
{id:'cdtaska',name:'CD-táska',color:'#1d4ed8',icon:'🔵',unit:'ALS'},
{id:'defib',name:'Defibrillátor-Monitor',color:'#dc2626',icon:'❤',unit:'ALS'},
{id:'trauma',name:'Trauma Táska',color:'#d97706',icon:'🟡',unit:'ALS'}
];
if(!CL.bag){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.5rem">Ellenőrzőlista</h2>'+
'<div class="note" style="margin-bottom:.75rem">Válassz egy táskát az interaktív ellenőrzőlista megnyitásához.</div>'+
bags.map(b=>{
var bag=BAGS[b.id];
var total=bag.cats.reduce((s,c)=>s+c.items.length,0);
var checked=Object.keys(CL.checked).filter(k=>k.startsWith(b.id+':')).length;
var pct=total?Math.round(checked/total*100):0;
return '<button class="card-btn" onclick="setBag(\''+b.id+'\')">'+
'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
'<div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">'+b.icon+'</span><div style="font-size:14px;font-weight:600;color:#e8eaf0">'+h_d(b.name)+'</div></div>'+
'<span class="tag '+(b.unit==='BLS'?'tag-g':'tag-b')+'">'+b.unit+'</span></div>'+
'<div style="font-size:11px;color:#6b7280;margin-bottom:6px">'+total+' eszköz · '+checked+' ellenőrizve</div>'+
'<div style="height:4px;background:#2a2f45;border-radius:2px"><div style="height:4px;border-radius:2px;background:'+b.color+';width:'+pct+'%"></div></div>'+
'</button>';}).join('');
}
var bag=BAGS[CL.bag];
var binfo=bags.find(b=>b.id===CL.bag);
var total=bag.cats.reduce((s,c)=>s+c.items.length,0);
var checked=Object.keys(CL.checked).filter(k=>k.startsWith(CL.bag+':')).length;
return '<button onclick="setBag(null)" style="background:none;border:none;cursor:pointer;color:#60a5fa;font-size:14px;margin-bottom:.65rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">'+
'<div style="font-size:16px;font-weight:700;color:#e8eaf0">'+h_d(bag.name)+'</div>'+
'<div style="font-size:13px;color:#60a5fa;font-weight:600">'+checked+' / '+total+'</div></div>'+
'<div class="prog"><div class="progb" style="width:'+(total?Math.round(checked/total*100):0)+'%;background:'+binfo.color+'"></div></div>'+
bag.cats.map(cat=>{
var catChecked=cat.items.filter((it,i)=>CL.checked[CL.bag+':'+cat.cat+':'+i]).length;
return '<div class="card"><div style="font-size:13px;font-weight:700;color:#9ba3bf;margin-bottom:.5rem;display:flex;justify-content:space-between">'+h_d(cat.cat)+'<span style="font-size:11px;color:#6b7280">'+catChecked+'/'+cat.items.length+'</span></div>'+
cat.items.map((it,i)=>{
var key=CL.bag+':'+cat.cat+':'+i;
var on=!!CL.checked[key];
return '<div class="cl-item'+(on?' checked':'')+'" onclick="toggleCheck(\''+key.replace(/'/g,"\\'")+'\')" >'+
'<div class="cl-box'+(on?' on':'')+'">'+( on?'✓':'')+'</div>'+
'<div class="cl-txt'+(on?' on':'')+'">'+h_d(it.n)+(it.star?'<span class="star"> *</span>':'')+'</div>'+
'<div class="cl-qty">'+h(it.q)+'</div></div>';
}).join('')+'</div>';}).join('')+
'<button class="btn btn-r btn-fw" style="margin-top:.5rem" onclick="resetBag()">Visszaállítás</button>';
}

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#3b82f6':'#2a2f45')+';background:'+(FC.cat===c?'#3b82f6':'#1e2336')+';color:'+(FC.cat===c?'#fff':'#9ba3bf')+';cursor:pointer;font-family:inherit">'+h_d(c)+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#6b7280;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+'</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#a78bfa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#e8eaf0;line-height:1.7;text-align:left;white-space:pre-line">'+h_d(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h_d(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#e8eaf0;line-height:1.5">'+h_d(card.f)+'</div>'+
'<div style="font-size:11px;color:#6b7280;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="event.stopPropagation(); navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="event.stopPropagation(); flipCard()">Fordít</button><button class="btn btn-fw" onclick="event.stopPropagation(); navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#0f2d1a':'#2d2008')+';border:1px solid '+(good?'#166534':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#86efac':'#fcd34d')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#86efac':'#fcd34d')+'">'+pct+'% – '+(good?'Kiváló!':'Ismételd át a felszerelési listákat!')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#e8eaf0">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#e8eaf0;margin-bottom:4px">'+h_d(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válaszod: '+h_d(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#86efac;margin-bottom:5px">✓ Helyes: '+h_d(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ba3bf">'+h_d(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény!</div>')+
'<button class="btn btn-b btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#e8eaf0">Kvíz</h2><span style="font-size:12px;color:#6b7280">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#3b82f6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem"><p style="font-size:15px;font-weight:600;color:#e8eaf0;line-height:1.5;margin:0">'+h_d(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+h_d(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h_d(q.exp)+'</div><button class="btn btn-b btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderDrugs(){
var tabs=[{id:'mentohatizsak',label:'Mentőhátizsák'},{id:'abtaska',label:'AB-táska (RSI)'},{id:'cdtaska',label:'CD-táska'}];
var cur=window._dtab||'mentohatizsak';
var d=DRUGDATA[cur];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem">Gyógyszer referencia</h2>'+
'<div style="display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap">'+tabs.map(t=>'<button onclick="setDrugTab(\''+t.id+'\')" style="padding:.4rem .7rem;border:1px solid '+(cur===t.id?d.color:'#2a2f45')+';border-radius:8px;background:'+(cur===t.id?d.color:'#1e2336')+';color:'+(cur===t.id?'#fff':'#9ba3bf')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+t.label+'</button>').join('')+'</div>'+
'<div class="card"><div style="font-size:13px;font-weight:700;color:'+d.color+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #2a2f45">'+h_d(d.name)+' – '+d.drugs.length+' gyógyszer</div>'+
d.drugs.map(([name,dose,qty])=>'<div class="drug-row"><div class="drug-name">'+h_d(name)+'</div><div class="drug-dose"><span style="color:#6b7280">'+h_d(dose)+'</span> &nbsp;<span style="font-weight:700;color:'+d.color+'">'+h_d(qty)+'</span></div></div>').join('')+'</div>';
}

function render(keepScroll){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='check')c.innerHTML=renderCheck();
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='drugs')c.innerHTML=renderDrugs();
var tabs=['home','chapters','check','flash','quiz','drugs'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
if(!keepScroll) window.scrollTo(0,0);
}

// ── ACTIONS ───────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render(true);};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render(true);};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render(true);};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.setBag=function(id){CL.bag=id;render();};
window.toggleCheck=function(key){if(CL.checked[key])delete CL.checked[key];else CL.checked[key]=true;render(true);};
window.resetBag=function(){var prefix=CL.bag+':';Object.keys(CL.checked).filter(k=>k.startsWith(prefix)).forEach(k=>delete CL.checked[k]);render();};
window.setDrugTab=function(t){window._dtab=t;render(true);};

window.showDict=function(i){
  document.getElementById('dict-t').innerText=DICT[i].w;
  document.getElementById('dict-d').innerText=DICT[i].d;
  document.getElementById('dict-mod').classList.add('show');
};
window.hideDict=function(e){
  if(e && e.target.id!=='dict-mod' && !e.target.classList.contains('btn')) return;
  document.getElementById('dict-mod').classList.remove('show');
};

render();
</script>
</body>
</html>
