function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function proc(tx){
    var str = h(tx);
    var keys = Object.keys(DICT).sort(function(a,b){return b.length-a.length;});
    keys.forEach(function(k){
        var regexKey = k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        var re = new RegExp('(^|[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ])(' + regexKey + ')(?=[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]|$)(?![^<]*>)', 'gi');
        str = str.replace(re, '$1<span class="dw" onclick="sD(\'' + k + '\')">$2</span>');
    });
    return str;
}

    document.getElementById('dictTitle').textContent = k;

    setTimeout(function(){ m.classList.add('show'); }, 10);
}

    var m = document.getElementById('dictModal');

{q:'Hogyan kell eljárni légúti idegentest okozta fulladás gyanúja esetén (ha az eszméletlen betegnél a tárgy a szájban van)?',opts:['Minden esetben ujjunkkal mélyre nyúlva ki kell söpörni','CSAK akkor, ha jól látható, egy mozdulattal, a szem ellenőrzése mellett távolítjuk el','Szigorúan tilos hozzányúlni, csak háton veregetni szabad az eszméletlen beteget','Várunk a mentőkre'],ok:1,exp:'Csak akkor szabad kivenni, ha jól látható és nem toljuk mélyebbre.'},
{q:'A kompressziókat végző egyedülálló segélynyújtó mikor nyisson ajtót a megérkező mentőknek?',opts:['Azonnal menjen ki az utcára várni őket','Mentő kopogtatásakor nyissa ki az ajtót, majd azonnal folytassa a kompressziókat','Soha, törjék be a mentők az ajtót','Csak ha az AED sokkot javasolt'],ok:1,exp:'Ha egyedül van, a mentő érkezésekor az ajtó kinyitása szükséges, de utána AZONNAL vissza kell térnie a kompresszióhoz.'},

{sit:'Mentésirányítóként fogadod a hívást. A bejelentő pánikban van. Mi az a KÉT legfontosabb információ, amit azonnal meg kell tudnod?',opts:[{tx:'A beteg életkora és alapbetegségei.',ok:false,fb:'Hibás! Ez fontos, de nem a legelső.'},{tx:'A pontos helyszín (cím) és a hívó telefonszáma (ha megszakadna a vonal).',ok:true,fb:'Helyes! A cím és a visszahívhatóság a legelső az eljárásrend szerint.'},{tx:'Lélegzik-e a beteg.',ok:false,fb:'Hibás! A helyszín hiányában nem tudsz mentőt küldeni.'}]},
{sit:'A helyszín megvan (lakás). A nő azt mondja, a 60 éves férje "csak összeesett, a földön fekszik mozdulatlanul". Keringésmegállás gyanúja merül fel. Mi az első TEENDŐD a kérdezés folytatása előtt?',opts:[{tx:'Azonnal riasztom az autó-allokációval a legközelebbi P1 mentőegységet (eset/ROKO/helikopter).',ok:true,fb:'Helyes! A P1 riasztást haladéktalanul, párhuzamosan el kell indítani.'},{tx:'Megkérem, hogy kezdje el a kompressziót.',ok:false,fb:'Hibás! Még nem is vizsgáltátok meg a beteget.'},{tx:'Megkérdezem, van-e a férjének pacemakere.',ok:false,fb:'Hibás! Időveszteség.'}]},
{sit:'A riasztás elindult, a vonalban maradtál. A T-CPR technikai előkészítéséhez mit kérsz a bejelentőtől?',opts:[{tx:'Hogy kapcsolja ki a telefont a mentő érkezéséig.',ok:false,fb:'Hibás!'},{tx:'Kapcsolja a telefont kihangosításra, és tegye a beteg mellé.',ok:true,fb:'Helyes! Így mindkét keze szabaddá válik az újraélesztéshez.'},{tx:'Adja át a telefont a szomszédnak.',ok:false,fb:'Hibás! Nem biztos, hogy van ott szomszéd.'}]},

{sit:'A fej hátrahajtva. Hogyan vizsgáltatod a légzést?',opts:[{tx:'Hajoljon az arca fölé, 10 másodpercig figyelje a mellkast, hallgassa és érezze a levegővételt.',ok:true,fb:'Helyes! Ez a hármas érzékelés, normál COVID-mentes helyzetben (közös háztartásban élnek).'},{tx:'Nézze a mellkasát 5 másodpercig.',ok:false,fb:'Hibás! 10 másodpercig kell.'},{tx:'Tegyen egy tükröt a szája elé.',ok:false,fb:'Hibás! Elavult, nem protokolláris módszer.'}]},
{sit:'A 10 másodperc letelt. A feleség azt mondja: "Néha horkant egyet, és ritkán tátog, mintha hal lenne, de semmi több." Mit jelent ez?',opts:[{tx:'Ez egy asztmás roham, keressen inhalátort.',ok:false,fb:'Hibás! A tátogás nem asztma jele itt.'},{tx:'Ez a beteg horkol, tehát alszik, stabil oldalfekvés kell.',ok:false,fb:'Hibás!'},{tx:'Ez gaspoló (agonális) légzés, a keringésmegállás jele. Úgy kell eljárni, mintha nem lélegezne.',ok:true,fb:'Helyes! A gaspoló légzés nem hatásos, azonnali CPR-t igényel.'}]},

{sit:'A feleség egyedül van a lakásban, fárad. A mentő már nagyon közel jár (1 perc). Mit teszel irányítóként?',opts:[{tx:'Azt mondom neki, hogy nyugodtan tartson szünetet.',ok:false,fb:'Hibás! A kompresszió megszakítása rontja a túlélést.'},{tx:'Folyamatosan biztatom (pozitív visszajelzés), mondom neki a ritmust, és közlöm, hogy a mentő mindjárt ottvár, ne adja fel.',ok:true,fb:'Helyes! A folyamatos biztatás a protokoll kritikus eleme.'},{tx:'Leteszem a telefont, mert a lényegi részt elmondtam.',ok:false,fb:'Hibás! A mentő érkezéséig vonalban kell maradni.'}]},

],summary:'Részletes Összefoglaló (Sim 1 - Normál Felnőtt T-CPR): A hívásfogadáskor az első lépés a pontos helyszín és visszahívó telefonszám rögzítése volt. A keringésmegállás gyanújakor azonnal P1-es szintű egységet (eset/ROKO) riasztottunk az allokáció segítségével. A telefont kihangosíttattuk. A beteg reakcióját hangos megszólítással és vállrázással vizsgáltattuk. Reakció hiányában a beteget hanyatt fektettük, fejét hátrahajtva légutat biztosítottunk. A 10 másodperces légzésvizsgálat során a feleség gaspoló (tátogó, halhoz hasonló) légzést észlelt, amit azonnal keringésmegállásnak értékeltünk. Laikus ellátó lévén azonnali, folyamatos mellkasi kompressziókat indítottunk a mellkas közepén. Az irányító folyamatos biztatással tartotta a lelket a fáradó feleségben. Amikor a mentő megérkezett, az egyedül lévő nő kinyitotta az ajtót, majd a protokoll szerint azonnal visszatért a kompressziókhoz, amit csak akkor hagyott abba, amikor a mentőszemélyzet egyértelműen átvette az ellátást.'},

{id:2,title:'2. Szimuláció: Közterület, COVID-19 gyanú (Mentésirányító B+ mentőápoló)',diff:'B+ kompetencia',desc:'Utcán összeesett felnőtt beteg. Egy járókelő hívja a mentőket. Járványidőszak / COVID-19 gyanús környezet.',steps:[
{sit:'Hívásfogadás: közterületen, az utcán esett össze egy idős férfi. A hívó egy fiatal járókelő. A P1 riasztás azonnal megtörtént. A COVID-19 szabályok miatt mi az első tisztázandó?',opts:[{tx:'Hogy be van-e oltva a bejelentő.',ok:false,fb:'Hibás! Ezt nem tudjuk percek alatt ellenőrizni és nem ez a protokoll.'},{tx:'Megkérdezem, hogy a jelenlévő segélynyújtó KÖZÖS HÁZTARTÁSBAN él-e a beteggel?',ok:true,fb:'Helyes! Ez dönti el, hogy normál vagy COVID specifikus CPR-t kell-e vezényelni.'},{tx:'Volt-e a beteg külföldön.',ok:false,fb:'Hibás! Irreleváns időveszteség.'}]},
{sit:'A fiatalember teljesen idegen, a beteg lázasan köhögött mielőtt összeesett (COVID gyanú felmerül). Mit kell közölnöd a bejelentővel a helyszínbiztonság részeként?',opts:[{tx:'Azonnal meneküljön onnan, nehogy elkapja.',ok:false,fb:'Hibás! Törekszünk az ellátásra.'},{tx:'Figyelmeztetem a fokozott fertőzésveszélyre, és megkérdezem, hajlandó-e segíteni. Ha igen, vegyen fel maszkot, ha van nála.',ok:true,fb:'Helyes! A biztonság az első, és idegen beteg esetén nem erőltethetjük a segítségnyújtást.'},{tx:'Nem mondok semmit a COVID-ról, mert megijed.',ok:false,fb:'Hibás! Tájékoztatási kötelezettségünk van.'}]},
{sit:'A srác vállalja. Kihangosítja a telefont. Megszólításra/rázásra nincs reakció. Hogyan vizsgáltatod a légzést COVID-19 gyanú/idegen beteg esetén?',opts:[{tx:'Hajoljon mélyen az arca fölé, hogy érezze a légáramlást.',ok:false,fb:'Hibás! COVID gyanú esetén az arc fölé hajolás SZIGORÚAN TILOS!'},{tx:'Hajtsa hátra a fejét, és 10 másodpercig figyelje a mellkasát.',ok:false,fb:'Hibás! A fej hátrahajtása tilos az aeroszol képződés miatt.'},{tx:'A fej hátrahajtása és az áll kiemelése NÉLKÜL, kizárólag a mellkas megtekintésével vizsgálja a légzést (tilos az arc fölé hajolni).',ok:true,fb:'Helyes! Ez a speciális COVID-19 protokoll.'}]},
{sit:'A mellkas nem mozog. Nincs légzés. Mielőtt a segélynyújtó megkezdi a kompressziót, mit kell megtennie a fertőzésveszély csökkentésére?',opts:[{tx:'Takarja le a beteg arcát (orrát és száját) valamilyen textíliával, ruhadarabbal vagy maszkkal.',ok:true,fb:'Helyes! Ez blokkolja a kompresszió során kiáramló aeroszolokat.'},{tx:'Fújja be a beteget fertőtlenítővel.',ok:false,fb:'Hibás! Nincs ilyen.'},{tx:'Mossa meg a kezét szappannal, mielőtt a mellkashoz ér.',ok:false,fb:'Hibás! Időveszteség, a beteg meghal.'}]},
{sit:'A beteg arca letakarva. Közterületen vagytok, az irányítás P1 esetkocsit indított. Melyik másik platformot/társaságot KELL riasztania a mentésirányításnak közterületi esetben?',opts:[{tx:'A tűzoltóságot, hogy mossák le az utcát.',ok:false,fb:'Hibás!'},{tx:'A Szív City alkalmazást, hogy a közeli önkéntesek (AED-vel) a helyszínre siessenek.',ok:true,fb:'Helyes! Közterületi keringésmegállásnál a Szív City riasztása protokolláris elvárás.'},{tx:'A polgárőrséget.',ok:false,fb:'Hibás! Bár segíthetnek, nem a specifikus riasztási pont.'}]},
{sit:'A segélynyújtó megkezdi a FOLYAMATOS kompressziókat (lélegeztetés tilos a COVID miatt). Két perc múlva futva érkezik egy Szív City önkéntes egy AED-vel (defibrillátor). Mi a teendő a kompressziókkal?',opts:[{tx:'Hagyják abba a kompressziót azonnal, és várják meg, amíg az AED elemez.',ok:false,fb:'Hibás! Az AED bekapcsolása és felragasztása alatt is menni kell a CPR-nek.'},{tx:'A kompressziók megkezdése előtt (vagy ha már megy, akkor párhuzamosan megszakítás nélkül) használják az AED-t azonnal.',ok:true,fb:'Helyes! A COVID protokoll hangsúlyozza: "ha AED kezdettől rendelkezésre áll, még a mellkaskompressziók megkezdése előtt használja". Itt már megy a CPR, tehát a gépet azonnal be kell vetni.'},{tx:'Ne használják az AED-t, mert közterületen a COVID miatt veszélyes.',ok:false,fb:'Hibás! Az AED életmentő.'}]},
{sit:'Melyik kérdéssel próbálod tisztázni az irányítópult mögül, hogy milyen típusú AED érkezett?',opts:[{tx:'"Milyen színű a gép doboza?"',ok:false,fb:'Hibás! Ez nem ad egzakt információt.'},{tx:'"Mi van ráírva a gépre?"',ok:true,fb:'Helyes! Rövid kérdéssel tisztázható a típus, így jobban tudod vezetni a folyamatot.'},{tx:'"Hány voltos a gép?"',ok:false,fb:'Hibás! A laikus ezt nem tudja és nem is releváns.'}]},
{sit:'A Szív City önkéntes felragasztja az elektródákat. A gép azt mondja: "Ritmusanalízis. Ne érjen a beteghez." Mit teszel?',opts:[{tx:'Utasítom az önkéntest, hogy azonnal vegye el a kezét, senki ne érjen a beteghez a gép elemzése alatt.',ok:true,fb:'Helyes! Az analízis alatt a beteg érintése műterméket okoz.'},{tx:'Azt mondom, nyomják nyugodtan tovább.',ok:false,fb:'Hibás! Megzavarja az elemzést.'},{tx:'Azt mondom, most vegyék le az arcról a textilt.',ok:false,fb:'Hibás! A textil marad.'}]},
{sit:'A gép sokkot javasolt, az önkéntes megnyomta a villogó gombot (sokk leadva). Mi a közvetlen teendő utána COVID-19 gyanús felnőtt esetén?',opts:[{tx:'Pulzusvizsgálat a nyakon 10 mp-ig.',ok:false,fb:'Hibás! Sokk után azonnal CPR.'},{tx:'Azonnal folytatni kell a FOLYAMATOS mellkasi kompressziókat (lélegeztetés nélkül, letakart arccal).',ok:true,fb:'Helyes! Sokk leadása után nincs késlekedés, azonnal kompresszió indul.'},{tx:'Két befúvás a szájba.',ok:false,fb:'Hibás! Felnőtt, COVID gyanús, idegen beteg – lélegeztetés tilos.'}]},
{sit:'Megérkezik a mentőegység, átveszik az újraélesztést, a beteget intubálják. Mit kell elmondanod a hívás befejezésekor a laikus segélynyújtóknak a COVID miatt?',opts:[{tx:'Menjenek azonnal házi karanténba 14 napra.',ok:false,fb:'Hibás! Ezt mentésirányító nem rendelheti el.'},{tx:'Figyelmeztetem őket: az újraélesztés befejezése után fertőtlenítsék a kezüket, cseréljék ki a maszkjukat; ha a későbbiekben COVID tünetek jelentkeznek, forduljanak orvoshoz.',ok:true,fb:'Helyes! Ez a protokolláris befejező lépés a laikusok védelmében.'},{tx:'Mondom, hogy a mentők adnak nekik egy antibiotikumot.',ok:false,fb:'Hibás! Az antibiotikum nem vírusra való, és a mentő nem ad ilyet laikusoknak.'}]}
],summary:'Részletes Összefoglaló (Sim 2 - COVID gyanús T-CPR): A közterületi hívásnál azonnal indítottuk a P1 egységet és a Szív City alkalmazást. Mivel a bejelentő idegen volt, tisztáztuk a közös háztartás hiányát, és COVID-19 gyanú esetén figyelmeztettük a fertőzésveszélyre. A segélynyújtó vállalta az ellátást. A reakcióvizsgálatot követően a légzést a fej hátrahajtása nélkül, arc fölé hajolás nélkül, kizárólag a mellkas mozgásának figyelésével értékeltük. Légzés hiányában, mielőtt a mellkasra tették volna a kezüket, a beteg arcát (orrát, száját) textíliával letakartuk az aeroszol blokkolása érdekében. A felnőtt idegennél a lélegeztetést mellőztük, kizárólag folyamatos mellkasi kompressziókat instruáltunk. A megérkező Szív City önkéntes bekapcsolta az AED-t, amelynek típusát a "Mi van ráírva?" kérdéssel tisztáztuk. A gép sokkot javasolt, melynek leadása után azonnal folytattattuk a kompressziókat. A mentők átvétele után a hívást a kötelező higiéniai figyelmeztetéssel (kézfertőtlenítés, maszkcsere, orvoshoz fordulás tünetek esetén) zártuk.'},

{id:3,title:'3. Szimuláció: Gyermek normál eset (Mentésirányító mentőápoló)',diff:'B kompetencia',desc:'Lakásból telefonál egy szülő, az 5 éves gyermeke eszméletlen. Közös háztartás (COVID szabályok nem módosítják a lélegeztetést gyermeknél amúgy sem).',steps:[
{sit:'A szülő hív. Helyszín megvan. P1 (Gyermek MOK / esetkocsi) indítva. A gyermek nem reagál a hangos megszólításra és rázásra. T-CPR indul. Hogyan biztosít légutat az 5 évesnél?',opts:[{tx:'A gyermeket hanyatt fekteti kemény alapra, egyik kezét a homlokára teszi, másikkal az állát emeli, és a fejét óvatosan hátrahajtja.',ok:true,fb:'Helyes! A standard légútmegnyitás gyermeknél is érvényes.'},{tx:'Csak egy kispárnát tesz a feje alá.',ok:false,fb:'Hibás! A párna elzárhatja a légutat a fej előrehajtása miatt.'},{tx:'Fejre állítja a gyermeket.',ok:false,fb:'Hibás! Szakszerűtlen és veszélyes.'}]},
{sit:'A szülő szerint a gyermek evés közben esett össze, félrenyelt. Mit mondasz az idegentest eltávolításáról?',opts:[{tx:'Nyúljon be az ujjával, és vakon kotorásszon, hátha megtalálja.',ok:false,fb:'Hibás! A vak ujjazás mélyebbre tolhatja a tárgyat.'},{tx:'Ha JÓL LÁTHATÓ az idegentest a szájban, akkor, és csak akkor próbálja meg egyetlen mozdulattal, a szem ellenőrzése mellett eltávolítani.',ok:true,fb:'Helyes! Csak látható idegentestet szabad eltávolítani, ügyelve, hogy ne nyomja mélyebbre.'},{tx:'Fordítsa fejjel lefelé és rázza.',ok:false,fb:'Hibás! Eszméletlen betegnél ezt nem alkalmazzuk.'}]},
{sit:'Nincs látható idegentest. A légzésvizsgálat 10 mp alatt kimutatja: a gyermek nem lélegzik normálisan (csak gurgulázik, tátog). MIVEL KEZDŐDIK a nem légző gyermek újraélesztése az eljárásrend szerint?',opts:[{tx:'30 mellkasi kompresszióval.',ok:false,fb:'Hibás! Az a felnőttek protokollja.'},{tx:'AED azonnali felhelyezésével.',ok:false,fb:'Hibás! Ha nincs gép, fizikálisan kell kezdeni.'},{tx:'Azonnali BEFÚVÁSOS lélegeztetéssel, összesen 5 kezdő befúvással.',ok:true,fb:'Helyes! A gyermekek keringésmegállása döntően légzőszervi eredetű, ezért 5 befúvással indítunk.'}]},
{sit:'A szülő a kihangosított telefon mellett megcsinálja az 5 befúvást. Mi a KÖZVETLENÜL EZUTÁN következő lépés gyermeknél?',opts:[{tx:'Azonnal meg kell kezdeni a kompressziót.',ok:false,fb:'Hibás! Előbb egy gyors ellenőrzés kell.'},{tx:'Ismételt légzésvizsgálat, illetve a keringés jeleinek (mozgás, köhögés, életjel) értékelése.',ok:true,fb:'Helyes! Az 5 befúvás hatására visszatérhet az életjel, ezt ellenőrizni kell.'},{tx:'Várni kell 1 percet a hatásra.',ok:false,fb:'Hibás! Nincs várakozási idő.'}]},
{sit:'A gyermek nem mozdul, nem köhög, nem lélegzik. Most indul a mellkasi kompresszió. Mi az arány laikus (szülő) újraélesztő esetén gyermeknél?',opts:[{tx:'30 mellkasi kompresszió és 2 befúvás felváltva (30:2).',ok:true,fb:'Helyes! Laikusoknak (és mentésirányítónak a laikus felé) a 30:2 arány az előírt, ha hajlandó lélegeztetni.'},{tx:'15 kompresszió és 2 befúvás (15:2).',ok:false,fb:'Hibás! A 15:2 a két professzionális egészségügyi dolgozó (ALS) által végzett arány.'},{tx:'Csak folyamatos kompresszió.',ok:false,fb:'Hibás! Gyermeknél kritikus a lélegeztetés.'}]},
{sit:'Hol és hogyan végezze a szülő a mellkasi kompressziót az 5 éves gyermeknél?',opts:[{tx:'A szegycsont alsó harmadán, két ujjal.',ok:false,fb:'Hibás! Két ujj csecsemőknél használt technika.'},{tx:'A mellkas közepén (szegycsont alsó felén), egy vagy két kézzel (a gyermek méretétől függően), megfelelő mélységben.',ok:true,fb:'Helyes! 5 évesnél mérettől függően egy vagy két kéz a mellkas közepén.'},{tx:'A gyomorszájon.',ok:false,fb:'Hibás! Az sérülést okoz.'}]},
{sit:'A szülő elkezdi a 30:2-t. Látod/hallod, hogy nagyon gyorsan elfárad. Egyedül van otthon. Mit teszel mentésirányítóként?',opts:[{tx:'Megkérdezem, be akarja-e fejezni.',ok:false,fb:'Hibás! Soha nem ajánlunk fel ilyet.'},{tx:'Határozottan, de empátiával biztatom: "Nagyon jól csinálja! Tartson ki, a gyermekének szüksége van magára! A mentőautó már csak 2 utcára van."',ok:true,fb:'Helyes! A folyamatos pozitív visszajelzés és a mentő közeledtének bemondása kritikus laikusoknál.'},{tx:'Átkapcsolom zenére, amíg a mentő odaér.',ok:false,fb:'Hibás! Vonalban kell maradni és figyelni az ütemet.'}]},
{sit:'Közben eszébe jut a szülőnek, hogy a gyermeknek van ismert epilepsziája. Ez a tény módosítja a jelenlegi újraélesztési folyamatot (hiszen nincs légzése)?',opts:[{tx:'Igen, akkor hagyja abba az újraélesztést, mert ez csak egy elhúzódó roham.',ok:false,fb:'Hibás! Ha nincs légzés, újra kell éleszteni, a görcs gyakran bevezeti a megállást.'},{tx:'Nem, mivel a légzésvizsgálat egyértelműen kimutatta, hogy nincs légzés, az újraélesztés a helyes út.',ok:true,fb:'Helyes! Az epilepszia ténye nem írja felül a keringésmegállás (légzéshiány) fizikai tüneteit.'},{tx:'Igen, adjon be neki egy végbélkúpot a rohamra.',ok:false,fb:'Hibás! CPR közben tilos megszakítani ilyesmivel.'}]},
{sit:'A szülő hallja a mentő szirénáját az utcán, és látja a kék fényt az ablakból. Mit mondasz neki?',opts:[{tx:'Menjen le az utcára és integessen nekik.',ok:false,fb:'Hibás! A gyermeket nem hagyhatja ott.'},{tx:'Folytassa az újraélesztést. Csak ha a mentők az ajtó előtt vannak, ugorjon oda, nyissa ki a zárt ajtót, majd AZONNAL ugorjon vissza a gyermekhez a kompressziók folytatására.',ok:true,fb:'Helyes! A zárt ajtót ki kell nyitni egyedül lévő segítőnél, de rögtön folytatni kell a CPR-t.'},{tx:'Hagyja abba a CPR-t, innentől a mentő dolga.',ok:false,fb:'Hibás! Amíg a mentő fizikálisan nem lép be, neki kell csinálnia.'}]},
{sit:'A mentőegység (MOK) belép a szobába, a szülő zokogva mondja: "Átadjuk a mentőnek?" Mit válaszolsz?',opts:[{tx:'Igen, most már lefeküdhet pihenni a kanapéra.',ok:false,fb:'Hibás! Szakszerűtlen.'},{tx:'Csak abban a pillanatban hagyja abba, amikor a mentőegység egyértelműen mondja, hogy átveszi az újraélesztést. Amíg nem mondják, nyomja tovább!',ok:true,fb:'Helyes! A kézi átadás kritikus pillanat, a mentő felszerelkezéséig a laikus nyomja.'},{tx:'Igen, álljon fel gyorsan.',ok:false,fb:'Hibás!'}]}
],summary:'Részletes Összefoglaló (Sim 3 - Gyermek T-CPR): Az 5 éves gyermek eszméletlenségéről szóló hívás során azonnal P1-es gyermekrohamkocsit indítottunk. A hanyatt fekvő gyermeknél a légutat normál módon, a fej hátrahajtásával nyitottuk meg. Idegentestet csak azért engedtünk eltávolítani, ha jól látható és egy mozdulattal kivehető, de itt nem volt. A 10 másodperces légzésvizsgálat légzéshiányt (gurgulázó gaspolás) mutatott. Mivel gyermekről volt szó, az eljárásrend értelmében a T-CPR-t azonnali 5 befúvásos lélegeztetéssel indítottuk. Ezután újra ellenőriztük az életjeleket (mozgás, köhögés). Mivel ezek hiányoztak, a laikus szülővel a 30:2 arányú mellkasi kompresszió (mellkas közepén) és lélegeztetés váltakozását kezdtük el. A mentésirányító folyamatos, hangsúlyos pozitív megerősítéssel tartotta a lelket a szülőben. Bár kiderült a gyermek epilepsziája, a keringésmegállás ténye felülírta ezt. A mentők megérkezésekor az egyedül lévő szülő csak egy pillanatra nyitott ajtót, azonnal folytatta az ellátást, és kizárólag a mentőszemélyzet konkrét, verbális átvételére hagyta abba az újraélesztést.'},

{id:4,title:'4. Szimuláció: Újszülött, otthonszülés (Mentésirányító B+ mentőápoló)',diff:'B+ kompetencia',desc:'Mentésirányítás (ICS). Hívás érkezik: egy otthonszülésnél komplikáció lépett fel, az újszülött ("valóban rövid idővel ezelőtt született") nem mutat életjelet.',steps:[
{sit:'"Segítség, a baba most született meg, de kék és nem mozdul, nem sír!" – ordítja az apa a telefonba. Mi az első intézkedés a mentésirányítói pultból?',opts:[{tx:'Azonnali P1 riasztás: koraszülött mentő és/vagy esetkocsi, ROKO a címre (autó-allokációval).',ok:true,fb:'Helyes! Ez egyértelmű azonnali életveszély, legmagasabb szintű ellátást igényel.'},{tx:'Megkérdezem, hány hetes volt a terhesség, mielőtt mentőt küldök.',ok:false,fb:'Hibás! Időveszteség.'},{tx:'Tanácsolom, hogy fürdessék meg meleg vízben.',ok:false,fb:'Hibás! Életveszélyes tanács.'}]},
{sit:'A mentő elindult. Helyszínbiztonság és technika: kéred a telefon kihangosítását. A baba a fürdőszoba kövén fekszik egy törülközőn. Hogyan vizsgáltatod a reakciót?',opts:[{tx:'Óvatosan rázza meg a vállát, pöckölje meg a talpát, vagy dörzsölje a hátát, miközben hangosan beszél hozzá.',ok:true,fb:'Helyes! Újszülöttnél a talp stimulációja vagy a hát dörzsölése a megfelelő ébresztési inger.'},{tx:'Öntsön rá egy kis hideg vizet.',ok:false,fb:'Hibás! Tilos, a lehűlés amúgy is veszély újszülöttnél.'},{tx:'Rázza meg erősen a csecsemőt a levegőben.',ok:false,fb:'Hibás! Ez Shaken Baby Syndrome-hoz vezethet.'}]},
{sit:'A baba tónustalan, nem sír, nincs reakció. A légút felszabadítása újszülöttnél hogyan történik?',opts:[{tx:'A fejet durván és erősen hátra kell hajtani (hiperextenzió).',ok:false,fb:'Hibás! Újszülöttnél ez elzárja a puha légcsövet.'},{tx:'A fejet neutrális (közép) állásba, úgynevezett "szimatoló" pozícióba helyezzük, minimális állkiemeléssel.',ok:true,fb:'Helyes! Az újszülött anatómiája miatt a semleges pozíció a legjobb.'},{tx:'A fejet a mellkasra hajtjuk.',ok:false,fb:'Hibás! Ez biztosan elzárja a légutat.'}]},
{sit:'A 10 másodperces légzésvizsgálat alatt (mellkas mozgása) a szülő nem lát légzést. Mi a T-CPR KEZDŐ LÉPÉSE egy most született újszülöttnél?',opts:[{tx:'Azonnali mellkasi kompresszió.',ok:false,fb:'Hibás! Csecsemőnél/újszülöttnél is befúvással kezdünk.'},{tx:'Kezdjék 5 befúvásos lélegeztetéssel, oly módon, hogy a szülő szája egyszerre fedje a baba orrát és száját.',ok:true,fb:'Helyes! Újszülöttnél a tüdő folyadékkal telt lehet, a kezdő 5 befúvás kritikus az oxigenizációhoz.'},{tx:'A köldökzsinór azonnali elvágása.',ok:false,fb:'Hibás! Ez önmagában nem éleszt újra.'}]},
{sit:'Az 5 befúvás megtörtént. Megvizsgálják a babát, van-e életjel (spontán légzés, mozgás). Nincs. A COVID gyanú nem merül fel. Mennyi az újraélesztés ARÁNYA újszülöttnél (valóban most születettnél) a mentésirányító szerint?',opts:[{tx:'30 kompresszió, 2 befúvás (30:2).',ok:false,fb:'Hibás! Ez nagyobb gyermekre / felnőttre igaz.'},{tx:'15 kompresszió, 2 befúvás (15:2).',ok:false,fb:'Hibás! Ez az ALS gyermek aránya.'},{tx:'Minden harmadik kompresszió után egy befúvás (3:1 arány).',ok:true,fb:'Helyes! Az eljárásrend kifejezetten rögzíti: újszülöttnél (rövid idővel ezelőtt született) a 3:1 az irányadó.'}]},
{sit:'Hogyan kell a mellkasi kompressziót végezni az újszülöttnél a szülőnek?',opts:[{tx:'Két ujjával a szegycsont alsó felén (a mellbimbók vonala alatt), gyors ütemben (kb. 120/perc).',ok:true,fb:'Helyes! A kétujjas technika a megfelelő az egyedülálló laikus/csecsemő CPR esetén.'},{tx:'Két tenyérrel a mellkas közepén.',ok:false,fb:'Hibás! Eltöri a baba bordáit/szerveit.'},{tx:'Csak egy ujjal a gyomornál.',ok:false,fb:'Hibás! Hatástalan és veszélyes.'}]},
{sit:'Mivel a helyszínen apuka és anyuka is ott van (több jelenlévő), mi a legoptimálisabb munkamegosztás a 3:1 újraélesztés alatt?',opts:[{tx:'Az egyik szülő végezze a folyamatos 3 kompressziót és a befúvást is, a másik menjen az utcára várni a mentőt.',ok:false,fb:'Hibás! Sokkal jobb, ha az ajtónyitás mellett is segítik egymást a betegnél.'},{tx:'Az egyik szülő csak komprimál (3 nyomás), a másik pedig készenlétben áll a fejnél és befúj egyet (1 befúvás), így folyamatos a ritmus. Ezt instruálja az irányító.',ok:true,fb:'Helyes! A kétemberes CPR (egyik nyom, másik fúj) sokkal hatékonyabb.'},{tx:'Csinálják 30:2 arányban, mert úgy könnyebb megjegyezni.',ok:false,fb:'Hibás! Újszülöttnél a 3:1 a protokoll.'}]},
{sit:'A technikai feltételek adottak a helyszínen (jó internet, okostelefon). Kihasználhatja-e a mentésirányító a kamerakép kérését (video triage) a hatályos szabályok szerint?',opts:[{tx:'Szigorúan tilos bármilyen kamerát használni a betegjogok miatt.',ok:false,fb:'Hibás! Mentésirányítási célból lehetséges, ha megfelel a szabályoknak.'},{tx:'Igen, törekedjünk a helyszínről képanyagot nyerni mobiltelefonon keresztül, feltéve, hogy a jelenlévők valamelyike – NEM AZ, AKI A SEGÉLYNYÚJTÁST VÉGZI! – tud ebben segíteni.',ok:true,fb:'Helyes! A protokoll kifejezetten bátorítja a képi információszerzést, de nem akadályozhatja a CPR-t.'},{tx:'Igen, de csak a mentő kiérkezése után.',ok:false,fb:'Hibás! Késő.'}]},
{sit:'A rokon (aki eddig tartotta a kamerát) látja, hogy megérkezett a mentő. Mivel többen vannak, ki menjen ajtót nyitni?',opts:[{tx:'Az, aki újraéleszt (az apuka).',ok:false,fb:'Hibás! Ne hagyja abba a kompressziót!'},{tx:'A rokon, aki a telefont/kamerát tartotta, azonnal szaladjon kinyitni a zárt ajtót és vezesse be a mentőket, miközben a szülők megállás nélkül folytatják a 3:1-es CPR-t.',ok:true,fb:'Helyes! Mivel többen vannak, a kompressziónak és a lélegeztetésnek egy pillanatra sem szabad megállnia.'},{tx:'Senki ne menjen, a mentő megoldja az ajtót.',ok:false,fb:'Hibás! A zárt ajtót ki kell nyitni.'}]},
{sit:'A koraszülött mentő belép az ajtón, a mentőorvos leteszi a felszerelését a baba mellé. Mikor engedheted el a vonalat (és hagyhatják abba a szülők a T-CPR-t)?',opts:[{tx:'Amikor meghallod, hogy valaki azt mondja: "Jó napot kívánok".',ok:false,fb:'Hibás! A köszönés nem jelenti a beavatkozás átvételét.'},{tx:'Amikor a mentőegység verbálisan és fizikálisan jelzi a helyszínen: "Átvettük az újraélesztést", a mentésirányító elbúcsúzhat és bonthatja a vonalat.',ok:true,fb:'Helyes! Ez a kritikus mozzanata a laikus-professzionális átadásnak.'},{tx:'Amikor a mentő belép az utcáról a házba.',ok:false,fb:'Hibás!'}]}
],summary:'Részletes Összefoglaló (Sim 4 - Újszülött T-CPR): Az otthonszülésnél fellépő szövődmény miatt az azonnali P1 riasztás (koraszülött mentő) megtörtént. A vonalban maradva az irányító kihangosíttatta a telefont. Az újszülött ("valóban rövid idővel ezelőtt született") tónustalan volt és nem reagált a talpingerlésre/hátdörzsölésre. A légutat neutrális ("szimatoló") pozícióban nyitottuk meg, elkerülve a durva hátrahajtást. A 10 másodperces légzésvizsgálat légzéshiányt jelzett. A protokollnak megfelelően az újraélesztést 5 kezdő befúvással indítottuk (a szülő szája egyszerre fedte az orrot és szájat). Mivel az életjelek továbbra is hiányoztak, a speciális újszülött CPR arányt, a 3:1-et instruáltuk (3 kétujjas kompresszió a szegycsont alsó felén, majd 1 befúvás). A jelenlévő rokon bevonásával az irányító élhetett a videós (okostelefonos) megtekintés lehetőségével, mivel a rokon nem vett részt a tényleges CPR-ben. A mentők megérkezésekor szintén a rokon végezte az ajtónyitást, így az újraélesztés folyamatos maradt a szülők által, egészen addig a másodpercig, amíg a mentőegység egyértelműen át nem vette az ellátást a fürdőszobában.'}
];

function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Telefonon irányított újraélesztés (T-CPR)</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v4.0 / 2023.12.19.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Tananyag','Eljárásrend teljes anyaga'],['flash','🃏','Flashkártyák','14 forgatható kártya'],['quiz','❓','Kvíz','15 kérdés visszajelzéssel'],['sim','🚑','Szimuláció','4 interaktív eset']].map(function(x){return '<button onclick="go(\''+x[0]+'\')" class="home-mod"><div class="home-mod-icon">'+x[1]+'</div><div class="home-mod-title">'+x[2]+'</div><div class="home-mod-desc">'+x[3]+'</div></button>'}).join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af"><b>Vonatkozik:</b> Az Országos Mentőszolgálat valamennyi mentésirányítójára. A zölddel aláhúzott szavakra kattintva elérhető a szótár!</div></div>';
}

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+proc(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(function(i){return '<li>'+proc(i)+'</li>';}).join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(function(i){return '<div class="kr">✓ &nbsp;'+proc(i)+'</div>';}).join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+proc(b.tx)+'</div>';
  return '';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Tananyag</h2>'+
CDATA.map(function(c){return '<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+proc(c.title)+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>'}).join('');
}

function renderChapter(id){
var c=CDATA.find(function(x){return x.id===id;});if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+proc(c.title)+'</h2></div>'+
c.secs.map(function(s){return '<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+proc(s.t)+'</h3>'+s.bk.map(function(b){return rb(b);}).join('')+'</div>'}).join('');
}

function renderFlash(){
var cats=['Összes'];
CARDS.forEach(function(c){if(cats.indexOf(c.cat)===-1) cats.push(c.cat);});
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(function(c){return c.cat===FC.cat;});
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(function(c){return '<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>'}).join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+proc(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+proc(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(function(a){return !a.ok;}).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(function(a){return !a.ok;}).map(function(a){return '<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+proc(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+proc(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+proc(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+proc(QUIZ[a.qi].exp)+'</div></div>'}).join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+proc(q.q)+'</p></div>'+
q.opts.map(function(opt,i){var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+proc(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+proc(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(function(s){return '<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+proc(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+proc(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>'}).join('');
}
var sim=SIMS.find(function(s){return s.id===SI.id;});
if(SI.fin){
var correct=SI.hist.filter(function(h){return sim.steps[h.step].opts[h.oi].ok;}).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+proc(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+proc(sim.summary)+'</div>'+
SI.hist.map(function(hh,i){var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+proc(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+proc(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+proc(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+proc(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+proc(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+proc(step.sit)+'</p></div>'+
step.opts.map(function(opt,i){var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+proc(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+proc(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
var tabs=['home','chapters','flash','quiz','sim'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(function(c){return c.cat===FC.cat;});FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(function(s){return s.id===SI.id;});if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
</html>
