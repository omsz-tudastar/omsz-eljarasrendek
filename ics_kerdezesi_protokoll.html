{q:'Légúti megbetegedés (pl. COVID-19) gyanújakor hogyan vizsgáljuk a légzést?',opts:['Az arc fölé hajolva, hármas érzékeléssel','NEM hajolunk az arc fölé – mellkas szintjéből oldalról figyeljük a mellkas mozgását','Csak pulzoximéterrel','Csak fonendoszkóppal'],ok:1,exp:'Légúti betegség gyanújakor: NE hajolj az arc fölé! A mellkas szintjéből, oldalról figyeld a mellkas emelkedését/süllyedését.'},
{q:'Mikor mondható, hogy ABCD stabil a beteg?',opts:['Ha a vérnyomása normál tartományban van','Ha járóképes és egész mondatokban értelmesen kommunikál','Ha a NEWS2 pontszáma 0-4 között van','Ha a GCS ≥ 13'],ok:1,exp:'ABCD stabilitás valószínűsíthető: a beteg JÁRÓKÉPES és egész mondatokban, értelmesen kommunikál.'},
{q:'Csecsemő GCS motoros válasz max (6 pont) mit jelent?',opts:['Utasítást végrehajt','Spontán, célirányosan mozog','Fájdalmas ingert lokalizál','Érintést elhárít'],ok:1,exp:'Csecsemő GCS motoros 6 = spontán, célirányosan mozog. Felnőttnél 6 = utasítást végrehajt.'},
{q:'Mi a subcutan emphysema és mit jelez traumánál?',opts:['Bőr alatti bevérzés – bordatörést jelez','Bőr alatti levegő – PTX egyértelmű jele','Bőr alatti ödéma – vénás elégtelenséget jelez','Bőr alatti gáz – fertőzést jelez'],ok:1,exp:'Subcutan emphysema = bőr alatti levegő (tapintásra roppanó érzet) = PTX EGYÉRTELMŰ jele!'},
{q:'Nyaki gerincsérülés gyanúján hogyan szabad a légútat felszabadítani?',opts:['Szokásos fejhátrahajtás + állemeléssel','MILS mellett ÁLL KIEMELÉSE – FEJ HÁTRAHAJTÁSA NÉLKÜL','Merev gallér azonnali felhelyezésével','Csak eszközös légútbiztosítással'],ok:1,exp:'MILS mellett: áll kiemelése – fej hátrahajtása NÉLKÜL! A merev gallér csak késői szakaszban.'},
{q:'Az EKG monitor felhelyezése kritikus betegnél:',opts:['Soha nem akadályozza a kimentést','Ha a kimentést akadályozza → csatlakozások átmenetileg oldhatók','Mindig a vénabiztosítás után helyezhető fel','Prehospitálisan nem javasolt'],ok:1,exp:'Ha a kimentést akadályozza, a csatlakozások átmenetileg oldhatóak.'},
{q:'Mi a "D" (Disability) vizsgálat fájdalmas ingere?',opts:['Körömágy megnyomása','Supraorbitalis ideg kilépési pontjának nyomása','Szegycsont megnyomása','Carotis nyomása'],ok:1,exp:'GCS fájdalmas inger: supraorbitalis ideg kilépési pontjának nyomása.'},
{q:'NEWS2 ≥5 + infekció jelei/esélyét fokozó tényező → mire kell gondolni?',opts:['Traumára','Szepszisre','Stroke-ra','Mérgezésre'],ok:1,exp:'NEWS2 ≥5 + infekció jelei → AZONNAL gondolj SZEPSZISRE!'}
];

var SIMS=[
{id:1,title:'1. Szimuláció: Eszméletlen beteg (B kompetencia)',diff:'B kompetencia',desc:'Lakásban a padlón fekve találnak egy ~60 éves férfit. A hozzátartozó szerint „csak összeesett". B kompetenciaszint (szakképzett mentőápoló, gyógyszerezés nélkül).',steps:[
{sit:'Megérkezel a megadott címre, kiszállsz a mentőből. Mi az első teendőd az eljárásrend szerint?',opts:[{tx:'Azonnal megközelítem és megszólítom a beteget.',ok:false,fb:'Hibás! Mindig a helyszínbiztonság az első.'},{tx:'A helyszín biztonságosságáról meggyőződöm, felveszem az egyéni védőfelszereléseket.',ok:true,fb:'Helyes! A helyszínbiztonság ellenőrzése és a védőfelszerelés felvétele mindig az első lépés.'},{tx:'Azonnal segélykocsit hívok.',ok:false,fb:'Hibás! Előbb a helyszínt és a beteget kell felmérni.'}]},
{sit:'A helyszín biztonságos. A beteg a hátán fekszik, mozdulatlan. Mi a következő lépés?',opts:[{tx:'Hangosan megszólítom és kíméletesen megrázom a vállát egyidőben (reagál-e?).',ok:true,fb:'Helyes! A reakcióképesség vizsgálata az elsődleges.'},{tx:'Azonnal mellkasi kompressziókat kezdek.',ok:false,fb:'Hibás! Még nem vizsgáltad meg az életjelenségeket.'},{tx:'Megnézem a pupilláit.',ok:false,fb:'Hibás! Az a "D" vizsgálat része lenne.'}]},
{sit:'A beteg semmilyen ingerre nem reagál. B kompetenciaszintű egységként mi a haladéktalan teendőd?',opts:[{tx:'Megkezdem a stabil oldalfekvésbe helyezést.',ok:false,fb:'Hibás! Nem tudjuk még, hogy lélegzik-e.'},{tx:'Kézirádión haladéktalanul segélykocsit kérek, és folytatom a vizsgálatot.',ok:true,fb:'Helyes! B kompetenciánál eszméletlen/reagálatlan beteghez magasabb szintű segítség kell.'},{tx:'Kikérdezem a hozzátartozót az allergiáiról.',ok:false,fb:'Hibás! Az életmentés az első.'}]},
{sit:'Hogyan biztosítasz légutat ennél az eszméletlen, nem traumás betegnél?',opts:[{tx:'A fejét balra fordítom.',ok:false,fb:'Hibás! Ez nem biztosít stabil légutat.'},{tx:'Egyik kezem a homlokára, másik az álla alá: fej kíméletes hátrahajtása és az áll megemelése.',ok:true,fb:'Helyes! Ez a standard légútfelszabadítás.'},{tx:'Ujjal betörlök a szájába mindenképpen.',ok:false,fb:'Hibás! Csak akkor nyúlunk a szájba, ha nyilvánvalóan szükséges (pl. látható idegentest).'}]},
{sit:'A légutat felszabadítottad. Hogyan és mennyi ideig vizsgálod a légzést?',opts:[{tx:'A mellkas emelkedését figyelem 5 másodpercig.',ok:false,fb:'Hibás! Az 5 mp kevés, és a hármas érzékelés kell.'},{tx:'Hármas érzékeléssel (látom, hallom, érzem) vizsgálom 10 másodpercig.',ok:true,fb:'Helyes! 10 másodperces hármas érzékelés a kötelező.'},{tx:'Fonendoszkóppal meghallgatom a tüdőt 10 másodpercig.',ok:false,fb:'Hibás! Ez nem a "B" vizsgálat, hanem az alapvető életjelenségek felmérése.'}]},
{sit:'A 10 mp alatt a beteg kétszer, furcsán elnyújtva, hörgő hanggal tátog, mintha csuklana. Mi ez?',opts:[{tx:'Normális légzés, a beteg él.',ok:false,fb:'Hibás! A normális légzés nem ilyen.'},{tx:'Ez agonális (gaspoló) légzés, amely keringésmegállásra utal.',ok:true,fb:'Helyes! Az agonális légzés nem biztosít hatásos légcserét, keringésmegállásként kezelendő.'},{tx:'Részleges légúti elzáródás.',ok:false,fb:'Hibás! Az agonális légzés jellegzetességei egyértelműek.'}]},
{sit:'Keringésmegállás. B kompetenciaszintű mentőápolóként mi az első fizikai beavatkozásod?',opts:[{tx:'Mellkasi kompressziókat kezdek.',ok:true,fb:'Helyes! Az újraélesztést felnőttnél mellkasi kompressziókkal kezdjük.'},{tx:'Kikeresem a lélegeztető ballont és csak lélegeztetek.',ok:false,fb:'Hibás! Kompresszióval kell kezdeni.'},{tx:'Vénát biztosítok.',ok:false,fb:'Hibás! B kompetenciával nem is biztosíthatsz vénát, és amúgy is kompresszió az első.'}]},
{sit:'A társad átveszi a kompressziókat. Milyen párhuzamos tevékenységet végzel haladéktalanul?',opts:[{tx:'AED (félautomata defibrillátor) / monitor elektródák felhelyezése a korai defibrillálás érdekében.',ok:true,fb:'Helyes! A defibrillálhatóság gyors felismerése kritikus.'},{tx:'Intubálást készítek elő.',ok:false,fb:'Hibás! B kompetenciával nem intubálsz.'},{tx:'Vérnyomást mérek.',ok:false,fb:'Hibás! Keringésmegállásban nincs vérnyomás.'}]},
{sit:'Az AED ritmust elemez és sokkot javasol. Leadod a sokkot. Mi a teendő közvetlenül utána?',opts:[{tx:'Megvizsgálom a pupilláit.',ok:false,fb:'Hibás! Újraélesztés alatt ez nem prioritás itt.'},{tx:'Azonnal folytatom a mellkasi kompressziókat.',ok:true,fb:'Helyes! Sokk leadása után azonnal folytatni kell a CPR-t.'},{tx:'Várok 10 másodpercet és újra ellenőrzöm a légzést.',ok:false,fb:'Hibás! Azonnal folytatni kell a kompressziót.'}]},
{sit:'Hogyan lélegeztetsz (milyen eszközzel) B kompetenciaszinten, miután beállt a ritmus a kompressziók között?',opts:[{tx:'Csak szájból-szájba.',ok:false,fb:'Hibás! Mentőeszközökkel kell végezni.'},{tx:'Egyszerű légúti segédeszközzel (OPA) és ballonos-maszkos lélegeztetéssel, oxigén csatlakoztatásával.',ok:true,fb:'Helyes! OPA és négykezes ballonos lélegeztetés a standard BLS eljárás.'},{tx:'Laryngealis maszkkal (LMA), ami gyógyszeres relaxációt igényel.',ok:false,fb:'Hibás! B kompetenciában alap eszközöket használunk.'}]},
{sit:'Milyen gyakran értékeled újra a ritmust / állapotot a segélykocsi érkezéséig?',opts:[{tx:'5 percenként.',ok:false,fb:'Hibás! Az ALS/BLS protokoll sűrűbb értékelést ír elő.'},{tx:'2 percenként (egy CPR ciklus végén).',ok:true,fb:'Helyes! A 2 perces ciklusok után van ritmusanalízis/újraértékelés.'},{tx:'Csak ha a segélykocsi megérkezett.',ok:false,fb:'Hibás! A folyamatos ciklikus értékelés kötelező.'}]}
],summary:'Részletes Összefoglaló (Sim 1 - B kompetencia): Kiérkezéskor a helyszínbiztonság és védőfelszerelés volt az első lépés. A mozdulatlan betegnél azonnal reakcióképességet vizsgáltunk (hangos megszólítás + vállrázás). Reakció hiányában B kompetenciájú egységként rögtön segélykocsit kértünk. A légutakat a fej hátrahajtásával és az áll megemelésével biztosítottuk. A 10 másodperces hármas érzékelés alatt agonális légzést (tátogás, ritka hörgés) tapasztaltunk, amit keringésmegállásként értékeltünk. Azonnal megkezdtük a mellkasi kompressziókat, miközben párhuzamosan felhelyeztük az AED-t/monitort. Sokk leadása után rögtön folytattuk a kompressziót. A lélegeztetést egyszerű eszközzel (OPA) és maszkos-ballonos módszerrel (O2-vel) végeztük, 2 perces ciklusokban újraértékelve a beteget a magasabb szintű segítség megérkezéséig.'},

{id:2,title:'2. Szimuláció: Súlyos Trauma (B+ kompetencia)',diff:'B+ kompetencia',desc:'Közlekedési baleset, 30 éves nő az összetört autóban ül. B+ kompetencia (szakképzett mentőápoló, aki gyógyszerezhet, vénát biztosíthat, detenzionálhat).',steps:[
{sit:'A tűzoltók áramtalanítottak, a helyszín biztonságos. Milyen kiegészített vizsgálattal kezded az ellátást?',opts:[{tx:'Trauma kiegészítéssel (ccABCDE): jelentős külső vérzés keresése, csillapítása, és a nyaki gerinc manuális in line stabilizációja (MILS).',ok:true,fb:'Helyes! Traumánál a katasztrofális vérzés és a nyaki gerinc védelme az első lépés.'},{tx:'Azonnal kiszedem az autóból és a földön ABCDE-t csinálok.',ok:false,fb:'Hibás! A kimentés módja sérülésfüggő, a nyaki gerincet óvni kell.'},{tx:'Megmérem a vérnyomását az autóban.',ok:false,fb:'Hibás! A kritikus vérzés ellátása megelőzi a méréseket.'}]},
{sit:'Katasztrofális vérzést nem találsz. Társad tartja a fejet (MILS). Az "A" vizsgálat következik. A beteg eszméleténél van, de hörög, a légútja részben elzárt. Hogyan nyitod meg?',opts:[{tx:'A fejét erősen hátrahajtom.',ok:false,fb:'Hibás! Nyaki gerincsérülés gyanúja esetén tilos a fej hátrahajtása.'},{tx:'MILS mellett az áll kiemelésével (a fej hátrahajtása nélkül).',ok:true,fb:'Helyes! Traumánál ez a biztonságos légútnyitási technika.'},{tx:'Azonnal merev nyakgallért helyezek fel.',ok:false,fb:'Hibás! A gallér felhelyezése ráér, a légút biztosítása az elsődleges.'}]},
{sit:'A légút megnyílt. A "B" vizsgálatnál a légzésszám 32/perc (szapora). Mit kell feltétlenül megtenned traumás mellkas esetén?',opts:[{tx:'Elengedhetetlen a mellkas megtekintése (lehetőleg a láb felől), és áttapintása (elöl, oldalt, hátul) paradox mozgás, crepitatio, emphysema keresésére.',ok:true,fb:'Helyes! A traumás "B" vizsgálat kötelező fizikai elemei ezek.'},{tx:'Csak fonendoszkóppal meghallgatom a ruhán keresztül.',ok:false,fb:'Hibás! A ruházatot el kell távolítani a megtekintéshez.'},{tx:'Megkérdezem, hogy fáj-e a levegővétel.',ok:false,fb:'Hibás! Az aktív fizikális vizsgálat nem helyettesíthető kérdezéssel.'}]},
{sit:'A jobb mellkasfél nem emelkedik, subcutan emphysemát tapintasz, a nyaki vénák tágak, a beteg hemodinamikailag instabil. Mi a B+ kompetenciájú teendőd haladéktalanul?',opts:[{tx:'Kizárólag oxigént adok és rohanok a kórházba.',ok:false,fb:'Hibás! Az instabil feszülő PTX azonnali beavatkozást igényel.'},{tx:'100% oxigén adása mellett tűvel mellkasi detenzionálást (dekompressziót) végzek az időnyerés céljából.',ok:true,fb:'Helyes! B+ kompetenciába beletartozik a tű dekompresszió kritikus esetben.'},{tx:'Stabil oldalfekvésbe teszem a sérült oldalára.',ok:false,fb:'Hibás! Gerincsérültet nem forgatunk így, és a PTX-et meg kell szúrni.'}]},
{sit:'A detenzionálás után a légzés javul. Jön a "C" vizsgálat. A pulzus 120/perc, sápadt. A medencét is vizsgálnod kell. Milyen módon?',opts:[{tx:'A MEDENCE VIZSGÁLATA SZIGORÚAN TILOS BÁRMILYEN IRÁNYÚ NYOMÁSSAL! Csak a mechanizmus és a ránézés alapján értékelem.',ok:true,fb:'Helyes! Az eljárásrend egyértelműen tiltja a nyomkodást.'},{tx:'Óvatosan megnyomom két oldalról, hogy recseg-e.',ok:false,fb:'Hibás! Szigorúan tilos!'},{tx:'Megkérem, hogy mozgassa a lábait.',ok:false,fb:'Hibás! A mozgatás további sérülést okozhat.'}]},
{sit:'A beteg shockos állapotban van (belső vérzés gyanúja a hasban). B+ kompetenciával milyen párhuzamos tevékenységet delegálsz/végzel a C vizsgálat alatt?',opts:[{tx:'Vénabiztosítást végzek (indokolt esetben), és monitorozom (NIBP, EKG).',ok:true,fb:'Helyes! A vénabiztosítás és monitorozás B+ szintű feladat shock esetén.'},{tx:'Várok az orvosra a vénabiztosítással.',ok:false,fb:'Hibás! B+ ápoló végezheti a vénabiztosítást.'},{tx:'Csak vérnyomást mérek.',ok:false,fb:'Hibás! A folyadék/gyógyszer bejutási kapujának biztosítása is kell.'}]},
{sit:'Következik a "D" (Idegrendszer) vizsgálat. A tudat beszűkült, zavart. Melyik kötelező mérést kell elvégezni megváltozott tudatállapot esetén?',opts:[{tx:'A vércukorszint mérése a vénás kanül tűjéből vett vérből.',ok:true,fb:'Helyes! A D vizsgálat része a vércukormérés.'},{tx:'Alkoholteszteres vizsgálat.',ok:false,fb:'Hibás! Nem ez a prioritás, és az ellátást nem befolyásolja azonnal.'},{tx:'Részletes reflexvizsgálat.',ok:false,fb:'Hibás! Prehospitálisan nem része az elsődleges felmérésnek.'}]},
{sit:'Az "E" (Exposure) vizsgálathoz eltávolítod a ruházatot. Mit kell azonnal megtenned utána?',opts:[{tx:'Azonnali hővédelem (kihűlés elleni védelem) biztosítása.',ok:true,fb:'Helyes! A trauma okozta kihűlés (triász) halálos lehet.'},{tx:'Lemosom a vért a betegről.',ok:false,fb:'Hibás! Ez a kórházi ellátás része, prehospitálisan időveszteség.'},{tx:'Csinálok egy 12-elvezetéses EKG-t.',ok:false,fb:'Hibás! Súlyos sérültnél az eljárásrend szerint nem indokolt az időveszteség miatt.'}]},
{sit:'Az ellátás során a helyszínen időhiány lépett fel. Az eljárásrend alapján melyik vizsgálatot lehet egyértelműen elhagyni súlyos traumás betegnél?',opts:[{tx:'A vércukormérést.',ok:false,fb:'Hibás! A tudatzavar miatt kötelező.'},{tx:'A 12-elvezetéses EKG készítését.',ok:true,fb:'Helyes! Súlyos sérültnél az időveszteség miatt nem indokolt.'},{tx:'A pupillavizsgálatot.',ok:false,fb:'Hibás! A D vizsgálat gyors és fontos eleme.'}]},
{sit:'A beteget a mentőbe teszitek, és elindultok a kórházba. Mi a teendő a betegmozgatás után az eljárásrend szerint?',opts:[{tx:'A szisztematikus ABCDE vizsgálatot az elejéről megismétlem.',ok:true,fb:'Helyes! Betegmozgatás vagy beavatkozás után az ABCDE elölről kezdődik.'},{tx:'Innentől már csak a monitort figyelem.',ok:false,fb:'Hibás! A fizikális vizsgálat isméltése is szükséges.'},{tx:'Kitöltöm a dokumentációt és hagyom pihenni a beteget.',ok:false,fb:'Hibás! A kritikus beteg folyamatos megfigyelést igényel.'}]}
],summary:'Részletes Összefoglaló (Sim 2 - B+ kompetencia): A helyszínbiztonság után a trauma kiegészítés (cABCDE) azonnal megtörtént: MILS (nyaki gerinc rögzítés) és a katasztrofális vérzés keresése. A beteg gépkocsiban ült, így az "A" vizsgálat során a légutat a fej hátrahajtása nélkül, az áll kiemelésével biztosítottuk. A "B" vizsgálatnál a mellkas megtekintése és tapintása során feszülő PTX-re utaló jeleket (subcutan emphysema, aszimmetrikus mozgás) észleltünk. Mivel a beteg instabillá vált, B+ kompetenciával azonnali tű dekompressziót (detenzionálást) hajtottunk végre. A "C" vizsgálat során a medencét csak ránézéssel vizsgáltuk (nyomkodás szigorúan tilos!), a shock jelei miatt vénabiztosítást és monitorozást (EKG, NIBP) kezdtünk. A "D" vizsgálatnál a zavartság miatt kötelező volt a vércukormérés (a vénás tűből). Az "E" vizsgálathoz a ruha eltávolítása után azonnali hővédelmet biztosítottunk, a 12-elvezetéses EKG-t időveszteség miatt mellőztük. A mentőbe mozgatás után a teljes ABCDE vizsgálatot elölről megismételtük.'},

{id:3,title:'3. Szimuláció: Légzési Elégtelenség / Szepszis gyanú (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 70 éves férfihöz riasztanak, aki "fullad". A beteg a fotelban ülve küzd a levegőért. B+ kompetencia (gyógyszerezés, véna).',steps:[
{sit:'A helyszínre érve a beteg meredten ül, légzési segédizmait használja, arca sápadt, ajkai cyanoticusak. Első benyomás alapján ABCD stabil?',opts:[{tx:'Igen, mert eszméleténél van és ül.',ok:false,fb:'Hibás! A tudatosság nem egyenlő a stabilitással.'},{tx:'Nem, kritikus állapotú. Szisztematikus ABCDE vizsgálat szükséges.',ok:true,fb:'Helyes! A cyanosis és a fokozott légzési munka egyértelműen kritikus, instabil állapot.'},{tx:'Igen, mert tud kommunikálni.',ok:false,fb:'Hibás! A fulladó beteg kommunikációja korlátozott és a vitális paraméterei instabilak.'}]},
{sit:'Mivel a beteg vitálisan kritikus (instabil), milyen beavatkozást kell azonnal, már az első állapotfelmérés alatt elkezdeni (párhuzamos tevékenység)?',opts:[{tx:'Csak vénabiztosítást.',ok:false,fb:'Hibás! A hypoxia kezelése az elsődleges.'},{tx:'100%-os belégzési oxigén koncentrációt kell alkalmazni (pl. nem visszalégző, rezervoáros maszkon át).',ok:true,fb:'Helyes! Minden vitálisan kritikus beteg kezdeti oxigénterápiát igényel az eljárásrend szerint.'},{tx:'Azonnal hörgőtágítót fújatni vele.',ok:false,fb:'Hibás! Az oxigénterápia az első, a gyógyszerelés ezután jön.'}]},
{sit:'Az "A" vizsgálat során a légút átjárható. A "B" vizsgálatnál a légzésszám 36/perc. A B vizsgálat melyik további elemét kell elvégezned?',opts:[{tx:'Csak a mellkas kitérésének megtekintése.',ok:false,fb:'Hibás! Az kevés.'},{tx:'Hallgatózás fonendoszkóppal legalább 4 ponton (keresve a sípolást, szörtyzörejt, crepitatiót).',ok:true,fb:'Helyes! A hallgatózás legalább 4 ponton a B vizsgálat elengedhetetlen része.'},{tx:'A mellkas alapos kopogtatása minden irányból.',ok:false,fb:'Hibás! A kopogtatás prehospitálisan gyakran elhagyható.'}]},

{sit:'Következik a "D" vizsgálat. A beteg AVPU alapján "A" (éber), de kimerült. Melyik kötelező paramétert méred meg?',opts:[{tx:'Pupillatágasságot csak ránézéssel.',ok:false,fb:'Hibás! Van egy kötelező eszközös mérés is.'},{tx:'Vércukormérést végzek a vénás kanül tűjéből.',ok:true,fb:'Helyes! A vércukormérés minden kritikus/megváltozott állapotú betegnél kötelező.'},{tx:'Meningealis izgalmi jeleket vizsgálok.',ok:false,fb:'Hibás! Nem tartozik a gyors elsődleges prehospitális felméréshez.'}]},

],summary:'Részletes Összefoglaló (Sim 3 - B+ kompetencia): A kiérkezéskor a légzési segédizmokat használó, cyanoticus beteg egyértelműen kritikus állapotú volt. Az ABCDE vizsgálat alatt párhuzamosan azonnal 100% oxigént alkalmaztunk rezervoáros maszkon. A "B" vizsgálat során a légzésszám magas volt (36/perc), a hallgatózás sípolást igazolt. A "C" vizsgálat tachykardiát mutatott, B+ kompetenciával vénabiztosítást és műszeres monitorozást (EKG, pulzoximéter, vérnyomásmérő) végeztünk. A "D" vizsgálat kötelező elemeként vércukrot mértünk a vénás tűből. Az "E" vizsgálat lázat igazolt, a SAMPLE anamnézis 3 napos fertőzést. A kiszámított NEWS2 pontszám a legmagasabb "Red score" és >=7 kategóriába esett. Mivel a NEWS2 > 5 volt infekció jeleivel, azonnal szepszisre gyanakodtunk. A magas rizikó miatt haladéktalanul segélykocsit (ALS) kértünk. A várakozás alatt folyamatosan monitoroztuk a beteget, és amikor az állapota romlott (eszméletvesztés, szörcsölés), az eljárásrendnek megfelelően az ABCDE-t újra elölről kezdtük, az "A" (légút) szinten váladékleszívással beavatkozva.'},

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+h(i)+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+h(i)+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+h(b.tx)+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+h(s.t)+'</div><div class="step-x">'+h(s.x)+'</div></div></div>').join('');
  if(b.tp==='abadge') return '<div class="abadge"><div class="abcircle" style="background:'+b.color+'">'+b.letter+'</div><span style="font-size:13px;color:#9ca3af">vizsgálat</span></div>';
  if(b.tp==='ftable'){
    var lc={d:'#fca5a5',w:'#fde68a'};
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Jel / hang</th><th>Jelentés</th></tr></thead><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:600;color:'+lc[r.lv]+'">'+h(r.s)+'</td><td style="color:#e5e7eb">'+h(r.m)+'</td></tr>').join('')+'</tbody></table></div>';
  }
  if(b.tp==='avpu'){
    var av=[{l:'A',d:'Alert – Éber',c:'avpu-a'},{l:'V',d:'Verbal – Felszólításra',c:'avpu-v'},{l:'P',d:'Pain – Fájdalomingerre',c:'avpu-p'},{l:'U',d:'Unresponsive – Nem reagál',c:'avpu-u'}];
    return '<div class="g2" style="margin-bottom:.75rem">'+av.map(x=>'<div style="background:#262626;border:1px solid #3f3f3f;border-radius:10px;padding:.5rem .75rem;display:flex;gap:8px;align-items:center"><div style="width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0" class="'+x.c+'">'+x.l+'</div><div style="font-size:12px;color:#d1d5db">'+x.d+'</div></div>').join('')+'</div>';
  }
  if(b.tp==='status3'){
    return '<div class="g3" style="margin-bottom:.75rem">'+
    '<div style="background:#450a0a;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#fca5a5">KERINGÉSMEGÁLLÁS<br>GYANÚJA</div>'+
    '<div style="background:#7f1d1d;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#fecaca">KRITIKUS<br>ÁLLAPOT</div>'+
    '<div style="background:#064e3b;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#bbf7d0">ABCD<br>STABIL</div></div>';
  }
  if(b.tp==='gcs') return renderGCS();
  if(b.tp==='news2score') return renderNEWS2Score();
  if(b.tp==='news2risk') return renderNEWS2Risk();
  if(b.tp==='pedtri') return renderPedTri();
  if(b.tp==='peddiff') return renderPedDiff();
  if(b.tp==='pedparams') return renderPedParams();
  if(b.tp==='formulas') return b.items.map(i=>'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:.45rem .75rem;background:#2e1065;border-radius:8px;margin-bottom:5px"><span style="font-size:12px;color:#a78bfa">'+h(i.l)+':</span><span style="font-size:13px;font-weight:700;color:#c4b5fd;font-family:monospace">'+h(i.f)+'</span></div>').join('');
  if(b.tp==='sample') return renderSAMPLE();
  if(b.tp==='abbrev') return renderAbbrev();
  return '';

var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function gcsInterp(){
var tot=CA.e+CA.v+CA.m;
var lbl=tot>=13?'Enyhe zavartság (≥13)':tot>=9?'Közepes zavartság (9-12)':'Súlyos zavartság / eszméletlenség (≤8)';
var col=tot>=13?'#4ade80':tot>=9?'#fde68a':'#fca5a5';
var bg=tot>=13?'#064e3b':tot>=9?'#451a03':'#450a0a';
return {tot:tot,lbl:lbl,col:col,bg:bg};
}
function calcN2(){
var p=0;
if(CA.rr<=8)p+=3;else if(CA.rr<=11)p+=1;else if(CA.rr<=20)p+=0;else if(CA.rr<=24)p+=1;else p+=3;
if(CA.spo2<=91)p+=3;else if(CA.spo2<=93)p+=2;else if(CA.spo2<=95)p+=1;
if(CA.o2)p+=2;
if(CA.sbp<=90)p+=3;else if(CA.sbp<=100)p+=2;else if(CA.sbp<=110)p+=1;else if(CA.sbp>=220)p+=3;
if(CA.hr<=40)p+=3;else if(CA.hr<=50)p+=1;else if(CA.hr<=90)p+=0;else if(CA.hr<=110)p+=1;else if(CA.hr<=130)p+=2;else p+=3;
p+=CA.c;
if(CA.t<=35.0)p+=3;else if(CA.t<=36.0)p+=1;else if(CA.t<=38.0)p+=0;else if(CA.t<=39.0)p+=1;else p+=2;
return p;
}
function calcPed(){
  let age = CA.page;
  if(age<1) age=1;
  if(age>12) age=12;
  return {norm: 90 + (2*age), min: 70 + (2*age)};
}

function renderCalc(){
var gcsV={adult:[['5','Orientált'],['4','Zavart'],['3','Nem megfelelő szavak'],['2','Érthetetlen hangok'],['1','Nincs']],child:[['5','Együttműködő'],['4','Zavart'],['3','Nem megfelelő szavak'],['2','Érthetetlen hangok'],['1','Nincs']],infant:[['5','Mosolyog, gügyög'],['4','Sír, vigasztalható'],['3','Folyamatos sírás/ordítás'],['2','Nyögés, grunting'],['1','Nincs']]};
var gcsM={adult:[['6','Utasítást végrehajt'],['5','Ingert lokalizál'],['4','Ingert elhárít'],['3','Flexió (dekortikált)'],['2','Extenzió (decerebrált)'],['1','Nincs']],child:[['6','Utasítást végrehajt'],['5','Ingert lokalizál'],['4','Ingert elhárít'],['3','Flexió (dekortikált)'],['2','Extenzió (decerebrált)'],['1','Nincs']],infant:[['6','Spontán, célirányosan'],['5','Érintést elhárít'],['4','Ingert elhárít'],['3','Flexió (dekortikált)'],['2','Extenzió (decerebrált)'],['1','Nincs']]};
var gi=gcsInterp(),n2p=calcN2(),ped=calcPed();
var n2col=n2p>=7?'#fca5a5':n2p>=5?'#fdba74':'#4ade80';
var n2bg=n2p>=7?'#450a0a':n2p>=5?'#431407':'#064e3b';
var n2lbl=n2p>=7?'Magas kockázat':n2p>=5?'Közepes kockázat':'Alacsony kockázat';
var n2rec=n2p>=7?'Azonnali folyamatos monitorozás. Kompetenciaszerinti beavatkozás. Nem megfelelő kompetencia → SEGÉLYKOCSI KÉRÉSE!':n2p>=5?'Azonnali folyamatos eszközös monitorozás. Kompetenciaszerinti beavatkozás. Nem megfelelő kompetencia → segélykocsi.':'Eszközös monitorozás nem szükséges (megfontolható 1-4 pontnál). Tünetek folyamatos követése elengedhetetlen.';

function tabBtn(id,lbl){return '<button onclick="setCalcTab(\''+id+'\')" style="flex:1;padding:.5rem;border:1px solid '+(CA.tab===id?'#14b8a6':'#3f3f3f')+';border-radius:8px;background:'+(CA.tab===id?'#14b8a6':'#2a2a2a')+';color:'+(CA.tab===id?'#111827':'#d1d5db')+';cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">'+lbl+'</button>';}
function modeBtn(id,lbl){return '<button onclick="setGCSMode(\''+id+'\')" style="flex:1;padding:.35rem;border:1px solid '+(CA.mode===id?'#8b5cf6':'#3f3f3f')+';border-radius:7px;background:'+(CA.mode===id?'#8b5cf6':'#2a2a2a')+';color:'+(CA.mode===id?'#fff':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+lbl+'</button>';}
function sel(lb,id,opts,val,fn){return '<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">'+lb+'</div><select id="'+id+'" onchange="'+fn+'(this.value)">'+opts.map(([v,l])=>'<option value="'+v+'" '+(String(v)===String(val)?'selected':'')+'>'+v+' – '+h(l)+'</option>').join('')+'</select></div>';}
function slid(lb,id,mn,mx,st,val,fn,unit){return '<div style="margin-bottom:.65rem"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><div style="font-size:11px;font-weight:600;color:#9ca3af">'+lb+'</div><span id="'+id+'_v" style="font-size:13px;font-weight:700;color:#f3f4f6">'+val+(unit||'')+'</span></div><input type="range" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+val+'" oninput="'+fn+'(this.value)" onchange="'+fn+'(this.value)"></div>';}

return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
'<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tabBtn('gcs','GCS Számító')+tabBtn('news2','NEWS2')+tabBtn('ped','Gyermek RR')+'</div>'+
(CA.tab==='gcs'?
'<div style="display:flex;gap:6px;margin-bottom:.75rem">'+modeBtn('adult','Felnőtt')+modeBtn('child','Gyermek')+modeBtn('infant','Csecsemő')+'</div>'+
sel('Szemnyitás','gce',[['4','Spontán'],['3','Felszólításra'],['2','Fájdalomingerre'],['1','Nincs']],CA.e,'setGCSE')+
sel('Verbális válasz','gcv',gcsV[CA.mode],CA.v,'setGCSV')+
sel('Motoros válasz','gcm',gcsM[CA.mode],CA.m,'setGCSM')+
'<div class="res-box" style="background:'+gi.bg+';border:1px solid '+gi.col+'40"><div class="res-num" style="color:'+gi.col+'">'+gi.tot+'</div><div class="res-lbl" style="color:'+gi.col+'">'+h(gi.lbl)+'</div><div style="font-size:11px;color:#9ca3af">Szem: '+CA.e+' | Verbális: '+CA.v+' | Motor: '+CA.m+'</div></div>'
:
CA.tab==='ped'?
'<div class="card">'+
'<div style="display:flex;justify-content:space-between;margin-bottom:6px"><div style="font-size:13px;font-weight:600;color:#9ca3af">Életkor</div><div id="ped_val" style="font-size:13px;font-weight:700;color:#f3f4f6">'+CA.page+' év</div></div>'+
'<input type="range" min="1" max="12" step="1" value="'+CA.page+'" oninput="setPage(this.value)" onchange="setPage(this.value)">'+
'<div class="res-box" style="background:#172554;border:1px solid #1e3a8a;margin-top:1rem">'+
'<div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Normál szisztolés vérnyomás:</div><div id="ped_norm" style="font-size:32px;font-weight:700;color:#60a5fa;margin-bottom:1rem">'+ped.norm+' Hgmm</div>'+
'<div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Alsó (még tolerabilis) határ:</div><div id="ped_min" style="font-size:24px;font-weight:700;color:#fca5a5">'+ped.min+' Hgmm</div>'+
'</div><div style="font-size:12px;color:#9ca3af;margin-top:1rem;line-height:1.5">A vérnyomásesés gyermekek esetén csak nagyon későn jelentkezik, mely fenyegető kardiovaszkuláris összeomlást jelez. Már enyhén csökkent érték esetén is gyors és agresszív beavatkozás kell.</div></div>'
:
slid('Légzésszám','n2rr',4,40,1,CA.rr,'setN2rr','/perc')+
slid('SpO2','n2spo2',80,100,1,CA.spo2,'setN2spo2','%')+
'<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:4px">Oxigén szükséges?</div>'+
'<div style="display:flex;gap:6px">'+
[['0','Nem (0 pt)'],['1','Igen (+2 pt)']].map(([v,l])=>'<button onclick="setN2o2('+v+')" style="flex:1;padding:6px;border:1px solid '+(CA.o2==v?'#14b8a6':'#3f3f3f')+';border-radius:7px;background:'+(CA.o2==v?'#14b8a6':'#2a2a2a')+';color:'+(CA.o2==v?'#111827':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+h(l)+'</button>').join('')+'</div></div>'+
slid('Szisztolés vérnyomás','n2sbp',60,240,1,CA.sbp,'setN2sbp',' Hgmm')+
slid('Pulzusszám','n2hr',30,180,1,CA.hr,'setN2hr','/perc')+
'<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:4px">Tudatállapot</div>'+
'<div style="display:flex;gap:6px">'+
[['0','Éber / A'],['3','Zavart / V / P / U (+3 pt)']].map(([v,l])=>'<button onclick="setN2c('+v+')" style="flex:1;padding:6px;border:1px solid '+(CA.c==v?'#14b8a6':'#3f3f3f')+';border-radius:7px;background:'+(CA.c==v?'#14b8a6':'#2a2a2a')+';color:'+(CA.c==v?'#111827':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+h(l)+'</button>').join('')+'</div></div>'+
slid('Testhőmérséklet','n2temp',34,42,0.1,CA.t,'setN2temp','°C')+
'<div class="res-box" style="background:'+n2bg+';border:1px solid '+n2col+'40">'+
'<div class="res-num" style="color:'+n2col+'">'+n2p+'</div>'+
'<div class="res-lbl" style="font-weight:700;color:'+n2col+'">'+n2lbl+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:left;margin-top:.35rem">'+h(n2rec)+'</div>'+
(n2p>=5?'<div style="font-size:11px;color:#fdba74;margin-top:.35rem">⚠ Ha infekció jelei is fennállnak: gondolj SZEPSZISRE!</div>':'')+'</div>');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcTab=function(t){CA.tab=t;render();};
window.setGCSMode=function(m){CA.mode=m;CA.e=4;CA.v=5;CA.m=6;render();};
function upGCS(){var gi=gcsInterp();var rb=document.querySelector('.res-box');if(!rb)return;rb.style.background=gi.bg;rb.style.borderColor=gi.col+'40';rb.innerHTML='<div class="res-num" style="color:'+gi.col+'">'+gi.tot+'</div><div class="res-lbl" style="color:'+gi.col+'">'+gi.lbl+'</div><div style="font-size:11px;color:#9ca3af">Szem: '+CA.e+' | Verbális: '+CA.v+' | Motor: '+CA.m+'</div>';}
function upN2(){var n2p=calcN2();var rb=document.querySelector('.res-box');if(!rb)return;var col=n2p>=7?'#fca5a5':n2p>=5?'#fdba74':'#4ade80';var bg=n2p>=7?'#450a0a':n2p>=5?'#431407':'#064e3b';var lbl=n2p>=7?'Magas kockázat':n2p>=5?'Közepes kockázat':'Alacsony kockázat';var rec=n2p>=7?'Azonnali folyamatos monitorozás. Kompetenciaszerinti beavatkozás. Nem megfelelő kompetencia → SEGÉLYKOCSI KÉRÉSE!':n2p>=5?'Azonnali folyamatos eszközös monitorozás. Kompetenciaszerinti beavatkozás. Nem megfelelő kompetencia → segélykocsi.':'Eszközös monitorozás nem szükséges (megfontolható 1-4 pontnál). Tünetek folyamatos követése elengedhetetlen.';rb.style.background=bg;rb.style.borderColor=col+'40';rb.innerHTML='<div class="res-num" style="color:'+col+'">'+n2p+'</div><div class="res-lbl" style="font-weight:700;color:'+col+'">'+lbl+'</div><div style="font-size:12px;color:#9ca3af;text-align:left;margin-top:.35rem">'+h(rec)+'</div>'+(n2p>=5?'<div style="font-size:11px;color:#fdba74;margin-top:.35rem">⚠ Ha infekció jelei is fennállnak: gondolj SZEPSZISRE!</div>':'');var sv=document.getElementById('n2rr_v');if(sv)sv.textContent=CA.rr+'/perc';var sp=document.getElementById('n2spo2_v');if(sp)sp.textContent=CA.spo2+'%';var ss=document.getElementById('n2sbp_v');if(ss)ss.textContent=CA.sbp+' Hgmm';var sh=document.getElementById('n2hr_v');if(sh)sh.textContent=CA.hr+'/perc';var st=document.getElementById('n2temp_v');if(st)st.textContent=CA.t+'°C';}

function upPed(){
  var ped = calcPed();
  var pn = document.getElementById('ped_norm');
  var pm = document.getElementById('ped_min');
  var pv = document.getElementById('ped_val');
  if(pn) pn.textContent = ped.norm + ' Hgmm';
  if(pm) pm.textContent = ped.min + ' Hgmm';
  if(pv) pv.textContent = CA.page + ' év';
}

window.setGCSE=function(v){CA.e=+v;upGCS();};
window.setGCSV=function(v){CA.v=+v;upGCS();};
window.setGCSM=function(v){CA.m=+v;upGCS();};
window.setN2rr=function(v){CA.rr=+v;upN2();};
window.setN2spo2=function(v){CA.spo2=+v;upN2();};
window.setN2o2=function(v){CA.o2=+v;render();};
window.setN2sbp=function(v){CA.sbp=+v;upN2();};
window.setN2hr=function(v){CA.hr=+v;upN2();};
window.setN2c=function(v){CA.c=+v;render();};
window.setN2temp=function(v){CA.t=parseFloat(parseFloat(v).toFixed(1));upN2();};
window.setPage=function(v){CA.page=+v;upPed();};

render();
</script>
</body>
</html>
