<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ Eljárásrend & Szimuláció</title>
<style>
:root {
  --bg-main: #121212;
  --bg-app: #1e1e1e;
  --bg-card: #2a2a2a;
  --text-main: #e5e7eb;
  --text-muted: #9ca3af;
  --accent: #14b8a6;
  --accent-hover: #0d9488;
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --warning: #f59e0b;
  --success: #22c55e;
  --border: #3f3f3f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-main); color: var(--text-main); padding-bottom: 80px; }
.app { max-width: 800px; margin: 0 auto; background: var(--bg-app); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; }

/* Navigation */
.nav { display: flex; background: #242424; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
.nb { flex: 1; padding: 10px 2px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: border-color 0.2s, color 0.2s; color: var(--text-muted); }
.nb:hover { color: var(--text-main); }
.nb.act { border-bottom-color: var(--accent); color: var(--accent); font-weight: bold; }
.ni { font-size: 20px; }
.nl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

/* Content Area */
.ct { padding: 20px; }
h1 { font-size: 22px; color: #fff; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;}
h2 { font-size: 18px; color: var(--accent); margin-top: 15px; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
p { font-size: 14px; line-height: 1.6; margin-bottom: 15px; color: var(--text-muted); }

/* Cards & Buttons */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.btn { display: inline-block; width: 100%; padding: 12px; margin-bottom: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; cursor: pointer; text-align: left; transition: background 0.2s; font-family: inherit; font-weight: 600; }
.btn:hover { background: #333; }
.btn-g { background: var(--accent); color: #111; border: none; text-align: center; font-weight: bold; }
.btn-g:hover { background: var(--accent-hover); }
.btn-r { background: var(--danger); color: #fff; border: none; text-align: center; font-weight: bold; }
.btn-r:hover { background: var(--danger-hover); }
.btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
.btn-row .btn { flex: 1; text-align: center; margin-bottom: 0; }

/* Protocol Elements */
.proto-menu-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 15px; font-weight: bold; cursor: pointer; text-align: left; margin-bottom: 10px; transition: 0.2s; }
.proto-menu-btn:hover { background: #333; border-color: var(--accent); }
.proto-content { display: none; background: #1a1a1a; padding: 15px; border-radius: 0 0 8px 8px; margin-top: -10px; margin-bottom: 15px; border: 1px solid var(--border); border-top: none; }
.proto-sec { border-left: 4px solid var(--accent); padding-left: 12px; margin-bottom: 15px; background: #262626; border-radius: 4px; padding: 12px; }
.proto-title { font-weight: bold; color: var(--accent); margin-bottom: 6px; font-size: 15px; }
.proto-desc { font-size: 13px; color: var(--text-main); line-height: 1.5; margin-bottom: 6px; }
.proto-cond { font-weight: 600; color: #fde68a; font-size: 13px; }
.proto-res { color: #86efac; font-size: 13px; font-weight: bold; margin-top: 4px; }

/* Simulations */
.prog { height: 6px; background: #333; border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
.progb { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
.sim-q { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 15px; line-height: 1.5; }
.opt { width: 100%; display: block; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; color: #d1d5db; background: var(--bg-card); transition: 0.2s; line-height: 1.4; }
.opt:hover { background: #374151; }
.opt-ok { background: #064e3b !important; border-color: #059669 !important; color: #ecfdf5 !important; cursor: default !important; }
.opt-no { background: #7f1d1d !important; border-color: #b91c1c !important; color: #fef2f2 !important; cursor: default !important; opacity: 0.8; }
.al { border-radius: 8px; padding: 15px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; }
.al-s { background: #064e3b; color: #bbf7d0; border: 1px solid #065f46; }
.al-d { background: #450a0a; color: #fecaca; border: 1px solid #7f1d1d; }
.res-box { background: #172554; border: 1px solid #1e3a8a; border-radius: 8px; padding: 20px; text-align: center; margin-top: 15px; margin-bottom: 15px; }
.res-num { font-size: 36px; font-weight: bold; color: #60a5fa; margin-bottom: 5px; }

/* Dictionary */
.fw { border-bottom: 1px dotted var(--accent); color: var(--accent); cursor: pointer; font-weight: 600; transition: color 0.2s; }
.fw:hover { color: var(--accent-hover); }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(2px); }
.modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
.modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; line-height: 1; }
.modal-close:hover { color: #fff; }

/* Calculators */
input[type=number], input[type=range], select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-main); background: #1a1a1a; font-size: 14px; margin-bottom: 15px; }
input[type=number]:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.2); }
input[type=range] { padding: 0; height: 6px; accent-color: var(--accent); }
label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Home Grid */
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
.home-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; color: var(--text-main); text-decoration: none; display: flex; flex-direction: column; align-items: center; }
.home-btn:hover { background: #333; border-color: var(--accent); transform: translateY(-3px); }
.home-icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app">
<nav class="nav" id="nav">
<button class="nb act" onclick="go('home')"><span class="ni">🏠</span><span class="nl">Főoldal</span></button>
<button class="nb" onclick="go('protocols')"><span class="ni">📋</span><span class="nl">Eljárásrend</span></button>
<button class="nb" onclick="go('sim')"><span class="ni">🚑</span><span class="nl">Szimuláció</span></button>
<button class="nb" onclick="go('calc')"><span class="ni">🧮</span><span class="nl">Kalkulátor</span></button>
</nav>
<div class="ct" id="ct"></div>
</div>

<div class="modal-overlay" id="dictModal" onclick="closeDef(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeDef(event)">&times;</button>
    <h3 id="dictTitle" style="color:var(--accent); margin-top:0; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:5px;">Szó</h3>
    <p id="dictDesc" style="color:#e5e7eb; font-size:14px; line-height:1.6; margin:0;">Magyarázat</p>
  </div>
</div>

function fwt(text) {
  var words = Object.keys(DICT);
  var re = new RegExp('\\b(' + words.join('|') + ')\\b', 'gi');
  return text.replace(re, function(match) {
    return '<span class="fw" onclick="showDef(\'' + match.toLowerCase() + '\')">' + match + '</span>';
  });
}

function showDef(word) {
  document.getElementById('dictTitle').innerText = word.toUpperCase();
  document.getElementById('dictDesc').innerText = DICT[word];
  document.getElementById('dictModal').style.display = 'flex';
}

function closeDef(e) {
  if (e.target.id === 'dictModal' || e.target.classList.contains('modal-close')) {
    document.getElementById('dictModal').style.display = 'none';
  }
}

    p.items.forEach(i => {

          <div class="proto-title">${fwt(i.t)}</div>
          <div class="proto-desc">${fwt(i.c)}</div>
      `;
      if (i.a) html += `<div class="proto-cond">${fwt(i.a)}</div>`;
      if (i.r) html += `<div class="proto-res">${fwt(i.r)}</div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

window.toggleProto = function(idx) {
  const el = document.getElementById('proto_' + idx);
  const icon = document.getElementById('icon_' + idx);
  if (el.style.display === 'block') {
    el.style.display = 'none';
    icon.innerText = '+';
  } else {
    el.style.display = 'block';
    icon.innerText = '−';
  }
};

function renderSim() {
  if (SI.id === null) {
    let html = '<h1>Szimulációs Esetek</h1><p>Gyakorlati szituációk mentőápolói kompetenciaszinteken. Minden eset pontosan 10 lépésből áll.</p>';
    SIMS.forEach((s) => {
      html += `
        <button class="btn" style="text-align:left; padding:15px;" onclick="startSim(${s.id})">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span style="font-weight:bold; color:#fff; font-size:15px;">${s.title}</span>
            <span style="font-size:11px; background:var(--accent); color:#111; padding:2px 6px; border-radius:4px;">${s.diff}</span>
          </div>
          <div style="font-size:13px; color:var(--text-muted);">${s.desc}</div>
        </button>
      `;
    });
    return html;
  }

  const sim = SIMS.find(s => s.id === SI.id);
  
  if (SI.fin) {
    const correct = SI.hist.filter(h => sim.steps[h.step].opts[h.oi].ok).length;
    return `
      <h1>${sim.title} - Eredmény</h1>
      <div class="res-box">
        <div class="res-num">${correct}/${sim.steps.length}</div>
        <div style="font-size:14px; font-weight:600; color:var(--accent);">Helyes Döntés</div>
      </div>
      <div class="card" style="border-left: 4px solid var(--accent);">
        <h3 style="margin-top:0; color:var(--accent);">Részletes Összefoglaló:</h3>
        <p style="margin-bottom:0; color:var(--text-main);">${fwt(sim.summary)}</p>
      </div>
      <button class="btn btn-g" onclick="resetSim()">Vissza az esetekhez</button>
    `;
  }

  const step = sim.steps[SI.step];
  let html = `
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <span style="font-weight:bold; color:var(--accent); font-size:15px;">${sim.title}</span>
      <span style="font-size:13px; color:var(--text-muted); font-weight:bold;">${SI.step + 1} / ${sim.steps.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((SI.step + 1) / sim.steps.length * 100)}%;"></div></div>
    
    <div class="card" style="border-left: 4px solid var(--accent); padding:15px;">
      <p class="sim-q">${fwt(step.q)}</p>
    </div>
  `;

  step.opts.forEach((opt, i) => {
    let cls = 'opt';
    if (SI.chosen !== null) {
      if (opt.ok) cls += ' opt-ok';
      else if (i === SI.chosen && !opt.ok) cls += ' opt-no';
    }
    html += `<button class="${cls}" ${SI.chosen === null ? `onclick="chooseSim(${i})"` : 'disabled'}>${fwt(opt.t)}</button>`;
  });

  if (SI.chosen !== null) {
    const isOk = step.opts[SI.chosen].ok;
    html += `
      <div class="al ${isOk ? 'al-s' : 'al-d'}">
        <strong>${isOk ? '✓ Helyes!' : '✗ Hibás!'}</strong><br>
        ${fwt(step.opts[SI.chosen].f)}
      </div>
      <button class="btn btn-g" onclick="nextSim()">${SI.step < sim.steps.length - 1 ? 'Következő Kérdés →' : 'Eredmények Megtekintése'}</button>
    `;
  }

  return html;
}

function renderCalc() {
  const tabBtn = (id, lbl) => `<button onclick="CA.tab='${id}'; render();" class="btn" style="margin-bottom:0; background:${CA.tab===id ? 'var(--accent)' : 'var(--bg-card)'}; color:${CA.tab===id ? '#111' : '#fff'}; border-color:${CA.tab===id ? 'var(--accent)' : 'var(--border)'}; font-weight:bold;">${lbl}</button>`;
  
  let html = '<h1>Kalkulátor & Pontozók</h1><div class="btn-row" style="margin-bottom:20px;">' + tabBtn('gcs', 'GCS (Tudat)') + tabBtn('ped', 'Gyermek Paraméterek') + '</div>';

  if (CA.tab === 'gcs') {
    html += `
      <div class="card">
        <label>Szemnyitás (E):</label>
        <select id="c_gcs_e" onchange="calcGCS()">
          <option value="4" ${CA.gcs_e===4?'selected':''}>4 - Spontán</option>
          <option value="3" ${CA.gcs_e===3?'selected':''}>3 - Felszólításra</option>
          <option value="2" ${CA.gcs_e===2?'selected':''}>2 - Fájdalomingerre</option>
          <option value="1" ${CA.gcs_e===1?'selected':''}>1 - Nincs</option>
        </select>
        
        <label>Verbális válasz (V):</label>
        <select id="c_gcs_v" onchange="calcGCS()">
          <option value="5" ${CA.gcs_v===5?'selected':''}>5 - Orientált</option>
          <option value="4" ${CA.gcs_v===4?'selected':''}>4 - Zavart beszéd</option>
          <option value="3" ${CA.gcs_v===3?'selected':''}>3 - Nem adekvát szavak</option>
          <option value="2" ${CA.gcs_v===2?'selected':''}>2 - Érthetetlen hangok</option>
          <option value="1" ${CA.gcs_v===1?'selected':''}>1 - Nincs</option>
        </select>
        
        <label>Motoros válasz (M):</label>
        <select id="c_gcs_m" onchange="calcGCS()">
          <option value="6" ${CA.gcs_m===6?'selected':''}>6 - Utasítást végrehajt</option>
          <option value="5" ${CA.gcs_m===5?'selected':''}>5 - Célzott elhárítás (Lokalizál)</option>
          <option value="4" ${CA.gcs_m===4?'selected':''}>4 - Célzatlan elhárítás (Flexió)</option>
          <option value="3" ${CA.gcs_m===3?'selected':''}>3 - Kóros flexió (Dekortikált)</option>
          <option value="2" ${CA.gcs_m===2?'selected':''}>2 - Kóros extenzió (Decerebrált)</option>
          <option value="1" ${CA.gcs_m===1?'selected':''}>1 - Nincs</option>
        </select>
      </div>
      <div class="res-box">
        <div id="gcs_res_num" class="res-num">15</div>
        <div id="gcs_res_lbl" style="font-size:16px; font-weight:bold; color:var(--success);">Normál</div>
      </div>
    `;
    setTimeout(calcGCS, 0);
  } else if (CA.tab === 'ped') {
    html += `
      <div class="card">
        <label>Életkor: <span id="ped_age_lbl" style="color:var(--accent); font-size:18px;">${CA.ped_age}</span> év</label>
        <input type="range" id="c_ped_age" min="1" max="12" step="1" value="${CA.ped_age}" oninput="calcPed()">
      </div>
      <div class="g2">
        <div class="card" style="border-left: 4px solid var(--accent); margin-bottom:0; padding:15px;">
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">Normál szisztolés vérnyomás:</div>
          <div id="ped_res_sys" style="font-size:24px; font-weight:bold; color:var(--accent);"></div>
        </div>
        <div class="card" style="border-left: 4px solid var(--danger); margin-bottom:0; padding:15px;">
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">Alsó tolerábilis határ:</div>
          <div id="ped_res_min" style="font-size:24px; font-weight:bold; color:var(--danger);"></div>
        </div>
        <div class="card" style="border-left: 4px solid var(--warning); margin-bottom:0; padding:15px;">
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">Pulzus (/perc):</div>
          <div id="ped_res_hr" style="font-size:20px; font-weight:bold; color:var(--warning);"></div>
        </div>
        <div class="card" style="border-left: 4px solid var(--success); margin-bottom:0; padding:15px;">
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">Légzésszám (/perc):</div>
          <div id="ped_res_rr" style="font-size:20px; font-weight:bold; color:var(--success);"></div>
        </div>
      </div>
      <div class="al al-d" style="margin-top:15px;">A gyermekek vérnyomásesése nagyon későn jelentkezik (fenyegető kardiovaszkuláris összeomlás!). Már az alsó határnál is gyors és agresszív beavatkozás szükséges.</div>
    `;
    setTimeout(calcPed, 0);
  }
  
  return html;
}

window.calcGCS = function() {
  CA.gcs_e = parseInt(document.getElementById('c_gcs_e').value);
  CA.gcs_v = parseInt(document.getElementById('c_gcs_v').value);
  CA.gcs_m = parseInt(document.getElementById('c_gcs_m').value);
  const sum = CA.gcs_e + CA.gcs_v + CA.gcs_m;
  document.getElementById('gcs_res_num').innerText = 'GCS: ' + sum;
  
  const lbl = document.getElementById('gcs_res_lbl');
  if (sum <= 8) { lbl.innerText = '(Súlyos zavar / Kóma)'; lbl.style.color = 'var(--danger)'; document.getElementById('gcs_res_num').style.color = 'var(--danger)'; }
  else if (sum <= 12) { lbl.innerText = '(Közepes zavar)'; lbl.style.color = 'var(--warning)'; document.getElementById('gcs_res_num').style.color = 'var(--warning)'; }
  else { lbl.innerText = '(Enyhe / Normál)'; lbl.style.color = 'var(--success)'; document.getElementById('gcs_res_num').style.color = 'var(--accent)'; }
};

window.calcPed = function() {
  CA.ped_age = parseInt(document.getElementById('c_ped_age').value);
  document.getElementById('ped_age_lbl').innerText = CA.ped_age;
  
  const normSys = 90 + (2 * CA.ped_age);
  const minSys = 70 + (2 * CA.ped_age);
  let hr = "", rr = "";
  
  if(CA.ped_age <= 2) { hr="100-150"; rr="25-35"; }
  else if(CA.ped_age <= 5) { hr="90-140"; rr="25-30"; }
  else if(CA.ped_age <= 12) { hr="80-130"; rr="20-25"; }
  
  document.getElementById('ped_res_sys').innerText = normSys + ' Hgmm';
  document.getElementById('ped_res_min').innerText = minSys + ' Hgmm';
  document.getElementById('ped_res_hr').innerText = hr;
  document.getElementById('ped_res_rr').innerText = rr;
};

function go(scr) {
  SCR = scr;
  render();
}

function startSim(id) {
  SI = { id: id, step: 0, chosen: null, hist: [], fin: false };
  render();
}

function chooseSim(idx) {
  if (SI.chosen !== null) return;
  SI.chosen = idx;
  SI.hist.push({ step: SI.step, oi: idx });
  render();
}

function nextSim() {
  const sim = SIMS.find(s => s.id === SI.id);
  if (SI.step < sim.steps.length - 1) {
    SI.step++;
    SI.chosen = null;
  } else {
    SI.fin = true;
  }
  render();
}

function resetSim() {
  SI = { id: null, step: 0, chosen: null, hist: [], fin: false };
  render();
}

function render() {
  const ct = document.getElementById('ct');
  if (SCR === 'home') ct.innerHTML = renderHome();
  else if (SCR === 'protocols') ct.innerHTML = renderProtocols();
  else if (SCR === 'sim') ct.innerHTML = renderSim();
  else if (SCR === 'calc') ct.innerHTML = renderCalc();
  
  const tabs = ['home', 'protocols', 'sim', 'calc'];
  document.querySelectorAll('.nb').forEach((b, i) => {
    if(tabs[i] === SCR) {
      b.classList.add('act');
    } else {
      b.classList.remove('act');
    }
  });
  window.scrollTo(0, 0);
}

// Inicializálás
render();
</script>
</body>
</html>
