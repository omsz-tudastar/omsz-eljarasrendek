const escapedTerms = Object.keys(DICT).sort((a,b)=>b.length - a.length).map(t => t.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
const dictRegex = new RegExp(`(^|[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ])(${escapedTerms.join('|')})(?=[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]|$)`, 'gi');

function gl(html) {
  if (typeof html !== 'string') return '';
  let parts = html.split(/(<[^>]*>)/);
  for(let i=0; i<parts.length; i++) {
    if(!parts[i].startsWith('<')) {
      parts[i] = parts[i].replace(dictRegex, (match, p1, p2) => {
        let key = Object.keys(DICT).find(k => k.toLowerCase() === p2.toLowerCase());
        if(key) return `${p1}<span class="tag-dict" onclick="openModal('${key}')">${p2}</span>`;
        return match;
      });
    }
  }
  return parts.join('');
}

function openModal(key) {
  document.getElementById('modTitle').innerText = key;
  document.getElementById('modDesc').innerText = DICT[key];

function closeModal(e, force=false) {

var CARDS=[
{cat:'Definíció és Tünettan',f:'Mit jelent az ACS rövidítés, és mely kórképeket foglalja magában?',b:'Akut Coronaria Szindróma.\n\nMagában foglalja a szívizom heveny vérellátási zavara miatt kialakult instabil angina pectorist és a myocardialis infarctust.'},
{cat:'Definíció és Tünettan',f:'Kiknél fordulnak elő leggyakrabban ATÍPUSOS infarktus tünetek?',b:'Nőknél, diabeteses betegeknél, időseknél, krónikus veseelégteleneknél, demens vagy anaemiás betegeknél.'},
{cat:'Betegvizsgálat',f:'Mennyi időn belül KELL elkészülnie a 12-elvezetéses EKG-nak a helyszínen?',b:'Az első EKG-nak a betegellátás megkezdésétől számított 10 PERCEN BELÜL el kell készülnie.'},

{cat:'Oxigénterápia',f:'Mikor adunk oxigént ACS gyanús betegnek, és mi a cél-szaturáció?',b:'RUTINSZERŰEN NEM ADUNK OXIGÉNT!\n\nCsak akkor adandó, ha az SpO2 90% alatti.\nA cél oxigénszaturáció: 90-92%.\n\nOka: a hyperoxia érszűkületet (vasoconstrictiót) okoz.'},
{cat:'EKG Diagnosztika',f:'Melyek az általános STEMI kritériumok az EKG-n?',b:'Új ST-eleváció (STE) két vagy több összetartozó elvezetésben:\nÁltalánosan: 1 mm vagy nagyobb\nV2-V3-ban: Nőknél 1,5 mm vagy nagyobb; Férfiaknál 2 mm vagy nagyobb (40 év felett) vagy 2,5 mm vagy nagyobb (40 év alatt).'},
{cat:'EKG Diagnosztika',f:'Mit vizsgál a Sgarbossa kritériumrendszer?',b:'Bal Tawara-szár blokk (BTSZB) megléte esetén segít azonosítani az akut myocardialis infarktust (STEMI-t).\n\nHa a pontszám eléri a 3-at, igen nagy specificitással jelez AMI-t.'},
{cat:'STEMI Ellátás',f:'Mi a nitroglicerin prehospitális KONTRAINDIKÁCIÓJA?',b:'Szignifikáns aorta stenosis, 30 Hgmm-nél nagyobb vérnyomásesés az első adagra, jobb kamrai infarctus gyanúja (inferior STEMI esetén V3R-V4R elvezetés kell előtte!), foszfodiészteráz-5 gátló szedése (pl. Viagra, Cialis) 48 órán belül.'},
{cat:'STEMI Ellátás',f:'Melyik a JOBB KAMRAI infarktus specifikus klinikai triásza?',b:'1. Hypotensio\n2. Kisvérköri pangás HIÁNYA (tiszta tüdő)\n3. Emelkedett jugularis vénás nyomás (tág nyaki vénák)'},
{cat:'STEMI Ellátás',f:'Hogyan kezeljük a jobb kamrai infarktust prehospitálisan?',b:'Lapos fektetés, alsó végtagok felpolcolása.\nFolyadékbólusok (250 ml intravénásan) a preload emelésére.\nNITRÁT ADÁSA SZIGORÚAN KONTRAINDIKÁLT!'},
{cat:'NSTE-ACS Ellátás',f:'Mik a prehospitálisan felismerendő URGENS (2 órán belüli PCI-t igénylő) invazív indikációk NSTE-ACS esetén?',b:'Életveszélyes ritmuszavar vagy keringésleállás, hemodinamikai instabilitás vagy shock, terápiarezisztens angina szívelégtelenséggel, állandósult, kezelésre nem szűnő fájdalom, dinamikus ST-T eltérések (intermittáló STE).'},
{cat:'Általános Ellátás',f:'Adható-e prehospitálisan Béta-blokkoló?',b:'Prehospitális adása ACS-ben rutinszerűen NEM JAVASOLT (még sinus tachycardia esetén sem).'},

{sit:'Hogyan viszed le a beteget a mentőautóhoz a második emeletről?',opts:[{tx:'Lépcsőn lesétáltatom, mert könnyebb.',ok:false,fb:'Hibás! Szigorú mozgástilalom van.'},{tx:'Hordszéken vagy hordágyon, teljes mozgástilalmat biztosítva a vizsgálat és a szállítás alatt végig.',ok:true,fb:'Helyes! A fizikai aktivitás növeli az oxigénigényt, ami súlyosbítja a szívizominfarktust.'},{tx:'A beteg felállhat a székből a hordágyig.',ok:false,fb:'Hibás! Még azt is el kell kerülni.'}]},
{sit:'A szállítás során a beteg hirtelen eszméletét veszti. A monitoron kamrafibrilláció látható. Mi az azonnali B+ szintű teendő?',opts:[{tx:'Gyorsítok a kórház felé.',ok:false,fb:'Hibás! A ritmuszavar azonnali ellátást igényel.'},{tx:'Félreállunk a mentővel, azonnal megkezdem az alapszintű újraélesztést (kompresszió) és az AED segítségével defibrillálok.',ok:true,fb:'Helyes! Keringésleállás esetén a protokoll a szokásos újraélesztés és defibrillálás.'},{tx:'Adok neki Lidocaint.',ok:false,fb:'Hibás! A defibrilláció és a kompresszió az elsődleges.'}]},
{sit:'Sikeres defibrillálás után a beteg keringése visszatér. A célintézménybe érkeztek. Milyen formában adod át a beteget?',opts:[{tx:'ISBAR séma szerint, maximum 10-15 perc alatt.',ok:true,fb:'Helyes! Az átadás rövid kell hogy legyen, a séma pedig kötelező.'},{tx:'Részletesen elmesélve a helyszínt, akár 30 perc alatt.',ok:false,fb:'Hibás! Az átadás nem tarthat sokáig.'},{tx:'Csak odaadom a papírt és megyek.',ok:false,fb:'Hibás! A korrekt szóbeli ISBAR átadás kötelező.'}]}
],summary:'A helyszínre érkezéskor a beteg megfelelő pozícionálása, ABCDE felmérés és EKG elkészítése az első lépés. Oxigént nem adtunk, mivel a szaturáció (95%) a 90% feletti limiten volt. A vérnyomást mindkét karon megmértük az aorta dissectio kizárása érdekében. A 12-elvezetéses EKG 10 percen belül elkészült, Anterior STEMI-t igazolt. Haladéktalanul felvettük a kapcsolatot a TTEKG-n keresztül a PCI laborral. B+ kompetenciával vénát biztosítottunk, és orvosi konzultáció után 300 mg ASA-t, valamint Klopidogrelt adtunk. Mivel a szisztolés vérnyomás magasabb volt 160 Hgmm-nél, nyelv alatti nitroglicerint alkalmaztunk a fájdalomcsillapításra. A randevú elvet alkalmaztuk a transzport megszervezéséhez: nem vártunk a helyszínen, elindultunk a PCI központba. A mozgástilalom fenntartása kritikus volt a szállításnál. Útközben fellépő ritmuszavar (kamrafibrilláció) esetén azonnali alapszintű újraélesztés és AED használat történt, végül ISBAR séma szerint adtuk át a beteget maximum 15 perc alatt.'},

{id:2,title:'2. Szimuláció: Jobb kamrai STEMI (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 60 éves nő alsó fali (Inferior) STEMI gyanújával fekszik a földön. Fájdalma nagy. Vérnyomása alacsony (95/60 Hgmm). Mentőápoló vagy gyógyszerelési felhatalmazással (B+ szint).',steps:[
{sit:'A helyszínen a 12-elvezetéses EKG Inferior STEMI-t (II, III, aVF eleváció) mutat. Mit KELL tenned a jobb kamrai infarktus gyanújának tisztázására?',opts:[{tx:'Újabb EKG-t készítek a V3R és V4R (jobb oldali mellkasi) elvezetésekkel.',ok:true,fb:'Helyes! Inferior STEMI esetén a jobb kamrai elvezetések vizsgálata kötelező.'},{tx:'Meghallgatom a tüdőt, és ha szörcsöl, akkor jobb kamrai infarktus.',ok:false,fb:'Hibás! A tüdő szörcsölése a BAL kamrai infarktus (pangás) jele. Jobb kamrainál a tüdő tiszta.'},{tx:'Nem teszek semmit, elindulok a kórházba.',ok:false,fb:'Hibás! Az iránydiagnózis meghatározása fontos a terápiához.'}]},
{sit:'A V3R-V4R elvezetésekben 1 mm-es ST-eleváció látható. A beteg tiszta tüdejű, vérnyomása 95/60 Hgmm. Nyaki vénái tágak. Mi a diagnózis?',opts:[{tx:'Tüdőembólia.',ok:false,fb:'Hibás! Van EKG bizonyíték a STEMI-re.'},{tx:'Jobb kamrai infarktussal szövődött Inferior STEMI.',ok:true,fb:'Helyes! A klinikai triász (hypotensio, tiszta tüdő, tág nyaki vénák) és a V3R STE ezt igazolja.'},{tx:'Aorta dissectio.',ok:false,fb:'Hibás! A klinikum nem ezt mutatja.'}]},
{sit:'A beteg nagy mellkasi fájdalomra panaszkodik. A protokoll és a B+ kompetencia alapján adhatsz-e Nitroglicerin spray-t?',opts:[{tx:'Igen, a fájdalomcsillapítás a legfontosabb.',ok:false,fb:'Hibás!'},{tx:'Szigorúan TILOS nitrátot adni, mert a jobb kamrai infarktus preload csökkentésére (amire a nitrát hat) végzetes hypotensióval reagálhat!',ok:true,fb:'Helyes! Ez a nitrát adás egyik legfőbb kontraindikációja.'},{tx:'Igen, de csak fele adagot.',ok:false,fb:'Hibás! Teljesen kontraindikált.'}]},
{sit:'Hogyan pozicionálod a beteget az állapotra való tekintettel?',opts:[{tx:'Teljesen felültetem, hogy jobban kapjon levegőt.',ok:false,fb:'Hibás! A felültetés rontja a vénás visszaáramlást (preload), ami hypotensiót okoz.'},{tx:'Lapos fektetés, az alsó végtagok felpolcolásával a jobb szívfél preloadjának emelése érdekében.',ok:true,fb:'Helyes! A jobb kamrai infarktus preload függő, így a vénás visszaáramlást segíteni kell.'},{tx:'Oldalfekvésbe teszem.',ok:false,fb:'Hibás! Nincs ilyen indikáció.'}]},
{sit:'A vérnyomása 85/50 Hgmm-re csökken. Milyen folyadékterápiát alkalmazol B+ szinten?',opts:[{tx:'Szigorú folyadékmegvonás, nehogy tüdőödéma legyen.',ok:false,fb:'Hibás! A tüdő tiszta, a jobb kamrának kell a volumen.'},{tx:'Folyadékbólusokat adok (250 ml krisztalloid formájában intravénásan).',ok:true,fb:'Helyes! A specifikus kezelés a jobb szívfél preload emelése folyadékkal.'},{tx:'Vízhajtó adása.',ok:false,fb:'Hibás! Preload csökkentők adása tilos.'}]},
{sit:'A folyadék adása után a vérnyomás javul, 105/65 Hgmm lesz. A TTEKG konzultáció megtörténik. A PCI centrum vállalja a beteget. Milyen orális gyógyszert adhatsz a szállításhoz előkészítve (orvosi engedéllyel)?',opts:[{tx:'Béta-blokkolót a pulzus csökkentésére.',ok:false,fb:'Hibás! Béta-blokkoló adása rutinszerűen nem javasolt.'},{tx:'ASA-t (150-300 mg) és Klopidogrelt (300-600 mg).',ok:true,fb:'Helyes! A preload stabilizálása után a specifikus ACS alvadásgátlás következik.'},{tx:'Morfint adok szájon át.',ok:false,fb:'Hibás! A morfin intravénás szer és nem B+ kompetencia.'}]},
{sit:'Mivel a beteg vérnyomása ingatag, kérsz-e segélykocsit (MOK-ot)?',opts:[{tx:'Igen, a randevú elvet alkalmazva a PCI labor felől, mivel vazopresszor támogatás válhat szükségessé.',ok:true,fb:'Helyes! Jobb kamrai shock esetén orvosi/tiszti szintű gyógyszeres keringéstámogatás kellhet.'},{tx:'Nem, B+ szinten simán beviszem, mert adtam neki 250 ml folyadékot.',ok:false,fb:'Hibás! A beteg nagyon magas rizikójú.'},{tx:'Inkább itthon hagyom, amíg stabilizálódik.',ok:false,fb:'Hibás! Az időfaktor a legfontosabb.'}]},
{sit:'Mit tegyél a betegruházattal a szállítás előtt?',opts:[{tx:'Nem nyúlok hozzá.',ok:false,fb:'Hibás! A vizsgálathoz is el kell távolítani.'},{tx:'A ruházatot meglazítom, ill. az indokolt mértékig eltávolítom (szabad hozzáférés).',ok:true,fb:'Helyes! Ez az Általános Teendők része.'},{tx:'Teljesen levetkőztetem meztelenre.',ok:false,fb:'Hibás! Felesleges és kihűlést okozhat.'}]},
{sit:'A transzport 30 percet vesz igénybe. Milyen gyakran végzel újraértékelést a mentőben?',opts:[{tx:'Egyszer, induláskor.',ok:false,fb:'Hibás!'},{tx:'Folyamatos obszerváció, monitorozás és az életjelek (ABCDE) rendszeres újraértékelése szükséges.',ok:true,fb:'Helyes! A folyamatos obszerváció kötelező.'},{tx:'Csak ha a beteg jelez.',ok:false,fb:'Hibás! Szoros obszerváció szükséges.'}]},
{sit:'A kórházba érve a mentésirányító már intézte a fogadóhelyet. A szállítási idő rövidsége miatt mi az átadás protokollja?',opts:[{tx:'Nem sietünk, kényelmesen leírunk mindent.',ok:false,fb:'Hibás!'},{tx:'A beteg átadása, átvétele nem tarthat 10-15 percnél tovább!',ok:true,fb:'Helyes! A protokoll szigorúan rögzíti ezt a limitet STEMI esetén.'},{tx:'Azonnal újabb EKG-t csinálunk a mentőben mielőtt betoljuk.',ok:false,fb:'Hibás! Felesleges időveszteség.'}]}
],summary:'Az Inferior STEMI EKG képe azonnal szükségessé tette a jobb oldali elvezetések (V3R-V4R) felhelyezését. Az ST eleváció ezen elvezetésekben igazolta a jobb kamrai infarktust. A klinikai kép (alacsony vérnyomás, tiszta tüdő, tág nyaki vénák) szintén ezt támasztotta alá. Ekkor a legfontosabb teendő a preload biztosítása volt: a beteget laposan, emelt lábakkal fektettük, Nitroglicerin adását (mivel a vérnyomás esését és shockot okozhatna) szigorúan elkerültük. B+ szinten 250 ml krisztalloid bólust adtunk intravénásan a vérnyomás stabilizálására. A gyógyszerelés (ASA, Klopidogrel) orvosi egyeztetés után megtörtént. Az instabilitás miatt randevú elvű emelt szintű segélykocsit kértünk a PCI irányába haladva. A ruházatot meglazítottuk, folyamatos monitorozás mellett haladtunk. A kórházi átadás célzottan rövid, maximum 10-15 perc alatt zajlott le.'},

{id:3,title:'3. Szimuláció: Atípusos NSTE-ACS (B kompetencia)',diff:'B kompetencia',desc:'Egy 75 éves, demens, cukorbeteg nőhöz hívnak az éjszaka közepén, aki csak erős epigastrialis (gyomortáji) fájdalomra, hányingerre és izzadásra panaszkodik. Mentőápoló (B szint, nincs gyógyszerelési jog).',steps:[
{sit:'A beteg cukorbeteg és idős. Az epigastrialis fájdalom alapján felmerül-e benned az ACS gyanúja?',opts:[{tx:'Nem, ez biztosan csak egy gyomorrontás.',ok:false,fb:'Hibás! Időseknél és diabeteseseknél a hasi fájdalom gyakori atípusos ACS tünet.'},{tx:'Igen, mivel időseknél, nőknél, és diabeteseseknél az ACS gyakran jelentkezik atípusos formában (pl. epigastrialis fájdalom, hányinger).',ok:true,fb:'Helyes! Az atípusos tüneteket komolyan kell venni ACS gyanúként.'},{tx:'Csak ha bal karba sugárzik a fájdalom, akkor lehet infarktus.',ok:false,fb:'Hibás! Nem mindig sugárzik a karba.'}]},
{sit:'Az ABCDE vizsgálat alatt az "A" és "B" rendben van, SpO2 96%. "C" vizsgálat: vérnyomás 140/85 Hgmm mindkét karon, pulzus 90/perc. B szintűként mi az eljárás a "D" (Idegrendszer) résznél?',opts:[{tx:'Megnézem az AVPU-t és vércukrot mérek.',ok:true,fb:'Helyes! Cukorbeteg, zavart, vagy atípusos tünetes betegnél kötelező a vércukormérés.'},{tx:'Nem teszek semmit.',ok:false,fb:'Hibás! Fontos differenciáldiagnosztikai lépés a vércukor.'},{tx:'Adok neki vizet inni.',ok:false,fb:'Hibás! Szájon át tilos itatni, és még nem is mértél cukrot.'}]},
{sit:'A vércukor normál. Elkészíted a 12-elvezetéses EKG-t. ST-eleváció nincs, de a V4-V6-ban T-hullám inverzió (negatív T) látszik. Mi a következő kötelező lépés B szinten?',opts:[{tx:'Önállóan beadok neki Nitroglicerin spray-t.',ok:false,fb:'Hibás! B kompetenciával önállóan nitrátot nem adhatsz.'},{tx:'Transztelefonikus EKG (TTEKG) konzultációt végzek, mivel ez B szinten ACS gyanú esetén kötelező.',ok:true,fb:'Helyes! A TTEKG küldése és a konzultáció az iránydiagnózis és elhelyezés alapja.'},{tx:'Azonnal PCI laborba indulok.',ok:false,fb:'Hibás! Nincs STEMI, az elhelyezést a konzultáció dönti el.'}]},
{sit:'A kardiológus NSTE-ACS-t valószínűsít, és kéri, hogy vigyétek be a területileg illetékes SBO-ra vagy Kardiológiára. Mivel B szintű vagy, milyen gyógyszert adhatsz a helyszínen ASA formájában?',opts:[{tx:'Önállóan, protokollból beadom az ASA-t.',ok:false,fb:'Hibás! B szint nem adhat gyógyszert önállóan, csak B+.'},{tx:'Orvosi (telefonos) utasításra, a kontraindikációk tisztázását követően (és a javasló orvos nevét dokumentálva) szájon át rágathatok el ASA-t.',ok:true,fb:'Helyes! Ez az eljárásrendi kiskapu a B kompetencia számára az alapgyógyszerhez.'},{tx:'A B ápoló soha nem adhat ASA-t.',ok:false,fb:'Hibás! Telefonos orvosi utasításra megteheti.'}]},
{sit:'Az orvos utasít 300 mg ASA elrágatására. Kérdezi a kontraindikációkat. Mi NEM kontraindikációja az ASA adásának az eljárásrend szerint?',opts:[{tx:'A hatóanyaggal szembeni ismert allergia.',ok:false,fb:'Hibás! Ez kontraindikáció.'},{tx:'Aktív belszervi (pl. gyomor) vérzés.',ok:false,fb:'Hibás! Ez kontraindikáció.'},{tx:'A beteg orális alvadásgátlót szed és éppen menstruál.',ok:true,fb:'Helyes! Az orális alvadásgátló és a menstruáció önmagában nem ellenjavallata az ASA adásának.'}]},
{sit:'Adhatsz-e vénát ennek a betegnek a jelenlegi paraméterek mellett (vérnyomás 140/85, stabil hemodinamika) B szinten?',opts:[{tx:'Igen, minden ACS gyanús kap vénát.',ok:false,fb:'Hibás! B szinten a véna indikációja szűk.'},{tx:'Nem, B kompetenciával rendelkező mentőápoló kizárólag folyadékpótlás céljából (hypotonia, keringési elégtelenség) biztosíthat vénát.',ok:true,fb:'Helyes! Mivel a vérnyomás stabil, B szinten tilos vénát szúrni pusztán vérvételi vagy gyógyszeres előkészületi céllal.'},{tx:'Igen, orvosi engedéllyel.',ok:false,fb:'Hibás! A kompetencia a hipotóniához köti a vénaszúrást B szinten.'}]},
{sit:'A fájdalom továbbra is jelen van, de a beteg stabil. Mi a teendőd a segélykocsival (MOK) kapcsolatban?',opts:[{tx:'Mindenképpen kérek egy MOK-ot, mert fáj a hasa.',ok:false,fb:'Hibás! Stabil beteg indokolatlan segélykocsi kérése csúsztatja a kórházi érkezést.'},{tx:'Stabil állapotú NSTE-ACS beteg esetén is mérlegelhető segélykocsi, de csak akkor, ha ez indokolatlanul nem növeli a kórházba érkezés idejét.',ok:true,fb:'Helyes! Az idő nyereség és veszteség mérlegelése a diszpécserrel egyeztetve a legfontosabb szempont.'},{tx:'Soha nem kérünk mentőtisztet stabil beteghez.',ok:false,fb:'Hibás! A mérlegelés joga és kötelessége fennáll.'}]},
{sit:'Döntötök, hogy nem kértek segélykocsit, hanem azonnal indultok az SBO-ra. Miközben a mentőbe teszitek, a beteg kéri, hogy sétálhasson, mert az jobban esik.',opts:[{tx:'Megengedem, mert az idős emberek nehezen tolerálják a hordágyat.',ok:false,fb:'Hibás! Szigorú mozgástilalom.'},{tx:'Nem engedem meg, teljes mozgástilalmat tartunk fenn, hordszéken vagy hordágyon visszük a mentőhöz.',ok:true,fb:'Helyes! Az ischaemiás terület oxigénigényének csökkentése miatt a mozgás tilos.'},{tx:'Csak egy pár lépést tehet.',ok:false,fb:'Hibás! Semennyit nem sétálhat.'}]},
{sit:'A szállítás közben a beteg hirtelen nehezen kezd lélegezni, a vérnyomása 80/50 Hgmm-re esik, sápadt lesz és izzad. Mi ez a változás az NSTE-ACS betegek csoportosításában?',opts:[{tx:'Pánikroham.',ok:false,fb:'Hibás! A paraméterek romlása organikus okot jelez.'},{tx:'Urgens invazív ellátást (2 órán belüli) igénylő instabilitás (hemodinamikai romlás vagy shock jelei) alakult ki.',ok:true,fb:'Helyes! A hirtelen instabilitás urgens PCI indikációt jelent.'},{tx:'Csak a vércukra esett le.',ok:false,fb:'Hibás! Nincs adat rá, a keringésomlás az elsődleges feltevés ACS-ben.'}]},
{sit:'A kialakult hypotensio és urgens indikáció esetén mik az azonnali B szintű tennivalók?',opts:[{tx:'Elkészítem az új EKG-t.',ok:false,fb:'Hibás! A hemodinamikai instabilitást kell azonnal kezelni, nem a papírokat gyártani.'},{tx:'A hypotensio miatt vénát biztosítok (most már B szinten is lehetséges, folyadékpótlás céljából), elkezdem a folyadékbólusokat, újbóli TTEKG konzultáció a PCI labor felé, és emelt szintű segélykocsit/randevút kérek.',ok:true,fb:'Helyes! A hipotónia bekapcsolja a vénaszúrási jogot, a shock miatt randevú és célkórház módosítás (SBO helyett PCI) kell.'},{tx:'Célkórház marad az SBO, csak gyorsabban megyek.',ok:false,fb:'Hibás! Az urgens indikáció miatt azonnali PCI kell, nem az SBO a megfelelő hely.'}]}
],summary:'Az idős, cukorbeteg hölgynél az epigastrialis panaszok és az ájulásérzés egyértelműen atípusos ACS gyanút vetettek fel. B szintű ellátóként elvégeztük az ABCDE felmérést és a vércukormérést. Az EKG (nincs STE, csak negatív T) után kötelező volt a TTEKG küldése és a konzultáció. Oxigént nem adtunk (SpO2 96%). B kompetenciával vénát csak hypotensio esetén szúrhatunk, ami ekkor nem állt fenn. Gyógyszert (ASA) kizárólag telefonos orvosi utasításra, a kontraindikációk (amelyek közé az alvadásgátló vagy menstruáció NEM tartozik) kizárása után adhattunk. Stabil állapotában a segélykocsit mérlegelve az azonnali SBO transzport mellett döntöttünk teljes mozgástilalom mellett. A transzport során a beteg sokkos állapotba (vérnyomás 80/50 Hgmm) került, ami urgens PCI indikációvá léptette elő az esetet. Ekkor a kialakult hypotensio jogalapot adott a vénabiztosításra, emelt szintű randevút kértünk, és az útirányt a PCI labor felé módosítottuk.'},

{id:4,title:'4. Szimuláció: Kardiogén shock és Újraélesztés (B kompetencia)',diff:'B kompetencia',desc:'Egy 65 éves nőhöz hívnak, aki a férje elmondása szerint erős mellkasi fájdalom után összeesett. Az alapellátó (BLS / B kompetencia) egység elsőként érkezik a helyszínre.',steps:[
{sit:'A helyszínbiztonság ellenőrzése után a beteghez lépsz. Hanyatt fekszik, mozdulatlan. Mi az első vizsgáló lépés?',opts:[{tx:'Azonnal megkezdem a mellkasi kompressziókat.',ok:false,fb:'Hibás! Előbb meg kell vizsgálni a reakcióképességet és a légzést.'},{tx:'Hangosan megszólítom és megrázom a vállát, hogy reagál-e.',ok:true,fb:'Helyes! A reakcióképesség felmérése az elsődleges.'},{tx:'Megmérem a pulzusát a csuklóján.',ok:false,fb:'Hibás! A protokoll a reakcióképesség és a hármas érzékelés felmérését írja elő.'}]},
{sit:'A beteg semmilyen ingerre nem reagál. Haladéktalanul segélykocsit (esetkocsi/ROKO) kérsz. Ezt követően felszabadítod a légutat (fej hátra, áll emelése). A 10 másodperces hármas érzékelés alatt nincs légzés. Mit teszel B kompetenciával?',opts:[{tx:'Azonnal megkezdem a mellkasi kompressziókat, és a társam felhelyezi az AED-t (félautomata defibrillátor).',ok:true,fb:'Helyes! Keringésmegállás esetén a BLS (alapszintű újraélesztés) megkezdése és a korai defibrilláció a legfontosabb.'},{tx:'Elkezdek lélegeztetni ballonnal.',ok:false,fb:'Hibás! Felnőttnél a kompresszió élvez prioritást az újraélesztés megkezdésekor.'},{tx:'Vénát szúrok gyógyszeradáshoz.',ok:false,fb:'Hibás! B szinten nincs vénaszúrás gyógyszerhez, és a kompresszió sokkal fontosabb.'}]},

{sit:'A harmadik sokk leadása és a kompressziók folytatása után a beteg elkezd mozogni, a keringése visszatér (ROSC). Lélegzik, de az SpO2 értéke csak 85%. Mi az oxigénterápia szabálya ebben az esetben?',opts:[{tx:'A hypoxaemia miatt oxigént adok, a cél a 90-92% elérése.',ok:true,fb:'Helyes! Bár az oxigén rutinszerűen nem adható ACS-ben, 90% alatti szaturáció esetén kötelező a cél eléréséig.'},{tx:'Nem adok oxigént, mert a hyperoxia érszűkületet okoz.',ok:false,fb:'Hibás! Ez igaz, de 85%-os SpO2 esetén a hypoxia súlyosabb károkat okoz.'},{tx:'Mindenképpen 100% oxigént adok folyamatosan.',ok:false,fb:'Hibás! A cél a 90-92%, a tartós hyperoxia rontja a túlélést.'}]},
{sit:'A "C" (keringés) vizsgálata során a beteg pulzusa tapintható, de a vérnyomása csupán 80/50 Hgmm (hypotensio). B kompetenciájú ápolóként mit tehetsz a vénabiztosítás tekintetében?',opts:[{tx:'Nem tehetek semmit, meg kell várnom az esetkocsit.',ok:false,fb:'Hibás! B kompetenciával is van lehetőség beavatkozásra ilyenkor.'},{tx:'Vénabiztosítást végzek, mivel a folyadékpótlás céljából hypotonia esetén a B szintű mentőápoló is jogosult vénát szúrni.',ok:true,fb:'Helyes! A protokoll egyértelműen megengedi a vénabiztosítást B szinten hypotonia/keringési elégtelenség esetén.'},{tx:'Vénát szúrok, és önállóan gyógyszert (adrenalint) adok.',ok:false,fb:'Hibás! Gyógyszerelésre B szinten nincs jogosultság.'}]},
{sit:'A vérnyomás alacsony, a beteg kardiogén shockban van. Az eljárásrend szerint mikor kell elkészíteni a 12-elvezetéses EKG-t?',opts:[{tx:'Csak ha a beteg magához tér és panaszai vannak.',ok:false,fb:'Hibás! A reanimált beteg EKG vizsgálata kötelező.'},{tx:'Amint lehetséges, de legkésőbb a megérkezéstől/ROSC-tól számított 10 percen belül.',ok:true,fb:'Helyes! A 10 perces EKG időablak szigorú szabály.'},{tx:'A mentőautóban útközben.',ok:false,fb:'Hibás! Még a helyszínen kell elkészülni az iránydiagnózishoz.'}]},
{sit:'Az EKG elkészült. Bár nincs egyértelmű ST-eleváció, a beteg sikeresen reanimált. Mit mond az eljárásrend a sikeresen reanimált betegekről ACS szempontjából?',opts:[{tx:'Egyéb STEMI ekvivalensnek tekintendők (panaszok vagy első sokkolandó ritmus alapján), így urgens PCI indikációt képeznek.',ok:true,fb:'Helyes! A reanimált beteg (pl. kamrafibrilláció után) STEMI ellátási utat igényel.'},{tx:'Csak obszervációt igényelnek a helyi belgyógyászaton.',ok:false,fb:'Hibás! Sürgős katéteres vizsgálat szükséges.'},{tx:'Várni kell a laboreredményekre (troponin) az indulás előtt.',ok:false,fb:'Hibás! Szigorúan tilos az időveszteség.'}]},

{sit:'A mentésirányítás jelzi, hogy a megkért MOK (Mentőorvosi Kocsi) úton van, és a PCI labor is fogadja a beteget. Hogyan alkalmazod a randevú elvet?',opts:[{tx:'Megkezdem a szállítást a PCI centrum irányába, és útközben találkozom a MOK-kal az időnyerés érdekében.',ok:true,fb:'Helyes! A PCI centrumba érés idejének minimalizálása a legfontosabb, a randevú ezt szolgálja.'},{tx:'Megvárom a MOK-ot a helyszínen a biztonság kedvéért.',ok:false,fb:'Hibás! Tiszta időveszteség egy időkritikus betegnél.'},{tx:'Lemondom a MOK-ot, mert a betegnek már van keringése.',ok:false,fb:'Hibás! A kardiogén shock és a reanimáció utáni állapot emelt szintű (ALS) kíséretet és esetleges vazopresszor/inotróp támogatást igényel.'}]},
{sit:'A PCI központba érkezéskor mi a legfontosabb szabály a beteg átadásakor?',opts:[{tx:'A beteg átadása ISBAR séma szerint történjen, és ne tarthasson tovább 10-15 percnél.',ok:true,fb:'Helyes! A gyors, strukturált, maximum 15 perces átadás az ACS protokoll kritikus eleme.'},{tx:'Az orvos írásos jelentését kell csak odaadni.',ok:false,fb:'Hibás! A szóbeli, strukturált átadás kötelező.'},{tx:'Addig kell maradni, amíg a laboreredmények meg nem érkeznek.',ok:false,fb:'Hibás! Az átadás után a mentőegység felszabadul, nem várnak a laborra.'}]}
],summary:'A kiérkező B kompetenciájú (alapszintű) egység a helyszínbiztonság után azonnal megállapította az eszméletlenséget és a légzés hiányát. Haladéktalanul emelt szintű segélykocsit kértek, majd megkezdték az újraélesztést (mellkasi kompressziók és AED használata). Az AED sokk javaslata és leadása után azonnal folytatták a kompressziót. A sikeres újraélesztés (keringés visszatérése) után az alacsony oxigénszaturáció (85%) miatt oxigént alkalmaztak a 90-92%-os cél eléréséig. A "C" vizsgálat hypotensiót (vérnyomás 80/50 Hgmm) igazolt. B kompetenciával, kihasználva a protokoll nyújtotta lehetőséget, a shock miatt vénát biztosítottak folyadékpótlás céljából. A 10 percen belül elkészült EKG és a sikeres reanimáció ténye STEMI ekvivalens (urgens PCI) iránydiagnózist eredményezett, amit a TTEKG konzultáció megerősített. Az alacsony vérnyomás miatt nitroglicerin adása szigorúan tilos volt. A beteg szállítását azonnal megkezdték a PCI központ felé teljes mozgástilalom mellett, és a randevú elvet alkalmazva útközben vették fel a mentőorvosi kocsit (MOK). A kórházba érkezve az átadás ISBAR séma alapján, rendkívül gyorsan, kevesebb mint 15 perc alatt megtörtént.'}
];

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+gl(h(b.tx))+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+gl(h(i))+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr"><div style="flex-shrink:0;font-weight:bold;">✓</div><div style="flex:1;">'+gl(h(i))+'</div></div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+gl(h(b.tx))+'</div>';
  if(b.tp==='note') return '<div class="note">'+gl(h(b.tx))+'</div>';
  return '';
}

'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#ef4444':'#3f3f3f')+';background:'+(FC.cat===c?'#ef4444':'#2a2a2a')+';color:'+(FC.cat===c?'#fff':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+

'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+

var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#ef4444"></div></div>'+

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+gl(h(s.desc))+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br><br>'+gl(h(sim.summary))+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+gl(h(st.sit))+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+gl(h(opt.tx))+'</div><div style="font-size:11px;color:#9ca3af">'+gl(h(opt.fb))+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+gl(h(sim.desc))+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+gl(h(step.sit))+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+gl(h(opt.tx))+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+gl(h(step.opts[SI.chosen].fb))+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

// Calcs
window.upCalcO2 = function() {
  let rb = document.getElementById('o2_res_box');
  if(!rb) return;
  let spo2 = CA.o2_spo2;
  let o2_req = (spo2 < 90);
  let status = o2_req ? "Azonnali oxigénterápia (titrálva) javasolt!" : "Oxigénterápia RUTINSZERŰEN NEM INDOKOLT!";
  let bg = o2_req ? "#450a0a" : "#064e3b";
  let fg = o2_req ? "#fca5a5" : "#4ade80";
  
  rb.style.background = bg;
  rb.style.borderColor = fg + '40';
  rb.innerHTML = `<div class="res-num" style="color:${fg};font-size:24px;">${status}</div><div style="font-size:13px;color:#9ca3af;margin-top:10px;">Cél oxigénszaturáció: <b>90-92%</b> (Hyperoxia elkerülése érszűkítő hatása miatt).</div>`;
};

window.setSpo2 = function(val) {
  CA.o2_spo2 = parseInt(val);
  let disp = document.getElementById('o2_v');
  if(disp) disp.innerText = CA.o2_spo2 + '%';
  upCalcO2();
};

window.upSgarbossa = function() {
  let rb = document.getElementById('sgarbossa_res_box');
  if(!rb) return;
  let pts = (CA.sg_a ? 5 : 0) + (CA.sg_b ? 3 : 0) + (CA.sg_c ? 2 : 0);
  let bg = pts >= 3 ? "#450a0a" : "#172554";
  let fg = pts >= 3 ? "#ef4444" : "#60a5fa";
  let txt = pts >= 3 ? "IGEN NAGY VALÓSZÍNŰSÉGGEL AKUT MI (STEMI gyanú)!" : "A kritériumok nem egyértelműek (konzultáció javasolt).";
  
  rb.style.background = bg;
  rb.style.borderColor = fg + '40';
  rb.innerHTML = `<div class="res-num" style="color:${fg};font-size:32px;">${pts} pont</div><div style="font-size:14px;color:${fg};font-weight:700;margin-top:5px;">${txt}</div>`;
};

function renderCalc(){
function tabBtn(id,lbl){return '<button onclick="setCalcTab(\''+id+'\')" style="flex:1;padding:.5rem;border:1px solid '+(CA.tab===id?'#ef4444':'#3f3f3f')+';border-radius:8px;background:'+(CA.tab===id?'#ef4444':'#2a2a2a')+';color:'+(CA.tab===id?'#fff':'#d1d5db')+';cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">'+lbl+'</button>';}

let initPts = (CA.sg_a ? 5 : 0) + (CA.sg_b ? 3 : 0) + (CA.sg_c ? 2 : 0);
let sgBg = initPts >= 3 ? "#450a0a" : "#172554";
let sgFg = initPts >= 3 ? "#ef4444" : "#60a5fa";
let sgTxt = initPts >= 3 ? "IGEN NAGY VALÓSZÍNŰSÉGGEL AKUT MI (STEMI gyanú)!" : "A kritériumok nem egyértelműek (konzultáció javasolt).";

let initO2Req = (CA.o2_spo2 < 90);
let o2Status = initO2Req ? "Azonnali oxigénterápia (titrálva) javasolt!" : "Oxigénterápia RUTINSZERŰEN NEM INDOKOLT!";
let o2Bg = initO2Req ? "#450a0a" : "#064e3b";
let o2Fg = initO2Req ? "#fca5a5" : "#4ade80";

return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
'<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tabBtn('sgarbossa','Sgarbossa Kritériumok')+tabBtn('oxygen','SpO2 / O2 Cél')+'</div>'+
(CA.tab==='sgarbossa'?
'<div class="card"><div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:10px;">Bal Tawara-szár blokk (BTSZB) esetén. Jelöld be az EKG-n látottakat:</div>'+
'<label style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;cursor:pointer;"><input type="checkbox" style="margin-top:3px;transform:scale(1.2);accent-color:#ef4444;" '+(CA.sg_a?'checked':'')+' onchange="CA.sg_a=this.checked;upSgarbossa()"> <span style="font-size:13px;color:#d1d5db;"><b>A kritérium (5 pont):</b> 1 mm-nél nagyobb ST-eleváció, pozitív QRS komplexum mellett bármely elvezetésben.</span></label>'+
'<label style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;cursor:pointer;"><input type="checkbox" style="margin-top:3px;transform:scale(1.2);accent-color:#ef4444;" '+(CA.sg_b?'checked':'')+' onchange="CA.sg_b=this.checked;upSgarbossa()"> <span style="font-size:13px;color:#d1d5db;"><b>B kritérium (3 pont):</b> 1 mm-nél nagyobb ST-depresszió, negatív QRS komplexum mellett a V1-V3 elvezetésekben.</span></label>'+
'<label style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;cursor:pointer;"><input type="checkbox" style="margin-top:3px;transform:scale(1.2);accent-color:#ef4444;" '+(CA.sg_c?'checked':'')+' onchange="CA.sg_c=this.checked;upSgarbossa()"> <span style="font-size:13px;color:#d1d5db;"><b>C kritérium (2 pont):</b> 5 mm-nél nagyobb ST-eleváció, negatív QRS komplexum mellett.</span></label>'+
'<div id="sgarbossa_res_box" class="res-box" style="background:'+sgBg+';border:1px solid '+sgFg+'40"><div class="res-num" style="color:'+sgFg+';font-size:32px;">'+initPts+' pont</div><div style="font-size:14px;color:'+sgFg+';font-weight:700;margin-top:5px;">'+sgTxt+'</div></div></div>'
:
'<div class="card"><div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:10px;">Beteg SpO2 szaturációja oxigén nélkül (%):</div>'+
'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span id="o2_v" style="font-size:24px;font-weight:700;color:#f3f4f6">'+CA.o2_spo2+'%</span></div><input type="range" min="70" max="100" step="1" value="'+CA.o2_spo2+'" oninput="setSpo2(this.value)" onchange="setSpo2(this.value)"><br><br>'+
'<div id="o2_res_box" class="res-box" style="background:'+o2Bg+';border:1px solid '+o2Fg+'40"><div class="res-num" style="color:'+o2Fg+';font-size:24px;">'+o2Status+'</div><div style="font-size:13px;color:#9ca3af;margin-top:10px;">Cél oxigénszaturáció: <b>90-92%</b> (Hyperoxia elkerülése érszűkítő hatása miatt).</div></div></div>');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcTab=function(t){CA.tab=t;render();};

render();
</script>
</body>
</html>
