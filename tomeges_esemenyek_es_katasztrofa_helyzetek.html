<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ – Tömeges Események Eljárásrend</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;}
.app{max-width:680px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);position:relative;}

/* NAV */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.nb{flex:1;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#f59e0b;}
.ni{font-size:16px;}
.nl{font-size:9px;color:#9ca3af;font-weight:400;}
.nb.act .nl{color:#f59e0b;font-weight:600;}

/* CONTENT */
.ct{padding:1rem;}

/* CARDS */
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}

/* ALERTS & LISTS */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
.note{font-size:12px;color:#9ca3af;padding:.5rem .75rem;background:#262626;border-radius:8px;margin-bottom:.5rem;line-height:1.5;border:1px solid #333;}
.sub{font-size:13px;font-weight:600;color:#d1d5db;margin:.75rem 0 .35rem;}

ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.3rem;padding-left:0.2rem;}

/* JAVÍTOTT FORMÁZÁS: Széteső szövegek ellen (flex layout fix) */
.kr{display:flex;gap:10px;align-items:flex-start;padding:.6rem .75rem;background:#451a0320;border-radius:8px;margin-bottom:6px;font-size:13px;color:#d1d5db;line-height:1.55;border-left:3px solid #f59e0b;}
.kr-icon{flex-shrink:0;color:#f59e0b;font-weight:bold;margin-top:2px;}
.kr-text{flex:1;}

.step-wrap{display:flex;gap:10px;margin-bottom:10px;}
.step-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#f59e0b;color:#111827;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.step-body{flex:1;background:#262626;border-radius:8px;padding:.5rem .75rem;}
.step-t{font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:.2rem;}
.step-x{font-size:12px;color:#9ca3af;line-height:1.6;white-space:pre-line;}

/* TABLES */
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:6px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:6px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;}
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}

/* PROGRESS */
.prog{height:4px;background:#333;border-radius:2px;margin-bottom:1rem;}
.progb{height:4px;border-radius:2px;transition:width .3s;}

/* BUTTONS */
.btn{padding:.55rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;transition:all .15s;}
.btn:hover{background:#374151;}
.btn-g{background:#d97706;color:#fff;border-color:#d97706;}
.btn-g:hover{background:#b45309;}
.btn-r{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn-v{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.btn-b{background:#2563eb;color:#fff;border-color:#2563eb;}
.btn-fw{width:100%;display:block;text-align:center;padding:.75rem;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;text-align:center;}

/* QUIZ OPTIONS */
.opt{width:100%;display:block;padding:.7rem 1rem;margin-bottom:7px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}

/* FLIP CARD */
.flip{border:2px solid #3f3f3f;border-radius:12px;padding:1.5rem;min-height:175px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:.75rem;background:#262626;}
.flip.on{border-color:#a78bfa;}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}

/* RESULT */
.res-box{border-radius:12px;padding:1rem;text-align:center;margin-top:.75rem;}
.res-num{font-size:42px;font-weight:700;}
.res-lbl{font-size:14px;margin:.3rem 0;}

/* INPUTS */
input[type=range], input[type=number]{width:100%;accent-color:#f59e0b;background:transparent;border:1px solid #4b5563;border-radius:8px;padding:8px;color:#e5e7eb;font-family:inherit;background:#2a2a2a;}
input[type=range]{padding:0;border:none;height:20px;}
select{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #4b5563;background:#2a2a2a;font-size:13px;color:#e5e7eb;font-family:inherit;}

/* TAGS */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.tag-g{background:#064e3b;color:#ecfdf5;}
.tag-y{background:#78350f;color:#fef3c7;}

/* TRIAGE COLORS */
.tri-red{background:#b91c1c;color:#fff;border:none;}
.tri-yel{background:#eab308;color:#000;border:none;}
.tri-grn{background:#16a34a;color:#fff;border:none;}
.tri-blu{background:#2563eb;color:#fff;border:none;}
.tri-blk{background:#000;color:#fff;border:1px solid #fff;}

/* HOME GRID */
.home-mod{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;color:#e5e7eb;}
.home-mod:hover{background:#333;border-color:#4b5563;transform:translateY(-1px);}
.home-mod-icon{font-size:26px;margin-bottom:6px;}
.home-mod-title{font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:2px;}
.home-mod-desc{font-size:11px;color:#9ca3af;line-height:1.4;}

/* CHAPTER LIST */
.ch-row{display:flex;align-items:center;gap:10px;background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.75rem 1rem;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.ch-row:hover{background:#333;}

/* MODAL / TOOLTIPS */
.term { color: #f59e0b; text-decoration: underline; text-decoration-style: dotted; cursor: pointer; font-weight: 600; transition: color 0.2s; }
.term:hover { color: #fbbf24; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease-in-out; }
.modal-content { background: #262626; border: 1px solid #3f3f3f; padding: 1.5rem; border-radius: 12px; max-width: 400px; width: 90%; color: #f3f4f6; position: relative; transform: translateY(20px); transition: transform 0.2s ease-in-out; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.modal-overlay.show { opacity: 1; }
.modal-overlay.show .modal-content { transform: translateY(0); }
.modal-close { position: absolute; top: 12px; right: 15px; background: none; border: none; color: #9ca3af; font-size: 26px; cursor: pointer; line-height: 1; padding: 0; }
.modal-close:hover { color: #f3f4f6; }

@media(max-width:480px){.tbl-wrap table{min-width:340px;}}
</style>
</head>
<body>
<div class="app">
<nav class="nav" id="nav">
<button class="nb act" onclick="go('home')"><span class="ni">🏠</span><span class="nl">Főoldal</span></button>
<button class="nb" onclick="go('chapters')"><span class="ni">📚</span><span class="nl">Eljárásrend</span></button>
<button class="nb" onclick="go('flash')"><span class="ni">🃏</span><span class="nl">Kártyák</span></button>
<button class="nb" onclick="go('quiz')"><span class="ni">❓</span><span class="nl">Kvíz</span></button>
<button class="nb" onclick="go('sim')"><span class="ni">🚑</span><span class="nl">Szimuláció</span></button>

</nav>

<div class="ct" id="ct"></div>

<div class="modal-overlay" id="dictModal" onclick="closeModal(event)">

    <button class="modal-close" onclick="closeModal(null, true)">&times;</button>

function w(term, displayStr) {
  return '<span class="term" onclick="showModal(\'' + term + '\')">' + (displayStr || term) + '</span>';
}

function showModal(term) {
  var d = DICT[term];
  if(!d) return;
  document.getElementById('modalTitle').innerText = term;
  document.getElementById('modalDesc').innerText = d;
  var m = document.getElementById('dictModal');
  m.style.display = 'flex';
  setTimeout(function(){ m.classList.add('show'); }, 10);
}

function closeModal(e, force) {
  if(force || (e && e.target.id === 'dictModal')) {
    var m = document.getElementById('dictModal');
    m.classList.remove('show');
    setTimeout(function(){ m.style.display = 'none'; }, 200);
  }
}

// ── UTILITIES ──────────────────────────────────────────────────────
function h(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Render content blocks
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  // Use direct insertion for items since they might contain w() HTML spans
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  // Fix the 'kr' flex layout to prevent text from falling under the checkmark
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr"><span class="kr-icon">✓</span><div class="kr-text">'+i+'</div></div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+h(b.tx)+'</div>';
  if(b.tp==='ftable'){
    var lc={d:'#fca5a5',w:'#fde68a',s:'#bbf7d0',i:'#bfdbfe',dk:'#9ca3af'};
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Jelzés</th><th>Kategória / Jelentés</th></tr></thead><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:600;color:'+lc[r.lv]+'">'+h(r.s)+'</td><td style="color:#e5e7eb">'+h(r.m)+'</td></tr>').join('')+'</tbody></table></div>';
  }
  return '';
}

// ── SCREENS ────────────────────────────────────────────────────────
function renderHome(){

var card=filtered[Math.min(FC.idx,filtered.length-1)];

'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#f59e0b':'#3f3f3f')+';background:'+(FC.cat===c?'#f59e0b':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+

function renderQuiz(){
if(QZ.done){

return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+h(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+h(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+h(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#f59e0b"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+h(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs Esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Részletes Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

// CALC LOGIC
function trtsCalc(rr, sbp, gcs){
  let score = parseInt(rr) + parseInt(sbp) + parseInt(gcs);
  let tri = score === 0 ? 'Halott' : (score <= 10 ? 'T1' : (score === 11 ? 'T2' : 'T3'));
  let col = tri === 'T1' ? 'tri-red' : tri === 'T2' ? 'tri-yel' : tri === 'T3' ? 'tri-grn' : 'tri-blk';
  let tName = tri === 'T1' ? 'Azonnali (Piros)' : tri === 'T2' ? 'Sürgős (Sárga)' : tri === 'T3' ? 'Halasztható (Zöld)' : 'Halott (Fekete)';
  return {s:score, tri:tri, c:col, tn:tName};
}

function renderCalc(){
function tabBtn(id,lbl){return '<button onclick="setCalcTab(\''+id+'\')" style="flex:1;padding:.5rem;border:1px solid '+(CA.tab===id?'#f59e0b':'#3f3f3f')+';border-radius:8px;background:'+(CA.tab===id?'#f59e0b':'#2a2a2a')+';color:'+(CA.tab===id?'#111827':'#d1d5db')+';cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">'+lbl+'</button>';}

if(!CA.rr) CA.rr="4"; if(!CA.sbp) CA.sbp="4"; if(!CA.gcs) CA.gcs="4";
let trts = trtsCalc(CA.rr, CA.sbp, CA.gcs);

return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
'<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tabBtn('start','START / JumpSTART')+tabBtn('trts','TRTS Kalkulátor')+'</div>'+

(CA.tab==='trts' ?
  '<div class="card"><div style="font-size:12px;color:#9ca3af;margin-bottom:10px;">Másodlagos triage számítás a Sérültgyűjtőhelyen. Válassza ki az értékeket:</div>'+
  '<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">Légzésszám (/perc)</div><select onchange="CA.rr=this.value;render()">'+
  '<option value="4" '+(CA.rr==="4"?'selected':'')+'>10-29 (4 pont)</option>'+
  '<option value="3" '+(CA.rr==="3"?'selected':'')+'>&gt;29 (3 pont)</option>'+
  '<option value="2" '+(CA.rr==="2"?'selected':'')+'>6-9 (2 pont)</option>'+
  '<option value="1" '+(CA.rr==="1"?'selected':'')+'>1-5 (1 pont)</option>'+
  '<option value="0" '+(CA.rr==="0"?'selected':'')+'>0 (0 pont)</option>'+
  '</select></div>'+
  '<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">Szisztolés vérnyomás (Hgmm)</div><select onchange="CA.sbp=this.value;render()">'+
  '<option value="4" '+(CA.sbp==="4"?'selected':'')+'>&ge;90 (4 pont)</option>'+
  '<option value="3" '+(CA.sbp==="3"?'selected':'')+'>76-89 (3 pont)</option>'+
  '<option value="2" '+(CA.sbp==="2"?'selected':'')+'>50-75 (2 pont)</option>'+
  '<option value="1" '+(CA.sbp==="1"?'selected':'')+'>1-49 (1 pont)</option>'+
  '<option value="0" '+(CA.sbp==="0"?'selected':'')+'>0 (0 pont)</option>'+
  '</select></div>'+
  '<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">Glasgow Coma Scale (GCS)</div><select onchange="CA.gcs=this.value;render()">'+
  '<option value="4" '+(CA.gcs==="4"?'selected':'')+'>13-15 (4 pont)</option>'+
  '<option value="3" '+(CA.gcs==="3"?'selected':'')+'>9-12 (3 pont)</option>'+
  '<option value="2" '+(CA.gcs==="2"?'selected':'')+'>6-8 (2 pont)</option>'+
  '<option value="1" '+(CA.gcs==="1"?'selected':'')+'>4-5 (1 pont)</option>'+
  '<option value="0" '+(CA.gcs==="0"?'selected':'')+'>3 (0 pont)</option>'+
  '</select></div>'+
  '<div class="res-box '+trts.c+'" style="margin-top:1rem">'+
  '<div style="font-size:13px;margin-bottom:4px">TRTS Összpontszám:</div><div style="font-size:32px;font-weight:700;margin-bottom:1rem">'+trts.s+'</div>'+
  '<div style="font-size:13px;margin-bottom:4px">Másodlagos Triage Kategória:</div><div style="font-size:20px;font-weight:700;">'+trts.tn+'</div>'+
  '</div></div>'
:
  // Interactive Triage Logic
  '<div class="card"><div style="font-size:12px;color:#9ca3af;margin-bottom:10px;">Interaktív segédlet az elsődleges ('+w('START')+') és '+w('JumpSTART')+' osztályozáshoz.</div>'+
  (CA.step===0 ?
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Beteg életkora?</div>'+
    '<button class="btn btn-fw" style="margin-bottom:5px" onclick="triAns(1, \'felnott\')">Felnőtt (START)</button>'+
    '<button class="btn btn-fw" onclick="triAns(1, \'gyermek\')">Gyermek (JumpSTART)</button>'
  : CA.step===1 ?
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Járóképes a beteg?</div>'+
    '<button class="btn btn-g btn-fw" style="margin-bottom:5px" onclick="triResult(\'T3\')">Igen (Saját lábán odajön)</button>'+
    '<button class="btn btn-fw" onclick="triAns(2, null)">Nem (Földön fekszik / Nem tud menni)</button>'
  : CA.step===2 ?
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Lélegzik spontán?</div>'+
    '<button class="btn btn-fw" style="margin-bottom:5px" onclick="triAns(3, \'no_breath\')">Nem</button>'+
    '<button class="btn btn-fw" onclick="triAns(4, \'yes_breath\')">Igen</button>'
  : CA.step===3 ?
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Légút felszabadítás után lélegzik?</div>'+
    '<button class="btn btn-fw" style="margin-bottom:5px" onclick="triAns(5, \'no_breath_2\')">Nem</button>'+
    '<button class="btn btn-r btn-fw" onclick="triResult(\'T1\')">Igen</button>'
  : CA.step===5 ?
    (CA.ans[0]==='gyermek' ? 
      '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Gyermek (apnoe): Van tapintható perifériás pulzusa?</div>'+
      '<button class="btn btn-fw" style="background:#000; margin-bottom:5px" onclick="triResult(\'Halott\')">Nincs (Halott)</button>'+
      '<button class="btn btn-fw" style="margin-top:5px" onclick="triAns(6, null)">Igen (5 befúvás következik)</button>'
    : '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Felnőtt: Légút felszabadítás után sincs légzés. Eredmény: Halott.</div><button class="btn btn-fw" style="background:#000" onclick="triResult(\'Halott\')">Megértettem (Halott)</button>' )
  : CA.step===6 ?
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Gyermek: 5 befúvás után beindult a légzése?</div>'+
    '<button class="btn btn-fw" style="background:#000;margin-bottom:5px" onclick="triResult(\'Halott\')">Nem (Halott)</button>'+
    '<button class="btn btn-r btn-fw" onclick="triResult(\'T1\')">Igen (T1)</button>'
  : CA.step===4 ?
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Mekkora a légzésszám?</div>'+
    (CA.ans[0]==='gyermek' ?
      '<button class="btn btn-r btn-fw" style="margin-bottom:5px" onclick="triResult(\'T1\')">&lt; 15 vagy &gt; 45 / perc</button>'+
      '<button class="btn btn-fw" onclick="triAns(7, null)">15 - 45 / perc között (Normál)</button>'
    : '<button class="btn btn-r btn-fw" style="margin-bottom:5px" onclick="triResult(\'T1\')">&lt; 9 vagy &gt; 30 / perc</button>'+
      '<button class="btn btn-fw" onclick="triAns(7, null)">9 - 30 / perc között (Normál)</button>' )
  : CA.step===7 ?
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Keringés vizsgálata ('+w('CRT')+' / Pulzus)</div>'+
    (CA.ans[0]==='gyermek' ?
      '<button class="btn btn-r btn-fw" style="margin-bottom:5px" onclick="triResult(\'T1\')">Nincs tapintható pulzus</button>'+
      '<button class="btn btn-fw" onclick="triAns(8, null)">Van tapintható pulzus</button>'
    : '<button class="btn btn-r btn-fw" style="margin-bottom:5px" onclick="triResult(\'T1\')">Pulzus &gt;120 vagy CRT &gt;2mp</button>'+
      '<button class="btn btn-fw" onclick="triAns(8, null)">Pulzus &le;120 és CRT &le;2mp (Keringés jó)</button>' )
  : CA.step===8 ?
    (CA.ans[0]==='gyermek' ?
      '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Gyermek: '+w('AVPU')+' skála értéke?</div>'+
      '<button class="btn btn-r btn-fw" style="margin-bottom:5px" onclick="triResult(\'T1\')">P (Fájdalomra reagál) vagy U (Nem reagál)</button>'+
      '<button class="btn btn-fw" style="background:#eab308;color:#000;border:none" onclick="triResult(\'T2\')">A (Éber) vagy V (Szóra reagál)</button>'
    : '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px">Felnőtt: Követi az egyszerű utasítást? (Mentális státusz)</div>'+
      '<button class="btn btn-fw" style="background:#eab308;color:#000;border:none;margin-bottom:5px" onclick="triResult(\'T2\')">Igen (T2)</button>'+
      '<button class="btn btn-r btn-fw" onclick="triResult(\'T1\')">Nem (T1)</button>')
  : CA.step===9 ? // RESULT
    '<div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:10px;text-align:center">Osztályozás Eredménye:</div>'+
    '<div class="res-box '+(CA.res==='T1'?'tri-red':CA.res==='T2'?'tri-yel':CA.res==='T3'?'tri-grn':'tri-blk')+'" style="margin-bottom:10px">'+
    '<div class="res-num">'+CA.res+'</div><div class="res-lbl">'+(CA.res==='T1'?'Azonnali (Piros)':CA.res==='T2'?'Sürgős (Sárga)':CA.res==='T3'?'Halasztható (Zöld)':'Halott (Fekete)')+'</div></div>'+
    '<button class="btn btn-b btn-fw" onclick="resetTri()">Új beteg osztályozása</button>'
  : '')+
  '</div>'
);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcTab=function(t){CA.tab=t;CA.step=0;CA.ans=[];render();};
window.triAns=function(next, val){if(val) CA.ans.push(val); CA.step=next; render();};
window.triResult=function(res){CA.res=res; CA.step=9; render();};
window.resetTri=function(){CA.step=0;CA.ans=[];CA.res=null;render();};

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
