],summary:'Részletes Összefoglaló (B kompetencia, Súlyos Trauma):\nA kiérkezéskor a dinamikus kockázatbecslés után a katasztrofális artériás vérzést azonnal Tourniquet-vel (sérüléstől proximálisan felhelyezve) izoláltuk, a felhelyezés idejét feljegyeztük. Társunk egyidejűleg MILS-t alkalmazott. A zárt sisak alatt a beteg hörgött, ezért 2 fős technikával in-line stabilizálás mellett levettük a sisakot. Az "A" légutat a fej hátrahajtása nélkül, az áll kiemelésével biztosítottuk. A kritikus GCS (GCS 4 - feszítő) és a instabil állapot miatt B egységként haladéktalanul ALS segélykocsit kértünk. A ruházat eltávolításával egyidőben buborékfóliás hővédelmet alkalmaztunk. A kiérkező D kompetenciájú mentőtisztnek ISBAR szerint átadtuk a beteget, kiemelve a TQ felhelyezés idejét. A beteget intubáció után a leggyorsabban elérhető Trauma Centrumba szállítottuk, koponyasérülésre való tekintettel megemelt fejvéggel neuroprotektív pozícióban.'},

{sit:'A helyszínen te, mint B+ ápoló kezded el az állapotfelmérést az orvos irányítása mellett. Katasztrofális vérzés nincs. Alkalmazol-e MILS-t?',opts:[{tx:'Nem, mert éber és válaszol.',ok:false,fb:'Az éberség nem zárja ki a gerincsérülést.'},{tx:'Igen, magasból esésnél a gerincsérülés veszélye magas, MILS alkalmazása azonnal indokolt.',ok:true,fb:'Helyes! Mechanizmus alapján gerincvédelem kötelező.'},{tx:'Csak ha zsibbad a lába.',ok:false,fb:'A zsibbadás hiánya nem zárja ki a sérülést.'}]},
{sit:'A "B" (Légzés) vizsgálat során a beteg légzésszáma 32/perc, a jobb mellkasfél lemarad, tapintásra subcutan emphysemát érzel, az SpO2 oxigénnel is csak 88%. Az orvos feszülő PTX-et diagnosztizál. Te, mint B+ ápoló milyen beavatkozást készítesz elő?',opts:[{tx:'Intubációs szettet és thoracostomiás tálcát az orvosnak (E kompetencia) a definitív ellátáshoz, szükség esetén B+ szinten tűdetenzionálok.',ok:true,fb:'Helyes! Az orvos elvégzi az RSI-t és a thoracostomiát, te ezeket asszisztálod/előkészíted. Instabilitásnál időnyerésre te is szúrhatsz tűvel.'},{tx:'Lélegeztetőgépet, maszkos oxigén elég.',ok:false,fb:'A feszülő PTX mechanikai akadály, azt szúrni/vágni kell.'},{tx:'Semmit, várok a további utasításra.',ok:false,fb:'Asszisztencia a te feladatod.'}]},
{sit:'A "C" vizsgálat: A medence fájdalmas, zúzódott. Tilos nyomkodni. Felmerül a medencetörés gyanúja. Mi a teendő a medencével?',opts:[{tx:'A ruházat levágásakor a csomagolással egyidőben medencerögzítő övet (pelvic binder) teszünk fel.',ok:true,fb:'Helyes! A medencerögzítő felhelyezése életmentő lehet nyílt könyv típusú törésnél.'},{tx:'Fáslival körbetekerjük.',ok:false,fb:'Speciális rögzítő kell.'},{tx:'Csak fájdalomcsillapítót kap.',ok:false,fb:'A térfogatcsökkentés fizikai megoldás (öv) elengedhetetlen.'}]},
{sit:'A vérnyomás 80/50 Hgmm, a beteg sápadt, pulzusa 125/perc. Belső hasi/medencei vérzés valószínű. Koponyasérülésre utaló jel nincs. Mennyi a permisszív hypotensio célvérnyomása ebben a tompa traumában?',opts:[{tx:'110-120 Hgmm.',ok:false,fb:'Ez koponyasérülés célja.'},{tx:'80-90 Hgmm.',ok:true,fb:'Helyes! Tompa trauma, koponyasérülés nélkül: 80-90 Hgmm az ideális, hogy a vérrögök ne lökődjenek le.'},{tx:'60 Hgmm.',ok:false,fb:'Ez penetráló trauma thoracotomia után.'}]},
{sit:'A cél 80-90 Hgmm, a betegünk vérnyomása 80 Hgmm. Szükséges-e agresszív nagy volumenű (2000 ml) krisztalloid bolus adása jelenleg?',opts:[{tx:'Igen, azonnal fel kell tolni a vérnyomását 120-ra.',ok:false,fb:'Tilos! Ezzel kilökjük a keletkező vérrögöket és fokozzuk a belső vérzést.'},{tx:'Nem, a célvérnyomás (80 Hgmm) határán van. Folyadékpótlás csak óvatosan, a cél fenntartására.',ok:true,fb:'Helyes! Ez a permisszív hypotensio lényege.'},{tx:'Nem adok neki semmit.',ok:false,fb:'Vénát kell biztosítani és KVO-n tartani, ha esik a vérnyomás, akkor kell adni.'}]},
{sit:'Az orvos kéri, hogy B+ szintként biztosíts 2 db vastag perifériás vénát és szívd fel a Tranexámsavat. Mennyi a TXA felnőtt dózisa?',opts:[{tx:'1 gramm (1000 mg) intravénásan.',ok:true,fb:'Helyes! Belső vérzés gyanúja esetén ez a protokoll prehospitális dózisa.'},{tx:'250 mg iv bólusban.',ok:false,fb:'A dózis 1g.'},{tx:'2 gramm bólusban.',ok:false,fb:'Nem, a prehospitális iniciális dózis 1g.'}]},
{sit:'A fájdalomcsillapításról döntötök. A beteg erősen fájlalja a medencéjét (hemodinamikailag épphogy a határon van). Melyik szert NEM javasolt használni instabil mellkas/medencesérültnél?',opts:[{tx:'A nitrogén-oxidult (Entonox), mert súlyosbíthatja a PTX-et és a gázgyülemeket.',ok:true,fb:'Helyes! A N2O a zárt gázterekbe diffundálva tágítja azokat (PTX esetén életveszélyes).'},{tx:'A Fentanylt.',ok:false,fb:'Az orvos adhat ópiátot titrálva.'},{tx:'A Ketamint.',ok:false,fb:'Shockban a Ketamin kifejezetten jó választás lehet (orvosi/tiszti hatáskörben).'}]},
{sit:'Kimentéshez a sérültet egy lapáthordágyra kell helyezni. Milyen technikával emelitek/mozgatjátok?',opts:[{tx:'Csak megragadjuk a végtagjainál és átemeljük.',ok:false,fb:'Súlyos gerinc- és medencesérülés veszélye!'},{tx:'MILS tartása mellett, a törzset egyben, tengelyirányban minimálisan megemelve csúsztatjuk alá a lapáthordágy két felét.',ok:true,fb:'Helyes! A lapáthordágy a legkíméletesebb a medence/gerinc számára ilyenkor.'},{tx:'KED mellényt rakunk rá.',ok:false,fb:'KED mellény fekvő sérültnél nem, és medencetörés gyanúnál sem ideális kimentésre.'}]},
{sit:'A mentőben a kórház felé tartva az orvos FAST UH vizsgálatot végez (pozitív, hasban folyadék). Te mit figyelsz B+ ápolóként folyamatosan a szállítás alatt?',opts:[{tx:'A beteg tudatát (GCS), SpO2-t, ETCO2-t, vérnyomást és a hőmérsékletét (aktív hővédelem).',ok:true,fb:'Helyes! A vitális paraméterek sorozatos újraértékelése a transzport alatt kritikus.'},{tx:'Csak az EKG görbét.',ok:false,fb:'A trauma komplex monitorozást igényel.'},{tx:'Kitöltöm a papírokat, az orvosé a beteg.',ok:false,fb:'A betegellátás csapatmunka, folyamatos monitorozás a te feladatod is.'}]}
],summary:'Részletes Összefoglaló (B+ kompetencia, Tompa Trauma):\nAz 5 méteres zuhanás nagy energiájú traumának számít, azonnal MILS-t (nyaki gerinc védelmet) alkalmaztunk. A "B" vizsgálat feszülő PTX-re utalt (subcutan emphysema, aszimmetria, deszaturáció), így B+ ápolóként az ALS (orvosi) ellátáshoz intubációs/thoracostomiás eszközöket készítettünk elő. A "C" vizsgálat medencetörés gyanúját vetette fel (nyomkodni szigorúan tilos!), ezért a beteget óvatosan medencerögzítő övvel (pelvic binder) láttuk el. Belső vérzés okozta shockos állapotba került (80/50 Hgmm). A permisszív hypotensio elve alapján tompa traumában 80-90 Hgmm a cél, így a krisztalloid bolus adását mellőztük, hogy a kialakult vérrögök ne lökődjenek ki. B+ kompetenciával perifériás vénát biztosítottunk, az orvos utasítására felszívtuk az 1g Tranexámsavat, és elkerültük a Nitrogén-oxidul (Entonox) használatát a PTX miatti kontraindikáció miatt. A beteget tengelyirányú, kíméletes emeléssel lapáthordágyra helyeztük. A transzport során aktív hővédelmet alkalmaztunk és szigorúan monitoroztuk a hemodinamikai értékeket az SBO-ig.'},

{id:3,title:'3. Szimuláció: Gyermek gázolás (B kompetencia)',diff:'B kompetencia',desc:'A zebrán elütöttek egy 6 éves gyermeket. B kompetenciájú mentőegységgel érkezel (gyógyszeres véna- és emelt légútbiztosítás nélkül). A gyermek az úttesten fekszik, sír, és sápadt.',steps:[
{sit:'Megérkezel a helyszínre. Mik az elsődleges lépések kimentés és biztonság terén?',opts:[{tx:'Azonnal felszedem és berohanok vele a mentőbe.',ok:false,fb:'Gerincsérülés veszélye és a kimentés szabályai miatt ez tilos.'},{tx:'Helyszínbiztonság (forgalom) megteremtése után, MILS (nyaki gerinc manuális rögzítése) és dinamikus kockázatbecslés.',ok:true,fb:'Helyes! A helyszínbiztonság és a nyaki gerinc védelme az első lépés.'},{tx:'Megvárom a rendőrséget, addig nem nyúlok hozzá.',ok:false,fb:'Ha a biztonság megteremthető, az ellátást azonnal meg kell kezdeni.'}]},
{sit:'A cABCDE alapján katasztrofális külső vérzést nem találsz. MILS-t tart a társad. Az "A" (légút) vizsgálatnál a gyermek sír, hangja tiszta. Kell-e eszközös légútbiztosítás?',opts:[{tx:'Igen, azonnal tubust dugok az orrába.',ok:false,fb:'Sír és tiszta a hangja, a légútja teljesen átjárható, eszköz felesleges.'},{tx:'Nem, a tiszta sírás átjárható légutat jelez, eszközös biztosítás nem szükséges.',ok:true,fb:'Helyes! Ha sír és tiszta a hangja, az "A" rendben van.'},{tx:'Minden traumás gyermeknek kell az OPA (Guedel-tubus).',ok:false,fb:'Csak eszméletlen beteg tűri meg az OPA-t.'}]},
{sit:'B kompetenciájú (alap) egység lévén, súlyos traumás gyermeknél milyen szervezési feladatod van már az első pillanatokban?',opts:[{tx:'Haladéktalanul gyermek ALS (mentőorvosi kocsi / gyermekmentő) vagy légimentő primer/párhuzamos riasztását kérem az irányítástól.',ok:true,fb:'Helyes! A súlyos gyermek trauma azonnali emelt szintű beavatkozást igényel.'},{tx:'Várok a teljes vizsgálat végéig, majd lassan indulok a legközelebbi kórházba.',ok:false,fb:'Súlyos gyermek sérültnél ALS szükséges a helyszínen vagy találkozási ponton.'},{tx:'Felhívom a háziorvost.',ok:false,fb:'Sürgősségi prehospitális ellátás a cél.'}]},
{sit:'A "B" (légzés) vizsgálatnál a légzésszám 30/perc, oxigénszaturáció 94%. Mi a teendőd oxigénterápia terén?',opts:[{tx:'Nem adok oxigént, mert 94% az jó.',ok:false,fb:'Minden súlyos sérültnek oxigént kell adni.'},{tx:'Minden súlyos traumás sérültnek (gyermeknek is) oxigént adok, lehetőség szerint magas áramlással, rezervoáros maszkon.',ok:true,fb:'Helyes! A traumás hypoxia kivédése kritikus.'},{tx:'Csak ballonnnal lélegeztetem.',ok:false,fb:'Spontán megfelelő légzésnél ez nem indokolt.'}]},
{sit:'A "C" (keringés) vizsgálat során a medencét is értékeled. Kifejezett zúzódás látszik a medencelapáton. Tilos-e megnyomni a gyermek medencéjét B szinten?',opts:[{tx:'Óvatosan meg lehet nyomni, hátha nem fáj.',ok:false,fb:'SZIGORÚAN TILOS!'},{tx:'Igen, BÁRMILYEN irányú nyomással szigorúan tilos vizsgálni a medencét, mert rejtett és katasztrofális vérzést indíthat el.',ok:true,fb:'Helyes! Felnőttnél és gyermeknél is tilos a nyomkodás, és mechanizmus alapján fel kell tenni a medencerögzítőt.'},{tx:'Gyermekeknél a csontok rugalmasak, ezért meg szabad nyomni.',ok:false,fb:'Szigorúan tilos.'}]},
{sit:'A gyermek pulzusa 140/perc, a szisztolés vérnyomása megmérve 80 Hgmm. Egy 6 éves gyermeknél a 80 Hgmm milyen állapotot jelez az eljárásrend alapján?',opts:[{tx:'Ez normális, gyerekeknek alacsonyabb a vérnyomásuk.',ok:false,fb:'A normál vérnyomás kiszámítása: 90 + (2x6) = 102 Hgmm.'},{tx:'Gyermekeknél a vérnyomásesés KÉSŐI és fenyegető jel, ami már kardiovaszkuláris összeomlást jelent. A 80 Hgmm súlyos hypotensio (shock).',ok:true,fb:'Helyes! Az alsó határ 70 + (2x6) = 82 Hgmm. A 80 Hgmm már ez alatti, fenyegető állapot.'},{tx:'Enyhe folyadékhiány.',ok:false,fb:'A gyermek sokáig kompenzál, a vérnyomás esése már dekompenzációt jelez.'}]},
{sit:'Alkalmazhatod-e a "permisszív hypotensio" elvét ennél a gyereknél (hagyhatod-e 80 Hgmm-en a vérnyomását folyadékpótlás kérése nélkül)?',opts:[{tx:'Nem, gyermekek, várandósok és idősek esetén a permisszív hypotensio elvei NEM alkalmazhatóak! Gyors és agresszív bolus terápia kell (ALS).',ok:true,fb:'Helyes! A permisszív hypotensio itt szigorúan tilos, az irányításnak azonnal jelezni kell a shockot.'},{tx:'Igen, mert tompa trauma (gázolás).',ok:false,fb:'Gyermekeknél tilos a permisszív hypotensio.'},{tx:'Igen, a gyermekek jól tolerálják az alacsony vérnyomást.',ok:false,fb:'Nem tolerálják, a vérnyomásesés a végső kimerülést jelzi.'}]},
{sit:'A "D" (idegrendszer) vizsgálatnál a gyermek a fájdalmas ingerre kinyitja a szemét (E=2), nem megfelelő szavakat mond/sír (V=3), elhárítja az ingert (M=4). AVPU = P. Mi a kötelező eszközös mérés a D vizsgálat során?',opts:[{tx:'Vércukormérés elvégzése ujjbegyből.',ok:true,fb:'Helyes! Megváltozott tudatállapot (GCS = 9) esetén a vércukormérés kötelező.'},{tx:'Azonnali pupillatágító csepp adása.',ok:false,fb:'Prehospitálisan tilos.'},{tx:'Gerinccsapolás.',ok:false,fb:'Nem prehospitális kompetencia.'}]},
{sit:'Az "E" (egyéb) vizsgálathoz eltávolítod a gyermek ruházatát, hogy rejtett sérüléseket keress. Mik a hőmérséklet-szabályozási teendőid?',opts:[{tx:'Fedetlenül hagyom, hogy könnyen hozzáférjek mindenhez.',ok:false,fb:'A kihűlés rontja a véralvadást és shockba visz.'},{tx:'Azonnali hővédelem biztosítása (pl. buborékfólia, mentő fűtése), mert a traumás gyermekek extrém gyorsan kihűlnek, ami fokozza a vérzést.',ok:true,fb:'Helyes! A hypothermia a traumás triász része, agresszíven meg kell előzni.'},{tx:'Hideg vizes borogatást kap a zúzódásokra.',ok:false,fb:'Tilos, mert fokozza a kihűlést.'}]},
{sit:'A mentőhelikopter (ALS) megérkezik, intravénás folyadékbolust (10 ml/ttkg) adnak és fájdalmat csillapítanak. Hová kell szállítani a gyermeket az idődependens megközelítés alapján?',opts:[{tx:'A legközelebbi gyermekrendelőbe.',ok:false,fb:'Súlyos sérülteket trauma centrumba kell vinni.'},{tx:'A területi elvek figyelmen kívül hagyásával a legrövidebb időn belül kompetens gyermek trauma centrumba juttatni.',ok:true,fb:'Helyes! A definitív ellátás (gyermeksebészet/traumatológia) elérése a legfontosabb cél.'},{tx:'A lakcím szerinti kórházba.',ok:false,fb:'A területi elv háttérbe szorul a kompetencia mögött.'}]}
],summary:'Részletes Összefoglaló (B kompetencia, Gyermek Trauma):\nA helyszínbiztonság után azonnal MILS-t alkalmaztunk a nyaki gerinc védelmére. Mivel a gyermek tiszta hangon sírt, az "A" légút átjárható volt, beavatkozás nem kellett. Súlyos gyermek traumaként B egységként azonnal emelt szintű segítséget (gyermek ALS/légimentő) kértünk a mentésirányítástól. A "B" vizsgálatnál rutinszerűen magas áramlású oxigént adtunk rezervoáros maszkon. A "C" vizsgálatnál a medencét vizsgáltuk (nyomkodás nélkül!), és a megmért szisztolés vérnyomás (80 Hgmm) egy 6 évesnél fenyegető hypotensiót jelentett. Az eljárásrend alapján gyermekeknél a permisszív hypotensio elve NEM alkalmazható, így az azonnali volumenpótlás szükségességét jeleztük a kiérkező ALS-nek. A "D" vizsgálatnál a tudatzavar miatt ujjbegyes vércukormérést végeztünk. Az "E" vizsgálat alatt a ruházat eltávolítását azonnali buborékfóliás hővédelem követte a kihűlés és alvadási zavar megelőzésére. Az ALS beavatkozás után a beteget a legrövidebb időn belül kompetens gyermek trauma centrumba szállították.'},

{id:4,title:'4. Szimuláció: Lőtt/Szúrt seb - Penetráló trauma (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy utcai verekedés során egy 35 éves férfit késsel mellkason szúrtak. A támadó elmenekült. B+ kompetenciájú egységgel (gyógyszerezési és vénabiztosítási jogkörrel) érkezel a helyszínre.',steps:[
{sit:'A helyszínre érkezéskor mi az első és legfontosabb teendőd erőszakos cselekmény esetén?',opts:[{tx:'Azonnal megközelítem a beteget és kiveszem a kést.',ok:false,fb:'Veszélyes lehet a helyszín, és a kést sem szabad eltávolítani.'},{tx:'Biztosítom, hogy a helyszín biztonságos (rendőrségi megerősítés kérése/megvárása, dinamikus kockázatbecslés), majd egyéni védőfelszerelés felvétele.',ok:true,fb:'Helyes! Erőszakos bűncselekmény (késelés) esetén a helyszínbiztonság az első.'},{tx:'Egyedül rohanok be a tömegbe.',ok:false,fb:'A saját biztonságod az első.'}]},
{sit:'A rendőrség biztosítja a helyszínt. A beteg éber, a kés még a jobb mellkasában van. Mit teszel a késsel (idegentesttel)?',opts:[{tx:'Azonnal eltávolítom, hogy le tudjam zárni a sebet.',ok:false,fb:'Az idegentest kihúzása végzetes vérzést vagy légmellet okozhat.'},{tx:'Nyílt penetráló sérülésnél az idegentestet a talált helyzetben rögzítem, eltávolítani a prehospitális szakban SZIGORÚAN TILOS.',ok:true,fb:'Helyes! A kés dugóként is funkcionálhat az erek/tüdő számára.'},{tx:'Csak lazán körbetekerem egy fáslival, majd ráfektetem a beteget.',ok:false,fb:'Nem szabad mozgatni a kést, gondosan körbe kell polcolni.'}]},
{sit:'A penetráló sérülés miatt mi a célkitűzés a helyszíni időt (on-scene time) tekintve?',opts:[{tx:'Legalább 30 perc a teljes stabilizálásra.',ok:false,fb:'A penetráló sérülés extrém időkritikus, az ellátás sebészi.'},{tx:'Megtartott tudatú penetráló sérült cél helyszíni ideje 10 perc alatti ("Scoop and run").',ok:true,fb:'Helyes! Mivel a vérzés csak műtőben állítható el definitíven, az időveszteség halálos lehet.'},{tx:'Addig maradunk, amíg a vérnyomás el nem éri a 120 Hgmm-t.',ok:false,fb:'Tilos a magas vérnyomás elérése (permisszív hypotensio).'}]},
{sit:'A "B" (légzés) vizsgálatnál a beteg légzésszáma 28/perc, fullad, SpO2 90%. Feszülő PTX jelei (subcutan emphysema, elnyomott vénák) még nincsenek. Mi a teendő B szinten?',opts:[{tx:'100% oxigént adok rezervoáros maszkon és folyamatosan monitorozom, figyelve a ventil-PTX kialakulását.',ok:true,fb:'Helyes! A penetráló mellkasi sérülés gyorsan feszülő PTX-szé alakulhat, azonnali O2 és szigorú megfigyelés kell.'},{tx:'Azonnal thoracostomiát csinálok B+ szinten.',ok:false,fb:'A thoracostomia (vágás) E kompetencia, B+ csak tűvel detenzionálhatna, de itt még nincs feszülő PTX.'},{tx:'Semmit, ez a szúrás miatt normális.',ok:false,fb:'Hypoxia áll fenn, be kell avatkozni.'}]},
{sit:'A "C" (keringés) vizsgálat során a beteg sápadt, pulzusa 120/perc. B+ kompetenciakéntvénát biztosítasz. Megméred a vérnyomását: 80/60 Hgmm. Mi a teendőd az infúzióval (permisszív hypotensio elve szerint penetráló traumában)?',opts:[{tx:'Azonnal elindítok 2000 ml Ringer laktátot, hogy 120 Hgmm legyen a vérnyomása.',ok:false,fb:'Agressive volumenpótlás tilos, mert kimossa az alvadási faktorokat és lelöki a vérrögöt.'},{tx:'Mivel penetráló sérülésnél a cél RR 70-80 Hgmm, a 80 Hgmm megfelelő. KVO (épphogy csepegő) infúziót hagyok, volumenbolus nem szükséges, hogy elkerüljük a belső vérzés fokozódását.',ok:true,fb:'Helyes! A permisszív hypotensio itt a vérzés csillapítását/elkerülését szolgálja.'},{tx:'Kihúzom a vénát, mert nincs rá szükség.',ok:false,fb:'A gyógyszereléshez és a vénás út fenntartásához szükséges.'}]},
{sit:'A beteg erős mellkasi fájdalomra panaszkodik. Melyik fájdalomcsillapító gáz használata SZIGORÚAN TILOS B+ szinten ebben az esetben?',opts:[{tx:'Az oxigén.',ok:false,fb:'Az oxigént adni kell.'},{tx:'A nitrogén-oxidul (Entonox / N2O), mivel a gáz behatol a zárt terekbe (PTX), és életveszélyes feszülést okozhat.',ok:true,fb:'Helyes! Mellkasi/hasi penetráló traumánál és PTX gyanúnál az N2O kontraindikált.'},{tx:'A levegő.',ok:false,fb:'Nem releváns.'}]},
{sit:'B+ szinten a vérzés miatt milyen specifikus gyógyszert adhatsz intravénásan a protokoll szerint?',opts:[{tx:'Adrenalint bólusban.',ok:false,fb:'Nem, az csak újraélesztésnél.'},{tx:'Tranexámsavat (TXA) 1g dózisban lassan iv., mivel ez gátolja a vérrögök lebomlását és súlyos vérzésnél indokolt.',ok:true,fb:'Helyes! A TXA C kompetenciától (és speciális B+ oktatás után) adható súlyos trauma/vérzés esetén.'},{tx:'Aspirint.',ok:false,fb:'Tilos vérző betegnek adni.'}]},

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+b.tx+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>'; // No escape here to allow <span class="glo">
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+i+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+s.t+'</div><div class="step-x">'+s.x+'</div></div></div>').join('');
  if(b.tp==='abadge') return '<div class="abadge"><div class="abcircle" style="background:'+b.color+'">'+b.letter+'</div><span style="font-size:13px;color:#9ca3af">vizsgálat</span></div>';
  if(b.tp==='ftable'){
    var lc={d:'#fca5a5',w:'#fde68a'};
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Jel / hang</th><th>Jelentés</th></tr></thead><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:600;color:'+lc[r.lv]+'">'+r.s+'</td><td style="color:#e5e7eb">'+r.m+'</td></tr>').join('')+'</tbody></table></div>';
  }
  return '';
}

SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+

'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+

if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő lépés →':'Összefoglaló')+'</button>':'');
}

  '<div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Normál szisztolés vérnyomás:</div><div id="calc-ped-norm" style="font-size:32px;font-weight:700;color:#60a5fa;margin-bottom:1rem">'+norm+' Hgmm</div>'+
  '<div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Alsó tolerabilis határ:</div><div id="calc-ped-min" style="font-size:24px;font-weight:700;color:#fca5a5">'+min+' Hgmm</div></div>'+
  '<div style="font-size:12px;color:#9ca3af;margin-top:1rem;line-height:1.5">Ökölszabály: iskolás kor alatt legalább 80 Hgmm, felett legalább 90 Hgmm a cél. A vérnyomásesés KÉSŐI és fenyegető jel gyermekeknél! Már enyhén csökkent érték esetén is gyors és agresszív beavatkozás kell.</div></div>';
}
}

function updatePedCalc(age){
  var a = parseInt(age, 10);
  if(isNaN(a) || a < 1) a = 1;
  if(a > 12) a = 12;
  var norm = 90 + (2 * a);
  var min = 70 + (2 * a);
  var elNorm = document.getElementById('calc-ped-norm');
  var elMin = document.getElementById('calc-ped-min');
  if(elNorm) elNorm.innerText = norm + ' Hgmm';
  if(elMin) elMin.innerText = min + ' Hgmm';
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// Global actions
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
