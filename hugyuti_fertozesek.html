.dw{color:#14b8a6;text-decoration:underline;text-decoration-style:dotted;cursor:pointer;font-weight:600;}

.modal-close{background:none;border:none;color:#9ca3af;font-size:24px;line-height:1;cursor:pointer;}
.modal-body{padding:1rem;font-size:14px;color:#d1d5db;line-height:1.6;}

.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}

.home-mod-title{font-size:14px;font-weight:600;color:#f3f4f6;}
.home-mod-desc{font-size:11px;color:#9ca3af;}

    {sit:'A beteg ABCDE-stabil, vitális paraméterei normálisak. Milyen specifikus kérdéseket teszel fel a panaszaira (anamnézis)?', opts:[{tx:'Csak azt kérdezem, mit evett.',ok:false,fb:'Hibás! Célzott anamnézis kell.'},{tx:'Kikérdezem a vizelés gyakoriságáról, fájdalmáról, és hogy van-e láza, derékfájdalma, vagy szisztémás tünete.',ok:true,fb:'Helyes! Tisztázni kell az egyszerű vs komplikált infekció jeleit.'},{tx:'Megkérdezem, mikor volt utoljára külföldön.',ok:false,fb:'Hibás! Nem ez a legfontosabb.'}]},
    {sit:'A betegnek nincs láza, nincs derékfájdalma, és nincs hányingere. Célzottan rákérdezel a veszélyeztető tényezőkre is. Mik ezek?', opts:[{tx:'Terhesség, diabetes, immundeprimált állapot, anatómiai eltérések.',ok:true,fb:'Helyes! Ezek azonnal komplikálttá/veszélyeztetetté tennék az esetet.'},{tx:'Hajszín, testsúly.',ok:false,fb:'Hibás! Ezek nem rizikófaktorok.'},{tx:'Csak a terhesség számít.',ok:false,fb:'Hibás! Sok más tényező is van.'}]},

    {sit:'Differenciáldiagnózis: Melyik tünet hiánya erősíti meg, hogy ez egyszerű húgyúti infekció és NEM vaginitis?', opts:[{tx:'Sűrű vizelési inger hiánya.',ok:false,fb:'Hibás! Az a vaginitisre utalna.'},{tx:'Hüvelyi folyás és viszketés hiánya.',ok:true,fb:'Helyes! A vaginitist a bűzös folyás és viszketés jellemzi.'},{tx:'Derékfájdalom hiánya.',ok:false,fb:'Hibás! A derékfájdalom a pyelonephritis (felső húgyúti) jele.'}]},
    {sit:'B kompetenciájú mentőápolóként adsz-e intravénás antibiotikumot vagy infúziót ennek a betegnek a helyszínen?', opts:[{tx:'Igen, azonnal.',ok:false,fb:'Hibás! B kompetencia nem ad iv. gyógyszert.'},{tx:'Nem, egyszerű húgyúti infekció helyszíni akut ellátást nem igényel, B szinten gyógyszert sem adok iv.',ok:true,fb:'Helyes! Az eljárásrend alapján nem is igényel akut beavatkozást.'},{tx:'Oxigént adok.',ok:false,fb:'Hibás! Nincs hypoxiája.'}]},

], summary:'Részletes Összefoglaló (Sim 1 - B kompetencia): A helyszínbiztonság és ABCDE vizsgálat után a célzott anamnézis igazolta az egyszerű UTI tüneteit (fájdalmas, sűrű vizelés, alhasi fájdalom), és kizárta a komplikációkat (láz, derékfájás hiánya), valamint a rizikófaktorokat (nem terhes, nincs diabetes). Differenciáldiagnózisként a vaginitis kizárásra került a folyás hiánya miatt. Vizelet stix vizsgálattal a pyuria/nitrit kimutatható volt. Mivel B kompetenciás az egység és a beteg stabil, akut helyszíni ellátás nem történt, tüneti javaslatként fájdalomcsillapítót tanácsoltunk. Kórházi szállítás nem volt indokolt. Mivel mentőápoló önállóan nem hagyhat beteget helyszínen, az eset az alapellátásnak/ügyeletnek került átadásra. A betegnek a 48-72 órán belüli háziorvosi kontroll lett javasolva.'},

], summary:'Részletes Összefoglaló (Sim 2 - B+ kompetencia): A helyszínbiztonság és az ABCDE vizsgálat után kiderült, hogy a 68 éves férfibeteg lázas, hidegrázása van, és erős deréktáji fájdalomra panaszkodik. Ezek az eljárásrend alapján egyértelműen komplikált húgyúti infekcióra (pyelonephritis gyanú) utalnak, férfiaknál ráadásul fokozott a prosztata érintettség és a komplikációk esélye. A betegnél folyamatosan figyeltük a szepszis esetleges jeleit. Mivel a betegnek hányingere és magas láza volt, B+ kompetenciával vénabiztosítás történt, majd intravénás láz/fájdalomcsillapító és hányáscsillapító került beadásra tüneti terápiaként. A komplikált húgyúti infekció tünetei minden betegnél azonnali kórházba utalást indokolnak (míg a Nitrofurantoin empirikus használata ilyen esetben szigorúan ellenjavallt). A beteget folyamatos monitorozás (NIBP, pulzoximéter, EKG) mellett stabil állapotban az SBO-ra/ügyeletes urológiára szállítottuk, ahol a beadott gyógyszereket és a gyanút átadtuk a fogadó orvosnak.'},

{id:3, title:'3. Szimuláció: Gyermekkori UTI', diff:'B kompetencia', desc:'Egy 4 éves kislányhoz hívnak. Édesanyja szerint sír, ha pisilnie kell, fájlalja a hasát alul, a vizelete zavaros. B kompetenciaszint (gyógyszerelés nélkül).', steps:[

    {sit:'A stix (gyorsteszt) kimutatja a pyuriát (gennyet). Mit mond ki egyértelműen az eljárásrend a gyermekek vizeletvizsgálattal igazolt fertőzéseivel kapcsolatban?', opts:[{tx:'Gyermekek vizeletvizsgálattal (stix) igazolt húgyúti fertőzés esetén KÓRHÁZBA irányítandók további vizsgálat céljából.',ok:true,fb:'Helyes! A gyermekek minden esetben kórházi/szakorvosi vizsgálatot igényelnek.'},{tx:'Otthon hagyhatók, ha nincs láz.',ok:false,fb:'Hibás! A gyermek mindig rizikócsoport.'},{tx:'Háziorvos ráér megvizsgálni 3 nap múlva.',ok:false,fb:'Hibás! Kórházi vizsgálat kell.'}]},
    {sit:'A kislány elkezd lázasodni (38.2 °C). B kompetenciával (nincs gyógyszerelés) hogyan látod el a fájdalmat és a lázat?', opts:[{tx:'Megkérem az édesanyát, hogy adjon a gyermek életkorának/testsúlyának megfelelő, otthon lévő gyermek láz- és fájdalomcsillapító szirupot/kúpot.',ok:true,fb:'Helyes! B szinten a szülő adhat a saját gyógyszeréből a mi javaslatunkra.'},{tx:'Szúrok egy vénát és adok Algopyrint.',ok:false,fb:'Hibás! B kompetencia nem szúr vénát.'},{tx:'Hideg vízbe állítom a gyereket.',ok:false,fb:'Hibás! Drasztikus és traumatizáló.'}]},

], summary:'Részletes Összefoglaló (Sim 3 - Gyermek, B kompetencia): A helyszínbiztonság után a 4 éves kislány állapotát a Gyermek állapotfelmérés háromszögével kezdtük (Küllem, Légzés, Keringés mind stabil). Az ABCDE vizsgálat megerősítette a stabilitást. Az anamnézis (fájdalmas vizelés, hasfájás) alapján cystitisre gyanakodtunk. Mivel szobatiszta, a nemi szervek tisztítása után középsugaras vizeletből stix vizsgálatot végeztünk, mely pyuriát igazolt (nem szobatisztánál hólyagtájék hideg vizes dörzsölését alkalmaztuk volna). A fellépő lázra B kompetenciával a szülőt kértük meg az otthoni gyermek gyógyszer beadására. Az eljárásrend egyértelmű: stix-szel igazolt húgyúti fertőzésben szenvedő gyermeket kórházba (gyermekosztály/SBO) kell irányítani kivizsgálás céljából, ezért a stabil kislányt B kompetenciájú autóval kórházba szállítottuk, és a pontos anamnézissel/teszteredménnyel átadtuk az osztálynak.'},

{id:4, title:'4. Szimuláció: Súlyos Szeptikus UTI', diff:'B+ kompetencia', desc:'Egy 82 éves demens, állandó húgyhólyag-katétert viselő nőhöz hívnak. Nagyon gyenge, zavart, "nehezen kap levegőt". B+ kompetencia.', steps:[
    {sit:'A helyszínen a néni ágyban fekszik, kontaktusba nehezen vonható (AVPU = V). Mi a gyanúd a katéter, az életkor és a gyengeség alapján?', opts:[{tx:'Csak elfáradt.',ok:false,fb:'Hibás! Ez veszélyes feltételezés.'},{tx:'Veszélyeztetett (idős, katéteres), komplikált fertőzésből kiinduló szeptikus állapot állhat fenn.',ok:true,fb:'Helyes! Minden rizikófaktor jelen van a szepszishez.'},{tx:'Szívinfarktus.',ok:false,fb:'Hibás! Bár lehetséges, a katéter és fertőzés esélye magasabb elsődleges gyanúként.'}]},
    {sit:'Az ABCDE vizsgálatot elkezded. B vizsgálat: Légzésszám 32/perc. C vizsgálat: Pulzus 118/perc, gyenge. Vérnyomás 80/50 Hgmm. CRT > 3 mp. Mit igazolnak a vitális paraméterek?', opts:[{tx:'Kritikus hemodinamikai instabilitást és valószínűsíthető szepszist (szeptikus sokk).',ok:true,fb:'Helyes! Tachypnoe, tachycardia, hypotensio mind a szepszis kritériumai.'},{tx:'Kiszáradást, elég inni adni.',ok:false,fb:'Hibás! Ez már shock állapot.'},{tx:'Egyszerű cystitist.',ok:false,fb:'Hibás! Az egyszerű cystitis nem okoz keringés-összeomlást.'}]},
    {sit:'B+ kompetenciájúként mi az azonnali párhuzamos teendőd a "B" és "C" vizsgálat során az instabil állapotú szeptikus betegnél?', opts:[{tx:'Megkezdem a NIBP/EKG monitorozást, 100% oxigént adok rezervoáros maszkon, és 2 vastag vénát biztosítok a folyadékterápiához.',ok:true,fb:'Helyes! Súlyos szepszisben az oxigén és a volumenpótlás (véna) B+ szinten elvárás.'},{tx:'Adok neki antibiotikumot tablettában.',ok:false,fb:'Hibás! Shockos beteg per os gyógyszert nem kaphat.'},{tx:'Kihúzom a katétert.',ok:false,fb:'Hibás! A helyszínen nem eltávolítjuk, csak észleljük.'}]},
    {sit:'A katéterzsákban lévő vizelet gennyes, bűzös. D vizsgálatnál a vércukor normális. E vizsgálatnál lázat (39.2 °C) mérsz. Mivel azonnali ellátást igényel, mit teszel mentésirányítási szempontból?', opts:[{tx:'Semmit, lassan beviszem.',ok:false,fb:'Hibás! Kritikus beteg.'},{tx:'Magasabb szintű mentőegység (ALS/Roham) azonnali riasztását/találkozót kérek, és elindítom a Szeptikus beteg protokollját.',ok:true,fb:'Helyes! A szeptikus shock rohamkocsit/mentőtisztet/orvost igényel a helyszínen vagy a találkozásnál.'},{tx:'Háziorvost hívom ki.',ok:false,fb:'Hibás! Túl lassú a kritikus állapothoz.'}]},
    {sit:'Amíg várod az ALS egységet, beadhatsz-e empirikus intravénás antibiotikumot B+ kompetenciával?', opts:[{tx:'Igen, be is adom a Nitrofurantoint.',ok:false,fb:'Hibás! A Nitrofurantoin per os van, komplikáltban tilos, és B+ nem ad önállóan iv. AB-t.'},{tx:'Nem, prehospitális AB rendelése orvosi/tiszti kompetencia, én folyadékreszuszcitációt és oxigénterápiát (O2 adás) folytatok.',ok:true,fb:'Helyes! B+ kompetencia iv. krisztalloid folyadékot (Ringer/Salsol) adhat shockban protokoll szerint.'},{tx:'Igen, Bármilyen penicillint.',ok:false,fb:'Hibás!'}]},
    {sit:'Az eljárásrend külön kitér a kórházi/ápolási otthonban szerzett, katéteres (multirezisztens) fertőzésekre. Mi a teendő ezekkel kapcsolatban a végleges terápiát illetően (kórházban)?', opts:[{tx:'Csak sima Penicillint kapnak.',ok:false,fb:'Hibás!'},{tx:'Tenyésztés (vizelettenyésztés) kötelező az AB terápia megkezdése előtt, mivel a multirezisztencia (MDR) esélye magas.',ok:true,fb:'Helyes! Katéteres, demens idős néninél a rezisztens kórokozó nagyon gyakori.'},{tx:'Nem kell velük semmit csinálni.',ok:false,fb:'Hibás!'}]},
    {sit:'A beteg vérnyomása a beadott infúzió (bólus) ellenére továbbra is 85/50 Hgmm. A rohamkocsi megérkezik. Szükséges-e a beteg kórházba szállítása?', opts:[{tx:'Igen, szeptikus állapot észlelése esetén AZONNALI kórházi elhelyezés (SBO-n) kötelező.',ok:true,fb:'Helyes! Az irányelv szigorúan fogalmaz.'},{tx:'Nem, otthon kezelhető infúzióval.',ok:false,fb:'Hibás!'},{tx:'Megkérdezzük a beteget, mit szeretne.',ok:false,fb:'Hibás! A beteg zavart (Dementia + Szepszis encephalopathia).'}]},
    {sit:'Az eljárásrend kitér az önellátásra képtelen (demens) betegekre is. Mi az előírás rájuk vonatkozóan, még "egyszerű" UTI esetén is?', opts:[{tx:'Bekerülhetnek az intézményi körforgásba.',ok:false,fb:'Hibás!'},{tx:'Az egyedül élő, mentális zavarok vagy más ok miatt önellátásra képtelen beteg egyszerű UTI tünetek mellett is hospitalizációt igényel.',ok:true,fb:'Helyes! Ez szociális és biztonsági indikáció.'},{tx:'Mindenképp otthon kell tartani.',ok:false,fb:'Hibás!'}]},
    {sit:'Mit fog adni az ALS egység (Orvos/Tiszt) a helyszínen vagy a mentőben az iv. AB-ből az eljárásrend alapján (ha már lehet adni)?', opts:[{tx:'Cefalosporint (pl. iv. Cefuroxim/Ceftriaxon) adhat (bár a Sepsis protokoll irányadó itt, nem a sima UTI). Nitrofurantoin TILOS.',ok:true,fb:'Helyes! Súlyos, komplikált esetben a széles spektrumú iv. antibiotikum jön szóba a Sepsis eljárásrend alapján.'},{tx:'Nitrofurantoint iv.',ok:false,fb:'Hibás! Nincs iv. formája a mentőknél, és amúgy is ellenjavallt.'},{tx:'Csak teát.',ok:false,fb:'Hibás!'}]},
    {sit:'Kórházi átadás SBO-ra. Milyen speciális anamnesztikus adatot emelsz ki?', opts:[{tx:'Azt, hogy mi volt a vacsora.',ok:false,fb:'Hibás!'},{tx:'A katéter viselését, az idős demens alapállapotot, a kezdeti hypotensiót és az erre adott folyadékbólus/O2 mennyiségét.',ok:true,fb:'Helyes! Ezek az adatok életmentőek a sürgősségin a szepszis Bundle indításához.'},{tx:'A néni hajszínét.',ok:false,fb:'Hibás!'}]}
], summary:'Részletes Összefoglaló (Sim 4 - Súlyos szepszis, B+ kompetencia): A helyszínen egy 82 éves, demens, katéteres beteget találtunk. Az elsődleges felmérés (ABCDE) azonnal instabil állapotot mutatott: tachypnoe (32/p), tachycardia (118/p), mély hypotensio (80/50), és zavartság. A katéterben gennyes vizelet, láz (39.2 °C) igazolódott. Az eljárásrend alapján ez egyértelműen komplikált, szeptikus húgyúti infekció. B+ kompetenciával azonnal 100% oxigént adtunk rezervoáros maszkon, NIBP/EKG monitorozást kezdtünk, vénát biztosítottunk, és elkezdtük az intravénás krisztalloid folyadékpótlást a szepszis miatti shock kezelésére (a Szeptikus eljárásrenddel párhuzamban). Mivel az állapot kritikusan instabil volt, haladéktalanul rohamkocsit/ALS egységet kértünk. Empirikus AB-t mi nem adtunk (Nitrofurantoin egyébként is tilos komplikált esetben). A kórházi beutalás kötelező (szepszis + demencia/önellátásra képtelenség). A rohamkocsi érkezése után a beteget folyamatos monitorozással, iv. terápia alatt adtuk át az SBO-n, kiemelve a katéter tényét (mely multirezisztens kórokozóra utal).' }
];

// --- RENDER LOGIC ---
function renderHome(){
    return '<h2 style="font-size:20px;font-weight:700;color:#f3f4f6;margin-bottom:1rem">OMSZ Szabványos Eljárásrend<br><span style="font-size:14px;color:#14b8a6">Húgyúti fertőzések prehospitális ellátása</span></h2>'+
    '<div class="card" style="background:#172554;border-color:#1e3a8a"><div style="font-size:12px;color:#bfdbfe">A fertőzés zömmel a genitáliák környékéről '+w('ascendáló')+' (pl. Escherichia coli). Az eljárásrend célja a sürgősségi ellátás és a kórházi elhelyezés szempontjainak egységesítése. Kérjük, válaszd ki a lenti funkciók egyikét. A szövegben található aláhúzott szavakra kattintva elérheted a szótár funkciót!</div></div>'+
    '<div class="g2" style="margin-bottom:.75rem">'+
    '<button class="home-mod" onclick="go(\'chapters\')"><div class="home-mod-icon">📚</div><div class="home-mod-title">Eljárásrend</div><div class="home-mod-desc">A teljes szakmai anyag</div></button>'+
    '<button class="home-mod" onclick="go(\'quiz\')"><div class="home-mod-icon">❓</div><div class="home-mod-title">Kvíz</div><div class="home-mod-desc">20 tesztkérdés</div></button>'+
    '<button class="home-mod" onclick="go(\'sim\')"><div class="home-mod-icon">🚑</div><div class="home-mod-title">Szimuláció</div><div class="home-mod-desc">Esetgyakorlatok B és B+ szintre</div></button>'+
    '<button class="home-mod" onclick="go(\'calc\')"><div class="home-mod-icon">🧮</div><div class="home-mod-title">Kalkulátor</div><div class="home-mod-desc">Döntéstámogató</div></button>'+
    '</div>';
}

function renderChapters(){
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Eljárásrend</h2>'+
    CDATA.map(c=>'<button class="card-btn" onclick="go(\'chapter\',\''+c.id+'\')" style="display:flex;align-items:center;gap:10px">'+
    '<div style="font-size:22px">'+c.icon+'</div><div><div style="font-size:14px;font-weight:700">'+c.title+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div></button>').join('');
}

function renderChapter(id){
    var c = CDATA.find(x => x.id === id);
    if(!c) return '';
    var html = '<button class="btn" style="margin-bottom:1rem;background:transparent;border:none;color:#14b8a6;padding:0;font-weight:700" onclick="go(\'chapters\')">‹ Vissza</button>'+
    '<h2 style="font-size:18px;font-weight:700;margin-bottom:1rem;color:'+c.acc+'">'+c.title+'</h2>';
    
    html += c.secs.map(s => {
        let secHtml = '<div class="card"><h3 style="font-size:14px;font-weight:700;color:#f3f4f6;margin-bottom:.5rem;border-bottom:1px solid #3f3f3f;padding-bottom:.5rem">'+s.t+'</h3>';
        s.bk.forEach(b => {
            if(b.tp === 'tx') secHtml += '<p style="font-size:13px;color:#d1d5db;margin-bottom:.5rem;line-height:1.5">'+b.tx+'</p>';
            if(b.tp === 'sub') secHtml += '<div class="sub">'+b.tx+'</div>';
            if(b.tp === 'bl') secHtml += '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
            if(b.tp === 'al') secHtml += '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
        });
        secHtml += '</div>';
        return secHtml;
    }).join('');
    return html;
}

function renderQuiz(){
    if(QZ.done){
        var pct = Math.round(QZ.score/QUIZ.length*100), good = pct>=80;
        return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem">Kvíz eredmény</h2>'+
        '<div class="res-box"><div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fca5a5')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
        '<div class="res-lbl" style="color:'+(good?'#4ade80':'#fca5a5')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
        '<button class="btn btn-g btn-fw" style="margin-top:1rem" onclick="QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();">Újra</button>';
    }
    var q = QUIZ[QZ.idx];
    return '<div style="display:flex;justify-content:space-between;margin-bottom:.5rem"><h2 style="font-size:16px;font-weight:700">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
    '<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
    '<div class="card" style="font-size:14px;font-weight:600;line-height:1.4">'+q.q+'</div>'+
    q.opts.map((opt,i)=>{
        var cls='opt'; 
        if(QZ.sel!==null) { if(i===q.ok) cls+=' opt-ok'; else if(i===QZ.sel) cls+=' opt-no'; }
        return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'>'+opt+'</button>';
    }).join('')+
    (QZ.sel!==null?'<div class="al al-i">'+q.exp+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">Következő</button>':'');
}

function renderSim(){
    if(!SI.id){
        return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem">Szimulációk (Mentőápoló B/B+)</h2>'+
        SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><div style="font-size:14px;font-weight:700">'+s.title+'</div><span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div><div style="font-size:11px;color:#9ca3af">'+s.desc+'</div></button>').join('');
    }
    var sim = SIMS.find(s=>s.id===SI.id);
    if(SI.fin){
        return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem">'+sim.title+' - Eredmény</h2>'+
        '<div class="al al-s"><strong>Összefoglaló az eljárásrend alapján:</strong><br><br>'+sim.summary+'</div>'+
        '<button class="btn btn-r btn-fw" onclick="SI={id:null,step:0,chosen:null,hist:[],fin:false};render();">Vissza</button>';
    }
    var step = sim.steps[SI.step];
    return '<div style="display:flex;justify-content:space-between;margin-bottom:.5rem"><div style="font-size:14px;font-weight:700">'+sim.title+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
    '<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
    '<div class="card" style="font-size:14px;font-weight:600">'+step.sit+'</div>'+
    step.opts.map((opt,i)=>{
        var cls='opt';
        if(SI.chosen!==null) { if(opt.ok) cls+=' opt-ok'; else if(i===SI.chosen) cls+=' opt-no'; }
        return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'>'+opt.tx+'</button>';
    }).join('')+
    (SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+step.opts[SI.chosen].fb+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">Következő</button>':'');
}

function renderCalc(){
    var html = '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem">Döntéstámogató / Kalkulátor</h2>'+
    '<div class="card" style="background:#172554;border-color:#1e3a8a"><div style="font-size:14px;font-weight:700;color:#bfdbfe;margin-bottom:10px">Kórházba Utalás Indikátor Matrix</div>'+
    
    '<div class="chbox-lbl"><input type="checkbox" id="c_laz" onchange="runCalc()"> Komplikált tünet: Láz (>37.7), deréktáji/hát fájdalom, vagy szepszis jelei</div>'+
    '<div class="chbox-lbl"><input type="checkbox" id="c_terhes" onchange="runCalc()"> Várandós</div>'+
    '<div class="chbox-lbl"><input type="checkbox" id="c_gyerek" onchange="runCalc()"> Gyermek beteg (stix pozitív)</div>'+
    '<div class="chbox-lbl"><input type="checkbox" id="c_transz" onchange="runCalc()"> Vese transzplantált</div>'+
    '<div class="chbox-lbl"><input type="checkbox" id="c_vesz" onchange="runCalc()"> Veszélyeztetett (diabetes, immundeprimált, katéter)</div>'+
    '<div class="chbox-lbl"><input type="checkbox" id="c_onellat" onchange="runCalc()"> Egyedül élő, demens, önellátásra képtelen</div>'+
    '<div class="chbox-lbl"><input type="checkbox" id="c_peros" onchange="runCalc()"> Folyadék/gyógyszer szájon át történő bevétele NEM lehetséges (pl. hány)</div>'+
    
    '<div id="calc_res" class="res-box" style="margin-top:1rem;background:#064e3b;border-color:#065f46"><div class="res-lbl" style="color:#4ade80">Nem igényel azonnali kórházi beszállítást.</div><div class="res-txt" style="color:#bbf7d0">Panaszok tartóssága esetén (48-72 óra) háziorvos. Mentőápoló saját döntésből helyszínen nem hagyhat beteget, orvosi konzultáció szükséges!</div></div></div>'+
    
    '<div class="card" style="background:#451a03;border-color:#78350f"><div style="font-size:14px;font-weight:700;color:#fde68a;margin-bottom:10px">Mentőtiszt/Orvos Empirikus Gyógyszer (Egyszerű UTI)</div>'+
    '<select onchange="updateDose(this.value)"><option value="0">Foszfomicin-trometamol</option><option value="1">Nitrofurantoin</option><option value="2">Cefalexin</option><option value="3">Cefuroxim</option><option value="4">Cefixim</option></select>'+
    '<div id="dose_res" style="font-size:14px;color:#fde68a;padding:8px;background:#262626;border-radius:8px;margin-top:10px">Dózis: 3 g egyszeri dózisban</div>'+
    '<div class="al al-d" style="margin-top:10px;font-size:12px">TILOS adni (hazai rezisztencia/előírás miatt): Trimetoprim-szulfametoxazol, Amoxicillin/klavulánsav. Komplikált esetben Nitrofurantoin/Foszfomicin NEM adható!</div></div>';
    
    return html;
}

window.runCalc = function() {
    var c_laz = document.getElementById('c_laz').checked;
    var c_terhes = document.getElementById('c_terhes').checked;
    var c_gyerek = document.getElementById('c_gyerek').checked;
    var c_transz = document.getElementById('c_transz').checked;
    var c_vesz = document.getElementById('c_vesz').checked;
    var c_onellat = document.getElementById('c_onellat').checked;
    var c_peros = document.getElementById('c_peros').checked;
    
    var res = document.getElementById('calc_res');
    
    if(c_laz || c_terhes || c_gyerek || c_transz || c_vesz || c_onellat || c_peros) {
        res.style.background = '#450a0a';
        res.style.borderColor = '#7f1d1d';
        var rtext = '<div class="res-lbl" style="color:#fca5a5">Kórházba utalás és szállítás SZÜKSÉGES!</div>';
        var ok = [];
        if(c_laz) ok.push('Komplikált eset (SBO)');
        if(c_gyerek) ok.push('Gyermekgyógyászati kivizsgálás indikált');
        if(c_terhes || c_vesz || c_transz) ok.push('Speciális / Veszélyeztetett csoport');
        if(c_onellat) ok.push('Szociális/Demencia indikáció');
        rtext += '<div class="res-txt" style="color:#fecaca">Okok: ' + ok.join(', ') + '.</div>';
        res.innerHTML = rtext;
    } else {
        res.style.background = '#064e3b';
        res.style.borderColor = '#065f46';
        res.innerHTML = '<div class="res-lbl" style="color:#4ade80">Nem igényel azonnali kórházi beszállítást.</div><div class="res-txt" style="color:#bbf7d0">Panaszok tartóssága esetén (48-72 óra) háziorvos. Mentőápoló saját döntésből helyszínen nem hagyhat beteget!</div>';
    }
}

window.updateDose = function(val) {
    var d = [
        "Dózis: 3 g egyszeri dózisban.",
        "Dózis: 2-4 x 100 mg, minimum 5 napig.",
        "Dózis: 250-500 mg 6 óránként, 5-7 napig.",
        "Dózis: 2 x 250 mg, 5-7 napig.",
        "Dózis: 1 x 400 mg, 1-3 napig."
    ];
    document.getElementById('dose_res').innerText = d[val];
}

// --- CONTROLLER ---
window.go = function(s, id){ SCR=s; CHID=id; render(); };
window.pickQ = function(i){ if(QZ.sel!==null)return; QZ.sel=i; if(i===QUIZ[QZ.idx].ok) QZ.score++; render(); };
window.nextQ = function(){ if(QZ.idx<QUIZ.length-1){ QZ.idx++; QZ.sel=null; } else QZ.done=true; render(); };
window.startSim = function(id){ SI={id:id,step:0,chosen:null,hist:[],fin:false}; render(); };
window.chooseSim = function(i){ if(SI.chosen!==null)return; SI.chosen=i; SI.hist.push({step:SI.step, oi:i}); render(); };
window.nextSim = function(){ var sim=SIMS.find(s=>s.id===SI.id); if(SI.step<sim.steps.length-1){SI.step++; SI.chosen=null;} else SI.fin=true; render(); };

function render(){
    var c=document.getElementById('ct');
    if(SCR==='home') c.innerHTML=renderHome();
    else if(SCR==='chapters') c.innerHTML=renderChapters();
    else if(SCR==='chapter') c.innerHTML=renderChapter(CHID);
    else if(SCR==='quiz') c.innerHTML=renderQuiz();
    else if(SCR==='sim') c.innerHTML=renderSim();
    else if(SCR==='calc') c.innerHTML=renderCalc();
    
    var tabs=['home','chapters','quiz','sim','calc'];
    var active=SCR==='chapter'?'chapters':SCR;
    document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('act',tabs[i]===active));
    window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
