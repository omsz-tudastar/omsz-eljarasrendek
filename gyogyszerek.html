<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMSZ – Mentőápolói Eljárásrend, Kalkulátor & Szimulátor</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;}
        .app{max-width:760px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);}
        
        /* NAVIGÁCIÓ */
        .nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);}
        .nb{flex:1;padding:10px 2px 8px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;}
        .nb.act{border-top-color:#3b82f6; background:#3b82f615;}
        .ni{font-size:18px;}
        .nl{font-size:10px;color:#9ca3af;font-weight:600;}
        .nb.act .nl{color:#3b82f6;}
        .ct{padding:1.25rem;}
        
        /* KÁRTYÁK ÉS GYÓGYSZER LISTA */
        .card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1.2rem;margin-bottom:1rem;}
        .card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
        .card-btn:hover{background:#333; border-color:#4b5563;}
        
        .calc-header{display:flex;justify-content:space-between;align-items:flex-start;}
        .drug-name{font-size:16px;font-weight:700;color:#f3f4f6;}
        .drug-dose{font-size:16px;color:#3b82f6;font-weight:700;text-align:right;}
        .drug-trade{font-size:13px;color:#9ca3af;font-weight:600;margin-top:2px;}
        
        .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
        .tag-red{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d;}
        .tag-green{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
        .tag-blue{background:#1e3a8a;color:#bfdbfe;border:1px solid #1d4ed8;}
        
        .section-title{font-size:12px;font-weight:800;color:#3b82f6;text-transform:uppercase;margin:14px 0 6px; letter-spacing:0.5px;}
        .section-title.danger{color:#fca5a5;}
        
        /* Szöveg formázás */
        .content-text{font-size:14px;line-height:1.6;color:#d1d5db;word-break: break-word;}
        
        /* SZŰRŐK ÉS KERESŐ */
        .search-box{width:100%;padding:14px;border-radius:12px;border:1px solid #3f3f3f;background:#262626;color:#fff;margin-bottom:1rem;font-size:14px;font-family:inherit;}
        .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;}
        .filter-btn{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#2a2a2a;border:1px solid #3f3f3f;color:#9ca3af;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;}
        .filter-btn.act{background:#3b82f6;color:#fff;border-color:#2563eb;}
        
        /* KALKULÁTOR CSS */
        .sticky-calc{position:sticky;top:60px;z-index:90;background:#1e1e1e;padding:15px 0;border-bottom:1px solid #3f3f3f;margin-bottom:15px;}
        input[type=range]{width:100%;accent-color:#3b82f6;height:20px;background:transparent;margin:12px 0;}
        .calc-card{background:#262626;border:1px solid #3f3f3f;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;}
        .drug-note{font-size:12px;color:#9ca3af;margin-top:4px;border-top:1px dashed #3f3f3f;padding-top:6px;line-height:1.4;}
        
        /* ALERTEK ÉS GOMBOK */
        .al{border-radius:10px;padding:1rem;margin-bottom:1rem;font-size:14px;line-height:1.6;white-space:pre-line;}
        .al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
        .al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
        .al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
        
        .btn{padding:12px 1rem;border:1px solid #4b5563;border-radius:10px;background:#2a2a2a;cursor:pointer;font-size:14px;font-weight:600;color:#e5e7eb;font-family:inherit;transition:all .15s;}
        .btn:hover{background:#374151;}
        .btn-g{background:#2563eb;color:#fff;border-color:#1d4ed8;}
        .btn-g:hover{background:#1d4ed8;}
        .btn-fw{width:100%;display:block;text-align:center;}
        
        /* SZIMULÁCIÓ STÍLUSOK */
        .prog-container{background:#262626;border-radius:6px;height:8px;margin:8px 0 20px;overflow:hidden;border:1px solid #3f3f3f;}
        .prog-bar{background:#3b82f6;height:100%;border-radius:6px;transition:width 0.4s cubic-bezier(0.4, 0, 0.2, 1);}
        .opt{width:100%;display:block;padding:14px;margin-bottom:8px;border:1px solid #3f3f3f;border-radius:10px;cursor:pointer;text-align:left;font-size:14px;color:#e5e7eb;background:#2a2a2a;font-family:inherit;line-height:1.5;transition:all .15s;}
        .opt:hover{background:#374151; border-color:#4b5563;}
        .opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
        .opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}
        
        .res-box{border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1.5rem;background:#064e3b;border:1px solid #065f46;}
        .res-score{font-size:48px;font-weight:800;color:#6ee7b7;line-height:1;}
        .res-text{font-size:16px;font-weight:600;color:#a7f3d0;margin-top:8px;}
        
        /* SZÓTÁR STÍLUSOK */
        .dw { border-bottom: 2px dotted #3b82f6; color: #93c5fd; cursor: pointer; transition: all 0.2s; padding: 0 2px;}
        .dw:hover { color: #fff; background: #2563eb; border-radius: 4px; }
        
        #dict-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1e1e1e; border: 1px solid #3b82f6; border-radius: 12px;
            padding: 24px; z-index: 1000; display: none; width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        #dict-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 999; display: none;
            backdrop-filter: blur(2px);
        }
        .dict-title { font-size: 18px; font-weight: 800; color: #3b82f6; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; text-transform: uppercase;}
        .dict-desc { font-size: 15px; color: #e5e7eb; line-height: 1.6; }
        .dict-close { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #9ca3af; font-size: 28px; line-height: 1; font-weight: 300;}
        .dict-close:hover { color: #fff; }
    </style>
</head>
<body>

<div class="app">
    <nav class="nav">
        <button class="nb act" onclick="show('list')"><span class="ni">💊</span><span class="nl">Gyógyszerek</span></button>
        <button class="nb" onclick="show('calc')"><span class="ni">🧮</span><span class="nl">Adagoló</span></button>
        <button class="nb" onclick="show('sim')"><span class="ni">🚑</span><span class="nl">Szimulációk</span></button>
    </nav>
    <div class="ct" id="main-content"></div>
</div>

<div id="dict-overlay" onclick="closeDict()"></div>
<div id="dict-modal">
    <span class="dict-close" onclick="closeDict()">&times;</span>
    <div class="dict-title" id="dict-title">Szó</div>
    <div class="dict-desc" id="dict-desc">Jelentés</div>
</div>

<script>
// --- SZÓTÁR ADATBÁZIS ---

    "copd": "Krónikus obstruktív tüdőbetegség.",

    "antikonvulzív": "Görcsgátló, görcsoldó hatású.",
    "mucosal atomization device": "Orrnyálkahártyán keresztüli gyógyszerporlasztó eszköz (MAD). Folyadékot mikrocseppekre porlaszt.",
    "rectalisan": "Végbélen keresztül.",
    "per rectum": "Végbélen át.",
    "myasthenia gravis": "Súlyos izomgyengeséggel járó autoimmun betegség.",
    "apnoe": "Légzésleállás, légzési szünet.",
    "glaucoma": "Zöldhályog (magas szemnyomás).",
    "paraszimpatolitikus": "A paraszimpatikus idegrendszer hatását gátló (pl. hörgőtágító) anyag.",
    "hypertrophias obstructiv cardiomyopathia": "A szívizom megvastagodásával és a kiáramlási pálya szűkületével járó szívbetegség (HOCM).",

    "antagonista": "Kötődik a receptorhoz, de nem aktiválja azt, ezáltal gátolja a receptor működését.",

    "prodrug": "Olyan hatóanyag, amely csak a szervezetben (pl. májban) alakul át aktív formává.",

    "hypoxaemia": "Kórosan alacsony oxigénszint a vérben.",

    "bronchospazmus": "A hörgők izomzatának görcsös összehúzódása (alsó légúti szűkület).",
    "cpr": "Cardiopulmonalis resuscitatio (újraélesztés).",
    "aed": "Automata külső defibrillátor.",
    "opa": "Oropharyngealis légúti segédeszköz (Guedel-tubus).",

    "ileus": "Bélelzáródás.",
    "pneumopericardium": "Levegő a szívburokban.",
    "b12-vitamin hiány": "A B12 vitamin hiánya, mely a Livopan (nitrogén-oxidul) használatakor genetikailag veszélyes lehet.",
    "intranasalis": "Orrüregbe adagolt (porlasztva)."
};

const dictKeys = Object.keys(DICT).sort((a, b) => b.length - a.length);
const bChars = 'a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ0-9'; 
const escKeys = dictKeys.map(k => k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
const dictRegex = new RegExp('(^|[^' + bChars + '])(' + escKeys.join('|') + ')(?=[^' + bChars + ']|$)', 'gi');

function wD(txt) {
    if(!txt) return '';
    return String(txt).replace(dictRegex, function(match, p1, p2) {
        return p1 + '<span class="dw" onclick="sD(\'' + p2.toLowerCase() + '\', event)">' + p2 + '</span>';
    });
}

// TISZTA HTML ALAPÚ LISTA FORMÁZÁS!
function fL(txt) {
    if(!txt) return '';
    let lines = txt.split('\n');
    let html = '';
    let inList = false;
    let inSub = false;

    lines.forEach(line => {
        let t = line.trim();
        if (t.startsWith('•')) {
            if (inSub) { html += '</ul>'; inSub = false; }
            // Tiszta ul formázás alap margin/padding értékekkel
            if (!inList) { html += '<ul style="margin: 4px 0 8px; padding-left: 24px; list-style-type: disc; list-style-position: outside;">'; inList = true; }
            html += `<li style="margin-bottom: 4px;">${wD(t.substring(1).trim())}</li>`;
        } else if (t.startsWith('-')) {
            if (!inList) { html += '<ul style="margin: 4px 0 8px; padding-left: 24px; list-style-type: disc; list-style-position: outside;">'; inList = true; }
            // Albontásokhoz üres karika
            if (!inSub) { html += '<ul style="margin: 2px 0 4px; padding-left: 24px; list-style-type: circle; list-style-position: outside;">'; inSub = true; }
            html += `<li style="margin-bottom: 4px;">${wD(t.replace(/^-+\s*/, ''))}</li>`;
        } else {
            if (inSub) { html += '</ul>'; inSub = false; }
            if (inList) { html += '</ul>'; inList = false; }
            if (t !== '') {
                html += `<div style="margin-bottom: 6px;">${wD(line)}</div>`;
            }
        }
    });
    
    if (inSub) html += '</ul>';
    if (inList) html += '</ul>';

    return html;
}

function sD(key, e) {
    e.stopPropagation();
    document.getElementById('dict-title').innerText = key;
    document.getElementById('dict-desc').innerText = DICT[key];
    document.getElementById('dict-overlay').style.display = 'block';
    document.getElementById('dict-modal').style.display = 'block';
}

function closeDict() {
    document.getElementById('dict-overlay').style.display = 'none';
    document.getElementById('dict-modal').style.display = 'none';
}

// --- GYÓGYSZER ADATBÁZIS ---
const DRUGS = [
    { name: "Szalbutamol", trade: "VENTOLIN Evohaler", cat: "Légzés", repeat: true, effect: "Hatóanyaga, a szalbutamol szelektív béta2-adrenoreceptor agonista hörgőtágító, amely hatását terápiás adagban a hörgő simaizomzatának béta2-receptorain fejti ki.", indication: "Mentőápoló akkor adhatja, ha a beteg nem használt a saját spray-ből legalább 2 expozíciót:\n• bronchusok heveny spazmusával járó kórképek esetén\n• COPD\n• Asthma bronchiale\n• Anaphylaxia", dosage: "Felnőtt: 1-2 adag inhalálása belégzésben a beteg kooperálásával.\nGyermekek: 1-2 adag belélegezve (de a hatékony gyógyszerbevitelhez szükség van arcmaszkos vagy csutorás visszalégző tartályra).", contra: "• 20 perc után 1x ismételhető.\n• szalbutamol, illetve a készítmény valamelyik alkotórészével szembeni allergia\n• manifeszt hyperthyreosis\n• a szalbutamol nem intravénás gyógyszerformáit tilos szövődménymentes koraszülés vagy fenyegető abortusz megakadályozására használni.\nTerhesség: Csak akkor szabad alkalmazni, ha az anya szempontjából jelentkező előny nagyobb, mint a magzatot érintő potenciális veszély." },
    { name: "Acetilszalicilsav", trade: "Aspirin, ASA", cat: "Kardiológia / Láz", repeat: false, effect: "Fájdalomcsillapító, lázcsillapító és gyulladásgátló hatású, savas nemszteroid gyulladáscsökkentők csoportjába tartozik. Az acetilszalicilsav a thrombocyta-aggregációt is gátolja.", indication: "• igazolt STEMI/NSTE-ACS vagy TTEKG alapján orvos utasítására.\n• felnőtteknél fájdalom esetén, ha dinitrogén-oxid (Livopan) és/vagy metamizol-nátrium (Algopyrin) nem adható.\n• felnőtteknél magas láz (39°C fölött) esetén, és metamizol-nátrium (Algopyrin) nem adható.", dosage: "• Igazolt STEMI/NSTE-ACS vagy TTEKG alapján igazolt esetben a dózisa 150-300 mg (praktikusan 250 mg – fél tabletta). A tablettát azonnal, a gyorsabb felszívódás érdekében szét kell rágatni.\n• Fájdalom és láz esetén: 1 tabletta per os, folyadékkel bevéve (napi max 4 db).", contra: "• Nem ismételhető!\n• acetilszalicilsavval szembeni allergia\n• anamnézisben szalicilátok/NSAID hatására kialakult asztma/angiooedema\n• aktív gyomor- és nyombélfekély\n• vérzékenység, akut vérzés\n• súlyos máj-/vesekárosodás\n• terhesség 6. hónapjának kezdetétől (amenorrhoea 24. hete után)\n• 12. életév alatti életkor.\nTerhesség: Első 24 hétben nem ajánlott. 24. héttől szigorúan ellenjavallt!" },
    { name: "Adrenalin", trade: "TONOGEN inj. 1mg/ml", cat: "Újraélesztés / Anaphylaxia", repeat: true, effect: "A szívműködést serkenti, perifériás érszűkítő, a vérnyomást emeli.", indication: "• Újraélesztés: folyamatosan fenntartott X-BLS, AED használat mellett, LMA behelyezését követően és harmadik személy jelenléte esetén.\n• Heveny túlérzékenységi reakció (anaphylaxia).", dosage: "• Újraélesztés során a mentőápoló egyszeri 1 mg iv. bólus adagot alkalmazhat (nem sokkolandó ritmus esetén azonnal, sokkolandó ritmus esetén a 3. sokk után). Újraélesztés során nem ismételhető!\n• Anaphylaxia esetén: 0,01 mg/ttkg im.\n- 12 év felett: max. 0,5 mg im. (0,5 ml)\n- 6-12 év között: max. 0,3 mg im. (0,3 ml)\n- 6 éves kor alatt: max. 0,15 mg im. (0,15 ml)", contra: "• Anaphylaxia esetén 5-15 perc elteltével mentőápoló egyszer ismételheti!\n• A fenti javallati körben a sürgősségi ellátás során abszolút ellenjavallata nincs.\nTerhesség: Kizárólag akkor adható terhes nőnek, ha a várható előny nagyobb a kockázatnál." },

// --- RENDERELŐ MOTOR (UI LOGIKA) ---
function renderList(focusSearch = false) {
    const container = document.getElementById('main-content');
    const searchTerm = window.searchTerm || '';
    const activeCat = window.activeCat || 'Összes';
    const cats = ['Összes', ...new Set(DRUGS.map(d => d.cat))];
    
    let html = `
        <h2 style="font-size:22px;font-weight:800;margin-bottom:1rem;color:#f3f4f6;letter-spacing:0.5px">Gyógyszer Adattár</h2>
        <input type="text" id="search-input" class="search-box" placeholder="Keresés (név, indikáció, hatás...)" oninput="window.searchTerm=this.value; renderList(true);" value="${searchTerm}">
        <div class="filter-row">
            ${cats.map(c => `<button class="filter-btn ${activeCat === c ? 'act' : ''}" onclick="window.activeCat='${c}'; renderList();">${c}</button>`).join('')}
        </div>
    `;

    const filtered = DRUGS.filter(d => {
        const matchSearch = d.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            d.indication.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            d.trade.toLowerCase().includes(searchTerm.toLowerCase());
        const matchCat = activeCat === 'Összes' || d.cat === activeCat;
        return matchSearch && matchCat;
    });

    if(filtered.length === 0) {
        html += `<div class="al al-i">Nincs találat a keresési feltételeknek megfelelően.</div>`;
    }

    filtered.forEach(d => {
        html += `
            <div class="card">
                <div class="calc-header" style="margin-bottom:12px; border-bottom:1px solid #3f3f3f; padding-bottom:10px;">
                    <div>
                        <div class="drug-name">${wD(d.name)}</div>
                        <div class="drug-trade">${wD(d.trade)}</div>
                    </div>
                    <span class="tag ${d.repeat ? 'tag-green' : 'tag-red'}">${d.repeat ? 'Ismételhető' : 'Nem ismételhető!'}</span>
                </div>
                <div class="section-title">Hatás</div>
                <div class="content-text" style="color:#9ca3af; margin-bottom:8px;">${fL(d.effect)}</div>
                
                <div class="section-title">Javallat (Indikáció)</div>
                <div class="content-text" style="background:#1e3a8a20; padding:10px; border-left:4px solid #3b82f6; border-radius:6px; margin-bottom:8px;">${fL(d.indication)}</div>
                
                <div class="section-title" style="color:#60a5fa;">Adagolás</div>
                <div class="content-text" style="background:#064e3b20; padding:10px; border-left:4px solid #10b981; border-radius:6px; font-weight:600; color:#6ee7b7; margin-bottom:8px;">${fL(d.dosage)}</div>
                
                <div class="section-title danger">Ellenjavallat / Figyelmeztetés</div>
                <div class="content-text" style="background:#450a0a30; padding:10px; border-left:4px solid #ef4444; border-radius:6px; color:#fca5a5;">${fL(d.contra)}</div>
            </div>
        `;
    });
    container.innerHTML = html;

    if (focusSearch) {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.focus();
            const len = searchInput.value.length;
            searchInput.setSelectionRange(len, len);
        }
    }
}

// --- KALKULÁTOR MOTOR ---
function renderCalc() {
    const w = window.currentWeight || 75;
    const a = window.currentAge !== undefined ? window.currentAge : 30;
    const aDisp = a === 0 ? "< 1 év" : a + " év";
    
    document.getElementById('main-content').innerHTML = `
        <h2 style="font-size:22px;font-weight:800;margin-bottom:1rem;color:#f3f4f6;letter-spacing:0.5px">Automatikus Adagoló Kalkulátor</h2>
        <div class="card sticky-calc" style="border-color:#3b82f6;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="section-title" style="margin:0;">Beteg testtömege (kg)</div>
                <div id="weight-display" style="font-size:22px; font-weight:800; color:#3b82f6;">${w} kg</div>
            </div>
            <input type="range" id="slider-weight" min="3" max="150" value="${w}" oninput="updateSliders()" onchange="updateSliders()">
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <div class="section-title" style="margin:0;">Beteg életkora (év)</div>
                <div id="age-display" style="font-size:22px; font-weight:800; color:#3b82f6;">${aDisp}</div>
            </div>
            <input type="range" id="slider-age" min="0" max="100" value="${a}" oninput="updateSliders()" onchange="updateSliders()">
        </div>
        <div id="calc-results"></div>
    `;
    updateCalc(w, a);
}

function updateSliders() {
    const w = document.getElementById('slider-weight').value;
    const a = document.getElementById('slider-age').value;
    window.currentWeight = parseInt(w);
    window.currentAge = parseInt(a);
    
    document.getElementById('weight-display').innerText = window.currentWeight + " kg";
    document.getElementById('age-display').innerText = window.currentAge === 0 ? "< 1 év" : window.currentAge + " év";
    
    updateCalc(window.currentWeight, window.currentAge);
}

function updateCalc(weight, age) {
    let html = '<div class="section-title" style="font-size:14px; margin-bottom:12px;">1. Súly- és Korfüggő Gyógyszerek</div>';
    
    const row = (name, dose, note, warn = false) => `
        <div class="calc-card" style="${warn ? 'border-color:#b91c1c; background:#450a0a20;' : ''}">
            <div class="calc-header">
                <div class="drug-name" style="${warn ? 'color:#fca5a5;' : ''}">${wD(name)}</div>
                <div class="drug-dose" style="${warn ? 'color:#ef4444;' : ''}">${wD(dose)}</div>
            </div>
            ${note ? `<div class="drug-note" style="${warn ? 'border-top-color:#7f1d1d; color:#fca5a5;' : ''}">${wD(note)}</div>` : ''}
        </div>
    `;

    // Adrenalin
    let adrDose = weight * 0.01;
    let adrText = "";
    if (age >= 12) {
        adrDose = Math.min(adrDose, 0.5);
        adrText = adrDose.toFixed(2) + " mg / " + adrDose.toFixed(2) + " ml";
    } else if (age >= 6) {
        adrDose = Math.min(adrDose, 0.3);
        adrText = adrDose.toFixed(2) + " mg / " + adrDose.toFixed(2) + " ml";
    } else {
        adrDose = Math.min(adrDose, 0.15);
        adrText = adrDose.toFixed(2) + " mg / " + adrDose.toFixed(2) + " ml";
    }
    html += row("Adrenalin (Anaphylaxia im.)", adrText, "0,01 mg/ttkg szabály. Max adag korcsoportonként korlátozva.");

    // Midazolam
    let midDose = Math.min(weight * 0.2, 10).toFixed(1);
    let midVol = (midDose / 5).toFixed(2);
    html += row("Midazolam (Dormicum MAD)", midDose + " mg (" + midVol + " ml)", `0,2 mg/kg, hígítatlanul orrba porlasztva! Max 10 mg.${weight < 10 ? ' 10 kg alatt relatív ellenjavallt (de adható)!' : ''}`);

    // Glükóz
    if (age >= 18 || weight >= 40) {
        let minGluk = (weight * 1.0).toFixed(0);
        let maxGluk = (weight * 1.5).toFixed(0);
        html += row("Glükóz 20% (Hypoglykaemia iv.)", minGluk + " - " + maxGluk + " ml", "Felnőtt adag: 1-1,5 ml/ttkg iv./io.");
    } else {
        let glukGyermek = (weight * 2.5).toFixed(0);
        html += row("Glükóz 10% (Hypoglykaemia iv.)", glukGyermek + " ml", "Gyermek adag: 2,5 ml/ttkg iv./io. Figyelem: A 20%-os oldatot felesbe hígítva kell adni!");
    }

    // Glükagon
    if (weight >= 25 || age >= 6) {
        html += row("Glükagon (Sikertelen véna hypo)", "1 mg im.", "Felnőtt és 25 kg feletti adag. Kizárólag intramuscularisan (im.).");
    } else {
        html += row("Glükagon (Sikertelen véna hypo)", "0,5 mg im.", "25 kg alatti adag. Kizárólag intramuscularisan (im.).");
    }

    // Diazepám
    let diaz = "";
    if (age === 0) {
        html += row("Diazepám rectalis oldat", "KONTRAINDIKÁLT!", "1 év alatti életkorban ellenjavallt a protokoll alapján!", true);
    } else {
        if (weight < 15) diaz = "5 mg (fél tubus)";
        else if (age < 18) diaz = "10 mg (1 tubus)";
        else diaz = "20 mg (2 tubus)";
        html += row("Diazepám rectalis oldat", diaz, "Kizárólag rectalisan adható! Lélegeztetési készenlétben.");
    }

    // Dexamethasone
    let dexa = "";
    if (weight < 10) dexa = "2 mg (fél tabletta)";
    else if (weight <= 15) dexa = "4 mg (1 tabletta)";
    else if (weight <= 20) dexa = "6 mg (másfél tabletta)";
    else dexa = "8 mg (2 tabletta)";
    html += row("Dexametazon tbl. (Krupp per os)", dexa, "Krupp elsővonalbeli terápiája. Édes folyadékban összetörve itatni.");

    // Nurofen
    if (age === 0 || weight < 6) {
        html += row("Ibuprofén (Nurofen 60mg kúp)", "KONTRAINDIKÁLT!", "6 kg alatt vagy 3 hónapos korig ellenjavallt.", true);
    } else if (weight <= 12.5 || age <= 2) {
        html += row("Ibuprofén (Nurofen 60mg kúp)", "1 db kúp (60 mg)", "6-12,5 kg között. 6-8 óránként ismételhető.");
    } else if (age < 18) {
        html += row("Ibuprofén (Nurofen 60mg kúp)", "2 db kúp (120 mg)", "12,5 kg felett. 6-8 óránként ismételhető.");
    } else {
        html += row("Ibuprofén (Láz/fájdalom)", "Felnőtt protokoll", "A 60 mg-os gyermek kúp felnőttek esetén nem releváns.");
    }

    // Berodual
    if (age >= 12) {
        html += row("Berodual (Inhalációs oldat)", "1 ml (20 csepp)", "Felnőtt és 12 év felett. Max 5 ml-re hígítva 0,9% NaCl-al.");
    } else {
        html += row("Berodual (Inhalációs oldat)", "0,5 - 1 ml (10-20 csepp)", "12 év alatt. Max 5 ml-re hígítva 0,9% NaCl-al.");
    }

    // Isolyte
    if (age >= 16 || weight >= 50) {
        html += row("Krisztalloid (Isolyte folyadékpótlás)", "250 ml bólus", "Felnőtt bólus. Re-evaluációt követően ismételhető.");
    } else {
        html += row("Krisztalloid (Isolyte folyadékpótlás)", (weight * 10) + " ml bólus", "Gyermek bólus (10 ml/kg).");
    }

    html += '<div class="section-title" style="font-size:14px; margin-top:24px; margin-bottom:12px;">2. Fix Dózisok & Felnőtt Specifikus Gyógyszerek</div>';
    
    // Algopyrin
    if (age >= 15) {
        html += row("Algopyrin (Metamizol-nátrium)", "1 g (2 ml) iv.", "Lassan (1 ml/perc). ACS gyanúja esetén mentőápolónak TILOS!");
    } else {
        html += row("Algopyrin (Metamizol-nátrium)", "NEM ADHATÓ!", "Mentőápoló csak felnőttnél alkalmazhatja.", true);
    }

    // Kaptopril
    if (age >= 18) {
        html += row("Kaptopril (Aceomel 12.5mg)", "1 tabletta", "Szájban elolvadásig (sublingualis). SBP>220/120 esetén neuro tünet nélkül.");
    } else {
        html += row("Kaptopril (Aceomel 12.5mg)", "NEM ADHATÓ!", "Mentőápoló gyermeknél nem alkalmazhatja.", true);
    }

    // Aspirin
    if (age >= 12) {
        html += row("Acetilszalicilsav (Aspirin/ASA)", "150-300 mg", "STEMI/ACS esetén (250 mg praktikusan) azonnal szétrágatni. Láz esetén napi max 4 tbl (egyben).");
    } else {
        html += row("Acetilszalicilsav (Aspirin/ASA)", "NEM ADHATÓ!", "12 év alatti életkorban ellenjavallt.", true);
    }

    html += row("Adrenalin (Újraélesztés)", "1 mg iv. bólus", "Mentőápoló által NEM ismételhető CPR során.");
    html += row("Nitroglicerin (Nitrolingual spray)", "0,4 mg (1 puff)", "Nyelv alá. SBP>90 esetén 10 percenként max 3x ismételhető. Viagra/Cialis 48h-n belül tilos!");
    html += row("Klopidogrél (Trombex 75mg)", "600 mg per os", "Önállóan mentőápoló nem adhatja! Primer PCI előtt orvosi utasításra (ha szedi: 300mg).");
    html += row("Szalbutamol (Ventolin spray)", "1-2 adag inhalálva", "20 perc után 1x ismételhető. Maszkos visszalégző kell gyereknek.");
    html += row("Rectodelt (Prednizon kúp)", "30 mg", "Krupp vagy asztma esetén gyermeknek per rectum (ha a tabletta nem itatható).");
    html += row("Livopan (Nitrogén-oxidul gáz)", "Demand szelep", "Csak kooperáló felnőtt betegnél, fájdalomcsillapításra önadagolóval.");
    html += row("Oxigén (Orvosi gáz)", "Titrált (Cél: 94-98%)", "Kritikus állapotban: 100% (12-15 L/min). COPD esetén: 88-92%.");

    const resDiv = document.getElementById('calc-results');
    if (resDiv) resDiv.innerHTML = html;
}

// --- SZIMULÁTOR MOTOR ---
let currentSim = null;
let simStep = 0;
let simHist = [];
let simFinished = false;

function renderSim() {
    const container = document.getElementById('main-content');
    
    if (!currentSim) {
        let html = '<h2 style="font-size:22px;font-weight:800;margin-bottom:1rem;color:#f3f4f6;letter-spacing:0.5px">Szimulációs Esetek</h2>';
        html += '<div class="al al-i" style="border-color:#3b82f6;">Ez a 6 komplex eset az eljárásrend összes (18 db) mentőápolói gyógyszerét, indikációját és kontraindikációját kikérdezi a B és B+ szint alapján. Az esetek végén részletes klinikai összefoglaló olvasható!</div>';
        SIMULATIONS.forEach(s => {
            html += `<button class="card-btn" onclick="startSim('${s.id}')">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div style="font-size:16px;font-weight:700;color:#f3f4f6">${wD(s.title)}</div>
                    <span class="tag tag-blue">${s.diff}</span>
                </div>
                <div style="font-size:13px;color:#9ca3af;margin-bottom:8px;line-height:1.4;">${wD(s.desc)}</div>
                <div style="font-size:12px;color:#60a5fa;font-weight:600">${s.steps.length} kérdéses teljes eset</div>
            </button>`;
        });
        container.innerHTML = html;
        return;
    }

    const sim = SIMULATIONS.find(s => s.id === currentSim);

    if (simFinished) {
        const correct = simHist.filter(h => sim.steps[h.step].opts[h.oi].ok).length;
        const pc = Math.round((correct / sim.steps.length) * 100);
        let html = `<h2 style="font-size:20px;font-weight:800;color:#f3f4f6;margin-bottom:1rem">Eredmény: ${wD(sim.title)}</h2>`;
        html += `<div class="res-box"><div class="res-score">${pc}%</div><div class="res-text">Helyes döntések: ${correct} / ${sim.steps.length}</div></div>`;
        
        // ESETÖSSZEFOGLALÓ RÉSZ
        html += `<div class="al al-i" style="margin-bottom:1.5rem; font-size:15px; border-color:#3b82f6;"><b>Az eset átfogó értékelése (Ideális betegút):</b><br><br>${wD(sim.summary)}</div>`;
        
        html += `<h3 style="font-size:16px;font-weight:700;color:#f3f4f6;margin-bottom:10px;border-bottom:1px solid #3f3f3f;padding-bottom:5px">Lépésről lépésre – Részletes Értékelés:</h3>`;
        
        simHist.forEach((hh, i) => {
            const st = sim.steps[hh.step];
            const opt = st.opts[hh.oi];
            html += `<div class="card" style="margin-bottom:10px; padding:15px; border-color:${opt.ok ? '#059669' : '#b91c1c'}; background:${opt.ok ? '#064e3b15' : '#450a0a15'}">
                <div style="font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:8px">${i+1}. ${wD(st.sit)}</div>
                <div style="font-size:13px;color:${opt.ok ? '#4ade80' : '#fca5a5'};margin-bottom:6px"><b>A Te válaszod:</b> ${wD(opt.tx)}</div>
                <div style="font-size:12px;color:#9ca3af;line-height:1.5; border-top:1px dashed #4b5563; padding-top:6px; margin-top:4px;"><i>Magyarázat:</i> ${wD(opt.fb)}</div>
            </div>`;
        });
        html += `<button class="btn btn-fw btn-g" style="margin-top:15px" onclick="currentSim=null;renderSim()">Vissza a szimulátor menübe</button>`;
        container.innerHTML = html;
        return;
    }

    const stepData = sim.steps[simStep];
    const existingHist = simHist.find(h => h.step === simStep);
    
    let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <div style="font-size:15px;font-weight:700;color:#3b82f6">${wD(sim.title)}</div>
            <span style="font-size:13px;color:#9ca3af;font-weight:700">Kérdés: ${simStep + 1} / ${sim.steps.length}</span>
        </div>
        <div class="prog-container">
            <div class="prog-bar" style="width:${((simStep + 1) / sim.steps.length * 100)}%"></div>
        </div>
        <div class="card" style="margin-bottom:1.5rem; border-color:#4b5563; background:#1e1e1e;">
            <div style="font-size:16px;font-weight:600;color:#f3f4f6;line-height:1.6">${wD(stepData.sit)}</div>
        </div>
    `;

    stepData.opts.forEach((opt, i) => {
        let cls = 'opt';
        if (existingHist) {
            if (opt.ok) cls += ' opt-ok';
            else if (i === existingHist.oi && !opt.ok) cls += ' opt-no';
        }
        html += `<button class="${cls}" ${!existingHist ? `onclick="chooseSimOption(${i})"` : ''}>${wD(opt.tx)}</button>`;
    });

    if (existingHist) {
        const chosenOpt = stepData.opts[existingHist.oi];
        html += `<div class="al ${chosenOpt.ok ? 'al-s' : 'al-d'}" style="margin-top:15px"><b>Visszajelzés:</b><br>${wD(chosenOpt.fb)}</div>`;
        html += `<button class="btn btn-fw btn-g" style="margin-top:15px" onclick="nextSimStep()">${simStep < sim.steps.length - 1 ? 'Tovább a következő lépésre →' : 'Eredmények Megtekintése'}</button>`;
    }

    container.innerHTML = html;
}

function startSim(id) {
    currentSim = id;
    simStep = 0;
    simHist = [];
    simFinished = false;
    renderSim();
}

function chooseSimOption(idx) {
    simHist.push({ step: simStep, oi: idx });
    renderSim();
}

function nextSimStep() {
    const sim = SIMULATIONS.find(s => s.id === currentSim);
    if(simStep < sim.steps.length - 1) {
        simStep++;
    } else {
        simFinished = true;
    }
    renderSim();
}

// --- NAVIGÁCIÓ ---
function show(screen) {
    document.querySelectorAll('.nb').forEach((btn, i) => {
        btn.classList.toggle('act', (i === 0 && screen === 'list') || (i === 1 && screen === 'calc') || (i === 2 && screen === 'sim'));
    });
    if (screen === 'list') renderList();
    else if (screen === 'calc') renderCalc();
    else if (screen === 'sim') renderSim();
    window.scrollTo(0, 0);
}

window.onload = function() {
    window.currentWeight = 75;
    window.currentAge = 30;
    show('list'); 
};
</script>
