// Hosszúság szerinti csökkenő sorrend, hogy a hosszabb kifejezések cserélődjenek először
const dictKeys = Object.keys(DICT).sort((a, b) => b.length - a.length);

function wD(txt) {
    if(!txt) return '';
    let res = String(txt);
    dictKeys.forEach(k => {
        let esc = k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        let regex = new RegExp('(^|[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ])(' + esc + ')(?=[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]|$)', 'gi');
        res = res.replace(regex, '$1<span class="dw" onclick="sD(\'' + k + '\', event)">$2</span>');
    });
    return res;
}

function sD(key, e) {
    e.stopPropagation();
    document.getElementById('dict-title').innerText = key;
    document.getElementById('dict-desc').innerText = DICT[key];
    document.getElementById('dict-overlay').style.display = 'block';
    document.getElementById('dict-modal').style.display = 'block';
}

function closeDict() {
    document.getElementById('dict-overlay').style.display = 'none';
    document.getElementById('dict-modal').style.display = 'none';
}

// --- RENDERELŐ MOTOR (UI LOGIKA) ---
function renderList(focusSearch = false) {
    const container = document.getElementById('main-content');
    const searchTerm = window.searchTerm || '';
    const activeCat = window.activeCat || 'Összes';
    const cats = ['Összes', ...new Set(DRUGS.map(d => d.cat))];
    
    let html = `
        <h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Gyógyszer Adattár (100% Kártya alapú)</h2>
        <input type="text" id="search-input" class="search-box" placeholder="Keresés (név, indikáció, hatás...)" oninput="window.searchTerm=this.value; renderList(true);" value="${searchTerm}">
        <div class="filter-row">
            ${cats.map(c => `<button class="filter-btn ${activeCat === c ? 'act' : ''}" onclick="window.activeCat='${c}'; renderList();">${c}</button>`).join('')}
        </div>
    `;

    const filtered = DRUGS.filter(d => {
        const matchSearch = d.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            d.indication.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            d.trade.toLowerCase().includes(searchTerm.toLowerCase());
        const matchCat = activeCat === 'Összes' || d.cat === activeCat;
        return matchSearch && matchCat;
    });

    filtered.forEach(d => {
        html += `
            <div class="card">
                <div class="calc-header" style="margin-bottom:8px;">
                    <div>
                        <div class="drug-name">${wD(d.name)}</div>
                        <div class="drug-trade">${wD(d.trade)}</div>
                    </div>
                    <span class="tag ${d.repeat ? 'tag-green' : 'tag-red'}">${d.repeat ? 'Ismételhető' : 'Nem ismételhető'}</span>
                </div>
                <div class="section-title">Hatás</div>
                <div class="content-text" style="color:#9ca3af;">${wD(d.effect)}</div>
                <div class="section-title">Javallat</div>
                <div class="content-text">${wD(d.indication)}</div>
                <div class="section-title">Adagolás</div>
                <div class="content-text" style="color:#60a5fa; font-weight:600;">${wD(d.dosage)}</div>
                <div class="section-title" style="color:#fca5a5;">Ellenjavallat / Figyelmeztetés</div>
                <div class="content-text" style="color:#fca5a5;">${wD(d.contra)}</div>
            </div>
        `;
    });
    container.innerHTML = html;

    if (focusSearch) {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.focus();
            const len = searchInput.value.length;
            searchInput.setSelectionRange(len, len);
        }
    }
}

function renderCalc() {
    const w = window.currentWeight || 75;
    const a = window.currentAge !== undefined ? window.currentAge : 30;
    const aDisp = a === 0 ? "< 1 év" : a + " év";
    
    document.getElementById('main-content').innerHTML = `
        <h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Automatikus Adagoló Kalkulátor</h2>
        <div class="card sticky-calc" style="border-color:#14b8a6;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="section-title" style="margin:0;">Beteg testsúlya</div>
                <div id="weight-display" style="font-size:20px; font-weight:700; color:#14b8a6;">${w} kg</div>
            </div>
            <input type="range" id="slider-weight" min="3" max="150" value="${w}" oninput="updateSliders()" onchange="updateSliders()">
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                <div class="section-title" style="margin:0;">Beteg életkora</div>
                <div id="age-display" style="font-size:20px; font-weight:700; color:#14b8a6;">${aDisp}</div>
            </div>
            <input type="range" id="slider-age" min="0" max="100" value="${a}" oninput="updateSliders()" onchange="updateSliders()">
        </div>
        <div id="calc-results"></div>
    `;
    updateCalc(w, a);
}

function updateSliders() {
    const w = document.getElementById('slider-weight').value;
    const a = document.getElementById('slider-age').value;
    window.currentWeight = parseInt(w);
    window.currentAge = parseInt(a);
    
    document.getElementById('weight-display').innerText = window.currentWeight + " kg";
    document.getElementById('age-display').innerText = window.currentAge === 0 ? "< 1 év" : window.currentAge + " év";
    
    updateCalc(window.currentWeight, window.currentAge);
}

function updateCalc(weight, age) {
    let html = '<div class="section-title">1. Súly- és Korfüggő Gyógyszerek</div>';
    
    const row = (name, dose, note) => `
        <div class="calc-card">
            <div class="calc-header">
                <div class="drug-name">${wD(name)}</div>
                <div class="drug-dose">${wD(dose)}</div>
            </div>
            ${note ? `<div class="drug-note">${wD(note)}</div>` : ''}
        </div>
    `;

    let adrDose = weight * 0.01;
    let adrText = "";
    if (age >= 12) {
        adrDose = Math.min(adrDose, 0.5);
        adrText = adrDose.toFixed(2) + " mg / " + adrDose.toFixed(2) + " ml";
    } else if (age >= 6) {
        adrDose = Math.min(adrDose, 0.3);
        adrText = adrDose.toFixed(2) + " mg / " + adrDose.toFixed(2) + " ml";
    } else {
        adrDose = Math.min(adrDose, 0.15);
        adrText = adrDose.toFixed(2) + " mg / " + adrDose.toFixed(2) + " ml";
    }
    html += row("Adrenalin - Anaphylaxia (im.)", adrText, "0,01 mg/ttkg. Felnőtt/12+: max 0,5mg. 6-12év: max 0,3mg. <6év: max 0,15mg.");

    let midDose = Math.min(weight * 0.2, 10).toFixed(1);
    let midVol = (midDose / 5).toFixed(2);
    html += row("Midazolam (Dormicum MAD)", midDose + " mg (" + midVol + " ml)", "0,2 mg/kg, hígítatlanul! Max 10 mg. Intranasalisan.");

    if (age >= 18 || weight >= 40) {
        let minGluk = (weight * 1.0).toFixed(0);
        let maxGluk = (weight * 1.5).toFixed(0);
        html += row("Glükóz 20% (iv.)", minGluk + " - " + maxGluk + " ml", "Felnőtt adag: 1-1,5 ml/ttkg iv./io.");
    } else {
        let glukGyermek = (weight * 2.5).toFixed(0);
        html += row("Glükóz 10% (iv.)", glukGyermek + " ml", "Gyermek adag: 2,5 ml/ttkg iv./io. Figyelem: A 20%-os oldatot felesbe hígítva kell adni!");
    }

    if (weight >= 25 || age >= 6) {
        html += row("Glükagon (GlucaGen)", "1 mg", "Felnőtt és 25 kg feletti adag. Kizárólag intramuscularisan (im.).");
    } else {
        html += row("Glükagon (GlucaGen)", "0,5 mg", "25 kg alatti adag. Kizárólag intramuscularisan (im.).");
    }

    let diaz = "";
    if (age === 0) {
        html += row("Diazepám rectalis oldat", "NEM ADHATÓ!", "1 év alatti életkorban ellenjavallt a protokoll alapján!");
    } else {
        if (weight < 15) diaz = "5 mg (1/2 tubus)";
        else if (age < 18) diaz = "10 mg (1 tubus)";
        else diaz = "20 mg (2 tubus)";
        html += row("Diazepám rectalis oldat", diaz, "Kizárólag rectalisan adható! Lélegeztetési készenlétben.");
    }

    let dexa = "";
    if (weight < 10) dexa = "2 mg (fél tabletta)";
    else if (weight <= 15) dexa = "4 mg (1 tabletta)";
    else if (weight <= 20) dexa = "6 mg (1,5 tabletta)";
    else dexa = "8 mg (2 tabletta)";
    html += row("Dexamethasone tbl.", dexa, "Krupp elsővonalbeli terápiája. Édes folyadékban összetörve itatni.");

    if (age === 0 || weight < 6) {
        html += row("Nurofen (Ibuprofén) 60mg kúp", "NEM ADHATÓ!", "6 kg alatt vagy 3 hónapos korig ellenjavallt.");
    } else if (weight <= 12.5 || age <= 2) {
        html += row("Nurofen (Ibuprofén) 60mg kúp", "1 db kúp (60 mg)", "6-12,5 kg között. 6-8 óránként ismételhető.");
    } else if (age < 18) {
        html += row("Nurofen (Ibuprofén) 60mg kúp", "2 db kúp (120 mg)", "12,5 kg felett. 6-8 óránként ismételhető.");
    } else {
        html += row("Ibuprofén / Lázcsillapítás", "Felnőtt protokoll", "A 60 mg-os kúp felnőttek esetén nem elegendő/releváns.");
    }

    if (age >= 12) {
        html += row("Berodual inhaláció", "1 ml (20 csepp)", "Felnőtt és 12 év felett. Max 5 ml-re hígítva 0,9% NaCl-al.");
    } else {
        html += row("Berodual inhaláció", "0,5 - 1 ml (10-20 csepp)", "12 év alatt. Max 5 ml-re hígítva 0,9% NaCl-al.");
    }

    if (age >= 16) {
        html += row("Krisztalloid (Isolyte)", "250 ml bólus", "Felnőtt bólus. Re-evaluációt követően ismételhető.");
    } else {
        html += row("Krisztalloid (Isolyte)", (weight * 10) + " ml bólus", "Gyermek bólus (10 ml/kg).");
    }

    html += '<div class="section-title" style="margin-top:20px;">2. Fix Dózisok & Felnőtt Specifikus Gyógyszerek</div>';
    
    if (age >= 15) {
        html += row("Algopyrin (Metamizol)", "1 g (2 ml) iv.", "Lassan (1 ml/perc). ACS gyanúja esetén mentőápolónak TILOS!");
    } else {
        html += row("Algopyrin (Metamizol)", "NEM ADHATÓ!", "Mentőápoló csak felnőttnél alkalmazhatja.");
    }

    if (age >= 18) {
        html += row("Kaptopril (Aceomel)", "12,5 mg (1 tbl.)", "Szájban elolvadásig. SBP>220/120 esetén. Mentőápoló adhatja.");
    } else {
        html += row("Kaptopril (Aceomel)", "NEM ADHATÓ!", "Mentőápoló gyermeknél nem alkalmazhatja.");
    }

    if (age >= 12) {
        html += row("Acetilszalicilsav (Aspirin)", "150-300 mg (250 mg)", "ACS esetén azonnal szétrágatni. Láz esetén napi 1-4 tbl.");
    } else {
        html += row("Acetilszalicilsav (Aspirin)", "NEM ADHATÓ!", "12 év alatti életkorban ellenjavallt.");
    }

    html += row("Adrenalin - Újraélesztés", "1 mg iv. bólus", "Nem ismételhető mentőápoló által.");
    html += row("Nitroglicerin spray", "0,4 mg (1 puff)", "Sublingvalisan. 10 percenként max 3x (SBP>90).");
    html += row("Klopidogrél (Trombex)", "300 - 600 mg", "Önállóan mentőápoló nem adhatja! PCI előtt konzultációval 600mg.");
    html += row("Szalbutamol (Ventolin)", "1-2 adag inhalálva", "20 perc után ismételhető.");
    html += row("Rectodelt kúp", "30 mg", "Krupp vagy asztma esetén gyermeknek.");
    html += row("Oxigén", "Cél: 94-98%", "COPD esetén 88-92%. Kritikus esetén 100% (12-15 L/min).");

    const resDiv = document.getElementById('calc-results');
    if (resDiv) resDiv.innerHTML = html;
}

// --- SZIMULÁTOR MOTOR ---
let currentSim = null;
let simStep = 0;
let simHist = [];

function renderSim() {
    if (!currentSim) {
        let html = '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Mentőápolói Szimulációk</h2>';
        html += '<div class="al al-s">Ez a 4 szituáció összesen lefedi az eljárásrendi kártyák mind a 16 gyógyszerét. Szituációnként 10 kérdés teszteli a tudásod.</div>';
        SIMULATIONS.forEach(s => {
            html += `<button class="card-btn" onclick="startSim('${s.id}')">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
                    <div style="font-size:15px;font-weight:700;color:#14b8a6">${wD(s.title)}</div>
                    <span class="tag tag-green">${s.diff}</span>
                </div>
                <div style="font-size:12px;color:#9ca3af;margin-bottom:6px">${wD(s.desc)}</div>
                <div style="font-size:11px;color:#fbbf24;font-weight:600">${s.steps.length} kérdéses teljes vizsga</div>
            </button>`;
        });
        document.getElementById('main-content').innerHTML = html;
        return;
    }

    const sim = SIMULATIONS.find(s => s.id === currentSim);

    if (simStep >= sim.steps.length) {
        const correct = simHist.filter(h => sim.steps[h.step].opts[h.oi].ok).length;
        const pc = Math.round((correct / sim.steps.length) * 100);
        let html = `<h2 style="font-size:20px;font-weight:800;color:#f3f4f6;margin-bottom:1rem">Eredmény: ${wD(sim.title)}</h2>`;
        html += `<div class="res-box"><div style="font-size:42px;font-weight:800">${pc}%</div><div style="font-size:14px;font-weight:600">Helyes döntések: ${correct} / ${sim.steps.length}</div></div>`;
        html += `<h3 style="font-size:16px;font-weight:700;color:#f3f4f6;margin-bottom:10px;border-bottom:1px solid #3f3f3f;padding-bottom:5px">Részletes Összefoglaló & Magyarázat</h3>`;
        
        simHist.forEach((hh, i) => {
            const st = sim.steps[hh.step];
            const opt = st.opts[hh.oi];
            html += `<div class="card" style="margin-bottom:8px; border-color:${opt.ok ? '#065f46' : '#7f1d1d'}">
                <div style="font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:6px">${i+1}. ${wD(st.sit)}</div>
                <div style="font-size:12px;color:${opt.ok ? '#4ade80' : '#fca5a5'};margin-bottom:4px"><b>A Te válaszod:</b> ${wD(opt.tx)}</div>
                <div style="font-size:11px;color:#9ca3af;line-height:1.5"><i>A protokoll szerint:</i> ${wD(opt.fb)}</div>
            </div>`;
        });
        html += `<button class="btn btn-fw btn-g" style="margin-top:10px" onclick="currentSim=null;renderSim()">Vissza a szimulátor menübe</button>`;
        document.getElementById('main-content').innerHTML = html;
        return;
    }

    const stepData = sim.steps[simStep];
    const existingHist = simHist.find(h => h.step === simStep);
    
    let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="font-size:14px;font-weight:700;color:#14b8a6">${wD(sim.title)}</div>
            <span style="font-size:12px;color:#9ca3af;font-weight:600">${simStep + 1} / ${sim.steps.length}</span>
        </div>
        <div style="height:6px;background:#333;border-radius:3px;margin-bottom:1rem">
            <div style="height:100%;background:#14b8a6;border-radius:3px;transition:width 0.3s" style="width:${((simStep + 1) / sim.steps.length * 100)}%"></div>
        </div>
        <div class="card" style="margin-bottom:1rem">
            <div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">${wD(stepData.sit)}</div>
        </div>
    `;

    stepData.opts.forEach((opt, i) => {
        let cls = 'opt';
        if (existingHist) {
            if (opt.ok) cls += ' opt-ok';
            else if (i === existingHist.oi && !opt.ok) cls += ' opt-no';
        }
        html += `<button class="${cls}" ${!existingHist ? `onclick="chooseSimOption(${i})"` : ''}>${wD(opt.tx)}</button>`;
    });

    if (existingHist) {
        const chosenOpt = stepData.opts[existingHist.oi];
        html += `<div class="al ${chosenOpt.ok ? 'al-s' : 'al-d'}" style="margin-top:10px"><b>Visszajelzés:</b><br>${wD(chosenOpt.fb)}</div>`;
        html += `<button class="btn btn-fw btn-g" style="margin-top:10px" onclick="simStep++;renderSim()">${simStep < sim.steps.length - 1 ? 'Következő Kérdés →' : 'Eredmények Megtekintése'}</button>`;
    }

    document.getElementById('main-content').innerHTML = html;
}

function startSim(id) {
    currentSim = id;
    simStep = 0;
    simHist = [];
    renderSim();
}

function chooseSimOption(idx) {
    simHist.push({ step: simStep, oi: idx });
    renderSim();
}

// --- NAVIGÁCIÓ ---
function show(screen) {
    document.querySelectorAll('.nb').forEach((btn, i) => {
        btn.classList.toggle('act', (i === 0 && screen === 'list') || (i === 1 && screen === 'calc') || (i === 2 && screen === 'sim'));
    });
    if (screen === 'list') renderList();
    else if (screen === 'calc') renderCalc();
    else if (screen === 'sim') renderSim();
    window.scrollTo(0, 0);
}

window.onload = function() {
    window.currentWeight = 75;
    window.currentAge = 30;
    show('list'); 
};
</script>
</body>
</html>
