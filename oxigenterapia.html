{sit:'A kórházba szállítás alatt mi a kötelező dokumentációs teendőd az eljárásrend alapján?',opts:[{tx:'Kezdeti SpO2, az O2 adás utáni SpO2 és változásai, az alkalmazott eszköz és áramlási sebesség dokumentálása.',ok:true,fb:'Helyes! Ezek a paraméterek kötelezően rögzítendők az adatlapban/tableten.'},{tx:'Csak a mentés befejezésekor elég egy átlagértéket rögzíteni.',ok:false,fb:'Hibás! Folyamatos kontroll és dokumentálás szükséges.'},{tx:'Mivel az SpO2 CO mérgezésnél fals, semmit nem kell felírni.',ok:false,fb:'Hibás! A fals mérés tényét és az alkalmazott oxigénterápiát (eszköz, liter/perc) igenis rögzíteni kell.'}]}
],summary:'CO mérgezés összefoglaló: A helyszín biztosítása után az eszméletlen beteget AZONNAL 100%-os oxigénnel kell ellátni (NVLM maszk, 15 l/perc). Az oximéter fals (100%) eredményt mutatott a CO miatt, de az oxigénterápiát folytatni kellett. Az NVLM szelepeit fent kell hagyni, a rezervoárt telt állapotban kell tartani. CO mérgezésnél stabilizálódás után is TILOS visszatitrálni, a 100% oxigén a teljes szállítás alatt fennmarad. Palackszámítás (V*P/áramlás) alapján felmértük a kapacitást. Buborékos párásítást a protokoll alapján elhagytuk infekcióveszély miatt. Végül minden lépést (eszköz, áramlás, kezdeti/fals SpO2) precízen dokumentáltunk.'},

{id:2,title:'2. Szituáció: Akut szívelégtelenség, Súlyos COPD exacerbatio',diff:'B+ kompetencia',desc:'Egy 65 éves, COPD-s férfihöz hívnak, aki súlyosan fullad. Az anamnézis alapján krónikusan hypoxiás (SpO2 normálisan ~89%). B+ mentőápoló egység.',steps:[
{sit:'A beteg meredten ül a fotelben, légzési segédizmait használja, nehezen formál szavakat. Cyanoticus. SpO2 O2 nélkül 75%. Mivel kezded az oxigénterápiát?',opts:[{tx:'Azonnal 100% oxigént adok magas áramlású (15 l/p) NVLM maszkon, mert a beteg vitálisan kritikus/instabil.',ok:true,fb:'Helyes! Minden instabil beteg, függetlenül az alapbetegségétől (még a COPD is!), KÖTELEZŐEN 100% O2-vel indul az első állapotfelmérés alatt.'},{tx:'Mivel COPD-s, szigorúan csak 1-2 liter/perc oxigént kaphat orrszondán.',ok:false,fb:'Hibás! Kritikus, hypoxiás állapotban a 100% O2 életmentő.'},{tx:'Körlevegőn megfigyelem.',ok:false,fb:'Hibás! Cyanoticus, súlyosan hypoxiás, ellátást igényel.'}]},
{sit:'A beteg kapja a 15 l/p oxigént maszkon. Közben CPAP terápiára (pozitív nyomású lélegeztetés) készülsz. Mit kell tudnod a COPD exacerbatióról oxigén szempontjából?',opts:[{tx:'Ilyen betegeknél a cél a tartós hyperoxia elérése.',ok:false,fb:'Hibás! A hyperoxia COPD-ben nagyon veszélyes.'},{tx:'A kezdeti 100% O2 fenntartása a cél a beteg stabilizálódásáig, de amint lehet, CÉLZOTT oxigénterápiára és minél korábbi CPAP/NIV bevezetésére kell törekedni.',ok:true,fb:'Helyes! CPAP mellett is a célzott oxigénre titrálás a cél.'},{tx:'15 l/p maszkos terápia tilos COPD-ben.',ok:false,fb:'Hibás! Kezdeti reszuszcitációként nem tilos, sőt kötelező.'}]},
{sit:'B+ kompetenciával CPAP-ot raksz a betegre, a gyógyszerek (hörgőtágító, stb.) hatnak. A beteg állapota stabilizálódik (ABCD stabil). Mi a cél SpO2 értéke a COPD-s betegnek?',opts:[{tx:'95-100%',ok:false,fb:'Hibás! Ez hyperoxiát és CO2 narcosist okozhat náluk.'},{tx:'88-92% (vagy a szokásos jólléti szaturációja)',ok:true,fb:'Helyes! A krónikusan hypoxiás betegek cél szaturációja ez a sáv.'},{tx:'90-92%',ok:false,fb:'Hibás! Ez az ACS és stroke protokollja.'}]},
{sit:'A beteg stabilizálódott, levetted a CPAP-ot. Az SpO2 NVLM 15 l/p mellett jelenleg 98%. Hogyan váltasz célzott oxigénterápiára?',opts:[{tx:'Csökkentem az NVLM áramlását 3 l/perc-re.',ok:false,fb:'Hibás! NVLM maszkon 6 l/p alatt TILOS adni a CO2 retenció miatt.'},{tx:'Oxigén orrszondára váltok, kezdetben alacsony (pl. 2 l/perc) áramlással, majd úgy állítom be, hogy az SpO2 88-92% közé essen.',ok:true,fb:'Helyes! Alacsony oxigénigénynél az orrszonda a megfelelő eszköz.'},{tx:'Eltávolítom az oxigént teljesen.',ok:false,fb:'Hibás! A beteg még hypoxiás lehet, titrálni kell, nem rögtön elvenni.'}]},
{sit:'Az orrszondát 2 l/percre állítottad. A pulzoximéter jelgörbéje azonban teljesen lapos, a készülék 82%-ot mutat. Mit teszel az eljárásrend alapján?',opts:[{tx:'A pulzusgörbe szabálytalan/lapos, így az érték NEM VALÓS. Ellenőrzöm a felhelyezést (pl. melegítés, másik ujj, vérnyomásmérő ne legyen ugyanott).',ok:true,fb:'Helyes! A pulzoximéter 3 alapfeltételének (jó CRT, meleg bőr, szép görbe) teljesülnie kell a célzott terápiához.'},{tx:'Azonnal megemelem az oxigént 15 l/percre.',ok:false,fb:'Hibás! Előbb meg kell bizonyosodni róla, hogy a mérés valid-e.'},{tx:'Fütyülök az oximéterre, hagyom a szondát 2 literen.',ok:false,fb:'Hibás! A kontroll kötelező.'}]},
{sit:'Sikeresen felhelyezted egy másik ujjra az oximétert, szép a görbe. Az SpO2 86%. Mi a teendő a beállított 2 l/p orrszondával?',opts:[{tx:'Hagyom így, 86% még elmegy.',ok:false,fb:'Hibás! A céltartomány 88-92%.'},{tx:'Fokozatosan növelem az oxigénáramlást (pl. 3-4 l/p-re), amíg az SpO2 el nem éri a 88-92% közötti tartományt.',ok:true,fb:'Helyes! Az orrszondán 1 l/p emelés kb. 3-4%-kal növeli a FiO2-t.'},{tx:'NVLM maszkot adok 15 l/p-vel.',ok:false,fb:'Hibás! Ez túlzott hyperoxiát okozna.'}]},
{sit:'A szaturáció beáll 90%-ra orrszondával (3 l/p). Melyik beavatkozásra van még szükség B+ kompetencia esetén COPD-s dyspnoe kapcsán az eljárásrendi felsorolás (eszközök) szerint?',opts:[{tx:'Nebulizátoros maszk használatára (hörgőtágító adása), az oxigénáramlást a látható páraképződéshez állítva, rövid ideig (5-10 perc).',ok:true,fb:'Helyes! B+ szinten gyógyszerporlasztás is szóba jön oxigénnel hajtva.'},{tx:'Apnoés oxigenizációra.',ok:false,fb:'Hibás! A betegnek van spontán légzése, az intubáláshoz kellene az apnoés O2.'},{tx:'Kettős oxigenizációra.',ok:false,fb:'Hibás! Akkor kell, ha max NVLM sem elég, de itt orrszonda is elég volt.'}]},
{sit:'A szállítás során a célzott oxigénterápia (3 l/p orrszonda) alatt a beteg szaturációja hirtelen 90%-ról 86%-ra (tehát több mint 3%-ot) esik. Mi az eljárásrend kötelező utasítása?',opts:[{tx:'Csak várok, hátha felmegy magától.',ok:false,fb:'Hibás! Azonnali cselekvés kell.'},{tx:'A beteg állapotának újraértékelése (beleértve a pulzoximéter jelének vizsgálatát), és az oxigénterápia újbóli mérlegelése (pl. emelése, 100% visszatérése) szükséges!',ok:true,fb:'Helyes! "Amennyiben a visszatitrálást követően a szaturáció bármikor >=3%-ot esik... újraértékelés szükséges."'},{tx:'Azonnal intubálni kell.',ok:false,fb:'Hibás! Az értékelés az első.'}]},
{sit:'A beteg állapota ismét romlik (újból instabil, nehézlégzése fokozódik). Van-e akadálya visszatérni a 100%-os belégzési koncentrációra?',opts:[{tx:'Igen, mivel már elkezdtük a célzott terápiát.',ok:false,fb:'Hibás! Az állapotromlás felülírja a stabil célokat.'},{tx:'Nincs! Ha a célzott oxigénterápia feltételei megszűnnek, vagy a beteg ismét instabil lesz, újra 100%-os oxigént kell alkalmazni!',ok:true,fb:'Helyes! Az instabilitás azonnal visszadob a 100%-os kezdeti szakaszba.'},{tx:'COPD esetén tilos.',ok:false,fb:'Hibás! Kritikus állapotban COPD-nél is 100% kell.'}]},
{sit:'A nehézlégző beteg hordágyon történő szállítása során milyen "Gyakorlati megfontolást" emel ki az eljárásrend?',opts:[{tx:'Lábak felpolcolása (Sokkfektetés).',ok:false,fb:'Hibás! Fulladó betegen ront a helyzeten.'},{tx:'A megfelelő pozíció: ülő/félülő helyzet.',ok:true,fb:'Helyes! Nehézlégzés esetén mindig gondolni kell az ülő/félülő pozícióra.'},{tx:'Szigorúan lapos, hanyattfekvő helyzet.',ok:false,fb:'Hibás! Nehézlégzésnél ez tilos (orthopnoe).'}]}
],summary:'COPD Exacerbatio összefoglaló: Kiérkezéskor a beteg kritikus (instabil) volt, ezért az alapbetegség ellenére AZONNAL 100% O2-t kapott NVLM maszkon (15 l/p). Emellett korán bevetettük a CPAP terápiát B+ szinten. Amint a beteg ABCD stabilizálódott, megkezdtük a célzott terápiára való visszatitrást, melynek célértéke krónikus hypoxiás betegeknél 88-92%. Ellenőriztük a pulzoximéter jelét, majd orrszondával 3 l/p áramlással 90%-on stabilizáltuk az SpO2-t. Gyógyszerporlasztást (nebulizátort) is alkalmaztunk rövid ideig O2 meghajtással. Amikor az SpO2 >3%-ot esett, az eljárásrend alapján azonnali újraértékelés történt. Az állapot ismételt romlásakor habozás nélkül visszatértünk a 100% O2 alkalmazására. A beteget mindvégig ülő/félülő testhelyzetben szállítottuk.'},

{id:3,title:'3. Szituáció: Akut Coronaria Szindróma (ACS) - Mellkasi fájdalom',diff:'B kompetencia',desc:'Egy 55 éves férfi szorító, bal karba sugárzó mellkasi fájdalomra panaszkodik. ABCD paraméterei stabilak, eszméletén van. B szintű egység.',steps:[
{sit:'A helyszín biztos. A beteg járóképes (kimentett), kommunikál, nincs légzési nehezítettsége. A mentőben stabil állapotú. Mi a legelső teendő az oxigén adása ELŐTT?',opts:[{tx:'Azonnal felteszek egy NVLM maszkot 15 l/p áramlással a szívinfarktus miatt.',ok:false,fb:'Hibás! Csak instabil beteg kap automatikusan 100% oxigént.'},{tx:'Mivel ABCD-stabil, felhelyezem a pulzoximétert egy meleg, tiszta bőrfelületre és megmérem a spontán szaturációt az oxigénigény elbírálásához.',ok:true,fb:'Helyes! Stabil ACS-es betegnél a szaturáció dönti el a teendőt.'},{tx:'Adok neki 6 l/p orrszondát megelőzésképpen.',ok:false,fb:'Hibás! Felesleges oxigén adása káros lehet.'}]},
{sit:'A pulzoximéter (szép görbével) 95% SpO2-t mutat szobalevegőn. Mit teszel?',opts:[{tx:'Adok oxigént, mert a szívnek kell.',ok:false,fb:'Hibás! ACS esetén az extra oxigén rontja a szívizom vérellátását (vasoconstrictio).'},{tx:'Akut coronaria szindróma esetén ez a kórkép szoros monitorozást igényel, de rutinszerűen oxigénterápia NEM alkalmazandó! Nem adok oxigént.',ok:true,fb:'Helyes! SpO2 > 93% esetén ACS-ben oxigén adása nem indokolt.'},{tx:'Csak egy kis orrszondát (1 l/p) adok.',ok:false,fb:'Hibás! Szintén nem javasolt.'}]},
{sit:'Mi a CÉL SpO2 ACS (és akut stroke) esetén, ha esetleg hypoxiássá válna a beteg?',opts:[{tx:'92-96%',ok:false,fb:'Hibás! Ez az általános stabil betegek célja.'},{tx:'90-92%',ok:true,fb:'Helyes! Ez a specifikus célérték ACS-ben és stroke-ban.'},{tx:'88-92%',ok:false,fb:'Hibás! Ez a krónikus légzőszervi betegeké.'}]},
{sit:'10 perc múlva a beteg SpO2 értéke szobalevegőn 88%-ra csökken. Mit ír elő az eljárásrend?',opts:[{tx:'Hypoxia (SpO2 < 90%) esetén elkezdem az oxigénterápiát, és az áramlást úgy állítom be, hogy az SpO2 90-92% közé essen.',ok:true,fb:'Helyes! A 88% már hypoxia, tehát be kell avatkozni, de szigorúan titrálva.'},{tx:'Azonnal 15 l/p NVLM maszkot adok.',ok:false,fb:'Hibás! Bár hypoxiás, nem vált instabillá, célzott terápia kell (orrszonda).'},{tx:'Várok, hátha feljebb megy magától.',ok:false,fb:'Hibás! A hypoxia szívkárosító.'}]},
{sit:'Milyen eszközt használsz a célzott oxigénterápiához ebben az esetben?',opts:[{tx:'Oxigén orrszondát, kezdetben 1-2 liter/perc áramlással, amit szükség esetén finoman emelek.',ok:true,fb:'Helyes! Ez az eszköz a legalkalmasabb az alacsony áramlású, célzott FiO2 elérésére.'},{tx:'NVLM maszkot szelepekkel.',ok:false,fb:'Hibás! Ez közel 100%-ot ad, túl sok lesz.'},{tx:'CPAP maszkot.',ok:false,fb:'Hibás! Nincs légzési elégtelenség.'}]},
{sit:'Az orrszondát 2 l/percre állítod. A szaturáció percek múlva 94%-ra emelkedik. Mit teszel?',opts:[{tx:'Örülök neki, és hagyom a beállítást.',ok:false,fb:'Hibás! 93% felett az ACS betegnél abba kell hagyni/csökkenteni kell az oxigént.'},{tx:'Mivel az SpO2 eléri a 93%-ot vagy afeletti értéket, az oxigénáramlás csökkentése (vagy megvonása) szükséges, mert további oxigénterápia nem indokolt.',ok:true,fb:'Helyes! ACS-ben kerülendő a hyperoxia (94% itt már annak számít protokollárisan az extra oxigén mellett).'},{tx:'Még jobban felemelem.',ok:false,fb:'Hibás! Az komoly károkat okozna.'}]},
{sit:'A beteg továbbra is a mellkasát fogja. A vérnyomása és pulzusa stabil. A pulzoximéter mérését megzavarhatja a beteg bal karján történő rendszeres vérnyomásmérés?',opts:[{tx:'Nem, a kettő nincs hatással egymásra.',ok:false,fb:'Hibás! A mandzsetta felfújása megzavarja a perifériás keringést.'},{tx:'Igen! Az azonos végtagra felhelyezett vérnyomásmérő mandzsetta felfújása befolyásolhatja/meghiúsíthatja az oxigénszaturáció meghatározását. Az ujjcsipeszt a másik (jobb) kézre kell tenni.',ok:true,fb:'Helyes! Ezt a "Gyakorlati megfontolások" rész külön kiemeli.'},{tx:'Csak akkor, ha 150 Hgmm felé fúj.',ok:false,fb:'Hibás! Bármilyen mérés megszünteti a perfúziót.'}]},
{sit:'Miközben a kórházba tartotok, a beteg hirtelen elveszti az eszméletét és hörgő légzése lesz (Keringésmegállás gyanúja / ROSC előtti állapot). Milyen oxigénterápia lesz most a helyes (miközben elkezded az újraélesztést)?',opts:[{tx:'Mivel ACS beteg, szigorúan tartom a 90-92%-ot a lélegeztetésnél is.',ok:false,fb:'Hibás! Újraélesztés alatt az összes titrálási szabályt felülírja a 100% O2 szabály.'},{tx:'Újraélesztés (ROSC-ig) esetén azonnali magas áramlású, 100%-os belégzési oxigén koncentráció alkalmazása KÖTELEZŐ (pl. ballonos-maszkos lélegeztetés rezervoárral, 15 l/perc).',ok:true,fb:'Helyes! Kritikus/újraélesztett betegnél a protokoll a 100% oxigén alkalmazását írja elő.'},{tx:'Körlevegővel lélegeztetek ballonos maszkkal.',ok:false,fb:'Hibás! Csak újszülötteknél indítunk körlevegővel.'}]},
{sit:'Sikeres újraélesztés után (ROSC) a beteg stabilizálódik (pROSC). Mi a teendő oxigén terén az eljárásrend alapján?',opts:[{tx:'Most már életmentett, levesszük az oxigént.',ok:false,fb:'Hibás! pROSC kritikus állapot.'},{tx:'A ROSC után, ha a beteg ABCD-stabil lesz, az alapkórfolyamat (ACS) figyelembevételével ismét célzott oxigénterápiára kell törekednünk.',ok:true,fb:'Helyes! A pROSC kezdetben 100%-ot kap, de stabilizálódás után vissza kell titrálni az eredeti célhoz (90-92% ACS-nél, vagy intubáltnál 92-96%).'},{tx:'Szigorúan marad a 100% O2 a kórházig.',ok:false,fb:'Hibás! A hyperoxia ROSC után idegrendszeri károsodást fokoz. Titrálni kell.'}]},
{sit:'A szállítás végéig kötelező dokumentálni:',opts:[{tx:'Csak a kapott gyógyszereket.',ok:false,fb:'Hibás! B kompetenciánál nincs is gyógyszer.'},{tx:'A kezdeti, és az oxigén adását követő SpO2-t, a változásokat, az alkalmazott eszközt és áramlást.',ok:true,fb:'Helyes! Kötelező elemek az oxigénterápiában.'},{tx:'A beteg pulzusát a kórház ajtajában.',ok:false,fb:'Hibás! Nem elég önmagában.'}]}
],summary:'Akut Coronaria Szindróma (ACS) összefoglaló: A helyszínen az ABCD-stabil ACS-es betegnél (SpO2 95%) rutinszerű oxigén adása az eljárásrend szerint NEM ALKALMAZANDÓ. Csak hypoxia (SpO2 < 90%) esetén kezdtünk oxigénterápiát (SpO2 88% -> orrszonda 2 l/perc), azzal a szigorú céllal, hogy a szaturáció 90-92% közé essen. Amint az érték 93% fölé ért, az oxigént megvontuk/csökkentettük. Az oximétert a vérnyomásmérővel ellentétes karra helyeztük fel a fals jel elkerülése végett. Amikor a beteg hirtelen eszméletlenné vált és keringésmegállás gyanúja lépett fel, a célzott terápiát megszakítva azonnal 100%-os FiO2-vel végeztük a ballonos-maszkos lélegeztetést az újraélesztés alatt. pROSC beállta és stabilizálódás után a protokollnak megfelelően újra a célzott visszatitrálásra (alapbetegség: ACS) törekedtünk, mindvégig alaposan dokumentálva az értékeket és a beállított áramlásokat.'},

{id:4,title:'4. Szituáció: Hypoxiás légzési elégtelenség kettős oxigenizációval',diff:'B+ kompetencia',desc:'Egy 40 éves súlyos tüdőgyulladásos (pneumonia), szepszis-gyanús nőhöz érkezel, aki kritikus állapotban van. B+ kompetencia szint.',steps:[
{sit:'A beteg tudata megtartott, de rendkívül gyorsan lélegzik, cyanoticus. Mi az első teendő oxigén szempontjából?',opts:[{tx:'100%-os belégzési oxigén koncentráció alkalmazása NVLM maszkon, magas áramlással (15 l/perc).',ok:true,fb:'Helyes! Tüdőgyulladás / sepsis miatti instabil légzési elégtelen betegnél ez az előírás.'},{tx:'Orrszondát kap 3 l/perc áramlással.',ok:false,fb:'Hibás! Kritikusan hypoxiás betegnek 100% O2 kell.'},{tx:'Megvárom a vércukor eredményt.',ok:false,fb:'Hibás! A vércukor fontos, de a hypoxia kezelését azonnal el kell kezdeni.'}]},
{sit:'Felhelyezted az NVLM-et 15 l/p áramlással. A rezervoár zsák azonban minden belégzésnél majdnem teljesen összeesik (erősen húzza a beteg, mert a légzési perctérfogata óriási). Mit okoz ez?',opts:[{tx:'Jobban oxigenizálódik a beteg.',ok:false,fb:'Hibás! Épp ellenkezőleg.'},{tx:'Így nem éri el a 100% koncentrációt, mivel belégzéskor felhígul a levegő, a zsák ürülése miatt (nem tud elég oxigént biztosítani a nagy perctérfogatnak).',ok:true,fb:'Helyes! A 100%-hoz a zsáknak TÉNYLEG teltnek kell maradnia.'},{tx:'A szilikon szelepek ilyenkor jobban működnek.',ok:false,fb:'Hibás! A zsák hiánya miatt szobalevegőt szív be a szélén.'}]},
{sit:'A maszk (15 l/p) mellett az SpO2 még mindig csak 84%. Mit kell alkalmazni az eljárásrend szerint?',opts:[{tx:'Kettős oxigenizációt: az NVLM maszk alá orrszondát kell helyezni, további oxigénáramlással.',ok:true,fb:'Helyes! "Ha a szaturáció az NVLM (15 l/p) használatát követően sem emelkedik 90% fölé... alkalmazzunk egyidejűleg oxigén orrszondát."'},{tx:'Újra kell éleszteni.',ok:false,fb:'Hibás! A betegnek van megtartott keringése.'},{tx:'Meg kell emelni a palack áramlását 50 l/percre.',ok:false,fb:'Hibás! A reduktorok 15-25 l/p-nél általában megállnak.'}]},
{sit:'Hogyan kivitelezed a kettős oxigenizációt?',opts:[{tx:'Az orrszondát rákötöm az NVLM csövére egy Y-elosztóval.',ok:false,fb:'Hibás! Ez nem növeli az áramlást.'},{tx:'Két oxigénpalackot használok. Az NVLM marad 15 l/p az egyiken, az orrszondát a másik palackra kötöm és 6 l/perc kezdő áramlással indítom.',ok:true,fb:'Helyes! A protokoll 6 l/p kezdő áramlást ír elő a szondán, mely 15 l/p-ig növelhető.'},{tx:'A maszkot leveszem, és csak az orrszondát adom 15 l/p-vel.',ok:false,fb:'Hibás! Ez nem kettős oxigenizáció.'}]},
{sit:'Mire hívja fel az eljárásrend kifejezetten a figyelmet a kettős oxigenizáció kapcsán?',opts:[{tx:'Csak orvosi utasításra végezhető.',ok:false,fb:'Hibás! Az eljárásrend biztosítja a kompetenciát.'},{tx:'Mindig legyünk figyelemmel a rendelkezésre álló oxigén mennyiségére, mivel a helyszínen limitált, és a forrás kimerülésekor súlyos hypoxia léphet fel.',ok:true,fb:'Helyes! Két palack párhuzamos, magas áramlású működtetése nagyon gyorsan leszívja a gázt.'},{tx:'TILOS a maszk alá tenni a szondát.',ok:false,fb:'Hibás! Épp az a technika lényege.'}]},
{sit:'B+ kompetenciájú mentőegység vezetőjeként az oxigénterápia mellett melyik beavatkozásra kell még minél hamarabb gondolnod e betegcsoport (pneumonia, hypoxiás légzési elégtelenség) esetén?',opts:[{tx:'Defibrillálásra.',ok:false,fb:'Hibás! Nincs ritmuszavar.'},{tx:'CPAP / NIV terápiára (pozitív nyomású lélegeztetés).',ok:true,fb:'Helyes! Az eljárásrend egyértelműsíti: légzési elégtelenségben szenvedőknél törekedni kell a minél korábbi CPAP/NIV terápiára.'},{tx:'Trauma protokoll szerinti cABCDE vizsgálatra.',ok:false,fb:'Hibás! Ez belgyógyászati kórkép.'}]},
{sit:'Átváltotok CPAP terápiára. Működik-e a kettős oxigenizáció a CPAP maszkkal együtt is?',opts:[{tx:'Igen! A kettős oxigenizáció kivitelezhető CPAP/NIV-maszk és oxigén orrszonda egyidejű alkalmazásával is.',ok:true,fb:'Helyes! Ezt a módszerek között (3. pont) kifejezetten említi a leírás.'},{tx:'Nem, a maszk tömítését teljesen tönkreteszi.',ok:false,fb:'Hibás! A modern lágy szondák átvezethetők a maszk pereme alatt megfelelő illeszkedéssel.'},{tx:'Nem, mert a CPAP gép elromlik tőle.',ok:false,fb:'Hibás! A CPAP (pl. O-Two gép) bírja.'}]},
{sit:'Milyen szűrőt/eszközt indokolt alkalmazni a CPAP gép/maszk közé, ami az oxigénterápia passzív párásítását is megoldja?',opts:[{tx:'HME-filtert (Heat and Moisture Exchanger), ami passzív párásítóként funkcionál.',ok:true,fb:'Helyes! A HME-filter alkalmazása CPAP, BVM esetén indokolt és javasolt.'},{tx:'Vizes buborékoltatót.',ok:false,fb:'Hibás! Prehospitálisan kifejezetten nem javasolt.'},{tx:'Sima gézlapot.',ok:false,fb:'Hibás! Az nem szűr.'}]},
{sit:'A CPAP terápia + O2 hatására a beteg oxigenizációja nagyon jól javul. Mikor térhetsz át a célzott oxigénterápiára CPAP közben?',opts:[{tx:'Csak ha a gép automatikusan leáll.',ok:false,fb:'Hibás! A gép nem áll le magától.'},{tx:'Minél hamarabb törekedni kell rá, amint a beteg állapota stabilizálódik (SpO2 eléri a 92-96% céltartományt). Legkönnyebben a lélegeztetőgép oxigénkeverőjének (FiO2) állításával érhető el.',ok:true,fb:'Helyes! A CPAP/NIV során is vissza kell titrálni a célszaturációra.'},{tx:'CPAP alatt sosem szabad csökkenteni a 100%-ot.',ok:false,fb:'Hibás! Mindig törekedni kell a hyperoxia kerülésére.'}]},
{sit:'A beteg CPAP maszkját és az oxigén szondát a szállítás végéig hordja. Kihez fordulsz orvosi kontrollért a szállítás alatt?',opts:[{tx:'Senkihez, B+ kompetenciával önállóan elviszem a beteget.',ok:false,fb:'Hibás! A szepszis + légzési elégtelenség magas (NEWS2 ≥7) rizikójú.'},{tx:'Ha B+ kompetenciám nem elég a beteg (pl. szepszis, magas NEWS2) invazív biztosításához, segélykocsit (ALS) kérek, vagy egyeztetek az ICS-sel az azonnali kórházi transzportról.',ok:true,fb:'Helyes! A magas rizikójú beteg ALS beavatkozást vagy gyors transzportot igényel.'},{tx:'A beteg háziorvosához.',ok:false,fb:'Hibás! Ide sürgősségi orvosi kapacitás (ALS/SBO) kell.'}]}
],summary:'Kettős Oxigenizáció (Hypoxia) összefoglaló: A súlyos tüdőgyulladásos, magas légzési perctérfogatú betegnél a 15 l/p NVLM maszk rezervoárzsákja kiürült a belégzésekkor, és az SpO2 nem emelkedett 90% fölé. Ennek megoldására "Kettős oxigenizációt" alkalmaztunk B+ kompetenciaszinten: két külön palackról az NVLM maszk (15 l/p) alá egy oxigén orrszondát is felhelyeztünk (kezdetben 6 l/p, amivel a FiO2-t maximálisra növeltük). Folyamatosan ellenőriztük a palackok nyomását a gyors kimerülés veszélye miatt. A protokollnak megfelelően minél hamarabb áttértünk CPAP/NIV terápiára, a csőbe épített HME-filterrel (párásítás+szűrés céljából), és az orrszondát a CPAP maszk alatt is megtartottuk az oxigenizáció javulásáig. Stabilizálódás után a CPAP gépen a FiO2 állításával célzott terápiára (92-96%) titráltunk vissza. A magas kritikus státusz miatt (sepsis gyanú, NEWS2 ≥7) egyidejűleg magasabb szintű segélykocsi (ALS) kérése és folyamatos, percről percre történő dokumentálás történt.'},

{id:5,title:'5. Szituáció: Súlyos állapotú asztmás gyermek',diff:'B kompetencia',desc:'Egy 4 éves kislányhoz riasztanak, akinek az édesanyja szerint "nagyon zihál, asztmás rohama van, kék a szája". B mentőegység.',steps:[
{sit:'Kiérkezéskor a kislány az édesanyja ölében ül, sír, bordaközi behúzódásai vannak, orrszárnyi légzéssel (kóros légzés). Keringése cyanoticus. Mi a gyermekek oxigénterápiájának alapelve ebben az instabil, kritikus állapotban?',opts:[{tx:'Csak 1-2 liter/perc adása orrszondával.',ok:false,fb:'Hibás! A cyanoticus gyermek instabil, maximális O2-t igényel.'},{tx:'Azonnal 100%-os belégzési oxigén koncentráció alkalmazása.',ok:true,fb:'Helyes! Gyermekeknél bármely kritikus állapot kezdeti 100% oxigént igényel az első állapotfelmérés alatt.'},{tx:'Meg kell várni a pulzoximéter eredményét.',ok:false,fb:'Hibás! Az oxigént azonnal el kell indítani az első benyomás (cyanosis, légzési distressz) alapján.'}]},
{sit:'Megpróbálod feltenni a gyermek arcára a gyermekméretű NVLM maszkot, de a kislány megijed tőle, ellenáll, sírása fokozódik, az állapota (légzése) szemmel láthatóan tovább romlik. Mit teszel a "minimal handling" elve szerint?',opts:[{tx:'Erővel ráfogom a maszkot az arcára.',ok:false,fb:'Hibás! Ez tovább rontja az oxigenizációt és kimerüléshez vezet.'},{tx:'Maszk a szülő kezébe, és a gyermek arca elé tartva adagolom az oxigént, vagy szabadon áramló O2-t (oxigéncsővel) fújok az arca elé, hogy megnyugodjon.',ok:true,fb:'Helyes! A gyermek nyugalma gyakran önmagában is javítja az oxigenizációt. Ezt az eljárásrend külön nevesíti.'},{tx:'Inkább nem adok semmilyen oxigént.',ok:false,fb:'Hibás! Az oxigén elengedhetetlen, csak az eszköz módja változik.'}]},
{sit:'Ha szabadon áramló (blow-by) oxigént fúj a szülő a gyermek arca elé, mennyi lesz a belélegzett FiO2 (oxigénkoncentráció)?',opts:[{tx:'100% biztosított lesz.',ok:false,fb:'Hibás! Szabad áramlással a szoba levegője erősen hígítja a gázt.'},{tx:'Az elérhető oxigénkoncentráció ekkor 40% alatt van (az eljárásrend leírása szerint).',ok:true,fb:'Helyes! Ezzel a kompromisszummal tisztában kell lennünk a minimal handling alkalmazásakor.'},{tx:'Garantáltan 90% felett.',ok:false,fb:'Hibás! Ezt csak a megfelelően rögzített NVLM képes elérni.'}]},
{sit:'A pulzoximéter (SpO2) a kislány ujján folyamatosan csipog, de a pulzusgörbe ugrál, mert a gyermek mozgatja a kezét, sír. Hiteles az érték (ami 75-88% között ugrál)?',opts:[{tx:'Igen, biztosan 75% az értéke.',ok:false,fb:'Hibás! Rossz görbe mellett az érték nem hiteles.'},{tx:'Nem! A gyermek mozgása meghiúsítja az oxigénszaturáció meghatározását (zavarja a jelet). Ilyenkor a klinikai képre (cyanosis) hagyatkozunk.',ok:true,fb:'Helyes! A mozgási műtermék a pulzoximetria leggyakoribb hibaforrása gyermekeknél.'},{tx:'A gép mindig a legalacsonyabb értéket mutatja helyesen.',ok:false,fb:'Hibás! Az ingadozó, rossz jelű értékeket nem szabad készpénznek venni.'}]},
{sit:'B kompetenciaszintű ellátóként rájössz, hogy a gyermek kritikus asztmás állapota gyógyszeres beavatkozást (hörgőtágítót, szteroidot) igényel, de a kompetenciád ezt nem engedi. Mit teszel haladéktalanul?',opts:[{tx:'Kérek egy ALS gyermekmentő (vagy MOK/Mentőtiszt) segélykocsit.',ok:true,fb:'Helyes! A kompetencián túli kritikus betegek azonnali emelt szintű segítséget (ALS) igényelnek.'},{tx:'Elkezdek rohanni a legközelebbi gyermekorvosi ügyeletre.',ok:false,fb:'Hibás! Kritikus beteget magasabb szintű egységnek kell stabilizálnia, ügyelet nem elegendő.'},{tx:'Beszélek a szülővel, hogy vigye be ő autóval.',ok:false,fb:'Hibás! A beteg már a mentésirányítás felelősségi körében van, és instabil.'}]},
{sit:'Amíg a segélykocsi érkezik, hogyan állítod be az oxigén áramlását az arca elé tartott csőből?',opts:[{tx:'1-2 liter/perc (orrszondás áramlás).',ok:false,fb:'Hibás! Mivel nem zárt az eszköz, ez elveszne a levegőben.'},{tx:'Magas áramlással (12-15 l/perc) kell adagolni, hogy a száj/orr körüli térben minél magasabb legyen a koncentráció.',ok:true,fb:'Helyes! Szabadon áramló O2-nél és maszk elé tartásnál is az áramlást magasra kell venni a hígulás ellensúlyozására.'},{tx:'Minimum 25 liter/perc.',ok:false,fb:'Hibás! Ezt a legtöbb reduktor nem tudja, a 15 l/p elegendő standard.'}]},
{sit:'A kislány lassan megnyugszik az anyuka ölében, hagyja feltenni az oxigén orrszondát. Az SpO2 96% és stabil, gyönyörű görbével. Mi az akut asztmás (tehát légzési elégtelen) gyermek célzott SpO2 értéke a stabilizálódás után?',opts:[{tx:'88-92% (mint a COPD).',ok:false,fb:'Hibás! Az asztmás (ha nem krónikus hypoxiás stádiumban van) normál célt igényel.'},{tx:'92-96%.',ok:true,fb:'Helyes! Az eljárásrend alapján akut asztma exacerbatiójában (állapotstabilizálás után) a cél a 92-96% sáv.'},{tx:'100%',ok:false,fb:'Hibás! A hyperoxia kerülendő.'}]},
{sit:'Mennyi egy 4 éves gyermek normális légzésszáma? (Segítségként: 2-5 éves korosztály)',opts:[{tx:'25-30 / perc.',ok:true,fb:'Helyes! A gyermekfüggelék alapján ez a normál érték ebben a korban.'},{tx:'15-20 / perc.',ok:false,fb:'Hibás! Ez felnőttek/nagykorúak értéke.'},{tx:'40-50 / perc.',ok:false,fb:'Hibás! Ez már tachypnoe (szapora), vagy csecsemőkori normál.'}]},
{sit:'Mennyi egy 4 éves gyermek normál szisztolés vérnyomása a kiszámítási képlet alapján? (90 + 2*életkor)',opts:[{tx:'98 Hgmm.',ok:true,fb:'Helyes! 90 + (2 * 4) = 98 Hgmm.'},{tx:'78 Hgmm.',ok:false,fb:'Hibás! Ez az alsó tolerabilis határ lenne (70 + 2*4).'},{tx:'120 Hgmm.',ok:false,fb:'Hibás! Felnőtt érték.'}]},
{sit:'Közben megérkezik a gyermekmentő ALS egység. Átadod a beteget. Az eljárásrend mit ír elő: ha a gyermek az "E" (Exposure) vizsgálat során hypotermiás lett volna (kihűlt), az megváltoztatta volna az oxigénterápia menetét?',opts:[{tx:'Igen, akkor nem adhattunk volna oxigént.',ok:false,fb:'Hibás! A hypothermia nem kontraindikálja az oxigént.'},{tx:'Nem, a hypothermia is az a betegségcsoport, ami a kezdeti 100%-os belégzési oxigénkoncentráció fenntartását igényli a stabilizálódásig (IV. 2. pont).',ok:true,fb:'Helyes! Hypothermiában (csakúgy, mint shock, sepsis) kezdeti 100% majd visszatitrálás javasolt.'},{tx:'Csak ha 30 Celsius fok alatt van.',ok:false,fb:'Hibás! Bármilyen súlyos hypothermia indikációja a 100% O2-nek.'}]}
],summary:'Gyermek asztmás roham összefoglaló: A kritikus állapotú asztmás kislánynál B kompetenciaszinten az alapelv a kezdeti 100% oxigén alkalmazása volt. Mivel a gyermek a felnőttekhez hasonló maszkos oxigénadást rosszul tűrte (ellenállás, állapotromlás), a "minimal handling" (gyermekbarát) eljárást követtük. Ennek megfelelően az oxigénadagolást (maszk arc elé tartása, csőből blow-by oxigén) az édesanya kezébe adtuk, elfogadva azt, hogy ilyenkor a FiO2 <40%. Az oximéter mozgási műtermék miatti fals jelét felismertük, a klinikai kép (cyanosis) alapján folytattuk az O2 pótlást. Mivel az állapot gyógyszeres beavatkozást (ALS szint) igényelt, azonnal segélykocsit hívtunk. A gyermek megnyugvása és stabilizálódása után az asztmás protokollnak megfelelően (92-96%) céloztuk be a SpO2-t orrszondával. Az ellátás során figyelembe vettük a gyermek normál élettani értékeit (légzés: 25-30/p, vérnyomás normál: 98 Hgmm).' }
];

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+b.tx+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+i+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  return '';
}

function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Oxigénterápia</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos eljárásrend v2.0/2019.09.19.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Tananyag','Az eljárásrend részletei'],['flash','🃏','Kártyák','14 forgatható kártya'],['quiz','❓','Kvíz','15 kérdés visszajelzéssel'],['sim','🚑','Szimuláció','5 interaktív eset (10 lépéses)'],['calc','🧮','Kalkulátor','O2 palack és idő számító']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af"><b>Vonatkozik:</b> Az Országos Mentőszolgálat valamennyi kivonuló dolgozójára, kompetenciaszintnek megfelelően. <br><br><i>(Kattints a <span class="fw" style="color:#a78bfa" onclick="showDef(\'hypoxia\')">szaggatott</span> szavakra a jelentésükért!)</i></div></div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Tananyag</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+c.title+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){

return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+c.title+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+s.t+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');
}

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Kártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+c+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+c+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+card.b+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+card.cat+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;white-space:pre-line">'+card.f+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+QUIZ[a.qi].q+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+QUIZ[a.qi].opts[a.pi]+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+QUIZ[a.qi].opts[QUIZ[a.qi].ok]+'</div><div style="font-size:11px;color:#9ca3af">'+QUIZ[a.qi].exp+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+q.q+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+opt+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+q.exp+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+s.title+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+s.desc+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' lépéses szituáció</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+sim.title+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Részletes összefoglaló:</strong><br><br>'+sim.summary+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+st.sit+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+opt.tx+'</div><div style="font-size:11px;color:#9ca3af">'+opt.fb+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+sim.title+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+sim.desc+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+step.sit+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+opt.tx+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+step.opts[SI.chosen].fb+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló megtekintése')+'</button>':'');
}

function updateO2Calc(){
    var v = document.getElementById('o2_v').value;
    var p = document.getElementById('o2_p').value;
    var f = document.getElementById('o2_f').value;
    CALC.v=parseFloat(v); CALC.p=parseFloat(p); CALC.f=parseFloat(f);
    var cap = CALC.v * CALC.p;
    var min = Math.floor(cap / (CALC.f || 1));
    document.getElementById('o2_cap').innerText = cap + ' liter';
    document.getElementById('o2_min').innerText = '~' + min + ' perc';
}

function renderCalc(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">O2 Palack Kalkulátor</h2>'+
'<div class="card" style="margin-bottom:.75rem">'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:1rem;line-height:1.4">Az eljárásrend alapján a rendelkezésre álló oxigénmennyiség megközelítőleg: <b>Palack űrtartalom (l) x Palack nyomás (bar)</b>. Ezt osztva az áramlással (l/perc) kapjuk a perceket.</div>'+
'<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">Palack űrtartalma (liter)</div>'+
'<select id="o2_v" onchange="updateO2Calc()">'+[2,5,10,20].map(v=>'<option value="'+v+'" '+(v===CALC.v?'selected':'')+'>'+v+' L</option>').join('')+'</select></div>'+
'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><div style="font-size:11px;font-weight:600;color:#9ca3af">Palack nyomása</div><span id="p_disp" style="font-size:13px;font-weight:700;color:#f3f4f6">'+CALC.p+' bar</span></div>'+
'<input id="o2_p" type="range" min="10" max="200" step="5" value="'+CALC.p+'" oninput="document.getElementById(\'p_disp\').innerText=this.value+\' bar\';updateO2Calc()"><br><br>'+
'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><div style="font-size:11px;font-weight:600;color:#9ca3af">Áramlási sebesség (l/perc)</div><span id="f_disp" style="font-size:13px;font-weight:700;color:#f3f4f6">'+CALC.f+' l/perc</span></div>'+
'<input id="o2_f" type="range" min="1" max="25" step="1" value="'+CALC.f+'" oninput="document.getElementById(\'f_disp\').innerText=this.value+\' l/perc\';updateO2Calc()">'+
'</div>'+
'<div class="res-box" style="background:#172554;border:1px solid #1e3a8a">'+
'<div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Rendelkezésre álló mennyiség:</div><div id="o2_cap" style="font-size:32px;font-weight:700;color:#60a5fa;margin-bottom:1rem">'+(CALC.v*CALC.p)+' liter</div>'+
'<div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Elegendő időtartam:</div><div id="o2_min" style="font-size:24px;font-weight:700;color:#4ade80">~'+Math.floor((CALC.v*CALC.p)/CALC.f)+' perc</div>'+
'</div>';
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
</html>
