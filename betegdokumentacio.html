{id:1,title:'1. Szimuláció: BLS Újraélesztés (B kompetencia)',diff:'B kompetencia',desc:'Mentőápolóként (nem gyógyszerezhet) teljesítesz szolgálatot. A műszakod indul, majd rádión kapod a riasztást (a tabletnek épp nincs hálózata). Újraélesztéshez vonultok.',steps:[
{sit:'A műszak kezdetén átveszitek az autót. A gépkocsivezető belépteti a járművet. Mentőápolóként mi a teendőd az IFT-n a bejelentkezéshez?',opts:[{tx:'Csak várom, hogy a központ küldjön feladatot.',ok:false,fb:'Hibás! Személyzetként be kell lépned az alkalmazásba.'},{tx:'A Személyzet csempén a "Mentőápoló" gombra koppintok, beírom az IVIR kódomat és a jelszavamat.',ok:true,fb:'Helyes! BLS egységnél a mentőápoló az egységvezető, így kell belépnie.'},{tx:'Az "Orvos/Mentőtiszt" gombot választom.',ok:false,fb:'Hibás! B kompetenciával a mentőápoló mezőt kell használni.'}]},
{sit:'Az ICS rádión jelzi: "Új feladat, 60 éves férfi összeesett, nem lélegzik. Esetszám: 12345." A tablet kijelzőjén nincs hálózat (piros ikon). Mit teszel?',opts:[{tx:'Azonnal megnyomom a kezdőképernyőn az "Eset offline rögzítése" gombot, és beírom az ICS-től kapott esetszámot.',ok:true,fb:'Helyes! Ha nincs hálózat, kötelező az offline rögzítés az esetszám egyeztetésével.'},{tx:'Indulunk és a papíralapú eseti naplót töltöm csak ki.',ok:false,fb:'Hibás! A tabletet offline módban is használni kell.'},{tx:'Várok, amíg visszajön a hálózat.',ok:false,fb:'Hibás! A riasztás azonnali vonulást igényel.'}]},
{sit:'Megkapjátok a címet. Melyik gombot kell megnyomnod az IFT-n az induláskor?',opts:[{tx:'A "Helyszínen" gombot.',ok:false,fb:'Hibás! Még csak most indultok el.'},{tx:'A "Vonulás megkezdése" gombot, amivel a státusz bordóra vált.',ok:true,fb:'Helyes! Ez jelzi az ICS felé is (ha van rádiókapcsolat), hogy megindult az egység.'},{tx:'Az "Engedélykérés" gombot.',ok:false,fb:'Hibás! Erre nincs szükség riasztáskor.'}]},
{sit:'Megérkeztek a címre. Megnyomod a "Helyszínen" gombot (narancs státusz). A hozzátartozó már nyomja a beteg mellkasát. Melyik csempét NYITOD MEG először a beavatkozásokhoz?',opts:[{tx:'Az "Újraélesztés" csempét, hogy azonnal dokumentáljam az eseményt.',ok:true,fb:'Helyes! A legkritikusabb beavatkozást, az újraélesztést azonnal meg kell kezdeni, és a csempéjén az időadatokat minél előbb rögzíteni érdemes.'},{tx:'A "Betegadatok" csempét, hogy lekérdezzem az EESZT-t.',ok:false,fb:'Hibás! Újraélesztésnél nincs idő EESZT lekérdezésre az első percekben.'},{tx:'A "Fájdalom" csempét.',ok:false,fb:'Hibás! Keringésmegállásnál ez teljesen irreleváns.'}]},
{sit:'A Betegdokumentáció navigációs menüjében sok csempe van. Hogyan tünteted el a nem relevánsakat (pl. Trauma, Szülés) az újraélesztés alatt?',opts:[{tx:'Belemegyek és beírom, hogy "Nem történt".',ok:false,fb:'Hibás! Van ennél sokkal gyorsabb módszer.'},{tx:'A menüben hosszan rányomok a nem szükséges csempékre, amitől azok inaktívvá válnak (kiszürkülnek).',ok:true,fb:'Helyes! Ezzel rengeteg időt spórolsz a dokumentáció során, mert a "Következő" gomb átugorja őket.'},{tx:'Törlöm a csempéket a beállításokban.',ok:false,fb:'Hibás! Nincs ilyen funkció.'}]},
{sit:'Az "Újraélesztés 1" oldalon mit kell bepipálnod az eddigi információk alapján?',opts:[{tx:'"T-CPR történt" és a CPR megkezdésének idejét.',ok:false,fb:'Hibás! A laikus nyomta, nem biztos, hogy telefonos irányítással.'},{tx:'"Szemtanú CPR történt", és a CPR megkezdésének idejét (ha nem pontos, akkor a "becslés" boxot is).',ok:true,fb:'Helyes! A hozzátartozó nyomta a mellkast, tehát laikus/szemtanú CPR történt.'},{tx:'Csak azt, hogy a mentőegység CPR-t végzett.',ok:false,fb:'Hibás! A kiérkezés előtti laikus tevékenységet is rögzíteni kell.'}]},
{sit:'Felhelyezed a félautomata defibrillátort (AED). A gép ritmust elemez, sokkot nem javasol (Asystolia). Hol jelölöd ezt az "Újraélesztés" csempén?',opts:[{tx:'Az 1. oldalon a keringésmegállás okánál.',ok:false,fb:'Hibás! Ott az okot jelöljük (pl. kardiális), nem a ritmust.'},{tx:'Az "Újraélesztés 2" oldalon az AED használatánál bejelölöm a "Nem sokkolandó" gombot, és az első ritmushoz beírom az asystoliát.',ok:true,fb:'Helyes! Az AED működését és az első ritmust itt dokumentáljuk pontosan.'},{tx:'Sehol, csak a papír CODE SUMMARY lesz kinyomtatva.',ok:false,fb:'Hibás! Az IFT-ben kötelező rögzíteni a gép által adott ritmust is.'}]},
{sit:'B kompetenciaszintű ápolóként intubálhatsz-e, és hol jelölöd az egyszerű légútbiztosítást (pl. tubus/maszk)?',opts:[{tx:'Igen, intubálok, és az Intubáció csempén rögzítem.',ok:false,fb:'Hibás! B kompetenciával nem végezhetsz endotrachealis intubációt.'},{tx:'Nem intubálok. Az IFT-ben a "További beavatkozások" csempén, vagy a légút/légzés megjegyzéseinél rögzítem a ballonos/maszkos lélegeztetést (NIV/BMV) és az OPA-t.',ok:true,fb:'Helyes! B szinten non-invazív légútbiztosítás van, amit az "Intubációt megelőző beavatkozásoknál" (ha aktív az az oldal) vagy a további beavatkozásoknál lehet jelölni.'},{tx:'Gyógyszerrel relaxálok, majd supraglottikus eszközt (LMA) helyezek be.',ok:false,fb:'Hibás! Gyógyszert sem adhatsz be B kompetenciaszinten.'}]},
{sit:'A folyamatos kompresszió és lélegeztetés mellett a beteg pulzusa visszatér. Hol rögzíted a sikert az IFT-n?',opts:[{tx:'Az "Esemény" csempén veszek fel egy új eseményt.',ok:false,fb:'Hibás! Van dedikált hely a ROSC dokumentálására az újraélesztés menüben.'},{tx:'Az "Újraélesztés 4" csempén beírom a "Pulzus első visszatérésének időpontja" mezőbe a pontos időt, és a kimenetelhez a sikeres ROSC-t.',ok:true,fb:'Helyes! Ez a protokolláris helye a sikeres újraélesztés (ROSC) dokumentálásának.'},{tx:'Elegendő a "Betegátadás" felületen beírni.',ok:false,fb:'Hibás! Az újraélesztési adatlapot pontosan ki kell tölteni a statisztika és dokumentáció miatt.'}]},
{sit:'Sikeres ROSC után a beteget kórházba szállítjátok, átadjátok az orvosnak. Mi az utolsó teendőd a tableten az állomásra indulás előtt?',opts:[{tx:'Csak kilépek a programból.',ok:false,fb:'Hibás! Az esetlapot véglegesíteni kell.'},{tx:'A "Betegátadás" menüben kitöltöm az átvevő orvos nevét, a pecsétszámát, az érkező km-t, majd az "Eset lezárása" gombra koppintok, amivel a dokumentum bekerül a MIR-be és az EESZT-be.',ok:true,fb:'Helyes! Az eset lezárásával válik a dokumentum véglegessé, megváltoztathatatlanná, és felkerül a felhőbe.'},{tx:'Törlöm az inaktív csempéket, hogy kevesebb helyet foglaljanak.',ok:false,fb:'Hibás! Az inaktív csempéket nem kell "törölni", az eset lezárásával minden mentésre kerül.'}]}
],summary:'Részletes Összefoglaló (B kompetencia - Újraélesztés): A műszak kezdetén a mentőápoló az IVIR kódjával belépett a Személyzet csempén. Riasztáskor a hálózat hiánya miatt azonnal az "Eset offline rögzítése" funkciót használta az ICS-től kapott esetszám alapján. A "Vonulás megkezdése" majd a helyszínre érés ("Helyszínen") státuszok valós idejű gombnyomással lettek rögzítve. Mivel újraélesztésre volt szükség, azonnal megnyitottuk az "Újraélesztés" csempét, a nem releváns csempéket (Trauma, Szülés) pedig hosszan nyomva inaktiváltuk. Az Újraélesztés 1. oldalán jelöltük a laikus CPR-t és az időpontokat. Az AED elemzése Asystoliát mutatott, ezt az Újraélesztés 2. oldalán "Nem sokkolandó" és Asystolia ritmusként vittük be. B kompetenciaszint révén gyógyszeres intubáció nem történt, az egyszerű légútbiztosítást a megfelelő menüben rögzítettük. A ROSC (keringés visszatérése) idejét az Újraélesztés 4. oldalán mentettük el. Végül a kórházi érkezéskor az Átadás felületén orvosi adatokkal és a km óra állással sikeresen lezártuk az esetet, így a dokumentáció az EESZT-be is felkerült.'},

{id:2,title:'2. Szimuláció: Közlekedési baleset, Intranasalis Fentanil (B+ kompetencia)',diff:'B+ kompetencia',desc:'Mentőápolóként dolgozol, B+ kompetenciával (gyógyszerezhetsz). Egy roncsba szorult, súlyos mellkasi sérülthöz vonultok. A beteg erős fájdalomra panaszkodik.',steps:[
{sit:'A műszak elején a jármű átvételekor veszed észre, hogy a gyermek ambu ballon hiányzik. Hol jelzed ezt a belépéskor?',opts:[{tx:'Bejelentem a rádión, de a tableten nem tudom jelölni.',ok:false,fb:'Hibás! A tableten erre külön felület van.'},{tx:'A Bejelentkezés képernyőn az "Eszközhiány" (fecskendő ikon) csempére koppintok, kiválasztom a hiányzó eszközt, amitől a csempe pirosra vált.',ok:true,fb:'Helyes! Az eszközhiány jelölése kötelező és a csempe piros színe figyelemfelhívó az Irányító Csoport felé is.'},{tx:'Az "Egyéb személyzet" menübe írom be.',ok:false,fb:'Hibás! Az a vizsgakocsizók/szekundánsok rögzítésére van.'}]},
{sit:'Vonulás közben egy vasúti átjáróban leeresztett sorompó állít meg titeket 5 percre. Hogyan rögzíted a szoftverben?',opts:[{tx:'A Vonulás képernyőn a "Veszteglés ideje, oka" gombra koppintok, felveszem az új veszteglést: ok (pl. vasúti átjáró) és beírom a becsült hosszt.',ok:true,fb:'Helyes! Ez indokolja majd a meghosszabbodott vonulási időt.'},{tx:'Az "Eset offline rögzítése" gombot használom.',ok:false,fb:'Hibás! A hálózat működik, vonulásban vagyunk.'},{tx:'Semmit nem teszek, majd a végén az Epikrízisbe beírom.',ok:false,fb:'Hibás! Valós időben kell rögzíteni a késedelmet az arra szolgáló funkcióval.'}]},
{sit:'Megérkeztek a helyszínre. A beteg a roncsban van, közlekedési baleset. Melyik csempét kell mindenképpen megnyitnod a mechanizmus tisztázására?',opts:[{tx:'A "Nem traumás vérzés" csempét.',ok:false,fb:'Hibás! Ez a beteg traumás.'},{tx:'A "Közlekedési baleset" és a "Sérülés" csempéket.',ok:true,fb:'Helyes! Itt kell rögzíteni, hogy mi ütközött mivel, a beteg hol ült (pl. gépjármű vezető) és használta-e a biztonsági övet.'},{tx:'A "Mérgezés" csempét.',ok:false,fb:'Hibás! A közlekedési baleset a releváns.'}]},
{sit:'A beteg panaszkodik: "Nagyon fáj a mellkasom!". A "Fájdalom" csempén rögzíted ezt. A "Trauma" csempén hogyan dokumentálod a sérülést?',opts:[{tx:'Rákoppintok a kék emberi alak (testtérkép) mellkasára, majd a felugró ablakban kiválasztom a sérülés típusát (pl. zúzódás, bordatörés gyanú).',ok:true,fb:'Helyes! A grafikus interfészen az érintőpontokkal lehet bevinni a sérülést, amit a gép jobb oldalon összesít.'},{tx:'Csak egy szabad szöveges mező van, oda beírom, hogy "Mellkas sérült".',ok:false,fb:'Hibás! A szoftver interaktív testtérképet használ a lokalizációra.'},{tx:'A Trauma csempét inaktiválom, mert az orvosi hatáskör.',ok:false,fb:'Hibás! A trauma rögzítése kompetenciaszinttől független.'}]},
{sit:'A beteg erős fájdalma miatt (NRS: 9/10) B+ kompetenciaszinten intranasalis Fentanilt adsz. Melyik csempén dokumentálod ezt ELSŐKÉNT?',opts:[{tx:'A "További beavatkozások" zöld gombjánál.',ok:false,fb:'Hibás! A kábítószer-tartalmú orrspraynek saját dedikált csempéje van.'},{tx:'Az "Intranasalis gyógyszeres beavatkozások" csempén, ahol kiválasztom a Fentanilt, megadom a beadás okát és a pontos időpontot.',ok:true,fb:'Helyes! Az IN adagolás külön csempén indul.'},{tx:'Az "Epikrízis" szövegbe beírom és kész.',ok:false,fb:'Hibás! A strukturált adatrögzítés a gyógyszereknél kötelező.'}]},
{sit:'Az IN Fentanil bevitelekor a szoftver hogyan viselkedik az "Intranasalis" csempe elhagyásakor az eljárásrend alapján?',opts:[{tx:'Automatikusan lezárja az Esetlapot.',ok:false,fb:'Hibás! A beavatkozás nem zárja le az esetet.'},{tx:'Egy felugró ablakban kéri, hogy válasszuk ki a megfelelő KISZERELÉSŰ Fentanil készítményt (mert kábítószer), és az adatokat automatikusan átemeli a "Gyógyszeres beavatkozások" csempére.',ok:true,fb:'Helyes! Szigorú gyógyszerelszámolás miatt a kiszerelést is pontosítani kell.'},{tx:'Megkérdezi, hogy biztosan adtunk-e gyógyszert.',ok:false,fb:'Hibás! A kiszerelés megadását kényszeríti ki.'}]},
{sit:'A fájdalomcsillapítás után a beteg bal mellkasfele nem emelkedik, feszülő PTX alakul ki. B+ szinten tű dekompressziót (mellkas detenzionálást) végzel. Melyik csempén rögzíted a beavatkozást?',opts:[{tx:'A "Légzés" csempén beírom az Egyéb megjegyzésbe.',ok:false,fb:'Hibás! Van strukturált beavatkozás rögzítő.'},{tx:'A "További beavatkozások" csempén az "Új beavatkozás" zöld fülre koppintva, a listából kiválasztom a mellkas detenzionálást, és megadom a pontos kezdeti időpontot.',ok:true,fb:'Helyes! Minden invazív és egyéb beavatkozás strukturált listából választható a "További beavatkozásoknál".'},{tx:'A "Trauma" csempén a "Sérülés nincs" gombbal.',ok:false,fb:'Hibás! Az a rögzített trauma törlésére szolgál.'}]},
{sit:'A beavatkozás után stabilizálódik. Nyakrögzítő gallért és medenceövet (SAM sling) helyeztek fel. Ezt hogyan rögzíted?',opts:[{tx:'Szintén a "További beavatkozások" csempén az Új beavatkozás gombbal kikeresem a "Rögzítés..." elemeket a felugró ablakból.',ok:true,fb:'Helyes! Az összes rögzítéstechnikai eszköz felhelyezése itt listázható.'},{tx:'Nem rögzítem sehova, a kórházban úgyis látják, hogy rajta van.',ok:false,fb:'Hibás! Minden felhasznált anyagot és beavatkozást kötelező adminisztrálni.'},{tx:'A "Bőr" csempén rögzítem.',ok:false,fb:'Hibás! Annak semmi köze a rögzítőeszközökhöz.'}]},
{sit:'Kórházba indultok. Hirtelen ellenőrizni szeretnéd az összes eddig beadott gyógyszert és rögzített beavatkozást időrendben. Hol teheted meg gyorsan?',opts:[{tx:'Minden csempét egyenként újra végiglapozok.',ok:false,fb:'Hibás! Ez lassú és balesetveszélyes vonulás közben.'},{tx:'A menüsorban az "Áttekintő" csempére koppintok, ami időrendi sorrendben listázza a beavatkozásokat és eseményeket.',ok:true,fb:'Helyes! Az Áttekintő pontosan ezt a funkciót látja el a gyors ellenőrzéshez.'},{tx:'A "Szülés" csempén.',ok:false,fb:'Hibás! Ez a beteg nem terhes, és nem a szülés csempe az áttekintő.'}]},
{sit:'Átadjátok a beteget a Traumatológián. Kábítószert is használtatok (Fentanil orrspray maradéka). Mit nem szabad elfelejtened az eset lezárása (Betegátadás) ELŐTT?',opts:[{tx:'A "Közlekedési baleset" csempét törölni kell.',ok:false,fb:'Hibás! Az adatokat sosem töröljük.'},{tx:'Az "Utólagos megjegyzés" csempén (vagy epikrízisben) feltüntetni a kábítószer kiöntésének/megsemmisítésének tényét, majd ezután a "Betegátadás" gombbal véglegesíteni az esetet az orvos adataival.',ok:true,fb:'Helyes! Az IFT protokoll hangsúlyozza az utólagos megjegyzés kábítószer-elszámolási fontosságát lezárás előtt.'},{tx:'Csak egy aláírás kell a tabletre a betegtől.',ok:false,fb:'Hibás! Kábítószer elszámolásról van szó, írásos megjegyzés szükséges.'}]}
],summary:'Részletes Összefoglaló (B+ kompetencia - Trauma): A műszak elején a belépéskor az "Eszközhiány" csempén rögzítettük a hiányzó eszközt (a csempe pirosra váltott). Vonulás közben a vasúti átjáró miatt a "Veszteglés" menüpontban rögzítettük az okot és a becsült időt. A baleseti helyszínre érve a "Közlekedési baleset" és a "Trauma" csempéken a testtérkép használatával dokumentáltuk a mellkasi sérülést és az ütközés mechanizmusát. B+ kompetenciával intranasalis Fentanilt adtunk: ezt a dedikált "Intranasalis gyógyszeres beavatkozás" csempén kezdtük rögzíteni. A szoftver kilépéskor kötelezően bekérte a gyógyszer pontos kiszerelését, majd az adatokat automatikusan átemelte a Gyógyszeres beavatkozások listájába. A feszülő PTX miatti tű dekompressziót (mellkas detenzionálást), a nyakgallér és a medenceöv felhelyezését is a "További beavatkozások" csempénél, legördülő listákból kiválasztva dokumentáltuk. Az "Áttekintő" csempén ellenőriztük a bevitt adatokat időrendben. Végül az átadás során az "Utólagos megjegyzésben" rögzítettük a kábítószer (Fentanil) maradékának kiöntését, és az átvevő orvos pecsétszámával véglegesen lezártuk a feladatot.'},

{id:3,title:'3. Szimuláció: Szülés otthon (B kompetencia)',diff:'B kompetencia',desc:'Mentőápolóként dolgozol, B kompetenciával. Otthonában vajúdó, 39 hetes terhes kismamához vonultok. A szülés a helyszínen megindul.',steps:[
{sit:'Riasztást kaptok az IFT-n. A feladat elfogadása után a Vonulás képernyőre juttok. Miért fontos ellenőrizni és szükség esetén módosítani az induló km adatot?',opts:[{tx:'Mert a gép mindig automatikusan 0-t ír be.',ok:false,fb:'Hibás! A gép az előző záró km-t ajánlja fel.'},{tx:'Mert a rendszer az előző feladat záró km-jét ajánlja fel. Ha eltérés van, indokolni is kell a módosítás okát.',ok:true,fb:'Helyes! A jármű naplózása szempontjából kritikus az egyezés, eltérésnél a rendszer okot kér.'},{tx:'Nem fontos, a GPS méri a távolságot.',ok:false,fb:'Hibás! A kilométeróra állása jogi és adminisztratív adat.'}]},
{sit:'A helyszínre érve rányomsz a "Helyszínen" gombra (narancs státusz). A kismama az ágyon fekszik, láthatóan erős fájásai vannak. Melyik csempét NYITOD MEG a Betegadatok kitöltése után azonnal?',opts:[{tx:'A "Szülés" csempét, hogy a megindult szülés állapotát rögzítsem.',ok:true,fb:'Helyes! Minden specifikus helyzetnek megvan a fő csempéje. A szülés csempe aktiválja a terhességgel kapcsolatos kérdéseket.'},{tx:'A "Trauma" csempét.',ok:false,fb:'Hibás! Nem történt baleset.'},{tx:'A "Mérgezés" csempét.',ok:false,fb:'Hibás! Relevancia nélküli.'}]},
{sit:'A "Szülés 1" csempén kiválasztod a "Megindult szülés" gombot. Milyen további, terhességre vonatkozó adatok válnak így szerkeszthetővé (szürkülnek ki) az eljárásrend alapján?',opts:[{tx:'Csak a vércsoport és a RH faktor.',ok:false,fb:'Hibás! Más demográfiai és szülészeti adatok kellenek.'},{tx:'A "Gondozott terhesség?", "Hányadik terhesség?", "Hányadik szülés?" és a "Becsült idő hetekben" mezők.',ok:true,fb:'Helyes! Ezek az alapvető anamnesztikus szülészeti kérdések a szoftverben.'},{tx:'A kismama vérnyomásának grafikonja.',ok:false,fb:'Hibás! A vérnyomást nem ezen a csempén rögzítjük.'}]},

}

return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+

}

function gcsInterp(){
var tot=CA.gcs_e+CA.gcs_v+CA.gcs_m;
var lbl=tot>=13?'Enyhe (≥13)':tot>=9?'Közepes (9-12)':'Súlyos (≤8)';
var col=tot>=13?'#4ade80':tot>=9?'#fde68a':'#fca5a5';
var bg=tot>=13?'#064e3b':tot>=9?'#451a03':'#450a0a';
return {tot:tot,lbl:lbl,col:col,bg:bg};
}

function calcAge() {
    if(!CA.ageDOB) return "-";
    if(!CA.ageDate) return "-";
    let dob = new Date(CA.ageDOB);
    let today = new Date(CA.ageDate);
    if(isNaN(dob.getTime()) || isNaN(today.getTime())) return "Hiba";
    let age = today.getFullYear() - dob.getFullYear();
    let m = today.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
        age--;
    }
    return age >= 0 ? age + " év" : "Érvénytelen";
}

:

document.querySelectorAll('.nb').forEach(function(b,i){
    if(tabs[i]){
        b.classList.toggle('act',tabs[i]===active);
    }
});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcTab=function(t){CA.tab=t;render();};
window.setGCSE=function(v){CA.gcs_e=+v;render();};
window.setGCSV=function(v){CA.gcs_v=+v;render();};
window.setGCSM=function(v){CA.gcs_m=+v;render();};
window.setDOB=function(v){CA.ageDOB=v;render();};
window.setAgeDate=function(v){CA.ageDate=v;render();};

let td = new Date();
let tzOffset = td.getTimezoneOffset() * 60000;
let localISOTime = (new Date(td - tzOffset)).toISOString().slice(0, 10);
CA.ageDate = localISOTime;

render();
</script>
