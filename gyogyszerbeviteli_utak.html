var CARDS=[

{cat:'Oralis/SL',f:'Hogyan kell beadni az ACS-ben szenvedő betegnek az Aspirint és a Nitroglicerint?',b:'Aspirin: Szét kell rágatni a megfelelő felszívódás érdekében.\nNitroglicerin: Permetezés a levegőbe (feltöltés), L-betű mondása (nyelv a szájpadláson), függőleges tartállyal a nyelv alá fújás. Lélegzetet bent kell tartani.'},
{cat:'Inhalációs',f:'Mennyi az optimális oxigénáramlás a nebulizátoros (gyógyszerporlasztó) O2-maszkhoz?',b:'Általában 6-9 liter/perc.\nLátható páraképződéssel kell járnia, és törekedni kell a minél rövidebb alkalmazásra (5-15 perc).'},
{cat:'Inhalációs',f:'Mi a Demand-szelep (N2O) alkalmazásának legfőbb feltétele?',b:'CSAK eszméletén lévő, jól kooperáló betegnél alkalmazható!\nÖnadagoló eszköz (a beteg légvételei indítják). A maszkot soha ne rögzítsük pántokkal.'},
{cat:'Rectalis',f:'Hogyan adjuk be a diazepám rectalis oldatot 15 kg alatti gyermeknek?',b:'A tubus végét CSAK FÉLIG vezetjük be a rectumba.\nA kiürítés után a szívóhatás elkerülése érdekében ÖSSZENYOMVA tartjuk a tubust a kihúzásig.'},
{cat:'IM',f:'Melyik a leginkább javasolt izom IM injekcióra sürgető esetben (pl. anaphylaxia)?',b:'M. vastus lateralis (comb külső-középső harmada).\nKönnyen hozzáférhető és minden életkorban elsőként választandó.'},
{cat:'IM',f:'Mi az IM gyógyszerelés "légzár" technikája?',b:'A fecskendőbe a gyógyszeren kívül 0,3-0,5 ml levegőt is felszívunk, ami a beadás végén a szúrcsatornát lezárja, megakadályozva a gyógyszer subcutan visszaszivárgását.'},
{cat:'IM',f:'Milyen szögben és mennyi a maximális térfogat felnőtt IM injekciónál?',b:'Szög: 72-90° (Z-vonal technika javasolt).\nMax mennyiség: 5 ml. (Ha több kell, másik helyre kell szúrni elosztva).'},
{cat:'PVB',f:'Mikor kontraindikált a PVB az adott végtagon?',b:'Phlebitis, lymphoedema, cellulitis, azonos oldali axillaris sebészeti beavatkozás/mastectomia.\nCimino-fistula (dialízis shunt) pungálása SZIGORÚAN TILOS!'},
{cat:'PVB',f:'Mi a teendő a PVB sikeres beadása után, ha csak gyógyszerelés miatt kötöttük be?',b:'Sóoldatos átmosás után LE KELL ZÁRNI.\nA "vénafenntartó infúzió" indokolatlan és az ellenőrizetlen folyadékbevitel miatt veszélyes.'},
{cat:'IO',f:'Mikor elsőként választandó az IO biztosítás?',b:'Gyermek újraélesztés során.\nFelnőttnél akkor, ha ésszerű időn (2 kísérlet vagy 2 perc) belül nem sikerül perifériás vénát biztosítani.'},
{cat:'IO',f:'Mik az EZ-IO tűméretek és kinek valók?',b:'15 mm (rózsaszín): 3-39 kg\n25 mm (kék): 3 kg felett (felnőtt tibiához is jó)\n45 mm (sárga): 40 kg felett, vagy tömeges lágyrész esetén (pl. felnőtt humerus).'},
{cat:'IO',f:'Mi a legfontosabb vizuális ellenőrzés a csont fúrásának megkezdése előtt?',b:'A bőr és a lágyrészek átszúrása után (a csont érintésekor) legalább az utolsó 5 mm-es beosztásnak KI KELL LÁTSZÓDNIA a tűn! Ha nem, hosszabb tű kell.'},
{cat:'IO',f:'Felnőtt újraélesztésnél melyik az elsődlegesen választandó IO szúrási pont?',b:'Proximalis humerus (váll).\nA fúrás 45°-os szögben a vízszintes síkhoz képest, a test mellé szorított és befelé rotált karon.'},
{cat:'IO',f:'Hogyan kell fájdalmat csillapítani az IO térben megtartott tudatnál?',b:'Lidokain (1%-os, adrenalinmentes) LASSÚ, 1-2 perc alatti beadásával.\nFelnőtt: 40mg -> 1 perc szünet -> 5-10ml NaCl bemosás -> 20mg.'}
];

{q:'Hogyan távolítjuk el az EZ-IO kanült?',opts:['Gyorsan, egyenesen kihúzzuk','Luer-menetes fecskendőt csatlakoztatunk, és az óramutató járásával megegyezően csavarva kihúzzuk','Luer-menetes fecskendővel az óramutató járásával ellentétesen csavarjuk','A fúrót visszacsatlakoztatjuk és visszafelé pörgetjük'],ok:1,exp:'A fecskendőt tengelyben tartva, az óramutató járásával MEGEGYEZŐEN kezdjük kicsavarni, miközben egyenesen kihúzzuk.'},
{q:'Megtartott tudatú, shockos felnőtt beteg fájdalomcsillapítása IO bemosás előtt:',opts:['Lidokain 40 mg LASSAN 2 perc alatt, majd 1 perc várakozás','Lidokain 40 mg bólusban gyorsan','Fentanil 100 mcg lokálisan az IO térbe','Nem csillapítunk fájdalmat'],ok:0,exp:'Lidokaint (40mg/4ml) adunk nagyon lassan (2 perc alatt), hogy lokálisan kifejtse hatását és ne jusson be hirtelen a szisztémás keringésbe.'},
{q:'Mi az IM injekciózás javasolt fecskendő előkészítési technikája?',opts:['Teljesen légteleníteni kell az utolsó cseppig','0,3-0,5 ml levegőt kell felszívni a gyógyszer mellé légzárként','Félig levegővel kell tölteni a jobb nyomásért','Desztillált vizet kell a fecskendőbe szívni'],ok:1,exp:'A kismennyiségű levegő légzárként megakadályozza a gyógyszer subcutan szövetekbe való visszajutását a tűszúrás csatornáján keresztül.'},
{q:'Melyik állítás IGAZ a perifériás vénabiztosítás utáni teendőkkel kapcsolatban (ha csak gyógyszer beadás a cél)?',opts:['Vénafenntartó infúziót kell bekötni','A gyógyszer beadása után sóoldattal át kell mosni, majd le kell zárni a kanült','Nem kell átmosni, csak lezárni','Folyamatosan vért kell szívni belőle'],ok:1,exp:'A kanült "fiziológiás" sóoldattal történt átmosást követően le kell zárni. A vénafenntartó infúzió indokolatlan és veszélyes.'},
{q:'Gyermekek (15 kg alatt) rectalis diazepam adagolásánál a legfőbb szabály:',opts:['A tubust teljesen be kell vezetni','A tubus végét csak félig szabad bevezetni','Dupla adagot kell beadni a rossz felszívódás miatt','Csak hanyatt fekve adható'],ok:1,exp:'15 kg alatti gyermekeknél a tubus végét csak félig szabad bevezetni a rectumba.'}
];

var SIMS=[
{id:1,title:'1. Szimuláció: ACS - Oral/SL/PVB (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 60 éves férfi mellkasi nyomásra panaszkodik. Akut Coronaria Szindróma gyanúja. B+ kompetencia (Mentőápoló gyógyszerezési joggal).',steps:[
{sit:'A beteg eszméleténél van, jól kooperál. Az eljárásrend gyógyszerelési alapszabályai szerint mi az első lépések egyike, mielőtt bármilyen gyógyszert előkészítesz?',opts:[{tx:'Csak vénát szúrok, nem kérdezek semmit.',ok:false,fb:'Hibás! A gyógyszerelési alapszabályok (pl. érzékenység) kötelezőek.'},{tx:'Azonosítom a beteget és rákérdezek a gyógyszerérzékenységeire (allergia).',ok:true,fb:'Helyes! A 9 alapszabály 1. és 2. pontja a megfelelő beteg és a megfelelő gyógyszer (allergia kizárása).'}]},
{sit:'A beteg nem allergiás semmire. A protokoll szerint Nitroglicerin spray adása indokolt (sublingualis út). A spray régóta nem volt használva. Mi a teendő a legelső fújás előtt?',opts:[{tx:'Azonnal a beteg nyelve alá fújom.',ok:false,fb:'Hibás! A kamra üres lehet.'},{tx:'Ütközésig lenyomom a szórófejet, majd a levegőbe ismétlem a fújást, amíg folyadék nem jön ki.',ok:true,fb:'Helyes! Így telítődik fel a dózis-adagoló kamra.'}]},
{sit:'A spray készen áll. Milyen instrukciót adsz a betegnek a sublingualis fújás előtt?',opts:[{tx:'"Vegyen egy nagy levegőt és szívja be a permetet!"',ok:false,fb:'Hibás! A permetet nem szabad belélegezni.'},{tx:'"Helyezze a nyelvcsúcsát a szájpadlásához (mondjon L-betűt)!"',ok:true,fb:'Helyes! Ez felemeli a nyelvet, a permetet az L-betű tartása mellett fújjuk a nyelv alá. A lélegzetet bent kell tartani.'}]},
{sit:'Következő gyógyszer az Acetilszalicilsav (Aspirin) oralis úton. Milyen módon kell a betegnek bevennie ACS esetén?',opts:[{tx:'Folyadékkal, egészben kell lenyelnie.',ok:false,fb:'Hibás! ACS indikációban más a szabály.'},{tx:'A tablettát a megfelelő és gyors felszívódás érdekében szét kell rágatnia.',ok:true,fb:'Helyes! ACS indikációban az Aspirint szét kell rágatni.'}]},
{sit:'A beteg a Clopidogrelt is megkapja. Ennek mi a módja az eljárásrend alapján?',opts:[{tx:'A tablettát kevés folyadékkal le kell nyelni.',ok:true,fb:'Helyes! A Clopidogrelt csak egyszerűen le kell nyelni.'},{tx:'Ezt is szét kell rágni.',ok:false,fb:'Hibás! A Clopidogrelt nem rágatjuk szét.'}]},
{sit:'Most intravénás gyógyszerek beadásához PVB (Perifériás Vénás Biztosítás) szükséges. Hol javasolt elkezdeni a véna keresését az eljárásrend szerint?',opts:[{tx:'Kizárólag a könyökhajlat vénáit használom.',ok:false,fb:'Hibás! A könyökhajlati véna nem élvez prioritást, sőt.'},{tx:'Distalis elhelyezkedésű vénával javasolt kezdeni a punkciót (kézfej, alkar).',ok:true,fb:'Helyes! A distalis (távolabbi) vénákon érdemes kezdeni a szúrást.'}]},
{sit:'Kiválasztottad a bal alkar egy egyenes vénáját. Megtörtént a leszorítás és a bőr fertőtlenítése. Mi a szigorú aszepszis szabály a szúrás előtt?',opts:[{tx:'Kézzel még egyszer áttapintom a vénát a fertőtlenített felületen.',ok:false,fb:'Hibás! Ez megsérti a sterilitást.'},{tx:'A fertőtlenítés után a szúrandó felszínt már NEM tapintom meg.',ok:true,fb:'Helyes! Tilos a fertőtlenített terület érintése.'}]},
{sit:'A szúrás (10-30 fokos szögben) megtörténik, a cseppkamrában vér jelenik meg. Hogyan folytatod a kanül felvezetését?',opts:[{tx:'A szúrás szögét csökkentve pár mm-t előretolom a kanült, majd a tű LASSÚ visszahúzásával egyidejűleg vezetem fel a kanült a vénába.',ok:true,fb:'Helyes! A tű visszatolása tilos, a lassú kihúzással egyszerre toljuk be a kanült.'},{tx:'A tűvel együtt tolom be tövig, majd hirtelen kihúzom a tűt.',ok:false,fb:'Hibás! Ez átszúrhatja a vénát.'}]},
{sit:'A kanül a helyén, a leszorítást felengedted. Rácsatlakoztatod a légtelenített szereléket. Milyen szövődményt figyelsz a bemosás alatt?',opts:[{tx:'Azonnali tüdőödémát.',ok:false,fb:'Hibás! Egy 5 ml-es bemosás nem okoz tüdőödémát.'},{tx:'Az extravasatio jeleit: kanül fölötti duzzanat, fájdalom, csípő érzés.',ok:true,fb:'Helyes! Ha a kanül kicsúszott vagy átütötte a vénát, a folyadék a szövetek közé megy.'}]},
{sit:'A gyógyszerek iv. beadása után az orvos azt kéri, ne köss be további infúziót, csak a véna maradjon meg. Mi a teendőd az eljárásrend szerint?',opts:[{tx:'Egy nagyon lassú "vénafenntartó infúziót" (KVO) azért bekötök.',ok:false,fb:'Hibás! Az eljárásrend ezt indokolatlannak és veszélyesnek nevezi.'},{tx:'A gyógyszer beadása után a kanült "fiziológiás" sóoldattal átmosom, majd biztonságosan lezárom a kupakkal/csappal.',ok:true,fb:'Helyes! Az ellenőrizetlen folyadékbevitel elkerülése végett vénafenntartó infúzió nem javasolt, csak a lezárás.'}]}
],summary:'Részletes Összefoglaló (Sim 1 - B+ kompetencia): Az ACS protokoll alapján a betegazonosítás és allergiaellenőrzés (9 alapszabály) után a sublingualis Nitroglicerin spray-t a levegőbe fújva légtelenítettük, majd a beteggel „L” betűt formáltatva a nyelv alá permeteztük (belégzés nélkül). Az Aspirint az ACS indikáció miatt szétrágattuk, a Clopidogrelt lenyelettük. A PVB-t distalis vénán (alkar) kezdtük, fertőtlenítés után a bőrt már nem tapintottuk. A vér megjelenése után a szöget csökkentve, a tű óvatos visszahúzásával toltuk be a kanült. Bemosásnál figyeltük az extravasatio jeleit (duzzanat, csípő érzés). Gyógyszerelés után sóoldatos átmosással zártuk le a kanült, mellőzve a veszélyes „vénafenntartó” infúziót.'},

{id:2,title:'2. Szimuláció: Gyermekkori asztma & Görcs - Inhalációs/PR/IM (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 6 éves asztmás kisfiú fullad. A mentőben egyszer csak görcsölni kezd. B+ kompetencia.',steps:[
{sit:'A gyermek asztmás rohamára a protokoll alapján gyógyszerporlasztást (nebulizátor) készítesz elő O2-maszkkal. Milyen testhelyzetben kell a beteget elhelyezni?',opts:[{tx:'Hanyatt fekve a mentőágyon.',ok:false,fb:'Hibás! A porlasztó így nem működik megfelelően.'},{tx:'Ülő/félülő helyzetben, mert a nebulizátor csak függőleges pozícióban képes porlasztani.',ok:true,fb:'Helyes! A tartálynak függőlegesnek kell lennie.'}]},
{sit:'Hogyan állítod be az oxigénáramlást a nebulizátor működtetéséhez?',opts:[{tx:'6-9 l/perc áramlásra, amíg látható páraképződéssel nem jár a gyógyszer porlasztása.',ok:true,fb:'Helyes! Ez biztosítja a megfelelő méretű részecskéket és a bevitelt.'},{tx:'Maximum 2 l/perc, nehogy túltöltődjön.',ok:false,fb:'Hibás! Két liter nem fogja kiporlasztani a gyógyszert.'}]},
{sit:'A porlasztás alatt a gyermek hirtelen elveszti az eszméletét és epilepsziás görcsrohama indul (tónusos-klónusos rángások). Vénája nincs. B+ protokoll szerint rectalis Diazepam oldatot kell adnod. Milyen testhelyzetbe hozod?',opts:[{tx:'Oldalt fekvő helyzetbe (felhúzott lábakkal).',ok:true,fb:'Helyes! Ez biztosítja a legkönnyebb hozzáférést és kíméletes.'},{tx:'Hanyatt fekvés, lábakat a nyakába hajtva.',ok:false,fb:'Hibás! Veszélyes és szükségtelen pozíció egy görcsölő gyermeknél.'}]},
{sit:'A gyermek 6 éves (kb. 20 kg). Hogyan vezeted be a Diazepam rectalis oldat tubusát?',opts:[{tx:'Csak félig vezetem be a rectumba.',ok:false,fb:'Hibás! 15 kg alattiaknál kell csak félig, ő 20 kg.'},{tx:'A készítmény sapkájának lecsavarása után a tubus végét TELJESEN bevezetem a rectumba.',ok:true,fb:'Helyes! Mivel 15 kg felett van, teljesen be kell vezetni.'}]},
{sit:'Kiüríted a tubust. Hogyan távolítod el a tubust a rectumból?',opts:[{tx:'A szívóhatás elkerülése érdekében a tubust összenyomva tartom a rectumból történő eltávolításig.',ok:true,fb:'Helyes! Ha elengeded, a tubus visszaszívja a hatóanyagot.'},{tx:'Teljesen elengedve a tubust lassan kihúzom.',ok:false,fb:'Hibás! Így visszaszívod a gyógyszert.'}]},
{sit:'A görcs továbbra sem oldódik, a rectalis gyógyszer nem volt elég. Az orvosi/tiszti (vagy B+) utasítás alapján IM injekció szükséges (Midazolam). Gyermeknél sürgető helyzetben (görcs) hol van az ELSŐKÉNT választandó IM beviteli hely?',opts:[{tx:'A M. deltoideus (váll).',ok:false,fb:'Hibás! Kicsi izomtömeg, görcsnél nehéz hozzáférni.'},{tx:'A M. vastus lateralis (a comb középső harmadának elülső-oldalsó része).',ok:true,fb:'Helyes! Könnyen hozzáférhető, sürgető beavatkozásnál elsőként választandó gyermeknél.'}]},
{sit:'Előkészíted az IM fecskendőt. Milyen speciális (levegős) technikát javasol az eljárásrend?',opts:[{tx:'0,3-0,5 ml levegőt szívok fel a gyógyszer után légzárként, amely megakadályozza a subcutan visszajutást.',ok:true,fb:'Helyes! Ez a légzárásos módszer.'},{tx:'Szigorúan tilos levegőt szívni a fecskendőbe.',ok:false,fb:'Hibás! IM injekciónál javasolt a kismennyiségű légzár.'}]},
{sit:'Hogyan kell tartani és milyen szögben kell az IM injekciót beszúrni a combba?',opts:[{tx:'Fecskendőt "darts-szerűen" fogva, 72-90°-os szögben, lehetőleg Z-vonal technikával (a bőr 2-3 cm-es elhúzásával).',ok:true,fb:'Helyes! Ez az eljárásrend szerinti biztonságos technika.'},{tx:'Párhuzamosan a bőrrel (15°-ban).',ok:false,fb:'Hibás! Az intradermális/subcutan szög lenne.'}]},
{sit:'A tű a comb izomzatában van. Melyik lépés a legfontosabb magának a gyógyszernek a bejuttatása ELŐTT?',opts:[{tx:'Gyorsan és erős nyomással befecskendezni az egészet.',ok:false,fb:'Hibás! Ez szövetkárosító és fájdalmas.'},{tx:'Megszívni a fecskendőt (aspiráció), hogy megbizonyosodjunk róla, nem hatoltunk érpályába.',ok:true,fb:'Helyes! IM szúrásnál a véletlen intravascularis beadás elkerülése kötelező.'}]},
{sit:'Sikeres aspiráció (nincs vér), lassan beadod a 1 ml Midazolamot. Mi a teendő a tű kihúzásakor és azután?',opts:[{tx:'A tű kihúzása előtt várok 10 másodpercet, kihúzom, fedem a sebet, de KERÜLÖM a punkciós hely masszírozását.',ok:true,fb:'Helyes! A várakozás csökkenti a szivárgást, a masszírozás elkerülése pedig szöveti védelmet ad.'},{tx:'Azonnal kihúzom és erősen átmasszírozom a combját.',ok:false,fb:'Hibás! A masszírozás nem javasolt.'}]}
],summary:'Részletes Összefoglaló (Sim 2 - B+ kompetencia): A 6 éves asztmás gyermeket a gyógyszerporlasztó (nebulizátor) megfelelő működéséhez ülő helyzetbe hoztuk. A porlasztót 6-9 l/perc oxigénáramlással indítottuk, hogy látható pára képződjön. A kialakuló epilepsziás görcsroham miatt azonnal oldalt fekvő helyzetben rectalis Diazepamot adtunk: mivel a gyermek >15 kg, a tubust teljesen bevezettük, majd kiürítés után ÖSSZENYOMVA tartva húztuk ki, hogy ne szívja vissza a gyógyszert. A görcs perzisztálása miatt IM Midazolam adására került sor. Elsőként választandó helyként a combizmot (M. vastus lateralis) választottuk. A fecskendőbe kismennyiségű (0,3-0,5 ml) levegőt (légzár) szívtunk. Darts-szerű fogással, Z-vonal technikával, 90 fokos szögben szúrtunk. A beadás ELŐTT aspiráltunk a véletlen érpályába hatolás kizárására. A gyógyszer lassú beadása után 10 mp-et vártunk a kihúzással, és a szúrás helyének masszírozását kerültük.'},

{id:3,title:'3. Szimuláció: IO Felnőtt Újraélesztés és Shock (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 50 kg-os felnőtt többszörösen sérült, a helyszínen keringésmegállás következik be. B+ kompetencia (vagy tiszti/orvosi asszisztencia az IO-hoz).',steps:[
{sit:'A felnőtt betegnél újraélesztést kezdetek. Az IV próbálkozás esélytelen a perifériás erek összeesése miatt. Mi az IO indikációja felnőtt CPR alatt?',opts:[{tx:'Csak ha már legalább 4 perifériás szúrás sikertelen volt 10 percen belül.',ok:false,fb:'Hibás! Az eljárásrend nem vár ennyit.'},{tx:'Felnőtt újraélesztésnél, ha nem sikerül ésszerű időn belül perifériás vénát biztosítani (2 próbálkozás vagy 2 perc).',ok:true,fb:'Helyes! Az időveszteség elkerülése végett hamar IO utat választunk.'}]},
{sit:'Kiválasztod az IO szúrási pontot. Felnőtt újraélesztésnél az eljárásrend szerint melyik az ELSŐDLEGESEN választandó helyszín?',opts:[{tx:'A sternum (szegycsont).',ok:false,fb:'Hibás! Az EZ-IO rendszernél az OMSZ-nél a sternum nem játszik.'},{tx:'A proximalis humerus (váll).',ok:true,fb:'Helyes! Nagyobb a flow, gyorsabban jut a centrális keringésbe a gyógyszer, és kikerüli a hasi/medencei ereket.'}]},
{sit:'A beteg 50 kg-os felnőtt, lágyrészei a vállán átlagosak. Melyik EZ-IO tűt választod a proximalis humerus punkciójához az eljárásrend alapján?',opts:[{tx:'A 25 mm-es (kék) tűt, mert csak 50 kg.',ok:false,fb:'Hibás! A humerus anatómiája miatt felnőtteknél más a szabály.'},{tx:'A 45 mm-es (sárga) tűt. Felnőtteknél a proximalis humerushoz ez javasolt.',ok:true,fb:'Helyes! A felnőtt humerushoz a hosszú, 45 mm-es tű kell.'}]},
{sit:'Hogyan kell a karját pozicionálni a humerus fúrásához?',opts:[{tx:'Oldalra ki kell nyújtani (abductio) 90 fokban.',ok:false,fb:'Hibás! Így az anatómiai pontok eltolódnak, és a csont is.'},{tx:'A kart szorosan a test mellé kell helyezni, befelé rotálva (tenyér kifelé, hüvelykujj lefelé) VAGY a kart szorosan a hasára hajtva.',ok:true,fb:'Helyes! Ez hozza előre a humerus sebészi nyakát és a tuberculum majust.'}]},
{sit:'A szúrási pont (humerus) fertőtlenítve. Milyen szögben kell elvégezni a fúrást?',opts:[{tx:'A frontalis (vízszintes) síkhoz képest 45°-os szögben, posteromedialisan (a fej felől lefelé a lapocka alsó széle felé).',ok:true,fb:'Helyes! A humerus szúrásának ez a specifikus szöge.'},{tx:'Szigorúan 90 fokban (merőlegesen) a csont felszínére.',ok:false,fb:'Hibás! A tibia esetén 90 fok, a humerusnál 45 fok.'}]},
{sit:'A tű átszúrja a bőrt és a csont felszínéhez ér (még nem fúrtál). Mi a KÖTELEZŐ vizuális ellenőrzés fúrás előtt?',opts:[{tx:'Hogy a tű legalább a feléig bent van.',ok:false,fb:'Hibás! Ez nem egzakt.'},{tx:'Minden tű esetén ki kell látszódni legalább az utolsó 5 mm-es beosztásnak. Ha nem, hosszabb tű (vagy másik hely) kell.',ok:true,fb:'Helyes! Ez garantálja, hogy a tű biztonságosan a velőüregig érjen anélkül, hogy a kónusz a bőrt roncsolná.'}]},
{sit:'Fúrás közben az ellenállás hirtelen lecsökken (a medulláris térbe érsz). Mit teszel a fúróval (triggerrel)?',opts:[{tx:'Azonnal elengedem a ravaszt és leállítom a fúrást. Nem húzom vissza a fúrót a ravasz elengedésekor!',ok:true,fb:'Helyes! Az ellenállás csökkenése jelzi, hogy bent vagy. Tovább fúrni tilos, mert átszakíthatod a csontot.'},{tx:'Fúrok még 2 cm-t a biztonság kedvéért.',ok:false,fb:'Hibás! Ezzel átfúrod a csont túloldalát is.'}]},
{sit:'A fúró lecsatlakoztatva, a belső nyárs eltávolítva. Fecskendővel csontvelőt aspirálsz. Mi a KÖTELEZŐ eljárásrendi szabály az aspirált csontvelővel?',opts:[{tx:'Az aspirált csontvelőt NE nyomjuk vissza a csontba.',ok:true,fb:'Helyes! A csontvelőt nem szabad visszanyomni.'},{tx:'Gyorsan vissza kell fecskendezni a gyógyszerek előtt.',ok:false,fb:'Hibás! Szigorúan tilos.'}]},
{sit:'Sikeres ROSC (visszatér a keringés), de a beteg shockos. Megtartott a fájdalomérzete, és IO folyadékpótlást terveztek. Mivel lehet enyhíteni a velőüregi feszülés miatti hatalmas fájdalmat?',opts:[{tx:'Kizárólag iv. morfinnal.',ok:false,fb:'Hibás! Az eljárásrend specifikus IO fájdalomcsillapítást ír le.'},{tx:'Lidokain (1%-os) lokális adásával az IO katéterbe, nagyon LASSAN (2 perc alatt), a NaCl bemosás ELŐTT.',ok:true,fb:'Helyes! A Lidokain lokális fájdalomcsillapító a velőüregben, ha lassan adják, nem jut be egyből a véráramba.'}]},
{sit:'A Lidokain fájdalomcsillapítás lement. Mennyi 0,9%-os sóoldattal (NaCl) végzed az EZ-IO átöblítését (bemosását) felnőtt betegnél?',opts:[{tx:'2-5 ml-rel.',ok:false,fb:'Hibás! Ez a csecsemők/gyermekek bemosási volumene.'},{tx:'5-10 ml-rel.',ok:true,fb:'Helyes! Felnőttek esetén az IO kanült 5-10 ml fiziológiás sóoldattal kell nagy nyomással átöblíteni a mikrotrombusok és csonttörmelék eltávolítására.'}]}

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+i+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+s.t+'</div><div class="step-x">'+s.x+'</div></div></div>').join('');
  if(b.tp==='tbl'){
    return '<div class="tbl-wrap"><table class="tbl"><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:600;color:#f3f4f6">'+h(r[0])+'</td><td style="color:#e5e7eb">'+h(r[1])+'</td></tr>').join('')+'</tbody></table></div>';
  }
  if(b.tp==='ftable'){
    var lc={d:'#fca5a5',w:'#fde68a'};
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Paraméter / Hely</th><th>Jelentés / Megjegyzés</th></tr></thead><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:600;color:'+lc[r.lv]+'">'+h(r.s)+'</td><td style="color:#e5e7eb">'+r.m+'</td></tr>').join('')+'</tbody></table></div>';
  }
  return '';
}

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function calcIVFlow(g){
  let flows = { 24: 20, 22: 30, 20: 55, 18: 100, 16: 180, 14: 270 };
  let colors = { 24: "Sárga", 22: "Kék", 20: "Rózsaszín", 18: "Zöld", 16: "Szürke", 14: "Narancs" };
  let cc = { 24: "#eab308", 22: "#3b82f6", 20: "#f472b6", 18: "#22c55e", 16: "#9ca3af", 14: "#f97316" };
  return { flow: flows[g], color: colors[g], c: cc[g] };
}

function calcIOSize(w, l){
  if(l==='humerus') return { size: "45 mm", color: "Sárga" };
  if(w < 3) return { size: "15 mm", color: "Rózsaszín" };
  if(w >= 3 && w <= 39) return { size: "15 mm", color: "Rózsaszín" };
  if(w >= 40) return { size: "25 mm", color: "Kék" };
  return { size: "25 mm", color: "Kék" };
}

function calcLido(age, weight){
  if(age >= 18) {
    return "Felnőtt: 40 mg (4 ml) 2 perc alatt, 1 perc várakozás, majd öblítés után további 20 mg (2 ml).";
  } else {
    let mg = (0.5 * weight).toFixed(1);
    if(mg > 40) mg = 40.0;
    return "Gyermek: 0,5 mg/kg -> "+mg+" mg lassan (Max: 40 mg!).";
  }
}

// Separate functions to update only the result boxes so focus isn't lost on inputs
window.updIV = function(v){
    CA.gauge = parseInt(v);
    var ivData = calcIVFlow(CA.gauge);
    var box = document.getElementById('iv_res');
    if(box) {
        box.style.borderColor = ivData.c;
        box.innerHTML = '<div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Szín:</div><div style="font-size:24px;font-weight:700;color:'+ivData.c+';margin-bottom:1rem">'+ivData.color+'</div><div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Max Áramlási sebesség:</div><div style="font-size:32px;font-weight:700;color:#60a5fa">'+ivData.flow+' ml/min</div>';
    }
};

window.updIO = function(w, loc){
    if(w !== undefined) CA.weight = parseFloat(w)||0;
    if(loc !== undefined) CA.ioloc = loc;
    var ioData = calcIOSize(CA.weight, CA.ioloc);
    var box = document.getElementById('io_res');
    if(box) {
        box.innerHTML = '<div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Javasolt Tűméret:</div><div style="font-size:32px;font-weight:700;color:#60a5fa;margin-bottom:1rem">'+ioData.size+' ('+ioData.color+')</div><div style="font-size:11px;color:#9ca3af">A végső döntés mindig a lágyrész-vastagságtól függ! (Befúrás előtt legalább az utolsó 5 mm-es beosztásnak látszódnia kell!)</div>';
    }
};

window.updLido = function(a, w){
    if(a !== undefined) CA.age = parseInt(a)||0;
    if(w !== undefined) CA.weight = parseFloat(w)||0;
    var ld = calcLido(CA.age, CA.weight);
    var box = document.getElementById('lido_res');
    if(box) {
        box.innerHTML = '<div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Lidokain (1%) Dózis IO:</div><div style="font-size:16px;font-weight:700;color:#a78bfa;line-height:1.5">'+ld+'</div><div style="font-size:11px;color:#9ca3af;margin-top:10px">Csak megtartott tudatnál, hemodinamikai shock esetén az IO feszülés ellen. Lassú adás (1-2 perc alatt)!</div>';
    }
};

function renderCalc(){
function tabBtn(id,lbl){return '<button onclick="setCalcTab(\''+id+'\')" style="flex:1;padding:.5rem;border:1px solid '+(CA.tab===id?'#3b82f6':'#3f3f3f')+';border-radius:8px;background:'+(CA.tab===id?'#3b82f6':'#2a2a2a')+';color:'+(CA.tab===id?'#111827':'#d1d5db')+';cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">'+lbl+'</button>';}

if(CA.tab==='iv'){
  var ivData = calcIVFlow(CA.gauge);
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
'<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tabBtn('iv','PVB Flow')+tabBtn('io','IO Tű')+tabBtn('lido','IO Fájdalom')+'</div>'+
'<div class="card">'+
'<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Kanül mérete (Gauge)</div>'+
'<select onchange="updIV(this.value)">'+
[24,22,20,18,16,14].map(g=>'<option value="'+g+'" '+(CA.gauge==g?'selected':'')+'>'+g+'G</option>').join('')+
'</select>'+
'<div id="iv_res" class="res-box" style="background:#1e1e1e;border:1px solid '+ivData.c+'">'+
'<div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Szín:</div><div style="font-size:24px;font-weight:700;color:'+ivData.c+';margin-bottom:1rem">'+ivData.color+'</div>'+
'<div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Max Áramlási sebesség:</div><div style="font-size:32px;font-weight:700;color:#60a5fa">'+ivData.flow+' ml/min</div>'+
'</div></div>';
}

if(CA.tab==='io'){
  var ioData = calcIOSize(CA.weight, CA.ioloc);
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
'<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tabBtn('iv','PVB Flow')+tabBtn('io','IO Tű')+tabBtn('lido','IO Fájdalom')+'</div>'+
'<div class="card">'+
'<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Beteg testsúlya (kg)</div>'+
'<input type="number" min="1" max="200" value="'+CA.weight+'" oninput="updIO(this.value, undefined)">'+
'<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-top:10px;margin-bottom:6px">Szúrási pont</div>'+
'<select onchange="updIO(undefined, this.value)">'+
'<option value="tibia" '+(CA.ioloc=='tibia'?'selected':'')+'>Tibia (vagy Femur)</option>'+
'<option value="humerus" '+(CA.ioloc=='humerus'?'selected':'')+'>Proximalis Humerus (Felnőtt)</option>'+
'</select>'+
'<div id="io_res" class="res-box" style="background:#1e1e1e;border:1px solid #3b82f6;margin-top:1rem">'+
'<div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Javasolt Tűméret:</div><div style="font-size:32px;font-weight:700;color:#60a5fa;margin-bottom:1rem">'+ioData.size+' ('+ioData.color+')</div>'+
'<div style="font-size:11px;color:#9ca3af">A végső döntés mindig a lágyrész-vastagságtól függ! (Befúrás előtt legalább az utolsó 5 mm-es beosztásnak látszódnia kell!)</div>'+
'</div></div>';
}

if(CA.tab==='lido'){
  var ld = calcLido(CA.age, CA.weight);
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
'<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tabBtn('iv','PVB Flow')+tabBtn('io','IO Tű')+tabBtn('lido','IO Fájdalom')+'</div>'+
'<div class="card">'+
'<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Életkor (év)</div>'+
'<input type="number" min="0" max="120" value="'+CA.age+'" oninput="updLido(this.value, undefined)">'+
'<div style="font-size:13px;font-weight:600;color:#9ca3af;margin-top:10px;margin-bottom:6px">Testsúly (kg)</div>'+
'<input type="number" min="1" max="200" value="'+CA.weight+'" oninput="updLido(undefined, this.value)">'+
'<div id="lido_res" class="res-box" style="background:#1e1e1e;border:1px solid #7c3aed;margin-top:1rem">'+
'<div style="font-size:14px;color:#e5e7eb;margin-bottom:4px">Lidokain (1%) Dózis IO:</div><div style="font-size:16px;font-weight:700;color:#a78bfa;line-height:1.5">'+ld+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:10px">Csak megtartott tudatnál, hemodinamikai shock esetén az IO feszülés ellen. Lassú adás (1-2 perc alatt)!</div>'+
'</div></div>';
}

}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcTab=function(t){CA.tab=t;render();};

render();
</script>
