<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ – Lehűlésvédelem Eljárásrend</title>
<style>
:root {
  --bg-main: #121212;
  --bg-card: #1e1e1e;
  --bg-item: #2a2a2a;
  --bg-hover: #333333;
  --border: #3f3f3f;
  --text-main: #e5e7eb;
  --text-dim: #9ca3af;
  --primary: #14b8a6;
  --primary-hover: #0d9488;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  padding-bottom: 72px;
}
.app {
  max-width: 700px;
  margin: 0 auto;
  background: var(--bg-card);
  min-height: 100vh;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  position: relative;
}

/* NAVIGATION */
.nav {
  display: flex;
  background: #242424;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 6px rgba(0,0,0,0.4);
}
.nb {
  flex: 1;
  padding: 10px 2px 8px;
  background: none;
  border: none;
  border-top: 3px solid transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}
.nb.act { border-top-color: var(--primary); background: rgba(20, 184, 166, 0.05); }
.ni { font-size: 18px; }
.nl { font-size: 10px; color: var(--text-dim); font-weight: 500; }
.nb.act .nl { color: var(--primary); font-weight: 700; }

/* CONTENT AREA */
.ct { padding: 1.25rem; }

/* TYPOGRAPHY & BLOCKS */
h1, h2, h3 { color: #f3f4f6; margin-bottom: 0.75rem; line-height: 1.3; }
h1 { font-size: 22px; font-weight: 800; }
h2 { font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
h3 { font-size: 15px; font-weight: 700; color: var(--primary); margin-top: 1rem; }
p { font-size: 14px; line-height: 1.6; margin-bottom: 0.75rem; color: #d1d5db; }

ul.bl { margin: 0 0 1rem 0; padding-left: 1.5rem; }
ul.bl li { font-size: 14px; color: #d1d5db; line-height: 1.6; margin-bottom: 0.4rem; }

.card {
  background: var(--bg-item);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1rem;
}
.card-btn {
  background: var(--bg-item);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 0.5rem;
  cursor: pointer;
  text-align: left;
  width: 100%;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-btn:hover { background: var(--bg-hover); border-color: #4b5563; }
.card-btn:active { transform: translateY(1px); }

/* ALERTS */
.al {
  border-radius: 8px;
  padding: 0.85rem 1rem;
  margin-bottom: 1rem;
  font-size: 14px;
  line-height: 1.6;
}
.al-d { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; border-left: 4px solid #ef4444; }
.al-w { background: #451a03; color: #fde68a; border: 1px solid #78350f; border-left: 4px solid #f59e0b; }
.al-i { background: #172554; color: #bfdbfe; border: 1px solid #1e3a8a; border-left: 4px solid #3b82f6; }
.al-s { background: #064e3b; color: #bbf7d0; border: 1px solid #065f46; border-left: 4px solid #10b981; }

/* BUTTONS */
.btn {
  padding: 0.75rem 1rem;
  border: 1px solid #4b5563;
  border-radius: 8px;
  background: var(--bg-item);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  font-family: inherit;
  transition: all 0.15s;
}
.btn:hover { background: var(--bg-hover); }
.btn-fw { width: 100%; display: block; text-align: center; margin-bottom: 0.5rem; }
.btn-g { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-g:hover { background: var(--primary-hover); }
.btn-r { background: var(--danger); color: #fff; border-color: #b91c1c; }
.btn-r:hover { background: #b91c1c; }

/* GLOSSARY TOOLTIP */
.glo {
  color: var(--primary);
  text-decoration: underline;
  text-decoration-style: dotted;
  cursor: pointer;
  font-weight: 600;
  padding: 0 2px;
  border-radius: 3px;
  transition: background 0.2s;
}
.glo:hover { background: rgba(20, 184, 166, 0.2); }

#modal-backdrop {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(2px);
}
#modal-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 90%;
  max-width: 400px;
  padding: 1.5rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  position: relative;
}
.modal-close {
  position: absolute;
  top: 10px; right: 15px;
  font-size: 24px;
  color: var(--text-dim);
  cursor: pointer;
  border: none;
  background: none;
}
.modal-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 10px; text-transform: capitalize; }
.modal-text { font-size: 14px; color: var(--text-main); line-height: 1.6; }

/* QUIZ & SIM OPTIONS */
.opt {
  width: 100%;
  display: block;
  padding: 1rem;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  color: #d1d5db;
  background: var(--bg-item);
  font-family: inherit;
  line-height: 1.5;
  transition: background 0.1s, border-color 0.1s;
}
.opt:hover { background: #374151; border-color: #6b7280; }
.opt-ok { background: #064e3b !important; border-color: #059669 !important; color: #ecfdf5 !important; cursor: default !important; }
.opt-no { background: #7f1d1d !important; border-color: #b91c1c !important; color: #fef2f2 !important; cursor: default !important; }

/* PROGRESS */
.prog { height: 6px; background: #333; border-radius: 3px; margin-bottom: 1.25rem; overflow: hidden; }
.progb { height: 100%; border-radius: 3px; transition: width 0.3s ease; }

/* FLASHCARDS */
.flip {
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  margin-bottom: 1rem;
  background: #262626;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
}
.flip.on {
  border-color: #a78bfa;
  background: #2e1065;
}

.tag { display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: 700; }
.tag-g { background: #064e3b; color: #ecfdf5; border: 1px solid #059669; }
.tag-y { background: #78350f; color: #fef3c7; border: 1px solid #d97706; }
.tag-b { background: #1e3a8a; color: #dbeafe; border: 1px solid #3b82f6; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media(max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>

// Replace text with glossary links, taking care of tags
function renderText(str) {
  let safeStr = String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let keys = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length); // match longest first
  keys.forEach(k => {
    let regex = new RegExp('\\b(' + k + ')\\b', 'gi');
    safeStr = safeStr.replace(regex, '<span class="glo" onclick="openModal(\'$1\')">$&</span>');
  });
  return safeStr;
}

function openModal(word) {
  let key = word.toLowerCase();
  let text = GLOSSARY[key] || 'Nincs adat.';
  document.getElementById('m-title').innerText = word;
  document.getElementById('m-text').innerText = text;
  document.getElementById('modal-backdrop').style.display = 'flex';
}

function closeModal(e, force) {
  if (force || e.target.id === 'modal-backdrop') {
    document.getElementById('modal-backdrop').style.display = 'none';
  }
}

        { tx: 'A fólia egyszer használatos eszköz. Nem emelem ki belőle a beteget, a beteggel (és a fóliával) együtt adom át a kórházi személyzetnek.', ok: true, fb: 'Helyes! Ezzel elkerüljük az újabb hőveszteséget az átadás alatt.' }
      ]},
      { sit: 'Mi az eljárásrend elsődleges célja, amit ezzel az ellátással teljesítettél?', opts: [
        { tx: 'A maghőmérséklet 37°C-ra való aktív felmelegítése a helyszínen.', ok: false, fb: 'Hibás! A prehospitalis szak nem az aktív felmelegítésről szól, hanem a védelemről.' },
        { tx: 'A további lehűlés megakadályozása, és a hypothermia okozta káros élettani hatások megelőzése/kivédése.', ok: true, fb: 'Helyes! A "lehűlésvédelem" (és nem felmelegítés) a prehospitális cél.' }
      ]}
    ],
    summary: 'Összefoglaló (Nem traumás hypothermia): A kiérkezéskor megállapítottuk, hogy a 18°C-os hőmérséklet és az akut immobilitás elég indikáció a lehűlésvédelemhez (30°C alatt minden kritikus beteg veszélyeztetett). A vizes, szennyezett ruhát azonnal eltávolítottuk, a testet szárazra töröltük. Nem traumás esetben nem használtunk lapáthordágyat, hanem a beteget közvetlenül az izolációs buborékfóliába helyeztük. A melegítőpárnákat a fólián BELÜLRE tettük, majd a fóliát a beteg felett összefogva szorosan betekertük (arc szabadon). Hagyományos takarókkal betakartuk KÍVÜLRŐL. Hideg/szobahőmérsékletű infúzió adása (főleg B kompetenciával és hypothermiában) SZIGORÚAN TILOS volt. A kábeleket a nyaknál vezettük ki. A kórházban a beteget a fóliában hagyva, fóliával együtt adtuk át, mivel az egyszer használatos. Célunk a további hőveszteség megakadályozása volt.'
  }
];

// --- RENDER FUNCTIONS ---
function h(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderBlock(b) {
  if (b.type === 'p') return '<p>' + renderText(b.tx) + '</p>';
  if (b.type === 'ul') return '<ul class="bl">' + b.items.map(i => '<li>' + renderText(i) + '</li>').join('') + '</ul>';
  if (b.type === 'al') return '<div class="al ' + b.cl + '">' + renderText(b.tx) + '</div>';
  if (b.type === 'step') return '<div style="display:flex;gap:12px;margin-bottom:12px;background:#262626;padding:12px;border-radius:8px;"><div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + b.n + '</div><div style="font-size:14px;line-height:1.5;color:#e5e7eb">' + renderText(b.tx) + '</div></div>';
  return '';
}

function renderHome() {
  return `
    <div style="margin-bottom:1.5rem">
      <div style="font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Országos Mentőszolgálat</div>
      <h1>Lehűlésvédelem Szabványos Eljárásrend</h1>
      <p style="font-size:13px;color:var(--text-dim)">Kiadás: 2014.02.06. · Visszavonásig érvényes</p>
    </div>
    
    <div class="grid" style="margin-bottom:1rem">
      <button class="card-btn" onclick="go('chapters')">
        <div style="font-size:24px">📚</div>
        <div><div style="font-size:15px;font-weight:700">Eljárásrend</div><div style="font-size:12px;color:var(--text-dim)">A protokoll teljes szövege</div></div>
      </button>
      <button class="card-btn" onclick="go('flash')">
        <div style="font-size:24px">🃏</div>
        <div><div style="font-size:15px;font-weight:700">Flashkártyák</div><div style="font-size:12px;color:var(--text-dim)">${CARDS.length} kártya a tanuláshoz</div></div>
      </button>
      <button class="card-btn" onclick="go('quiz')">
        <div style="font-size:24px">❓</div>
        <div><div style="font-size:15px;font-weight:700">Kvíz</div><div style="font-size:12px;color:var(--text-dim)">${QUIZ.length} kérdés, azonnali kiértékelés</div></div>
      </button>
      <button class="card-btn" onclick="go('sim')">
        <div style="font-size:24px">🚑</div>
        <div><div style="font-size:15px;font-weight:700">Szimuláció</div><div style="font-size:12px;color:var(--text-dim)">${SIMS.length} klinikai eset feldolgozása</div></div>
      </button>
    </div>
    <div class="al al-s" style="font-size:13px">
      <strong>Vonatkozik:</strong> Az Országos Mentőszolgálat valamennyi mentőegységére.
    </div>
  `;
}

function renderChapters() {
  let html = '<h2>Eljárásrend (Tananyag)</h2>';
  PROTOCOL_DATA.forEach(c => {
    html += `
      <button class="card-btn" style="margin-bottom:10px" onclick="go('chapter', '${c.id}')">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(20,184,166,0.1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${c.icon}</div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:700;color:#f3f4f6">${h(c.title)}</div>
          <div style="font-size:12px;color:var(--text-dim)">${c.sections.length} szakasz</div>
        </div>
        <div style="color:var(--text-dim);font-size:20px;font-weight:bold">›</div>
      </button>
    `;
  });
  return html;
}

function renderChapter(id) {
  const c = PROTOCOL_DATA.find(x => x.id === id);
  if (!c) return '';
  let html = `
    <button onclick="go('chapters')" style="background:none;border:none;cursor:pointer;color:var(--primary);font-size:14px;margin-bottom:1rem;font-weight:700">‹ Vissza</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem">
      <div style="width:46px;height:46px;border-radius:12px;background:rgba(20,184,166,0.15);display:flex;align-items:center;justify-content:center;font-size:24px">${c.icon}</div>
      <h2 style="border:none;margin:0;font-size:20px">${h(c.title)}</h2>
    </div>
  `;
  c.sections.forEach(s => {
    html += `<div class="card"><h3>${h(s.t)}</h3>`;
    s.c.forEach(b => { html += renderBlock(b); });
    html += `</div>`;
  });
  return html;
}

function renderFlash() {
  const card = CARDS[FC.idx];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h2 style="margin:0;border:none">Flashkártyák</h2>
      <span style="font-size:13px;color:var(--text-dim);font-weight:600">${FC.idx + 1} / ${CARDS.length}</span>
    </div>
    <div class="flip ${FC.flip ? 'on' : ''}" onclick="flipCard()">
      ${FC.flip ? 
        `<div style="font-size:11px;font-weight:800;color:#c4b5fd;text-transform:uppercase;letter-spacing:1px;margin-bottom:15px">Válasz</div>
         <div style="font-size:15px;color:#d1d5db;line-height:1.6;white-space:pre-line">${renderText(card.b)}</div>` : 
        `<div style="font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:15px">Kérdés</div>
         <div style="font-size:17px;font-weight:700;color:#f3f4f6;line-height:1.5">${renderText(card.f)}</div>
         <div style="font-size:12px;color:var(--text-dim);margin-top:20px">Kattints a kártyára a fordításhoz ↺</div>`
      }
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" style="flex:1" onclick="navCard(-1)">‹ Előző</button>
      <button class="btn btn-g" style="flex:1" onclick="flipCard()">Fordít</button>
      <button class="btn" style="flex:1" onclick="navCard(1)">Következő ›</button>
    </div>
  `;
}

function renderQuiz() {
  if (QZ.done) {
    const pct = Math.round(QZ.score / QUIZ.length * 100);
    const good = pct >= 80;
    let html = `
      <h2>Kvíz eredmény</h2>
      <div style="background:${good ? '#064e3b' : '#451a03'};border:1px solid ${good ? '#065f46' : '#78350f'};border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1.5rem">
        <div style="font-size:48px;font-weight:800;color:${good ? '#4ade80' : '#fde68a'}">${QZ.score} / ${QUIZ.length}</div>
        <div style="font-size:16px;font-weight:700;color:${good ? '#4ade80' : '#fde68a'};margin-top:8px">${pct}% – ${good ? 'Kiváló!' : 'Próbáld újra!'}</div>
      </div>
    `;
    const wrong = QZ.ans.filter(a => !a.ok);
    if (wrong.length > 0) {
      html += `<h3 style="margin-bottom:10px;color:#f3f4f6">Helytelen válaszok:</h3>`;
      wrong.forEach(a => {
        const q = QUIZ[a.qi];
        html += `
          <div class="card" style="border-left:4px solid var(--danger)">
            <div style="font-size:14px;font-weight:700;margin-bottom:8px">${renderText(q.q)}</div>
            <div style="font-size:13px;color:#fca5a5;margin-bottom:4px;line-height:1.4">✗ Válasz: ${renderText(q.opts[a.pi])}</div>
            <div style="font-size:13px;color:#4ade80;margin-bottom:8px;line-height:1.4">✓ Helyes: ${renderText(q.opts[q.ok])}</div>
            <div style="font-size:12px;color:var(--text-dim);background:#262626;padding:8px;border-radius:6px;line-height:1.4">${renderText(q.exp)}</div>
          </div>
        `;
      });
    } else {
      html += `<div class="al al-s">Tökéletes! Minden kérdésre helyesen válaszoltál.</div>`;
    }
    html += `<button class="btn btn-g btn-fw" onclick="resetQuiz()">Kvíz Újraindítása</button>`;
    return html;
  }

  const q = QUIZ[QZ.idx];
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="border:none;margin:0">Kvíz</h2>
      <span style="font-size:13px;color:var(--text-dim);font-weight:600">${QZ.idx + 1} / ${QUIZ.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((QZ.idx + 1) / QUIZ.length) * 100}%;background:var(--primary)"></div></div>
    
    <div class="card" style="background:#262626">
      <p style="font-size:16px;font-weight:700;color:#f3f4f6;margin:0">${renderText(q.q)}</p>
    </div>
  `;
  
  q.opts.forEach((opt, i) => {
    let cls = 'opt';
    if (QZ.sel !== null) {
      if (i === q.ok) cls += ' opt-ok';
      else if (i === QZ.sel) cls += ' opt-no';
    }
    html += `<button class="${cls}" ${QZ.sel === null ? `onclick="pickQ(${i})"` : ''}>${renderText(opt)}</button>`;
  });

  if (QZ.sel !== null) {
    html += `
      <div class="al al-i" style="margin-top:1rem">${renderText(q.exp)}</div>
      <button class="btn btn-g btn-fw" onclick="nextQ()">${QZ.idx < QUIZ.length - 1 ? 'Következő Kérdés →' : 'Eredmény Mutatása'}</button>
    `;
  }
  return html;
}

function renderSim() {
  if (!SI.id) {
    let html = `<h2>Klinikai Szimulációk</h2>
      <div class="al al-w">Válaszd ki a szituációt! A döntési pontok a prehospitális lehűlésvédelem eljárásrendjének lépésein vezetnek végig.</div>`;
    SIMS.forEach(s => {
      html += `
        <button class="card-btn" style="display:block" onclick="startSim(${s.id})">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div style="font-size:16px;font-weight:700;color:#f3f4f6">${h(s.title)}</div>
            <span class="tag ${s.diff.includes('+') ? 'tag-g' : 'tag-b'}">${h(s.diff)}</span>
          </div>
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px;line-height:1.4">${h(s.desc)}</div>
          <div style="font-size:12px;color:var(--primary);font-weight:600">${s.steps.length} döntési pont</div>
        </button>
      `;
    });
    return html;
  }

  const sim = SIMS.find(s => s.id === SI.id);
  
  if (SI.fin) {
    const correct = SI.hist.filter(h => sim.steps[h.step].opts[h.oi].ok).length;
    let html = `
      <h2>${h(sim.title)} – Értékelés</h2>
      <div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1.5rem">
        <div style="font-size:42px;font-weight:800;color:#4ade80">${correct} / ${sim.steps.length}</div>
        <div style="font-size:14px;color:#4ade80;font-weight:700;margin-top:5px">Helyes Döntés</div>
      </div>
      <div class="card" style="border-left:4px solid var(--primary);background:rgba(20,184,166,0.05)">
        <h3 style="margin-top:0;margin-bottom:10px">Részletes Összefoglaló</h3>
        <p style="margin:0;line-height:1.6">${renderText(sim.summary)}</p>
      </div>
      <h3 style="color:#f3f4f6;margin-bottom:10px">Lépéseid:</h3>
    `;
    SI.hist.forEach((hh, i) => {
      const st = sim.steps[hh.step];
      const opt = st.opts[hh.oi];
      html += `
        <div class="card" style="margin-bottom:8px;padding:12px">
          <div style="font-size:13px;font-weight:700;color:#f3f4f6;margin-bottom:6px">${i+1}. ${renderText(st.sit)}</div>
          <div style="font-size:13px;font-weight:600;margin-bottom:4px;color:${opt.ok ? '#4ade80' : '#fca5a5'}">${opt.ok ? '✓' : '✗'} ${renderText(opt.tx)}</div>
          <div style="font-size:12px;color:var(--text-dim);line-height:1.4">${renderText(opt.fb)}</div>
        </div>
      `;
    });
    html += `<button class="btn btn-fw" style="margin-top:15px;background:#374151" onclick="resetSim()">Vissza a szimulációkhoz</button>`;
    return html;
  }

  const step = sim.steps[SI.step];
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:14px;font-weight:700;color:var(--primary)">${h(sim.title)}</div>
      <span style="font-size:13px;color:var(--text-dim);font-weight:600">${SI.step + 1} / ${sim.steps.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((SI.step + 1) / sim.steps.length) * 100}%;background:var(--warning)"></div></div>
    
    ${SI.step === 0 ? `<div class="al al-i" style="font-size:13px">${renderText(sim.desc)}</div>` : ''}
    
    <div class="card" style="background:#262626;border-color:#4b5563">
      <p style="font-size:16px;font-weight:700;color:#f3f4f6;line-height:1.5;margin:0">${renderText(step.sit)}</p>
    </div>
  `;
  
  step.opts.forEach((opt, i) => {
    let cls = 'opt';
    if (SI.chosen !== null) {
      if (opt.ok) cls += ' opt-ok';
      else if (i === SI.chosen) cls += ' opt-no';
    }
    html += `<button class="${cls}" style="font-size:15px" ${SI.chosen === null ? `onclick="chooseSim(${i})"` : ''}>${renderText(opt.tx)}</button>`;
  });

  if (SI.chosen !== null) {
    const isOk = step.opts[SI.chosen].ok;
    html += `
      <div class="al ${isOk ? 'al-s' : 'al-d'}" style="margin-top:1rem">${renderText(step.opts[SI.chosen].fb)}</div>
      <button class="btn btn-g btn-fw" onclick="nextSim()">${SI.step < sim.steps.length - 1 ? 'Következő Lépés →' : 'Értékelés Mutatása'}</button>
    `;
  }
  return html;
}

function render() {
  const c = document.getElementById('ct');
  c.innerHTML = '';
  if (SCR === 'home') c.innerHTML = renderHome();
  else if (SCR === 'chapters') c.innerHTML = renderChapters();
  else if (SCR === 'chapter') c.innerHTML = renderChapter(CHID);
  else if (SCR === 'flash') c.innerHTML = renderFlash();
  else if (SCR === 'quiz') c.innerHTML = renderQuiz();
  else if (SCR === 'sim') c.innerHTML = renderSim();
  
  const tabs = ['home', 'chapters', 'flash', 'quiz', 'sim'];
  const active = SCR === 'chapter' ? 'chapters' : SCR;
  document.querySelectorAll('.nb').forEach((b, i) => {
    if(tabs[i]) {
      b.classList.toggle('act', tabs[i] === active);
    }
  });
  window.scrollTo(0, 0);
}

// --- CONTROLLERS ---
window.go = function(s, id) { SCR = s; CHID = id || null; render(); };

// Flashcards
window.flipCard = function() { FC.flip = !FC.flip; render(); };
window.navCard = function(dir) {
  FC.flip = false;
  FC.idx = (FC.idx + dir + CARDS.length) % CARDS.length;
  render();
};

// Quiz
window.pickQ = function(i) {
  if (QZ.sel !== null) return;
  QZ.sel = i;
  const isOk = i === QUIZ[QZ.idx].ok;
  if (isOk) QZ.score++;
  QZ.ans.push({ qi: QZ.idx, pi: i, ok: isOk });
  render();
};
window.nextQ = function() {
  if (QZ.idx < QUIZ.length - 1) {
    QZ.idx++;
    QZ.sel = null;
  } else {
    QZ.done = true;
  }
  render();
};
window.resetQuiz = function() {
  QZ = { idx: 0, sel: null, score: 0, done: false, ans: [] };
  render();
};

// Sim
window.startSim = function(id) {
  SI.id = id; SI.step = 0; SI.chosen = null; SI.hist = []; SI.fin = false;
  render();
};
window.chooseSim = function(i) {
  if (SI.chosen !== null) return;
  SI.chosen = i;
  SI.hist.push({ step: SI.step, oi: i });
  render();
};
window.nextSim = function() {
  const sim = SIMS.find(s => s.id === SI.id);
  if (SI.step < sim.steps.length - 1) {
    SI.step++;
    SI.chosen = null;
  } else {
    SI.fin = true;
  }
  render();
};
window.resetSim = function() {
  SI = { id: null, step: 0, chosen: null, hist: [], fin: false };
  render();
};

// Start
render();
</script>
</body>
</html>
