function calcIBW(h, isMale){
    // Ideal Body Weight estimation
    // Approx based on the provided table: 6ml/kg -> e.g. male 180cm -> 450ml -> 75kg
    // Male: 50 + 0.91 * (height - 152.4)
    // Female: 45.5 + 0.91 * (height - 152.4)
    var m = isMale ? 50 : 45.5;
    var w = m + 0.91 * (h - 152.4);
    return Math.round(w);
}

'<div class="card"><div class="sub">Ideális testsúly és Légzési Térfogat (VT) felnőtteknél</div>'+

'<div style="margin-bottom:10px;"><label style="font-size:12px;color:#9ca3af;">Magasság (cm)</label><input type="number" min="140" max="210" value="'+CA.h+'" onchange="CA.h=this.value;render()"></div>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:8px;padding:1rem;margin-top:10px;">'+
'<div style="font-size:13px;color:#bbf7d0;">Számított Ideális Testsúly: <b style="font-size:16px;">~'+ibw+' kg</b></div>'+
'<div style="font-size:13px;color:#bbf7d0;">Légzési térfogat cél (6-8 ml/ttkg): <b style="font-size:20px;color:#fff;">'+vtMin+' - '+vtMax+' ml</b></div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:5px;">Az eljárásrend alapján az asztmás roham miatti gépi lélegeztetésnél a magasságból számolt ideális testtömegre kell vetíteni a VT-t.</div>'+
'</div></div>'
:
'<div class="card"><div class="sub">Gyógyszeradagoló (Gyermek)</div>'+
'<div style="margin-bottom:10px;"><label style="font-size:12px;color:#9ca3af;">Testsúly (kg)</label><input type="number" min="3" max="50" value="'+CA.w+'" onchange="CA.w=this.value;CA.mode=\'child\';render()"></div>'+
'<div style="background:#451a03;border:1px solid #78350f;border-radius:8px;padding:1rem;margin-top:10px;">'+
'<div style="font-size:14px;color:#fde68a;font-weight:600;margin-bottom:8px">Számított Dózisok:</div>'+
'<div style="font-size:13px;color:#fff;margin-bottom:4px">MgSO4 (50 mg/ttkg): <b style="color:#4ade80">'+pedMg+' mg</b> (Max. 2g!)</div>'+
'<div style="font-size:13px;color:#fff;margin-bottom:4px">Metilprednizolon iv. (1-2 mg/ttkg): <b style="color:#4ade80">'+pedSter+' - '+pedSter2+' mg</b></div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:8px;">A rectalisan alkalmazott szteroid (Prednizon) adagja fix 30 mg p.r.<br>Az MgSO4 csak 2 éves kor felett adható!</div>'+
'</div></div>'
);
}

// Inicializálás
var CA = {tab:'vent', mode:'adult', g:'m', h:180, w:15};

function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Akut Asztmás Roham</h1>'+
'<div style="font-size:13px;color:#9ca3af">Prehospitális Ellátás · Szabványos Eljárásrend v2.0</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Eljárásrend','A teljes protokoll pontjai'],['flash','🃏','Kártyák','Gyors tudásteszt'],['quiz','❓','Kvíz','Ellenőrző kérdések'],['sim','🚑','Szimuláció','B / B+ Esetek'],['calc','🧮','Kalkulátorok','Dózisok & Beállítások']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="al al-s"><strong>Jelmagyarázat:</strong> A <span class="fw">szaggatott</span> vonallal aláhúzott szavakra kattintva megnyílik a kifejezés magyarázata.</div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Eljárásrend</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+c.title+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){
var c=CDATA.find(x=>x.id===id);if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+c.title+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+s.t+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');
}

function rb(b){
  if(b.tp==='p') return '<p style="font-size:13px;line-height:1.6;margin-bottom:10px;">'+b.tx+'</p>';
  if(b.tp==='sub') return '<div class="sub">'+b.tx+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div style="display:flex;gap:10px;margin-bottom:10px;"><div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#14b8a6;color:#111827;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">'+s.n+'</div><div style="flex:1;background:#262626;border-radius:8px;padding:.5rem .75rem;"><div style="font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:.2rem;">'+s.t+'</div><div style="font-size:12px;color:#9ca3af;line-height:1.6;white-space:pre-line;">'+s.x+'</div></div></div>').join('');
  if(b.tp==='ftable'){
    var lc={d:'#fca5a5',w:'#fde68a'};
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategória</th><th>Tünetek / Jelek</th></tr></thead><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:600;color:'+lc[r.lv]+'">'+r.s+'</td><td style="color:#e5e7eb;white-space:pre-line">'+r.m+'</td></tr>').join('')+'</tbody></table></div>';
  }
  return '';
}

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Kártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+c+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+c+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+card.b+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+card.cat+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+card.f+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+q.q+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+opt+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+q.exp+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+s.title+'</div>'+
'<span class="tag '+(s.diff.includes('B+')?'tag-y':'tag-g')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+s.desc+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+sim.title+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Részletes Összefoglaló:</strong><br>'+sim.summary+'</div>'+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+sim.title+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+step.sit+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+opt.tx+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+step.opts[SI.chosen].fb+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// Interakciók
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcTab=function(t){CA.tab=t;render();};

render();
</script>
</body>
</html>
