var SIMS = [
{id:1,title:'1. Szimuláció: Gyengeség és veseelégtelenség (B kompetencia)',diff:'B kompetencia',desc:'Egy 65 éves férfihez riasztanak, aki "nagyon gyenge, nem tud lábra állni". B kompetenciaszint (szakképzett mentőápoló, gyógyszerezés nélkül). A felesége elmondja, hogy heti 3x dialízisre jár, de az utolsó két alkalommal nem volt, mert náthás volt.',steps:[
{sit:'Megérkezel a beteghez. A helyszín biztonságos. Mi az első teendőd az ABCD szerint?',opts:[{tx:'Azonnal pulzust mérek és beteszem a mentőbe.',ok:false,fb:'Hibás! A betegvizsgálatot szisztematikusan az A (légút) ponttól kell kezdeni.'},{tx:'Megszólítom a beteget (AVPU), hogy felmérjem a tudatállapotát és a reakcióképességét.',ok:true,fb:'Helyes! Az első benyomás és az AVPU a betegvizsgálat első lépése.'},{tx:'Azonnal vénát biztosítok.',ok:false,fb:'Hibás! B kompetenciaszinten nem végzel vénabiztosítást, és különben is az első benyomás az első.'}]},
{sit:'A beteg éber (A), de nagyon fáradtnak tűnik. Légútja szabad (A), légzése nyugodt (B), pulzusa tapintható, de kissé lassú (C). Milyen célzott eszközt kötelező használni a C vizsgálattal párhuzamosan mellkasi/ritmus panasz, vagy hajlamosító tényező (vesebetegség) esetén?',opts:[{tx:'Vérnyomásmérőt, de EKG-t nem.',ok:false,fb:'Hibás! A rizikó miatt az EKG elengedhetetlen.'},{tx:'EKG monitorozás és 12 elvezetéses EKG készítése.',ok:true,fb:'Helyes! A veseelégtelenség és a panaszok miatt azonnali EKG monitorozás szükséges.'},{tx:'Defibrillátor azonnali feltöltése.',ok:false,fb:'Hibás! A betegnek van megtartott keringése.'}]},
{sit:'Az EKG-n 55/perc körüli szívfrekvenciát és feltűnően csúcsos, sátorszerű T-hullámokat látsz, de a QRS még nem széles. B kompetenciaszinten (mentőápoló) mi a kötelező lépés EKG eltérés és hyperkalaemia gyanúja esetén?',opts:[{tx:'Transztelefonikus EKG konzultáció elvégzése.',ok:true,fb:'Helyes! BLS/B szinten kötelező az EKG konzultáció az orvossal/mentőtiszttel.'},{tx:'Kálcium tabletta beadása a betegnek szájon át.',ok:false,fb:'Hibás! Per os kálcium itt nem hatásos, az időablak kritikus.'},{tx:'Infúzió bekötése.',ok:false,fb:'Hibás! B kompetenciával nem köthetsz infúziót.'}]},
{sit:'Az anamnézis felvételekor (SAMPLE) mit kell különösen vizsgálni a hyperkalaemia felismeréséhez?',opts:[{tx:'Hogy mikor evett utoljára édességet.',ok:false,fb:'Hibás! Bár étkezés fontos, itt a specifikus rizikók az elsődlegesek.'},{tx:'Hajlamosító tényezők felmérése: vesebetegség (igazolt), szedett gyógyszerek (pl. vízhajtók, vérnyomáscsökkentők).',ok:true,fb:'Helyes! A rizikófaktorok felmérése és rögzítése kulcsfontosságú.'},{tx:'Kizárólag az allergiát.',ok:false,fb:'Hibás! A gyógyszerek és az alapbetegség itt a vezető nyom.'}]},
{sit:'A feleség megmutatja a gyógyszereket: a beteg egy ACE-gátlót (ACEI) és egy káliummegtartó vízhajtót (MRA) is szed. Hogyan befolyásolja ez a hyperkalaemia rizikóját?',opts:[{tx:'Ezek a gyógyszerek csökkentik a káliumot, így a gyanú nem állja meg a helyét.',ok:false,fb:'Hibás! Ezek pont ellentétesen hatnak.'},{tx:'Ezek a gyógyszerek (ACEI és MRA) kálium-visszatartást okoznak, így tovább erősítik a hyperkalaemia gyanúját.',ok:true,fb:'Helyes! Az eljárásrend külön nevesíti ezeket a gyógyszereket oki tényezőként.'},{tx:'Nincs hatásuk a káliumra.',ok:false,fb:'Hibás! Kiemelt kockázati tényezők.'}]},
{sit:'A tele-EKG konzultáció során a doktornő megerősíti a csúcsos T-hullámokat. Mivel a beteg amúgy (még) stabil hemodinamikailag, azt kéri, kezdjék meg a transzportot az SBO-ra. Milyen speciális paramétert tudsz te B szinten is megmérni (a D vizsgálat részeként), ami a káliumszint szoros "testvére" protokollárisan?',opts:[{tx:'A vérgázt (ASTRUP).',ok:false,fb:'Hibás! Ahhoz speciális POCT gép és vénás/artériás vér kell, ami B szinten nem elvárás.'},{tx:'A vércukorszintet (szoros vércukor kontroll).',ok:true,fb:'Helyes! A stabil betegeknél a protokoll "Szoros vércukor (káliumszint) és EKG kontrollt" ír elő.'},{tx:'A vér káliumszintjét ujjbegyből.',ok:false,fb:'Hibás! Sima vércukormérő nem mér káliumot.'}]},
{sit:'Szállítás közben a beteg egyre gyengébb, a pulzusa 45/perc-re esik. B kompetenciával adhatsz-e kálcium iv. injekciót a szívizom védelmére?',opts:[{tx:'Igen, ha nagyon rosszul van.',ok:false,fb:'Hibás! B kompetenciával (gyógyszerezés nélkül) nem adhatsz iv. gyógyszert.'},{tx:'Nem, B kompetenciaszinten gyógyszerezés és vénabiztosítás nem engedélyezett, ezért a tele-EKG-n kapott instrukciók alapján sürgős ALS segítséget (mentőtiszt/orvos) kell kérnem a helyszínre vagy elébe.',ok:true,fb:'Helyes! Állapotromláskor fel kell pörgetni az ellátási szintet.'},{tx:'Igen, de csak izomba (im.).',ok:false,fb:'Hibás! Nem így működik az eljárásrend.'}]},
{sit:'Ha a tele-EKG-n az orvos megkérdezi, hogy van-e lehetőség vénát biztosítani és legalább egy fiziológiás sóoldatot indítani. Mit válaszolsz?',opts:[{tx:'Igen, azonnal bekötök egy Ringer-laktátot.',ok:false,fb:'Hibás! B szinten nem szúrsz, a Ringerben kálium van, ami tilos.'},{tx:'B kompetenciájú egység vagyunk, vénabiztosításra és folyadékpótlásra nincs jogosultságom.',ok:true,fb:'Helyes! Pontosan ismered a kompetenciádat.'},{tx:'Szúrok egy vénát, de infúziót nem adok.',ok:false,fb:'Hibás! A véna szúrása is B+ / magasabb kompetencia.'}]},
{sit:'A szállítás alatt folyamatos EKG monitorozás zajlik. Mi a protokolláris teendő Enyhe/Középsúlyos stabil állapotú hyperkalaemiánál az eljárásrend algoritmusa szerint?',opts:[{tx:'"Monitorizálás. Szoros vércukor (káliumszint) és EKG kontroll."',ok:true,fb:'Helyes! Az algoritmus egyértelműen ezt írja elő.'},{tx:'Azonnali inzulin adása.',ok:false,fb:'Hibás! Azt csak ALS és súlyos esetben adják.'},{tx:'CPR megkezdése megelőző jelleggel.',ok:false,fb:'Hibás! Sosem csinálunk megelőző CPR-t élő betegen.'}]},
{sit:'Szerencsére 5 perc múlva találkoztok a mentőorvosi kocsival. Az átadásnál milyen kulcsinformációkat mondasz el röviden a MIST/SAMPLE alapján a hyperkalaemia vonatkozásában?',opts:[{tx:'Csak a nevét és a korát.',ok:false,fb:'Hibás! A klinikai kép a fontos.'},{tx:'Dializált vesebeteg 2 kihagyott kezeléssel, szed ACEI-t és MRA-t, EKG-n csúcsos T-hullámok, csökkenő pulzusszám (45/p), B szinten csak megfigyelést és vércukor kontrollt végeztünk.',ok:true,fb:'Helyes! Tökéletes és pontos átadás az eljárásrend alapján.'},{tx:'Azt mondom, hogy fáj a hasa.',ok:false,fb:'Hibás! A hasfájás itt nem a vezető és életveszélyes tünet.'}]}
],summary:'Részletes Összefoglaló (Sim 1 - B kompetencia): A helyszínbiztonság és az első benyomás (ABCDE) után egy hemodinamikailag még stabil, de veszélyeztetett beteget vizsgáltunk. Felismertük a rizikófaktorokat (veseelégtelenség, kihagyott dialízis, ACEI és MRA szedése). Az EKG-n látott csúcsos T-hullámok alapján BLS (B) szinten kötelezően elvégeztük a transztelefonikus EKG konzultációt. Mivel B szinten nincs vénabiztosítás és gyógyszerelés (így sem kálciumot, sem infúziót nem adhattunk), a teendőnk az algoritmus szerinti: "Monitorizálás. Szoros vércukor és EKG kontroll" volt. Állapotromlás (bradycardia) esetén haladéktalanul magasabb szintű segítséget (ALS) kértünk a transzport során, majd pontosan átadtuk a beteget, kiemelve a hyperkalaemiára utaló gyanújeleket.'},

{id:2,title:'2. Szimuláció: EKG eltérések (B+ kompetencia)',diff:'B+ kompetencia',desc:'Egy 50 éves nőbeteghez riasztanak. "Rosszul érzi magát, hevesen ver a szíve". B+ kompetencia (szakképzett mentőápoló, aki gyógyszerezhet, vénát biztosíthat). A nő elmondja, hogy kálium pótlást írtak fel neki a vízhajtója mellé, de ő egy másik vízhajtót (MRA) is bevesz "mert dagad a lába".',steps:[

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>'; /* We allow glossary spans here */
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+h(i)+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>'; /* Allow glossary spans */
  if(b.tp==='algo') return renderAlgo();
  return '';
}

function renderAlgo(){
  return '<div style="margin-bottom:.75rem">'+
    '<div style="background:#262626;border:1px solid #3f3f3f;border-radius:8px;padding:10px;text-align:center;font-size:12px;color:#d1d5db;margin-bottom:8px"><b>ABCDE szerinti betegvizsgálat</b><br>vénabiztosítás, monitorizálás, 12 elvezetéses EKG<br>SAMPLE, OPQRST, rizikófaktorok felmérése, (ASTRUP)<br>haemodinamikai instabilitás mérlegelése</div>'+
    '<div class="g3" style="margin-bottom:8px">'+
      '<div style="background:#172554;border-radius:8px;padding:8px;text-align:center;font-size:11px;color:#bfdbfe;border:1px solid #1e3a8a"><b>Enyhe / Középsúlyos</b><br>(K+ 5,5-6,4)<br>EKG eltérés NÉLKÜL,<br>stabil beteg<br><hr style="border-color:#1e3a8a;margin:5px 0"><span style="font-weight:700">Monitorizálás<br>Szoros vércukor és EKG kontroll</span></div>'+
      '<div style="background:#451a03;border-radius:8px;padding:8px;text-align:center;font-size:11px;color:#fde68a;border:1px solid #78350f"><b>Súlyos</b><br>(K+ > 6,5)<br>EKG eltérés /<br>Instabilitás<br><hr style="border-color:#78350f;margin:5px 0"><span style="font-weight:700">Elsőként: 10ml 10% Ca-klorid vagy 30ml Calcimusc iv. 2-5 perc alatt. Kontroll EKG!</span></div>'+
      '<div style="background:#450a0a;border-radius:8px;padding:8px;text-align:center;font-size:11px;color:#fca5a5;border:1px solid #7f1d1d"><b>Keringésmegállás</b><br>Hyperkalaemia<br>gyanújában<br><hr style="border-color:#7f1d1d;margin:5px 0"><span style="font-weight:700">ALS felépítése<br>Ca iv. gyorsan!<br>10E inzulin+25g glükóz<br>Izotóniás bikarbonát (folyamatos)<br>50ml NaHCO3 (ha acidózis)</span></div>'+
    '</div></div>';
}

function renderFlash(){

var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c)+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+h(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+h(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+h(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+h(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function calcRes(){
  if(CA.state==2){ // CPR
    return {col:'#fca5a5', bg:'#450a0a', t:'Keringésmegállás (ALS/B+)', d:'<ul style="padding-left:1.2rem;margin-top:5px;line-height:1.5"><li>10ml 10% Ca-klorid vagy 30ml Calcimusc iv. <b>GYORS BOLUSBAN</b></li><li>10 NE inzulin + 25g glükóz iv. bolus</li><li>Izotóniás bikarbonát (75ml 8.4% + 500ml Isodex vagy 15ml + 100ml Glükóz) indítása</li><li>Ha súlyos acidózis: 50ml 8.4% NaHCO3 gyors iv.</li></ul>'};
  } else if(CA.ekg==1 || CA.state==1 || CA.k==2){ // Severe/Unstable
    return {col:'#fde68a', bg:'#451a03', t:'Súlyos / Instabil (B+)', d:'<ul style="padding-left:1.2rem;margin-top:5px;line-height:1.5"><li>Elsőként: 10ml 10% Ca-klorid vagy 30ml Calcimusc iv. <b>2-5 perc alatt lassan</b></li><li>5 perc után EKG kontroll</li><li>Ha nem javul: kálcium adag ismételhető</li></ul>'};
  } else { // Stable/Mild
    return {col:'#bfdbfe', bg:'#172554', t:'Enyhe/Középsúlyos Stabil (B)', d:'<ul style="padding-left:1.2rem;margin-top:5px;line-height:1.5"><li>Folytonos monitorizálás</li><li>Szoros vércukor és EKG kontroll</li><li>Infúziós sóoldat (pl. Ringer) adása tilos!</li></ul>'};
  }
}

function renderCalc(){
  var r = calcRes();
  function selBtn(lb, grp, val, idx){
    return '<button onclick="setCalcVar(\''+grp+'\','+idx+')" style="padding:6px;border:1px solid '+(val==idx?'#14b8a6':'#3f3f3f')+';border-radius:7px;background:'+(val==idx?'#14b8a6':'#2a2a2a')+';color:'+(val==idx?'#111827':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+lb+'</button>';
  }

  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Rizikó és Teendő Kalkulátor</h2>'+
  '<div class="card" style="padding-bottom:10px">'+
    '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:6px">Becsült Káliumszint (mmol/l)</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:15px">'+
      selBtn('Ismeretlen / <6', 'k', CA.k, 0)+
      selBtn('Mérsékelt (6.0-6.4)', 'k', CA.k, 1)+
      selBtn('Súlyos (>6.5)', 'k', CA.k, 2)+
    '</div>'+
    '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:6px">EKG Eltérések</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:15px">'+
      selBtn('Nincs EKG eltérés', 'ekg', CA.ekg, 0)+
      selBtn('Van (Csúcsos T, széles QRS)', 'ekg', CA.ekg, 1)+
    '</div>'+
    '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:6px">Hemodinamikai állapot</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:15px">'+
      selBtn('Stabil', 'state', CA.state, 0)+
      selBtn('Instabil / Peri-arreszt', 'state', CA.state, 1)+
      selBtn('Keringésmegállás', 'state', CA.state, 2)+
    '</div>'+
  '</div>'+
  '<div class="res-box" style="background:'+r.bg+';border:1px solid '+r.col+'40;text-align:left">'+
    '<div style="font-size:16px;font-weight:700;color:'+r.col+';margin-bottom:8px">'+r.t+'</div>'+
    '<div style="font-size:12px;color:#d1d5db">'+r.d+'</div>'+
  '</div>';
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcVar=function(grp, val){ CA[grp] = val; render(); }

render();
</script>
</body>
</html>
