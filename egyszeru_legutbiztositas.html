    summary:'Részletes összefoglaló: Gépkocsibalesetnél a ccABCDE elv alapján először a látható nagy vérzés és a nyaki gerinc rögzítése (MILS) élvezett elsőbbséget. Mivel a beteg eszméletlen és arcán sérülés volt, a légutat a nyaki gerinc védelme érdekében MILS mellett, a fej hátrahajtása nélkül, csak az áll kiemelésével nyitottuk meg. A légzésvizsgálat során szörcsölő hang jelezte a vér jelenlétét (folyadék elzáródás), amit azonnal merev toldatú szívóval eltávolítottunk. Az eljárásrend egyértelműen kimondja, hogy az NPA (orrtubus) helyes és kíméletes technikával még koponyaalapi törés gyanúja esetén sem ellenjavallt, így 2 db NPA-t ("malacorr" és pödrö-csavaró mozdulatokkal) és 1 db OPA-t helyeztünk be. A folyamatosan visszatermelődő vér miatt puha szívókatéterrel az NPA-n keresztül biztosítottuk az átjárhatóságot, és rezervoáros maszkon O2-t adtunk. Amikor beállt a keringésmegállás, az autóból való kimentés után a mellkasi kompressziókat ballonos-maszkos lélegeztetéssel, majd - mivel ez nehézkes volt - egy supraglotticus eszközzel (pl. i-gel) egészítettük ki, ami B+ szinten biztonságos alternatíva.'

// SEGÉDFÜGGVÉNYEK
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Render blockok
function rb(b){
  var res = '';
  if(b.tp==='sub') res = '<div class="sub">'+b.tx+'</div>';
  if(b.tp==='bl') res = '<ul class="bl">'+b.items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>';
  if(b.tp==='kr') res = '<div>'+b.items.map(function(i){return '<div class="kr">✓ &nbsp;'+i+'</div>';}).join('')+'</div>';
  if(b.tp==='al') res = '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='text') res = '<div style="font-size:13px;color:#d1d5db;margin-bottom:.75rem;line-height:1.6">'+b.tx+'</div>';
  if(b.tp==='tbl'){
    res = '<div class="tbl-wrap"><table class="tbl"><tbody>'+b.rows.map(function(r){
      return '<tr><td style="font-weight:700;color:#c4b5fd;width:40%">'+r[0]+'</td><td>'+r[1]+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  }
  return res;
}

// Navigáció
function go(s,id){SCR=s;CHID=id||null;rend();window.scrollTo(0,0);}
function setCat(c){FC.cat=c;FC.idx=0;FC.flip=false;rend();}
function flipCard(){FC.flip=!FC.flip;rend();}
function navCard(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(function(c){return c.cat===FC.cat});FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;rend();}
function pickQ(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});rend();}
function nextQ(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;rend();}
function resetQuiz(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};rend();}
function startSim(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;rend();}
function chooseSim(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});rend();}
function nextSim(){var sim=SIMS.find(function(s){return s.id===SI.id;});if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;rend();}
function resetSim(){SI={id:null,step:0,chosen:null,hist:[],fin:false};rend();}

// Kalkulátor funkciók
function setAge(v){CA.age=v?Number(v):0; rend();}
function setWeight(v){CA.weight=v?Number(v):0; rend();}
function setConscious(v){CA.conscious=(v==='true'); rend();}

// Szótár modal
function openDict(w){
  var low = w.toLowerCase();
  var desc = DICT[low] || 'Nincs magyarázat ehhez a szóhoz.';
  document.getElementById('mod-t').innerText = w.toUpperCase();
  document.getElementById('mod-d').innerText = desc;
  document.getElementById('mod').classList.add('act');
}
function closeDict(){
  document.getElementById('mod').classList.remove('act');
}

// UI Generálás
function renderHome(){
  return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">OMSZ Eljárásrend</div>'+
  '<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Eszköz nélküli és egyszerű légútbiztosítás</h1>'+
  '<div style="font-size:13px;color:#9ca3af">v2.0 · 2019.08.28.</div></div>'+
  '<div class="g2" style="margin-bottom:.75rem">'+
  [['chapters','📚','Eljárásrend','Teljes PDF tartalom'],['flash','🃏','Flashkártyák','Tanulókártyák'],['quiz','❓','Kvíz','Tudáspróba'],['sim','🚑','Szimuláció','Gyakorlati esetek B/B+'],['calc','🧮','Eszközválasztó','Légúti eszköz méretek']].map(function(arr){
    return '<button onclick="go(\''+arr[0]+'\')" class="card-btn" style="text-align:center;padding:1rem .5rem"><div style="font-size:26px;margin-bottom:6px">'+arr[1]+'</div><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+arr[2]+'</div><div style="font-size:11px;color:#9ca3af;margin-top:4px">'+arr[3]+'</div></button>';
  }).join('')+
  '</div>'+
  '<div class="al al-i" style="font-size:12px"><b>Útmutató:</b> A kék, szaggatott vonallal aláhúzott <span class="dict">idegen szavakra</span> kattintva megnyílik a fogalommagyarázó szótár!</div>';
}

function renderChapters(){
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Eljárásrend Fejezetei</h2>'+
  CDATA.map(function(c){
    return '<button class="card-btn" style="display:flex;align-items:center;gap:12px" onclick="go(\'chapter\',\''+c.id+'\')">'+
    '<div style="width:40px;height:40px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+c.icon+'</div>'+
    '<div style="flex:1"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+c.title+'</div><div style="font-size:12px;color:#9ca3af">'+c.secs.length+' alfejezet</div></div>'+
    '<div style="color:#9ca3af;font-size:20px">›</div></button>';
  }).join('');
}

function renderChapter(id){
  var c = CDATA.find(function(x){return x.id===id;});
  if(!c) return '';
  return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:700">‹ Vissza</button>'+
  '<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
  '<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+c.title+'</h2></div>'+
  c.secs.map(function(s){
    return '<div class="card"><h3 style="font-size:15px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+s.t+'</h3>'+s.bk.map(rb).join('')+'</div>';
  }).join('');
}

function renderFlash(){
  var cats = ['Összes'];
  CARDS.forEach(function(c){if(cats.indexOf(c.cat)===-1) cats.push(c.cat);});
  var filtered = FC.cat==='Összes'?CARDS:CARDS.filter(function(c){return c.cat===FC.cat;});
  var card = filtered[Math.min(FC.idx, filtered.length-1)];
  
  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
  '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(function(c){
    var act = (FC.cat===c);
    return '<button onclick="setCat(\''+c+'\')" style="padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid '+(act?'#14b8a6':'#3f3f3f')+';background:'+(act?'#14b8a6':'#2a2a2a')+';color:'+(act?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+c+'</button>';
  }).join('')+'</div>'+
  '<div style="font-size:13px;color:#9ca3af;text-align:center;margin-bottom:.65rem;font-weight:600">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára</div>'+
  '<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
  (FC.flip?
  '<div style="font-size:11px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Válasz</div>'+
  '<div style="font-size:14px;color:#d1d5db;line-height:1.6;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
  '<div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">'+card.cat+'</div>'+
  '<div style="font-size:16px;font-weight:700;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
  '<div style="font-size:12px;color:#9ca3af;margin-top:16px">Fordításhoz kattints →</div>')+
  '</div>'+
  '<div class="btn-row"><button class="btn" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v" onclick="flipCard()">Fordít</button><button class="btn" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
  if(QZ.done){
    var pct = Math.round(QZ.score/QUIZ.length*100);
    var good = pct>=80;
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz Eredmény</h2>'+
    '<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:.75rem">'+
    '<div style="font-size:48px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+' / '+QUIZ.length+'</div>'+
    '<div style="font-size:16px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Sikeres!':'Ismétlés javasolt.')+'</div></div>'+
    (QZ.ans.filter(function(a){return !a.ok}).length?'<h3 style="font-size:15px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok elemzése:</h3>'+
    QZ.ans.filter(function(a){return !a.ok}).map(function(a){
      var qq = QUIZ[a.qi];
      return '<div class="card" style="margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:#f3f4f6;margin-bottom:6px">'+h(qq.q)+'</div><div style="font-size:12px;color:#fca5a5;margin-bottom:3px">✗ Te válaszod: '+h(qq.opts[a.pi])+'</div><div style="font-size:12px;color:#4ade80;margin-bottom:6px">✓ Helyes: '+h(qq.opts[qq.ok])+'</div><div style="font-size:12px;color:#9ca3af;padding-top:4px;border-top:1px dashed #3f3f3f">'+h(qq.exp)+'</div></div>';
    }).join(''):'<div class="al al-s">Gratulálok! Minden válaszod helyes!</div>')+
    '<button class="btn btn-g btn-fw" style="margin-top:10px" onclick="resetQuiz()">Kvíz Újraindítása</button>';
  }
  var q = QUIZ[QZ.idx];
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Tudáspróba</h2><span style="font-size:13px;font-weight:700;color:#9ca3af">'+(QZ.idx+1)+' / '+QUIZ.length+'</span></div>'+
  '<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
  '<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:700;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
  q.opts.map(function(opt,i){
    var cls = 'opt';
    if(QZ.sel!==null){
      if(i===q.ok) cls += ' opt-ok';
      else if(i===QZ.sel) cls += ' opt-no';
    }
    return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'>'+h(opt)+'</button>';
  }).join('')+
  (QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem"><b>Magyarázat:</b><br>'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények Megtekintése')+'</button>':'');
}

function renderSim(){
  if(!SI.id){
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Interaktív Szimulációk</h2>'+
    SIMS.map(function(s){
      var tagCls = s.diff.indexOf('B+')!==-1 ? 'tag-y' : 'tag-g';
      return '<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px"><div style="font-size:15px;font-weight:700;color:#f3f4f6;line-height:1.3;padding-right:10px">'+s.title+'</div>'+
      '<span class="tag '+tagCls+'" style="flex-shrink:0">'+s.diff+'</span></div>'+
      '<div style="font-size:12px;color:#9ca3af;margin-bottom:6px;line-height:1.4">'+s.desc+'</div>'+
      '<div style="font-size:11px;font-weight:700;color:#14b8a6">'+s.steps.length+' kérdés / döntési pont</div></button>';
    }).join('');
  }
  var sim = SIMS.find(function(s){return s.id===SI.id;});
  if(SI.fin){
    var correct = SI.hist.filter(function(h){return sim.steps[h.step].opts[h.oi].ok;}).length;
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">Szimuláció Vége</h2>'+
    '<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1.2rem;text-align:center;margin-bottom:.75rem">'+
    '<div style="font-size:38px;font-weight:700;color:#4ade80">'+correct+' / '+sim.steps.length+'</div>'+
    '<div style="font-size:14px;color:#4ade80;font-weight:700">Helyes döntés</div></div>'+
    '<div class="al al-s"><strong>Eset Részletes Összefoglalója:</strong><br>'+h(sim.summary)+'</div>'+
    '<h3 style="font-size:15px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">A Te Lépéseid:</h3>'+
    SI.hist.map(function(hh, i){
      var st = sim.steps[hh.step];
      var opt = st.opts[hh.oi];
      return '<div class="card" style="margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:#f3f4f6;margin-bottom:4px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:12px;font-weight:600;margin-bottom:4px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:12px;color:#9ca3af;border-top:1px dashed #3f3f3f;padding-top:4px">'+h(opt.fb)+'</div></div>';
    }).join('')+
    '<button class="btn btn-r btn-fw" style="margin-top:10px" onclick="resetSim()">Vissza az esetekhez</button>';
  }
  var step = sim.steps[SI.step];
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem"><div style="font-size:14px;font-weight:700;color:#f3f4f6;line-height:1.2;padding-right:10px">'+sim.title+'</div><span style="font-size:13px;font-weight:700;color:#9ca3af;flex-shrink:0">'+(SI.step+1)+' / '+sim.steps.length+'</span></div>'+
  '<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
  (SI.step===0?'<div class="al al-w" style="font-size:12px"><b>Eset leírása:</b> '+h(sim.desc)+'</div>':'')+
  '<div class="card" style="margin-bottom:.75rem;background:#262626;border-color:#6366f1"><p style="font-size:15px;font-weight:700;color:#e0e7ff;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
  step.opts.map(function(opt, i){
    var cls = 'opt';
    if(SI.chosen!==null){
      if(opt.ok) cls += ' opt-ok';
      else if(i===SI.chosen) cls += ' opt-no';
    }
    return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'>'+h(opt.tx)+'</button>';
  }).join('')+
  (SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'" style="margin-bottom:.75rem"><b>Rövid Visszajelzés:</b><br>'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-v btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Tovább a következő lépésre →':'Eset lezárása és Összefoglaló')+'</button>':'');
}

function renderCalc(){
  var age = CA.age;
  var isInfant = age < 1;
  var isChild = age >= 1 && age < 8; // 8 év alatt
  var isPrePub = age >= 8 && age < 14;
  var isAdult = age >= 14;
  
  var cpr_ratio = (isAdult) ? "30:2" : "15:2 (egészségügyi személyzet esetén)";
  var initial_breaths = (isAdult) ? "0 befúvás (mellkasi kompressziókkal kezdjük)" : "5 kezdeti mentőbefúvás";
  
  var npa_rec = "2 db NPA (mindkét orrjáratba)";
  if (age < 8) npa_rec = "NPA használata kerülendő. Végszükségben 1 db használható, ha a manuális pozíció elégtelen.";
  
  var opa_tech = "Fordított helyzetben (konkáv a szájpad felé) bevezetni, majd 180°-kal elforgatni.";
  if (!isAdult) opa_tech = "Elforgatás NÉLKÜL, a végleges pozíciójának megfelelően (domború oldallal a szájpad felé) csúsztatjuk be, a lágyrészek sérülésének elkerülése végett.";
  
  var head_pos = "Fej kíméletes hátrahajtása + áll előemelése.";
  if (age < 2) head_pos = "Túlzott hátrahajtás kerülendő! NEUTRÁLIS pozíció megtartása. Váll alá 2-3 cm-es lepedő helyezése javasolt az áll előemelése mellett.";
  
  var heimlich = "Erőtlen köhögésnél: 5 háti ütés, majd 5 hasi lökés váltogatva.";
  if (isInfant) heimlich = "Erőtlen köhögésnél: 5 háti ütés, majd 5 MELLKASI lökés (hasi lökés TILOS).";

  return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Légútbiztosítás Eszköz- és Algoritmus Választó</h2>'+
  '<div class="card">'+
    '<label style="font-size:13px;font-weight:700;color:#9ca3af;display:block;margin-bottom:6px">Beteg Életkora (évben, csecsemő=0):</label>'+
    '<input type="number" min="0" max="99" value="'+CA.age+'" onchange="setAge(this.value)">'+
    
    '<label style="font-size:13px;font-weight:700;color:#9ca3af;display:block;margin-bottom:6px;margin-top:10px">Eszméleténél van a beteg?</label>'+
    '<select onchange="setConscious(this.value)">'+
      '<option value="true" '+(CA.conscious?'selected':'')+'>Igen, eszméleténél van</option>'+
      '<option value="false" '+(!CA.conscious?'selected':'')+'>Nem, eszméletlen</option>'+
    '</select>'+
  '</div>'+

  '<h3 style="font-size:15px;font-weight:700;color:#14b8a6;margin-bottom:10px;margin-top:15px">Ajánlások és Paraméterek (OMSZ)</h3>'+
  '<div class="card" style="border-left:4px solid #3b82f6">'+
    '<div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:2px">Manuális Légútmegnyitás (Nincs trauma):</div>'+
    '<div style="font-size:14px;color:#d1d5db;margin-bottom:10px">'+head_pos+'</div>'+
    
    '<div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:2px">OPA (Guedel) Behelyezési Technika:</div>'+
    '<div style="font-size:14px;color:#d1d5db;margin-bottom:10px">'+opa_tech+'<br><span style="font-size:12px;color:#9ca3af">(Méret: Ajak - Angulus mandibulae távolság)</span></div>'+
    
    '<div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:2px">NPA Alkalmazhatóság:</div>'+
    '<div style="font-size:14px;color:#d1d5db;margin-bottom:10px">'+npa_rec+'<br><span style="font-size:12px;color:#9ca3af">(Méret: Orrnyílás - Tragus távolság)</span></div>'+
    
    '<div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:2px">Szilárd Idegentest Algoritmus:</div>'+
    '<div style="font-size:14px;color:#d1d5db;margin-bottom:10px">'+(CA.conscious ? heimlich : 'Eszméletlen betegnél azonnal CPR megkezdése!')+'</div>'+
    
    '<div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:2px">Újraélesztés (CPR) Kezdete és Aránya:</div>'+
    '<div style="font-size:14px;color:#d1d5db;margin-bottom:10px">Kezdés: '+initial_breaths+'<br>Arány: '+cpr_ratio+'</div>'+
  '</div>';
}

function rend(){
  var c = document.getElementById('ct');
  if(SCR==='home') c.innerHTML = renderHome();
  else if(SCR==='chapters') c.innerHTML = renderChapters();
  else if(SCR==='chapter') c.innerHTML = renderChapter(CHID);
  else if(SCR==='flash') c.innerHTML = renderFlash();
  else if(SCR==='quiz') c.innerHTML = renderQuiz();
  else if(SCR==='sim') c.innerHTML = renderSim();
  else if(SCR==='calc') c.innerHTML = renderCalc();
  
  var tabs = ['home','chapters','flash','quiz','sim','calc'];
  var act = SCR==='chapter'?'chapters':SCR;
  var btns = document.querySelectorAll('.nb');
  for(var i=0; i<btns.length; i++){
    if(tabs[i]===act) btns[i].classList.add('act');
    else btns[i].classList.remove('act');
  }
}

rend();
</script>
