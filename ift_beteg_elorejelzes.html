@media(max-width:480px){.tbl-wrap table{min-width:340px;}}

function showDict(word) {
  var key = Object.keys(DICT).find(k => k.toLowerCase() === word.toLowerCase());
  if (key) {
    document.getElementById('dictWord').innerText = key;
    document.getElementById('dictDef').innerText = DICT[key];
    document.getElementById('dictModal').style.display = 'block';
  }
}

function closeDict() {
  document.getElementById('dictModal').style.display = 'none';
}

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function w(text) {
  let res = h(text);
  let keys = Object.keys(DICT).sort((a,b) => b.length - a.length);
  keys.forEach(key => {
    let regex = new RegExp("\\b(" + key + ")\\b", "gi");
    res = res.replace(regex, '<span class="fw" onclick="showDict(\'$1\')">$1</span>');
  });
  return res;
}

{sit:'Hogyan kell felépíteni a telefonos előrejelzést?',opts:[{tx:'Folyamatosan, párbeszéd nélkül mondom el az ISBAR struktúra szerint, maximum 1 perc alatt.',ok:true,fb:'Helyes! Az előrejelzés megszakítás nélkül, tömören a leghatékonyabb.'},{tx:'Hosszasan, minden eddigi betegségét felsorolva referálok.',ok:false,fb:'Hibás! Túl hosszú és információvesztéshez vezet.'},{tx:'Megvárom, amíg a kórházi orvos kérdez, és csak arra válaszolok.',ok:false,fb:'Hibás! A strukturált információátadás a mi feladatunk kezdésként.'}]},
{sit:'Kezded az ISBAR "I" és "S" részét. Melyik a helyes forma?',opts:[{tx:'"Jó napot, hozok egy szívinfarktusos beteget.".',ok:false,fb:'Hibás! Hiányzik az azonosítás (saját egység).'},{tx:'"Jó napot! 13/162-es mentőgépkocsi mentőápolója vagyok. STEMI gyanús beteg miatt hívom a kardiológiai ügyeletet."',ok:true,fb:'Helyes! "I" (Azonosítás: ki vagyok, kit hívok), "S" (Helyzet: STEMI).'},{tx:'"Mentő, van egy STEMI, jövünk."',ok:false,fb:'Hibás! Nem kollegiális és hiányos.'}]},
{sit:'Következik a "B" (Background - Háttér) az ATMISTER logika mentén. Melyik mondat felel meg a szabványnak?',opts:[{tx:'"A beteg férfi, 65 éves. A tünetei egy órája kezdődtek típusos mellkasi fájdalommal."',ok:true,fb:'Helyes! Megvan az Életkor, az Időpont, és a Mechanizmus/Sérülés jellege.'},{tx:'"A beteget Kovács Jánosnak hívják, a Taj száma 123-456-789, és egy órája fáj a mellkasa."',ok:false,fb:'Hibás! Név és Taj szám felesleges a rádiós előrejelzésnél.'},{tx:'"Sokat fáj a mellkasa."',ok:false,fb:'Hibás! Nincs időpont és kor.'}]},
{sit:'A beteg vérnyomása 130/80 Hgmm, pulzusa 85/perc, légzése 16/perc, szaturációja 98%, tudata tiszta (GCS 15). Mit mondasz az "A" (Assesment) részben a vitális paraméterekről?',opts:[{tx:'Felsorolom az összes paramétert számokkal.',ok:false,fb:'Hibás! Feleslegesen húzza az időt.'},{tx:'"A vitális paraméterei normál tartományban vannak."',ok:true,fb:'Helyes! Ha egyik paraméter sem esik a kritikus sávba, elég ezt közölni.'},{tx:'Nem mondok róluk semmit.',ok:false,fb:'Hibás! Valamilyen formában jelezni kell az értékelést (stabil állapot).'}]},
{sit:'A kórházi orvos kéri, hogy mutasd meg neki az EKG görbét, mielőtt aktiválja a katéteres labort. Mit teszel?',opts:[{tx:'Készítek egy képet a saját mobilommal, amin látszik a görbe, elküldöm, majd azonnal törlöm a képet a telefonról.',ok:true,fb:'Helyes! Kép küldhető, ha nincs rajta személyes adat, és utána törölni kell.'},{tx:'Lefotózom az EKG-t úgy, hogy rajta van a beteg neve és az esetszám is, hogy biztosan azonosítsák.',ok:false,fb:'Hibás! Személyes adat SOHA nem szerepelhet a képen!'},{tx:'Megtagadom a küldést, mert a szabályzat tiltja a telefonos fényképezést.',ok:false,fb:'Hibás! Az eljárásrend engedi a képküldést az ellátás érdekében.'}]},
{sit:'Az "R" (Recommendation - Javaslat/Érkezés) részben mit kell mondanod?',opts:[{tx:'"Kérek egy kávét érkezéskor."',ok:false,fb:'Hibás! Csak a beteg érdekeit szolgáló azonnali szükségletet mondjuk.'},{tx:'"Várható érkezésünk 10:45. A beteg azonnali kardiológiai felvételt (PCI labor) igényel."',ok:true,fb:'Helyes! Pontos érkezési idő és az azonnali szükséglet (PCI).'},{tx:'"Jövünk, ahogy tudunk."',ok:false,fb:'Hibás! Pontatlan.'}]},

{sit:'Mielőtt a beteget átemelitek a hordágyról a kórházi ágyra, mi a teendő a mentő monitorkábeleivel az eljárásrend szerint?',opts:[{tx:'Rajta kell hagyni a betegen az utolsó pillanatig, még az ágyon is a miénk legyen rajta.',ok:false,fb:'Hibás! Ez lassítja az átvételt és a kábelek beakadhatnak.'},{tx:'Javasolt az átemelés előtt eltávolítani a monitorkábeleket (a valós biztonságtöbblet hiánya és az akadályozás miatt).',ok:true,fb:'Helyes! Stabil betegnél a mentő monitorkábelei eltávolíthatók az átemelés megkönnyítésére.'},{tx:'A monitort a beteggel együtt a kórház ágyán kell hagyni tartósan.',ok:false,fb:'Hibás!'}]},

],summary:'Részletes Összefoglaló (Sim 1 - B kompetencia): A STEMI gyanús betegnél magas az időfaktor, így a célintézmény az időben leggyorsabban elérhető PCI-labor volt. Az előrejelzést KÖZVETLENÜL az átvevő osztállyal vettük fel (nem az ICS közvetítésével). A kommunikáció során a struktúra megszakítása nélkül mondtuk el az ISBAR jelentést (Azonosítás, Helyzet, Háttér, Értékelés, Javaslat). Mivel a vitális paraméterek a normál tartományban voltak, nem részleteztük azokat számszerűen, csak jeleztük, hogy rendben vannak. Az orvos kérésére készítettünk fotót az EKG-ról, ügyelve arra, hogy személyes adatok NE szerepeljenek rajta, a továbbítás után a képet töröltük. Érkezéskor a "hands off" módszert alkalmaztuk: átemelés előtt, miután eltávolítottuk a mentő monitorkábeleit, mindenki rá figyelt, amíg az ISBAR alapján szóban referáltunk. A folyamat végén a Code Summary dokumentumot kötelezően átadtuk.'},

{sit:'ATMISTER szerint a "T" és "M" jön (Idő és Mechanizmus). Melyik a megfelelő forma?',opts:[{tx:'"Körülbelül 20 perce gyalogosként személyautó gázolta el."',ok:true,fb:'Helyes! Idő (20 perce) és Mechanizmus (gyalogos gázolás).'},{tx:'"Nagyon vérzik a lába és fáj a medencéje."',ok:false,fb:'Hibás! Ez már a sérülés kategória, nem a mechanizmus.'},{tx:'"Gázolás történt."',ok:false,fb:'Hibás! Hiányzik az időadat.'}]},
{sit:'ATMISTER "I" (Injuries) - ABCD eltérések. Melyik a legjobb leírás?',opts:[{tx:'"C - hemodinamikailag instabil, feltételezett belső vérzése van a medencetörésből, és jobb oldali combcsonttörése van."',ok:true,fb:'Helyes! Tömören leírja a sérüléseket fejtől lefelé és az ABCD problémát (C-instabil).'},{tx:'"Eltörött mindene, nagyon rosszul van."',ok:false,fb:'Hibás! Szakmaiatlan.'},{tx:'"Horzsolás van a bal kezén."',ok:false,fb:'Hibás! A kritikus, vezető sérüléseket kell mondani.'}]},
{sit:'ATMISTER "S" (Signs/Vitális paraméterek). Vérnyomása 80 Hgmm, szívfrekvenciája 135/perc, légzése 20/perc, szaturációja 96%, tudata tiszta. Mik a kötelező elemek az elmondásban?',opts:[{tx:'"Tudata tiszta, pulzusa 135, légzése 20, vérnyomása 80, szaturációja 96%."',ok:false,fb:'Hibás! Csak a normál tartományon kívüli értékeket mondjuk!'},{tx:'"Szisztolés vérnyomása 80 Hgmm, egyéb vitális paraméterei rendben vannak (tartományon belül)."',ok:true,fb:'Helyes! A 80 Hgmm alacsonyabb a 100-220-as sávnál. A többi (135, 20, 96%, GCS15) a tartományon belül van, így nem kell mondani.'},{tx:'Csak a pulzust mondom.',ok:false,fb:'Hibás! A vérnyomás a kritikus eltérés itt.'}]},
{sit:'ATMISTER "T" (Terápia). B+ kompetenciával milyen fontos beavatkozást kezdtél, amit jelenteni kell?',opts:[{tx:'"Kapott egy takarót."',ok:false,fb:'Hibás! Ez alapellátás, nem kiemelkedő terápia az ISBAR-ban.'},{tx:'"Két perifériás vénát biztosítottam és medencerögzítő övet, húzósínt helyeztünk fel, folyadékpótlás indult."',ok:true,fb:'Helyes! Ezek kritikus terápiás lépések instabil traumánál, amit a segélykocsinak/ICS-nek tudnia kell.'},{tx:'"Nem csináltam semmit, várom a segítséget."',ok:false,fb:'Hibás! B+ kompetenciával dolgozni kell a mentés során.'}]},
{sit:'A segélykocsi (esetkocsi orvossal) elindul, de 20 percre vannak a helyszíntől. A célkórház (Traumacentrum) 15 percre van. Mit kell mérlegelned (és a mentésirányítónak) az eljárásrend alapján?',opts:[{tx:'Helyben kell várni a segélykocsit, bármi történik.',ok:false,fb:'Hibás! A várakozás 20 percet vesz igénybe, a kórház 15 percre van, a beteg belső vérző.'},{tx:'Kötelező mérlegelni a helyben várakozás időveszteségét. Mivel a kórkép magas időfaktorú (belső vérzés) és a kórház közelebb van, mint a segélykocsi, kötelező a kórházba szállítás megkezdése és szükség esetén a randevú egyeztetése.',ok:true,fb:'Helyes! Magas időfaktornál a "load and go" (szállítás és randevú elv) érvényesül.'},{tx:'Felhívni a rendőrséget.',ok:false,fb:'Hibás! Orvosszakmai döntést kell hozni.'}]},
{sit:'Elindultok a beteggel a kórház felé (randevú elv). A beteg állapota útközben romlik, eszméletét veszti. Mit kell haladéktalanul megtenni a mentőben?',opts:[{tx:'Azonnal gyorsítani a gépkocsin.',ok:false,fb:'Hibás! A beavatkozás a fontosabb.'},{tx:'Állapotváltozás miatt a szisztematikus ABCDE vizsgálatot az elejéről újra elvégezni, az "A" (légút) szintjétől kezdve.',ok:true,fb:'Helyes! Bármilyen állapotváltozás esetén az ABCDE elölről indul.'},{tx:'Azonnal megkezdeni a mellkasi kompressziót.',ok:false,fb:'Hibás! Előbb az "A" és "B" vizsgálat szükséges (van-e légzés).'}]},
{sit:'Sikerül a randevú a segélykocsival az úton. Az esetkocsi orvosa átveszi a beteget. Az orvos úgy dönt, a kritikus állapot ellenére nehéz intubáció várható a mentőben, ezért emelt szintű légútbiztosítás nélkül (csak maszkkal) futtok be a kórházba. A "hands off" átadásra készültök az SBO sokktalanítójában. Mit kell kérni előre?',opts:[{tx:'"R" (Requirements): A beteg azonnali sürgősségi műtéti beavatkozásra és emelt szintű légútbiztosításra fog szorulni érkezéskor.',ok:true,fb:'Helyes! Az előrejelzésben jelezni kell az azonnali kórházi szükségletet (műtő, team, légútbiztosítás).'},{tx:'Nincs szükség előrejelzésre, beviszitek.',ok:false,fb:'Hibás! A sokktalanító csapatnak fel kell készülnie.'},{tx:'"Kérek egy kerekesszéket."',ok:false,fb:'Hibás! Hordágyas, kritikus beteg.'}]},
{sit:'A sokktalanítóban sikeres a "hands off" átadás. A hordágyról átemelitek a beteget a CT asztalra, de rajta van a húzósín és a medencerögzítő (amit a kórház azonnal nem tud cserélni). Mit mond az eljárásrend?',opts:[{tx:'Azonnal le kell tépni a betegről az eszközeinket, hogy mehessünk.',ok:false,fb:'Hibás! Ez károsítja a beteget.'},{tx:'A rögzítő eszközök cseréjére törekedni kell, de ha nincs csereeszköz, akár rövid várakozás is megengedett a beteg érdekében (amíg pl. a műtőben leveszik).',ok:true,fb:'Helyes! A beteg stabilitása az első, ha kell, az eszközök rajta maradnak egy ideig.'},{tx:'Az eszközöket a kórháznak ki kell fizetnie a mentőknek.',ok:false,fb:'Hibás!'}]}
],summary:'Részletes Összefoglaló (Sim 2 - B+ kompetencia): A gázolás miatt shockos, instabil, medence- és combcsonttörést szenvedett beteg ellátása meghaladja a B+ szintet, így haladéktalanul ALS segélykocsit kértünk. Az ICS felé a kommunikáció szigorúan az ISBAR/ATMISTER struktúrát követte. Pontosan jeleztük a mechanizmust (gázolás 20 perce), az ABCD eltérést (C-instabil) és a vitális paraméterek közül CSAK az eltérőt (RR 80 Hgmm). Bejelentettük az alkalmazott terápiát (vénák, medencerögzítő, húzósín). Mivel a magas időfaktorú kórképnél a célkórház (15 p) közelebb volt, mint a segélykocsi (20 p), az eljárásrend értelmében a várakozás helyett elindultunk a kórház felé, és az úton randevúztunk a segélykocsival. Állapotromláskor (eszméletvesztés) az ABCDE-t elölről kezdtük. A kórház felé tartva előrejeleztük (Requirement) a trauma team és az azonnali légútbiztosítás igényét. Az SBO-n "hands off" átadást hajtottunk végre. Bár a mentő eszközeinek (húzósín, medencerögzítő) cseréjére törekedni kell, csereeszköz hiányában a beteg érdekében rövid ideig azokon hagytuk őt a műtőig/CT-ig.'},

{id:3,title:'3. Szimuláció: Segélykocsi lemondása (B kompetencia)',diff:'B kompetencia',desc:'Egy fiatal lányhoz riasztanak, akinek "görcsrohama van". B kompetenciával (gyógyszerelés nélkül) érkezel ki.',steps:[
{sit:'A helyszínre érsz. A lány a földön fekszik, még tart a tónusos-klónusos epilepsziás roham. Mit teszel elsőként a helyszínbiztonság után?',opts:[{tx:'Azonnal megpróbálom lefogni, hogy ne verje be a fejét.',ok:false,fb:'Hibás! A rohamozó beteget nem szabad lefogni, csak a fejét védeni.'},{tx:'Mivel tartós rohama van és B kompetenciájú vagyok, azonnal segélykocsit kérek ISBAR struktúrában, és védem a fejét a sérüléstől.',ok:true,fb:'Helyes! A tartós roham gyógyszeres beavatkozást igényel (orvos/mentőtiszt), azonnal ALS egység kell.'},{tx:'Beadok neki egy nyugtató tablettát.',ok:false,fb:'Hibás! Rohamozó betegnek tilos szájon át bármit adni, plusz B kompetenciával nem is adhatsz.'}]},
{sit:'Hogyan kezded az ISBAR szerinti jelentést a rádión a segélykocsi kéréshez?',opts:[{tx:'"Itt az 54-es autó, a lánynak rohama van!"',ok:false,fb:'Hibás! Hiányos és szakszerűtlen.'},{tx:'"Identify: 12/54 mentőgépkocsi. Situation: Elhúzódó epilepsziás roham miatt segélykocsit kérünk egy 20 éves nőbeteghez."',ok:true,fb:'Helyes! Egyértelmű azonosítás és a helyzet pontos megnevezése.'},{tx:'"Kérek egy orvost!"',ok:false,fb:'Hibás!'}]},
{sit:'5 perccel a segélykocsi kérése után a beteg rohama spontán oldódik. A beteg tudata fokozatosan tisztul. Mit mond a Szabványos Eljárásrend a segélykocsi lemondásáról?',opts:[{tx:'Csak annyit mondok a rádión: "Irányítás, már jól van, nem kell a kocsi, lemondom."',ok:false,fb:'Hibás! Ez szigorúan tilos!'},{tx:'A lemondásnál is KÖTELEZŐ az ISBAR formula használata, a lemondás segélykocsi lemondása ISBAR nélkül TILOS!',ok:true,fb:'Helyes! Az állapot stabilizálódását strukturáltan kell jelenteni.'},{tx:'Nem mondom le, hadd jöjjenek ki megvizsgálni.',ok:false,fb:'Hibás! Indokolatlan erőforrás pazarolás, ha stabil és ellátható.'}]},
{sit:'Megkezded a lemondást ISBAR formátumban. "I" (Identify): "12/54-es autó vagyok, hívom a 11/32-es esetkocsit és az ICS-t". "S" (Situation): Mi a helyes szöveg?',opts:[{tx:'"A beteg jól van."',ok:false,fb:'Hibás! Túlságosan leegyszerűsített.'},{tx:'"Korábban segítséget kértünk egy 20 éves beteghez epilepsziás roham miatt. Jelenleg a roham lezajlott, az állapot stabilizálódott."',ok:true,fb:'Helyes! Visszautal a korábbi problémára és tisztázza a jelenlegi helyzetet.'},{tx:'"Nem kell jönni, ébred."',ok:false,fb:'Hibás! Nem szakmai.'}]},
{sit:'Következik az "A" (Assesment) a lemondásnál. A beteg GCS-e 14, RR 120 Hgmm, pulzus 90/perc, légzés 14/perc. Hogyan kommunikálod le?',opts:[{tx:'Mindent felsorolok egyenként.',ok:false,fb:'Hibás! Felesleges, mert minden paraméter normál.'},{tx:'"A beteg vitális paraméterei normál tartományban vannak, tudata tisztul, stabil ABCD állapotú."',ok:true,fb:'Helyes! Tökéletes és tömör értékelés a lemondáshoz.'},{tx:'Nem mondok vitális paramétert.',ok:false,fb:'Hibás! Az "A" részben értékelni kell a stabilitást.'}]},
{sit:'Végül az "R" (Recommendation - Javaslat) a lemondásban. Mit javasolsz?',opts:[{tx:'"A beteg további ellátását és szállítását B kompetenciaszinten meg tudjuk oldani, így a segélykocsit lemondjuk."',ok:true,fb:'Helyes! Egyértelmű javaslat a szállításra és a lemondásra.'},{tx:'"Kérem, hogy írjatok le mindent a naplóba."',ok:false,fb:'Hibás! Nem a dokumentációra vonatkozik a javaslat.'},{tx:'"Kérjük a beteget gyalog hazaküldeni."',ok:false,fb:'Hibás! Szállítani kell a Sürgősségire.'}]},
{sit:'A lemondás során kinek a megszólítása kötelező a rádión?',opts:[{tx:'Csak az Irányító Csoporté.',ok:false,fb:'Hibás! Az úton lévő kocsit is értesíteni kell.'},{tx:'Csak a Segélykocsié.',ok:false,fb:'Hibás! Az ICS-nek is tudnia kell, hogy az egység felszabadult.'},{tx:'Mind a mentésirányítóé (ICS), mind pedig a riasztott segélykocsié.',ok:true,fb:'Helyes! Az eljárásrend szerint mindkét felet meg kell szólítani.'}]},
{sit:'Az ICS elfogadja a lemondást, az esetkocsi visszafordul. A beteg járóképes és fel akar állni, hogy a mentőhöz sétáljon. Beültetheted-e az autóba?',opts:[{tx:'Igen, ha akar, sétálhat.',ok:false,fb:'Hibás! Roham utáni kimerültség, elesés veszélye fennáll.'},{tx:'A betegmozgatást kíméletesen (!) kell végrehajtani. Inkább hordágyon vagy hordszéken javasolt a mentőbe vinni, elkerülve a megerőltetést.',ok:true,fb:'Helyes! A kíméletes betegmozgatás a stabil állapot fenntartásának kulcsa.'},{tx:'Csak akkor, ha a roham alatt megütötte magát.',ok:false,fb:'Hibás!'}]},
{sit:'Úton vagytok a kórházba. Milyen gyakran kell a szisztematikus ABCDE vizsgálatot ismételni ezen a már "stabilizálódott", de roham utáni betegen?',opts:[{tx:'Csak ha újra rángatózni kezd.',ok:false,fb:'Hibás! Megelőző megfigyelés szükséges.'},{tx:'Kritikus/potenciálisan instabil betegnél (roham után) az automatikus ismétlés 5-10 percenként indokolt.',ok:true,fb:'Helyes! A roham ismétlődhet, a szoros megfigyelés kötelező.'},{tx:'Óránként egyszer.',ok:false,fb:'Hibás! Mentőben rövidebb az időablak.'}]},
{sit:'A kórházi átadás megtörtént. A mentőjárműben egy kis hányadék van a padlón a roham utánról. Mi a teendő a dokumentáció írása közben?',opts:[{tx:'A mentőjármű gyors rendbetételére kell törekedni (kisebb szennyeződés letörlése, eszközök pótlása a táskából), hogy a legrövidebb időn belül újra riaszthatók legyünk.',ok:true,fb:'Helyes! Az eljárásrend pontosan ezt írja elő a gyors bevethetőség érdekében.'},{tx:'Megvárom, amíg visszaérünk az állomásra és ott kimosom.',ok:false,fb:'Hibás! Kisebb szennyeződést azonnal kell takarítani.'},{tx:'Kérem az ICS-t, hogy küldjenek takarítószemélyzetet.',ok:false,fb:'Hibás!'}]}
],summary:'Részletes Összefoglaló (Sim 3 - B kompetencia): A kiérkezéskor a beteg tónusos-klónusos rohamban volt, ami B kompetenciával nem áttörhető, így haladéktalanul segélykocsit kértünk az ISBAR struktúra szerint. 5 perccel később a roham spontán oldódott és a vitális paraméterek a normál tartományba tértek vissza. Mivel a beteg B szinten is szállíthatóvá vált, a riasztott segélykocsit le kellett mondani. A segélykocsi lemondása ISBAR nélkül szigorúan tilos! A rádión azonosítottuk magunkat, megszólítottuk mind az ICS-t, mind az esetkocsit (I). Elmondtuk, hogy a roham lezajlott (S), a vitális paraméterek normálisak (A), és kérjük a lemondást, mivel a szállítást meg tudjuk oldani (R). A lemondást elfogadták. A beteget kíméletesen, hordágyon/hordszéken a mentőbe vittük, és a kórház felé tartva 5-10 percenként megismételtük az ABCDE vizsgálatot. Az átadás után az előírásoknak megfelelően a gépkocsit azonnal, még a helyszínen rendbetettük (kisebb szennyeződés eltávolítása, készletpótlás), hogy ismét bevethetők legyünk.'},

{id:4,title:'4. Szimuláció: Szekunder transzport (B+ kompetencia)',diff:'B+ kompetencia',desc:'Városi kórház intenzív osztályáról (küldő intézmény) hívják a B+ egységet egy szeptikus shockban lévő, instabil légzésű beteg szekunder (kórházak közötti) transzportjára megyei centrumba.',steps:[
{sit:'Megérkeztek a küldő intenzív osztályra. A beteg ABCDE szerint instabil (RR 75/40 Hgmm, szaturáció 85% oxigénen, tachypnoe). Mi a szekunder szállítás alapelve az eljárásrend szerint?',opts:[{tx:'Minden beteget azonnal el kell vinni, ha a küldő orvos kéri.',ok:false,fb:'Hibás! Instabil beteg szállítása speciális szabályokhoz kötött.'},{tx:'Adekvát terápia ellenére ABC-instabil beteg szekunder szállítása alapvetően NEM kezdhető meg (kivéve, ha csak a fogadó intézetben tudják stabilizálni, pl. aorta dissectio).',ok:true,fb:'Helyes! Az ABC-instabil beteget ott kell stabilizálni szállítás előtt.'},{tx:'B+ kompetenciával vihető, mert útközben adhatunk oxigént.',ok:false,fb:'Hibás! Oxigénnel is hypoxiás a beteg.'}]},
{sit:'A mentőegység vezetőjeként úgy ítéled meg, hogy a beteg jelen állapotában szállíthatatlan, mert az úton meghalhat, de a küldő kórházi orvos ragaszkodik a szállítás megkezdéséhez. Mi az utasítás?',opts:[{tx:'Megtagadom a szállítást és elhagyom a helyszínt.',ok:false,fb:'Hibás! Nem hagyhatod ott a vitát következmények nélkül.'},{tx:'Mindkettőnk (rövid indoklást tartalmazó) véleményét rögzíteni kell a betegdokumentációban, és EZUTÁN a szállítást végre kell hajtani.',ok:true,fb:'Helyes! Ha a küldő orvos ragaszkodik, az ő felelősségére, dokumentálás után el kell indulni.'},{tx:'Felhívom a rendőrséget, hogy oldják meg.',ok:false,fb:'Hibás!'}]},
{sit:'A papírok kitöltése után átemelitek a beteget a mentő hordágyára. A beteg intubált, lélegeztetett. Milyen fontos teendőd van betegmozgatás (átemelés) közben az endotrachealis tubussal?',opts:[{tx:'Semmi, a gép fújja.',ok:false,fb:'Hibás! A tubus kicsúszhat.'},{tx:'A betegmozgatás során mindig szükséges az endotrachealis tubus manuális rögzítése, melyet a fej felől lévő ellátó végez (az ő számolására történik az átemelés).',ok:true,fb:'Helyes! A fej felől álló fogja a tubust és a nyakat/fejet, ő irányítja az átemelést.'},{tx:'Leragasztom szigetelőszalaggal.',ok:false,fb:'Hibás!'}]},
{sit:'Elindultok a centrum felé. Közben telefonos konzultációt kell folytatnod a mentésirányítással az oxigénellátásotok logisztikája miatt. Hogyan kommunikálsz?',opts:[{tx:'Csak egy gyors kérdést teszek fel.',ok:false,fb:'Hibás! A prehospitális telefonos konzultációnak is strukturáltnak kell lennie.'},{tx:'A prehospitális telefonos konzultáció során is az ISBAR szerinti jelentés a kötelező.',ok:true,fb:'Helyes! Az ISBAR minden formális klinikai kommunikáció alapja.'},{tx:'SMS-t írok az ICS-nek.',ok:false,fb:'Hibás!'}]},
{sit:'Megérkeztek a fogadó intézetbe (megyei centrum intenzív osztálya). Érkezéskor a beteg NEM szorul azonnali újraélesztésre. Milyen átadási módszert fogsz alkalmazni?',opts:[{tx:'Rögtön átdobjuk az ágyra és futunk el.',ok:false,fb:'Hibás!'},{tx:'A "hands off" módszert: az átemelés előtt 0,5-1 percet hagyunk a szóbeli átadásra (ISBAR), miközben a teljes team az átadóra figyel, beavatkozás nélkül.',ok:true,fb:'Helyes! Ez a standard átadási folyamat stabilizált, de kritikus betegnél.'},{tx:'Közben folyamatosan szívom a légútját, miközben beszélek.',ok:false,fb:'Hibás! A "hands off" alatt nincs beavatkozás, kivéve ha az életmentő (de itt nem az).'}]},
{sit:'A fogadó helyen van saját működőkész kapnográf (EtCO2 mérő) és légzőkör. Mi a teendő a mentő gépéről való átváltással kapcsolatban?',opts:[{tx:'Javasolt az arra történő, átemelés ELŐTTI átváltás, hogy a beteg áthelyezése alatt az endotrachealis tubus helyzete mindig monitorozva legyen.',ok:true,fb:'Helyes! Az EtCO2 folyamatos ellenőrzése kritikus az átemelés alatti csőcsúszás felismeréséhez.'},{tx:'Csak átemelés után szabad átkötni.',ok:false,fb:'Hibás! Átemelés alatt monitorozás (EtCO2) kell.'},{tx:'A mentő gépét kell a kórházban hagyni.',ok:false,fb:'Hibás!'}]},
{sit:'Az átemelés előtt melyik kábeleket kell eltávolítani a "hands off" végén?',opts:[{tx:'A pulzoximétert csak.',ok:false,fb:'Hibás!'},{tx:'Javasolt a betegen található mentős monitorkábelek eltávolítása, mert lassíthatják az átvételt és valós biztonságtöbbletet átemelés közben már nem adnak.',ok:true,fb:'Helyes! A beakadó kábelek veszélyesek.'},{tx:'Egyik kábelt sem szabad levenni.',ok:false,fb:'Hibás!'}]},
{sit:'A beteg alatt maradt a mentő lapáthordágya az intenzív ágyon. Mit kell tenned az átemelést követően?',opts:[{tx:'Mindenképpen vissza kell kérni azonnal, ha kell, fellökve az ápolókat.',ok:false,fb:'Hibás!'},{tx:'Törekedni kell a rögzítő eszközök (lapátágy) cseréjére. Ha csereeszköz nincs, akár rövid várakozás is megengedett a beteg érdekében.',ok:true,fb:'Helyes! Ha nincs csereágy, megvárjuk, amíg biztonságosan le lehet venni a beteget róla.'},{tx:'Ott kell hagyni örökre.',ok:false,fb:'Hibás!'}]},

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Tananyag</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+w(c.title)+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){
var c=CDATA.find(x=>x.id===id);if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+w(c.title)+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+w(s.t)+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+w(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+w(i)+'</li>').join('')+'</ul>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+w(b.tx)+'</div>';
  return '';
}

'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+

function renderQuiz(){

return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+w(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+w(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+w(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+w(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+w(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+w(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+w(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+w(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+w(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+w(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+w(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+w(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+w(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+w(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+w(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+w(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+w(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+w(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+w(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

// KALKULÁTOR RÉSZLEG: ISBAR és ATMISTER Szöveggenerátor
function updateISBAR() {
  var egység = document.getElementById('calc_egyseg').value || '[Azonosítás hiányzik]';
  var cel = document.getElementById('calc_cel').value || '[Hívott fél hiányzik]';
  var kor = document.getElementById('calc_kor').value || '[Életkor?]';
  var ido = document.getElementById('calc_ido').value || '[Kezdet ideje?]';
  var mech = document.getElementById('calc_mech').value || '[Panasz/Mechanizmus?]';
  var serules = document.getElementById('calc_serules').value || '[ABCD eltérés/Sérülés?]';
  
  var bp = document.getElementById('calc_bp').value;
  var hr = document.getElementById('calc_hr').value;
  var rr = document.getElementById('calc_rr').value;
  var spo2 = document.getElementById('calc_spo2').value;
  var gcs = document.getElementById('calc_gcs').value;
  
  var v_arr = [];
  if(bp && (bp < 100 || bp > 220)) v_arr.push("RR: " + bp + " Hgmm");
  if(hr && (hr < 40 || hr > 150)) v_arr.push("Pulzus: " + hr + " /perc");
  if(rr && (rr < 10 || rr > 29)) v_arr.push("Légzés: " + rr + " /perc");
  if(spo2 && spo2 < 90) v_arr.push("SpO2: " + spo2 + "%");
  if(gcs && gcs !== 'Éber (GCS 15)') v_arr.push("Tudat: " + gcs);
  
  var vitalsText = v_arr.length > 0 ? v_arr.join(", ") + ". Egyéb paraméterek rendben." : "Minden vitális paraméter a normál tartományban van.";

  var terápia = document.getElementById('calc_ter').value || 'Nem történt lényeges beavatkozás';
  var erkezes = document.getElementById('calc_erkezes').value || '[Érkezés?]';
  var javaslat = document.getElementById('calc_jav').value || '[Nincs különleges igény]';

  var isbar = "I (Azonosítás): " + egység + " vagyok, " + cel + "-t keresem.\n" +
              "S (Helyzet): Előrejelzés (vagy segélykérés) egy beteghez.\n" +
              "B (Háttér): " + kor + " éves beteg. " + ido + " óta a panasz: " + mech + ".\n" +
              "A (Értékelés): Sérülések/Tünetek: " + serules + ". Vitális paraméterek: " + vitalsText + ".\n" +
              "R (Javaslat): Terápia indult: " + terápia + ". Várható érkezésünk: " + erkezes + ". Szükséglet: " + javaslat + ".";

  document.getElementById('isbar_out').innerText = isbar;
}

function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Előrejelzés és Betegátadás</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v3.0 · 2026.02.25.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Tananyag','Minden eljárásrendi szabály'],['flash','🃏','Flashkártyák','Rövid ismeret-visszakérdezés'],['quiz','❓','Kvíz','Tudáspróba, 10 kérdés'],['sim','🚑','Szimuláció','B és B+ szintű esetek'],['calc','🧮','Kalkulátorok','ISBAR jelentés generátor']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af">Kattints a <span class="fw" onclick="showDict(\'prehospitális\')">lila szaggatott vonallal</span> jelölt kifejezésekre a szótárhoz!</div></div>';
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc') { c.innerHTML=renderCalc(); setTimeout(updateISBAR, 100); }
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

render();
</script>
</body>
</html>
