function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fd(s){
  if(!s) return '';
  s = h(s);
  DICT.forEach((d, i) => {
    s = s.replace(d.r, function(match) {
        return '<span class="dict-w" onclick="showD('+i+'); event.stopPropagation();">'+match+'</span>';

  });
  return s;

});

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+fd(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+fd(i)+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+fd(i)+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+fd(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+fd(b.tx)+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+fd(s.t)+'</div><div class="step-x">'+fd(s.x)+'</div></div></div>').join('');
  if(b.tp==='abadge') return '<div class="abadge"><div class="abcircle" style="background:'+b.color+'">'+b.letter+'</div><span style="font-size:13px;color:#9ca3af">vizsgálat</span></div>';
  if(b.tp==='ftable'){
    var lc={d:'#fca5a5',w:'#fde68a'};
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Jel / hang</th><th>Jelentés</th></tr></thead><tbody>'+b.rows.map(r=>'<tr><td style="font-weight:600;color:'+(lc[r.lv]||'#e5e7eb')+'">'+fd(r.s)+'</td><td style="color:#e5e7eb">'+fd(r.m)+'</td></tr>').join('')+'</tbody></table></div>';
  }
  if(b.tp==='avpu'){
    var av=[{l:'A',d:'Alert – Éber',c:'avpu-a'},{l:'V',d:'Verbal – Felszólításra',c:'avpu-v'},{l:'P',d:'Pain – Fájdalomingerre',c:'avpu-p'},{l:'U',d:'Unresponsive – Nem reagál',c:'avpu-u'}];
    return '<div class="g2" style="margin-bottom:.75rem">'+av.map(x=>'<div style="background:#262626;border:1px solid #3f3f3f;border-radius:10px;padding:.5rem .75rem;display:flex;gap:8px;align-items:center"><div style="width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0" class="'+x.c+'">'+x.l+'</div><div style="font-size:12px;color:#d1d5db">'+x.d+'</div></div>').join('')+'</div>';
  }
  if(b.tp==='status3'){
    return '<div class="g3" style="margin-bottom:.75rem"><div style="background:#450a0a;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#fca5a5">KERINGÉSMEGÁLLÁS<br>GYANÚJA</div><div style="background:#7f1d1d;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#fecaca">KRITIKUS<br>ÁLLAPOT</div><div style="background:#064e3b;border-radius:8px;padding:.5rem;text-align:center;font-size:11px;font-weight:700;color:#bbf7d0">ABCD<br>STABIL</div></div>';
  }
  if(b.tp==='gcs') return renderGCS();
  if(b.tp==='news2score') return renderNEWS2Score();
  if(b.tp==='news2risk') return renderNEWS2Risk();
  if(b.tp==='pedtri') return renderPedTri();
  if(b.tp==='peddiff') return renderPedDiff();
  if(b.tp==='pedparams') return renderPedParams();
  if(b.tp==='formulas') return b.items.map(i=>'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:.45rem .75rem;background:#2e1065;border-radius:8px;margin-bottom:5px"><span style="font-size:12px;color:#a78bfa">'+fd(i.l)+':</span><span style="font-size:13px;font-weight:700;color:#c4b5fd;font-family:monospace">'+fd(i.f)+'</span></div>').join('');
  if(b.tp==='sample') return renderSAMPLE();
  if(b.tp==='abbrev') return renderAbbrev();
  return '';
}

function calcN2(){
var p=0;
if(CA.rr<=8)p+=3;else if(CA.rr<=11)p+=1;else if(CA.rr<=20)p+=0;else if(CA.rr<=24)p+=1;else p+=3;
if(CA.spo2<=91)p+=3;else if(CA.spo2<=93)p+=2;else if(CA.spo2<=95)p+=1;
if(CA.o2)p+=2;
if(CA.sbp<=90)p+=3;else if(CA.sbp<=100)p+=2;else if(CA.sbp<=110)p+=1;else if(CA.sbp>=220)p+=3;
if(CA.hr<=40)p+=3;else if(CA.hr<=50)p+=1;else if(CA.hr<=90)p+=0;else if(CA.hr<=110)p+=1;else if(CA.hr<=130)p+=2;else p+=3;
p+=CA.c;
if(CA.t<=35.0)p+=3;else if(CA.t<=36.0)p+=1;else if(CA.t<=38.0)p+=0;else if(CA.t<=39.0)p+=1;else p+=2;
return p;
}

var n2lbl=n2p>=7?'Magas kockázat':n2p>=5?'Közepes kockázat':'Alacsony kockázat';
var n2rec=n2p>=7?'Azonnali folyamatos monitorozás. SEGÉLYKOCSI KÉRÉSE!':n2p>=5?'Azonnali folyamatos eszközös monitorozás. Nem megfelelő kompetencia → segélykocsi.':'Eszközös monitorozás nem szükséges. Folyamatos követés elengedhetetlen.';

function tabBtn(id,lbl){return '<button onclick="setCalcTab(\''+id+'\')" style="flex:1;padding:.4rem;border:1px solid '+(CA.tab===id?'#14b8a6':'#3f3f3f')+';border-radius:8px;background:'+(CA.tab===id?'#14b8a6':'#2a2a2a')+';color:'+(CA.tab===id?'#111827':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+lbl+'</button>';}
function modeBtn(id,lbl){return '<button onclick="setGCSMode(\''+id+'\')" style="flex:1;padding:.35rem;border:1px solid '+(CA.mode===id?'#8b5cf6':'#3f3f3f')+';border-radius:7px;background:'+(CA.mode===id?'#8b5cf6':'#2a2a2a')+';color:'+(CA.mode===id?'#fff':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+lbl+'</button>';}
function sel(lb,id,opts,val,fn){return '<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:3px">'+lb+'</div><select id="'+id+'" onchange="'+fn+'(this.value)">'+opts.map(([v,l])=>'<option value="'+v+'" '+(String(v)===String(val)?'selected':'')+'>'+v+' – '+h(l)+'</option>').join('')+'</select></div>';}
function slid(lb,id,mn,mx,st,val,fn,unit){return '<div style="margin-bottom:.65rem"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><div style="font-size:11px;font-weight:600;color:#9ca3af">'+lb+'</div><span id="'+id+'_v" style="font-size:13px;font-weight:700;color:#f3f4f6">'+val+(unit||'')+'</span></div><input type="range" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+val+'" oninput="'+fn+'(this.value)" onchange="'+fn+'(this.value)"></div>';}

return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2><div style="display:flex;gap:4px;margin-bottom:.75rem">'+tabBtn('vt','VT IPPV')+tabBtn('gcs','GCS')+tabBtn('news2','NEWS2')+tabBtn('ped','Gyermek RR')+'</div>'+
(CA.tab==='vt'?
'<div class="note">'+fd('A magasságból számolt, ideális testtömegre vetített légzési térfogat (VT) 6 ml/ttkg esetén gépi lélegeztetéshez (IPPV).')+'</div>'+sel('Beteg neme','gen',[['f','Nő'],['m','Férfi']],CA.gender,'setGen')+sel('Beteg testmagassága','hei',Object.keys(vtData).map(k=>[k,k+' cm']),CA.height,'setHei')+'<div class="res-box"><div class="res-lbl" style="color:#d1d5db">Javasolt Légzési Térfogat (VT)</div><div class="res-num" style="color:#14b8a6">'+vtVal+' ml</div></div><div class="card" style="margin-top:1rem;background:#1e3a8a20;border-color:#1e3a8a"><div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:4px">További ajánlott IPPV paraméterek:</div><ul style="margin:0;padding-left:15px;font-size:11px;color:#bfdbfe;line-height:1.6"><li>Kezdetben 100% O2 (cél: 88-92% SpO2)</li><li>I:E arány: 1:3 vagy 1:4 (hosszú kilégzési idő)</li><li>PEEP: 5-8 mbar</li><li>Frekvencia: 10-12/perc</li><li>Pmax: 40 mbar</li></ul></div>'
: CA.tab==='gcs'?
'<div style="display:flex;gap:6px;margin-bottom:.75rem">'+modeBtn('adult','Felnőtt')+modeBtn('child','Gyermek')+modeBtn('infant','Csecsemő')+'</div>'+sel('Szemnyitás','gce',[['4','Spontán'],['3','Felszólításra'],['2','Fájdalomingerre'],['1','Nincs']],CA.e,'setGCSE')+sel('Verbális válasz','gcv',gcsV[CA.mode],CA.v,'setGCSV')+sel('Motoros válasz','gcm',gcsM[CA.mode],CA.m,'setGCSM')+'<div class="res-box" style="background:'+gi.bg+';border:1px solid '+gi.col+'40"><div class="res-num" style="color:'+gi.col+'">'+gi.tot+'</div><div class="res-lbl" style="color:'+gi.col+'">'+gi.lbl+'</div><div style="font-size:11px;color:#9ca3af">Szem: '+CA.e+' | Verbális: '+CA.v+' | Motor: '+CA.m+'</div></div>'
: CA.tab==='ped'?
'<div class="card"><div style="font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px">Életkor (év, 1-12 között)</div><input type="number" min="1" max="12" value="'+CA.page+'" oninput="setPage(this.value)" onchange="setPage(this.value)"><div class="res-box" style="background:#172554;border:1px solid #1e3a8a;margin-top:1rem"><div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Normál szisztolés vérnyomás:</div><div id="ped_norm" style="font-size:32px;font-weight:700;color:#60a5fa;margin-bottom:1rem">'+ped.norm+' Hgmm</div><div style="font-size:13px;color:#bfdbfe;margin-bottom:4px">Alsó (még tolerabilis) határ:</div><div id="ped_min" style="font-size:24px;font-weight:700;color:#fca5a5">'+ped.min+' Hgmm</div></div><div style="font-size:12px;color:#9ca3af;margin-top:1rem;line-height:1.5">A vérnyomásesés gyermekek esetén csak nagyon későn jelentkezik, mely fenyegető kardiovaszkuláris összeomlást jelez. Már enyhén csökkent érték esetén is gyors és agresszív beavatkozás kell.</div></div>'
:
slid('Légzésszám','n2rr',4,40,1,CA.rr,'setN2rr','/perc')+slid('SpO2','n2spo2',80,100,1,CA.spo2,'setN2spo2','%')+'<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:4px">Oxigén szükséges?</div><div style="display:flex;gap:6px">'+[['0','Nem (0 pt)'],['1','Igen (+2 pt)']].map(([v,l])=>'<button onclick="setN2o2('+v+')" style="flex:1;padding:6px;border:1px solid '+(CA.o2==v?'#14b8a6':'#3f3f3f')+';border-radius:7px;background:'+(CA.o2==v?'#14b8a6':'#2a2a2a')+';color:'+(CA.o2==v?'#111827':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+l+'</button>').join('')+'</div></div>'+slid('Szisztolés vérnyomás','n2sbp',60,240,1,CA.sbp,'setN2sbp',' Hgmm')+slid('Pulzusszám','n2hr',30,180,1,CA.hr,'setN2hr','/perc')+'<div style="margin-bottom:.65rem"><div style="font-size:11px;font-weight:600;color:#9ca3af;margin-bottom:4px">Tudatállapot</div><div style="display:flex;gap:6px">'+[['0','Éber / A'],['3','Zavart / V / P / U (+3 pt)']].map(([v,l])=>'<button onclick="setN2c('+v+')" style="flex:1;padding:6px;border:1px solid '+(CA.c==v?'#14b8a6':'#3f3f3f')+';border-radius:7px;background:'+(CA.c==v?'#14b8a6':'#2a2a2a')+';color:'+(CA.c==v?'#111827':'#d1d5db')+';cursor:pointer;font-size:12px;font-weight:600;font-family:inherit">'+l+'</button>').join('')+'</div></div>'+slid('Testhőmérséklet','n2temp',34,42,0.1,CA.t,'setN2temp','°C')+'<div class="res-box" style="background:'+n2bg+';border:1px solid '+n2col+'40"><div class="res-num" style="color:'+n2col+'">'+n2p+'</div><div class="res-lbl" style="font-weight:700;color:'+n2col+'">'+n2lbl+'</div><div style="font-size:12px;color:#9ca3af;text-align:left;margin-top:.35rem">'+fd(n2rec)+'</div>'+(n2p>=5?'<div style="font-size:11px;color:#fdba74;margin-top:.35rem">⚠ Ha infekció jelei is fennállnak: gondolj SZEPSZISRE!</div>':'')+'</div>');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};
window.setCalcTab=function(t){CA.tab=t;render();};
window.setGCSMode=function(m){CA.mode=m;CA.e=4;CA.v=5;CA.m=6;render();};
window.setGen=function(v){CA.gender=v;render();};
window.setHei=function(v){CA.height=v;render();};
function upGCS(){var gi=gcsInterp();var rb=document.querySelector('.res-box');if(!rb)return;rb.style.background=gi.bg;rb.style.borderColor=gi.col+'40';rb.innerHTML='<div class="res-num" style="color:'+gi.col+'">'+gi.tot+'</div><div class="res-lbl" style="color:'+gi.col+'">'+gi.lbl+'</div><div style="font-size:11px;color:#9ca3af">Szem: '+CA.e+' | Verbális: '+CA.v+' | Motor: '+CA.m+'</div>';}
function upN2(){var n2p=calcN2();var rb=document.querySelector('.res-box');if(!rb)return;var col=n2p>=7?'#fca5a5':n2p>=5?'#fdba74':'#4ade80';var bg=n2p>=7?'#450a0a':n2p>=5?'#431407':'#064e3b';var lbl=n2p>=7?'Magas kockázat':n2p>=5?'Közepes kockázat':'Alacsony kockázat';var rec=n2p>=7?'Azonnali folyamatos monitorozás. SEGÉLYKOCSI KÉRÉSE!':n2p>=5?'Azonnali folyamatos eszközös monitorozás. Nem megfelelő kompetencia → segélykocsi.':'Eszközös monitorozás nem szükséges. Tünetek folyamatos követése elengedhetetlen.';rb.style.background=bg;rb.style.borderColor=col+'40';rb.innerHTML='<div class="res-num" style="color:'+col+'">'+n2p+'</div><div class="res-lbl" style="font-weight:700;color:'+col+'">'+lbl+'</div><div style="font-size:12px;color:#9ca3af;text-align:left;margin-top:.35rem">'+h(rec)+'</div>'+(n2p>=5?'<div style="font-size:11px;color:#fdba74;margin-top:.35rem">⚠ Ha infekció jelei is fennállnak: gondolj SZEPSZISRE!</div>':'');var sv=document.getElementById('n2rr_v');if(sv)sv.textContent=CA.rr+'/perc';var sp=document.getElementById('n2spo2_v');if(sp)sp.textContent=CA.spo2+'%';var ss=document.getElementById('n2sbp_v');if(ss)ss.textContent=CA.sbp+' Hgmm';var sh=document.getElementById('n2hr_v');if(sh)sh.textContent=CA.hr+'/perc';var st=document.getElementById('n2temp_v');if(st)st.textContent=CA.t+'°C';}
window.setGCSE=function(v){CA.e=+v;upGCS();};
window.setGCSV=function(v){CA.v=+v;upGCS();};
window.setGCSM=function(v){CA.m=+v;upGCS();};
window.setN2rr=function(v){CA.rr=+v;upN2();};
window.setN2spo2=function(v){CA.spo2=+v;upN2();};
window.setN2o2=function(v){CA.o2=+v;render();};
window.setN2sbp=function(v){CA.sbp=+v;upN2();};
window.setN2hr=function(v){CA.hr=+v;upN2();};
window.setN2c=function(v){CA.c=+v;render();};
window.setN2temp=function(v){CA.t=parseFloat(parseFloat(v).toFixed(1));upN2();};

// Itt a javítás, amely megakadályozza, hogy a teljes render() fusson 
// minden karakternél, és helyette csak a DOM-ot frissíti:
window.setPage=function(v){
  CA.page=+v;
  var ped=calcPed();
  var pn=document.getElementById('ped_norm');
  var pm=document.getElementById('ped_min');
  if(pn) pn.textContent=ped.norm+' Hgmm';
  if(pm) pm.textContent=ped.min+' Hgmm';
};

render();
</script>
</body>
</html>
