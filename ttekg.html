function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function t(str){
  let s=h(str);

    s=s.replace(r, '$1<span class="dw" onclick="sD(\''+k+'\')">$2</span>');
  });
  return s;
}

window.cD=function(e){

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+t(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+t(i)+'</li>').join('')+'</ul>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+t(b.tx)+'</div>';
  if(b.tp==='tx') return '<div style="font-size:13px;color:#d1d5db;margin-bottom:.5rem;line-height:1.6">'+t(b.tx)+'</div>';
  return '';
}

function renderChapter(id){
  var c=CDATA.find(x=>x.id===id);if(!c)return '';
  return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
  '<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
  '<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+h(c.title)+'</h2></div>'+
  c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+h(s.t)+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');

    '<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
    '<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
    '<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
    (QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+

    '<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
  }
  var q=QUIZ[QZ.idx];
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+

  q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+t(opt)+'</button>';}).join('')+

function renderSim(){
  if(!SI.id){
    return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
    SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
    '<span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;background:'+(s.diff==='B kompetencia'?'#064e3b':'#78350f')+';color:'+(s.diff==='B kompetencia'?'#ecfdf5':'#fef3c7')+'">'+s.diff+'</span></div>'+
    '<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+t(s.desc)+'</div>'+
    '<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
  }
  var sim=SIMS.find(s=>s.id===SI.id);
  if(SI.fin){
    var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
    return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
    '<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
    '<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
    '<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
    '<div class="al al-i"><strong>Összefoglaló:</strong><br><br>'+t(sim.summary)+'</div>'+
    SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+t(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+t(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+t(opt.fb)+'</div></div>';}).join('')+
    '<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
  }
  var step=sim.steps[SI.step];
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
  '<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
  (SI.step===0?'<div class="al al-i">'+t(sim.desc)+'</div>':'')+
  '<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+t(step.sit)+'</p></div>'+
  step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+t(opt.tx)+'</button>';}).join('')+
  (SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+t(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function processCalc(){
  let resText = "";
  let isApolo = (CALC.comp === 'apolo');
  let isCardiac = (CALC.cardiac === 'igen');
  let isDocNoECG = (CALC.doc_noekg === 'igen');
  let isECGClear = (CALC.ecg_clear === 'igen');
  let isLysisReq = (CALC.lysis === 'igen');

  if(!isCardiac) {
    resText = "<div style='font-size:18px;font-weight:700;color:#fde68a;margin-bottom:5px'>TTEKG általában NEM szükséges.</div><div style='font-size:12px;color:#9ca3af'>Ha nem kardiális a panasz, az eljárásrend alapján alapesetben nincs kötelező TTEKG indikáció.</div>";
  } else {
    // Kardiális panasz esetén
    if(isApolo) {
      resText = "<div style='font-size:18px;font-weight:700;color:#fca5a5;margin-bottom:5px'>TTEKG elkészítése KÖTELEZŐ!</div><div style='font-size:12px;color:#fecaca'>Mentőápolóként kardiális panasz gyanúja esetén MINDEN esetben el kell készítened a TTEKG-t.</div>";
    } else {
      // Orvos vagy Mentőtiszt
      if(!isECGClear) {
         resText = "<div style='font-size:18px;font-weight:700;color:#fca5a5;margin-bottom:5px'>TTEKG elkészítése KÖTELEZŐ!</div><div style='font-size:12px;color:#fecaca'>Orvos/Mentőtiszt esetén nem egyértelmű EKG (diagnosztikus bizonytalanság) esetén MINDEN esetben TTEKG-t kell készíteni.</div>";
      } else {
        if(isLysisReq) {
           resText = "<div style='font-size:18px;font-weight:700;color:#fca5a5;margin-bottom:5px'>TTEKG elkészítése KÖTELEZŐ!</div><div style='font-size:12px;color:#fecaca'>Mivel a helyszíni lízis indikált vagy a fogadó orvos kéri, egyértelmű EKG esetén is kötelező a TTEKG elkészítése.</div>";
        } else {
           resText = "<div style='font-size:18px;font-weight:700;color:#4ade80;margin-bottom:5px'>TTEKG elkészítése NEM kötelező.</div><div style='font-size:12px;color:#bbf7d0'>Egyértelmű, diagnosztikus értékű EKG esetén, ha lízis nem indikált és fogadó orvos sem kéri, TTEKG készítésére általában nincs szükség.</div>";
        }
      }
    }
    // Felülbírálat orvosi beutaló esetén
    if(isDocNoECG && resText.indexOf('NEM kötelező') > -1) {
       resText = "<div style='font-size:18px;font-weight:700;color:#fca5a5;margin-bottom:5px'>TTEKG elkészítése KÖTELEZŐ!</div><div style='font-size:12px;color:#fecaca'>Bár az EKG egyértelmű lehetne, de mivel a beteget kardiális panasszal orvos látta EKG KÉSZÍTÉSE NÉLKÜL, a protokoll a TTEKG készítését írja elő!</div>";
    }
  }
  return resText;
}

function renderCalc(){
  let html = '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">TTEKG Döntéstámogató</h2>'+
  '<div class="card" style="background:#262626">'+
  '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:3px">Ellátó egység vezetője:</div>'+
  '<select onchange="CALC.comp=this.value;render()">'+
  '<option value="apolo" '+(CALC.comp==='apolo'?'selected':'')+'>Ápoló / Mentőápoló</option>'+
  '<option value="orvos" '+(CALC.comp==='orvos'?'selected':'')+'>Orvos / Mentőtiszt</option>'+
  '</select>'+

  '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:3px">A panaszok kardiális eredete felmerül (pl. ACS, ritmuszavar, kollapszus)?</div>'+
  '<select onchange="CALC.cardiac=this.value;render()">'+
  '<option value="igen" '+(CALC.cardiac==='igen'?'selected':'')+'>Igen, felmerül</option>'+
  '<option value="nem" '+(CALC.cardiac==='nem'?'selected':'')+'>Nem merül fel</option>'+
  '</select>';

  if(CALC.cardiac==='igen') {
    html += '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:3px">A beteget kardiális panasz miatt orvos korábban látta/beutalta úgy, hogy EKG NEM készült?</div>'+
    '<select onchange="CALC.doc_noekg=this.value;render()">'+
    '<option value="nem" '+(CALC.doc_noekg==='nem'?'selected':'')+'>Nem / Nem releváns / Készült EKG</option>'+
    '<option value="igen" '+(CALC.doc_noekg==='igen'?'selected':'')+'>Igen, orvos látta EKG nélkül</option>'+
    '</select>';

    if(CALC.comp==='orvos') {
      html += '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:3px">Készült 12 elvezetéses EKG, ami EGYÉRTELMŰEN diagnosztikus?</div>'+
      '<select onchange="CALC.ecg_clear=this.value;render()">'+
      '<option value="nem" '+(CALC.ecg_clear==='nem'?'selected':'')+'>Nem diagnosztikus / bizonytalan eltérések</option>'+
      '<option value="igen" '+(CALC.ecg_clear==='igen'?'selected':'')+'>Igen, egyértelmű és diagnosztikus</option>'+
      '</select>';

      if(CALC.ecg_clear==='igen') {
         html += '<div style="font-size:12px;font-weight:600;color:#9ca3af;margin-bottom:3px">A helyszíni lízis indikált, VAGY a fogadó orvos kifejezetten kéri a TTEKG-t?</div>'+
         '<select onchange="CALC.lysis=this.value;render()">'+
         '<option value="nem" '+(CALC.lysis==='nem'?'selected':'')+'>Nem indikált / Nem kérik</option>'+
         '<option value="igen" '+(CALC.lysis==='igen'?'selected':'')+'>Igen</option>'+
         '</select>';
      }
    }
  }
  
  html += '<div style="margin-top:1rem;background:#1e1e1e;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;text-align:center">'+
  processCalc()+
  '</div></div>';

  return html;
}

function render(){
  var c=document.getElementById('ct');c.innerHTML='';
  if(SCR==='home')c.innerHTML=renderHome();
  else if(SCR==='chapters')c.innerHTML=renderChapters();
  else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
  else if(SCR==='flash')c.innerHTML=renderFlash();
  else if(SCR==='quiz')c.innerHTML=renderQuiz();
  else if(SCR==='sim')c.innerHTML=renderSim();
  else if(SCR==='calc')c.innerHTML=renderCalc();
  var tabs=['home','chapters','flash','quiz','sim','calc'];
  var active=SCR==='chapter'?'chapters':SCR;
  document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
  window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){FC.cat=c;FC.idx=0;FC.flip=false;render();};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

// Init app
render();
</script>
</body>
</html>
