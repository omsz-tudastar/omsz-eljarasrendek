<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ Prehospitális Eljárásrend & Betegvizsgálat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;}
.app{max-width:800px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);position:relative;}

/* NAVIGÁCIÓ */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);overflow-x:auto;}
.nb{flex:1;min-width:70px;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#14b8a6;}
.ni{font-size:16px;}
.nl{font-size:10px;color:#9ca3af;font-weight:400;text-transform:uppercase;letter-spacing:0.05em;}
.nb.act .nl{color:#14b8a6;font-weight:700;}

/* TARTALOM ÉS KÁRTYÁK */
.ct{padding:1rem;}
h1, h2, h3{color:#f3f4f6;line-height:1.3;}
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}

/* KIEMELÉSEK */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.3rem;}
.dict-word{color:#5eead4;border-bottom:1px dashed #5eead4;cursor:pointer;font-weight:600;}
.dict-word:hover{color:#2dd4bf;border-bottom-color:#2dd4bf;}

/* MODAL / SZÓTÁR */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
.modal{background:#262626;border:1px solid #3f3f3f;border-radius:12px;padding:1.5rem;width:100%;max-width:400px;position:relative;}
.modal-close{position:absolute;top:10px;right:10px;background:none;border:none;color:#9ca3af;font-size:24px;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.modal-close:hover{background:#3f3f3f;color:#fff;}
.modal-title{font-size:16px;font-weight:700;color:#f3f4f6;margin-bottom:.5rem;text-transform:capitalize;}
.modal-desc{font-size:14px;color:#d1d5db;line-height:1.6;}

/* GOMBOK */
.btn{padding:.6rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;font-weight:600;transition:all .15s;text-align:center;display:inline-block;}
.btn:hover{background:#374151;}
.btn-g{background:#0d9488;color:#fff;border-color:#0d9488;}
.btn-g:hover{background:#0f766e;}
.btn-r{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn-fw{width:100%;display:block;}

/* SZIMULÁCIÓ / KVÍZ */
.opt{width:100%;display:block;padding:.8rem 1rem;margin-bottom:8px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.5;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}
.prog{height:6px;background:#333;border-radius:3px;margin-bottom:1rem;overflow:hidden;}
.progb{height:100%;border-radius:3px;transition:width .3s;}
.tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;}
.tag-b{background:#1e3a8a;color:#bfdbfe;}
.tag-bp{background:#701a75;color:#fbcfe8;}

/* TÁBLÁZATOK ÉS INPUTOK */
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:6px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:6px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;}

input[type=number], input[type=range]{width:100%;background:#2a2a2a;border:1px solid #4b5563;border-radius:8px;padding:10px;color:#e5e7eb;font-family:inherit;font-size:14px;margin-bottom:.5rem;accent-color:#14b8a6;}
input[type=range]{padding:0;border:none;height:20px;background:transparent;}
select{width:100%;padding:10px;border-radius:8px;border:1px solid #4b5563;background:#2a2a2a;font-size:14px;color:#e5e7eb;font-family:inherit;margin-bottom:.5rem;}

.res-box{border-radius:12px;padding:1rem;text-align:center;margin-top:.75rem;}
.res-num{font-size:42px;font-weight:700;}
.res-lbl{font-size:14px;margin:.3rem 0;}
</style>
</head>

<div class="app">

// --- SZÓTÁR (MODAL TARTALOM) ---
const DICT = {
  'hypoxia': 'Oxigénhiány. Gyermekeknél és vízből mentetteknél a keringésmegállás vezető oka. Az újraélesztés során azonnal oxigén adása és hatékony lélegeztetés szükséges.',

  'pneumothorax': 'Feszülő (tenziós) légmell. A levegő nyomása gátolja a vénás visszaáramlást a szívbe. Subcutan emphysema jelezheti. Prehospitálisan azonnali tűdekompressziót igényel.',

  'rosc': 'Return of Spontaneous Circulation - Spontán keringés visszatérése. Kapnográfia (EtCO2) hirtelen, jelentős megemelkedése is jelezheti. ABCDE és postresuscitatios ellátás követi.',

  'cabcde': 'Súlyos traumás betegek algoritmusa. A "c" a katasztrofális külső vérzés azonnali csillapítását jelenti a nyaki gerinc védelme (MILS) mellett, mielőtt a légutat vizsgálnánk.',
  'capnografia': 'A kilégzett CO2 (EtCO2) mérése. ALS során kötelező az emelt légúti eszközön! Mutatja a kompresszió hatékonyságát és a ROSC beálltát.',
  'mils': 'Manual In-Line Stabilization - A nyaki gerinc kézi rögzítése trauma esetén. Ennek alkalmazása mellett a légutat csak az áll kiemelésével (fej hátrahajtása nélkül) szabad megnyitni.',
  'avpu': 'Tudatállapot vizsgáló skála. A: Alert (éber), V: Verbal (hangra reagál), P: Pain (fájdalomra reagál), U: Unresponsive (nem reagál).',
  'crt': 'Kapilláris Újratelődési Idő. A körömágyon vagy a szegycsonthoz nyomva 5 másodpercig. Normál értéke: ≤ 2 másodperc. A perifériás keringést mutatja.',
  'szepszis': 'Súlyos, életveszélyes állapot, a szervezet fertőzésre adott kóros válasza. Ha a NEWS2 pontszám ≥ 5 ÉS fertőzés jelei vannak jelen, azonnal szepszisre kell gondolni!'
};

// --- TANANYAG / ELJÁRÁSREND TARTALOM ---
const GUIDES = [
{id:'alapok', t:'1. ABCDE Betegvizsgálat Alapelvei', txt:`
<div class="al al-i">A prehospitális sürgősségi betegvizsgálat célja az életveszély azonosítása és azonnali elhárítása. Szisztematikus, ABCDE sorrendű vizsgálatot igényel.</div>
<h3 style="color:#14b8a6;margin-bottom:5px;">Első benyomások (Nulladik lépés)</h3>
<ul class="bl">
  <li><b>Helyszínbiztonság:</b> Veszélyes helyszínen NE közelítsd meg a beteget! Egyéni védőfelszerelés felvétele.</li>
  <li>Reakcióképesség vizsgálata: Hangos megszólítás és a váll kíméletes megrázása egyidőben.</li>
  <li>Ha nincs reakció: azonnali ALS (segélykocsi) hívása és életjelenségek vizsgálata (Légút, Hármas érzékelés 10 mp-ig).</li>
</ul>
<h3 style="color:#14b8a6;margin-bottom:5px;margin-top:15px;">A szisztematikus ABCDE</h3>
<ul class="bl">
  <li><b>A (Légút):</b> Áttekinthetőség, horkolás, szörcsölés, stridor. Fenyegetett légút (pl. égés, trauma) felismerése.</li>
  <li><b>B (Légzés):</b> Frekvencia, szimmetria, légzési munka. Minden kritikus betegnél AZONNAL 100% oxigén adása!</li>
  <li><b>C (Keringés):</b> Pulzus, bőrszín, <span class="dict-word" onclick="shD('crt')">CRT</span>. Szükség esetén (B+ szinttől) vénabiztosítás, monitorozás.</li>
  <li><b>D (Idegrendszer):</b> <span class="dict-word" onclick="shD('avpu')">AVPU</span> skála, pupillák. Megváltozott tudat esetén <b>kötelező a vércukormérés</b>!</li>
  <li><b>E (Egyéb):</b> Testtájékok vizsgálata, lázmérés, hűtés/melegítés, SAMPLE anamnézis.</li>
  <li>A vizsgálat elölről (A-tól) ismétlendő állapotváltozás, beavatkozás, vagy betegmozgatás után!</li>
</ul>
`},
{id:'trauma', t:'2. Trauma és cABCDE', txt:`
<div class="al al-d">Sérülés gyanúja esetén az ellátás kiegészül a <span class="dict-word" onclick="shD('cabcde')">cABCDE</span> elvvel, ami megelőzi a klasszikus légútvizsgálatot is.</div>
<ul class="bl">
  <li><b>C (Catastrophic hemorrhage):</b> A katasztrofális külső vérzés azonnali csillapítása (Tourniquet, direkt nyomás).</li>
  <li><b>A (Légút) + Nyaki gerinc:</b> <span class="dict-word" onclick="shD('mils')">MILS</span> (nyaki gerinc kézi rögzítése) mellett a légutat <b>kizárólag az áll kiemelésével</b> biztosítjuk, a fej hátrahajtása TILOS!</li>
  <li><b>B (Légzés):</b> A mellkas megtekintése és megtapintása kötelező. <span class="dict-word" onclick="shD('pneumothorax')">Feszülő légmell (PTX)</span> esetén azonnali tűdekompresszió szükséges (B+ kompetencia).</li>
  <li><b>C (Keringés):</b> A medence vizsgálata <b>bármilyen irányú nyomással szigorúan tilos!</b> Ránézéssel és mechanizmus alapján kell dönteni a medencerögzítőről. Hypovolaemiás shock esetén agresszív folyadékterápia (krisztalloid, Tranexámsav).</li>
  <li>A ruházatot teljesen el kell távolítani a sérülések felméréséhez, de utána azonnali hővédelem (kihűlés elleni védelem) szükséges.</li>
</ul>
`},
{id:'cpr', t:'3. Újraélesztés (BLS és ALS)', txt:`
<div class="al al-s">Keringésmegállás gyanújakor törekedjünk a beteg 360°-os körüljárhatóságának biztosítására!</div>
<h3 style="color:#14b8a6;margin-bottom:5px;">Alapszintű Újraélesztés (BLS)</h3>
<ul class="bl">
  <li>Eszméletlen betegnél a hármas érzékelés pontosan 10 másodpercig tart. Az agonális (gaspoló, tátogó, furcsa) légzés <b>nem normális</b>, keringésmegállást jelent!</li>
  <li>Felnőttnél azonnal mellkasi kompressziókkal kezdünk (30:2 arány). Mélység: 5-6 cm, frekvencia 100-120/perc.</li>
  <li>Az AED érkezésekor azonnal fel kell rakni. A töltés alatt a kompresszió folytatódik.</li>
  <li>Sokk leadása után AZONNAL 2 perc CPR következik, ritmus/pulzus ellenőrzés nélkül!</li>
</ul>
<h3 style="color:#14b8a6;margin-bottom:5px;margin-top:15px;">Emelt Szintű Újraélesztés (ALS)</h3>
<ul class="bl">
  <li><b>Sokkolandó ritmusok:</b> <span class="dict-word" onclick="shD('vf')">Kamrafibrilláció (VF)</span>, Pulzus nélküli VT. Sokk (150-200J). Adrenalin (1 mg) a 3. sokk után, majd 3-5 percenként.</li>
  <li><b>Nem sokkolandó ritmusok:</b> <span class="dict-word" onclick="shD('asystolia')">Asystolia</span>, <span class="dict-word" onclick="shD('pea')">PEA</span>. Nincs sokk. Adrenalin (1 mg) AZONNAL, majd 3-5 percenként.</li>
  <li>A kompressziót végzőt 2 percenként cserélni kell. A szünet (ritmusanalízishez) nem lehet több 5 másodpercnél!</li>
  <li>Emelt légúti eszköz (LMA/Tubus) esetén: folyamatos kompresszió, és függetlenül 10/perc lélegeztetés. <span class="dict-word" onclick="shD('capnografia')">Kapnográfia</span> használata kötelező!</li>
</ul>
`},
{id:'gyermek', t:'4. Gyermek Ellátás és CPR', txt:`
<div class="al al-w">Gyermekeknél a keringésmegállás döntően <span class="dict-word" onclick="shD('hypoxia')">hypoxia</span> (oxigénhiány) talaján alakul ki, így az algoritmus némileg eltér a felnőttekétől.</div>
<h3 style="color:#f472b6;margin-bottom:5px;">Gyermek Állapotfelmérés és ABCDE</h3>
<ul class="bl">
  <li>Első megközelítéskor a <b>PAT (Állapotfelmérés Háromszöge)</b> alkalmazandó: Küllem, Légzési munka, Keringés (bőrszín). Ha bármelyik kóros, a gyermek kritikus állapotú. Ez a vizuális felmérés nem helyettesíti a fizikális ABCDE-t!</li>
  <li>A gyermekek sokáig kompenzálnak. A <b>vérnyomásesés nagyon későn jelenik meg</b>, és fenyegető kardiovaszkuláris összeomlást jelez! Enyhe csökkenésnél is azonnali, agresszív beavatkozás kell.</li>
</ul>
<h3 style="color:#f472b6;margin-bottom:5px;margin-top:15px;">Gyermek Újraélesztés (PBLS / ALS)</h3>
<ul class="bl">
  <li>A légzés hiánya esetén az ellátás <b>5 KEZDETI BEFÚVÁSSAL</b> indul! Csak ezután jönnek a kompressziók.</li>
  <li>Szakellátói (mentős) kompresszió : lélegeztetés arány = <b>15 : 2</b>.</li>
  <li>Kompresszió mélysége: a mellkas nyílirányú (AP) átmérőjének kb. 1/3-a.</li>
  <li>Defibrillálás: 4 J/kg. Adrenalin: 10 µg/kg (0,01 mg/kg).</li>
</ul>
`}
];

const SIM_DATA = [
{

  summary: 'Részletes Összefoglaló (Trauma B+): A helyszínbiztonság után a trauma protokoll (cABCDE) lépett életbe: a nyaki gerinc manuális rögzítése (MILS) mellett történt a katasztrofális vérzések keresése. Az "A" (Légút) vizsgálatánál a fejet nem hajtottuk hátra, csak az állat emeltük ki a MILS mellett. A "B" (Légzés) fázisban a mellkas lemeztelenítése, megtekintése és megtapintása egyértelműen subcutan emphysemát és feszülő PTX-et igazolt. B+ kompetenciának megfelelően azonnali életmentő tűdekompressziót (detenzionálást) hajtottunk végre oxigén adása mellett. A "C" (Keringés) vizsgálata során a medencét csak vizuálisan értékeltük, a mechanikus nyomkodást szigorúan elkerültük. A shock jelei miatt vénát biztosítottunk és folyadékterápiát kezdtünk. A "D" (Tudat) fázisban a zavartság miatt kötelezően vércukrot mértünk a vénás tűből. Az "E" (Egyéb) lépésnél a ruházat eltávolítása után a hypothermia megelőzése érdekében azonnali hővédelmet alkalmaztunk. A 12-elvezetéses EKG-t elhagytuk az időnyerés érdekében. A mentőautóba helyezés (mozgatás) után a teljes szisztematikus ABCDE felmérést újra elölről kezdtük.'
},

  summary: 'Részletes Összefoglaló (Láz/Szepszis B+): Az idős, magas lázzal és szapora légzéssel küzdő beteg megközelítésekor azonnal megállapítottuk, hogy állapota kritikus. Az "A" (Légút) átjárható volt, de a "B" (Légzés) során mért hypoxia miatt azonnal 100% oxigénterápiát indítottunk. A "C" (Keringés) fázisban a hypotensio (95 Hgmm) és tachycardia miatt vénát biztosítottunk és folyamatos monitorozást építettünk ki. A "D" (Idegrendszer) alatt kötelező vércukormérést végeztünk a kanülből. Az "E" (Egyéb) vizsgálat magas lázat igazolt. A mért értékek alapján kiszámolt NEWS2 pontszám >7 lett ("Red score"), ami a lázzal kiegészülve egyértelműen SZEPSZIS gyanúját vetette fel. Mivel ez magas klinikai rizikót jelent, azonnal segélykocsit (ALS) kértünk. Az állapot folyamatos monitorozása és a 5-10 percenként ismételt ABCDE vizsgálat közben a beteg eszméletét vesztette, légútja elzáródott. Az eljárásrendnek megfelelően azonnal reagáltunk (ABCDE újra), pozicionáltuk a légutat, majd a légzés leállásakor haladéktalanul megkezdtük a mellkasi kompressziókat és a BLS protokollt a segélykocsi megérkezéséig.'

  summary: 'Részletes Összefoglaló (Gyermek PBLS B kompetencia): A medencéből kimentett 5 éves kislány eszméletlen volt (a reakcióképesség vizsgálata negatív). B kompetenciájú egységként első dolgunk volt azonnal rádiózni gyermek ALS (segélykocsi) támogatásért. A légút óvatos megnyitása után a 10 másodperces hármas érzékelés igazolta a légzés hiányát. Mivel a gyermekkori (és vízbefulladásos) esetekben a hypoxia a domináns ok, az újraélesztést a felnőtt protokolltól eltérően 5 KEZDETI BEFÚVÁSSAL kezdtük (ballonos-maszkos, oxigénes módszerrel). Ezt követően, mivel nem jelent meg életjel, azonnal megkezdtük a mellkasi kompressziókat a mellkas 1/3-ának mélységéig (kb. 5 cm). Szakellátóként a PBLS arányt, azaz 15 kompresszió és 2 lélegeztetés (15:2) ciklusait alkalmaztuk. Az AED felhelyezése előtt a mellkast a vizes környezet miatt szárazra töröltük. A gép nem javasolt sokkot, így a 15:2 arányú BLS-t folyamatosan fenntartottuk. A vízi baleset miatt a hypothermia (reverzibilis ok) megelőzésére különös figyelmet fordítottunk a vizes ruhák eltávolításával és hőszigetelő izolációval a kiemelt szintű segítség megérkezéséig.'
}
];

function renderSim() {

      html += `

        </button>
      `;
    });
    return html;
  }
  
  let sim = SIM_DATA.find(s => s.id === SI.id);
  
  if(SI.fin){
    let correct = SI.hist.filter(h => sim.steps[h.step].ok === h.oi).length;
    let pct = Math.round((correct / sim.steps.length) * 100);
    let html = `
      <h2 style="font-size:18px;font-weight:800;margin-bottom:1rem;color:#fff;">${sim.title} - Eredmény</h2>
      <div style="background:#064e3b;border:1px solid #059669;border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1rem;">
        <div style="font-size:42px;font-weight:800;color:#34d399;">${correct} / ${sim.steps.length}</div>
        <div style="font-size:14px;color:#a7f3d0;font-weight:700;margin-top:5px;">Sikeres helyzetfelismerés (${pct}%)</div>
      </div>
      
      <div class="card" style="background:#172554;border-color:#1e3a8a;padding:1.2rem;">
        <h3 style="color:#60a5fa;font-size:15px;margin-top:0;margin-bottom:10px;border-bottom:1px solid #1e3a8a;padding-bottom:8px;">Eset Összefoglaló (Lépésről lépésre):</h3>
        <p style="font-size:13px;color:#bfdbfe;line-height:1.7;text-align:justify;">${sim.summary}</p>
      </div>
      
      <button class="btn btn-r btn-fw" style="padding:14px;font-size:15px;" onclick="resetSim()">Vissza a szimulációkhoz</button>
    `;
    return html;
  }
  
  let step = sim.steps[SI.step];
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;">
      <div style="font-size:13px;font-weight:700;color:#9ca3af;text-transform:uppercase;">Lépés ${SI.step + 1} / ${sim.steps.length}</div>
      <span class="tag ${sim.tag}">${sim.diff}</span>
    </div>
    
    <div class="prog"><div class="progb" style="width:${((SI.step+1)/sim.steps.length)*100}%;background:#14b8a6;"></div></div>
    
    <div class="card" style="background:#1f2937;border-color:#374151;border-left:4px solid #14b8a6;padding:1.2rem;">
      <p style="font-size:15px;font-weight:600;color:#fff;line-height:1.5;margin:0;">${step.q}</p>
    </div>
  `;
  
  step.opts.forEach((opt, i) => {
    let cls = 'opt';
    if(SI.chosen !== null) {
      if(i === step.ok) cls += ' opt-ok';
      else if(i === SI.chosen && i !== step.ok) cls += ' opt-no';
    }
    html += `<button class="${cls}" ${SI.chosen === null ? `onclick="chooseSim(${i})"` : ''}>${opt}</button>`;
  });
  
  if(SI.chosen !== null) {
    let isOk = SI.chosen === step.ok;
    html += `
      <div class="al ${isOk ? 'al-s' : 'al-d'}" style="margin-top:15px;padding:12px;font-size:13.5px;">
        <strong style="font-size:15px;display:block;margin-bottom:5px;">${isOk ? '✅ Helyes Döntés!' : '❌ Helytelen Döntés!'}</strong> 
        ${step.fb}
      </div>
      <button class="btn btn-fw" style="background:#3b82f6;color:#fff;border:none;padding:14px;font-size:15px;margin-top:10px;" onclick="nextSim()">
        ${SI.step < sim.steps.length - 1 ? 'Tovább a következő lépésre →' : 'Eredmény és Részletes Összefoglaló'}
      </button>
    `;
  }
  
  return html;
}

// Célzott DOM frissítők a kalkulátorokhoz (megakadályozza az input fókuszvesztését)
function upPed(val) {
  CA.pedAge = val;
  let age = parseFloat(val);
  
  if (isNaN(age) || age < 1 || age > 12) {
    ['ped_w','ped_e','ped_fluid','ped_adr','ped_ami','ped_norm','ped_min'].forEach(id => {
      let el = document.getElementById(id);
      if(el) el.innerText = '-';
    });
    return;
  }
  
  let w = (age * 2) + 8; // 1-10 év APLS
  let norm = 90 + (2 * age);
  let min = 70 + (2 * age);
  
  document.getElementById('ped_w').innerText = w + ' kg';
  document.getElementById('ped_e').innerText = (w * 4) + ' J';
  document.getElementById('ped_fluid').innerText = (w * 10) + ' ml';
  document.getElementById('ped_adr').innerText = (w * 10) + ' µg';
  document.getElementById('ped_ami').innerText = (w * 5) + ' mg';
  document.getElementById('ped_norm').innerText = norm + ' Hgmm';
  document.getElementById('ped_min').innerText = min + ' Hgmm';
}

function upN2() {
  let p=0;
  if(CA.rr<=8)p+=3;else if(CA.rr<=11)p+=1;else if(CA.rr<=20)p+=0;else if(CA.rr<=24)p+=1;else p+=3;
  if(CA.spo2<=91)p+=3;else if(CA.spo2<=93)p+=2;else if(CA.spo2<=95)p+=1;
  p += parseInt(CA.o2);
  if(CA.sbp<=90)p+=3;else if(CA.sbp<=100)p+=2;else if(CA.sbp<=110)p+=1;else if(CA.sbp>=220)p+=3;
  if(CA.hr<=40)p+=3;else if(CA.hr<=50)p+=1;else if(CA.hr<=90)p+=0;else if(CA.hr<=110)p+=1;else if(CA.hr<=130)p+=2;else p+=3;
  p += parseInt(CA.c);
  if(CA.t<=35.0)p+=3;else if(CA.t<=36.0)p+=1;else if(CA.t<=38.0)p+=0;else if(CA.t<=39.0)p+=1;else p+=2;

  let box = document.getElementById('n2_box');
  let score = document.getElementById('n2_score');
  let risk = document.getElementById('n2_risk');
  let desc = document.getElementById('n2_desc');
  let warn = document.getElementById('n2_warn');
  
  if(!box) return;

  let col = p>=7?'#fca5a5':p>=5?'#fdba74':'#4ade80';
  let bg = p>=7?'#450a0a':p>=5?'#431407':'#064e3b';
  
  box.style.background = bg;
  box.style.borderColor = col+'40';
  score.style.color = col;
  risk.style.color = col;
  
  score.innerText = p;
  if (p >= 7) {
    risk.innerText = "MAGAS kockázat";
    desc.innerText = "Azonnali eszközös monitorozás. Kompetenciaszerint beavatkozás. Haladéktalanul SEGÉLYKOCSI!";
  } else if (p >= 5) {
    risk.innerText = "Közepes kockázat";
    desc.innerText = "Azonnali monitorozás. Nem megfelelő kompetencia esetén segélykocsi.";
  } else {
    risk.innerText = "Alacsony kockázat";
    desc.innerText = "Eszközös monitorozás nem feltétlen szükséges. Folyamatos megfigyelés.";
  }
  
  warn.style.display = p >= 5 ? 'block' : 'none';
  
  // Slider értékek frissítése
  ['rr','spo2','sbp','hr','t'].forEach(k => {
    let el = document.getElementById('n2'+k+'_v');
    if(el) el.innerText = CA[k] + (k==='t'?' °C':k==='spo2'?' %':k==='sbp'?' Hgmm':' /perc');
  });
}

function upGCS() {
  let tot = parseInt(CA.e) + parseInt(CA.v) + parseInt(CA.m);
  let box = document.getElementById('gcs_box');
  let sc = document.getElementById('gcs_score');
  let desc = document.getElementById('gcs_desc');
  
  if(!box) return;
  
  let col = tot>=13?'#4ade80':tot>=9?'#fde68a':'#fca5a5';
  let bg = tot>=13?'#064e3b':tot>=9?'#451a03':'#450a0a';
  
  box.style.background = bg;
  box.style.borderColor = col+'40';
  sc.style.color = col;
  desc.style.color = col;
  
  sc.innerText = tot;
  desc.innerText = tot>=13 ? 'Enyhe zavartság (≥13)' : tot>=9 ? 'Közepes zavartság (9-12)' : 'Súlyos eszméletlenség (≤8)';
}

window.setCalcTab = function(t){ CA.tab=t; render(); };
window.setN2rr = function(v){ CA.rr=v; upN2(); };
window.setN2spo2 = function(v){ CA.spo2=v; upN2(); };
window.setN2o2 = function(v){ CA.o2=v; upN2(); };
window.setN2sbp = function(v){ CA.sbp=v; upN2(); };
window.setN2hr = function(v){ CA.hr=v; upN2(); };
window.setN2c = function(v){ CA.c=v; upN2(); };
window.setN2temp = function(v){ CA.t=v; upN2(); };
window.setGCSE = function(v){ CA.e=v; upGCS(); };
window.setGCSV = function(v){ CA.v=v; upGCS(); };
window.setGCSM = function(v){ CA.m=v; upGCS(); };

// --- MODAL / SZÓTÁR FUNKCIÓK ---
window.shD = function(word) {
  const w = word.toLowerCase();
  let desc = 'Nincs magyarázat a szótárban ehhez a kifejezéshez.';
  if (DICT[w]) desc = DICT[w];
  
  document.getElementById('dictTitle').innerText = word.toUpperCase();
  document.getElementById('dictDesc').innerText = desc;
  document.getElementById('dictModal').style.display = 'flex';
}
window.closeDictBtn = function() { document.getElementById('dictModal').style.display = 'none'; }
window.closeDict = function(e) { if (e.target.id === 'dictModal') closeDictBtn(); }

// --- NAVIGÁCIÓ ÉS SIM FUNKCIÓK ---
window.go = function(s, id) { SCR = s; CHID = id || null; render(); };
window.startSim = function(id) { SI = {id: id, step: 0, chosen: null, hist: [], fin: false}; render(); };
window.chooseSim = function(i) { if(SI.chosen !== null) return; SI.chosen = i; SI.hist.push({step: SI.step, oi: i}); render(); };
window.nextSim = function() {
  let sim = SIM_DATA.find(s => s.id === SI.id);
  if(SI.step < sim.steps.length - 1) { SI.step++; SI.chosen = null; }
  else { SI.fin = true; }
  render();
};
window.resetSim = function() { SI = {id: null, step: 0, chosen: null, hist: [], fin: false}; render(); };

// --- FŐ RENDER ---
function render() {
  let c = document.getElementById('ct');
  c.innerHTML = '';
  
  if (SCR === 'home') c.innerHTML = renderHome();
  else if (SCR === 'guide') c.innerHTML = renderGuide();
  else if (SCR === 'sim') c.innerHTML = renderSim();
  else if (SCR === 'calc') c.innerHTML = renderCalc();
  
  let tabs = ['home', 'guide', 'sim', 'calc'];
  let active = SCR;
  document.querySelectorAll('.nb').forEach((b, i) => {
    b.classList.toggle('act', tabs[i] === active);
  });
  window.scrollTo(0, 0);
}

// Inicializálás
render();
</script>
