<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:72px;}
.app{max-width:800px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);position:relative;}
/* NAV */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);overflow-x:auto;}
.nb{flex:1;min-width:70px;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#ef4444;}
.ni{font-size:16px;}
.nl{font-size:10px;color:#9ca3af;font-weight:400;text-transform:uppercase;letter-spacing:0.05em;}
.nb.act .nl{color:#ef4444;font-weight:700;}
/* CONTENT */
.ct{padding:1rem;}
h1, h2, h3{color:#f3f4f6;line-height:1.3;}
/* CARDS & BLOCKS */
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.3rem;}
.dict-word{color:#5eead4;border-bottom:1px dashed #5eead4;cursor:pointer;font-weight:600;}
.dict-word:hover{color:#2dd4bf;border-bottom-color:#2dd4bf;}
/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
.modal{background:#262626;border:1px solid #3f3f3f;border-radius:12px;padding:1.5rem;width:100%;max-width:400px;position:relative;}
.modal-close{position:absolute;top:10px;right:10px;background:none;border:none;color:#9ca3af;font-size:20px;cursor:pointer;}
.modal-title{font-size:16px;font-weight:700;color:#f3f4f6;margin-bottom:.5rem;text-transform:capitalize;}
.modal-desc{font-size:14px;color:#d1d5db;line-height:1.6;}
/* BUTTONS */
.btn{padding:.6rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;font-weight:600;transition:all .15s;text-align:center;display:inline-block;}
.btn:hover{background:#374151;}
.btn-g{background:#064e3b;color:#fff;border-color:#059669;}
.btn-g:hover{background:#065f46;}
.btn-r{background:#7f1d1d;color:#fff;border-color:#991b1b;}
.btn-fw{width:100%;display:block;}
/* QUIZ/SIM OPTIONS */
.opt{width:100%;display:block;padding:.8rem 1rem;margin-bottom:8px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.5;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}
/* TABLES */
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:6px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:6px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;}
/* PROGRESS */
.prog{height:6px;background:#333;border-radius:3px;margin-bottom:1rem;overflow:hidden;}
.progb{height:100%;border-radius:3px;transition:width .3s;}
/* INPUTS */
input[type=number]{width:100%;background:#2a2a2a;border:1px solid #4b5563;border-radius:8px;padding:10px;color:#e5e7eb;font-family:inherit;font-size:14px;margin-bottom:1rem;}
.tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;}
.tag-b{background:#1e3a8a;color:#bfdbfe;}
.tag-bp{background:#701a75;color:#fbcfe8;}
</style>

<script>

const DICT = {
  'hypoxia': 'Oxigénhiány. Gyermekeknél és vízből mentetteknél a keringésmegállás vezető oka. Az újraélesztés során azonnal oxigén adása és hatékony lélegeztetés szükséges.',
  'hypovolaemia': 'A keringő vérmennyiség súlyos csökkenése (pl. vérzés, anaphilaxia, szepszis miatt). Traumás keringésmegállásnál a leggyakoribb ok. Kezelése agresszív folyadékpótlás (2000 ml krisztalloid bólus).',
  'hyperkalaemia': 'Kórosan magas káliumszint (5,5 mmol/l felett). Súlyos ritmuszavart okozhat. EKG: csúcsos T, széles QRS. Kezelése: 10 ml 10% Calcium-klorid/glükonát, 10E inzulin+25g glükóz.',
  'hypokalaemia': 'Kórosan alacsony káliumszint (<3,5 mmol/l). Növeli a ritmuszavarok (TdP) kockázatát. EKG: lapos T, U-hullám. Kezelése: lassú K+ pótlás, Magnézium (1-2 g iv).',
  'hypothermia': 'Baleseti lehűlés, maghőmérséklet <35°C. Az anyagcsere csökken, védi az agyat. 30°C alatt tilos újraélesztési gyógyszert adni, VF esetén max 3 sokk adható a visszamelegedésig! 30-35°C között a gyógyszerelési időket duplázni kell.',
  'hyperthermia': 'Kórosan magas testhőmérséklet (hőguta). Aktív és agresszív hűtés szükséges azonnal (cool and run), cél a 39°C alá csökkentés min. 0,1°C/perc ütemben.',
  'thrombus': 'Vérrög okozta elzáródás (coronaria = STEMI, pulmonalis = embólia). Fibrinolysis megfontolandó, ami alatt az ALS-t 60-90 percig folytatni kell.',
  'pneumothorax': 'Tenziós (feszülő) légmell. A levegő nyomása gátolja a vénás visszaáramlást. Prehospitálisan azonnali tűdekompressziót (iv. kanüllel) vagy thoracostomiát igényel.',
  'tamponád': 'Folyadék/vér a pericardiumban (szívburok). Megakadályozza a szív telődését. Súlyos esetben pericardiocentesis vagy resuscitativ thoracotomia (RT) szükséges.',
  'asystolia': 'A szív elektromos és mechanikai működésének teljes hiánya. Nem sokkolandó ritmus. Kezelése: kompresszió, azonnali 1 mg Adrenalin.',
  'pea': 'Pulzus Nélküli Elektromos Aktivitás. A monitoron látható elektromos ritmus, de nincs tapintható pulzus. Nem sokkolandó ritmus.',
  'vf': 'Kamrafibrilláció. A szív kaotikus elektromos tevékenysége. Sokkolandó ritmus. Azonnali aszinkron defibrillálás szükséges.',
  'pvt': 'Pulzus Nélküli Kamrai Tachycardia. Gyors, ineffektív ritmus pulzus nélkül. Sokkolandó ritmus.',
  'rosc': 'Return of Spontaneous Circulation - Spontán keringés visszatérése. Kapnográfia (EtCO2) hirtelen, jelentős megemelkedése is jelezheti. ABCDE és postresuscitatios ellátás követi.',
  'aed': 'Félautomata Külső Defibrillátor. Öntapadó elektródákkal ritmust elemez és sokkot javasol.',
  'bls': 'Basic Life Support - Alapszintű Újraélesztés. Mellkaskompresszió és lélegeztetés (felnőtt 30:2, gyermek 15:2), AED használata.',
  'als': 'Advanced Life Support - Emelt Szintű Újraélesztés. Manuális defibrillátor, gyógyszerek, emelt légút, 4H-4T keresése.',
  'intraossealis': 'Csonton belüli (IO) gyógyszerbeadási út. Második vonalbeli alternatíva ALS alatt, ha az intravénás (IV) bemenet 2 kísérletre sem sikerül gyorsan.',
  'cabcde': 'A súlyos traumás betegek algoritmusa. A "c" a katasztrofális külső vérzés azonnali csillapítását jelenti a nyaki gerinc védelme (MILS) mellett.',
  'capnografia': 'A kilégzett CO2 (EtCO2) mérése. ALS során kötelező! Mutatja a kompresszió hatékonyságát és a ROSC beálltát.',
  'lma': 'Laryngealis Maszk / Supraglotticus eszköz. Behelyezése után a mellkaskompressziókat nem kell megszakítani a lélegeztetéshez (folyamatos kompresszió, 10/min lélegeztetés). Az i-gel előnyösebb a laryngeális tubusnál.',
  'eti': 'Endotrachealis Intubáció. A kompressziókat max 5 másodpercre szabad megszakítani a tubus átvezetéséhez.',
  'lucas': 'Mechanikus mellkaskompressziós eszköz. Csak a manuális CPR megkezdése után, minimalizált szünettel szabad felhelyezni (max 5 mp szünet).',
  'vad': 'Kamraműködést segítő eszköz. Folyamatos áramlást kelt, nincs tapintható pulzus normál működés mellett sem. ROSC helyett RONF-ról beszélünk. Kompresszió végezhető rajta.',
  't-cpr': 'Telefonon irányított újraélesztés. A mentésirányító a laikus bejelentőt kizárólag folyamatos mellkaskompresszióra instruálja (lélegeztetés nélkül).'
};

const GUIDES = [
{id:'szervezes', t:'1. Szervezési szempontok és Laikus BLS', txt:`
<div class="al al-i">A keringésmegállástól a mentők megérkezéséig eltelő időt a lakosság bevonásával kell kitölteni. A "Szív City" és "ÉletMentő" applikációk támogatják a korai felismerést és az önkéntesek riasztását (500 méteres körzetben).</div>
<h3 style="color:#ef4444;margin-bottom:5px;">Mentésirányítás (T-CPR)</h3>
<ul class="bl">
  <li>Standard kritériumokat kell használni a keringésmegállás felismerésére.</li>
  <li>Nem reagáló, nem normálisan légző betegnél telefonos útmutatás (T-CPR) szükséges.</li>
  <li>Laikus hívót <b>kizárólag mellkaskompresszióra</b> kell kérni (lélegeztetés nélkül).</li>
</ul>
<h3 style="color:#ef4444;margin-bottom:5px;margin-top:15px;">Felső légúti idegentest (FBA)</h3>
<ul class="bl">
  <li><b>Enyhe elzáródás (tud beszélni, köhög):</b> Biztatni a köhögésre.</li>
  <li><b>Súlyos elzáródás, eszméletén van:</b> 5 háti ütés (lapockák közé), ha sikertelen -> 5 hasi lökés (Heimlich). 1 év alatti csecsemőnél Heimlich TILOS, helyette 5 mellkasi lökés a kompressziós ponton. Váltogatva folytatni.</li>
  <li><b>Eszméletlen:</b> Fektessük le, azonnali 30 mellkaskompresszió (pulzusvizsgálat nélkül!). Kompresszió után szájüregbe tekintés, majd 2 befúvás. Vakon ujjal betörölni tilos!</li>
</ul>
<h3 style="color:#ef4444;margin-bottom:5px;margin-top:15px;">Stabil oldalfektetés</h3>
<ul class="bl">
  <li>Eszméletlen, de kielégítő légzésű és keringésű betegnél. Rendszeresen (percenként) ellenőrizni kell a légzést. Gerincsérülés gyanújakor kontraindikált. 30 perc után a másik oldalra kell fordítani.</li>
</ul>
`},
{id:'bls', t:'2. Mentőellátás BLS és AED', txt:`
<div class="al al-w">Kritikus állapot gyanújakor törekedjünk a beteg 360°-os körüljárhatóságának biztosítására!</div>
<h3 style="color:#ef4444;margin-bottom:5px;">A keringésmegállás felismerése</h3>
<ul class="bl">
  <li><b>Reagál a beteg?</b> Hangos megszólítás és kíméletes vállrázás. Nincs reakció -> Mentők/segélykocsi azonnali hívása.</li>
  <li><b>Légút:</b> Fej hátrahajtása, áll emelése.</li>
  <li><b>Légzés:</b> Hármas érzékelés <b>pontosan 10 másodpercig</b>. Az agonális (gaspoló) légzés nem normális, keringésmegállást jelent!</li>
</ul>
<h3 style="color:#ef4444;margin-bottom:5px;margin-top:15px;">Mellkasi Kompressziók és AED</h3>
<ul class="bl">
  <li><b>Nyomáspont:</b> Szegycsont alsó fele. <b>Mélység:</b> 5-6 cm. <b>Frekvencia:</b> 100-120/perc.</li>
  <li><b>Arány:</b> 30 kompresszió : 2 lélegeztetés (ballonos-maszkos, szükség esetén két ellátóval, négykezes technikával O2-vel).</li>
  <li>A kompressziót végzőt 2 percenként cserélni kell. A szünet nem lehet több 5 másodpercnél!</li>
  <li>Az <span class="dict-word" onclick="shD('aed')">AED</span> érkezésekor azonnal bekapcsolni, elektródákat csupasz, száraz mellkasra ragasztani (dús szőrzetet borotválni).</li>
  <li>A töltés alatt a kompresszió folytatódik (ha a gép engedi). Sokk leadása után <b>AZONNAL</b> 2 perc CPR következik, ritmus/pulzus ellenőrzés nélkül!</li>
</ul>
`},
{id:'als', t:'3. Emelt Szintű Újraélesztés (ALS)', txt:`
<div class="al al-i">Az <span class="dict-word" onclick="shD('als')">ALS</span> során 2 perces ciklusokban dolgozunk. A ritmuselemzésre és pulzusvizsgálatra maximum 10 másodperc áll rendelkezésre.</div>
<h3 style="color:#3b82f6;margin-bottom:5px;">Ritmusok és Defibrillálás</h3>
<div class="tbl-wrap"><table class="tbl">
  <tr><th>Sokkolandó (Azonnali aszinkron sokk)</th><th>Nem Sokkolandó (Nincs sokk)</th></tr>
  <tr><td><span class="dict-word" onclick="shD('vf')">VF</span> (Kamrafibrilláció)</td><td><span class="dict-word" onclick="shD('asystolia')">Asystolia</span></td></tr>
  <tr><td><span class="dict-word" onclick="shD('pvt')">pVT</span> (Pulzus nélküli kamrai tachycardia)</td><td><span class="dict-word" onclick="shD('pea')">PEA</span> (Pulzus nélküli elektromos aktivitás)</td></tr>
</table></div>
<ul class="bl">
  <li>Bármilyen amplitúdójú VF-et azonnal defibrilláljunk. Bifázisos gép esetén 150-200 J kezdő energia.</li>
  <li>Sokk után azonnal 2 perc CPR.</li>
  <li><b>Refrakter VF esetén:</b> A 3. sokk után vektorváltás (pl. antero-posterior lapáthelyzet) mérlegelendő.</li>
</ul>
<h3 style="color:#3b82f6;margin-bottom:5px;margin-top:15px;">Gyógyszerelés (Felnőtt)</h3>
<ul class="bl">
  <li>Elsőként <b>Intravénás (IV)</b> utat létesítsünk. Ha ez 2 kísérletre sem sikerül gyorsan, válasszunk <span class="dict-word" onclick="shD('intraossealis')">Intraossealis (IO)</span> utat. Bemosás 20 ml krisztalloiddal + végtag emelése.</li>
  <li><b>Adrenalin (1 mg):</b> 
    <ul>
      <li><b>Nem sokkolandó:</b> Azonnal, amint van véna.</li>
      <li><b>Sokkolandó:</b> A 3. sokk után. Mindkét ágon 3-5 percenként (minden 2. körben) ismétlendő.</li>
    </ul>
  </li>
  <li><b>Amiodaron:</b> Sokkolandó ritmusban a 3. sokk után 300 mg, az 5. sokk után 150 mg. (Lidokain adható alternatívaként: 100 mg, majd 50 mg).</li>
</ul>
<h3 style="color:#3b82f6;margin-bottom:5px;margin-top:15px;">Légútbiztosítás és Kapnográfia</h3>
<ul class="bl">
  <li><span class="dict-word" onclick="shD('lma')">Supraglotticus eszköz</span> (i-gel előnyösebb) vagy <span class="dict-word" onclick="shD('eti')">ETI</span> behelyezése után a mellkaskompresszió <b>folyamatos</b>, a lélegeztetés függetlenül <b>10/perc</b>.</li>
  <li>A <span class="dict-word" onclick="shD('capnografia')">Kapnográfia (EtCO2)</span> használata kötelező (görbét kijelző kapnográf)! Hirtelen emelkedése <span class="dict-word" onclick="shD('rosc')">ROSC</span>-ot jelez.</li>
</ul>
`},
{id:'4h4t1', t:'4. Speciális Körülmények I. (4H-4T, Toxikológia)', txt:`
<div class="al al-d">Ha a keringés nem áll helyre, keresni és kezelni kell a reverzibilis okokat!</div>
<div class="tbl-wrap"><table class="tbl">
  <tr><th>4H</th><th>4T</th></tr>
  <tr>
    <td>
      <b><span class="dict-word" onclick="shD('hypoxia')">Hypoxia</span></b>: 100% O2, lélegeztetés.<br>
      <b><span class="dict-word" onclick="shD('hypovolaemia')">Hypovolaemia</span></b>: Folyadék/vér pótlása.<br>
      <b>Hypo/hyperkalaemia</b>: Ca, Mg, glükóz+inzulin (Na-bikarbonát rutinszerűen nem ajánlott).<br>
      <b>Hypo/hyperthermia</b>: Hőmérséklet menedzsment.
    </td>
    <td>
      <b><span class="dict-word" onclick="shD('pneumothorax')">Tenziós PTX</span></b>: Tűdekompresszió.<br>
      <b><span class="dict-word" onclick="shD('tamponád')">Tamponád</span></b>: Pericardiocentesis.<br>
      <b>Toxinok</b>: Antidotumok.<br>
      <b><span class="dict-word" onclick="shD('thrombus')">Thrombosis</span></b>: Fibrinolysis (coronaria/pulm).
    </td>
  </tr>
</table></div>
<h3 style="color:#f59e0b;margin-bottom:5px;">Toxikológia (Mérgezések)</h3>
<ul class="bl">
  <li><b>Saját biztonság az első.</b> Kénhidrogén, cián, szerves foszfát esetén tilos az eszköz nélküli lélegeztetés!</li>
  <li><b>Triciklikus antidepresszánsok:</b> Széles QRS tachycardia, hypotensio. 1-2 mmol/kg Na-bikarbonát adása javasolt.</li>
  <li><b>Kokain:</b> Hypertonia, tachycardia. Alfa-blokkoló (fentolamin), BZD adható. Béta-blokkoló kerülendő!</li>
  <li><b>Helyi érzéstelenítők:</b> Lipidemulzió (20% 1,5 ml/kg iv bólus).</li>
  <li><b>Béta-blokkolók / Ca-csatorna gátlók:</b> Súlyos bradycardia. Glükagon, magas dózisú inzulin+glükóz, Ca-klorid.</li>
  <li><b>Digoxin:</b> Specifikus antitest-fragment (kórházban).</li>
  <li><b>Opiátok:</b> Naloxon (0,4-0,8 mg titrálva). Intranasalisan is adható. Túl gyors antagonizálás tüdőödémát okozhat!</li>
</ul>
`},
{id:'4h4t2', t:'5. Speciális Körülmények II. (Környezet, Terhesség)', txt:`
<h3 style="color:#22c55e;margin-bottom:5px;">Hypothermia (< 35°C)</h3>
<ul class="bl">
  <li>Az EKG vizsgálat akár 1 percig is tarthat. Törekedjünk a kíméletes mozgatásra (kamrafibrilláció veszélye).</li>
  <li><b>< 30°C:</b> Semmilyen gyógyszer nem adható! VF esetén maximum 3 sokk adható, a többit a 30°C eléréséig fel kell függeszteni.</li>
  <li><b>30-35°C:</b> Gyógyszeradási időközök duplázása (Adrenalin 6-10 percenként).</li>
  <li>"Senki sem halott, amíg nem meleg és halott." Elhúzódó CPR (akár intermittálva) indokolt.</li>
</ul>
<h3 style="color:#22c55e;margin-bottom:5px;margin-top:15px;">Elektromos Baleset és Villámcsapás</h3>
<ul class="bl">
  <li><b>Biztonság:</b> Nagyfeszültség (>1 kV) esetén tilos megközelíteni a feszültségmentesítésig!</li>
  <li>Iniciális ritmus gyakran VF (váltóáram) vagy asystolia (egyenáram, villám). Villámcsapásnál légzésmegállás a fő ok. Hosszú ideig tartó lélegeztetés/CPR is sikeres lehet.</li>
  <li>Folyadékpótlás a szövetsérülés (myoglobinuria) miatt kiemelt fontosságú.</li>
</ul>
<h3 style="color:#22c55e;margin-bottom:5px;margin-top:15px;">Terhesség</h3>
<ul class="bl">
  <li>20. héttől az uterus aortocavalis kompressziót okoz. A terhest <b>15-30 fokkal balra kell fordítani</b>, vagy az uterust kézzel balra tolni.</li>
  <li>A kompresszió helye a szegycsonton kissé feljebb tolódik.</li>
  <li>Korai intubáció indokolt a fokozott regurgitáció miatt (0,5-1 mm-rel kisebb tubus javasolt).</li>
  <li>Perimortem császármetszés (ha kiképzett személy van jelen) 5 percen belül mérlegelendő, ha nincs ROSC.</li>
</ul>
<h3 style="color:#22c55e;margin-bottom:5px;margin-top:15px;">VAD (Kamratámogató eszköz)</h3>
<ul class="bl">
  <li>Folyamatos (nem pulzáló) áramlás, pulzus nem tapintható normál működésnél sem! <span class="dict-word" onclick="shD('capnografia')">Kapnográfia</span> bizonyító erejű. Ha a beteg eszméletlen és nincs EtCO2: CPR kezdendő (a mellkaskompresszió megengedett).</li>
</ul>
`},
{id:'trauma', t:'6. Traumás Keringésmegállás (TCA)', txt:`
<div class="al al-w">Traumánál az üres (kivérzett) vagy komprimált (PTX, Tamponád) szívet nyomni felesleges. A <span class="dict-word" onclick="shD('cabcde')">cABCDE</span> elv alapján a reverzibilis okok PÁRHUZAMOS kezelése adja az egyetlen esélyt.</div>
<ul class="bl">
  <li><b>C (Catastrophic hemorrhage):</b> Jelentős külső vérzés azonnali csillapítása (direkt nyomás, tourniquet) a mellkaskompressziók előtt/alatt.</li>
  <li><b>A (Légút):</b> Nyaki gerinc rögzítés (MILS) mellett, fej hátrahajtása NÉLKÜL (áll kiemelés). Korai intubáció.</li>
  <li><b>B (Légzés/Mellkas):</b> Kétoldali mellkasi detenzionálás (tűdekompresszió vagy thoracostomia) kötelező pozitív nyomású lélegeztetésnél és feszülő PTX gyanújánál.</li>
  <li><b>C (Keringés):</b> Medencerögzítő felhelyezése. Legalább 2000 ml krisztalloid iv. gyors beadása. 20 mg/ttkg (max 1 g) Tranexámsav adása. Proximalis vérzéscsillapítás.</li>
  <li>Ha 15 percen túl sincs életjel a fenti okok kezelése ellenére, az újraélesztés abbahagyása megfontolandó.</li>
</ul>
`},
{id:'ped', t:'7. Gyermek BLS és ALS', txt:`
<div class="al al-d">Gyermekeknél a keringésmegállás döntően <span class="dict-word" onclick="shD('hypoxia')">hypoxia</span> és acidózis talaján alakul ki (bradycardia -> asystolia). Szokványos sokkolandó ritmus ritka (4-8%).</div>
<h3 style="color:#f472b6;margin-bottom:5px;">Gyermek BLS (Szakellátóknak)</h3>
<ul class="bl">
  <li><b>Kezdeti befúvások:</b> A légzés hiánya esetén <b>5 kezdeti befúvással</b> indítunk (kb. 1 mp/befúvás, mellkas emelkedésig).</li>
  <li><b>Arány:</b> <b>15 kompresszió : 2 lélegeztetés</b> (PBLS).</li>
  <li><b>Mélység:</b> A mellkas nyílirányú (AP) átmérőjének <b>1/3-a</b>. (Csecsemő: 2 hüvelykujjas körülölelő technika).</li>
  <li>Egyedüli segélynyújtó 1 perc (kb. 5 ciklus) után menjen segítségért.</li>
</ul>
<h3 style="color:#f472b6;margin-bottom:5px;margin-top:15px;">Gyermek ALS</h3>
<ul class="bl">
  <li><b>Defibrillálás:</b> <b>4 J/kg</b> (refrakter esetben 8 J/kg-ig emelhető, max 360J). 8 év alatt lehetőleg gyerek elektróda/mód.</li>
  <li><b>Adrenalin:</b> <b>10 µg/kg</b> (0,01 mg/kg) max 1 mg. (1:10000 hígításból 0,1 ml/kg). Adása megegyezik a felnőttel (nem sokkolandóban azonnal, sokkolandóban 3. sokk után, majd 3-5 percenként).</li>
  <li><b>Amiodaron:</b> <b>5 mg/kg</b> (max 300 mg) a 3. sokk után.</li>
  <li><b>Folyadék:</b> 10 ml/kg bólus.</li>
  <li>Lélegeztetés intubált betegnél: Csecsemő 25/p, 1-8 év 20/p, 8-12 év 15/p, >12 év 10/p.</li>
</ul>
`},
{id:'post', t:'8. Postresuscitatiós Ellátás', txt:`
<div class="al al-s"><span class="dict-word" onclick="shD('rosc')">ROSC</span> (spontán keringés visszatérése) után AZONNAL A-B-C-D-E vizsgálat! A cél a szervkárosodás megelőzése.</div>
<ul class="bl">
  <li><b>A-B:</b> SpO2 cél: <b>94-98%</b> (kerüljük a hyperoxiát és hypoxiát is). Normocapnia (EtCO2 35-40 Hgmm) tartása. Eszméletlen betegnél ETI és szedáció fenntartása.</li>
  <li><b>C:</b> Szisztolés vérnyomás cél: <b>> 100 Hgmm</b>. Hypotensio kerülendő (krisztalloid, noradrenalin, hígított adrenalin). 12-elvezetéses EKG KÖTELEZŐ! STEMI esetén azonnali PCI (szívkatéteres) központ.</li>
  <li><b>D-E:</b> Vércukor cél: 7,8-10 mmol/l. Hypoglykaemia azonnali kezelése. Hőmérséklet: <b>&le; 37°C fenntartása (lázprevenció)</b>, a hyperthermia (láz) szigorúan elkerülendő! Passzív hűtés (takaró levétele, jég), didergés csillapítása (relaxáns). Görcsrohamok felismerése és kezelése.</li>
  <li>Előrejelzést (prognózist) a helyszínen, 72 órán belül nem lehet és nem szabad mondani! Mindenkit maximális ellátásban kell részesíteni.</li>
</ul>
`}
];

  ],
  summary: 'Összefoglaló (Traumás Keringésmegállás B+): A kimentett eszméletlen sofőrnél a cABCDE elvet követted. Az első lépés a combból sugárzó katasztrofális vérzés (c) azonnali elállítása volt tourniquet-vel. Az "A" (Légút) vizsgálatnál nyaki gerinc rögzítés (MILS) mellett, csak az áll kiemelésével nyitottad meg a légutat. A beteg agonálisan lélegzett és nem volt pulzusa (TCA). A TCA-nál a reverzibilis okok (Hypovolaemia, Hypoxia, Tenziós PTX, Tamponád) kezelése az elsődleges. A "B" vizsgálatnál a feszülő PTX jeleit észlelve azonnal tűdekompressziót végeztél. A "C" vizsgálat során a vérvesztés pótlására agresszív folyadékterápiát (2000 ml) és 1 g Tranexámsavat alkalmaztál, miközben a medencét (nyomkodás nélkül!) medencerögzítővel stabilizáltad. A csapat másik tagja folyamatosan végezte a CPR-t és az oxigenizációt. A TCA túlélése a keringés volumenének helyreállításán múlik, ezen lépések párhuzamos végrehajtása adta meg a beteg esélyét.'
},

    { q: 'B+ kompetenciával hogyan biztosítod a légutat a terhes betegnél, figyelembe véve a megnövekedett aspirációs (félrenyelési) kockázatot?',
      opts: ['Csak szájból-szájba lélegeztetek.', 'Supraglotticus eszközt (LMA/I-gel) helyezek be mielőbb (vagy ETI-t, de az nehezebb lehet), mert az aspiráció veszélye a szokásosnál sokkal nagyobb.', 'Nem biztosítok légutat, csak nyomom a mellkast.', 'Stabil oldalfekvésbe rakom és várok.'],
      ok: 1, fb: 'A terheseknél a megnövekedett hasűri nyomás és a gyomorkapu lazasága miatt nagyon magas a regurgitáció és aspiráció veszélye. A korai emelt légútbiztosítás kritikus.' },
    { q: 'A monitor-defibrillátort csatlakoztatod. Kamrafibrillációt (VF) látsz. Szabad-e defibrillálni egy terhes nőt?',
      opts: ['Szigorúan tilos, a magzatot megöli a sokk.', 'Igen, a defibrillálás a szokásos elveket és energiákat (150-200J bifázisos) követi. A magzat legnagyobb esélye az anya túlélése.', 'Csak nagyon alacsony energiával (50J) szabad.', 'Csak gyógyszert szabad adni.'],
      ok: 1, fb: 'A terhesség NEM kontraindikációja a defibrillálásnak. A szokásos energiákat használjuk.' },
    { q: 'A sokk leadása (vagy töltés) alatt kire kell különösen odafigyelni a biztonság szempontjából, ha a beteget balra fordítva tartjátok?',
      opts: ['A magzatra.', 'Arra a személyre, aki a beteget oldalra billentve (vagy az uterust) tartja, hogy őt se érje áramütés.', 'A járókelőkre 10 méteres körzetben.', 'A mentőautó sofőrjére.'],
      ok: 1, fb: 'Aki a beteget vagy az uterust manuálisan balra tartja, annak a sokk leadása pillanatában el kell engednie a beteget a biztonság miatt.' },
    { q: 'A vénabiztosítás után mikor adod be az 1 mg Adrenalint kamrafibrilláció (sokkolandó ritmus) esetén?',
      opts: ['Azonnal.', 'A 3. sokk leadása után.', 'A 2. sokk után.', 'Sosem.'],
      ok: 1, fb: 'Az Adrenalin protokollja nem változik: sokkolandó ritmusnál a 3. sokk után adjuk.' },
    { q: 'A 4H-4T reverzibilis okok keresése közben milyen speciális, terhességre jellemző okra kell gondolnod (A 4H-ból a Hypovolaemia kapcsán)?',
      opts: ['Postpartum vérzés, placenta leválás, méhrepedés okozta masszív belső vérzés (Kivérzés).', 'Túlzott vízivás.', 'Magas vércukorszint.', 'Tetanusz fertőzés.'],
      ok: 0, fb: 'A terhesség alatti/utáni vérzés az anyai halálozás vezető oka, ami súlyos hypovolaemiát (kivérzést) okoz.' },
    { q: 'Ha a reverzibilis ok hypovolaemia (masszív vérzés), mi a B+ kompetenciájú teendő a CPR alatt?',
      opts: ['Várok a kórházig.', 'Gyors folyadékbólus (krisztalloid infúzió) adása és 1 g Tranexámsav iv.', 'Cukor infúzió adása.', 'Azonnal felültetem.'],
      ok: 1, fb: 'Vérzés gyanúja esetén az agresszív folyadékpótlás és a Tranexámsav (vérzéscsillapító) életmentő.' },
    { q: 'Az újraélesztés már 4 perce tart, nincs ROSC. Mi az a kritikus orvosi (ALS/mentőtiszti) beavatkozás, amit az eljárásrend 5 percen belül mérlegelni javasol (ha kompetens személy van jelen)?',
      opts: ['Tracheostomia.', 'Perimortem császármetszés (ha a méh a köldök felett van, és 4 percen belül sikertelen a CPR).', 'Vakbélműtét.', 'A pacemaker beültetés.'],
      ok: 1, fb: 'A perimortem császármetszés célja az aortocavalis kompresszió megszüntetése, ami az anya (és a magzat) túlélési esélyét is drámaian javítja.' },
    { q: 'A 3. ciklus után a monitoron VF helyett PEA-t látsz. Változik-e a balra fordított pozíció és a kompresszió helye?',
      opts: ['Nem, a pozíció (15-30 fokos balra döntés) és a feljebb tolt kompressziós pont a terhesség miatt végig érvényben marad az újraélesztés alatt.', 'Igen, PEA-nál hanyatt kell fektetni.', 'Igen, fel kell ültetni.', 'Igen, a hasát kell nyomni.'],
      ok: 0, fb: 'A mechanikai ok (aortocavalis kompresszió) és az anatómiai eltolódás a ritmustól függetlenül fennáll, így a speciális pozíciót végig tartani kell.' }
  ],
  summary: 'Összefoglaló (Terhes Nő Keringésmegállása B+): A kb. 30 hetes terhes nőnél a BLS megkezdésekor az eljárásrendnek megfelelően a beteget 15-30 fokkal balra fordítottuk (aortocavalis kompresszió elkerülése), és a mellkaskompressziókat a szegycsonton a szokásosnál kissé feljebb végeztük. A megemelkedett aspirációs kockázat miatt a B+ kompetenciának megfelelően korai supraglotticus légútbiztosítást (LMA) végeztünk kapnográf (EtCO2) kontrollal. A monitoron észlelt VF (Kamrafibrilláció) esetén a terhesség ellenére a szokásos energiával (150-200J) biztonságosan defibrilláltunk, ügyelve arra, hogy a beteget pozícióban tartó személy a sokk pillanatában ne érjen az anyához. Az Adrenalint a protokoll szerint a 3. sokk után adtuk be. A reverzibilis okok (4H-4T) keresése során kiemelten figyeltünk a terhességhez társuló masszív vérzés (Hypovolaemia) gyanújára, amire folyadékbólust és Tranexámsavat készítettünk elő. Tudtuk, hogy ha a CPR 4-5 percen belül sikertelen, az orvos/mentőtiszt a perimortem császármetszést is mérlegelni fogja az anya keringésének felszabadítása érdekében. Az algoritmus egészen a ROSC beálltáig ebben a speciális pozícióban zajlott.'
}
];

function shD(word) {
  const w = word.toLowerCase();
  let desc = 'Nincs pontos magyarázat a szótárban ehhez a kifejezéshez.';
  if (DICT[w]) desc = DICT[w];
  
  document.getElementById('dictTitle').innerText = word.toUpperCase();
  document.getElementById('dictDesc').innerText = desc;
  document.getElementById('dictModal').style.display = 'flex';
}

function closeDictBtn() {
  document.getElementById('dictModal').style.display = 'none';
}

function closeDict(e) {
  if (e.target.id === 'dictModal') {
    closeDictBtn();
  }
}

function calcPed() {
  let age = parseFloat(CA.w);
  if (isNaN(age) || age < 1) return { w: 0, e: 0, fluid: 0, ad: 0, am: 0 };
  
  // APLS formula 1-10 év között: (Kor x 2) + 8 = kg
  let w = (age * 2) + 8;
  return {
    w: w,
    e: w * 4,           // Defib energia: 4 J/kg
    fluid: w * 10,      // Folyadék: 10 ml/kg
    ad: w * 10,         // Adrenalin: 10 µg/kg
    am: w * 5           // Amiodaron: 5 mg/kg
  };
}

function renderCalc() {
  let pd = calcPed();
  let html = `
    <h2 style="font-size:20px;font-weight:800;color:#5eead4;margin-bottom:1rem;">👶 Gyermek Dózis Kalkulátor</h2>
    <div class="card" style="background:#1f2937;border-color:#374151;">
      <p style="font-size:14px;color:#d1d5db;margin-bottom:1.5rem;">Az APLS (Advanced Paediatric Life Support) formula alapján számítja ki a becsült testsúlyt és az ALS gyógyszerek / defibrillátor energiáját (1-10 éves kor között).</p>
      
      <div style="margin-bottom:1rem">
        <label style="font-size:13px;font-weight:700;color:#9ca3af;margin-bottom:6px;display:block;">Gyermek életkora (években):</label>
        <input type="number" id="pedAge" value="${CA.w}" oninput="updCalc(this.value)" placeholder="Például: 5">
      </div>
      
      <div id="calcResultContainer">
        ${getCalcResHTML(pd)}
      </div>
      
      <div style="margin-top:1.5rem;">
        <h3 style="color:#5eead4;font-size:14px;margin-bottom:8px;">Felnőtt Defibrillációs Energiák (Referencia):</h3>
        <div style="background:#262626;border:1px solid #3f3f3f;border-radius:8px;padding:12px;font-size:13px;color:#d1d5db;line-height:1.6;">
          • <b>Bifázisos gép:</b> 150-200 Joule kezdő energia.<br>
          • Ismeretlen gép / Refrakter VF: Kezdés a legmagasabb energiával (pl. 360 Joule).<br>
          • ICD / Pacemaker: Az elektródát legalább 8 cm-re tegyük a készüléktől.
        </div>
      </div>
    </div>
  `;
  return html;
}

function getCalcResHTML(pd) {
  if (!pd.w) return '';
  return `
    <div style="background:#064e3b;border:1px solid #059669;border-radius:12px;padding:1.5rem;margin-top:1rem;box-shadow:inset 0 0 10px rgba(0,0,0,0.2);">
      <div style="font-size:12px;color:#6ee7b7;text-transform:uppercase;letter-spacing:0.05em;font-weight:800;margin-bottom:5px;">Becsült Testsúly:</div>
      <div style="font-size:32px;font-weight:800;color:#fff;margin-bottom:1.5rem;text-shadow:1px 1px 2px rgba(0,0,0,0.5);">${pd.w} kg</div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div style="background:#022c22;padding:12px;border-radius:8px;border:1px solid #065f46;">
          <div style="font-size:11px;color:#a7f3d0;margin-bottom:4px;font-weight:600;">⚡ Defibrillálás (4 J/kg)</div>
          <div style="font-size:18px;font-weight:800;color:#fff;">${pd.e} Joule</div>
        </div>
        <div style="background:#022c22;padding:12px;border-radius:8px;border:1px solid #065f46;">
          <div style="font-size:11px;color:#a7f3d0;margin-bottom:4px;font-weight:600;">💉 Adrenalin (10 µg/kg)</div>
          <div style="font-size:18px;font-weight:800;color:#fff;">${pd.ad} µg <br><span style="font-size:12px;font-weight:500;color:#9ca3af;">(${(pd.ad/1000).toFixed(2)} mg)</span></div>
        </div>
        <div style="background:#022c22;padding:12px;border-radius:8px;border:1px solid #065f46;">
          <div style="font-size:11px;color:#a7f3d0;margin-bottom:4px;font-weight:600;">💊 Amiodaron (5 mg/kg)</div>
          <div style="font-size:18px;font-weight:800;color:#fff;">${pd.am} mg</div>
        </div>
        <div style="background:#022c22;padding:12px;border-radius:8px;border:1px solid #065f46;">
          <div style="font-size:11px;color:#a7f3d0;margin-bottom:4px;font-weight:600;">💧 Folyadék Bólus (10 ml/kg)</div>
          <div style="font-size:18px;font-weight:800;color:#fff;">${pd.fluid} ml</div>
        </div>
      </div>
    </div>
  `;
}

function updCalc(v) {
  CA.w = v;
  let pd = calcPed();
  let container = document.getElementById('calcResultContainer');
  if (container) {
    container.innerHTML = getCalcResHTML(pd);
  }
}

function renderHome() {
  return `
    <div style="text-align:center;padding:2rem 1rem;">
      <div style="font-size:56px;margin-bottom:15px;text-shadow:0 0 20px rgba(239,68,68,0.4);">❤️‍🩹</div>
      <h1 style="font-size:26px;font-weight:800;color:#fff;margin-bottom:15px;letter-spacing:0.02em;">OMSZ Újraélesztés</h1>
      <p style="font-size:15px;color:#d1d5db;margin-bottom:30px;line-height:1.6;">
        A hivatalos prehospitális eljárásrend alapján (a legújabb ERC 2025 frissítésekkel integrálva) készült 100%-os pontosságú webalkalmazás. Tartalmazza az összes <b>felnőtt és gyermek (BLS/ALS)</b> protokollt, a <b>speciális körülményeket (4H-4T)</b>, és a <b>szimulációs gyakorlatokat</b>.
      </p>
      
      <div style="display:flex;flex-direction:column;gap:12px;">
        <button class="btn btn-g" onclick="go('guide')" style="padding:16px;font-size:16px;box-shadow:0 4px 6px rgba(0,0,0,0.3);">📖 Eljárásrend Olvasása</button>
        <button class="btn btn-r" onclick="go('sim')" style="padding:16px;font-size:16px;box-shadow:0 4px 6px rgba(0,0,0,0.3);">🚑 Interaktív Szimulációk</button>
        <button class="btn" style="background:#1f2937;border-color:#374151;padding:16px;font-size:16px;" onclick="go('calc')">🧮 Gyermek Kalkulátor</button>
      </div>
      
      <div style="margin-top:40px;padding:15px;background:#262626;border-radius:12px;border:1px solid #3f3f3f;text-align:left;">
        <div style="font-size:12px;font-weight:700;color:#5eead4;margin-bottom:5px;text-transform:uppercase;">💡 Tipp: Interaktív Szótár</div>
        <div style="font-size:13px;color:#9ca3af;line-height:1.5;">Az eljárásrendben szereplő szaggatottan aláhúzott zöld szavakra (pl. <span class="dict-word" onclick="shD('rosc')">ROSC</span>, <span class="dict-word" onclick="shD('hypoxia')">hypoxia</span>) kattintva részletes magyarázatot kapsz a felugró ablakban!</div>
      </div>
    </div>
  `;
}

function renderGuide() {
  let html = `<h2 style="font-size:22px;font-weight:800;color:#5eead4;">📖 Eljárásrend Fejezetek</h2>`;
  if(!CHID) {
    GUIDES.forEach(g => {
      html += `
        <button class="card-btn" onclick="go('guide', '${g.id}')">
          <div style="font-size:16px;font-weight:700;color:#f3f4f6;display:flex;justify-content:space-between;align-items:center;">
            <span>${g.t}</span>
            <span style="color:#ef4444;font-size:20px;">›</span>
          </div>
        </button>
      `;
    });
  } else {
    let g = GUIDES.find(x => x.id === CHID);
    html += `
      <button class="btn" style="margin-bottom:15px;background:transparent;border-color:#4b5563;color:#9ca3af;padding:8px 12px;" onclick="go('guide')">‹ Vissza a fejezetekhez</button>
      <div class="card" style="background:#1f2937;border-color:#374151;">
        <h2 style="color:#fff;margin-bottom:20px;border-bottom:2px solid #3f3f3f;padding-bottom:10px;font-size:20px;">${g.t}</h2>
        <div style="font-size:14.5px;line-height:1.7;">
          ${g.txt}
        </div>
      </div>
    `;
  }
  return html;
}

function renderSim() {
  if(!SI.id){
    let html = `
      <h2 style="font-size:22px;font-weight:800;color:#5eead4;">🚑 Interaktív Szimulációk</h2>
      <p style="font-size:14px;color:#9ca3af;margin-bottom:1rem;line-height:1.5;">Oldd meg a pontosan 10 lépéses, minden részletre kiterjedő valósághű szituációkat a B és B+ mentőápolói kompetenciaszinteknek megfelelően!</p>
    `;
    SIM_DATA.forEach(s => {
      html += `
        <button class="card-btn" onclick="startSim(${s.id})" style="padding:1.2rem;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
            <div style="font-size:15px;font-weight:700;color:#f3f4f6;padding-right:10px;line-height:1.3;">${s.title}</div>
            <span class="tag ${s.tag}">${s.diff}</span>
          </div>
          <div style="font-size:13px;color:#9ca3af;line-height:1.5;">${s.desc}</div>
        </button>
      `;
    });
    return html;
  }
  
  let sim = SIM_DATA.find(s => s.id === SI.id);
  
  // EREDMÉNY KÉPERNYŐ
  if(SI.fin){
    let correct = SI.hist.filter(h => sim.steps[h.step].ok === h.oi).length;
    let pct = Math.round((correct / sim.steps.length) * 100);
    let html = `
      <h2 style="font-size:20px;font-weight:800;margin-bottom:1rem;color:#fff;">${sim.title} - Eredmény</h2>
      <div style="background:#064e3b;border:1px solid #059669;border-radius:12px;padding:2rem;text-align:center;margin-bottom:1rem;box-shadow:inset 0 0 15px rgba(0,0,0,0.3);">
        <div style="font-size:48px;font-weight:800;color:#34d399;text-shadow:2px 2px 4px rgba(0,0,0,0.5);">${correct} / ${sim.steps.length}</div>
        <div style="font-size:16px;color:#a7f3d0;font-weight:700;margin-top:5px;">Sikeres helyzetfelismerés (${pct}%)</div>
      </div>
      
      <div class="card" style="background:#172554;border-color:#1e3a8a;padding:1.5rem;">
        <h3 style="color:#60a5fa;font-size:16px;margin-top:0;margin-bottom:12px;border-bottom:1px solid #1e3a8a;padding-bottom:8px;">Részletes Eset Összefoglaló:</h3>
        <p style="font-size:14px;color:#bfdbfe;line-height:1.7;">${sim.summary}</p>
      </div>
      
      <button class="btn btn-r btn-fw" style="padding:14px;font-size:16px;" onclick="resetSim()">Vissza az esetekhez</button>
    `;
    return html;
  }
  
  // SZIMULÁCIÓ FOLYAMATBAN
  let step = sim.steps[SI.step];
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;">
      <div style="font-size:14px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em;">Lépés ${SI.step + 1} / ${sim.steps.length}</div>
      <span class="tag ${sim.tag}">${sim.diff} szint</span>
    </div>
    
    <div class="prog"><div class="progb" style="width:${((SI.step+1)/sim.steps.length)*100}%;background:#ef4444;"></div></div>
    
    <div class="card" style="background:#1f2937;border-color:#374151;border-left:4px solid #ef4444;padding:1.2rem;">
      <p style="font-size:16px;font-weight:600;color:#fff;line-height:1.5;margin:0;">${step.q}</p>
    </div>
  `;
  
  step.opts.forEach((opt, i) => {
    let cls = 'opt';
    if(SI.chosen !== null) {
      if(i === step.ok) cls += ' opt-ok';
      else if(i === SI.chosen && i !== step.ok) cls += ' opt-no';
    }
    html += `<button class="${cls}" ${SI.chosen === null ? `onclick="chooseSim(${i})"` : ''}>${opt}</button>`;
  });
  
  if(SI.chosen !== null) {
    let isOk = SI.chosen === step.ok;
    html += `
      <div class="al ${isOk ? 'al-s' : 'al-d'}" style="margin-top:15px;padding:15px;font-size:14.5px;">
        <strong style="font-size:16px;display:block;margin-bottom:5px;">${isOk ? '✅ Helyes Döntés!' : '❌ Helytelen Döntés!'}</strong> 
        ${step.fb}
      </div>
      <button class="btn btn-fw" style="background:#3b82f6;color:#fff;border:none;padding:14px;font-size:16px;margin-top:10px;" onclick="nextSim()">
        ${SI.step < sim.steps.length - 1 ? 'Következő lépés →' : 'Eredmény és Összefoglaló megtekintése'}
      </button>
    `;
  }
  
  return html;
}

// Globális Navigáció
window.go = function(s, id) { SCR = s; CHID = id || null; render(); };
window.startSim = function(id) { SI = {id: id, step: 0, chosen: null, hist: [], fin: false}; render(); };
window.chooseSim = function(i) { if(SI.chosen !== null) return; SI.chosen = i; SI.hist.push({step: SI.step, oi: i}); render(); };
window.nextSim = function() {
  let sim = SIM_DATA.find(s => s.id === SI.id);
  if(SI.step < sim.steps.length - 1) { SI.step++; SI.chosen = null; }
  else { SI.fin = true; }
  render();
};
window.resetSim = function() { SI = {id: null, step: 0, chosen: null, hist: [], fin: false}; render(); };

// Fő Render Függvény
function render() {
  let c = document.getElementById('ct');
  c.innerHTML = '';
  
  if (SCR === 'home') c.innerHTML = renderHome();
  else if (SCR === 'guide') c.innerHTML = renderGuide();
  else if (SCR === 'sim') c.innerHTML = renderSim();
  else if (SCR === 'calc') c.innerHTML = renderCalc();
  
  let tabs = ['home', 'guide', 'sim', 'calc'];
  let active = SCR;
  document.querySelectorAll('.nb').forEach((b, i) => {
    b.classList.toggle('act', tabs[i] === active);
  });
  window.scrollTo(0, 0);
}

// Inicializálás
render();
</script>
</body>
</html>
