{sit:'A beteg eszméleténél van, járóképes, de nagyon gyenge. Milyen kötelező vizsgálattal kezded a betegfelmérést?',opts:[{tx:'Részletes fizikális vizsgálat a has betapintásával.',ok:false,fb:'Hibás! A sürgősségi szemlélet szisztematikus ABCDE-t követel.'},{tx:'Szisztematikus ABCDE vizsgálat és vitális paraméterek mérése.',ok:true,fb:'Helyes! Minden esetben az ABCDE a kiindulópont.'},{tx:'Csak egy gyors vérnyomásmérés elegendő, mivel B szinten vagy.',ok:false,fb:'Hibás! B szinten is kötelező a teljes paraméter-ellenőrzés.'}]},
{sit:'Az ABCDE során a beteg paraméterei határértéken mozognak, de jelenleg hemodinamikailag stabil. Azonban az EKG-n (monitoron) és a panaszok alapján bizonytalan vagy a megfelelő célkórház (SBO vs. speciális centrum) és a segélykocsi (ALS) kérésének indokoltságában. Mit teszel?',opts:[{tx:'Rögtön beviszem a legközelebbi kórházba, a B szint nem tehet mást.',ok:false,fb:'Hibás! Lehet, hogy magasabb szintű transzport vagy spec. centrum kell.'},{tx:'Döntéstámogatásért a javasolt telefonos konzultációhoz fordulok (+36 80 205 025).',ok:true,fb:'Helyes! A transzport megkezdésének és a segélykocsi hívásának mérlegelésében a konzultáció minden szinten javasolt.'},{tx:'Felhívom a mentésirányítást és rájuk bízom a szakmai döntést.',ok:false,fb:'Hibás! A szakmai döntéstámogatás a konzultáns feladata, az ICS a logisztikát végzi.'}]},
{sit:'Mikor kezdeményezed a hívást?',opts:[{tx:'Még mielőtt befejezném az ABCDE-t, hogy ne veszítsek időt.',ok:false,fb:'Hibás! Az információk nélkül a konzultáns nem tud érdemben segíteni.'},{tx:'Az ABCDE-vizsgálat és a kezdeti állapotstabilizáció elvégzése után.',ok:true,fb:'Helyes! A hívást ez utánra kell időzíteni az eljárásrend szerint.'},{tx:'Már a mentőautóban, útban a kórház felé.',ok:false,fb:'Hibás! A célkórház eldöntéséhez és a segélykocsi kérdéséhez még a helyszínen kell hívni.'}]},
{sit:'Tárcsázod a zöld számot. Mit kérsz a társadtól (mentőgépkocsivezetőtől) a beszélgetés alatt?',opts:[{tx:'Hogy állítsa le a mentőt és jöjjön be ő is hallgatni a hívást.',ok:false,fb:'Hibás! Az időveszteség elkerülendő.'},{tx:'Hogy delegált párhuzamos feladatként felügyelje a beteget, végezzen oxigénterápiát vagy készítse elő a hordágyat.',ok:true,fb:'Helyes! A párhuzamos feladatvégzés javasolt a telefonhívás alatt.'},{tx:'Semmit, neki kint kell várnia a kocsiban.',ok:false,fb:'Hibás! Hasznos munkaerő a beteg mellett.'}]},
{sit:'A telefon hosszú másodpercekig kicseng, látszólag senki sem veszi fel. Mi a helyes reakció?',opts:[{tx:'Azonnal bontom a vonalat, biztos rossz számot hívtam.',ok:false,fb:'Hibás! A rendszer technikai sajátosságai miatt ez gyakori.'},{tx:'Tudom, hogy a technikai megoldás miatt a "kicsengési idő" megnyúlhat, így várok, nem bontom a vonalat.',ok:true,fb:'Helyes! A hívás csak a 2-3. csengés után jelenik meg a konzultánsnál, türelmesnek kell lenni.'},{tx:'Hívom az 112-t panasszal.',ok:false,fb:'Hibás! Szigorúan tilos és értelmetlen.'}]},
{sit:'A konzultáns beleszól. Milyen kommunikációs rendszert használsz az adatok átadására?',opts:[{tx:'Hosszú, részletes elbeszélést a beteg élettörténetéről.',ok:false,fb:'Hibás! A hívás 1-2 percnél ne tartson tovább.'},{tx:'Az ISBAR rendszert, strukturáltan és lényegretörően.',ok:true,fb:'Helyes! Az ISBAR minimalizálja az információvesztést és áttekinthető.'},{tx:'Csak a gép által mért adatokat diktálom be.',ok:false,fb:'Hibás! A beteg panaszai és státusza is kell.'}]},
{sit:'Az "Assessment" fázisban milyen paramétereket KÖTELEZŐ közölnöd a konzultánssal?',opts:[{tx:'A légzésszámot, SpO2-t, vérnyomást, pulzust és a GCS/vércukor/pupilla hármast.',ok:true,fb:'Helyes! Ezek a légúti, keringési és idegrendszeri fenyegetettség alapvető (kötelezően megadandó) adatai.'},{tx:'Csak a vérnyomást és a GCS-t.',ok:false,fb:'Hibás! Hiányos adat.'},{tx:'A beteg pontos címét és TAJ számát.',ok:false,fb:'Hibás! A szakmai konzultációhoz ezek nem szükségesek.'}]},
{sit:'A konzultáns egyetért abban, hogy a beteg állapota miatt érdemes a speciális centrumba (ami 40 percre van) menni, és javasolja a segélykocsi (ALS) riasztását a transzporthoz. Van azonban szabad SBO 10 percre is. Ki hozza meg a VÉGSŐ döntést a betegellátásról/teendőkről?',opts:[{tx:'A telefonos konzultáns szava szent, az utasítás.',ok:false,fb:'Hibás! A konzultáns döntéstámogató, a felelősség nem az övé.'},{tx:'Véleménykülönbség és helyszíni megítélés alapján a döntést a helyszíni ellátó (én) hozom meg.',ok:true,fb:'Helyes! A végső döntés mindig a helyszíni egységvezetőnél marad.'},{tx:'A beteg családja dönt.',ok:false,fb:'Hibás! A szakmai döntés a mentőegységé.'}]},
{sit:'Úgy döntesz, elfogadod a tanácsot: megvárod az ALS egységet a stabil beteggel, majd irány a centrum. A dokumentáció során mit kell feljegyezned az esetlapon az eljárásrend alapján?',opts:[{tx:'Semmit, a konzultáns elektronikusan úgyis mindent rögzít.',ok:false,fb:'Hibás! A mentőegységnek is dokumentálnia kell.'},{tx:'Kizárólag a kapott tanácsot.',ok:false,fb:'Hibás! A tényt kell rögzíteni.'},{tx:'A telefonos konzultáció tényét, valamint a hozott döntést.',ok:true,fb:'Helyes! A mentőegység vezetőjének jelölnie kell a konzultáció tényét a dokumentációban.'}]}
],summary:'Részletes Összefoglaló (Sim 1 - B kompetencia): A helyszínbiztonság és az egyéni védőfelszerelés felvétele után az ellátó azonnal elvégezte az ABCDE vizsgálatot. A bizonytalan státusz és a szállítás/segélykocsi indokoltsága miatt B szinten is erősen javasolt a telefonos konzultáció igénybevétele. Ezt a kezdeti stabilizáció UTÁN tette meg a +36 80 205 025-ös számon. A hívás alatt párhuzamos feladatokat delegált társának. A megnyúló kicsengési időt türelemmel kivárta (technikai sajátosság). A konzultánssal az ISBAR rendszert alkalmazva, lényegretörően osztotta meg a kötelező vitális paramétereket (légzésszám, SpO2, vérnyomás, pulzus, GCS, vércukor, pupillák). Miután a konzultáns javaslatot tett az ALS kérésére és centrum szállításra, az ellátó – tudván, hogy a végső döntés az övé – elfogadta azt, és gondoskodott a konzultáció tényének esetlapon történő dokumentálásáról.'},

{id:2,title:'2. Szimuláció: Technikai hiba és gyógyszerelési dilemma (B+ kompetencia)',diff:'B+ kompetencia',desc:'A beteg egy 55 éves férfi, súlyos, préselő mellkasi fájdalommal (ACS gyanú). B+ kompetenciájú ellátó vagy (véna, O2, ASA, stb.). Felmerül a protokoll szerinti PCI centrumba történő szállítás, de a beteg állapota hirtelen instabillá válik.',steps:[
{sit:'A helyszínre érés és az azonnali ABCDE vizsgálat megtörtént. A beteg sápadt, verejtékes, mellkasi fájdalma erős. B+ szinten vénát biztosítasz és elindítod a monitort. Mit diktál a szakmai protokoll (ACS) a szállítás irányáról?',opts:[{tx:'Irány a legközelebbi sebészet.',ok:false,fb:'Hibás! A szívinfarktus gyanú kardiológiai ellátást igényel.'},{tx:'A megfelelő feltételek esetén a beteget PCI centrumba kell szállítani.',ok:true,fb:'Helyes! ACS esetén a PCI centrum a végleges ellátóhely.'},{tx:'Mindig a legközelebbi SBO-ra kell menni.',ok:false,fb:'Hibás! A célzott ellátás (PCI) jobb esélyeket ad.'}]},
{sit:'A beteg vérnyomása a B+ szintű beavatkozások (ASA, Nitrát) ellenére hirtelen esni kezd (80/50 Hgmm), a beteg pre-shockos állapotba kerül. Bizonytalan vagy abban, hogy várj-e a helyszínen az ALS egységre, vagy azonnal indulj a közelebbi SBO-ra. Mit javasol az eljárásrend ilyen helyzetben?',opts:[{tx:'Azonnali indulást konzultáció nélkül.',ok:false,fb:'Hibás! A komplex helyzetben javasolt a támogatás.'},{tx:'Mivel szakmai kérdés és transzport megkezdésének mérlegelése merült fel, a telefonos konzultáció javasolt.',ok:true,fb:'Helyes! A B+ szinten ez a klasszikus "javasolt" konzultációs eset.'},{tx:'Hívjam a helyi ügyeletet.',ok:false,fb:'Hibás! Az OMSZ belső rendszere a telefonos konzultáns.'}]},
{sit:'Delegálod a beteg szoros monitorozását a társadnak, majd tárcsázod a konzultációs zöld számot. 1 perc csöngés után a vonal megszakad. Újratárcsázod, de "A hívott szám jelenleg nem elérhető" üzenetet kapsz. Mi a teendőd?',opts:[{tx:'A beteg mellett ülök és várom, hogy a hálózat megjavuljon.',ok:false,fb:'Hibás! Az instabil beteg azonnali döntést igényel.'},{tx:'Technikai elérhetetlenség esetén önállóan döntök a kompetenciám alapján (pl. segélykocsit sürgetek az ICS-nél és infúziót indítok).',ok:true,fb:'Helyes! Az eljárásrend világosan kimondja, hogy ilyenkor a helyszíni vezető dönt önállóan.'},{tx:'Mivel nem érem el a szakorvost, jogosult vagyok magasabb (orvosi) szintű gyógyszereket is beadni.',ok:false,fb:'Hibás! Csak a SAJÁT kompetenciádnak megfelelően dönthetsz.'}]},
{sit:'Döntesz: gyors folyadékpótlást kezdesz (B+ kompetencia) és azonnal indultok a közelebbi SBO felé (mivel a PCI messze van, a beteg pedig shockos). A beteg a kocsiban javulni kezd. Mi a kötelező teendőd a konzultánssal kapcsolatban?',opts:[{tx:'Semmi, megoldottam a problémát egyedül.',ok:false,fb:'Hibás! A sikertelen hívás tényét utólag is jelenteni kell.'},{tx:'A legkorábbi lehetséges időpontban (amint van térerő / a beteg stabilabb) újra megkísérlem az értesítését a helyzetről.',ok:true,fb:'Helyes! Az eljárásrend szerint az utólagos értesítés legkorábban kötelező.'},{tx:'Panaszt írok az informatikának.',ok:false,fb:'Hibás! Első a szakmai egyeztetés pótlása.'}]},
{sit:'Sikerül elérned a konzultánst útközben. Bemutatkozol az ISBAR alapján (Identification) és elmondod a helyzetet (Situation, Background). Mit kérhet a konzultáns az "Assessment" során a szívpanaszos betegnél?',opts:[{tx:'Hogy olvassam fel a beteg összes eddigi zárójelentését.',ok:false,fb:'Hibás! Ez túl hosszú lenne (1-2 perces limit).'},{tx:'A GCS, vérnyomás, pulzus és SpO2 mellett a tachycardia/bradycardia esetén ritmuselemzést (EKG paraméterek).',ok:true,fb:'Helyes! Az EKG/ritmus elemzése kardiológiai esetben kötelező bediktálandó információ.'},{tx:'Hogy küldjek át egy fotót faxon.',ok:false,fb:'Hibás! Szóbeli ISBAR átadás zajlik.'}]},
{sit:'A konzultáns egyetért a döntéseddel (közelebbi SBO a shock miatt). Javasol egy specifikus gyógyszerdózist, ami Eltér A Szokásos B+ Protokolltól (pl. nagyobb volumenű bólus vagy eltérő oxigén target). Elfogadhatod-e az eltérést?',opts:[{tx:'Nem, soha nem térhetünk el az írott protokolltól, még orvosi utasításra sem.',ok:false,fb:'Hibás! Az eljárásrend engedi az eltérést.'},{tx:'Igen, ha a telefonos konzultánssal egyetértésben történik, szakmailag indokolt esetben az eltérés lehetséges és védelmet biztosít.',ok:true,fb:'Helyes! A konzultáns jóváhagyásával a protokoll módosítható a beteg érdekében.'},{tx:'Igen, de csak ha papíron aláírja.',ok:false,fb:'Hibás! A hangrögzített hívás és az esetlap dokumentációja elegendő.'}]},
{sit:'A módosított terápia hatására a beteg végleg stabilizálódik az SBO-ig. Átadod a beteget az SBO orvosának. Az eljárásrend alapján érdemes-e MÉG EGYSZER hívni a konzultánst?',opts:[{tx:'Nem, felesleges fecsegés.',ok:false,fb:'Hibás! A lezárás hasznos lehet.'},{tx:'Igen, a visszahívás a konzultációt igénylő beteg átadása után mindenképpen javasolt.',ok:true,fb:'Helyes! A betegút lezárása és az eredmény visszacsatolása minőségfejlesztési célokat szolgál.'},{tx:'Csak ha a beteg meghalt.',ok:false,fb:'Hibás! Minden esetben javasolt.'}]},
{sit:'Hogyan zárod a dokumentációt az esetlapon az eseményekkel kapcsolatban?',opts:[{tx:'Csak kipipálom, hogy volt konzultáció.',ok:false,fb:'Hibás! Részletesebb dokumentáció kell az eltérés és a hiba miatt.'},{tx:'Dokumentálom a sikertelen elérés tényét, az önállóan hozott döntést, a későbbi sikeres konzultációt és a konzultánssal egyetértésben hozott eltérést az eljárásrendtől.',ok:true,fb:'Helyes! Minden adminisztratív kötelezettséget kipipálsz ezzel, védve magad és a beteget.'},{tx:'A konzultáns majd megírja helyettem az egészet.',ok:false,fb:'Hibás! A helyszíni ellátó is kötelezett a dokumentációra.'}]},
{sit:'A konzultáns részéről is történik dokumentáció?',opts:[{tx:'Nem, az ő dolga csak a beszéd.',ok:false,fb:'Hibás! Neki is van kötelezettsége.'},{tx:'Igen, a konzultációt követően a saját elektronikus felületén le kell jegyeznie a hívást, ami az esetlap részét képezi.',ok:true,fb:'Helyes! A konzultáns elektronikusan dokumentál, és ez összekapcsolódik az esetlappal.'},{tx:'Kizárólag hanganyag marad, írásos nem.',ok:false,fb:'Hibás! Írásos lejegyzés is történik.'}]},
{sit:'Végső tanulságként: Ha a konzultáns azt javasolta volna, hogy a pre-shockos beteget mindenképpen vigyétek a 40 percre lévő PCI-be, de te a klinikai kép alapján életveszélyesnek ítélted a hosszú utat, kinek lett volna igaza a helyszínen?',opts:[{tx:'Mindig a konzultánsnak, ő az okosabb.',ok:false,fb:'Hibás! A távoli orvos nem látja a beteget.'},{tx:'Véleménykülönbség esetén mindig a helyszíni ellátó (jelen esetben te) dönt, és az ellátás az ő belátása szerint folyik tovább.',ok:true,fb:'Helyes! A helyszíni ellátó felelőssége és joga a végső döntés meghozatala, ő látja a beteget.'},{tx:'A mentésirányítónak kellett volna igazságot tenni.',ok:false,fb:'Hibás! Szakmai kérdésben a helyszíni ellátóé a végső szó.'}]}
],summary:'Részletes Összefoglaló (Sim 2 - B+ kompetencia): A kritikus ACS gyanús beteg instabillá válása (pre-shock) egyértelmű indikáció volt a transzport irányának (SBO vs PCI) mérlegelésére, ami B+ szinten "javasolt" konzultációs eset. A hívás indításakor felmerült technikai hiba (megszakadt/elérhetetlen vonal) esetén az eljárásrend utasítása szerint az egységvezető azonnal önálló döntést hozott a saját B+ kompetenciájának keretein belül (folyadék, irány az SBO). Később, a kapcsolat helyreállásakor pótolta az értesítést. Az ISBAR szerinti információátadásnál a szívbeteg miatt kiemelt jelentőségű volt a ritmuselemzés (EKG) bejelentése. A konzultáns javaslatára történt protokoll-eltérést a közös konszenzus tette legálissá és biztonságossá. A beteg átadása után megtörtént a javasolt lezáró visszahívás. Végül az esetlapon pontosan dokumentálásra került a sikertelen elérés ténye, a hozott önálló döntés és az eljárásrendtől való (egyeztetett) eltérés is.'}
];

// Render blocks for Chapters
function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+h(b.tx)+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+h(i)+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr"><span style="flex-shrink:0;font-weight:700;">✓</span><div>'+h(i)+'</div></div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+h(b.tx)+'</div>';
  if(b.tp==='note') return '<div class="note">'+h(b.tx)+'</div>';
  return '';
}

// ── SCREENS ────────────────────────────────────────────────────────
function renderHome(){
return '<div style="margin-bottom:1.25rem"><div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Országos Mentőszolgálat</div>'+
'<h1 style="font-size:22px;font-weight:700;color:#f3f4f6;margin-bottom:4px;line-height:1.2">Prehospitális Telefonos Konzultáció</h1>'+
'<div style="font-size:13px;color:#9ca3af">Szabványos Eljárásrend v2.1 · 2024.12.20.</div></div>'+
'<div class="g2" style="margin-bottom:.75rem">'+
[['chapters','📚','Eljárásrend','A teljes protokoll pontjai'],['flash','🃏','Flashkártyák','Gyors ellenőrző kártyák'],['quiz','❓','Kvíz','Tudáspróba 15 kérdéssel'],['sim','🚑','Szimuláció','Interaktív klinikai esetek']].map(([id,ic,lb,d])=>
'<button onclick="go(\''+id+'\')" class="home-mod"><div class="home-mod-icon">'+ic+'</div><div class="home-mod-title">'+lb+'</div><div class="home-mod-desc">'+d+'</div></button>').join('')+
'</div>'+
'<div class="card" style="background:#064e3b;border-color:#065f46"><div style="font-size:12px;color:#9ca3af"><b>Vonatkozik:</b> Az OMSZ valamennyi kivonuló dolgozójára és mentésirányítójára, kompetenciaszintnek megfelelően.</div></div>';
}

function renderChapters(){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Eljárásrend</h2>'+
CDATA.map(c=>'<button class="ch-row" onclick="go(\'chapter\',\''+c.id+'\')">'+
'<div style="width:38px;height:38px;border-radius:9px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.icon+'</div>'+
'<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#f3f4f6">'+h(c.title)+'</div><div style="font-size:11px;color:#9ca3af">'+c.secs.length+' szakasz</div></div>'+
'<div style="color:#9ca3af;font-size:18px">›</div></button>').join('');
}

function renderChapter(id){
var c=CDATA.find(x=>x.id===id);if(!c)return '';
return '<button onclick="go(\'chapters\')" style="background:none;border:none;cursor:pointer;color:#14b8a6;font-size:14px;margin-bottom:.75rem;padding:0;font-family:inherit;font-weight:600">‹ Vissza</button>'+
'<div style="display:flex;align-items:center;gap:10px;margin-bottom:.85rem"><div style="width:42px;height:42px;border-radius:10px;background:'+c.acc+'20;display:flex;align-items:center;justify-content:center;font-size:21px">'+c.icon+'</div>'+
'<h2 style="font-size:18px;font-weight:700;color:#f3f4f6;margin:0">'+h(c.title)+'</h2></div>'+
c.secs.map(s=>'<div class="card"><h3 style="font-size:14px;font-weight:700;color:'+c.acc+';margin-bottom:.65rem;padding-bottom:.5rem;border-bottom:1px solid #3f3f3f">'+h(s.t)+'</h3>'+s.bk.map(b=>rb(b)).join('')+'</div>').join('');
}

function renderFlash(){
var cats=['Összes',...[...new Set(CARDS.map(c=>c.cat))]];
var filtered=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);
var card=filtered[Math.min(FC.idx,filtered.length-1)];
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Flashkártyák</h2>'+
'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">'+cats.map(c=>'<button onclick="setCat(\''+h(c).replace(/"/g, '&quot;')+'\')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid '+(FC.cat===c?'#14b8a6':'#3f3f3f')+';background:'+(FC.cat===c?'#14b8a6':'#2a2a2a')+';color:'+(FC.cat===c?'#111827':'#9ca3af')+';cursor:pointer;font-family:inherit">'+h(c)+'</button>').join('')+'</div>'+
'<div style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:.65rem">'+(FC.idx+1)+' / '+filtered.length+' • Kattints a kártyára a fordításhoz</div>'+
'<div class="flip'+(FC.flip?' on':'')+'" onclick="flipCard()">'+
(FC.flip?
'<div style="font-size:10px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Válasz</div>'+
'<div style="font-size:13px;color:#d1d5db;line-height:1.7;text-align:left;white-space:pre-line">'+h(card.b)+'</div>':
'<div style="font-size:10px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">'+h(card.cat)+'</div>'+
'<div style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5">'+h(card.f)+'</div>'+
'<div style="font-size:11px;color:#9ca3af;margin-top:14px">Kattints a válaszért →</div>')+
'</div>'+
'<div class="btn-row"><button class="btn btn-fw" onclick="navCard(-1)">‹ Előző</button><button class="btn btn-v btn-fw" onclick="flipCard()">Fordít</button><button class="btn btn-fw" onclick="navCard(1)">Következő ›</button></div>';
}

function renderQuiz(){
if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+h(QUIZ[a.qi].q)+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+h(QUIZ[a.qi].opts[a.pi])+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])+'</div><div style="font-size:11px;color:#9ca3af">'+h(QUIZ[a.qi].exp)+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="resetQuiz()">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(q.q)+'</p></div>'+
q.opts.map((opt,i)=>{var cls='opt';if(QZ.sel!==null){if(i===q.ok)cls+=' opt-ok';else if(i===QZ.sel&&i!==q.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'">'+h(opt)+'</button>';}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+h(q.exp)+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="startSim('+s.id+')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+h(s.title)+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+h(s.desc)+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+h(sim.title)+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+h(sim.summary)+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+h(st.sit)+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+h(opt.tx)+'</div><div style="font-size:11px;color:#9ca3af">'+h(opt.fb)+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="resetSim()" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+h(sim.title)+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+h(sim.desc)+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+h(step.sit)+'</p></div>'+
step.opts.map((opt,i)=>{var cls='opt';if(SI.chosen!==null){if(opt.ok)cls+=' opt-ok';else if(i===SI.chosen&&!opt.ok)cls+=' opt-no';}return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'">'+h(opt.tx)+'</button>';}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+h(step.opts[SI.chosen].fb)+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function render(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
var tabs=['home','chapters','flash','quiz','sim'];
var active=SCR==='chapter'?'chapters':SCR;
document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
window.go=function(s,id){SCR=s;CHID=id||null;render();};
window.setCat=function(c){
  var safeC = String(c).replace(/&quot;/g, '"');
  FC.cat=safeC; FC.idx=0; FC.flip=false; render();
};
window.flipCard=function(){FC.flip=!FC.flip;render();};
window.navCard=function(d){var f=FC.cat==='Összes'?CARDS:CARDS.filter(c=>c.cat===FC.cat);FC.flip=false;FC.idx=(FC.idx+d+f.length)%f.length;render();};
window.pickQ=function(i){if(QZ.sel!==null)return;QZ.sel=i;var ok=i===QUIZ[QZ.idx].ok;if(ok)QZ.score++;QZ.ans.push({qi:QZ.idx,pi:i,ok:ok});render();};
window.nextQ=function(){if(QZ.idx<QUIZ.length-1){QZ.idx++;QZ.sel=null;}else QZ.done=true;render();};
window.resetQuiz=function(){QZ={idx:0,sel:null,score:0,done:false,ans:[]};render();};
window.startSim=function(id){SI.id=id;SI.step=0;SI.chosen=null;SI.hist=[];SI.fin=false;render();};
window.chooseSim=function(i){if(SI.chosen!==null)return;SI.chosen=i;SI.hist.push({step:SI.step,oi:i});render();};
window.nextSim=function(){var sim=SIMS.find(s=>s.id===SI.id);if(SI.step<sim.steps.length-1){SI.step++;SI.chosen=null;}else SI.fin=true;render();};
window.resetSim=function(){SI={id:null,step:0,chosen:null,hist:[],fin:false};render();};

// START
render();
</script>
</body>
</html>
