  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

const rb = b => {
  if (b.tp === 'sub') return `<div class="sub">${h(b.tx)}</div>`;
  if (b.tp === 'bl') return `<ul class="bl">${b.items.map(i => `<li>${h(i)}</li>`).join('')}</ul>`;
  if (b.tp === 'al') return `<div class="al al-${b.lv}">${h(b.tx)}</div>`;
  if (b.tp === 'ftable') {
    return `<div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Kritérium / Tünet</th><th>Részletek</th></tr></thead>
        <tbody>
          ${b.rows.map(r => `<tr><td style="font-weight:600;color:var(--text-main)">${h(r.s)}</td><td style="color:#e5e7eb">${h(r.m)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }
  return '';
};

const renderQuiz = () => {
  if (QZ.done) {
    const pct = Math.round((QZ.score / QUIZ.length) * 100);
    const good = pct >= 80;
    return `
      <h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:var(--text-main)">Kvíz eredmény</h2>
      <div style="background:${good ? 'var(--success-bg)' : 'var(--warning-bg)'};border:1px solid ${good ? 'var(--success-border)' : 'var(--warning-border)'};border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">
        <div style="font-size:42px;font-weight:700;color:${good ? 'var(--success-text)' : 'var(--warning-text)'}">${QZ.score}/${QUIZ.length}</div>
        <div style="font-size:15px;font-weight:600;color:${good ? 'var(--success-text)' : 'var(--warning-text)'}">${pct}% – ${good ? 'Kiváló!' : 'Ismételd át az anyagot.'}</div>
      </div>
      ${QZ.ans.filter(a => !a.ok).length ? `
        <h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:var(--text-main)">Helytelen válaszok:</h3>
        ${QZ.ans.filter(a => !a.ok).map(a => `
          <div class="card" style="margin-bottom:8px">
            <div style="font-size:12px;font-weight:600;color:var(--text-main);margin-bottom:4px">${h(QUIZ[a.qi].q)}</div>
            <div style="font-size:11px;color:var(--danger-text);margin-bottom:2px">✗ Válasz: ${h(QUIZ[a.qi].opts[a.pi])}</div>
            <div style="font-size:11px;color:var(--success-text);margin-bottom:5px">✓ Helyes: ${h(QUIZ[a.qi].opts[QUIZ[a.qi].ok])}</div>
            <div style="font-size:11px;color:var(--text-muted)">${h(QUIZ[a.qi].exp)}</div>
          </div>
        `).join('')}
      ` : `<div class="al al-s">Tökéletes eredmény!</div>`}
      <button class="btn btn-g btn-fw" style="margin-top:10px" onclick="resetQuiz()">Újra</button>
    `;
  }
  
  const q = QUIZ[QZ.idx];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
      <h2 style="font-size:19px;font-weight:700;margin:0;color:var(--text-main)">Kvíz</h2>
      <span style="font-size:12px;color:var(--text-muted)">${QZ.idx + 1}/${QUIZ.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((QZ.idx + 1) / QUIZ.length) * 100}%;background:var(--accent)"></div></div>

      let cls = 'opt';
      if (QZ.sel !== null) {
        if (i === q.ok) cls += ' opt-ok';
        else if (i === QZ.sel && i !== q.ok) cls += ' opt-no';
      }
      return `<button class="${cls}" ${QZ.sel === null ? `onclick="pickQ(${i})"` : ''}>${h(opt)}</button>`;
    }).join('')}

      <div class="al al-i" style="margin-bottom:.75rem">${h(q.exp)}</div>
      <button class="btn btn-g btn-fw" onclick="nextQ()">${QZ.idx < QUIZ.length - 1 ? 'Következő kérdés →' : 'Eredmények'}</button>

const renderSim = () => {
  if (!SI.id) {
    return `
      <h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:var(--text-main)">Szimulációs Esetek</h2>
      <div class="al al-w">Ezek a szimulációk KIZÁRÓLAG a Mentőápolói (B és B+) kompetenciákat tesztelik az eljárrend alapján.</div>
      ${SIMS.map(s => `
        <button class="card-btn" onclick="startSim(${s.id})">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <div style="font-size:14px;font-weight:700;color:var(--text-main)">${h(s.title)}</div>
            <span class="tag ${s.diff === 'B kompetencia' ? 'tag-g' : 'tag-y'}">${s.diff}</span>
          </div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:5px">${h(s.desc)}</div>
          <div style="font-size:11px;color:var(--text-muted)">${s.steps.length} lépéses eset</div>
        </button>
      `).join('')}
    `;
  }
  
  const sim = SIMS.find(s => s.id === SI.id);
  
  if (SI.fin) {
    const correct = SI.hist.filter(h => sim.steps[h.step].opts[h.oi].ok).length;
    return `
      <h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:var(--text-main)">${h(sim.title)} - Eredmény</h2>
      <div style="background:var(--success-bg);border:1px solid var(--success-border);border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">
        <div style="font-size:36px;font-weight:700;color:var(--success-text)">${correct}/${sim.steps.length}</div>
        <div style="font-size:13px;color:var(--success-text);font-weight:600">helyes döntés</div>
      </div>
      <div class="al al-i"><strong>Részletes Összefoglaló:</strong><br><br>${h(sim.summary)}</div>
      ${SI.hist.map((hh, i) => {
        const st = sim.steps[hh.step];
        const opt = st.opts[hh.oi];
        return `
          <div class="card" style="margin-bottom:7px">
            <div style="font-size:12px;font-weight:600;color:var(--text-main);margin-bottom:3px">${i + 1}. ${h(st.sit)}</div>
            <div style="font-size:11px;margin-bottom:3px;color:${opt.ok ? 'var(--success-text)' : 'var(--danger-text)'}">${opt.ok ? '✓' : '✗'} ${h(opt.tx)}</div>
            <div style="font-size:11px;color:var(--text-muted)">${h(opt.fb)}</div>
          </div>
        `;
      }).join('')}
      <button class="btn btn-g btn-fw" style="margin-top:10px" onclick="resetSim()">Vissza az esetekhez</button>
    `;
  }
  
  const step = sim.steps[SI.step];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
      <div style="font-size:15px;font-weight:700;color:var(--text-main)">${h(sim.title)}</div>
      <span style="font-size:12px;color:var(--text-muted)">${SI.step + 1}/${sim.steps.length}</span>
    </div>
    <div class="prog"><div class="progb" style="width:${((SI.step + 1) / sim.steps.length) * 100}%;background:var(--accent)"></div></div>
    ${SI.step === 0 ? `<div class="al al-i">${h(sim.desc)}</div>` : ''}
    <div class="card" style="margin-bottom:.75rem;background:#262626">
      <p style="font-size:14px;font-weight:600;color:var(--text-main);line-height:1.5;margin:0">${h(step.sit)}</p>
    </div>
    ${step.opts.map((opt, i) => {
      let cls = 'opt';
      if (SI.chosen !== null) {
        if (opt.ok) cls += ' opt-ok';
        else if (i === SI.chosen && !opt.ok) cls += ' opt-no';
      }
      return `<button class="${cls}" ${SI.chosen === null ? `onclick="chooseSim(${i})"` : ''}>${h(opt.tx)}</button>`;
    }).join('')}
    ${SI.chosen !== null ? `
      <div class="al ${step.opts[SI.chosen].ok ? 'al-s' : 'al-d'}">${h(step.opts[SI.chosen].fb)}</div>
      <button class="btn btn-g btn-fw" onclick="nextSim()">${SI.step < sim.steps.length - 1 ? 'Következő helyzet →' : 'Összefoglaló megtekintése'}</button>
    ` : ''}
  `;
};

const doCalc = () => {
  let w = parseFloat(CA.weight);
  let a = parseFloat(CA.age);
  if (isNaN(w) || w <= 0) w = 70;
  if (isNaN(a) || a <= 0) a = 30;
  
  let adrDose = w * 0.01;
  let adrMax = 0;
  let adrMaxStr = '';
  
  if (a > 12) { adrMax = 0.5; adrMaxStr = '0,5 mg (0,5 ml)'; }
  else if (a >= 6) { adrMax = 0.3; adrMaxStr = '0,3 mg (0,3 ml)'; }
  else { adrMax = 0.15; adrMaxStr = '0,15 mg (0,15 ml)'; }
  
  let finalAdr = Math.min(adrDose, adrMax).toFixed(2);
  
  let fluidBolus = a > 17 ? '250 ml (Felnőtt)' : (10 * w).toFixed(0) + ' ml (Gyermek 10 ml/ttkg)';
  let fluidMax = (30 * w).toFixed(0) + ' ml';
  
  return {
    adr: finalAdr + ' mg (' + finalAdr + ' ml)',
    adrM: adrMaxStr,
    fb: fluidBolus,
    fm: fluidMax
  };
};

const rc = c => `
  <div class="card" style="border-color:var(--info-border)">
    <h3 style="font-size:14px;font-weight:700;color:var(--info-text);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--info-border)">Adrenalin (IM) - Tonogen 1 mg/ml</h3>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:3px">Kiszámolt IM dózis (0,01 mg/ttkg alapján):</div>
    <div style="font-size:24px;font-weight:700;color:var(--success-text);margin-bottom:10px">${c.adr}</div>
    <div style="font-size:12px;color:var(--danger-text)">Maximális adható dózis ezen életkorban: ${c.adrM}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:5px">Mentőápoló max. 1x ismételheti (5-15 perc múlva)! Combba (IM) adandó.</div>
  </div>
  <div class="card" style="border-color:var(--info-border)">
    <h3 style="font-size:14px;font-weight:700;color:var(--info-text);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--info-border)">Krisztalloid Folyadék (IV)</h3>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:3px">Javasolt bólus mérete túlnyomással:</div>
    <div style="font-size:20px;font-weight:700;color:var(--success-text);margin-bottom:10px">${c.fb}</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:3px">Mentőápoló által adható MAXIMÁLIS összdózis (30 ml/ttkg):</div>
    <div style="font-size:20px;font-weight:700;color:var(--danger-text);margin-bottom:10px">${c.fm}</div>
  </div>
  <div class="card" style="border-color:var(--info-border)">
    <h3 style="font-size:14px;font-weight:700;color:var(--info-text);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--info-border)">Hörgőtágító Limitek (Mentőápoló B+)</h3>
    <div style="font-size:12px;color:#d1d5db;margin-bottom:5px"><b>Szalbutamol (Ventolin):</b> Max. 2 expozíció</div>
    <div style="font-size:12px;color:#d1d5db"><b>Berodual nebulizátorban:</b> Max. 20 csepp (5 ml NaCl-dal)</div>
  </div>
`;

const renderCalc = () => {
  const c = doCalc();
  return `
    <h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:var(--text-main)">Mentőápolói Terápia Kalkulátor</h2>
    <div class="al al-i">A számítások a B+ kompetenciára és a hivatalos protokollban szereplő dózisokra vonatkoznak. Adja meg pontosan az adatokat!</div>
    <div class="card">
      <div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px">Beteg életkora (év):</div>
      <input type="number" min="0" step="1" value="${CA.age}" oninput="CA.age=this.value;upC()">
      <div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;margin-top:10px">Beteg testsúlya (kg):</div>
      <input type="number" min="1" step="1" value="${CA.weight}" oninput="CA.weight=this.value;upC()">
    </div>
    <div id="calcRes">${rc(c)}</div>
  `;
};

window.upC = () => {
  const res = document.getElementById('calcRes');
  if (res) res.innerHTML = rc(doCalc());
};

const render = () => {
  const c = document.getElementById('ct');
  c.innerHTML = '';
  if (SCR === 'home') c.innerHTML = renderHome();
  else if (SCR === 'chapters') c.innerHTML = renderChapters();
  else if (SCR === 'chapter') c.innerHTML = renderChapter(CHID);
  else if (SCR === 'flash') c.innerHTML = renderFlash();
  else if (SCR === 'quiz') c.innerHTML = renderQuiz();
  else if (SCR === 'sim') c.innerHTML = renderSim();
  else if (SCR === 'calc') c.innerHTML = renderCalc();
  
  const tabs = ['home', 'chapters', 'flash', 'quiz', 'sim', 'calc'];
  const active = SCR === 'chapter' ? 'chapters' : SCR;
  document.querySelectorAll('.nb').forEach((b, i) => {
    b.classList.toggle('act', tabs[i] === active);
  });
  window.scrollTo(0, 0);
};

window.go = (s, id) => { SCR = s; CHID = id || null; render(); };
window.setCat = c => { FC.cat = c; FC.idx = 0; FC.flip = false; render(); };
window.flipCard = () => { FC.flip = !FC.flip; render(); };
window.navCard = d => {
  const f = FC.cat === 'Összes' ? CARDS : CARDS.filter(c => c.cat === FC.cat);
  FC.flip = false;
  FC.idx = (FC.idx + d + f.length) % f.length;
  render();
};
window.pickQ = i => {
  if (QZ.sel !== null) return;
  QZ.sel = i;
  const ok = i === QUIZ[QZ.idx].ok;
  if (ok) QZ.score++;
  QZ.ans.push({ qi: QZ.idx, pi: i, ok });
  render();
};
window.nextQ = () => {
  if (QZ.idx < QUIZ.length - 1) { QZ.idx++; QZ.sel = null; }
  else QZ.done = true;
  render();
};
window.resetQuiz = () => { QZ = { idx: 0, sel: null, score: 0, done: false, ans: [] }; render(); };
window.startSim = id => { SI.id = id; SI.step = 0; SI.chosen = null; SI.hist = []; SI.fin = false; render(); };
window.chooseSim = i => {
  if (SI.chosen !== null) return;
  SI.chosen = i;
  SI.hist.push({ step: SI.step, oi: i });
  render();
};
window.nextSim = () => {
  const sim = SIMS.find(s => s.id === SI.id);
  if (SI.step < sim.steps.length - 1) { SI.step++; SI.chosen = null; }
  else SI.fin = true;
  render();
};
window.resetSim = () => { SI = { id: null, step: 0, chosen: null, hist: [], fin: false }; render(); };

// Initialization
render();
</script>
</body>
</html>
