<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSZ – A tüdőembólia prehospitális ellátása</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#121212;color:#e5e7eb;min-height:100vh;padding-bottom:20px;}
.app{max-width:680px;margin:0 auto;background:#1e1e1e;min-height:100vh;box-shadow:0 0 20px rgba(0,0,0,.4);position:relative;}

/* NAV (Felülre rögzítve a minta szerint) */
.nav{display:flex;background:#242424;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.3);overflow-x:auto;}
.nb{flex:1;min-width:60px;padding:9px 2px 6px;background:none;border:none;border-top:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s;}
.nb.act{border-top-color:#14b8a6;}
.ni{font-size:16px;}
.nl{font-size:9px;color:#9ca3af;font-weight:400;}
.nb.act .nl{color:#14b8a6;font-weight:600;}

/* CONTENT */
.ct{padding:1rem;}
.card{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.card-btn{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.85rem 1rem;margin-bottom:7px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.card-btn:hover{background:#333;}

/* ALERTS */
.al{border-radius:8px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:13px;line-height:1.6;white-space:pre-line;}
.al-d{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;}
.al-w{background:#451a03;color:#fde68a;border:1px solid #78350f;}
.al-i{background:#172554;color:#bfdbfe;border:1px solid #1e3a8a;}
.al-s{background:#064e3b;color:#bbf7d0;border:1px solid #065f46;}
.note{font-size:12px;color:#9ca3af;padding:.5rem .75rem;background:#262626;border-radius:8px;margin-bottom:.5rem;line-height:1.5;border:1px solid #333;}
.sub{font-size:13px;font-weight:600;color:#d1d5db;margin:.75rem 0 .35rem;}

ul.bl{margin:0 0 .5rem;padding-left:1.3rem;}
ul.bl li{font-size:13px;color:#d1d5db;line-height:1.65;margin-bottom:.2rem;}
.kr{display:flex;gap:8px;align-items:flex-start;padding:.5rem .75rem;background:#064e3b20;border-radius:8px;margin-bottom:5px;font-size:13px;color:#d1d5db;line-height:1.5;border-left:3px solid #14b8a6;}

.step-wrap{display:flex;gap:10px;margin-bottom:10px;}
.step-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#14b8a6;color:#111827;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.step-body{flex:1;background:#262626;border-radius:8px;padding:.5rem .75rem;}
.step-t{font-size:13px;font-weight:600;color:#f3f4f6;margin-bottom:.2rem;}
.step-x{font-size:12px;color:#9ca3af;line-height:1.6;white-space:pre-line;}

/* TABLES */
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{padding:5px 8px;text-align:left;font-weight:600;color:#9ca3af;border-bottom:1px solid #3f3f3f;background:#262626;}
table.tbl td{padding:5px 8px;border-bottom:1px solid #333;vertical-align:top;color:#d1d5db;}
.tbl-wrap{overflow-x:auto;margin-bottom:.75rem;}

/* PROGRESS */
.prog{height:4px;background:#333;border-radius:2px;margin-bottom:1rem;}
.progb{height:4px;border-radius:2px;transition:width .3s;}

/* BUTTONS */
.btn{padding:.55rem 1rem;border:1px solid #4b5563;border-radius:8px;background:#2a2a2a;cursor:pointer;font-size:13px;color:#e5e7eb;font-family:inherit;transition:all .15s;}
.btn:hover{background:#374151;}
.btn-g{background:#0d9488;color:#fff;border-color:#0d9488;}
.btn-g:hover{background:#0f766e;}
.btn-r{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn-v{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.btn-fw{width:100%;display:block;text-align:center;padding:.75rem;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;text-align:center;}

/* QUIZ/SIM OPTIONS */
.opt{width:100%;display:block;padding:.7rem 1rem;margin-bottom:7px;border:1px solid #3f3f3f;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:#d1d5db;background:#2a2a2a;font-family:inherit;line-height:1.45;transition:background .1s;}
.opt:hover{background:#374151;}
.opt-ok{background:#064e3b!important;border-color:#059669!important;color:#ecfdf5!important;cursor:default!important;}
.opt-no{background:#7f1d1d!important;border-color:#b91c1c!important;color:#fef2f2!important;cursor:default!important;}

/* FLIP CARD */
.flip{border:2px solid #3f3f3f;border-radius:12px;padding:1.5rem;min-height:175px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:.75rem;background:#262626;}
.flip.on{border-color:#a78bfa;}

/* GRID & RESULTS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.res-box{border-radius:12px;padding:1rem;text-align:center;margin-top:.75rem;}

/* CHECKBOXES & TAGS */
input[type=checkbox]{width:18px;height:18px;accent-color:#14b8a6;cursor:pointer;}
.chk-row{display:flex;align-items:flex-start;gap:12px;padding:10px;background:#262626;border:1px solid #3f3f3f;border-radius:8px;margin-bottom:6px;cursor:pointer;}
.chk-row:hover{background:#333;}
.chk-text{font-size:13px;color:#d1d5db;line-height:1.4;flex:1;}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.tag-g{background:#064e3b;color:#ecfdf5;}
.tag-y{background:#78350f;color:#fef3c7;}

/* HOME / CH LIST */
.home-mod{background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;color:#e5e7eb;}
.home-mod:hover{background:#333;border-color:#4b5563;transform:translateY(-1px);}
.home-mod-icon{font-size:26px;margin-bottom:6px;}
.home-mod-title{font-size:14px;font-weight:600;color:#f3f4f6;margin-bottom:2px;}
.home-mod-desc{font-size:11px;color:#9ca3af;}
.ch-row{display:flex;align-items:center;gap:10px;background:#2a2a2a;border:1px solid #3f3f3f;border-radius:12px;padding:.75rem 1rem;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:background .15s;color:#e5e7eb;}
.ch-row:hover{background:#333;}

/* DICTIONARY POPUP */
.fw{color:#f59e0b;cursor:pointer;border-bottom:1px dashed #f59e0b;transition: color 0.2s;}
.fw:hover {color:#fbbf24;}
#pwOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:none;align-items:center;justify-content:center;padding:1rem;}
.pw-box{background:#1e1e1e;border:1px solid #3f3f3f;border-radius:12px;padding:1.5rem;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
.pw-title{font-size:18px;font-weight:700;color:#14b8a6;margin-bottom:10px;text-transform:uppercase;}
.pw-text{font-size:14px;color:#d1d5db;line-height:1.6;margin-bottom:20px;}
.pw-btn{width:100%;background:#374151;color:#fff;padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s;}
.pw-btn:hover{background:#4b5563;}
</style>
</head>
<body>
<div class="app">
<nav class="nav" id="nav">
<button class="nb act" onclick="go('home')"><span class="ni">🏠</span><span class="nl">Főoldal</span></button>
<button class="nb" onclick="go('chapters')"><span class="ni">📚</span><span class="nl">Eljárásrend</span></button>
<button class="nb" onclick="go('flash')"><span class="ni">🃏</span><span class="nl">Kártyák</span></button>
<button class="nb" onclick="go('quiz')"><span class="ni">❓</span><span class="nl">Kvíz</span></button>
<button class="nb" onclick="go('sim')"><span class="ni">🚑</span><span class="nl">Szimuláció</span></button>
<button class="nb" onclick="go('calc')"><span class="ni">🧮</span><span class="nl">Score-ok</span></button>
</nav>
<div class="ct" id="ct"></div>
</div>

<div id="pwOverlay" onclick="if(event.target===this) clPw()">
    <div class="pw-box">
        <div class="pw-title" id="pwTitle"></div>
        <div class="pw-text" id="pwText"></div>
        <button class="pw-btn" onclick="clPw()">Bezárás</button>
    </div>
</div>

<script>
var SCR='home',CHID=null;

function w(word, text){
    return '<span class="fw" onclick="shPw(\''+word+'\')">'+(text||word)+'</span>';
}

window.shPw = function(word){
    document.getElementById('pwTitle').textContent = word.toUpperCase();
    document.getElementById('pwText').textContent = DICT[word] || 'Nincs megadva jelentés.';
    document.getElementById('pwOverlay').style.display = 'flex';
};
window.clPw = function(){
    document.getElementById('pwOverlay').style.display = 'none';
};

var CDATA=[
{id:'celok',title:'I-II. Célok és Bevezetés',icon:'🎯',acc:'#14b8a6',secs:[
{t:'I. Célok',bk:[{tp:'bl',items:['A tüdőembólia tüneteinek, előfordulási valószínűségének, helyszíni ellátásának és optimális betegútjának áttekintése.','Az OMSZ kivonuló dolgozóinak és mentésirányítóinak munkájának egységesítése.','Bizonyíték nélküli, haszontalan vagy káros beavatkozások mellőzése.']}]},

window.upWells = function() {
    var score = 0;
    document.querySelectorAll('.chk-wells').forEach(cb => {
        if(cb.checked) score += 1;
    });
    var resBox = document.getElementById('resWells');
    if(!resBox) return;
    
    var col = score >= 2 ? '#fca5a5' : '#4ade80';
    var lbl = score >= 2 ? 'PE valószínű' : 'PE nem valószínű';
    
    resBox.innerHTML = `
        <div style="font-size:32px;font-weight:700;color:${col}">${score} pont</div>
        <div style="font-size:16px;font-weight:600;color:${col}">${lbl}</div>
        <div style="font-size:12px;color:#9ca3af;margin-top:5px">Egyszerűsített Wells Score (Minden IGEN 1 pont)</div>
    `;
    resBox.style.borderColor = col + '50';
};

window.upPerc = function() {
    var percFail = false;
    document.querySelectorAll('.chk-perc').forEach(cb => {
        if(cb.checked) percFail = true;
    });
    var resBox = document.getElementById('resPerc');
    if(!resBox) return;
    
    var col = percFail ? '#fca5a5' : '#4ade80';
    var lbl = percFail ? 'PERC Pozitív (Nem zárható ki)' : 'PERC Negatív (PE < 1%)';
    
    resBox.innerHTML = `
        <div style="font-size:24px;font-weight:700;color:${col}">${lbl}</div>
        <div style="font-size:12px;color:#9ca3af;margin-top:5px">Ha minden állítás NEM, a PE esélye < 1% (feltéve ha a Wells score 0-1 közötti).</div>
    `;
    resBox.style.borderColor = col + '50';
};

window.upsPesi = function() {
    var score = 0;
    document.querySelectorAll('.chk-spesi').forEach(cb => {
        if(cb.checked) score += 1;
    });
    var resBox = document.getElementById('ressPesi');
    if(!resBox) return;
    
    var col = score >= 1 ? '#fca5a5' : '#4ade80';
    var lbl = score >= 1 ? 'Magas kockázat' : 'Alacsony kockázat';
    
    resBox.innerHTML = `
        <div style="font-size:32px;font-weight:700;color:${col}">${score} pont</div>
        <div style="font-size:16px;font-weight:600;color:${col}">${lbl}</div>
        <div style="font-size:12px;color:#9ca3af;margin-top:5px">Már 1 pont is magas kockázatot jelent!</div>
    `;
    resBox.style.borderColor = col + '50';
};

window.pickQ = function(i) {
    if (QZ.sel !== null) return;
    QZ.sel = i;
    var ok = (i === QUIZ[QZ.idx].ok);
    if (ok) QZ.score++;
    QZ.ans.push({qi: QZ.idx, pi: i, ok: ok});
    render();
};

window.nextQ = function() {
    if (QZ.idx < QUIZ.length - 1) {
        QZ.idx++;
        QZ.sel = null;
    } else {
        QZ.done = true;
    }
    render();
};

window.chooseSim = function(i) {
    if (SI.chosen !== null) return;
    SI.chosen = i;
    SI.hist.push({step: SI.step, oi: i});
    render();
};

window.nextSim = function() {
    var sim = SIMS.find(s => s.id === SI.id);
    if (SI.step < sim.steps.length - 1) {
        SI.step++;
        SI.chosen = null;
    } else {
        SI.fin = true;
    }
    render();
};

function rb(b){
  if(b.tp==='sub') return '<div class="sub">'+b.tx+'</div>';
  if(b.tp==='bl') return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if(b.tp==='kr') return '<div>'+b.items.map(i=>'<div class="kr">✓ &nbsp;'+i+'</div>').join('')+'</div>';
  if(b.tp==='al') return '<div class="al al-'+b.lv+'">'+b.tx+'</div>';
  if(b.tp==='note') return '<div class="note">'+b.tx+'</div>';
  if(b.tp==='steps') return b.items.map(s=>'<div class="step-wrap"><div class="step-num">'+s.n+'</div><div class="step-body"><div class="step-t">'+s.t+'</div><div class="step-x">'+s.x+'</div></div></div>').join('');
  return '';
}

if(QZ.done){
var pct=Math.round(QZ.score/QUIZ.length*100),good=pct>=80;
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kvíz eredmény</h2>'+
'<div style="background:'+(good?'#064e3b':'#451a03')+';border:1px solid '+(good?'#065f46':'#78350f')+';border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:42px;font-weight:700;color:'+(good?'#4ade80':'#fde68a')+'">'+QZ.score+'/'+QUIZ.length+'</div>'+
'<div style="font-size:15px;font-weight:600;color:'+(good?'#4ade80':'#fde68a')+'">'+pct+'% – '+(good?'Kiváló!':'Van még hova fejlődni.')+'</div></div>'+
(QZ.ans.filter(a=>!a.ok).length?'<h3 style="font-size:14px;font-weight:700;margin-bottom:.65rem;color:#f3f4f6">Helytelen válaszok:</h3>'+
QZ.ans.filter(a=>!a.ok).map(a=>'<div class="card" style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:4px">'+QUIZ[a.qi].q+'</div><div style="font-size:11px;color:#fca5a5;margin-bottom:2px">✗ Válasz: '+QUIZ[a.qi].opts[a.pi]+'</div><div style="font-size:11px;color:#4ade80;margin-bottom:5px">✓ Helyes: '+QUIZ[a.qi].opts[QUIZ[a.qi].ok]+'</div><div style="font-size:11px;color:#9ca3af">'+QUIZ[a.qi].exp+'</div></div>').join(''):'<div class="al al-s">Tökéletes eredmény! Mindent helyesen válaszoltál meg.</div>')+
'<button class="btn btn-g btn-fw" onclick="QZ={idx:0,sel:null,score:0,done:false,ans:[]}; render();">Újra</button>';
}
var q=QUIZ[QZ.idx];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><h2 style="font-size:19px;font-weight:700;margin:0;color:#f3f4f6">Kvíz</h2><span style="font-size:12px;color:#9ca3af">'+(QZ.idx+1)+'/'+QUIZ.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((QZ.idx+1)/QUIZ.length*100)+'%;background:#14b8a6"></div></div>'+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+q.q+'</p></div>'+
q.opts.map((opt,i)=>{
    var cls='opt';
    if(QZ.sel!==null){
        if(i===q.ok) cls+=' opt-ok';
        else if(i===QZ.sel && i!==q.ok) cls+=' opt-no';
    }
    return '<button class="'+cls+'" '+(QZ.sel===null?'onclick="pickQ('+i+')"':'')+'>'+opt+'</button>';
}).join('')+
(QZ.sel!==null?'<div class="al al-i" style="margin-bottom:.75rem">'+q.exp+'</div><button class="btn btn-g btn-fw" onclick="nextQ()">'+(QZ.idx<QUIZ.length-1?'Következő kérdés →':'Eredmények')+'</button>':'');
}

function renderSim(){
if(!SI.id){
return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Szimulációs esetek</h2>'+
SIMS.map(s=>'<button class="card-btn" onclick="SI.id='+s.id+'; SI.step=0; SI.chosen=null; SI.hist=[]; SI.fin=false; render();"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:14px;font-weight:700;color:#f3f4f6">'+s.title+'</div>'+
'<span class="tag '+(s.diff==='B kompetencia'?'tag-g':'tag-y')+'">'+s.diff+'</span></div>'+
'<div style="font-size:12px;color:#9ca3af;margin-bottom:5px">'+s.desc+'</div>'+
'<div style="font-size:11px;color:#9ca3af">'+s.steps.length+' döntési pont</div></button>').join('');
}
var sim=SIMS.find(s=>s.id===SI.id);
if(SI.fin){
var correct=SI.hist.filter(h=>sim.steps[h.step].opts[h.oi].ok).length;
return '<h2 style="font-size:18px;font-weight:700;margin-bottom:.5rem;color:#f3f4f6">'+sim.title+' - Eredmény</h2>'+
'<div style="background:#064e3b;border:1px solid #065f46;border-radius:12px;padding:1rem;text-align:center;margin-bottom:.75rem">'+
'<div style="font-size:36px;font-weight:700;color:#4ade80">'+correct+'/'+sim.steps.length+'</div>'+
'<div style="font-size:13px;color:#4ade80;font-weight:600">helyes döntés</div></div>'+
'<div class="al al-i"><strong>Összefoglaló:</strong><br>'+sim.summary+'</div>'+
SI.hist.map((hh,i)=>{var st=sim.steps[hh.step];var opt=st.opts[hh.oi];return '<div class="card" style="margin-bottom:7px"><div style="font-size:12px;font-weight:600;color:#f3f4f6;margin-bottom:3px">'+(i+1)+'. '+st.sit+'</div><div style="font-size:11px;margin-bottom:3px;color:'+(opt.ok?'#4ade80':'#fca5a5')+'">'+(opt.ok?'✓':'✗')+' '+opt.tx+'</div><div style="font-size:11px;color:#9ca3af">'+opt.fb+'</div></div>';}).join('')+
'<button class="btn btn-r btn-fw" onclick="SI={id:null,step:0,chosen:null,hist:[],fin:false}; render();" style="margin-top:10px">Vissza az esetekhez</button>';
}
var step=sim.steps[SI.step];
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem"><div style="font-size:15px;font-weight:700;color:#f3f4f6">'+sim.title+'</div><span style="font-size:12px;color:#9ca3af">'+(SI.step+1)+'/'+sim.steps.length+'</span></div>'+
'<div class="prog"><div class="progb" style="width:'+((SI.step+1)/sim.steps.length*100)+'%;background:#ef4444"></div></div>'+
(SI.step===0?'<div class="al al-i">'+sim.desc+'</div>':'')+
'<div class="card" style="margin-bottom:.75rem;background:#262626"><p style="font-size:14px;font-weight:600;color:#f3f4f6;line-height:1.5;margin:0">'+step.sit+'</p></div>'+
step.opts.map((opt,i)=>{
    var cls='opt';
    if(SI.chosen!==null){
        if(opt.ok) cls+=' opt-ok';
        else if(i===SI.chosen && !opt.ok) cls+=' opt-no';
    }
    return '<button class="'+cls+'" '+(SI.chosen===null?'onclick="chooseSim('+i+')"':'')+'>'+opt.tx+'</button>';
}).join('')+
(SI.chosen!==null?'<div class="al '+(step.opts[SI.chosen].ok?'al-s':'al-d')+'">'+step.opts[SI.chosen].fb+'</div><button class="btn btn-r btn-fw" onclick="nextSim()">'+(SI.step<sim.steps.length-1?'Következő helyzet →':'Összefoglaló')+'</button>':'');
}

function renderCalc(){
function tabBtn(id,lbl){return '<button onclick="CA.tab=\''+id+'\'; render(); setTimeout('+ (id==='wells'?'upWells':id==='perc'?'upPerc':'upsPesi') +', 10);" style="flex:1;padding:.5rem;border:1px solid '+(CA.tab===id?'#14b8a6':'#3f3f3f')+';border-radius:8px;background:'+(CA.tab===id?'#14b8a6':'#2a2a2a')+';color:'+(CA.tab===id?'#111827':'#d1d5db')+';cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">'+lbl+'</button>';}

var content = '';
if(CA.tab==='wells'){
    var items = [
        ['Mélyvénás thrombosis klinikai jelei észlelhetők','DVT jelei jelen vannak'],
        ['Nincs valószínűbb diagnózis, mint a PE','Nincs jobb alternatív diagnózis'],
        ['Tachycardia (szívfrekvencia > 100/perc)','HR tartósan 100 felett'],
        ['Immobilizáció (≥ 3 nap) vagy sebészet 4 héten belül','Tartós fekvés / Műtét'],
        ['Korábbi tüdőembólia vagy DVT az anamnézisben','Már volt PE vagy DVT-je'],
        ['Vérköpés','Hemoptysis'],
        ['Malignus betegség','Aktív tumoros betegség']
    ];
    content = '<div class="card" style="margin-top:10px;"><div style="font-size:13px;color:#9ca3af;margin-bottom:10px;">Egyszerűsített Wells-score. Jelöld be az IGAZ állításokat:</div>' + 
    items.map((x, i) => `<label class="chk-row" for="w${i}"><input type="checkbox" id="w${i}" class="chk-wells" onchange="upWells()"> <div class="chk-text"><b>${x[0]}</b><br><small style="color:#9ca3af">${x[1]}</small></div></label>`).join('') + 
    '<div id="resWells" class="res-box" style="background:#262626;border:1px solid #3f3f3f"><div style="font-size:32px;font-weight:700;color:#9ca3af">0 pont</div><div style="font-size:16px;font-weight:600;color:#9ca3af">PE nem valószínű</div><div style="font-size:12px;color:#9ca3af;margin-top:5px">Egyszerűsített Wells Score (Minden IGEN 1 pont)</div></div></div>';
}
else if(CA.tab==='perc'){
    var items = [
        ['50 éves vagy idősebb beteg'],
        ['Szívfrekvencia ≥ 100/perc'],
        ['Oxigéntelítettség ≤ 94%'],
        ['Korábbi tüdőembólia vagy mélyvénás thrombosis'],
        ['Az elmúlt 4 hétben elszenvedett, altatásos műtét / trauma'],
        ['Vérköpés'],
        ['Ösztrogéntartalmú gyógyszer szedése'],
        ['Egyoldali (alsó) végtagduzzanat']
    ];
    content = '<div class="card" style="margin-top:10px;"><div style="font-size:13px;color:#9ca3af;margin-bottom:10px;">PERC Kizárási Kritériumok. Jelöld be, ami IGAZ (ha van ilyen):</div>' + 
    items.map((x, i) => `<label class="chk-row" for="p${i}"><input type="checkbox" id="p${i}" class="chk-perc" onchange="upPerc()"> <div class="chk-text"><b>${x[0]}</b></div></label>`).join('') + 
    '<div id="resPerc" class="res-box" style="background:#064e3b;border:1px solid #4ade8050"><div style="font-size:24px;font-weight:700;color:#4ade80">PERC Negatív (PE < 1%)</div><div style="font-size:12px;color:#9ca3af;margin-top:5px">Ha minden állítás NEM, a PE esélye < 1% (feltéve ha a Wells score 0-1 közötti).</div></div></div>';
}
else {
    var items = [
        ['Kor > 80 év'],
        ['Tumoros betegség az anamnézisben'],
        ['Krónikus cardiopulmonalis betegség'],
        ['Pulzus ≥ 110/perc'],
        ['Szisztolés vérnyomás < 100 Hgmm'],
        ['Artériás oxigén szaturáció < 90%']
    ];
    content = '<div class="card" style="margin-top:10px;"><div style="font-size:13px;color:#9ca3af;margin-bottom:10px;">Egyszerűsített PESI (sPESI) Score. Jelöld be az IGAZ állításokat:</div>' + 
    items.map((x, i) => `<label class="chk-row" for="s${i}"><input type="checkbox" id="s${i}" class="chk-spesi" onchange="upsPesi()"> <div class="chk-text"><b>${x[0]}</b></div></label>`).join('') + 
    '<div id="ressPesi" class="res-box" style="background:#262626;border:1px solid #3f3f3f"><div style="font-size:32px;font-weight:700;color:#4ade80">0 pont</div><div style="font-size:16px;font-weight:600;color:#4ade80">Alacsony kockázat</div><div style="font-size:12px;color:#9ca3af;margin-top:5px">Már 1 pont is magas kockázatot jelent!</div></div></div>';
}

return '<h2 style="font-size:19px;font-weight:700;margin-bottom:.75rem;color:#f3f4f6">Kalkulátorok</h2>'+
'<div style="display:flex;gap:7px;margin-bottom:.75rem">'+tabBtn('wells','Wells-score')+tabBtn('perc','PERC')+tabBtn('spesi','sPESI')+'</div>' + content;
}

window.render = function(){
var c=document.getElementById('ct');c.innerHTML='';
if(SCR==='home')c.innerHTML=renderHome();
else if(SCR==='chapters')c.innerHTML=renderChapters();
else if(SCR==='chapter')c.innerHTML=renderChapter(CHID);
else if(SCR==='flash')c.innerHTML=renderFlash();
else if(SCR==='quiz')c.innerHTML=renderQuiz();
else if(SCR==='sim')c.innerHTML=renderSim();
else if(SCR==='calc')c.innerHTML=renderCalc();

// A tabs tömb igazítva az új menüsorrendhez
var tabs=['home','chapters','flash','quiz','sim','calc'];
var active=SCR==='chapter'?'chapters':SCR;

document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('act',tabs[i]===active);});
window.scrollTo(0,0);
};

window.go=function(s,id){SCR=s;CHID=id||null;render();};

render();
if(SCR === 'calc'){
    setTimeout(upWells, 50);
}
</script>
</body>
</html>
